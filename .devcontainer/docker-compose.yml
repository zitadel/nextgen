services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/nextgen:cached
    command: sleep infinity

  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextgen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nextgen_dev_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres-data:
