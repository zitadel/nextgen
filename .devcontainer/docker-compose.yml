services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/nextgen:cached
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: zitadel 
      POSTGRES_PASSWORD: zitadel
      POSTGRES_DB: nextgen
    volumes:
      - nextgen-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zitadel -d nextgen"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      PGADMIN_CONFIG_LOGIN_BANNER: "'Local development only'"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_CONFIG_AUTHENTICATION_SOURCES: "['webserver']"
      PGADMIN_CONFIG_WEBSERVER_AUTO_LOGIN: "True"
    ports:
      - "5050:80"
    volumes:
      - ..:/workspaces/nextgen:cached
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  nextgen-data:
  pgadmin-data:
