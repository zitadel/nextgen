x-cell: &cell
  build: .
  entrypoint: ["/usr/local/bin/cell"]
  restart: unless-stopped
  volumes:
    - cell-data:/data

services:
  platform:
    <<: *cell
    environment:
      CELL_URL: http://platform:8100
      CELL_LABEL: platform
      CELL_DISPLAY: Platform
      LISTEN_ADDR: :8100
      DATA_DIR: /data/platform
      IS_PARENT: "true"
    ports:
      - "8100:8100"

  eu-1:
    <<: *cell
    environment:
      CELL_URL: http://eu-1:8101
      CELL_LABEL: eu-1
      CELL_DISPLAY: "EU · Frankfurt"
      LISTEN_ADDR: :8101
      DATA_DIR: /data/eu-1
      IS_PARENT: "false"
    ports:
      - "8101:8101"

  eu-2:
    <<: *cell
    environment:
      CELL_URL: http://eu-2:8102
      CELL_LABEL: eu-2
      CELL_DISPLAY: "EU · Lisbon"
      LISTEN_ADDR: :8102
      DATA_DIR: /data/eu-2
      IS_PARENT: "false"
    ports:
      - "8102:8102"

  us-1:
    <<: *cell
    environment:
      CELL_URL: http://us-1:8103
      CELL_LABEL: us-1
      CELL_DISPLAY: "US · Iowa"
      LISTEN_ADDR: :8103
      DATA_DIR: /data/us-1
      IS_PARENT: "false"
    ports:
      - "8103:8103"

  us-2:
    <<: *cell
    environment:
      CELL_URL: http://us-2:8104
      CELL_LABEL: us-2
      CELL_DISPLAY: "US · San Francisco"
      LISTEN_ADDR: :8104
      DATA_DIR: /data/us-2
      IS_PARENT: "false"
    ports:
      - "8104:8104"

  spare:
    <<: *cell
    environment:
      CELL_URL: http://spare:8105
      CELL_LABEL: spare
      CELL_DISPLAY: Spare
      LISTEN_ADDR: :8105
      DATA_DIR: /data/spare
      IS_PARENT: "false"
    ports:
      - "8105:8105"

  bootstrap:
    <<: *cell
    entrypoint: ["/bin/bash", "-c", "/usr/local/bin/bootstrap-joins.sh && /usr/local/bin/bootstrap-projects.sh"]
    depends_on:
      - platform
      - eu-1
      - eu-2
      - us-1
      - us-2
    restart: "no"

  ui:
    <<: *cell
    entrypoint: ["/usr/local/bin/ui"]
    environment:
      LISTEN_ADDR: :3000
      CELLS: >-
        platform=http://platform:8100,
        eu-1=http://eu-1:8101,
        eu-2=http://eu-2:8102,
        us-1=http://us-1:8103,
        us-2=http://us-2:8104,
        spare=http://spare:8105
    ports:
      - "3000:3000"
    depends_on:
      - platform
      - eu-1
      - eu-2
      - us-1
      - us-2
      - spare
      - bootstrap

volumes:
  cell-data:
