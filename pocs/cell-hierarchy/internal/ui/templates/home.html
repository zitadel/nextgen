{{define "home"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{.Title}} · cell hierarchy</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root { --bg:#0f1419; --panel:#1a222c; --text:#e7ecf1; --muted:#8b9aab; --accent:#3d9cf0; --ok:#3ecf8e; --bad:#f07178; --stale:#6b7280; --border:#2a3542; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:ui-sans-serif,system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.45; }
    header { display:flex; gap:1rem; align-items:center; padding:0.75rem 1.25rem; border-bottom:1px solid var(--border); background:var(--panel); }
    header a { color:var(--muted); text-decoration:none; margin-right:0.75rem; }
    header a:hover { color:var(--accent); }
    main { padding:1.25rem; max-width:960px; margin:0 auto; }
    h1 { font-size:1.25rem; margin:0 0 1rem; }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:1rem; margin-bottom:1rem; }
    .muted { color:var(--muted); font-size:0.875rem; }
    .badge { display:inline-block; font-size:0.7rem; padding:0.1rem 0.4rem; border-radius:4px; border:1px solid var(--border); color:var(--muted); margin-left:0.35rem; }
    .badge.parent { color:var(--accent); border-color:var(--accent); }
    .dot { display:inline-block; width:0.55rem; height:0.55rem; border-radius:50%; margin-right:0.35rem; background:var(--ok); }
    .dot.stale { background:var(--stale); }
    .dot.down { background:var(--bad); }
    ul.tree { list-style:none; padding-left:1.1rem; margin:0.25rem 0; }
    ul.tree.root { padding-left:0; }
    li.node { margin:0.35rem 0; }
    code { font-size:0.8rem; color:var(--muted); }
  </style>
</head>
<body>
  <header>
    <strong>cell hierarchy</strong>
    <nav><a href="/">Tree</a><a href="/join">Join</a></nav>
  </header>
  <main>
    <h1>Cell tree</h1>
    <div id="tree" hx-get="/tree" hx-trigger="every 5s" hx-swap="innerHTML">
      {{template "tree" .}}
    </div>
  </main>
</body>
</html>
{{end}}
