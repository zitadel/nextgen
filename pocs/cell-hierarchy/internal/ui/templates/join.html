{{define "join"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{.Title}} · cell hierarchy</title>
  <style>
    :root { --bg:#0f1419; --panel:#1a222c; --text:#e7ecf1; --muted:#8b9aab; --accent:#3d9cf0; --ok:#3ecf8e; --bad:#f07178; --border:#2a3542; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:ui-sans-serif,system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.45; }
    header { display:flex; gap:1rem; align-items:center; padding:0.75rem 1.25rem; border-bottom:1px solid var(--border); background:var(--panel); }
    header a { color:var(--muted); text-decoration:none; margin-right:0.75rem; }
    main { padding:1.25rem; max-width:640px; margin:0 auto; }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:1rem; }
    .flash-ok { color:var(--ok); margin-bottom:0.75rem; }
    .flash-err { color:var(--bad); margin-bottom:0.75rem; }
    label { display:block; margin:0.5rem 0 0.25rem; color:var(--muted); font-size:0.875rem; }
    select, button { font:inherit; padding:0.45rem 0.6rem; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); width:100%; }
    button { background:var(--accent); border-color:var(--accent); color:#041018; font-weight:600; cursor:pointer; margin-top:0.75rem; }
    .muted { color:var(--muted); font-size:0.875rem; }
  </style>
</head>
<body>
  <header>
    <strong>cell hierarchy</strong>
    <nav><a href="/">Tree</a><a href="/join">Join</a><a href="/scenarios">Scenarios</a></nav>
  </header>
  <main>
    <h1>Join cell</h1>
    <div class="panel">
      {{if .Flash}}<div class="flash-ok">{{.Flash}}</div>{{end}}
      {{if .FlashErr}}<div class="flash-err">{{.FlashErr}}</div>{{end}}
      <p class="muted">Prepare an empty invite on the parent, then hand it to the unjoined child. The child completes with its own URL.</p>
      <form method="post" action="/join">
        <label for="parent_url">Parent (is_parent)</label>
        <select id="parent_url" name="parent_url" required>
          <option value="">Select parent…</option>
          {{range .Parents}}
          <option value="{{.URL}}">{{.Label}} — {{.URL}}</option>
          {{end}}
        </select>
        <label for="child_url">Unjoined cell</label>
        <select id="child_url" name="child_url" required>
          <option value="">Select cell…</option>
          {{range .UnjoinedO}}
          <option value="{{.URL}}">{{.Label}} — {{.URL}}</option>
          {{end}}
        </select>
        <button type="submit">Join</button>
      </form>
    </div>
  </main>
</body>
</html>
{{end}}
