projects:
  sources:
    server: "apps/server"
    workspace: "."
    release: "tools/release"
    cli: "apps/cli"
    cli-journey-e2e: "apps/cli-journey-e2e"
    console: "apps/console"
    console-e2e: "apps/console-e2e"
    docs: "apps/docs"
    demo-next: "apps/demo-next"
    demo-next-e2e: "apps/demo-next-e2e"
    demo-nuxt: "apps/demo-nuxt"
    demo-nuxt-e2e: "apps/demo-nuxt-e2e"
    login-ui: "apps/login-ui"
    mock-zitadel: "apps/mock-zitadel"
    api: "packages/api"
    api-mock: "packages/api-mock"
    config: "packages/config"
    components: "packages/components"
    design-tokens: "packages/design-tokens"
    sdk-angular: "packages/sdk-angular"
    sdk-core: "packages/sdk-core"
    sdk-next: "packages/sdk-next"
    sdk-nuxt: "packages/sdk-nuxt"
    sdk-qwik: "packages/sdk-qwik"
    sdk-react: "packages/sdk-react"
    sdk-solid: "packages/sdk-solid"
    sdk-svelte: "packages/sdk-svelte"
    sdk-vue: "packages/sdk-vue"
    shared-component-styles: "packages/shared-component-styles"
    testing: "packages/testing"
    storybook: "apps/storybook"
    ui-react: "packages/ui-react"

vcs:
  defaultBranch: "main"

pipeline:
  installDependencies: false

# Depot CI runners inject DEPOT_CACHE_TOKEN at launch; when the variable is
# absent (local dev, forks) moon disables remote caching and runs fully local.
remote:
  host: "grpcs://cache.depot.dev"
  auth:
    token: "DEPOT_CACHE_TOKEN"
  cache:
    # No compression: Depot's endpoint rejects zstd via capabilities and moon
    # would warn on every run.
    instanceName: "zitadel-nextgen"
    localReadOnly: true
    verifyIntegrity: true

telemetry: false
