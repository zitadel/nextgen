# Inherited task config for every `language: "typescript"` project. The
# filename is a label; the scoping is the inheritedBy condition below.
inheritedBy:
  language: "typescript"

# These are root-anchored workspace configs that project-local configs pull in
# at run time. They live outside every project root, so without this file no
# task input covers them and `moon ci` selects zero targets when one changes.
# Listing them per project would drift as projects are added; implicitInputs
# appends them to every task of every TypeScript project instead. Tasks that
# declare no `inputs` keep their default project-scoped `**/*`.
#
# The trade-off is deliberate breadth: a change to any file below re-runs all
# TypeScript tasks, including ones it cannot influence (for example lint after
# a tsconfig edit). These files change rarely; under-selection here previously
# let such changes land with zero CI coverage.
implicitInputs:
  # Moon's automatic config input only covers `.moon/*.yml`, not this
  # directory — without this self-reference, edits to scoped task configs are
  # themselves invisible to `moon ci` selection.
  - "/.moon/tasks/**/*.yml"
  # Extended by every {apps,packages}/*/tsconfig*.json.
  - "/tsconfig.base.json"
  # The shared Biome config that the inherited `lint` task below runs against;
  # a project-local biome.json (where present) extends it. Without this a
  # config change would leave every project's lint task cache-hit (and
  # unselected by `moon ci`), running stale rules.
  - "/biome.json"
  # Spread into every project's vitest config's `test` block. Without these a
  # change to the shared base would leave every project's test task cache-hit
  # (and unselected by `moon ci`), running stale config.
  - "/vitest.shared.mjs"
  - "/vitest.shared.d.mts"
  # The resolved dependency versions. Projects run on the system toolchain, so
  # moon hashes no package versions of its own; without these a dependency
  # bump (a lockfile or catalog change) would replay every typecheck, build
  # and test from the cache instead of running them against the new versions.
  - "/pnpm-lock.yaml"
  - "/pnpm-workspace.yaml"

tasks:
  # Single standardized linter + formatter for every TypeScript project: Biome
  # `check` (lint + format), run against the shared root biome.json. Biome is a
  # self-contained, single-file tool (no cross-package type resolution), so
  # unlike the previous oxlint/eslint tasks it needs no `api:build`/
  # `components:build` dependency edges. It is resolved via `pnpm exec` from the
  # workspace-root devDependency. Biome owns all JS/TS/JSX/TSX (lint + format);
  # the repo no longer uses Prettier. File types Biome cannot parse reliably
  # (CSS/Tailwind, Vue, Svelte, Markdown, data JSON) are excluded in biome.json
  # and are not auto-formatted.
  lint:
    command: "corepack pnpm exec biome check ."
