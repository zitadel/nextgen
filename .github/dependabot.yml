version: 2
updates:
  # The framework CLIs `zitadel setup` runs, each at an exact version, so an
  # upstream release reaches customers and the fresh-app journeys only through
  # this pull request (apps/cli/src/lib/orca/scaffolders/framework-clis.ts).
  # One grouped pull request a week, which the fresh-app journeys test. It
  # changes what setup scaffolds, so add a changeset before it merges.
  - package-ecosystem: npm
    directory: /apps/cli/src/lib/orca/scaffolders/framework-clis
    schedule:
      interval: weekly
    # A broken release (create-vite 9.3.2) is usually replaced within days.
    cooldown:
      default-days: 3
    groups:
      framework-clis:
        patterns: ["*"]
    commit-message:
      prefix: fix
      include: scope

  # The pnpm workspace and its catalog: one pull request a month with every
  # minor and patch release at least a week old. Majors stay manual. A bump
  # of a published package's runtime dependency needs a changeset before it
  # merges (.changeset/README.md#decision-table).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # update-types affects version updates only, so majors still arrive as
    # security updates.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  # Every module in go.work. Dependabot bumps each go.mod alone; run
  # `node scripts/check-go-work.mjs --fix` on the branch if check-go-work fails.
  - package-ecosystem: gomod
    directories:
      - /apps/api
      - /packages/config/defaults
      - /packages/design-tokens
      - /packages/go
      - /tools/bench
      - /tools/oidc-mock
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      go:
        update-types: [minor, patch]
      go-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  # The actions the workflows use, majors included: they are pinned by major
  # tag, so nothing else proposes a new one.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
