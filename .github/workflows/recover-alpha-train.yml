name: recover-alpha-train

on:
  workflow_dispatch:
    inputs:
      alpha_version:
        description: "Exact alpha version to recover, for example 0.1.0-alpha.4"
        required: true
        type: string
      ref:
        description: "Git ref or SHA whose package manifests contain alpha_version"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: recover-alpha-train-${{ inputs.alpha_version }}
  cancel-in-progress: false

jobs:
  recover-alpha-train:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build packages
        run: corepack pnpm nx run-many -t build

      - name: Verify published npm train
        env:
          INPUT_VERSION: ${{ inputs.alpha_version }}
        run: |
          set -euo pipefail
          corepack pnpm changeset status --output "$RUNNER_TEMP/recovery-changeset-status.json"
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          import { join } from "node:path";
          import {
            PUBLIC_PACKAGE_MANIFESTS,
            PUBLIC_PACKAGE_NAMES,
            validateAlphaVersion,
          } from "./scripts/release-alpha-train.mjs";

          const version = process.env.INPUT_VERSION;
          validateAlphaVersion(version);

          const status = JSON.parse(
            readFileSync(`${process.env.RUNNER_TEMP}/recovery-changeset-status.json`, "utf8"),
          );
          const pending = (Array.isArray(status.releases) ? status.releases : []).filter(
            (release) =>
              release &&
              typeof release === "object" &&
              PUBLIC_PACKAGE_NAMES.includes(release.name) &&
              release.type !== "none",
          );
          if (pending.length > 0) {
            throw new Error(
              `recovery ref has pending release changesets: ${pending
                .map((release) => release.name)
                .join(", ")}`,
            );
          }

          for (let index = 0; index < PUBLIC_PACKAGE_MANIFESTS.length; index += 1) {
            const path = PUBLIC_PACKAGE_MANIFESTS[index];
            const expectedName = PUBLIC_PACKAGE_NAMES[index];
            const manifest = JSON.parse(readFileSync(join(process.cwd(), path), "utf8"));
            if (manifest.name !== expectedName) {
              throw new Error(`${path} must be ${expectedName}`);
            }
            if (manifest.version !== version) {
              throw new Error(`${expectedName} is ${manifest.version}, expected ${version}`);
            }

            const published = JSON.parse(
              execFileSync("npm", ["view", `${expectedName}@${version}`, "version", "--json"], {
                encoding: "utf8",
                stdio: ["ignore", "pipe", "inherit"],
              }),
            );
            if (published !== version) {
              throw new Error(`npm registry returned ${expectedName}@${published}, expected ${version}`);
            }
          }
          NODE

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect alpha release train candidate
        id: alpha-status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          alpha_env="$RUNNER_TEMP/alpha-release-status.env"
          node scripts/release-alpha-train.mjs status --published true | tee "$alpha_env"
          cat "$alpha_env" >> "$GITHUB_OUTPUT"

      - name: Prepare alpha release train
        if: ${{ steps.alpha-status.outputs.should_complete == 'true' }}
        id: alpha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          alpha_env="$RUNNER_TEMP/alpha-release.env"
          node scripts/release-alpha-train.mjs prepare --published true --out-dir "$RUNNER_TEMP/alpha-release" | tee "$alpha_env"
          cat "$alpha_env" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: ${{ steps.alpha.outputs.run_goreleaser == 'true' }}
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: ${{ steps.alpha.outputs.run_goreleaser == 'true' }}
        uses: docker/setup-buildx-action@v4

      - name: Create and push Go release tag
        if: ${{ steps.alpha.outputs.create_tag == 'true' }}
        env:
          TAG: ${{ steps.alpha.outputs.tag }}
          TITLE: ${{ steps.alpha.outputs.title }}
        run: |
          set -euo pipefail
          git config user.name "zitadel-release"
          git config user.email "noreply@zitadel.com"
          git tag -a "$TAG" -m "$TITLE"
          git push origin "$TAG"

      - name: Check out existing Go release tag
        if: ${{ steps.alpha.outputs.run_goreleaser == 'true' && steps.alpha.outputs.tag_exists == 'true' }}
        env:
          TAG: ${{ steps.alpha.outputs.tag }}
        run: git checkout --detach "$TAG"

      - name: Prune npm package tags for GoReleaser
        if: ${{ steps.alpha.outputs.run_goreleaser == 'true' }}
        run: |
          set -euo pipefail
          git tag -l '@zitadel/*' | while read -r tag; do
            git tag -d "$tag"
          done

      - name: Run GoReleaser
        if: ${{ steps.alpha.outputs.run_goreleaser == 'true' }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update GitHub Release notes
        if: ${{ steps.alpha.outputs.update_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.alpha.outputs.tag }}
          TITLE: ${{ steps.alpha.outputs.title }}
          NOTES_PATH: ${{ steps.alpha.outputs.notes_path }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" \
            --draft \
            --prerelease \
            --latest=false \
            --title "$TITLE" \
            --notes-file "$NOTES_PATH"
