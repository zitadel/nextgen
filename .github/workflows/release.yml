name: release-zitadel

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Zitadel release tag, for example v5.0.0-alpha.1."
        required: true
        type: string
      ref:
        description: "Commit SHA, branch, or tag to release."
        required: true
        default: "main"
        type: string
      dry_run:
        description: "Validate, generate notes, and run a GoReleaser snapshot without publishing."
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-zitadel-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Prune npm package tags for GoReleaser
        run: |
          # Changesets may create scoped package tags such as @zitadel/sdk-nuxt@5.0.0-alpha.1.
          # GoReleaser should derive the product version from the v* Zitadel tag only.
          git tag -l '@zitadel/*' | while read -r tag; do
            git tag -d "$tag"
          done

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Validate lockstep release version
        run: node scripts/validate-release-version.mjs --version "${{ inputs.version }}"

      - name: Generate release notes
        run: node scripts/generate-release-notes.mjs --version "${{ inputs.version }}" --output release-notes.md

      - name: Generate release manifest
        run: |
          node scripts/generate-release-manifest.mjs \
            --version "${{ inputs.version }}" \
            --ref "${{ inputs.ref }}" \
            --commit "$(git rev-parse HEAD)" \
            --output release-manifest.json

      - name: Upload release preview
        uses: actions/upload-artifact@v7
        with:
          name: release-preview
          path: |
            release-notes.md
            release-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Create or verify release tag
        if: ${{ ! inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"
          COMMIT="$(git rev-parse HEAD)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            TAG_COMMIT="$(git rev-list -n 1 "$VERSION")"
            if [[ "$TAG_COMMIT" != "$COMMIT" ]]; then
              echo "::error::tag ${VERSION} points at ${TAG_COMMIT}, not ${COMMIT}"
              exit 1
            fi
          else
            git tag -a "$VERSION" -m "Zitadel next-generation preview $VERSION" "$COMMIT"
            git push origin "refs/tags/${VERSION}"
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: ${{ ! inputs.dry_run }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser snapshot
        if: ${{ inputs.dry_run }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign --release-notes release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser release
        if: ${{ ! inputs.dry_run }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release manifest
        if: ${{ ! inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.version }}" release-manifest.json --clobber
