name: deployment-checks

# Tests a deployment of the Vercel project `cloud` once Vercel built it, on
# the deployment's own URL (cloud-<hash>-zitadel.vercel.app), never an alias:
#
# - A preview, on the `deployment_status` Vercel posts to GitHub for it. The
#   run uses this file as it is on the deployed commit, so a branch that
#   changes it is checked by its own preview, and the check lands there, on
#   the pull request.
# - Production, called by production-checks.yml, which Vercel starts before
#   it assigns the production domains: that is what lets Vercel's Deployment
#   Checks hold them until the suites pass (docs/runbooks/cloud.md).
# - Any deployment by hand (`workflow_dispatch`, from any branch): a run again
#   without a new deployment.
#
# Each job runs a service's contract suite against the deployment's URL: the
# docs' the way the service runs it locally, but against the deployment
# instead of a local server (`docs:e2e-deployment`); the console's, which has
# no local counterpart, signed out (`e2e:console-deployment`). What is
# checked is the artifact Vercel built, routed by the repo-root vercel.json,
# behind Vercel's protection.
#
# What broke is read in this order: the check's name says the service and the
# environment; the annotations on it name the failing contract (the test's
# title) and every URL that failed; the run's summary names the deployment and
# the command that reproduces the run; a failed browser test's screenshots are
# the run's artifact. There are no traces (see the upload step for why).
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "The deployment to test, e.g. https://cloud-abc1234de-zitadel.vercel.app"
        required: true
        type: string
  workflow_call:
    inputs:
      url:
        description: "The deployment to test"
        required: true
        type: string
      sha:
        description: "The commit it was built from, whose suites run"
        required: true
        type: string
      environment:
        description: "What the job's name says was tested"
        required: true
        type: string
    secrets:
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: true
    # Each suite's result, for production-checks.yml, which reports every
    # suite as a status of its own.
    outputs:
      docs:
        description: "`success` once the docs suite passed, empty otherwise"
        value: ${{ jobs.docs.outputs.result }}
      console:
        description: "`success` once the console suite passed, empty otherwise"
        value: ${{ jobs.console.outputs.result }}

permissions:
  contents: read

concurrency:
  # The event is part of the group, so a run by hand never cancels the run
  # Vercel waits on for the same deployment.
  group: deployment-checks-${{ github.event_name }}-${{ inputs.url || github.event.deployment_status.environment_url }}
  cancel-in-progress: true

jobs:
  docs:
    # Reads "docs (Preview)" on a pull request, "docs (Production)" called by
    # production-checks.yml and "docs (dispatch)" by hand. Fixed rather than
    # Vercel's environment label, which has read both "Preview" and
    # "Preview – cloud": a check is matched by its name.
    name: docs (${{ inputs.environment || (github.event_name == 'deployment_status' && 'Preview') || 'dispatch' }})
    # Off a `deployment_status`, only a preview of `cloud` that is ready:
    # Vercel posts a status per state, and production is production-checks.yml's.
    # The URL is the deployment's own, never an alias.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.creator.login == 'vercel[bot]' &&
       startsWith(github.event.deployment.environment, 'Preview') &&
       startsWith(github.event.deployment_status.environment_url, 'https://cloud-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      # Set by the step after the suite, so only a run that got there passed.
      result: ${{ steps.passed.outputs.result }}
    env:
      DOCS_BASE_URL: ${{ inputs.url || github.event.deployment_status.environment_url }}
      # The project's Protection Bypass for Automation secret, as a repository
      # secret of the same name; the runbook says how to set it.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # See ci.yml.
      MOON_SUMMARY: detailed
      DO_NOT_TRACK: "1"
    steps:
      - name: Name the deployment in the run's summary
        env:
          ENVIRONMENT: ${{ inputs.environment || github.event.deployment.environment || 'dispatch' }}
          COMMIT: ${{ inputs.sha || github.event.deployment.sha || github.sha }}
        run: |
          {
            echo "- Deployment: $DOCS_BASE_URL ($ENVIRONMENT, commit ${COMMIT:0:8})"
            echo "- Reproduce: \`DOCS_BASE_URL=$DOCS_BASE_URL VERCEL_AUTOMATION_BYPASS_SECRET=… moon run docs:e2e-deployment\`"
            echo "- On a failure the annotations name the contract and the URLs; a failed browser test's screenshots are the \`docs-deployment-screenshots\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v6
        with:
          # The deployed commit; a dispatch takes the ref it was started from.
          ref: ${{ inputs.sha || github.event.deployment.sha || github.ref }}

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Put workspace binaries on PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: corepack pnpm --filter @zitadel/docs exec playwright install chromium

      # Without the secret every request would end at Vercel's sign-in page;
      # fail on the cause instead.
      - name: Check the bypass secret is set
        run: |
          [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ] || {
            echo "::error::Set the repository secret VERCEL_AUTOMATION_BYPASS_SECRET (docs/runbooks/cloud.md, Deployment checks)"
            exit 1
          }

      # `env -u CI`: the lane is `runInCI: false` to stay out of `moon ci`'s
      # selection, which also makes moon skip it under CI (see ci.yml). The
      # Playwright config recognises GitHub by GITHUB_RUN_ID instead.
      - name: Run the docs suite against the deployment
        run: env -u CI -u GITHUB_ACTIONS moon run docs:e2e-deployment

      - name: Record the pass
        id: passed
        run: echo "result=success" >> "$GITHUB_OUTPUT"

      # The screenshots and nothing else: the repository is public, so anyone
      # signed in to GitHub can download the artifact, and every other file
      # Playwright writes can hold the bypass secret. A trace records each
      # request's headers (the suite records none against a deployment), and
      # the error of a request that failed lists them, which error-context.md
      # keeps. The errors reach the log and the annotations, where GitHub masks
      # the secret. A suite added here follows the same rule
      # (docs/runbooks/cloud.md, "Deployment checks").
      - name: Upload the screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-deployment-screenshots
          path: apps/docs/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  # The console's suite, step for step as the docs job above, which says why:
  # how vercel.json routes the console's paths, and the console signed out,
  # down to the login widget's first step, which needs the server and its
  # database behind it. It signs nobody in.
  console:
    name: console (${{ inputs.environment || (github.event_name == 'deployment_status' && 'Preview') || 'dispatch' }})
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.creator.login == 'vercel[bot]' &&
       startsWith(github.event.deployment.environment, 'Preview') &&
       startsWith(github.event.deployment_status.environment_url, 'https://cloud-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      result: ${{ steps.passed.outputs.result }}
    env:
      CONSOLE_DEPLOYMENT_URL: ${{ inputs.url || github.event.deployment_status.environment_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      MOON_SUMMARY: detailed
      DO_NOT_TRACK: "1"
    steps:
      - name: Name the deployment in the run's summary
        env:
          ENVIRONMENT: ${{ inputs.environment || github.event.deployment.environment || 'dispatch' }}
          COMMIT: ${{ inputs.sha || github.event.deployment.sha || github.sha }}
        run: |
          {
            echo "- Deployment: $CONSOLE_DEPLOYMENT_URL ($ENVIRONMENT, commit ${COMMIT:0:8})"
            echo "- Reproduce: \`CONSOLE_DEPLOYMENT_URL=$CONSOLE_DEPLOYMENT_URL VERCEL_AUTOMATION_BYPASS_SECRET=… moon run e2e:console-deployment\`"
            echo "- On a failure the annotations name the contract and the requests that failed; a failed browser test's screenshots are the \`console-deployment-screenshots\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha || github.event.deployment.sha || github.ref }}

      # On production this workflow comes from main's head but the code from
      # the deployed commit, which can predate the move of the e2e suites into
      # e2e/ (a deployment still building when that merged, or a rollback).
      # Run the suite the checked-out commit has.
      - name: Find the console suite in this commit
        id: suite
        run: |
          if [ -f e2e/console/playwright.deployment.config.mts ]; then
            {
              echo "target=e2e:console-deployment"
              echo "package=@zitadel/e2e"
              echo "results=e2e/console/test-results"
            } >> "$GITHUB_OUTPUT"
          elif [ -f apps/console-e2e/playwright.deployment.config.mts ]; then
            {
              echo "target=console-e2e:e2e-deployment"
              echo "package=@zitadel/console-e2e"
              echo "results=apps/console-e2e/test-results"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::error::This commit has no console deployment suite."
            exit 1
          fi

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Put workspace binaries on PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        env:
          SUITE_PACKAGE: ${{ steps.suite.outputs.package }}
        run: corepack pnpm --filter "$SUITE_PACKAGE" exec playwright install chromium

      - name: Check the bypass secret is set
        run: |
          [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ] || {
            echo "::error::Set the repository secret VERCEL_AUTOMATION_BYPASS_SECRET (docs/runbooks/cloud.md, Deployment checks)"
            exit 1
          }

      - name: Run the console suite against the deployment
        env:
          SUITE_TARGET: ${{ steps.suite.outputs.target }}
        run: env -u CI -u GITHUB_ACTIONS moon run "$SUITE_TARGET"

      - name: Record the pass
        id: passed
        run: echo "result=success" >> "$GITHUB_OUTPUT"

      - name: Upload the screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: console-deployment-screenshots
          path: ${{ steps.suite.outputs.results }}/**/*.png
          if-no-files-found: ignore
          retention-days: 7
