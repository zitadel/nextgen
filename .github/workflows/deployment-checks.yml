name: deployment-checks

# Tests a deployment of the Vercel project `cloud` once Vercel built it, on
# the deployment's own URL (cloud-<hash>-zitadel.vercel.app), never an alias:
#
# - A preview, on the `deployment_status` Vercel posts to GitHub for it. The
#   run uses this file as it is on the deployed commit, so a branch that
#   changes it is checked by its own preview, and the check lands there, on
#   the pull request.
# - Production, called by production-checks.yml, which Vercel starts before
#   it assigns the production domains: that is what lets Vercel's Deployment
#   Checks hold them until the suites pass (docs/runbooks/cloud.md).
# - Any deployment by hand (`workflow_dispatch`, from any branch): a run again
#   without a new deployment.
#
# The job runs each service's contract suite, today the docs', the way the
# service runs it locally, but against the deployment's URL instead of a local
# server (`docs:e2e-deployment`): what is checked is the artifact Vercel built,
# routed by the repo-root vercel.json, behind Vercel's protection.
#
# What broke is read in this order: the check's name says the service and the
# environment; the annotations on it name the failing contract (the test's
# title) and every URL that failed; the run's summary names the deployment and
# the command that reproduces the run; the uploaded report holds the traces.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "The deployment to test, e.g. https://cloud-abc1234de-zitadel.vercel.app"
        required: true
        type: string
  workflow_call:
    inputs:
      url:
        description: "The deployment to test"
        required: true
        type: string
      sha:
        description: "The commit it was built from, whose suites run"
        required: true
        type: string
      environment:
        description: "What the job's name says was tested"
        required: true
        type: string
    secrets:
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: true

permissions:
  contents: read

concurrency:
  # The event is part of the group, so a run by hand never cancels the run
  # Vercel waits on for the same deployment.
  group: deployment-checks-${{ github.event_name }}-${{ inputs.url || github.event.deployment_status.environment_url }}
  cancel-in-progress: true

jobs:
  docs:
    # Reads "docs (Preview)" on a pull request, "docs (Production)" called by
    # production-checks.yml and "docs (dispatch)" by hand. Fixed rather than
    # Vercel's environment label, which has read both "Preview" and
    # "Preview – cloud": a check is matched by its name.
    name: docs (${{ inputs.environment || (github.event_name == 'deployment_status' && 'Preview') || 'dispatch' }})
    # Off a `deployment_status`, only a preview of `cloud` that is ready:
    # Vercel posts a status per state, and production is production-checks.yml's.
    # The URL is the deployment's own, never an alias.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.creator.login == 'vercel[bot]' &&
       startsWith(github.event.deployment.environment, 'Preview') &&
       startsWith(github.event.deployment_status.environment_url, 'https://cloud-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOCS_BASE_URL: ${{ inputs.url || github.event.deployment_status.environment_url }}
      # The project's Protection Bypass for Automation secret, as a repository
      # secret of the same name; the runbook says how to set it.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # See ci.yml.
      MOON_SUMMARY: detailed
      DO_NOT_TRACK: "1"
    steps:
      - name: Name the deployment in the run's summary
        env:
          ENVIRONMENT: ${{ inputs.environment || github.event.deployment.environment || 'dispatch' }}
          COMMIT: ${{ inputs.sha || github.event.deployment.sha || github.sha }}
        run: |
          {
            echo "- Deployment: $DOCS_BASE_URL ($ENVIRONMENT, commit ${COMMIT:0:8})"
            echo "- Reproduce: \`DOCS_BASE_URL=$DOCS_BASE_URL VERCEL_AUTOMATION_BYPASS_SECRET=… moon run docs:e2e-deployment\`"
            echo "- On a failure the annotations name the contract and the URLs; the \`docs-deployment-report\` artifact holds the Playwright report and the traces."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v6
        with:
          # The deployed commit; a dispatch takes the ref it was started from.
          ref: ${{ inputs.sha || github.event.deployment.sha || github.ref }}

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Put workspace binaries on PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: corepack pnpm --filter @zitadel/docs exec playwright install chromium

      # Without the secret every request would end at Vercel's sign-in page;
      # fail on the cause instead.
      - name: Check the bypass secret is set
        run: |
          [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ] || {
            echo "::error::Set the repository secret VERCEL_AUTOMATION_BYPASS_SECRET (docs/runbooks/cloud.md, Deployment checks)"
            exit 1
          }

      # `env -u CI`: the lane is `runInCI: false` to stay out of `moon ci`'s
      # selection, which also makes moon skip it under CI (see ci.yml). The
      # Playwright config recognises GitHub by GITHUB_RUN_ID instead.
      - name: Run the docs suite against the deployment
        run: env -u CI -u GITHUB_ACTIONS moon run docs:e2e-deployment

      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-deployment-report
          path: |
            apps/docs/playwright-report
            apps/docs/test-results
          if-no-files-found: ignore
          retention-days: 7
