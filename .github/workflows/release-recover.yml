name: release-recover

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact release version to recover, for example 0.1.0-alpha.6"
        required: true
        type: string
      dry_run:
        description: "Verify without publishing remote artifacts."
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  recover:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@v0

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: ${{ ! inputs.dry_run }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build local release artifacts
        run: env -u CI -u GITHUB_ACTIONS moon run release:snapshot

      - name: Recover release
        run: |
          args=(scripts/release.mjs recover --version "${{ inputs.version }}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          node "${args[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
