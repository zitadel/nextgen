name: release-npm

# Publishes the public alpha train: npm packages (@zitadel/cli, @zitadel/api,
# @zitadel/components, @zitadel/sdk-core, @zitadel/sdk-next, @zitadel/sdk-nuxt,
# @zitadel/sdk-react, @zitadel/sdk-vue, @zitadel/sdk-angular)
# via Changesets, then the matching Go server image/binaries via GoReleaser.
# Pushing release-relevant changes to main opens a "Version Packages" PR;
# merging that PR waits for the matching main CI run to pass, then publishes to
# npm, creates v<version>, and publishes the single GitHub Release.
#
# The repo is in changesets PRERELEASE mode (.changeset/pre.json, tag "alpha"),
# so versions are cut as X.Y.Z-alpha.N and published under the `alpha` npm
# dist-tag — `npm install @zitadel/cli` keeps resolving the last stable
# `latest`; consumers opt into prereleases with `@zitadel/cli@alpha`. Run
# `pnpm changeset pre exit` to leave alpha and cut a stable `latest` release.
#
# Authentication uses npm trusted publishing (OIDC) — there is no NPM_TOKEN.
# A maintainer must configure the trusted publisher for each public package
# once on npmjs.com (provider: GitHub Actions, repo: zitadel/nextgen, workflow
# filename: release-npm.yml). See .changeset/README.md.

on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
      - "apps/cli/package.json"
      - "apps/cli/CHANGELOG.md"
      - "packages/api/package.json"
      - "packages/api/CHANGELOG.md"
      - "packages/components/package.json"
      - "packages/components/CHANGELOG.md"
      - "packages/sdk-core/package.json"
      - "packages/sdk-core/CHANGELOG.md"
      - "packages/sdk-next/package.json"
      - "packages/sdk-next/CHANGELOG.md"
      - "packages/sdk-nuxt/package.json"
      - "packages/sdk-nuxt/CHANGELOG.md"
      - "packages/sdk-react/package.json"
      - "packages/sdk-react/CHANGELOG.md"
      - "packages/sdk-vue/package.json"
      - "packages/sdk-vue/CHANGELOG.md"
      - "packages/sdk-angular/package.json"
      - "packages/sdk-angular/CHANGELOG.md"

# id-token: write is required for OIDC trusted publishing.
# contents/pull-requests: write let the changesets action open the
# "Version Packages" PR and push version-bump commits.
#
# The changesets action authenticates as a GitHub App (see the
# "Generate a token" step) rather than the default GITHUB_TOKEN. GitHub
# deliberately does NOT trigger workflows for events caused by GITHUB_TOKEN,
# so a GITHUB_TOKEN-authored "Version Packages" PR never runs the required
# CI checks and stays blocked. A GitHub App is a distinct identity, so its
# PRs/pushes DO trigger CI — the release PR then has to pass the same
# required checks as any other PR. This keeps branch protection fully
# enforced (nothing bypasses checks); it only stops CI being silently
# skipped on the bot's PR. Requires repo secrets RELEASE_APP_ID and
# RELEASE_APP_PRIVATE_KEY (a GitHub App with Contents: R/W and
# Pull requests: R/W, installed on this repo).
permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write
  actions: read

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for main CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 90 * 60))
          while true; do
            run_fields="$(gh run list --workflow ci.yml --branch main --commit "$GITHUB_SHA" --event push --limit 1 --json status,conclusion,url --jq '.[] | [.status, (.conclusion // ""), .url] | @tsv')"
            if [ -z "$run_fields" ]; then
              status="missing"
              conclusion=""
              url=""
            else
              IFS=$'\t' read -r status conclusion url <<< "$run_fields"
            fi

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "main CI passed: $url"
                exit 0
              fi
              echo "::error::main CI finished with conclusion $conclusion: $url"
              exit 1
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::timed out waiting for main CI for $GITHUB_SHA"
              exit 1
            fi

            echo "Waiting for main CI for $GITHUB_SHA (status: $status)..."
            sleep 30
          done

      # Mint a short-lived installation token for the release GitHub App so the
      # changesets PR/commits trigger CI (GITHUB_TOKEN-authored ones do not).
      - name: Generate a token for the release app
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      # Trusted publishing requires npm >= 11.5.1; the pinned pnpm delegates
      # the actual publish to the npm CLI, so the runner's npm must be current.
      - name: Update npm for trusted publishing (OIDC)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build packages
        run: corepack pnpm nx run-many -t build

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: corepack pnpm changeset version
          publish: corepack pnpm changeset publish
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: false
        env:
          # App token (not GITHUB_TOKEN) so the Version Packages PR triggers CI.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Empty so the action does not pass an undefined token; OIDC handles auth.
          NPM_TOKEN: ""
          # npm provenance is only supported for public source repositories.
          # Keep trusted publishing via OIDC, but disable provenance until this
          # repository is public.
          NPM_CONFIG_PROVENANCE: "false"

      - name: Inspect alpha release train candidate
        id: alpha-status
        env:
          PUBLISHED: ${{ steps.changesets.outputs.published }}
        run: |
          set -euo pipefail
          alpha_env="$RUNNER_TEMP/alpha-release-status.env"
          node scripts/release-alpha-train.mjs status --published "$PUBLISHED" --remote false | tee "$alpha_env"
          cat "$alpha_env" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: ${{ steps.alpha-status.outputs.should_complete == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare alpha release train
        if: ${{ steps.alpha-status.outputs.should_complete == 'true' }}
        id: alpha
        env:
          PUBLISHED: ${{ steps.changesets.outputs.published }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          alpha_env="$RUNNER_TEMP/alpha-release.env"
          node scripts/release-alpha-train.mjs prepare --published "$PUBLISHED" --out-dir "$RUNNER_TEMP/alpha-release" | tee "$alpha_env"
          cat "$alpha_env" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: ${{ steps.alpha.outputs.run_goreleaser == 'true' }}
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: ${{ steps.alpha.outputs.run_goreleaser == 'true' }}
        uses: docker/setup-buildx-action@v4

      - name: Create and push Go release tag
        if: ${{ steps.alpha.outputs.create_tag == 'true' }}
        env:
          TAG: ${{ steps.alpha.outputs.tag }}
          TITLE: ${{ steps.alpha.outputs.title }}
        run: |
          set -euo pipefail
          git config user.name "zitadel-release"
          git config user.email "noreply@zitadel.com"
          git tag -a "$TAG" -m "$TITLE"
          git push origin "$TAG"

      - name: Prune npm package tags for GoReleaser
        if: ${{ steps.alpha.outputs.run_goreleaser == 'true' }}
        run: |
          set -euo pipefail
          git tag -l '@zitadel/*' | while read -r tag; do
            git tag -d "$tag"
          done

      - name: Run GoReleaser
        if: ${{ steps.alpha.outputs.run_goreleaser == 'true' }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update GitHub Release notes
        if: ${{ steps.alpha.outputs.update_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.alpha.outputs.tag }}
          TITLE: ${{ steps.alpha.outputs.title }}
          NOTES_PATH: ${{ steps.alpha.outputs.notes_path }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" \
            --draft \
            --prerelease \
            --latest=false \
            --title "$TITLE" \
            --notes-file "$NOTES_PATH"
