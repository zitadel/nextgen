name: ci-turbo

# The Turborepo version of ci.yml's moon steps, for the dual-run period of
# docs/design/build/turborepo-migration.md. It is not a required check:
# branch protection stays on `ci / full-pr`, and this job may fail without
# blocking a merge. At the cutover these steps replace the moon steps in
# ci.yml and this file goes.
#
# Turbo decides what runs. Every `turbo run` below takes `--affected`: turbo
# matches the files changed since TURBO_SCM_BASE against each task's inputs
# and follows task edges (futureFlags.affectedUsingTaskInputs, turbo.json),
# so the gate and each lane run the tasks the change reaches and what those
# need first. The setup only some lanes need runs when `turbo query affected`
# finds one of them affected. A change no task reads, a workflow edit say,
# runs nothing. How the inputs are drawn and why:
# docs/design/build/turborepo-graph.md.
#
# Pull requests and the merge queue run it beside ci.yml, the dual run's
# comparison (decision 9 of the plan). A push to main runs the
# generated-files check and the gate alone, so that the remote cache holds
# main's results for the branches cut from it; its merge group ran the lanes.
# Every night, and by hand with `force`, it runs every task and every lane
# without the results of earlier runs (TURBO_FORCE): main, checked on its own
# instead of through what it restores. By hand without `force` (`gh workflow
# run ci-turbo.yml --ref <branch>`) a run has no base: on a branch turbo finds
# no `main` to compare with and counts every file as changed, on main it finds
# nothing changed.
#
# A Changesets version PR, known by its `changeset-release/*` branch, runs the
# release's checks instead of the gate and the lanes, as ci.yml's
# version-only mode does. Its merge-queue entry has the queue's branch name
# and runs like any other.
#
# Every run writes the remote cache (TURBO_CACHE below).
#
# Arguments never go after `--` in a turbo run here: turbo puts them into
# the cache key of every task in the run, not just the task they are for
# (vercel/turborepo#14770), so the run would rebuild what the gate just
# built. The scripts take those options from the environment instead.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run every task and lane without reading the cache, as the nightly run does
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # By event too, so the nightly run neither waits for a push to main nor
  # holds one up.
  group: ci-turbo-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full-pr-turbo:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'depot-ubuntu-24.04-16' }}
    timeout-minutes: 120
    permissions:
      contents: read
      # The remote-cache step below exchanges this job's OIDC token for a
      # short-lived Turborepo token (Vercel's remote cache). Unused by the
      # Depot-cache alternative, see that step.
      id-token: write
    env:
      # What `--affected` compares with: the commit a merge group is built on,
      # so a queued entry does not re-test the entries ahead of it (as in
      # ci.yml), a pull request's base, or the commit a push to main replaced.
      TURBO_SCM_BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
      # The nightly run and a forced one: the gate and the generated-files
      # check set TURBO_FORCE from it, so every cacheable task runs once
      # without reading the cache and writes its result; the lanes, never
      # cached, all run, and restore their prerequisites from what the gate
      # just built. Every other run passes `--affected`.
      FORCE: ${{ github.event_name == 'schedule' || inputs.force == true }}
      AFFECTED: ${{ !(github.event_name == 'schedule' || inputs.force == true) && '--affected' || '' }}
      # A version PR runs the release's checks; every other run the gate, and
      # every run but a push to main the lanes too.
      VERSION_PR: ${{ startsWith(github.head_ref || github.ref_name, 'changeset-release/') }}
      LANES: ${{ github.event_name != 'push' && !startsWith(github.head_ref || github.ref_name, 'changeset-release/') }}
      DO_NOT_TRACK: "1"
      # Playwright forces FORCE_COLOR=1 on its workers and web servers, and Node
      # warns on every process that also sees NO_COLOR. Blank it so only the
      # test output is left in the log.
      NO_COLOR: ""
      TURBO_TELEMETRY_DISABLED: "1"
      # The contributor scripts (run-cli, local-registry, check) build through
      # turbo instead of moon.
      NEXTGEN_TASK_RUNNER: turbo
      # Depot runners point TURBO_API at Depot's own turbo cache. This job uses
      # Vercel's instead (one cache shared with the cloud deployments); delete
      # this line and the remote-cache step to use Depot's, which needs no
      # setup on Depot runners.
      TURBO_API: https://vercel.com
      # Every run reads and writes the remote cache, pull requests and the
      # merge queue too, as moon's runs do with Depot's: a pull request's
      # later pushes restore what its earlier ones built, and the merge
      # queue writes the results of the commit that lands on main. A
      # read-only flag would protect nothing, since the code under test sets
      # it: the OIDC policy gives every run of this repository a token that
      # can write, as Vercel gives every preview build one, and CI's entries
      # stay apart from the Vercel builds' (the plan: "Who may write to the
      # cache"). Forks get no token.
      TURBO_CACHE: local:rw,remote:rw
      # As in ci.yml: no Ryuk reaper, the postgres lane's only Docker Hub
      # image. test-postgres passes TESTCONTAINERS_* through turbo's strict env.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      # As in ci.yml: write dirty pages back early, so that Docker's container
      # creates do not wait for a backlog of several GB on Depot's EC2 runners.
      - name: Write dirty pages back early
        run: sudo sysctl -w vm.dirty_background_bytes=67108864

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # As in ci.yml: the postgres lane's image, pulled while the job installs.
      - name: Pull the postgres lane's image
        if: ${{ env.LANES == 'true' }}
        run: |
          image="$(sed -n 's/^const containerImage = "\(.*\)"$/\1/p' internal/storage/testdb/postgres.go)"
          if [ -z "$image" ]; then
            echo "::warning::internal/storage/testdb/postgres.go has no containerImage constant; nothing to pull"
            exit 0
          fi
          nohup docker pull --quiet "$image" </dev/null >"$RUNNER_TEMP/postgres-image-pull.log" 2>&1 &

      # As in ci.yml, whose cache entry this job shares: on Depot runners both
      # build through Depot's Go cache (GOCACHEPROG and DEPOT_CACHE_TOKEN,
      # which turbo passes through), and the module cache is the same.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/bench/go.sum
            tools/oidc-mock/go.sum

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # Bare `turbo` below is the workspace's own pinned turbo (and `moon` is
      # still there for scripts/check-moon-graph.mjs during the dual run).
      - name: Put workspace binaries on PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # As in ci.yml.
      - name: Check package boundaries
        run: turbo boundaries

      # Vercel Remote Cache over OIDC: needs the repository variable
      # TURBO_TEAM (the Vercel team slug) and a "Turborepo CLI" OIDC policy
      # for this repository in the Vercel team's settings (Build and
      # Deployment → OIDC Policies for CLI Access → Turborepo CLI Policies).
      # Should more than one of the team's Turborepo policies ever match this
      # token, Vercel refuses the exchange until `policy:` names one by its
      # ID. Skipped on forks, which cannot mint the token. When the exchange
      # fails (the step prints Vercel's answer), the job runs with the local
      # cache only ("Remote caching disabled" in turbo's output), which is
      # why the step may fail. The token is revoked when the job ends.
      - name: Set up Turborepo remote cache
        id: remote-cache
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      # Depot runners inject a token for Depot's own turbo cache; with TURBO_API
      # pointing at Vercel it only produces a failed request per task, and
      # turbo would still report "Remote caching enabled". Without a Vercel
      # token the job runs with the local cache alone.
      - name: Use the local cache only when the token exchange failed
        if: ${{ steps.remote-cache.outcome != 'success' }}
        run: echo "TURBO_CACHE=local:rw" >> "$GITHUB_ENV"

      - name: Check pending changesets
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git branch --force main origin/main
          node scripts/check-changesets-status.mjs --pending --summary

      # Before the gate, as in ci.yml: it deletes the generated files and
      # generates them again, and the gate's tasks read them.
      - name: Check Go generated files
        if: ${{ env.VERSION_PR == 'false' }}
        env:
          TURBO_FORCE: ${{ env.FORCE }}
        run: turbo run check-generate-pruned --filter=@zitadel/server $AFFECTED

      # The journey's setup runs when its lane is affected, by the same base
      # and inputs as its `--affected` below. Chromium needs no step: every
      # lane and browser test that opens it depends on its package's
      # `install-browsers`, so turbo installs it when one of them runs.
      # `turbo query affected --exit-code` exits 1 when a named task is
      # affected, 0 when none is, and 2 on an error, which counts as affected.
      # The journey runs its framework matrix in full only when a surface that
      # differs per framework moved: its own files, the CLI, the test kit and
      # the mock OIDC provider (the by-hand `journey` lane reads them all) or
      # an SDK. A change that reaches it only through the server it runs
      # proves as much on one framework (ci.yml's journey_matrix=single).
      - name: Find the setup the lanes need
        id: setup
        if: ${{ env.LANES == 'true' }}
        run: |
          affected() {
            if [ "$FORCE" = true ] || ! turbo query affected --exit-code "$@" >/dev/null; then
              echo true
            else
              echo false
            fi
          }
          sdks=()
          for dir in packages/sdk-*/; do
            sdks+=("@zitadel/$(basename "$dir")")
          done
          journey="$(affected --tasks journey-local)"
          matrix=single
          if [ "$(affected --tasks journey build --packages @zitadel/e2e "${sdks[@]}")" = true ]; then
            matrix=full
          fi
          {
            echo "journey=$journey"
            echo "journey_matrix=$matrix"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Keep Docker's interface churn away from Chromium
        if: ${{ env.VERSION_PR == 'false' }}
        run: |
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1
          if [ -d /proc/sys/net/ipv6/conf/docker0 ]; then
            sudo sysctl -w net.ipv6.conf.docker0.disable_ipv6=1
          fi

      # The gate: the tasks the change reaches, and what they need first,
      # which the cache mostly restores. A console change reaches the
      # server's tests, which embed it, through their task edge.
      # `--continue=dependencies-successful` is moon's behaviour: a failure
      # skips its dependents and nothing else. The summary feeds the report
      # step.
      - name: Run turbo build and test graph
        id: turbo-gate
        if: ${{ env.VERSION_PR == 'false' }}
        env:
          TURBO_FORCE: ${{ env.FORCE }}
        run: turbo run lint typecheck build test check-adrs check-moon-graph $AFFECTED --continue=dependencies-successful --summarize

      # `server:test` is part of the gate above; the database lanes stay
      # outside it, as in ci.yml.
      - name: Run Go integration tests (postgres)
        if: ${{ env.LANES == 'true' }}
        run: turbo run test-postgres --filter=@zitadel/server $AFFECTED

      - name: Run Go integration tests (sqlite)
        if: ${{ env.LANES == 'true' }}
        run: turbo run test-sqlite --filter=@zitadel/server $AFFECTED

      # The journey's tarballs, built outside the journey's graph as in
      # ci.yml: the release builds rewrite the dist folders the lanes read.
      # It runs whenever the journey does, so it takes no `--affected`: a
      # change to the journey's own specs reaches no release task. No `env -u
      # CI`: turbo has no runInCI, so nothing hides these tasks.
      # RELEASE_SKIP_CONTAINER=1 is `--skip-container` (see the top).
      - name: Build release snapshot without container
        if: ${{ steps.setup.outputs.journey == 'true' }}
        env:
          RELEASE_SKIP_CONTAINER: "1"
        run: turbo run snapshot --filter=@zitadel/release

      - name: Restore journey registry packages
        id: journey-registry
        if: ${{ steps.setup.outputs.journey == 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/journey-verdaccio-storage
          key: journey-verdaccio-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            journey-verdaccio-${{ runner.os }}-

      - name: List restored journey registry packages
        if: ${{ steps.setup.outputs.journey == 'true' }}
        run: >-
          node e2e/journey/scripts/registry-cache.mjs list
          "$RUNNER_TEMP/journey-verdaccio-storage" "$RUNNER_TEMP/journey-verdaccio-restored.txt"

      # Every e2e lane the change reaches, in one run and side by side, as
      # ci.yml's `e2e:all` runs them: each binds ports of its own, and the two
      # demo-next lanes, which both serve the demo on :3002, take turns through
      # their `demo-next-app` mutex (scripts/task-guard.mjs). The journey's
      # lane is ci.yml's, `journey-local`, which fixes `--ci --runtime
      # binary`; the rest of the runner's options come as JOURNEY_* variables
      # (see the top). A failed lane stops no other. Streamed, as in ci.yml:
      # grouped, a lane's output reaches the log only when the lane ends.
      - name: Run e2e lanes
        id: turbo-e2e
        if: ${{ env.LANES == 'true' }}
        env:
          JOURNEY_REGISTRY_STORAGE: ${{ runner.temp }}/journey-verdaccio-storage
          JOURNEY_MATRIX: ${{ steps.setup.outputs.journey_matrix }}
          JOURNEY_WORK_DIR: ${{ runner.temp }}/ci-journey
        run: |
          version="$(node -p "require('./apps/server/package.json').version")"
          JOURNEY_TARBALLS_DIR="dist/release/${version}/npm" turbo run journey-local test:integration demo-next-real demo-next-mock demo-nuxt-mock console-smoke console-real console-embedded console-platform --filter=@zitadel/e2e --filter=@zitadel/testing $AFFECTED --continue=dependencies-successful --log-order=stream --summarize

      # Reads the newest run summary, so it names the failures of whichever
      # turbo step failed: the gate or the e2e lanes.
      - name: Report turbo failures
        if: ${{ failure() && (steps.turbo-gate.conclusion == 'failure' || steps.turbo-e2e.conclusion == 'failure') }}
        run: node scripts/report-turbo-failures.mjs

      # After the e2e lanes and only once they passed, as in ci.yml.
      - name: Look for journey registry changes
        id: journey-registry-changes
        if: ${{ steps.setup.outputs.journey == 'true' }}
        run: >-
          node e2e/journey/scripts/registry-cache.mjs compare
          "$RUNNER_TEMP/journey-verdaccio-storage" "$RUNNER_TEMP/journey-verdaccio-restored.txt"

      - name: Save journey registry packages
        if: ${{ steps.journey-registry-changes.outputs.save == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/journey-verdaccio-storage
          key: ${{ steps.journey-registry.outputs.cache-primary-key }}

      - name: Validate version PR
        if: ${{ env.VERSION_PR == 'true' }}
        run: turbo run version --filter=@zitadel/release $AFFECTED

      # As in ci.yml: a version PR fails here, not after it lands, when npm
      # cannot take one of its packages.
      - name: Check npm can publish the version PR's packages
        if: ${{ env.VERSION_PR == 'true' }}
        run: node scripts/release.mjs check-npm

      - name: Pack version PR artifacts
        if: ${{ env.VERSION_PR == 'true' }}
        run: turbo run pack --filter=@zitadel/release $AFFECTED

      - name: Verify version PR tarballs
        if: ${{ env.VERSION_PR == 'true' }}
        run: |
          version="$(node -p "require('./apps/server/package.json').version")"
          node e2e/journey/scripts/verify-tarballs.mjs "dist/release/${version}/npm"

      - name: Upload journey diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: journey-diagnostics-turbo
          path: ${{ runner.temp }}/ci-journey/diagnostics
          if-no-files-found: ignore
          retention-days: 7

      # Every lane's results; the handshake (project secret) sits beside them in
      # .zitadel-testing/ and stays out.
      - name: Upload e2e diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-turbo
          path: |
            e2e/*/test-results
            e2e/*/playwright-report
          if-no-files-found: ignore
          retention-days: 7
