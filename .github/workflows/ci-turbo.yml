name: ci-turbo

# The Turborepo version of ci.yml's moon steps, for the dual-run period of
# docs/design/build/turborepo-migration.md. It is not a required check:
# branch protection stays on `ci / full-pr`, and these jobs may fail without
# blocking a merge. At the cutover they replace the moon steps in ci.yml and
# this file goes.
#
# Each job is a role: a standard GitHub-hosted runner of its own that sets
# up the same way and runs one list of tasks, `turbo run $TASKS --affected`.
# Turbo decides the rest. It matches the files changed since TURBO_SCM_BASE
# against each task's inputs and follows task edges
# (futureFlags.affectedUsingTaskInputs, turbo.json), so a role runs the
# tasks the change reaches and what those need first, and nothing when the
# change reaches none of them: a workflow edit, say. How the inputs are
# drawn and why: docs/design/build/turborepo-graph.md. Roles never wait for
# each other or hand each other files; what one of them builds reaches the
# others through the remote cache (TURBO_CACHE below).
#
# The roles divide the load, not the graph. A role's heavy tasks get the
# runner's 4 vCPU, 16 GB and disk to themselves, and a task that rewrites
# what others read, such as check-generate-pruned, which deletes the
# generated files and generates them again, runs where nothing reads them.
# The journey is the one role with steps of its own: its lane installs the
# release snapshot's tarballs, and the release builds rewrite the dist
# folders the lane's own dependencies write, so the snapshot gets a turbo
# run of its own, before the lane's and only when the lane is affected.
#
# Events decide which roles run. Pull requests and the merge queue run them
# all beside ci.yml, the dual run's comparison (decision 9 of the plan). A
# push to main runs the roles without lanes or database tests, so that the
# remote cache holds main's results for the branches cut from it; its merge
# group ran the rest. Every night, and by hand with `force`, every role runs
# every task without the results of earlier runs (TURBO_FORCE): main,
# checked on its own instead of through what it restores, and the one kind
# of run that saves the Go caches. By hand without `force` (`gh workflow run
# ci-turbo.yml --ref <branch>`) a run has no base: on a branch turbo finds
# no `main` to compare with and counts every file as changed, on main it
# finds nothing changed.
#
# A Changesets version PR, known by its `changeset-release/*` branch, runs
# the release role instead of the others, as ci.yml's version-only mode
# does. Its merge-queue entry has the queue's branch name and runs like any
# other.
#
# Arguments never go after `--` in a turbo run here: turbo puts them into
# the cache key of every task in the run, not just the task they are for
# (vercel/turborepo#14770), so the run would rebuild what another role just
# built. The scripts take those options from the environment instead.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run every task and lane without reading the cache, as the nightly run does
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # By event too, so the nightly run neither waits for a push to main nor
  # holds one up.
  group: ci-turbo-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # What `--affected` compares with: the commit a merge group is built on,
  # so a queued entry does not re-test the entries ahead of it (as in
  # ci.yml), a pull request's base, or the commit a push to main replaced.
  TURBO_SCM_BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
  # The nightly run and a forced one: every role runs, every cacheable task
  # runs once without reading the cache and writes its result, and every
  # lane runs. Every other run passes `--affected`.
  TURBO_FORCE: ${{ github.event_name == 'schedule' || inputs.force == true }}
  AFFECTED: ${{ !(github.event_name == 'schedule' || inputs.force == true) && '--affected' || '' }}
  DO_NOT_TRACK: "1"
  # Playwright forces FORCE_COLOR=1 on its workers and web servers, and Node
  # warns on every process that also sees NO_COLOR. Blank it so only the
  # test output is left in the log.
  NO_COLOR: ""
  TURBO_TELEMETRY_DISABLED: "1"
  # Vercel's remote cache is shared with the cloud deployments. The
  # remote-cache step authenticates these GitHub-hosted jobs over OIDC.
  # TURBO_API stays unset: turbo's default, https://vercel.com/api, is the
  # cache's endpoint, while https://vercel.com alone is the dashboard,
  # which answers turbo's uploads with 405.
  #
  # Every run reads and writes the remote cache, pull requests and the
  # merge queue too, as moon's runs do with Depot's: a pull request's
  # later pushes restore what its earlier ones built, the merge queue
  # writes the results of the commit that lands on main, and a role
  # restores what another role of the run has already built. A read-only
  # flag would protect nothing, since the code under test sets it: the
  # OIDC policy gives every run of this repository a token that can write,
  # as Vercel gives every preview build one, and CI's entries stay apart
  # from the Vercel builds' (the plan: "Who may write to the cache"). Forks
  # get no token.
  TURBO_CACHE: local:rw,remote:rw
  # As in ci.yml: no Ryuk reaper, the postgres lane's only Docker Hub
  # image. test-postgres passes TESTCONTAINERS_* through turbo's strict env.
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  # The steps every role shares carry YAML anchors here, in the first role,
  # and the other roles repeat them by alias (`- *setup-go`).
  checks:
    # Not on a version PR, which runs the release role instead.
    if: &not-version-pr ${{ !startsWith(github.head_ref || github.ref_name, 'changeset-release/') }}
    runs-on: &runner ubuntu-24.04
    timeout-minutes: 120
    permissions: &permissions
      contents: read
      # The remote-cache step exchanges the job's OIDC token for a
      # short-lived Turborepo token (Vercel's remote cache).
      id-token: write
    env:
      TASKS: lint typecheck check-typecheck check-openapi-rules check-adrs check-moon-graph check-go-work
      # One task per vCPU (`--concurrency=100%`, which follows the runner's
      # size), not turbo's default of 10. Measured on ubuntu-24.04's 4 vCPU,
      # 16 GB and 3 GB of swap: each server task runs its own `go`, whose
      # compiles of the generated API packages take 1.5-1.8 GB apiece. Ten
      # at a time filled memory and swap beside a Next.js build and a browser
      # suite, and the hosted runner's agent then stopped the runner: every
      # running task exited 137 under "The runner has received a shutdown
      # signal".
      FLAGS: --concurrency=100%
    steps:
      - &checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - &setup-go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          # The Go caches have steps of their own, below.
          cache: false

      # Go's module and build caches, one entry per role (GO_CACHE_ROLE
      # reads another role's), keyed on the Go setup-go installed, go.work
      # and every go.sum. A key that has no entry yet falls back to the
      # role's newest for the same Go, so a dependency bump still starts
      # warm; another Go's compiles would all miss. Restored before anything
      # runs `go`: turbo's Go workspace support loads the sources of every
      # module in go.work (about 1.3 GB), and module files already on disk
      # make the restore fail ("Cannot open: File exists").
      - &restore-go-cache
        name: Restore Go's caches
        id: go-cache
        uses: actions/cache/restore@v5
        with:
          path: &go-cache-paths |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-turbo-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ env.GO_CACHE_ROLE || github.job }}-${{ hashFiles('go.work', 'go.work.sum', 'apps/api/go.sum', 'packages/go/go.sum', 'tools/bench/go.sum', 'tools/oidc-mock/go.sum') }}
          restore-keys: |
            go-turbo-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ env.GO_CACHE_ROLE || github.job }}-

      - &setup-pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      # No `cache: pnpm`: on these runners the pnpm store cost more than it
      # saved, about 38 s per job on a hit and 56 s on a miss (its save)
      # against about 26 s installing from the registry.
      - &setup-node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - &install
        name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # Bare `turbo` below is the workspace's own pinned turbo (and `moon` is
      # still there for scripts/check-moon-graph.mjs during the dual run).
      - &path
        name: Put workspace binaries on PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # Vercel Remote Cache over OIDC: needs the repository variable
      # TURBO_TEAM (the Vercel team slug) and a "Turborepo CLI" OIDC policy
      # for this repository in the Vercel team's settings (Build and
      # Deployment → OIDC Policies for CLI Access → Turborepo CLI Policies).
      # Should more than one of the team's Turborepo policies ever match this
      # token, Vercel refuses the exchange until `policy:` names one by its
      # ID. Skipped on forks, which cannot mint the token. When the exchange
      # fails (the step prints Vercel's answer), the job runs with the local
      # cache only ("Remote caching disabled" in turbo's output), which is
      # why the step may fail. The token is revoked when the job ends.
      - &remote-cache
        name: Set up Turborepo remote cache
        id: remote-cache
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      # Without a Vercel token, including on fork pull requests, use only
      # the local cache.
      - &local-cache-only
        name: Use the local cache only when the token exchange failed
        if: ${{ steps.remote-cache.outcome != 'success' }}
        run: echo "TURBO_CACHE=local:rw" >> "$GITHUB_ENV"

      # As in ci.yml.
      - &boundaries
        name: Check package boundaries
        run: turbo boundaries

      - &changesets
        name: Check pending changesets
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git branch --force main origin/main
          node scripts/check-changesets-status.mjs --pending --summary

      # The role's tasks the change reaches, and what they need first, which
      # the cache mostly restores: a console change reaches the server's
      # tests, which embed it, through their task edge.
      # `--continue=dependencies-successful` is moon's behaviour: a failure
      # skips its dependents and nothing else.
      - &run-tasks
        name: Run the role's tasks
        run: turbo run $TASKS $AFFECTED --continue=dependencies-successful $FLAGS

      # Only a forced run (the nightly, or `force` by hand) saves the Go
      # caches: it ran every task, so its entry holds all the role compiles.
      # Any other run selected less, and a key keeps its first save, so a
      # partial entry would stay until Go or a go.sum changed. The nightly's
      # entries are main's, which every branch and merge group reads; a
      # forced run on a branch fills that branch's own.
      - &save-go-cache
        name: Save Go's caches
        if: ${{ env.TURBO_FORCE == 'true' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: *go-cache-paths
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  build-test:
    if: *not-version-pr
    runs-on: *runner
    timeout-minutes: 120
    permissions: *permissions
    env:
      TASKS: build test
      FLAGS: --concurrency=100%
    steps:
      - *checkout
      - *setup-go
      - *restore-go-cache
      - *setup-pnpm
      - *setup-node
      - *install
      - *path
      - *remote-cache
      - *local-cache-only
      - *run-tasks
      - *save-go-cache

  # The server's tests against SQLite and a Postgres container.
  go-db:
    # Not on a push to main, whose merge group ran it, nor on a version PR.
    if: &lanes ${{ github.event_name != 'push' && !startsWith(github.head_ref || github.ref_name, 'changeset-release/') }}
    runs-on: *runner
    timeout-minutes: 120
    permissions: *permissions
    env:
      TASKS: test-postgres test-sqlite
      FLAGS: --concurrency=100%
    steps:
      # Write dirty pages back early so Docker's container creates do not
      # wait for a backlog of dirty pages.
      - name: Write dirty pages back early
        run: sudo sysctl -w vm.dirty_background_bytes=67108864

      - *checkout

      # As in ci.yml: the postgres lane's image, pulled while the job installs.
      - name: Pull the postgres lane's image
        run: |
          image="$(sed -n 's/^const containerImage = "\(.*\)"$/\1/p' apps/api/internal/storage/testdb/postgres.go)"
          if [ -z "$image" ]; then
            echo "::warning::apps/api/internal/storage/testdb/postgres.go has no containerImage constant; nothing to pull"
            exit 0
          fi
          # Both registries serve the same official image and version.
          nohup bash -c '
            if ! docker pull --quiet "$1"; then
              fallback="docker.io/${1#public.ecr.aws/docker/}"
              docker pull --quiet "$fallback" &&
                docker tag "$fallback" "$1"
            fi
          ' -- "$image" </dev/null >"$RUNNER_TEMP/postgres-image-pull.log" 2>&1 &

      - *setup-go
      - *restore-go-cache
      - *setup-pnpm
      - *setup-node
      - *install
      - *path
      - *remote-cache
      - *local-cache-only
      - *run-tasks
      - *save-go-cache

  # check-generate-pruned, where nothing reads what it deletes and
  # generates again: the generated files' drift, and generated files
  # nothing generates any more.
  generated:
    if: *not-version-pr
    runs-on: *runner
    timeout-minutes: 120
    permissions: *permissions
    env:
      TASKS: check-generate-pruned
    steps:
      - *checkout
      - *setup-go
      - *restore-go-cache
      - *setup-pnpm
      - *setup-node
      - *install
      - *path
      - *remote-cache
      - *local-cache-only
      - *run-tasks
      - *save-go-cache

  # Every e2e lane but the journey's, and the test kit's real-instance
  # suite: the lanes the change reaches, in one run and side by side, as
  # ci.yml's `e2e:all` runs them. Each binds ports of its own, and the two
  # demo-next lanes, which both serve the demo on :3002, take turns through
  # their `demo-next-app` mutex (scripts/task-guard.mjs). A failed lane stops
  # no other. Streamed, as in ci.yml: grouped, a lane's output reaches the
  # log only when the lane ends.
  e2e:
    if: *lanes
    runs-on: *runner
    timeout-minutes: 120
    permissions: *permissions
    env:
      TASKS: >-
        @zitadel/testing#test:integration
        @zitadel/e2e#demo-next-real @zitadel/e2e#demo-next-mock
        @zitadel/e2e#demo-nuxt-mock @zitadel/e2e#console-smoke
        @zitadel/e2e#console-real @zitadel/e2e#console-embedded
        @zitadel/e2e#console-platform
      FLAGS: --log-order=stream
    steps:
      - *checkout
      - *setup-go
      - *restore-go-cache
      - *setup-pnpm
      - *setup-node
      - *install
      - *path
      - *remote-cache
      - *local-cache-only
      - *run-tasks

      # Every lane's results; the handshake (project secret) sits beside them in
      # .zitadel-testing/ and stays out.
      - name: Upload e2e diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-turbo
          path: |
            e2e/*/test-results
            e2e/*/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - *save-go-cache

  journey:
    if: *lanes
    runs-on: *runner
    timeout-minutes: 120
    permissions: *permissions
    # The lane installs only this runner's server package, so the snapshot
    # builds and packs only its platform and the lane's tarball check
    # expects only that one (`--host-only`, see the top). The nightly run
    # cross-compiles all five, as a release does.
    env:
      RELEASE_HOST_ONLY: ${{ github.event_name != 'schedule' && '1' || '' }}
    steps:
      - *checkout
      - *setup-go
      - *restore-go-cache
      - *setup-pnpm
      - *setup-node
      - *install
      - *path
      - *remote-cache
      - *local-cache-only

      # The one role that asks before it runs: the snapshot below takes no
      # `--affected`, so it must not run when the lane is not affected.
      # `--exit-code` exits 1 when the lane is affected, 0 when it is not,
      # and 2 on an error, which counts as affected.
      - name: Find whether the journey is affected
        id: affected
        run: |
          if [ "$TURBO_FORCE" = true ] || ! turbo query affected --exit-code --tasks journey-local >/dev/null; then
            echo "run=true"
          else
            echo "run=false"
          fi | tee -a "$GITHUB_OUTPUT"

      # The journey runs its framework matrix in full only when a surface that
      # differs per framework moved: its own files, the CLI, the test kit and
      # the mock OIDC provider (the by-hand `journey` lane reads them all) or
      # an SDK. A change that reaches it only through the server it runs
      # proves as much on one framework (ci.yml's journey_matrix=single).
      - name: Find the journey's framework matrix
        id: journey
        if: ${{ steps.affected.outputs.run == 'true' }}
        run: |
          sdks=()
          for dir in packages/sdk-*/; do
            sdks+=("@zitadel/$(basename "$dir")")
          done
          matrix=single
          if [ "$TURBO_FORCE" = true ] || ! turbo query affected --exit-code --tasks journey build --packages @zitadel/e2e "${sdks[@]}" >/dev/null; then
            matrix=full
          fi
          echo "matrix=$matrix" | tee -a "$GITHUB_OUTPUT"

      # The journey's tarballs, built before its lane as in ci.yml: the
      # release builds rewrite the dist folders the lane's own dependencies
      # write, so they run in a turbo run of their own. It runs whenever the
      # journey does, so it takes no `--affected`: a change to the journey's
      # own specs reaches no release task. Its graph holds the server's and
      # the CLI's tests: the CLI's restore from the remote cache when another
      # role ran them first, but the server's Go tests are never cached, so
      # this role runs them again. No `env -u CI`: turbo has no runInCI, so
      # nothing hides these tasks. RELEASE_SKIP_CONTAINER=1 is
      # `--skip-container` and RELEASE_HOST_ONLY=1 `--host-only` (see the top).
      - name: Build release snapshot without container
        if: ${{ steps.affected.outputs.run == 'true' }}
        env:
          RELEASE_SKIP_CONTAINER: "1"
        run: turbo run snapshot --filter=@zitadel/release

      # ci.yml's journey lane, `journey-local`, which fixes `--ci --runtime
      # binary`; the rest of the runner's options come as JOURNEY_* variables
      # (see the top). Streamed, as in ci.yml: grouped, the lane's output
      # reaches the log only when the lane ends. Unlike ci.yml it keeps no
      # registry store between runs (JOURNEY_REGISTRY_STORAGE): GitHub's
      # cache is per branch, so almost every journey started empty and saved
      # a 565 MB store no later run read, and the few that restored one
      # installed no faster.
      - name: Run journey lane
        if: ${{ steps.affected.outputs.run == 'true' }}
        env:
          JOURNEY_MATRIX: ${{ steps.journey.outputs.matrix }}
          JOURNEY_WORK_DIR: ${{ runner.temp }}/ci-journey
        run: |
          version="$(node -p "require('./apps/server/package.json').version")"
          JOURNEY_TARBALLS_DIR="dist/release/${version}/npm" turbo run journey-local --filter=@zitadel/e2e $AFFECTED --log-order=stream

      - name: Upload journey diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: journey-diagnostics-turbo
          path: ${{ runner.temp }}/ci-journey/diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - *save-go-cache

  # A version PR's checks, instead of the other roles: that its versions
  # are the ones Changesets computes, that npm takes its packages, and the
  # release's tarballs.
  release:
    if: ${{ startsWith(github.head_ref || github.ref_name, 'changeset-release/') }}
    runs-on: *runner
    timeout-minutes: 120
    permissions: *permissions
    env:
      # `pack` cross-compiles the server for every platform, as the
      # journey's snapshot does, so it starts from the journey's Go caches.
      GO_CACHE_ROLE: journey
    steps:
      - *checkout
      - *setup-go
      - *restore-go-cache
      - *setup-pnpm
      - *setup-node
      - *install
      - *path
      - *remote-cache
      - *local-cache-only
      - *boundaries
      - *changesets

      - name: Validate version PR
        run: turbo run version --filter=@zitadel/release $AFFECTED

      # As in ci.yml: a version PR fails here, not after it lands, when npm
      # cannot take one of its packages.
      - name: Check npm can publish the version PR's packages
        run: node scripts/release.mjs check-npm

      - name: Pack version PR artifacts
        run: turbo run pack --filter=@zitadel/release $AFFECTED

      - name: Verify version PR tarballs
        run: |
          version="$(node -p "require('./apps/server/package.json').version")"
          node e2e/journey/scripts/verify-tarballs.mjs "dist/release/${version}/npm"

  # The one check name: it fails when one of the roles failed or was
  # cancelled, and passes when each passed or was skipped. It runs whatever
  # they did (`always()`), since a check that is itself skipped counts as
  # passed.
  full-pr-turbo:
    if: ${{ always() }}
    needs: [checks, build-test, go-db, generated, e2e, journey, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a role failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
