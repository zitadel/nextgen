name: ci-turbo

# The Turborepo version of ci.yml's moon steps, for the dual-run period of
# docs/design/build/turborepo-migration.md. It is not a required check:
# branch protection stays on `ci / full-pr`, and these jobs may fail without
# blocking a merge. At the cutover they replace the moon steps in ci.yml and
# this file goes.
#
# The workflow only provides the machine. What CI checks is the root `ci`
# script (package.json): one `turbo run` of the checks, builds, tests,
# database lanes and e2e lanes, which runs the same way on a laptop.
# turbo.json decides the rest. With `--affected` turbo matches the files
# changed since TURBO_SCM_BASE against each task's inputs and follows task
# edges (futureFlags.affectedUsingTaskInputs), so a run covers the tasks the
# change reaches and what those need first, and nothing when the change
# reaches none of them: a workflow edit, say. How the inputs are drawn and
# why: docs/design/build/turborepo-graph.md.
#
# `full` runs the script on the runner ci.yml's full-pr uses (Depot's 16
# vCPU). check-generate-pruned deletes the generated files and generates
# them again, so it runs in a job of its own, `generated`, where nothing
# reads them.
#
# Pull requests and the merge queue run beside ci.yml, the dual run's
# comparison (decision 9 of the plan); the merge queue's run leaves the
# results of the commit that lands on main in the remote cache. Every night,
# and by hand with `force`, every task runs without the results of earlier
# runs (TURBO_FORCE): main, checked on its own instead of through what it
# restores. By hand without `force` (`gh workflow run ci-turbo.yml --ref
# <branch>`) a run has no base: on a branch turbo finds no `main` to compare
# with and counts every file as changed, on main it finds nothing changed.
#
# A Changesets version PR, known by its `changeset-release/*` branch, runs
# the release job instead of the others, as ci.yml's version-only mode
# does. Its merge-queue entry has the queue's branch name and runs like any
# other.
#
# Arguments never go after `--` in a turbo run here: turbo puts them into
# the cache key of every task in the run, not just the task they are for
# (vercel/turborepo#14770), so every task would miss the cache. The scripts
# take those options from the environment instead.

on:
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run every task and lane without reading the cache, as the nightly run does
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # By event too, so the nightly run and a run by hand on main neither wait
  # for nor replace each other.
  group: ci-turbo-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # What `--affected` compares with: the commit a merge group is built on,
  # so a queued entry does not re-test the entries ahead of it (as in
  # ci.yml), or a pull request's base.
  TURBO_SCM_BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
  # The nightly run and a forced one: every cacheable task runs once
  # without reading the cache and writes its result, and every lane runs.
  # Every other run passes `--affected`.
  TURBO_FORCE: ${{ github.event_name == 'schedule' || inputs.force == true }}
  AFFECTED: ${{ !(github.event_name == 'schedule' || inputs.force == true) && '--affected' || '' }}
  DO_NOT_TRACK: "1"
  # Playwright forces FORCE_COLOR=1 on its workers and web servers, and Node
  # warns on every process that also sees NO_COLOR. Blank it so only the
  # test output is left in the log.
  NO_COLOR: ""
  TURBO_TELEMETRY_DISABLED: "1"
  # Vercel's remote cache is shared with the cloud deployments. The
  # remote-cache step authenticates the jobs over OIDC. TURBO_API stays
  # unset: turbo's default, https://vercel.com/api, is the cache's endpoint,
  # while https://vercel.com alone is the dashboard, which answers turbo's
  # uploads with 405.
  #
  # Every run reads and writes the remote cache, pull requests and the
  # merge queue too, as moon's runs do with Depot's: a pull request's later
  # pushes restore what its earlier ones built, and the merge queue writes
  # the results of the commit that lands on main. A read-only flag would
  # protect nothing, since the code under test sets it: the OIDC policy
  # gives every run of this repository a token that can write, as Vercel
  # gives every preview build one, and CI's entries stay apart from the
  # Vercel builds' (the plan: "Who may write to the cache"). Forks get no
  # token.
  TURBO_CACHE: local:rw,remote:rw
  # As in ci.yml: no Ryuk reaper, the postgres lane's only Docker Hub
  # image. test-postgres passes TESTCONTAINERS_* through turbo's strict env.
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  # The steps the jobs share carry YAML anchors where they first appear, and
  # the later jobs repeat them by alias (`- *checkout`).
  full:
    # Not on a version PR, which runs the release job instead.
    if: &not-version-pr ${{ !startsWith(github.head_ref || github.ref_name, 'changeset-release/') }}
    # As ci.yml's full-pr: fork pull requests run untrusted code, so they
    # stay off Depot, which hands its jobs DEPOT_CACHE_TOKEN whatever GitHub
    # filters out.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'depot-ubuntu-24.04-16' }}
    timeout-minutes: 60
    permissions: &permissions
      contents: read
      # The remote-cache step exchanges the job's OIDC token for a
      # short-lived Turborepo token (Vercel's remote cache).
      id-token: write
    env:
      # The release snapshot the journey lane installs
      # (@zitadel/release#snapshot): no container image, and only this
      # runner's server platform, which the lane's tarball check then expects
      # (`--host-only`). The nightly run cross-compiles all five, as a release
      # does.
      RELEASE_SKIP_CONTAINER: "1"
      RELEASE_HOST_ONLY: ${{ github.event_name != 'schedule' && '1' || '' }}
    steps:
      # Two kernel settings, as in ci.yml. Depot runs some jobs on EC2
      # instances whose root disk writes about 250 MB/s, and Docker syncs it
      # on every container create, so the database lanes' containers waited
      # for the backlog of dirty pages the cache restores left: writeback
      # from 64 MB on keeps it small. Chromium aborts every request in flight
      # when the host gains an IP address (ERR_NETWORK_CHANGED, #1490), as it
      # does when the database lanes start containers beside the browser
      # suites: no IPv6 on interfaces created from here on, nor on docker0.
      - name: Tune the kernel for the database lanes and the browsers
        run: |
          sudo sysctl -w vm.dirty_background_bytes=67108864
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1
          if [ -d /proc/sys/net/ipv6/conf/docker0 ]; then
            sudo sysctl -w net.ipv6.conf.docker0.disable_ipv6=1
          fi

      - &checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Keyed like ci.yml's setup-go step, so the job restores the Go cache
      # ci.yml saves: on Depot both build through GOCACHEPROG (`depot
      # gocache`, which turbo passes through: globalPassThroughEnv) and keep
      # the same files in GOCACHE.
      - &setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: |
            apps/api/go.sum
            packages/go/go.sum
            tools/bench/go.sum
            tools/oidc-mock/go.sum
            go.work.sum

      - &setup-pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      # The pnpm store comes from Depot's cache, as in ci.yml.
      - &setup-node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - &install
        name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # Vercel Remote Cache over OIDC: needs the repository variable
      # TURBO_TEAM (the Vercel team slug) and a "Turborepo CLI" OIDC policy
      # for this repository in the Vercel team's settings (Build and
      # Deployment → OIDC Policies for CLI Access → Turborepo CLI Policies).
      # Should more than one of the team's Turborepo policies ever match this
      # token, Vercel refuses the exchange until `policy:` names one by its
      # ID. Skipped on forks, which cannot mint the token. When the exchange
      # fails (the step prints Vercel's answer), the job runs with the local
      # cache only ("Remote caching disabled" in turbo's output), which is
      # why the step may fail. The token is revoked when the job ends.
      - &remote-cache
        name: Set up Turborepo remote cache
        id: remote-cache
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      # Without a Vercel token, including on fork pull requests, use only
      # the local cache.
      - &local-cache-only
        name: Use the local cache only when the token exchange failed
        if: ${{ steps.remote-cache.outcome != 'success' }}
        run: echo "TURBO_CACHE=local:rw" >> "$GITHUB_ENV"

      # As in ci.yml.
      - &changesets
        name: Check pending changesets
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git branch --force main origin/main
          node scripts/check-changesets-status.mjs --pending --summary

      # Chromium for the browser suites and the lanes, as in ci.yml: their
      # install-browsers tasks find it here.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # The root `ci` script: every task the change reaches, and what those
      # need first, which the cache mostly restores.
      - name: Run CI's tasks
        env:
          # Outside the checkout, where the diagnostics upload below finds it.
          JOURNEY_WORK_DIR: ${{ runner.temp }}/ci-journey
        run: corepack pnpm run ci $AFFECTED

      # Every lane's results and the journey's diagnostics. The handshake
      # (project secret) sits beside the lanes' results in .zitadel-testing/
      # and stays out.
      - name: Upload diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-turbo
          path: |
            e2e/*/test-results
            e2e/*/playwright-report
            ${{ runner.temp }}/ci-journey/diagnostics
          if-no-files-found: ignore
          retention-days: 7

  # check-generate-pruned, where nothing reads what it deletes and
  # generates again: the generated files' drift, and generated files
  # nothing generates any more. It takes about a minute, so it runs on a
  # standard GitHub-hosted runner.
  generated:
    if: *not-version-pr
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: *permissions
    steps:
      - *checkout

      - id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          # The Go caches have steps of their own, below.
          cache: false

      # Go's module and build caches, keyed on the Go setup-go installed,
      # go.work and every go.sum. A key that has no entry yet falls back to
      # the newest for the same Go, so a dependency bump still starts warm;
      # another Go's compiles would all miss. Restored before anything runs
      # `go`: turbo's Go workspace support loads the sources of every module
      # in go.work (about 1.3 GB), and module files already on disk make the
      # restore fail ("Cannot open: File exists").
      - name: Restore Go's caches
        id: go-cache
        uses: actions/cache/restore@v5
        with:
          path: &go-cache-paths |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-turbo-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.work', 'go.work.sum', 'apps/api/go.sum', 'packages/go/go.sum', 'tools/bench/go.sum', 'tools/oidc-mock/go.sum') }}
          restore-keys: |
            go-turbo-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.job }}-

      - *setup-pnpm

      # No `cache: pnpm`: on these runners the pnpm store cost more than it
      # saved, about 38 s per job on a hit and 56 s on a miss (its save)
      # against about 26 s installing from the registry.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - *install
      - *remote-cache
      - *local-cache-only

      - name: Check the generated files
        run: corepack pnpm exec turbo run check-generate-pruned $AFFECTED

      # Only a forced run (the nightly, or `force` by hand) saves the Go
      # caches: it ran every task, so its entry holds all the job compiles.
      # Any other run selected less, and a key keeps its first save, so a
      # partial entry would stay until Go or a go.sum changed. The nightly's
      # entries are main's, which every branch and merge group reads; a
      # forced run on a branch fills that branch's own.
      - name: Save Go's caches
        if: ${{ env.TURBO_FORCE == 'true' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: *go-cache-paths
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # A version PR's checks, instead of the other jobs: that its versions
  # are the ones Changesets computes, that npm takes its packages, and the
  # release's tarballs. On ci.yml's runner, whose Go cache it restores:
  # `pack` cross-compiles the server for every platform.
  release:
    if: ${{ startsWith(github.head_ref || github.ref_name, 'changeset-release/') }}
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 60
    permissions: *permissions
    steps:
      - *checkout
      - *setup-go
      - *setup-pnpm
      - *setup-node
      - *install
      - *remote-cache
      - *local-cache-only

      # As in ci.yml.
      - name: Check package boundaries
        run: corepack pnpm exec turbo boundaries

      - *changesets

      - name: Validate version PR
        run: corepack pnpm exec turbo run version --filter=@zitadel/release $AFFECTED

      # As in ci.yml: a version PR fails here, not after it lands, when npm
      # cannot take one of its packages.
      - name: Check npm can publish the version PR's packages
        run: node scripts/release.mjs check-npm

      - name: Pack version PR artifacts
        run: corepack pnpm exec turbo run pack --filter=@zitadel/release $AFFECTED

      - name: Verify version PR tarballs
        run: |
          version="$(node -p "require('./apps/server/package.json').version")"
          node e2e/journey/scripts/verify-tarballs.mjs "dist/release/${version}/npm"

  # The one check name: it fails when one of the jobs failed or was
  # cancelled, and passes when each passed or was skipped. It runs whatever
  # they did (`always()`), since a check that is itself skipped counts as
  # passed.
  full-pr-turbo:
    if: ${{ always() }}
    needs: [full, generated, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
