name: ci-turbo

# The Turborepo version of ci.yml's moon steps, for the dual-run period of
# docs/design/build/turborepo-migration.md. It is not a required check:
# branch protection stays on `ci / full-pr`, and this job may fail without
# blocking a merge. At the cutover these steps replace the moon steps in
# ci.yml and this file goes.
#
# Pull requests and the merge queue stopped running it on 2026-10-14
# (decision 9 of the plan): it took more runner minutes than ci.yml, and its
# checks read as a second gate that nothing waited for. Pushes to main run
# it, and anyone can start it by hand (`gh workflow run ci-turbo.yml --ref
# <branch>`): on main that runs every lane (ci-mode forces a full run on an
# empty diff), on a branch the lanes a pull request of it would get. For
# the parity weeks before the cutover, put `pull_request:` and `merge_group:`
# back into `on:`; the steps still handle both.
#
# What differs from ci.yml, step by step, is commented inline. The intent is
# the same: install, decide the lanes, run the gate, then the explicit lanes
# that moon kept out of its automatic selection.
#
# Every run writes the remote cache (TURBO_CACHE below). A push to main runs
# the generated-files check and the gate alone, so that the cache holds
# main's results for the runs on branches cut from it.
#
# Arguments never go after `--` in a turbo run here: turbo puts them into
# the cache key of every task in the run, not just the task they are for
# (vercel/turborepo#14770), so the run would rebuild what the gate just
# built. The scripts take those options from the environment instead.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-turbo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full-pr-turbo:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'depot-ubuntu-24.04-16' }}
    timeout-minutes: 120
    permissions:
      contents: read
      # The remote-cache step below exchanges this job's OIDC token for a
      # short-lived Turborepo token (Vercel's remote cache). Unused by the
      # Depot-cache alternative, see that step.
      id-token: write
    env:
      DO_NOT_TRACK: "1"
      # Playwright forces FORCE_COLOR=1 on its workers and web servers, and Node
      # warns on every process that also sees NO_COLOR. Blank it so only the
      # test output is left in the log.
      NO_COLOR: ""
      TURBO_TELEMETRY_DISABLED: "1"
      # The contributor scripts (run-cli, local-registry, check) build through
      # turbo instead of moon; scripts/ci-mode.mjs asks turbo's graph.
      NEXTGEN_TASK_RUNNER: turbo
      # Depot runners point TURBO_API at Depot's own turbo cache. This job uses
      # Vercel's instead (one cache shared with the cloud deployments); delete
      # this line and the remote-cache step to use Depot's, which needs no
      # setup on Depot runners.
      TURBO_API: https://vercel.com
      # Every run reads and writes the remote cache, pull requests and the
      # merge queue too, as moon's runs do with Depot's: a pull request's
      # later pushes restore what its earlier ones built, and the merge
      # queue writes the results of the commit that lands on main. A
      # read-only flag would protect nothing, since the code under test sets
      # it: the OIDC policy gives every run of this repository a token that
      # can write, as Vercel gives every preview build one, and CI's entries
      # stay apart from the Vercel builds' (the plan: "Who may write to the
      # cache"). Forks get no token.
      TURBO_CACHE: local:rw,remote:rw
    steps:
      # As in ci.yml: write dirty pages back early, so that Docker's container
      # creates do not wait for a backlog of several GB on Depot's EC2 runners.
      - name: Write dirty pages back early
        run: sudo sysctl -w vm.dirty_background_bytes=67108864

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # As in ci.yml: the postgres lane's image, pulled while the job installs.
      - name: Pull the postgres lane's image
        run: |
          image="$(sed -n 's/^const containerImage = "\(.*\)"$/\1/p' internal/storage/testdb/postgres.go)"
          if [ -z "$image" ]; then
            echo "::warning::internal/storage/testdb/postgres.go has no containerImage constant; nothing to pull"
            exit 0
          fi
          nohup docker pull --quiet "$image" </dev/null >"$RUNNER_TEMP/postgres-image-pull.log" 2>&1 &

      # Not setup-go's cache: its key (Go version and go.mod) is ci.yml's
      # too, and the two jobs write GOCACHE in formats the other cannot read.
      # On Depot runners ci.yml builds through GOCACHEPROG (`depot gocache`,
      # which keeps depot-* files there); turbo's strict env drops
      # GOCACHEPROG, so the builds here use Go's own files. Whichever job
      # saved a shared entry first chose the format for both. The key names
      # the installed Go, whose patch differs between Depot's runner images
      # (a build result serves only the compiler that made it), and every
      # module's go.sum (tools/bench and tools/oidc-mock are modules of their
      # own).
      - uses: actions/setup-go@v6
        id: setup-go
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go modules and builds
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-turbo-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum', 'tools/bench/go.sum', 'tools/oidc-mock/go.sum') }}
          restore-keys: |
            go-turbo-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # Bare `turbo` below is the workspace's own pinned turbo (and `moon` is
      # still there for scripts/check-moon-graph.mjs during the dual run).
      - name: Put workspace binaries on PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # Vercel Remote Cache over OIDC: needs the repository variable
      # TURBO_TEAM (the Vercel team slug) and a "Turborepo CLI" OIDC policy
      # for this repository in the Vercel team's settings (Build and
      # Deployment → OIDC Policies for CLI Access → Turborepo CLI Policies).
      # Should more than one of the team's Turborepo policies ever match this
      # token, Vercel refuses the exchange until `policy:` names one by its
      # ID. Skipped on forks, which cannot mint the token. When the exchange
      # fails (the step prints Vercel's answer), the job runs with the local
      # cache only ("Remote caching disabled" in turbo's output), which is
      # why the step may fail. The token is revoked when the job ends.
      - name: Set up Turborepo remote cache
        id: remote-cache
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      # Depot runners inject a token for Depot's own turbo cache; with TURBO_API
      # pointing at Vercel it only produces a failed request per task, and
      # turbo would still report "Remote caching enabled". Without a Vercel
      # token the job runs with the local cache alone.
      - name: Use the local cache only when the token exchange failed
        if: ${{ steps.remote-cache.outcome != 'success' }}
        run: echo "TURBO_CACHE=local:rw" >> "$GITHUB_ENV"

      - name: Check PR title
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-pr-title.mjs --title "$PR_TITLE" --base "$BASE_SHA" --summary

      # Same outputs and gates as ci.yml; the affected set comes from turbo's
      # task graph (NEXTGEN_TASK_RUNNER above) instead of `moon query`. On a
      # push to main every lane gate stays off: its pull request ran them in
      # ci.yml, and main only refreshes the cache, through the gate and the
      # generated-files check.
      - name: Detect CI mode
        id: ci-mode
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            node scripts/ci-mode.mjs "${{ github.event.pull_request.base.sha || 'origin/main' }}"
          fi

      # Main runs it too, only to put its result in the remote cache: a pull
      # request that changes none of its inputs then restores it instead of
      # spending half a minute regenerating.
      - name: Check Go generated files
        if: ${{ steps.ci-mode.outputs.mode == 'full' && (steps.ci-mode.outputs.go_tests == 'true' || github.event_name == 'push') }}
        run: turbo run check-generate-pruned --filter=@zitadel/server

      - name: Cache Playwright browsers
        if: ${{ steps.ci-mode.outputs.mode == 'full' && steps.ci-mode.outputs.browsers == 'true' }}
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: ${{ steps.ci-mode.outputs.mode == 'full' && steps.ci-mode.outputs.browsers == 'true' }}
        run: corepack pnpm --filter @zitadel/components exec playwright install chromium

      - name: Keep Docker's interface churn away from Chromium
        if: ${{ steps.ci-mode.outputs.mode == 'full' }}
        run: |
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1
          if [ -d /proc/sys/net/ipv6/conf/docker0 ]; then
            sudo sysctl -w net.ipv6.conf.docker0.disable_ipv6=1
          fi

      # The gate. No `--affected`: turbo's package-level selection would miss
      # the artifact edges (a console change must re-run the server's tests,
      # which embed it), so every task runs and the cache skips the unchanged
      # ones. `--continue=dependencies-successful` is moon's behaviour: a
      # failure skips its dependents and nothing else. The summary feeds the
      # report step.
      - name: Run turbo build and test graph
        id: turbo-gate
        if: ${{ steps.ci-mode.outputs.mode == 'full' }}
        run: turbo run lint typecheck build test check-adrs check-moon-graph --continue=dependencies-successful --summarize

      - name: Report turbo failures
        if: ${{ failure() && steps.turbo-gate.conclusion == 'failure' }}
        run: node scripts/report-turbo-failures.mjs

      # `server:test` is part of the gate above (moon re-ran it explicitly
      # because `moon ci` selects by affectedness); the database lanes stay
      # explicit, as in ci.yml.
      - name: Run Go integration tests (postgres)
        if: ${{ steps.ci-mode.outputs.mode == 'full' && steps.ci-mode.outputs.go_tests == 'true' }}
        run: turbo run test-postgres --filter=@zitadel/server

      - name: Run Go integration tests (sqlite)
        if: ${{ steps.ci-mode.outputs.mode == 'full' && steps.ci-mode.outputs.go_tests == 'true' }}
        run: turbo run test-sqlite --filter=@zitadel/server

      # No `env -u CI`: turbo has no runInCI, so nothing hides these tasks.
      # RELEASE_SKIP_CONTAINER=1 is `--skip-container` (see the top).
      - name: Build release snapshot without container
        if: ${{ steps.ci-mode.outputs.mode == 'full' && steps.ci-mode.outputs.snapshot == 'true' }}
        env:
          RELEASE_SKIP_CONTAINER: "1"
        run: turbo run snapshot --filter=@zitadel/release

      - name: Restore journey registry packages
        id: journey-registry
        if: ${{ steps.ci-mode.outputs.mode == 'full' && steps.ci-mode.outputs.snapshot == 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/journey-verdaccio-storage
          key: journey-verdaccio-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            journey-verdaccio-${{ runner.os }}-

      - name: List restored journey registry packages
        if: ${{ steps.ci-mode.outputs.mode == 'full' && steps.ci-mode.outputs.snapshot == 'true' }}
        run: >-
          node e2e/journey/scripts/registry-cache.mjs list
          "$RUNNER_TEMP/journey-verdaccio-storage" "$RUNNER_TEMP/journey-verdaccio-restored.txt"

      # The runner's options as JOURNEY_* variables (see the top): ci.yml's
      # `--ci --matrix … --runtime binary --work-dir … --tarballs-dir …`.
      - name: Run journey e2e lanes
        if: ${{ steps.ci-mode.outputs.mode == 'full' && steps.ci-mode.outputs.snapshot == 'true' }}
        env:
          JOURNEY_REGISTRY_STORAGE: ${{ runner.temp }}/journey-verdaccio-storage
          JOURNEY_CI: "1"
          JOURNEY_MATRIX: ${{ steps.ci-mode.outputs.journey_matrix }}
          JOURNEY_RUNTIME: binary
          JOURNEY_WORK_DIR: ${{ runner.temp }}/ci-journey
        run: |
          version="$(node -p "require('./apps/server/package.json').version")"
          JOURNEY_TARBALLS_DIR="dist/release/${version}/npm" turbo run e2e-local --filter=@zitadel/e2e

      # Right after the journey; ci.yml's journey is part of its e2e step, so
      # the save there waits for every lane.
      - name: Look for journey registry changes
        id: journey-registry-changes
        if: ${{ steps.ci-mode.outputs.mode == 'full' && steps.ci-mode.outputs.snapshot == 'true' }}
        run: >-
          node e2e/journey/scripts/registry-cache.mjs compare
          "$RUNNER_TEMP/journey-verdaccio-storage" "$RUNNER_TEMP/journey-verdaccio-restored.txt"

      - name: Save journey registry packages
        if: ${{ steps.journey-registry-changes.outputs.save == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/journey-verdaccio-storage
          key: ${{ steps.journey-registry.outputs.cache-primary-key }}

      - name: Run @zitadel/testing real-instance suites
        if: ${{ steps.ci-mode.outputs.mode == 'full' && steps.ci-mode.outputs.suites_testing_demo == 'true' }}
        run: turbo run test:integration demo-next-real --filter=@zitadel/testing --filter=@zitadel/e2e

      # The lanes that need no backend: the console's preview smoke and the demos
      # against api-mock (moon runs them inside e2e:all). After the step above:
      # both demo-next lanes serve the demo on :3002.
      - name: Run mock-backed e2e lanes
        if: ${{ steps.ci-mode.outputs.mode == 'full' && steps.ci-mode.outputs.suites_mock == 'true' }}
        run: turbo run console-smoke demo-next-mock demo-nuxt-mock --filter=@zitadel/e2e

      - name: Run console real-instance suite
        if: ${{ steps.ci-mode.outputs.mode == 'full' && steps.ci-mode.outputs.suites_console == 'true' }}
        run: turbo run console-real --filter=@zitadel/e2e

      - name: Run console embedded-surface suite
        if: ${{ steps.ci-mode.outputs.mode == 'full' && steps.ci-mode.outputs.suites_console == 'true' }}
        run: turbo run console-embedded --filter=@zitadel/e2e

      - name: Run console platform-project suite
        if: ${{ steps.ci-mode.outputs.mode == 'full' && steps.ci-mode.outputs.suites_console == 'true' }}
        run: turbo run console-platform --filter=@zitadel/e2e

      - name: Validate version PR
        if: ${{ steps.ci-mode.outputs.mode == 'version-only' }}
        run: turbo run version --filter=@zitadel/release

      - name: Pack version PR artifacts
        if: ${{ steps.ci-mode.outputs.mode == 'version-only' }}
        run: turbo run pack --filter=@zitadel/release

      - name: Verify version PR tarballs
        if: ${{ steps.ci-mode.outputs.mode == 'version-only' }}
        run: |
          version="$(node -p "require('./apps/server/package.json').version")"
          node e2e/journey/scripts/verify-tarballs.mjs "dist/release/${version}/npm"

      - name: Upload journey diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: journey-diagnostics-turbo
          path: ${{ runner.temp }}/ci-journey/diagnostics
          if-no-files-found: ignore
          retention-days: 7

      # Every lane's results; the handshake (project secret) sits beside them in
      # .zitadel-testing/ and stays out.
      - name: Upload e2e diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-turbo
          path: |
            e2e/*/test-results
            e2e/*/playwright-report
          if-no-files-found: ignore
          retention-days: 7
