name: ci-turbo

# The turbo trial of docs/design/build/turborepo-migration.md: the root
# `ci` script on GitHub's 16-core runner, twice side by side. Both jobs
# keep the Go and pnpm caches of setup-go and setup-node. `no-turbo-cache`
# runs every task; `turbo-cache` restores and saves task results through
# Vercel's remote cache. Not a required check: branch protection stays on
# `ci / full-pr`.

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-turbo-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DO_NOT_TRACK: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  no-turbo-cache:
    runs-on: &runner
      group: zitadel-public
    timeout-minutes: 60
    env:
      TURBO_CACHE: local:,remote:
    steps:
      - &checkout
        uses: actions/checkout@v6

      - &setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: |
            apps/api/go.sum
            packages/go/go.sum
            tools/bench/go.sum
            tools/oidc-mock/go.sum
            go.work.sum

      - &setup-pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - &setup-node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - &install
        name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - &ci
        name: Run the ci script
        run: corepack pnpm run ci

  turbo-cache:
    runs-on: *runner
    timeout-minutes: 60
    permissions:
      contents: read
      # The remote-cache step trades this for a Turborepo token.
      id-token: write
    env:
      TURBO_CACHE: local:rw,remote:rw
    steps:
      - *checkout
      - *setup-go
      - *setup-pnpm
      - *setup-node
      - *install

      # Vercel's remote cache over OIDC: the TURBO_TEAM repository variable
      # and the team's Turborepo CLI policy for this repository. Forks get
      # no token and run with the local cache only.
      - name: Set up Turborepo remote cache
        id: remote-cache
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Use the local cache only without a token
        if: ${{ steps.remote-cache.outcome != 'success' }}
        run: echo "TURBO_CACHE=local:rw" >> "$GITHUB_ENV"

      - *ci
