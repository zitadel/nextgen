name: release-publish

on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - ".github/workflows/release-publish.yml"
      - "apps/**/CHANGELOG.md"
      - "apps/**/package.json"
      - "apps/api/go.mod"
      - "apps/api/go.sum"
      - "packages/**/CHANGELOG.md"
      - "packages/**/package.json"
      - "pnpm-lock.yaml"
      - "scripts/check-changesets-status.mjs"
      - "scripts/release*.mjs"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and verify only. Uncheck to allow publishing."
        required: true
        default: true
        type: boolean
      recover_version:
        description: "Exact already-versioned release to recover through the publish path, for example 0.1.0-alpha.8. Leave empty for normal publish detection."
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  changesets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      publish_should_run: ${{ steps.release-publish.outputs.should_run }}
      publish_reason: ${{ steps.release-publish.outputs.reason }}
    steps:
      - name: Generate release app token
        if: ${{ github.event_name == 'push' }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Detect release publish
        id: release-publish
        run: node scripts/release-automation.mjs publish --base "$BASE_SHA" --summary
        env:
          BASE_SHA: ${{ github.event.before || 'HEAD^' }}

      - uses: pnpm/action-setup@v6
        if: ${{ github.event_name == 'push' && steps.release-publish.outputs.should_run != 'true' }}
        with:
          run_install: false

      - uses: actions/setup-node@v7
        if: ${{ github.event_name == 'push' && steps.release-publish.outputs.should_run != 'true' }}
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: ${{ github.event_name == 'push' && steps.release-publish.outputs.should_run != 'true' }}
        run: corepack pnpm install --frozen-lockfile

      - name: Open or update version PR
        id: version-pr
        if: ${{ github.event_name == 'push' && steps.release-publish.outputs.should_run != 'true' }}
        uses: changesets/action@v2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version: corepack pnpm exec changeset version
          title: "build: version packages"
          commit: "build: version packages"
          createGithubReleases: false

      # The action's description repeats each change under every package it
      # ships in and drops every changelog past 60,000 characters. This one
      # lists each change once, read from the checkout the action versioned.
      - name: Describe the version PR's changes
        if: ${{ steps.version-pr.outputs.pullRequestNumber }}
        run: |
          node scripts/release-github.mjs version-pr-body > "$RUNNER_TEMP/version-pr-body.md"
          gh pr edit "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/version-pr-body.md"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PULL_REQUEST: ${{ steps.version-pr.outputs.pullRequestNumber }}

  publish:
    needs: changesets
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changesets.outputs.publish_should_run == 'true' }}
    # A GitHub-hosted runner, which npm requires to sign provenance; the
    # same 32-core arm64 group as CI. The server binaries cross-compile with
    # cgo off, so the host's architecture does not reach the release.
    runs-on:
      group: 32-arm-linux
    timeout-minutes: 90
    env:
      # A release builds everything itself: it neither restores nor saves
      # task results, so nothing a pull request's run wrote can reach it.
      TURBO_CACHE: "local:,remote:"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: |
            apps/api/go.sum
            packages/go/go.sum
            tools/bench/go.sum
            tools/oidc-mock/go.sum
            go.work.sum

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && ! inputs.dry_run) }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Configure Changesets git tag author
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && ! inputs.dry_run) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The release graph (tools/release/turbo.json) builds every public
      # package and the five server binaries, then publishes what it built.
      # Its options come from the environment (release.mjs): arguments after
      # `--` would re-key every task in the run.
      - name: Publish dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: corepack pnpm exec turbo run @zitadel/release#publish
        env:
          RELEASE_DRY_RUN: "1"
          BASE_SHA: ${{ github.event.before || 'HEAD^' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PNPM_CONFIG_PROVENANCE: "false"
          RECOVER_VERSION: ${{ inputs.recover_version }}

      - name: Publish release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && ! inputs.dry_run) }}
        run: corepack pnpm exec turbo run @zitadel/release#publish
        env:
          BASE_SHA: ${{ github.event.before || 'HEAD^' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Trusted publishing via OIDC, with a signed provenance statement
          # linking each npm package to this workflow run.
          PNPM_CONFIG_PROVENANCE: "true"
          RECOVER_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_version || '' }}
