name: release-publish

on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - ".github/workflows/release-publish.yml"
      - "apps/**/CHANGELOG.md"
      - "apps/**/package.json"
      - "go.mod"
      - "go.sum"
      - "packages/**/CHANGELOG.md"
      - "packages/**/package.json"
      - "pnpm-lock.yaml"
      - "scripts/check-changesets-status.mjs"
      - "scripts/release*.mjs"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and report what a real run would publish. Uncheck to idempotently publish whatever is missing for the pinned release commit."
        required: true
        default: true
        type: boolean
      release_ref:
        description: "Optional immutable commit or tag to recover. It must be an ancestor of main; leave empty to use the commit selected when dispatching."
        required: false
        default: ""
        type: string
      recover_version:
        description: "Required with release_ref: exact @zitadel/server version expected at that ref, for example 0.1.0-alpha.17."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  changesets:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    outputs:
      publish_should_run: ${{ steps.release-publish.outputs.should_run }}
      publish_reason: ${{ steps.release-publish.outputs.reason }}
      release_sha: ${{ steps.release-target.outputs.sha }}
    steps:
      - name: Generate release app token
        if: ${{ github.event_name == 'push' }}
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Resolve immutable release target
        id: release-target
        shell: bash
        run: |
          release_sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "${release_sha}" origin/main; then
            echo "::error::Release target ${release_sha} is not an ancestor of main"
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] &&
            [ -z "${RELEASE_REF}" ] &&
            [ "${release_sha}" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main moved after this dispatch was created; rerun for current main or set release_ref and recover_version explicitly"
            exit 1
          fi
          if [ -n "${RELEASE_REF}" ] && [ -z "${RECOVER_VERSION}" ]; then
            echo "::error::recover_version is required when release_ref is set"
            exit 1
          fi
          echo "sha=${release_sha}" >> "${GITHUB_OUTPUT}"
          echo "Pinned release target: ${release_sha}"
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || '' }}
          RECOVER_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_version || '' }}

      - name: Detect release publish
        if: ${{ github.event_name == 'push' }}
        id: release-publish
        run: node scripts/release-automation.mjs publish --base "$BASE_SHA" --summary
        env:
          BASE_SHA: ${{ github.event.before || 'HEAD^' }}

      - uses: pnpm/action-setup@v5
        if: ${{ github.event_name == 'push' && steps.release-publish.outputs.should_run != 'true' }}
        with:
          run_install: false

      - uses: actions/setup-node@v6
        if: ${{ github.event_name == 'push' && steps.release-publish.outputs.should_run != 'true' }}
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: ${{ github.event_name == 'push' && steps.release-publish.outputs.should_run != 'true' }}
        run: corepack pnpm install --frozen-lockfile

      - name: Open or update version PR
        if: ${{ github.event_name == 'push' && steps.release-publish.outputs.should_run != 'true' }}
        uses: changesets/action@v1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version: corepack pnpm exec changeset version
          title: "build: version packages"
          commit: "build: version packages"
          createGithubReleases: false

  # Build and publish are separate jobs on purpose: build compiles every
  # release artifact without publish credentials; publish downloads that
  # artifact and promotes it (npm tarballs, container push, git tags, GitHub
  # Release) without ever rebuilding — check-release-graph enforces that the
  # release:publish task graph contains no build tasks.
  build:
    needs: changesets
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changesets.outputs.publish_should_run == 'true' }}
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changesets.outputs.release_sha }}
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@v0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build release artifacts
        # Release tasks are excluded from `moon ci`, but this workflow invokes
        # them explicitly. Unset only CI so Moon keeps the task in the action
        # pipeline while preserving the GitHub Actions environment.
        run: env -u CI moon run release:build

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/release
          if-no-files-found: error
          retention-days: 7

  publish:
    needs:
      - changesets
      - build
    # npm trusted publishing supports GitHub-hosted runners, not self-hosted
    # runners. Keep the compilation-heavy build job on Depot; this job only
    # verifies and promotes its downloaded artifact.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changesets.outputs.release_sha }}
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@v0

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && ! inputs.dry_run) }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/release

      - name: Configure Changesets git tag author
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && ! inputs.dry_run) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish release
        # Release tasks are excluded from `moon ci`, but this workflow invokes
        # them explicitly. Unset only CI so Moon keeps the task in the action
        # pipeline while preserving the GitHub Actions/OIDC environment.
        run: env -u CI moon run release:publish
        env:
          BASE_SHA: ${{ github.event.before || 'HEAD^' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Trusted publishing intentionally covers npm publish only. npm does
          # not authorize dist-tag repair through OIDC, so a package-scoped,
          # short-lived granular token is mapped to npm auth only for stale-tag
          # repair or historical-recovery cleanup.
          NPM_DIST_TAG_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
          ZITADEL_RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          ZITADEL_RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || '' }}
          ZITADEL_RELEASE_SHA: ${{ needs.changesets.outputs.release_sha }}
          # Manual dispatch = idempotent re-run of one pinned commit. For an
          # older release, release_ref and recover_version must be supplied
          # together so the target is both immutable and human-checked.
          ZITADEL_RELEASE_MANUAL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          RECOVER_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_version || '' }}

      - name: Smoke the compose deployment (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        # Manual dry runs also validate the deployment surface: build a
        # host-platform image from the downloaded docker context and boot it
        # through docs/operations/docker-compose.yaml.
        run: env -u CI moon run release:smoke-deploy
        env:
          ZITADEL_SMOKE_DIAGNOSTICS_DIR: ${{ runner.temp }}/deploy-smoke/diagnostics

      - name: Upload smoke diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: deploy-smoke-diagnostics
          path: ${{ runner.temp }}/deploy-smoke/diagnostics
          if-no-files-found: ignore
          retention-days: 7
