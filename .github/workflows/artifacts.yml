name: artifacts

# What a release ships, run the way users run it. `full-pr` builds and packs
# every artifact on Linux arm64 but never starts the macOS server,
# the container or a data dir an older release wrote; this workflow does.
# It is not a required check. It tests one of two things
# (scripts/artifacts-target.mjs decides, in `target`):
#
# - what this ref builds: nightly on main (04:41 UTC), on PRs that change
#   this file, and on a dispatch without a version
#   (`gh workflow run artifacts.yml --ref <branch>`);
# - a published release: on a dispatch with one
#   (`gh workflow run artifacts.yml -f version=0.6.0`), and after every
#   release-publish run that published one. That trigger is workflow_run,
#   not a job in release-publish.yml: the release neither waits for these
#   checks nor turns red when one fails, and its workflow file stays as it
#   is. A release-publish run that published nothing (a version PR update, a
#   dry run) leaves every job here skipped.
#
# Jobs:
# - binaries (built only): the five platform packages' build-binary, the
#   release's own cross-compile, once on Linux.
# - start: the macOS and Linux server, each on its own platform: start on an
#   empty data dir, /readyz, stop (scripts/smoke-server.mjs). A published
#   release is installed from npm as a customer installs it. The Windows
#   binary is built and published but not started here.
# - linux (built only): the container smoke (//#smoke-container) and the
#   upgrade from the latest published release (//#smoke-upgrade).
# - published (published only): the release's container image, and the
#   upgrade from the release before it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "A published @zitadel/server version to test instead of building this ref, for example 0.6.0. Leave empty to build."
        required: false
        default: ""
        type: string
  schedule:
    - cron: "41 4 * * *"
  pull_request:
    paths:
      - .github/workflows/artifacts.yml
  workflow_run:
    workflows: [release-publish]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: artifacts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # No remote cache token here: every task this runs is uncached anyway.
  TURBO_CACHE: local:rw

jobs:
  target:
    # Only a release-publish run that succeeded can have published.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.target.outputs.mode }}
      version: ${{ steps.target.outputs.version }}
      image: ${{ steps.target.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - id: target
        run: node scripts/artifacts-target.mjs
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          RELEASE_RUN_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}

  binaries:
    needs: target
    if: ${{ needs.target.outputs.mode == 'build' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: apps/api/go.sum

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build the release binaries
        run: corepack pnpm exec turbo run build-binary --filter='@zitadel/server-*' --output-logs=errors-only

      # Stored relative to apps/: server-<platform>/bin/nextgen[.exe].
      - uses: actions/upload-artifact@v7
        with:
          name: server-binaries
          path: apps/server-*/bin/
          if-no-files-found: error
          retention-days: 7

  start:
    needs: [target, binaries]
    # binaries is skipped for a published release.
    if: ${{ !cancelled() && needs.target.result == 'success' && needs.target.outputs.mode != 'none' && needs.binaries.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v8
        if: ${{ needs.target.outputs.mode == 'build' }}
        with:
          name: server-binaries
          path: apps

      # The script needs no dependencies. It picks this runner's binary, or
      # installs the published version (empty when built).
      - name: Start, check and stop the server
        run: node scripts/smoke-server.mjs --version "$VERSION"
        env:
          VERSION: ${{ needs.target.outputs.version }}

  linux:
    needs: target
    if: ${{ needs.target.outputs.mode == 'build' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: apps/api/go.sum

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Smoke the container and the upgrade
        run: corepack pnpm exec turbo run //#smoke-container //#smoke-upgrade --continue --output-logs=errors-only

  published:
    needs: target
    if: ${{ needs.target.outputs.mode == 'published' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.target.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # target's summary says when the release pushed no image.
      - name: Smoke the published container image
        if: ${{ needs.target.outputs.image == 'true' }}
        run: node scripts/smoke-container.mjs --version "$VERSION"

      - name: Upgrade from the release before it
        if: ${{ !cancelled() }}
        run: node scripts/smoke-upgrade.mjs --to "$VERSION"
