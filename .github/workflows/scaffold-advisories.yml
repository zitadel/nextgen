name: scaffold-advisories

# Fails when a package `zitadel setup` scaffolds at a pinned version has a
# known high or critical advisory (`@zitadel/cli#check-advisories`). A pinned version
# never moves to a patched release by itself, and an advisory can be published
# for it on any day, so the check runs nightly against main. It also runs on
# pull requests that change the scaffolders or the check, so a bump onto an
# affected release shows up before it merges. It asks the npm advisory
# database over the network, so it stays out of ci.yml's `full-pr`, and it is
# not a required check.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
  pull_request:
    paths:
      - .github/workflows/scaffold-advisories.yml
      - apps/cli/checks/**
      - apps/cli/src/lib/orca/scaffolders/**
      - apps/cli/vitest.advisories.config.ts

permissions:
  contents: read

concurrency:
  group: scaffold-advisories-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Turbo reads the Go modules from go.work.
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: apps/api/go.sum

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Check the scaffolders' pinned packages
        run: corepack pnpm exec turbo run @zitadel/cli#check-advisories
