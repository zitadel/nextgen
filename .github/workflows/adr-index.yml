name: adr-index

on:
  pull_request:
    paths:
      - "docs/adrs/**"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Validate ADR index
        run: node scripts/check-adrs-index.mjs
