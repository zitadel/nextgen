name: adr-index

on:
  pull_request:
    paths:
      - "docs/adrs/**"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Fork PRs execute untrusted repository code. Keep them off Depot runners,
    # which inject DEPOT_CACHE_TOKEN independently of GitHub secret filtering.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'depot-ubuntu-24.04-4' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@v0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Validate ADR index
        run: moon run workspace:check-adrs
