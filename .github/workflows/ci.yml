name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel an in-flight run when a newer commit is pushed to the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # The repository tests boot fergusstrange/embedded-postgres, which fetches
      # a ~70MB Postgres binary from Maven Central via http.Get() with no timeout.
      # On a cold runner this hung indefinitely. We cache + pre-fetch with curl
      # so we fail fast on network issues and amortize on warm runs.
      - name: Cache embedded-postgres binaries
        id: pgcache
        uses: actions/cache@v4
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-16.9.0-${{ runner.os }}-${{ runner.arch }}

      - name: Pre-fetch embedded-postgres binary
        if: steps.pgcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ver=16.9.0
          os=linux
          [ "${RUNNER_OS}" = "macOS" ] && os=darwin
          arch=amd64
          [ "${RUNNER_ARCH}" = "ARM64" ] && arch=arm64v8
          jar="embedded-postgres-binaries-${os}-${arch}-${ver}.jar"
          txz="embedded-postgres-binaries-${os}-${arch}-${ver}.txz"
          mkdir -p "$HOME/.embedded-postgres-go"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --retry-all-errors --max-time 120 -o "$jar" \
            "https://repo1.maven.org/maven2/io/zonky/test/postgres/embedded-postgres-binaries-${os}-${arch}/${ver}/${jar}"
          unzip -p "$jar" '*.txz' > "$HOME/.embedded-postgres-go/${txz}"
          ls -lh "$HOME/.embedded-postgres-go/"

      - run: go vet ./...
      - run: go test -v -timeout=10m ./...

  goreleaser-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          # cache: pnpm is intentionally omitted until pnpm-lock.yaml exists
          # in the repo (lands with the frontend workspace).

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=publish,sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
