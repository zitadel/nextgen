name: ci

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full-pr:
    # Fork PRs execute untrusted repository code. Keep them off Depot runners,
    # which inject DEPOT_CACHE_TOKEN independently of GitHub secret filtering.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'depot-ubuntu-24.04-16' }}
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      # Moon marks failed tasks by color alone, so a failed `moon ci` can end at
      # "Tasks: 1 failed" with no named target. The summary names them in plain
      # text and replays each failed task's own output. Green runs pay only a
      # pass/fail list; the replay section is empty when nothing failed.
      MOON_SUMMARY: detailed
      # Suppress CLI telemetry for every step in CI. DO_NOT_TRACK is the
      # cross-tool standard (https://consoledonottrack.com) the CLI honors, so
      # no build runs here ever ship events to the telemetry backend.
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # Bare `moon` below is the workspace's own pinned @moonrepo/cli, so CI
      # runs the exact version the lockfile resolves — same as local dev.
      - name: Put workspace binaries on PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # A PR title is attacker-controlled text on a public repo, so it reaches the
      # script through the environment — never interpolated into the shell body.
      - name: Check PR title
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-pr-title.mjs --title "$PR_TITLE" --base "$BASE_SHA" --summary

      # Emits `mode`, per-lane affected gates (go_tests, snapshot,
      # journey_fresh_app, journey_passkey, journey_preexisting,
      # journey_testkit, suites_*, browsers), and the journey_matrix scope,
      # computed from moon's affected task selection. Gates fail open — unclaimed files, empty
      # diffs, and query failures all force a full run. Logic + tests:
      # scripts/ci-mode.mjs.
      - name: Detect CI mode
        id: ci-mode
        run: node scripts/ci-mode.mjs "${{ github.event.pull_request.base.sha || 'origin/main' }}"

      # Pruning variant: deletes every generated file before regenerating, so
      # output that no directive produces any more fails here instead of
      # living on in the tree. Subsumes plain `check-generate`, and keeps the
      # generators honest about bootstrapping from an empty tree.
      - name: Check Go generated files
        if: ${{ steps.ci-mode.outputs.mode == 'full' && steps.ci-mode.outputs.go_tests == 'true' }}
        run: moon run server:check-generate-pruned

      # Chromium for the e2e lanes (`e2e:all` in the graph step below). moon's
      # component/storybook browser lanes install their own through an
      # `install-browsers` dep; this covers the Playwright e2e specs.
      - name: Cache Playwright browsers
        if: ${{ steps.ci-mode.outputs.mode == 'full' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: ${{ steps.ci-mode.outputs.mode == 'full' }}
        run: corepack pnpm --filter @zitadel/e2e exec playwright install chromium

      - name: Keep Docker's interface churn away from Chromium
        if: ${{ steps.ci-mode.outputs.mode == 'full' }}
        # Every container the Go integration suites start or stop adds or removes
        # a host veth interface. With IPv6 on, the kernel gives it a link-local
        # address, and Chromium aborts every in-flight request when the host's
        # addresses change (ERR_NETWORK_CHANGED), failing whichever browser-mode
        # suite is loading at that moment. Disable IPv6 on newly created
        # interfaces only; loopback and the runner's NIC keep it. (#1490)
        run: sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1

      # Build the journey's release tarballs OUTSIDE the main graph, then hand
      # them to the journey via JOURNEY_TARBALLS_DIR. The journey must not pack
      # inside `moon ci` below: that would spawn a second, concurrent moon graph
      # (forbidden — see packages/testing/AGENTS.md) and race the dist-rewriting
      # build tasks. `release:*` are runInCI:false, so unset CI to run them.
      - name: Build release snapshot for the journey
        if: ${{ steps.ci-mode.outputs.mode == 'full' && steps.ci-mode.outputs.snapshot == 'true' }}
        run: |
          env -u CI -u GITHUB_ACTIONS moon run release:snapshot -- --skip-container
          version="$(node -p "require('./apps/server/package.json').version")"
          echo "JOURNEY_TARBALLS_DIR=$PWD/dist/release/${version}/npm" >> "$GITHUB_ENV"

      # Verdaccio proxies every public framework package the journey scaffolds
      # pull from npmjs; persisting its storage turns a dozen cold npm installs
      # into warm ones. The key is per-run so each save adds newly seen
      # packages and restore-keys pulls the most recent prior store. The journey
      # always republishes the @zitadel packages fresh (local-registry.mjs), so
      # a stale store is still valid.
      - name: Cache journey registry packages
        if: ${{ steps.ci-mode.outputs.mode == 'full' && steps.ci-mode.outputs.snapshot == 'true' }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/journey-verdaccio-storage
          key: journey-verdaccio-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            journey-verdaccio-${{ runner.os }}-

      # The e2e suites run here too: `e2e:all` depends on every lane (console
      # smoke/real/embedded/platform, demo mock/real, the CLI journey matrix, the
      # kit's real-instance suite), which depend on server:build / cli:build, so
      # moon orders and runs them through the DAG — no hand-written per-lane
      # steps. `:test` alone stays unit tests, here as in a local `pnpm run check`.
      # The journey reads the prebuilt JOURNEY_TARBALLS_DIR from the step above.
      - name: Run Moon build and test graph
        id: moon-ci
        if: ${{ steps.ci-mode.outputs.mode == 'full' }}
        # moon ci only selects tasks whose own inputs changed. --downstream deep
        # with --include-relations also runs the tasks of every project that
        # depends on a changed one, so an api change re-tests its consumers.
        run: moon ci :lint :typecheck :build :test :check-adrs :check-moon-graph e2e:all --downstream deep --include-relations
        env:
          # The journey's options, as ci-turbo.yml passes them: the work dir the
          # diagnostics upload below reads, ci-mode's framework scope (`single`
          # unless an SDK, the CLI, the test kit or the journey's own files
          # moved), and the Verdaccio
          # storage the cache step above restores.
          JOURNEY_WORK_DIR: ${{ runner.temp }}/ci-journey
          JOURNEY_MATRIX: ${{ steps.ci-mode.outputs.journey_matrix }}
          JOURNEY_REGISTRY_STORAGE: ${{ runner.temp }}/journey-verdaccio-storage

      - name: Report Moon CI failures
        if: ${{ failure() && steps.moon-ci.conclusion == 'failure' }}
        run: node scripts/report-moon-failures.mjs

      # The Go database lanes depend on the console and login UI builds their
      # binary embeds, so `moon ci` above also runs them whenever one of those
      # builds is affected, and these steps then run them a second time.
      # Folding them into the graph step (and dropping these) is a follow-up.
      - name: Run Go integration tests (postgres)
        if: ${{ steps.ci-mode.outputs.mode == 'full' && steps.ci-mode.outputs.go_tests == 'true' }}
        run: moon run server:test-postgres

      # The Spanner emulator lane is not part of this job: it runs in
      # spanner.yml (nightly and on demand) and is not a required check.

      - name: Run Go integration tests (sqlite)
        if: ${{ steps.ci-mode.outputs.mode == 'full' && steps.ci-mode.outputs.go_tests == 'true' }}
        run: moon run server:test-sqlite

      - name: Validate version PR
        if: ${{ steps.ci-mode.outputs.mode == 'version-only' }}
        run: env -u CI -u GITHUB_ACTIONS moon run release:version

      - name: Pack version PR artifacts
        if: ${{ steps.ci-mode.outputs.mode == 'version-only' }}
        run: env -u CI -u GITHUB_ACTIONS moon run release:pack

      - name: Verify version PR tarballs
        if: ${{ steps.ci-mode.outputs.mode == 'version-only' }}
        run: |
          version="$(node -p "require('./apps/server/package.json').version")"
          node e2e/journey/scripts/verify-tarballs.mjs "dist/release/${version}/npm"

      - name: Upload journey diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: journey-diagnostics
          path: ${{ runner.temp }}/ci-journey/diagnostics
          if-no-files-found: ignore
          retention-days: 7

      # Every lane's results, each in its config folder's test-results/ and
      # playwright-report/. The handshake is deliberately excluded: it carries
      # the project secret and sits beside them in .zitadel-testing/.
      - name: Upload e2e diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            e2e/*/test-results
            e2e/*/playwright-report
          if-no-files-found: ignore
          retention-days: 7
