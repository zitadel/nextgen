name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel an in-flight run when a newer commit is pushed to the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install embedded-postgres runtime deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libicu-dev libssl-dev
      - run: go vet ./...
      - run: go test -v -timeout=10m ./...

  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck
        run: corepack pnpm nx run-many -t typecheck,build,test

  npm-pack-smoke:
    runs-on: ubuntu-latest
    needs: node-check
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build packages
        run: corepack pnpm -r build

      - name: Smoke test built CLI
        run: |
          node apps/cli/dist/zitadel.js --version
          node apps/cli/dist/zitadel.js capabilities --json

      - name: Dry-run npm packs
        run: |
          for dir in apps/cli packages/sdk-core packages/sdk-next; do
            (cd "$dir" && npm pack --dry-run)
          done

      - name: Create npm package artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/zitadel-npm-packages"
          for dir in apps/cli packages/sdk-core packages/sdk-next; do
            (cd "$dir" && npm pack --pack-destination "$RUNNER_TEMP/zitadel-npm-packages")
          done
          ls -lh "$RUNNER_TEMP/zitadel-npm-packages"

      - name: Upload npm package artifacts
        uses: actions/upload-artifact@v5
        with:
          name: npm-packages
          path: ${{ runner.temp }}/zitadel-npm-packages/*.tgz
          if-no-files-found: error
          retention-days: 7

  goreleaser-snapshot:
    runs-on: ubuntu-latest
    needs: [go-test, node-check]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload GoReleaser snapshot artifacts
        uses: actions/upload-artifact@v5
        with:
          name: goreleaser-snapshot
          path: dist/**
          if-no-files-found: error
          retention-days: 7
