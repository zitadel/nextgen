name: ci

# The required check, `ci / full-pr`: the root `ci` script (package.json)
# through turbo, on the tasks the change reaches (`--affected` from the base
# below), with turbo's remote cache (docs/design/build/turborepo.md). The
# release checks are tasks of the graph too, so a Changesets version PR runs
# like any other.

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  # Every task, nightly on main; it also saves main's Go cache, the one entry
  # pull requests and merge groups can restore.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # What `--affected` compares with: the commit a merge group is built on, or
  # a pull request's base. Against main, an entry queued behind others would
  # re-test every entry ahead of it, which its own group tests. A dispatch
  # and the nightly run compare with the repository's first commit, so they
  # run every task.
  TURBO_SCM_BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || '4f5f35d2ed692a2de6966727d831a57757f7757d' }}
  # Suppress CLI telemetry for every step (https://consoledonottrack.com).
  DO_NOT_TRACK: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  # Playwright forces FORCE_COLOR=1 on its workers and web servers, and Node
  # warns on every process that also sees NO_COLOR. Blank it so only the test
  # output is left in the log.
  NO_COLOR: ""
  # No Ryuk reaper: it is the postgres lane's only image from Docker Hub,
  # whose pull rate limit then fails the lane. Every test package stops its
  # own container, and the runner goes away after the job.
  TESTCONTAINERS_RYUK_DISABLED: "true"
  # Every run reads and writes Vercel's remote cache: a pull request's later
  # pushes restore what its earlier ones built, and the merge queue writes
  # the results of the commit that lands on main.
  TURBO_CACHE: "local:rw,remote:rw"

jobs:
  full-pr:
    # GitHub's 32-core arm64 runner (the 32-arm-linux runner group), for
    # every run: the graph is CPU-bound. Its JavaScript results share the
    # remote cache with x64 runs; a Go task's key holds the toolchain and
    # target, so its entries stay apart (docs/design/build/turborepo.md).
    runs-on:
      group: 32-arm-linux
    # A run of every task, with no cache at all, takes about 7.5 minutes, so
    # 15 stops a runaway task without cutting a slow run short.
    timeout-minutes: 15
    permissions:
      contents: read
      # The remote-cache step trades this for a Turborepo token.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # The base `--affected` compares with.
          fetch-depth: 0

      # A version PR has to land on its own: release-publish finds the version
      # commit from the diff of the push, which would also hold every PR the
      # queue squashed it onto, and then refuses to publish. This drops such a
      # version PR from the queue instead; queue it again once the PRs ahead
      # of it land. Any other merge group skips.
      - name: Check a queued version PR lands alone
        if: ${{ github.event_name == 'merge_group' }}
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: node scripts/release-automation.mjs publish --base "$BASE_SHA"

      # The postgres lane starts its databases through testcontainers, and
      # every package of the lane waits while the first one pulls the image.
      # Pull it in the background while the job installs; the name comes from
      # the testdb package, so the two cannot drift. Both registries serve the
      # same official image.
      - name: Pull the postgres lane's image
        run: |
          image="$(sed -n 's/^const containerImage = "\(.*\)"$/\1/p' apps/api/internal/storage/testdb/postgres.go)"
          if [ -z "$image" ]; then
            echo "::warning::apps/api/internal/storage/testdb/postgres.go has no containerImage constant; nothing to pull"
            exit 0
          fi
          nohup bash -c '
            if ! docker pull --quiet "$1"; then
              fallback="docker.io/${1#public.ecr.aws/docker/}"
              docker pull --quiet "$fallback" &&
                docker tag "$fallback" "$1"
            fi
          ' -- "$image" </dev/null >"$RUNNER_TEMP/postgres-image-pull.log" 2>&1 &

      # Keyed on go.work and every module's go.sum, so the entry holds what
      # this job compiles; a key keeps its first save. A pull request or a
      # merge group restores its own entry or main's, which the nightly run
      # saves.
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: |
            go.work
            apps/api/go.sum
            packages/go/go.sum
            tools/bench/go.sum
            tools/oidc-mock/go.sum
            go.work.sum

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # Vercel's remote cache over OIDC: the TURBO_TEAM repository variable
      # and the team's Turborepo CLI policy for this repository. Forks get no
      # token and run with the local cache only, as does any run whose
      # exchange fails (the step prints Vercel's answer).
      - name: Set up Turborepo remote cache
        id: remote-cache
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Use the local cache only without a token
        if: ${{ steps.remote-cache.outcome != 'success' }}
        run: echo "TURBO_CACHE=local:rw" >> "$GITHUB_ENV"

      # `changeset status` (`@zitadel/release#check-changesets`) compares HEAD
      # with the base branch by its local name, which only a checkout of main
      # has.
      - name: Give the checkout a local main
        run: git rev-parse --verify --quiet refs/heads/main >/dev/null || git branch main origin/main

      # Chromium aborts every in-flight request when the host gains or loses
      # an IP address (ERR_NETWORK_CHANGED), and each container the postgres
      # lane starts beside the browser lanes adds a link-local IPv6 address.
      # Off on interfaces created from here on and on docker0. (#1490)
      - name: Keep Docker's interface churn away from Chromium
        run: |
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1
          if [ -d /proc/sys/net/ipv6/conf/docker0 ]; then
            sudo sysctl -w net.ipv6.conf.docker0.disable_ipv6=1
          fi

      # In GitHub Actions turbo groups each task's log and annotates every
      # failed task itself (`::error::`). A task per core: the graph is
      # CPU-bound, and turbo's default of 10 leaves this runner's cores idle.
      # The script itself keeps the default, since a task per core overloads
      # a laptop and its tests time out; pnpm appends the flag to its
      # `turbo run`.
      - name: Run the ci script
        run: corepack pnpm run ci --concurrency=100%
        env:
          # Each journey's work dir, with its diagnostics, under this one.
          JOURNEY_WORK_DIR: ${{ runner.temp }}/ci-journey

      # Every lane's results and the journeys' diagnostics. The handshake is
      # left out: it carries the project secret and sits beside them in
      # .zitadel-testing/.
      - name: Upload diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics
          path: |
            e2e/*/test-results
            e2e/*/playwright-report
            ${{ runner.temp }}/ci-journey/*/diagnostics
            packages/components/test-output/vitest/junit.xml
            packages/components/src/**/__screenshots__/**
            packages/api-mock/test-output/vitest/junit.xml
          if-no-files-found: ignore
          retention-days: 7
