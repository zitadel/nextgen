name: ci

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full-pr:
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@v0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          # Parity with release-publish.yml: the publish job configures the
          # npm registry, so the rehearsal must run under the same setup.
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Detect CI mode
        id: ci-mode
        run: node scripts/ci-mode.mjs "${{ github.event.pull_request.base.sha || 'origin/main' }}"

      - name: Check Go generated files
        if: ${{ steps.ci-mode.outputs.mode == 'full' }}
        run: moon run server:check-generate

      - name: Run Moon build and test graph
        if: ${{ steps.ci-mode.outputs.mode == 'full' }}
        run: moon ci :lint :typecheck :build :test

      - name: Run Go tests
        if: ${{ steps.ci-mode.outputs.mode == 'full' }}
        run: moon run server:test

      - name: Run Go integration tests (postgres)
        if: ${{ steps.ci-mode.outputs.mode == 'full' }}
        run: moon run server:test-postgres

      # Spanner integration tests are not run in CI yet: the v2 spanner statement
      # layer is unimplemented (see zitadel/nextgen#457). Re-enable via
      # `moon run server:test-spanner` once that lands.

      - name: Rehearse release publish (dry run)
        if: ${{ steps.ci-mode.outputs.mode == 'full' }}
        # Environment parity with the release-publish publish job: unset only
        # CI (keep GITHUB_ACTIONS), provide GITHUB_TOKEN, disable provenance.
        # Code that behaves differently in the publish environment breaks
        # here, on the offending PR, instead of on release day. The compose
        # deployment smoke joins in when the diff touches the deploy surface.
        run: |
          args=(release:rehearse)
          if [ "${DEPLOY_SMOKE}" = "true" ]; then
            args+=(-- --smoke)
          fi
          env -u CI moon run "${args[@]}"
        env:
          DEPLOY_SMOKE: ${{ steps.ci-mode.outputs.deploy_smoke }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "false"
          ZITADEL_SMOKE_DIAGNOSTICS_DIR: ${{ runner.temp }}/deploy-smoke/diagnostics

      - name: Run binary fresh-app journey
        if: ${{ steps.ci-mode.outputs.mode == 'full' }}
        run: |
          version="$(node -p "require('./apps/server/package.json').version")"
          env -u CI -u GITHUB_ACTIONS moon run cli-journey-e2e:e2e-local -- \
            --runtime binary \
            --concurrency 5 \
            --work-dir "${RUNNER_TEMP}/ci-journey" \
            --tarballs-dir "dist/release/${version}/npm"

      - name: Rehearse version PR publish (dry run with npm rehearsal)
        if: ${{ steps.ci-mode.outputs.mode == 'version-only' }}
        # The version PR is the last gate before the exact publishing commit:
        # rehearse everything, including a real `npm publish` of every tarball
        # to a throwaway local Verdaccio through the production promotion
        # path, and a compose deployment smoke of the built image.
        run: env -u CI moon run release:rehearse -- --npm-rehearsal --smoke
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "false"
          ZITADEL_SMOKE_DIAGNOSTICS_DIR: ${{ runner.temp }}/deploy-smoke/diagnostics

      - name: Verify version PR tarballs
        if: ${{ steps.ci-mode.outputs.mode == 'version-only' }}
        run: |
          version="$(node -p "require('./apps/server/package.json').version")"
          node apps/cli-journey-e2e/scripts/verify-tarballs.mjs "dist/release/${version}/npm"

      - name: Upload release snapshot
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-snapshot
          path: dist/release
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload journey diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: journey-diagnostics
          path: |
            ${{ runner.temp }}/ci-journey/diagnostics
            ${{ runner.temp }}/deploy-smoke/diagnostics
          if-no-files-found: ignore
          retention-days: 7
