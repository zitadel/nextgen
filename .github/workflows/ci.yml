name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel an in-flight run when a newer commit is pushed to the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # lint openapi
      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Run OpenAPI linting
        run: npx --yes @redocly/cli@1.34.5 lint api/openapi/openapi-spec.yaml --format=github-actions

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install embedded-postgres runtime deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libicu-dev libssl-dev
      - run: go generate ./...
      - name: Verify generated code is up to date
        run: |
          git diff --stat --exit-code -- .
          test -z "$(git status --porcelain)"
      - run: go vet ./...
      - run: go test -v -timeout=10m ./...

  go-test-spanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -v -tags spanner_integration -timeout=10m ./internal/storage/database/repository/...

  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Node checks
        run: corepack pnpm nx run-many -t lint,typecheck,build,test

  node-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # The Playwright cache is keyed by the resolved version in
      # pnpm-lock.yaml so a Playwright bump invalidates it automatically.
      # Browsers live under ~/.cache/ms-playwright on Linux.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # `pnpm exec` from the workspace root cannot find the `playwright`
      # binary on a clean CI checkout because @playwright/test is a dep of
      # the e2e packages only, not of root. Scoping the exec with --filter
      # routes through that workspace's node_modules/.bin.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: >-
          corepack pnpm --filter @nextgen/demo-next-e2e
          exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: >-
          corepack pnpm --filter @nextgen/demo-next-e2e
          exec playwright install-deps chromium

      # Boots the demo dev servers + api-mock through Playwright's webServer
      # config; Nx rebuilds @zitadel-nextgen/components first via ^build.
      # console-e2e has no specs yet — it's intentionally excluded until
      # Playwright would otherwise fail with "no tests found".
      #
      # --parallel=1 serialises the two e2e projects because each spawns its
      # own @zitadel-nextgen/api-mock on the shared port 4000 — running them
      # concurrently produces EADDRINUSE on the second project. Per-project
      # ports would require diverging next.config / nuxt.config proxy
      # targets and is not worth the complexity for a ~30s CI saving.
      - name: End-to-end tests
        run: >-
          corepack pnpm nx run-many -t e2e
          -p @nextgen/demo-next-e2e,@nextgen/demo-nuxt-e2e
          --parallel=1

      - name: Upload Playwright reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/demo-next-e2e/test-output/playwright/report/**
            apps/demo-nuxt-e2e/test-output/playwright/report/**
            apps/demo-next-e2e/test-output/playwright/output/**
            apps/demo-nuxt-e2e/test-output/playwright/output/**
          if-no-files-found: ignore
          retention-days: 7

  npm-pack-smoke:
    runs-on: ubuntu-latest
    needs: node-check
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build packages
        run: corepack pnpm nx run-many -t build

      - name: Smoke test built CLI
        run: |
          node apps/cli/dist/zitadel.mjs --version
          node apps/cli/dist/zitadel.mjs capabilities --json

      - name: Dry-run npm packs
        run: |
          for dir in apps/cli packages/sdk-core packages/sdk-next; do
            (cd "$dir" && npm pack --dry-run)
          done

      - name: Create npm package artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/zitadel-npm-packages"
          for dir in apps/cli packages/sdk-core packages/sdk-next; do
            (cd "$dir" && npm pack --pack-destination "$RUNNER_TEMP/zitadel-npm-packages")
          done
          ls -lh "$RUNNER_TEMP/zitadel-npm-packages"

      - name: Upload npm package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: ${{ runner.temp }}/zitadel-npm-packages/*.tgz
          if-no-files-found: error
          retention-days: 7

  goreleaser-snapshot:
    runs-on: ubuntu-latest
    needs: [go-test, go-test-spanner, node-check]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload GoReleaser snapshot artifacts
        uses: actions/upload-artifact@v7
        with:
          name: goreleaser-snapshot
          path: dist/**
          if-no-files-found: error
          retention-days: 7
