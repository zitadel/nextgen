name: cloud-preview-cleanup

# The preview cloud deploys itself: Vercel builds every push (vercel.json,
# git.deploymentEnabled), and the server service's build step runs the
# migrations before the deployment goes live (apps/cloud/vercel-build.sh,
# `launcher migrate`). Production migrates only from main, a pull request
# preview migrates its own schema pr_<number> of the preview database. The
# only thing Vercel cannot do on its own is forget a schema when its pull
# request closes; that is this workflow.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  drop-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Drop the preview schema of this pull request
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_CLOUD_PREVIEW_DATABASE_URL }}
          SCHEMA: pr_${{ github.event.pull_request.number }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "PREVIEW_CLOUD_PREVIEW_DATABASE_URL is not set; nothing to drop"
            exit 0
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP SCHEMA IF EXISTS $SCHEMA CASCADE"
          echo "dropped $SCHEMA"
