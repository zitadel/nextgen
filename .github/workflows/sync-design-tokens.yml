name: sync-design-tokens

# Regenerates @zitadel/design-tokens from Figma and opens (or updates) a review PR.
#
# Triggers:
#   - push to design-tokens/figma-sync (figma-export/**) — Community plugin push
#   - workflow_dispatch — manual re-run or Enterprise REST sync
#
# Never auto-merges. Push trigger is scoped to figma-export/** only so commits
# from create-pull-request (generated CSS/TS) do not re-trigger this workflow.

on:
  push:
    branches:
      - design-tokens/figma-sync
    paths:
      - packages/design-tokens/figma-export/**
  workflow_dispatch:
    inputs:
      source:
        description: "Sync source"
        required: true
        default: export
        type: choice
        options:
          - export
          - figma-rest
      figma_version:
        description: >-
          Published library version for figma-rest only (optional).
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: design-tokens-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@v6
        with:
          ref: >-
            ${{
              github.event_name == 'push'
              && 'design-tokens/figma-sync'
              || github.ref
            }}
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@v0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Pin requested Figma library version
        if: >-
          github.event_name == 'workflow_dispatch'
          && inputs.source == 'figma-rest'
          && inputs.figma_version != ''
        run: |
          jq --arg v "${{ inputs.figma_version }}" \
             --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             --arg by "${{ github.actor }}" \
             '.version = $v | .pulledAt = $t | .pulledBy = $by' \
             packages/design-tokens/figma-tokens.lock > packages/design-tokens/figma-tokens.lock.tmp
          mv packages/design-tokens/figma-tokens.lock.tmp packages/design-tokens/figma-tokens.lock

      - name: Sync from committed DTCG export
        if: >-
          github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && inputs.source == 'export')
        run: moon run design-tokens:sync-export

      - name: Pull tokens from Figma REST (Enterprise path)
        if: >-
          github.event_name == 'workflow_dispatch'
          && inputs.source == 'figma-rest'
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: moon run design-tokens:sync

      - name: Regenerate token artifacts
        run: moon run design-tokens:generate

      - name: Run snapshot test
        run: moon run design-tokens:test
        continue-on-error: true

      - name: Open or update PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: design-tokens/figma-sync
          base: main
          delete-branch: false
          title: "chore(design-tokens): sync from Figma"
          commit-message: "chore(design-tokens): sync from Figma"
          body: |
            Automated design-token sync from the Zitadel Design System.

            **Trigger:** ${{ github.event_name }}${{ github.event_name == 'push' && format(' (push by {0})', github.actor) || '' }}

            **Before merging:**
            1. Review `packages/design-tokens/figma-export/` and `src/generated/`.
            2. If the snapshot test failed, update consumers or the snapshot intentionally.
            3. Spot-check console light + dark in `apps/console`.

            Repeat syncs before merge append commits to this PR instead of opening a new one.
          add-paths: |
            packages/design-tokens/figma-export/**
            packages/design-tokens/figma-tokens.lock
            packages/design-tokens/src/generated/figma.tokens.json
            packages/design-tokens/src/generated/tokens.css
            packages/design-tokens/src/generated/tokens.ts
            packages/design-tokens/src/generated/tailwind.css
