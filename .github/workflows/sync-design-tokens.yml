name: sync-design-tokens

# Pulls the published Variables of the Zitadel Design System Figma library
# into `packages/design-tokens/src/generated/figma.tokens.json`, regenerates
# the CSS / TS / Tailwind outputs, and opens a PR with the diff.
#
# Never auto-merges. The PR is the review gate: a designer change ships
# only when a maintainer reads the diff, runs the snapshot test, and
# merges intentionally.

on:
  workflow_dispatch:
    inputs:
      figma_version:
        description: >-
          Published library version to pin (e.g. "1.42.0" or a Figma
          library version id). Optional — defaults to whatever
          figma-tokens.lock already says, in which case this is a
          re-sync of the current pinned version.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Pin requested Figma library version
        if: ${{ inputs.figma_version != '' }}
        run: |
          jq --arg v "${{ inputs.figma_version }}" \
             --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             --arg by "${{ github.actor }}" \
             '.version = $v | .pulledAt = $t | .pulledBy = $by' \
             packages/design-tokens/figma-tokens.lock > packages/design-tokens/figma-tokens.lock.tmp
          mv packages/design-tokens/figma-tokens.lock.tmp packages/design-tokens/figma-tokens.lock

      - name: Pull tokens from Figma
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: corepack pnpm nx run @zitadel-nextgen/design-tokens:sync

      - name: Regenerate token artifacts
        run: corepack pnpm nx run @zitadel-nextgen/design-tokens:generate

      - name: Run snapshot test
        # Snapshot will fail if any public token name changed. That's the
        # signal the PR reviewer needs — either consumers need updating
        # before this PR can merge, or the snapshot needs an intentional
        # bump in the same PR.
        run: corepack pnpm nx run @zitadel-nextgen/design-tokens:test
        continue-on-error: true

      - name: Open PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: design-tokens/sync-${{ github.run_id }}
          base: main
          title: "chore(design-tokens): sync from Figma"
          commit-message: "chore(design-tokens): sync from Figma library"
          body: |
            Automated sync from the Zitadel Design System Figma library.

            - Lock file pinned to `${{ inputs.figma_version || 'previous value' }}`
            - Triggered by @${{ github.actor }} via workflow_dispatch

            **Before merging:**
            1. Review every change in `packages/design-tokens/src/generated/`.
            2. If the snapshot test failed, update `src/tokens.snapshot.spec.ts`
               *only* if every consumer of the renamed/removed token has been
               updated in this PR or a follow-up. Never blanket-accept.
            3. Verify visual parity in `apps/console` and the dev playground.
          add-paths: |
            packages/design-tokens/figma-tokens.lock
            packages/design-tokens/src/generated/figma.tokens.json
            packages/design-tokens/src/generated/tokens.css
            packages/design-tokens/src/generated/tokens.ts
            packages/design-tokens/src/generated/tailwind.css
