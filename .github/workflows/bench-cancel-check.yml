name: bench-cancel-check
# TEMPORARY: proves the lane tears down when the job is cancelled. Removed before merge.
on:
  pull_request:
    paths: [".github/workflows/bench-cancel-check.yml"]
permissions:
  contents: read
jobs:
  cancel:
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 20
    env:
      BENCH_PARTITION_MODE: host
      BENCH_SERVER_BIN: dist/nextgen-server
      BENCH_ALLOW_DISK_KINDS: network-block virtual-disk
      BENCH_CORES_SYSTEM: 1
      BENCH_CORES_SERVER: 2
      BENCH_CORES_DB: 2
      BENCH_CORES_COLLECTOR: 1
      BENCH_CORES_LOADGEN: 2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o dist/nextgen-server .
      - run: echo "BENCH_DATA_ROOT=$RUNNER_TEMP/bench-data" >> "$GITHUB_ENV"
      - name: Bring the postgres lane up
        run: |
          echo "BENCH_PG_BIN=$(dirname "$(find /usr/lib/postgresql -path '*/bin/initdb' | sort -V | tail -n 1)")" >> "$GITHUB_ENV"
          BENCH_PG_BIN=$(dirname "$(find /usr/lib/postgresql -path '*/bin/initdb' | sort -V | tail -n 1)") BENCH_RUN_DIR=$PWD/dist/bench-run/postgres .github/bench/bin/bench-lane up postgres
      - name: Hold the lane up so the job can be cancelled
        run: |
          echo "CANCEL ME NOW: lane is up"
          ps -eo pid,user,comm,cgroup | grep -E "nextgen-server|postgres" | head
          sleep 900
      - name: Tear the lane down (always)
        if: ${{ always() }}
        run: |
          echo "TEARDOWN STEP RAN"
          .github/bench/bin/bench-lane down
          .github/bench/bin/bench-lane assert-clean
          echo "processes left:"; ps -eo pid,user,comm,cgroup | grep -E "nextgen-server|postgres" | grep -v grep || echo none
          ls -d /sys/fs/cgroup/bench-lane 2>&1 | head -1
          echo "root cpuset.cpus.effective: $(cat /sys/fs/cgroup/cpuset.cpus.effective)"
