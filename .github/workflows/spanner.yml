name: spanner

# The Spanner suite, split out of ci.yml's required `full-pr` job. Spanner
# support is not on the critical path at this stage, so the lane runs here
# instead: weekly on main (Mondays, 03:00 UTC), on demand against any branch
# (`gh workflow run spanner.yml --ref <branch>`), and on PRs that change this
# file. It is not a required check.
#
# It runs against Spanner Omni, Google's self-hosted Spanner, started once per
# job. Each test package provisions its own database on it (#1011).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
  pull_request:
    paths:
      - .github/workflows/spanner.yml

permissions:
  contents: read

concurrency:
  group: spanner-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spanner-omni:
    # A plain GitHub-hosted runner: its 4 vCPUs and 16 GB are Spanner Omni's
    # documented minimum for a VM.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # See ci.yml: Ryuk would be the lane's only image from Docker Hub.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: apps/api/go.sum

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # test:spanner depends on the console's build, which the Go //go:embed
      # needs.
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # Host networking, because Omni hands clients its own addresses and they
      # must be reachable from the runner. Pinned by digest: an Omni upgrade
      # moves every timing this lane reports. The log tail step below shows
      # Omni's output if it never gets ready.
      - name: Start Spanner Omni
        run: |
          docker run -d --name omni --network host \
            "us-docker.pkg.dev/spanner-omni/images/spanner-omni:2026.r4-lts@sha256:9dcfd3d25f25fb608436c98678311197e15fb3ab25f354f721d10ed2b1208939" \
            start-single-server
          timeout 180 sh -c 'until docker logs omni 2>&1 | grep -q "Spanner is ready"; do sleep 2; done' \
            || { echo "::error::Spanner Omni was not ready after 180s"; exit 1; }

      # ZITADEL_TEST_SPANNER_INSTANCE makes every package provision its own
      # database on the Omni instance instead of starting an emulator.
      # SPANNER_EMULATOR_HOST keeps its name although nothing here is an
      # emulator: it is the Go client library's own variable, the only one that
      # points it at a plaintext endpoint without credentials, which Omni's
      # Developer edition serves.
      - name: Run Go integration tests (Spanner Omni)
        env:
          ZITADEL_TEST_SPANNER_INSTANCE: projects/default/instances/default
          SPANNER_EMULATOR_HOST: localhost:15000
        run: corepack pnpm exec turbo run @zitadel/server#test:spanner

      - name: Spanner Omni log tail
        if: ${{ always() }}
        run: docker logs omni 2>&1 | tail -40 || true
