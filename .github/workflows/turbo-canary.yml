name: turbo-canary

# The ground truth behind the turbo graph's inputs
# (docs/design/build/turborepo-graph.md). Pull requests and the merge queue
# run only the tasks a change reaches, and restore the rest from the cache;
# both are only as right as the graph's inputs. Every night this job checks
# them without a cache: scripts/check-turbo-hermetic.mjs deletes every
# tracked file no task claims, builds without the test and docs files the
# builds leave out, then runs the whole gate. A failure here, on a main that
# passed its own gate, means a task reads a file its inputs do not name.
# Reproduce it with `pnpm run check-turbo-hermetic -- --keep`, which keeps
# the stripped tree.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turbo-canary
  cancel-in-progress: true

jobs:
  hermetic:
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 90
    env:
      DO_NOT_TRACK: "1"
      NO_COLOR: ""
      TURBO_TELEMETRY_DISABLED: "1"
      # Every task runs; nothing is read from or written to a remote cache.
      TURBO_CACHE: local:rw
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # As in ci.yml: the browser suites must not see Docker's address churn
      # (#1490). Nothing here starts a container, but the runner may.
      - name: Keep Docker's interface churn away from Chromium
        run: |
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1
          if [ -d /proc/sys/net/ipv6/conf/docker0 ]; then
            sudo sysctl -w net.ipv6.conf.docker0.disable_ipv6=1
          fi

      - name: Run the gate on what the graph hashes alone
        run: node scripts/check-turbo-hermetic.mjs
