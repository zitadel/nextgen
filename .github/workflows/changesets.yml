name: changesets

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Belt-and-suspenders gate: only fire on actual pushes to main with a
    # workspace present. The `on.push.branches` filter at the top should
    # already prevent non-main pushes, but an explicit ref check makes it
    # impossible to accidentally fan out to PR branches.
    if: |
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && hashFiles('pnpm-workspace.yaml') != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Build
        run: corepack pnpm -r build

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: corepack pnpm -r publish --access public --no-git-checks
          version: corepack pnpm changeset version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
