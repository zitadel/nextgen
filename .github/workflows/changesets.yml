name: changesets

# IMPORTANT: this workflow is intentionally `workflow_dispatch` only until
# the npm workspace actually lands on main (PR #11 + #14). When `branches:
# [main]` was used, GitHub kept firing the workflow on PR feature branches
# (apparently because no workflows existed on main yet to compare filters
# against), producing red empty-jobs runs on every push.
#
# When pnpm-workspace.yaml lands on main, swap the trigger to:
#   on:
#     push:
#       branches: [main]
#       paths: [pnpm-workspace.yaml, .changeset/**, packages/**, apps/cli/**]
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Defense in depth: even when the trigger is re-enabled, refuse to run
    # without the npm workspace present.
    if: hashFiles('pnpm-workspace.yaml') != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Build
        run: corepack pnpm -r build

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: corepack pnpm -r publish --access public --no-git-checks
          version: corepack pnpm changeset version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
