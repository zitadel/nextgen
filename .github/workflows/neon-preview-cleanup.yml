name: neon-preview-cleanup

# Deletes the Neon branch that Neon's Vercel integration created for a
# preview deployment (preview/<git branch>, see apps/cloud/README.md) as soon
# as the pull request closes or its branch is deleted. Without this the branch
# lives until Vercel deletes the preview deployment, which its retention
# policy delays by months, and every branch counts against the Neon
# project's branch allowance.
#
# Needs the repository variable NEON_PROJECT_ID and the secret NEON_API_KEY;
# without them the job logs that it has nothing to do.

on:
  pull_request:
    types: [closed]
  delete:

permissions: {}

concurrency:
  # A merge fires both events (the PR closes, then its branch is deleted);
  # one run per branch at a time, so the second finds the branch gone.
  group: neon-preview-cleanup-${{ github.event.pull_request.head.ref || github.event.ref }}

jobs:
  delete-preview-branch:
    # Fork pull requests get no secrets, and Vercel does not deploy them.
    if: >-
      (github.event_name == 'delete' && github.event.ref_type == 'branch') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 5
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      # Through the environment, never interpolated into the script: a branch
      # name is author-controlled.
      GIT_BRANCH: ${{ github.event.pull_request.head.ref || github.event.ref }}
    steps:
      - name: Delete preview/<branch>
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "NEON_API_KEY or NEON_PROJECT_ID is not configured; nothing to delete."
            exit 0
          fi
          name="preview/${GIT_BRANCH}"
          api="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches"
          id="$(curl -fsS -G "$api" --data-urlencode "search=${name}" \
              -H "Authorization: Bearer ${NEON_API_KEY}" \
            | jq -r --arg name "$name" '.branches[] | select(.name == $name) | .id')"
          if [ -z "$id" ]; then
            echo "No Neon branch ${name}; nothing to delete."
            exit 0
          fi
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE "${api}/${id}" \
            -H "Authorization: Bearer ${NEON_API_KEY}")"
          case "$status" in
            200 | 202 | 404) echo "Deleted Neon branch ${name} (${id}): HTTP ${status}." ;;
            *) echo "::error::Deleting Neon branch ${name} (${id}) failed: HTTP ${status}"; exit 1 ;;
          esac
