name: bench-probe
# TEMPORARY: reads what Depot runner sizes expose. Removed before merge.
on:
  pull_request:
    paths: [".github/workflows/bench-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    if: ${{ !github.event.pull_request.head.repo.fork }}
    strategy:
      fail-fast: false
      matrix:
        size: [8, 32, 64]
    runs-on: depot-ubuntu-24.04-${{ matrix.size }}
    timeout-minutes: 10
    steps:
      - name: Facts
        run: |
          set +e
          echo "== dmi: $(cat /sys/class/dmi/id/product_name 2>&1) cpus=$(nproc) $(lscpu | grep -E 'Model name|Thread|Core\(s\)' | tr -s ' ' | tr '\n' ';')"
          echo "controllers: $(cat /sys/fs/cgroup/cgroup.controllers) | subtree: $(cat /sys/fs/cgroup/cgroup.subtree_control)"
          echo "mem: $(grep MemTotal /proc/meminfo)"
          lsblk -o NAME,ROTA,TYPE,SIZE,MODEL,MOUNTPOINT 2>&1 | grep -v loop
          for d in /sys/block/nvme*; do echo "$d model=$(cat $d/device/model) serial=$(cat $d/device/serial) "; done
          df -T / /mnt /tmp 2>&1 | head -5
          echo "siblings sample: $(cat /sys/devices/system/cpu/cpu0/topology/thread_siblings_list)"
