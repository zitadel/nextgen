name: bench-probe
# TEMPORARY: reads the storage a Depot runner exposes. Removed before merge.
on:
  pull_request:
    paths: [".github/workflows/bench-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    if: ${{ !github.event.pull_request.head.repo.fork }}
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2]
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 10
    steps:
      - name: Storage
        run: |
          set +e
          echo "machine: $(cat /sys/class/dmi/id/product_name) cpus=$(nproc) threads/core=$(lscpu | awk -F: '/Thread/ {print $2}')"
          lsblk -o NAME,KNAME,TYPE,SIZE,ROTA,MODEL,MOUNTPOINT | grep -v loop
          sudo dmsetup table 2>&1 | cut -c1-160
          echo "root mount: $(findmnt -n -o SOURCE,MAJ:MIN,FSTYPE /)"
          for d in /sys/block/dm-*; do echo "$d name=$(cat $d/dm/name) slaves=$(ls $d/slaves | tr '\n' ' ')"; done
          cd "$RUNNER_TEMP"
          echo "== fsync latency (dd 4k x 2000, oflag=dsync) in RUNNER_TEMP:"; dd if=/dev/zero of=probe.bin bs=4k count=2000 oflag=dsync 2>&1 | tail -1
          echo "== same in /dev/shm:"; dd if=/dev/zero of=/dev/shm/probe.bin bs=4k count=2000 oflag=dsync 2>&1 | tail -1
          rm -f probe.bin /dev/shm/probe.bin
