name: spike-cli-windows

on:
  workflow_dispatch:
  push:
    branches: [spike/cli-windows-smoke]
  pull_request:
    paths:
      - .github/workflows/spike-cli-windows.yml
      - .github/spike/**

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: apps/api/go.sum

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build the CLI and the Windows server binary from this ref
        run: |
          corepack pnpm exec turbo run build --filter=@zitadel/cli
          corepack pnpm exec turbo run build-binary --filter=@zitadel/server-win32-x64 --output-logs=errors-only

      - name: Exercise the CLI
        run: bash .github/spike/exercise.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-findings
          path: |
            ${{ runner.temp }}/summary.md
            ${{ runner.temp }}/dev.log
            ${{ runner.temp }}/host/.zitadel/local/server.log
