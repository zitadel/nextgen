# PostgreSQL settings for the benchmark lane, included from postgresql.conf of
# the fresh cluster each run. Everything listed here is a non-default setting;
# the run metadata records the full set the server reports, this file is the
# part that was chosen. The port, listen address and socket directory are
# appended per run by bench-lane (loopback TCP only, no Unix socket).
#
# Sized for BENCH_MEM_DB_MIB = 4096: shared_buffers and the per-connection
# memory must fit under the database cgroup's memory.max with room for the
# page cache and the backends, or the window is invalid (OOM).
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB
max_connections = 200
# Durability stays on: the lane measures what the server does against a
# database that fsyncs, like the SQLite lane's synchronous=NORMAL WAL does.
fsync = on
synchronous_commit = on
# Quiet logs: the log file is on the measured disk.
log_min_messages = warning
log_checkpoints = off
