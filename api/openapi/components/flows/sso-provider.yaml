type: object
additionalProperties: false
required: [id, name, template]
description: An available SSO identity provider.
properties:
  id:
    type: string
    description: The connection's slug, echoed back as `sso_provider_id` on the submit.
    example: google
  name:
    type: string
    description: Display name for the provider.
    example: Google
  template:
    type: string
    description: Template hint for rendering (logo, colors).
    example: google
