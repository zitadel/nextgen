type: object
required: [name, fields, actions, gates]
description: |
  A step contains ordered capability arrays: what to collect (fields),
  what the user can do (actions), and what security gates must be satisfied (gates).
  The LiquidJS template in `branding.liquid_template` iterates these arrays in order
  and builds name-keyed indexes locally for lookup.
example:
  name: login
  texts:
    title_key: login.title
    description_key: login.description
  fields:
    - name: email
      type: email
      text_key: login.field.email
      required: true
    - name: password
      type: password
      text_key: login.field.password
      required: true
  actions:
    - name: submit
      kind: submit
      text_key: login.action.submit
      primary: true
    - name: register
      kind: navigate
      text_key: login.action.register
    - name: recover
      kind: navigate
      text_key: login.action.recover
  gates:
    captcha:
      kind: captcha
      provider: altcha
      config:
        algorithm: SHA-256
        challenge: abc123
        salt: xyz789
        max_number: 100000
  sso_providers:
    - id: google
      name: Google
      template: google
    - id: entra
      name: Microsoft
      template: entraid
properties:
  name:
    type: string
    description: Step name from the flow definition.
  texts:
    $ref: step-texts.yaml
  error:
    oneOf:
      - type: string
      - type: 'null'
    description: |
      Error from a previous failed submission. Field-validation failures
      carry localisation text keys: `error.<field>_<rule>` per violation
      (e.g. `error.email_required`; the `format` rule is spelled
      `error.<field>_invalid`), multiple violations joined with `"; "`.
      Field names appear verbatim, so clients localise unknown keys via
      the generic `error.field_<rule>` catalog entries. Other engine
      failures carry `error.*` catalog keys as well (e.g.
      `error.invalid_credentials`, `error.passkey_invalid`); a
      non-`error.` payload is an outcome token (e.g. `user_not_found`)
      that clients keep verbatim.
  complete:
    type: string
    enum: [redirect, show]
    description: |
      Present only on terminal steps. Tells the frontend what to do:
      - redirect: navigate to redirect_uri immediately (OIDC/SAML done)
      - show: render the step as a success screen (e.g., registration confirmed)
  redirect_url:
    type: string
    format: uri
    description: URL to navigate to (e.g., SSO provider redirect).
  fields:
    type: array
    description: |
      Ordered list of input fields to collect. Field metadata (type, validation)
      is resolved by the engine from the flow's user schema. The LiquidJS
      template iterates this array; for keyed lookup it builds a name-indexed
      map locally.
    items:
      $ref: field.yaml
    default: []
  actions:
    type: array
    description: |
      Ordered list of available user actions. The LiquidJS template iterates
      this array and builds a name-indexed map locally for keyed lookup.
    items:
      $ref: step-action.yaml
    default: []
  gates:
    type: object
    description: |
      Security gates that must be satisfied before the step can be submitted.
      The engine injects gates dynamically based on policy, even if they
      are not declared in the flow definition.
    additionalProperties:
      $ref: gate.yaml
    default: {}
  sso_providers:
    type: array
    description: Available SSO identity providers for this step.
    items:
      $ref: sso-provider.yaml
    default: []
  challenge:
    type: object
    description: |
      A pending authentication challenge issued by the server. Present when the
      flow engine has issued a challenge via auth_attempts (e.g., after the user
      submits `action: "passkey"`). The `<zl-passkey>` component reads this and
      triggers the appropriate WebAuthn ceremony.

      The challenge is NOT present on the initial step — it appears only after
      the user explicitly selects a ceremony-based action.
    properties:
      method:
        type: string
        enum: [passkey, passkey_register]
        description: Challenge method. Determines which component handles the ceremony.
      challenge_id:
        type: string
        description: |
          Server-side challenge identifier. Included in the proof submission
          so the server can match the response to the original challenge.
      options:
        type: object
        description: |
          Protocol-specific challenge options. For passkey, this is the
          `PublicKeyCredentialRequestOptions` (authenticate) or
          `PublicKeyCredentialCreationOptions` (register). Passed directly
          to the browser's `navigator.credentials` API.
        additionalProperties: true
