type: object
required: [type]
description: |
  A client-side ceremony that must complete before this action can be submitted.
  When an action has a `ceremony`, the orchestrator triggers the ceremony
  (e.g., WebAuthn browser API) and includes the result in `ceremony_proof`
  on the submit request.

  The `type` determines which browser API or SDK the orchestrator invokes.
  The `options` carry protocol-specific configuration passed directly to
  the browser API.
properties:
  type:
    type: string
    enum: [passkey]
    description: |
      Ceremony type. Determines which browser API the orchestrator calls:
      - `passkey`: WebAuthn — calls `navigator.credentials.create()` (register)
        or `navigator.credentials.get()` (authenticate) based on `options`.

  mediation:
    type: string
    enum: [conditional, optional, required, silent]
    default: optional
    description: |
      Maps to `CredentialRequestOptions.mediation` (authenticate only).
      Controls how the browser prompts the user:
      - `conditional`: passkeys appear in the email field's autofill dropdown.
        Non-intrusive — no modal on page load. The orchestrator auto-adds
        `autocomplete="username webauthn"` to email fields on the same step.
      - `optional` (default): browser decides — usually shows a modal.
      - `required`: always shows a modal.
      - `silent`: no prompt (only if exactly one credential matches).

  options:
    $ref: passkey-config.yaml
