type: object
required: [id, project_id, flow_definition, created_at, updated_at]
properties:
  id:
    type: string
    description: Unique identifier for the flow definition.
    example: fd_123abc456def
  project_id:
    type: string
    description: Identifier of the project this flow definition belongs to.
    example: proj_789ghi012jkl
  flow_definition:
    $ref: flow-definition.yaml
  user_schema:
    readOnly: true
    description: |
      The user schema this flow operates on: the same object
      `GET /schemas/{id}` returns. Present only when the request asked for it
      with `expand=user_schema` (ADR 059); `null` when it was requested but
      the referenced schema no longer resolves.
    oneOf:
      - $ref: ../../endpoints/schemas/schema.yaml
      - type: 'null'
  created_at:
    type: string
    format: date-time
    example: '2020-01-28T14:25:39.123456Z'
  updated_at:
    type: string
    format: date-time
    example: '2020-01-28T14:25:39.123456Z'