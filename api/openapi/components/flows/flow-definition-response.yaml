type: object
description: |
  Response object for a flow definition after creation.
required:
  - id
  - name
  - project_id
  - schema_uri
  - status
  - created_at
  - updated_at
properties:
  id:
    type: string
    description: Unique identifier for the created flow definition.
    example: fd_123abc456def
  name:
    type: string
    pattern: '^[a-z][a-z0-9-]*$'
    description: |
      Stable identifier for this flow (echoed from the request).
    example: standard-login
  project_id:
    type: string
    description: Identifier of the project this flow definition belongs to.
    example: proj_789ghi012jkl
  schema_uri:
    type: string
    format: uri
    description: |
      URI of the flow definition schema this definition was authored against.
      If the schema_uri was not provided in the request, the flow definition is validated against the latest version of the schema, and the response includes the schema_uri of the latest version.
    example: https://raw.githubusercontent.com/zitadel/nextgen/refs/tags/schema/v1.0.0/api/openapi/endpoints/schemas/flow-definition.yaml
  status:
    type: string
    description: Status of the flow definition.
    example: active
  created_at:
    type: string
    description: Timestamp when the flow definition was created.
    format: date-time
    example: '2020-01-28T14:25:39.123456Z'
  updated_at:
    type: string
    description: Timestamp when the flow definition was last updated.
    format: date-time
    example: '2020-01-28T14:25:39.123456Z'