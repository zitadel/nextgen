allOf:
  - $ref: flow-definition.yaml
  - type: object
    required: [id, project_id, status, created_at, updated_at]
    properties:
      id:
        type: string
        description: Unique identifier for the flow definition.
        example: fd_123abc456def
      project_id:
        type: string
        description: Identifier of the project this flow definition belongs to.
        example: proj_789ghi012jkl
      status:
        type: string
        description: Status of the flow definition.
        example: active
      created_at:
        type: string
        format: date-time
        example: '2020-01-28T14:25:39.123456Z'
      updated_at:
        type: string
        format: date-time
        example: '2020-01-28T14:25:39.123456Z'