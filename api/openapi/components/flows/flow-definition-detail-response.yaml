allOf:
  - $ref: flow-definition.yaml
  - type: object
    required: [id, project_id, schema_uri, status, created_at, updated_at]
    properties:
      id:
        type: string
        description: Unique identifier for the flow definition.
        example: fd_123abc456def
      project_id:
        type: string
        description: Identifier of the project this flow definition belongs to.
        example: proj_789ghi012jkl
      schema_uri:
        type: string
        format: uri
        description: |
          URI of the flow definition schema this definition was authored against.
          If the schema_uri was not provided in the request, the flow definition is validated against the latest version of the schema, and the response includes the schema_uri of the latest version.
        example: https://raw.githubusercontent.com/zitadel/nextgen/refs/tags/schema/v1.0.0/api/openapi/endpoints/schemas/flow-definition.yaml
      status:
        type: string
        description: Status of the flow definition.
        example: active
      created_at:
        type: string
        format: date-time
        example: '2020-01-28T14:25:39.123456Z'
      updated_at:
        type: string
        format: date-time
        example: '2020-01-28T14:25:39.123456Z'