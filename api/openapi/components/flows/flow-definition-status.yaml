type: string
enum: [ draft, active, deprecated, archived ]
default: active
description: |
  The lifecycle state of this flow definition. 
  
  draft: The flow definition is not yet ready to be used. It can be modified and tested, but the flow engine will not select it for new flows.
  active: The flow definition is ready to be used and can no longer be modified. The flow engine can select it for new flows.
  deprecated: The flow definition is being phased out and will not be used to start new flows. However, existing flows that use this flow definition can continue to operate until completion. The flow definition can no longer be modified.
  archived: The definition is removed from active use. It cannot be modified. The engine will not select it for new flows, and existing flows will be terminated with an error if they reference this definition.
  
  There must be at least one flow definition in the `active` state for a given `purpose` at all times to ensure that new flows can be started. 
  
  Allowed transitions:
  - draft -> active: To activate the flow definition.
  - active -> deprecated: To phase out the flow definition.
  - deprecated -> active: To un-deprecate and make the flow definition active again.
  - deprecated -> archived: To remove the flow definition from active use immediately.
  - active -> archived: To remove the flow definition from active use immediately. Allows for quick retirement of flow definitions with bugs, vulnerabilities, etc.
