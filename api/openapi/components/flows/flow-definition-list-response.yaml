type: object
description: List of flow definitions, newest first.
required:
  - flow_definitions
properties:
  flow_definitions:
    type: array
    items:
      $ref: flow-definition-response.yaml
  next_page_token:
    description: The token to retrieve the next page of results. Absent if there are no more results.
    oneOf:
      - $ref: ../../components/schemas/page-token.yaml
      - type: 'null'