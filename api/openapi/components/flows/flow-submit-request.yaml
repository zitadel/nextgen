type: object
required: [session_token, action]
properties:
  session_token:
    type: string
  action:
    type: string
    description: |
      Which action to take. Must be a key from the step's `actions` dictionary:
      - A regular action (e.g., "submit", "register", "back")
      - An action with a `ceremony` (e.g., "passkey") — requires `ceremony_proof`
      - The reserved value "sso" — triggers SSO redirect (requires `sso_provider_id`)
  fields:
    type: object
    description: |
      User input values. Keys match field names from the step's `fields` dictionary.
    additionalProperties: true
    example:
      identifier: "alice@acme.com"
  gate_proofs:
    type: object
    description: |
      Solutions for security gates. Keys match gate names from the step's `gates` dictionary.
      The orchestrator collects these from `<zl-captcha>` component events.
    additionalProperties:
      type: string
  ceremony_proof:
    description: |
      Result of a client-side ceremony triggered by the action.
      Required when the selected action has a `ceremony` property.
      The shape depends on the ceremony type:
      - `passkey`: a `PasskeyProof` object (serialized PublicKeyCredential).
        See `passkey-proof.yaml`.
    $ref: passkey-proof.yaml
  sso_provider_id:
    type: string
    description: |
      ID of the selected SSO provider (from `sso_providers[].id`).
      Required when `action` is "sso".
    example: google-1
