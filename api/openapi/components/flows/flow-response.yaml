type: object
required: [id, session_id, step]
properties:
  id:
    type: string
    description: |
      Flow handle. Use this as the path parameter for later
      submit and event calls. It may change between responses when a
      flow pivot or pop occurs.
    example: flow_01H8Z
  session_id:
    type: string
    description: Underlying session ID. Stable across all stacked flows.
  session_token:
    type: string
    # Reserved for future rotation. The sealed `_zflow` cookie carries the flow state today.
    description: Reserved. The sealed `_zflow` cookie carries the flow state.
  step:
    $ref: flow-step.yaml
  branding:
    $ref: branding.yaml
    description: |
      The resolved branding, inherited from the app, then the team, then the
      project. It is determined at flow creation from the audience context and does
      not change between steps.
  redirect_uri:
    type: string
    format: uri
    description: Present when `step.complete` is `redirect`.
  handoff_token:
    type: string
    description: |
      Short-lived, audience-bound token produced on flow completion.
      Exchange it for a session via `POST /sessions/exchange`.
      Only present when `step.complete` is set.
  handoff_token_expires_at:
    type: string
    format: date-time
    description: |
      Expiry timestamp for `handoff_token`. Only present when
      `handoff_token` is set.
