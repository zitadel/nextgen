type: object
required: [type, id]
description: |
  A credential descriptor identifying a registered passkey.
  Used in `excludeCredentials` (registration) and `allowCredentials` (authentication).
properties:
  type:
    type: string
    const: public-key
  id:
    type: string
    description: Base64URL-encoded credential ID.
  transports:
    type: array
    description: |
      Transport hints for the authenticator. Helps the browser reach the
      right device without prompting for all possible transports.
    items:
      type: string
      enum: [usb, nfc, ble, internal, hybrid]
