type: object
additionalProperties: false
description: |
  One complete theme side. Light and dark are independent surfaces — neither
  inherits from the other, and a side that is absent is never used, whatever
  `mode` or the operating system asks for.
properties:
  logo_url:
    type: string
    format: uri
    maxLength: 2048
    description: |
      The mark for this surface. A logo is never recoloured, so each side
      carries its own file. Absent means no mark on this side, unless the
      top-level `logo_url` is the only one set.
    example: https://cdn.example.com/logo-on-light.svg
    pattern: '^([hH][tT][tT][pP][sS]://|[hH][tT][tT][pP]://([lL][oO][cC][aA][lL][hH][oO][sS][tT]|127\.(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){2}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])|\[::1\])(?::0*(?:[0-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?([/?#]|$))'
  palette:
    $ref: branding-palette.yaml
