type: object
additionalProperties: false
description: |
  Semantic colors for one theme side. An omitted key uses Zitadel's default for
  this side, never the other side's value.

  Every value is a `BrandingColor`, which defines the accepted forms and the
  reason for them. What each key paints is below.
properties:
  primary:
    $ref: branding-color.yaml
    description: Brand color. The focus rings are derived from it.
  on_primary:
    $ref: branding-color.yaml
    description: Text and icons drawn on `primary`.
  background:
    $ref: branding-color.yaml
    description: The surface behind the card.
  surface:
    $ref: branding-color.yaml
    description: The card and popover surfaces.
  muted:
    $ref: branding-color.yaml
    description: "Neutral fills: the secondary button, accents and muted panels."
  border:
    $ref: branding-color.yaml
    description: Card and control edges.
  text:
    $ref: branding-color.yaml
    description: |
      Body text, and the foreground of every neutral surface. A side that
      sets `muted` without `text` keeps the default label color on it.
  text_muted:
    $ref: branding-color.yaml
    description: Secondary text.
  link:
    $ref: branding-color.yaml
    description: |
      Link color. Defaults to the surrounding text color, so setting it
      tints exactly the links and nothing else.
  success:
    $ref: branding-color.yaml
    description: Valid fields, success alerts and pills.
  warning:
    $ref: branding-color.yaml
    description: Warning surfaces. It is stored, but nothing renders it.
  error:
    $ref: branding-color.yaml
    description: Invalid fields, error alerts and pills.
