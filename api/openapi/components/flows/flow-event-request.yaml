type: object
required: [type]
properties:
  session_token:
    type: string
    description: Reserved for future rotation. The sealed `_zflow` cookie carries the flow state today.
  type:
    type: string
    enum: [fingerprint, telemetry]
  payload:
    type: object
    description: Event payload (fingerprint hash, timing data, etc.).
    additionalProperties: true
