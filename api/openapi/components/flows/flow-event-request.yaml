type: object
required: [type]
properties:
  session_token:
    type: string
    description: |
      Reserved for future session-token rotation; not consumed in MVP.
      The flow id on the URL path and the `_zflow` cookie are
      authoritative.
  type:
    type: string
    enum: [fingerprint, telemetry]
  payload:
    type: object
    description: Event payload (fingerprint hash, timing data, etc.).
    additionalProperties: true
