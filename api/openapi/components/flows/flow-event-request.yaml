type: object
required: [type]
properties:
  session_token:
    type: string
    description: |
      Optional bearer form of the sealed flow state. Cookie-based callers
      omit this field and rely on the `_zflow` cookie instead.
  type:
    type: string
    enum: [fingerprint, telemetry]
  payload:
    type: object
    description: Event payload (fingerprint hash, timing data, etc.).
    additionalProperties: true
