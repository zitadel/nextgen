type: object
description: |
  Request to create a flow definition. The flow definition is created with the
  status `active` by default. Set the `status` attribute in the flow definition
  to change it.
required:
  - project_id
  - flow_definition
properties:
  project_id:
    $ref: ../../components/schemas/project-id.yaml
  schema_uri:
    $ref: ../../components/schemas/schema-uri.yaml
  flow_definition:
    $ref: flow-definition.yaml