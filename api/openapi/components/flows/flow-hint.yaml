type: object
properties:
  login_name:
    type: string
    description: Auto-submits identifier step (maps to OIDC login_hint).
  team_id:
    type: string
    description: Scopes flow resolution to a team.
  user_schema_id:
    type: string
    description: |
      Scopes to a specific user type: the `objectType` of a user schema, or
      the id of one of its revisions.
  app_id:
    type: string
    description: Scopes to a specific application.
