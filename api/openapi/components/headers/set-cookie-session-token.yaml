description: |
  The secure cookie that holds the token of the latest session. The server
  rotates it on every session exchange, and clients use it to authenticate API
  requests. Revoking the session (signing out) clears it.
schema:
  type: string
  example: __nextgen_session=<session-token>; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=<ttl-seconds>
required: true
