title: PasskeyFactorPayload
type: object
description: Factor metadata for the `passkey` method, including credential and verification details.
required:
  - method
  - credential_id
  - user_verified
properties:
  method:
    type: string
    enum: [passkey]
    description: Always `passkey`; the discriminator of the payload union.
  credential_id:
    type: string
    description: The ID of the credential that was used.
    example: 'Y3JlZGVudGlhbDE='
  user_verified:
    type: boolean
    description: Whether user verification was performed (PIN or biometric).
  backup_eligible:
    type: boolean
    description: Whether the credential is eligible for backup (it can be synced).
  backup_state:
    type: boolean
    description: Whether the credential is currently backed up
  authenticator_attachment:
    type: string
    enum: [platform, cross-platform]
    description: The authenticator attachment modality.
