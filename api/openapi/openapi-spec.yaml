  /auth_attempts/{attempt_id}/handoff:
    $ref: endpoints/auth_attempts/by_id/handoff/methods.yaml
  /projects:
    $ref: endpoints/projects/methods.yaml
  /projects/{project_id}:
    $ref: endpoints/projects/by_id/methods.yaml
  /sessions:
    $ref: endpoints/sessions/methods.yaml
  /sessions/exchange:
    $ref: endpoints/sessions/exchange/methods.yaml
  /sessions/{session_id}:
    $ref: endpoints/sessions/by_id/methods.yaml
  /sessions/me:
    $ref: endpoints/sessions/me/methods.yaml
  /schemas:
    $ref: endpoints/schemas/methods.yaml
  /schemas/{id}:
    $ref: endpoints/schemas/by_id/methods.yaml
  /flow_definitions:
    $ref: endpoints/flow_definitions/methods.yaml
  /flow_definitions/{id}:
    $ref: endpoints/flow_definitions/by_id/methods.yaml
  /teams:
    $ref: endpoints/teams/methods.yaml
  /teams/{team_id}:
    $ref: endpoints/teams/by_id/methods.yaml

components:
  securitySchemes:
    oauth2:
      $ref: security/oauth2.yaml
    usernamePassword:
      $ref: security/username-password.yaml
