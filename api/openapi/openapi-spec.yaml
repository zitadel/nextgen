openapi: 3.1.0
info: 
  # TODO: set correct information
  title: Zitadel NextGen
  description: This is the next generation of the Zitadel identity platform.
  version: 0.0.1
  # This describes the exposed API contract/specification license, not the
  # AGPL-3.0-only license of the Zitadel server implementation.
  # See /LICENSING.md for the repository-level licensing policy.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: /
    description: Current API origin. Use http://localhost:8080 for local development.
  # Add the public production API once that endpoint is available.
  # - url: https://api.zitadel.com
  #   description: Production API

tags:
  - name: Authorization
    description: OIDC and OAuth discovery, authorization, token, keys, revoke, introspection, and user info endpoints.
  - name: System
    description: Health, liveness, and readiness endpoints.
  - name: Flows
    description: Runtime flow orchestration endpoints for login, registration, and recovery screens.
  - name: Flow Definitions
    description: Flow definition templates that describe user journeys.
  - name: Authentication Attempts
    description: Authentication attempt state machine, challenges, verification, and handoff endpoints.
  - name: Sessions
    description: Session creation, lookup, exchange, and teardown endpoints.
  - name: Projects
    description: Project creation and lookup endpoints.
  - name: Teams
    description: Team creation and lookup endpoints.
  - name: Users
    description: User creation, lookup, current-user, and password endpoints.
  - name: Schemas
    description: User schema creation and lookup endpoints.

paths:
  /.well-known/openid-configuration:
    $ref: endpoints/.well-known/openid-configuration/methods.yaml
  /auth/authorize:
    $ref: endpoints/oauth/authorize/methods.yaml
  /auth/device-authorization:
    $ref: endpoints/oauth/device-authorization/methods.yaml
  /auth/end-session:
    $ref: endpoints/oauth/end-session/methods.yaml
  /auth/introspect:
    $ref: endpoints/oauth/introspect/methods.yaml
  /auth/keys:
    $ref: endpoints/oauth/keys/methods.yaml
  /auth/revoke:
    $ref: endpoints/oauth/revoke/methods.yaml
  /auth/token:
    $ref: endpoints/oauth/token/methods.yaml
  /auth/userinfo:
    $ref: endpoints/oauth/userinfo/methods.yaml
  /healthz:
    $ref: endpoints/healthz/methods.yaml
  /livez:
    $ref: endpoints/livez/methods.yaml
  /readyz:
    $ref: endpoints/readyz/methods.yaml
  /users:
    $ref: endpoints/users/methods.yaml
  /users/{user_id}:
    $ref: endpoints/users/by_id/methods.yaml
  /users/{user_id}/password:
    $ref: endpoints/users/by_id/password/methods.yaml
  /users/me:
    $ref: endpoints/users/me/methods.yaml
  /flow:
    $ref: endpoints/flow/methods.yaml
  /flow/{id}:
    $ref: endpoints/flow/session/methods.yaml
  /flow/{id}/submit:
    $ref: endpoints/flow/submit/methods.yaml
  /flow/{id}/event:
    $ref: endpoints/flow/event/methods.yaml
  /auth_attempts:
    $ref: endpoints/auth_attempts/methods.yaml
  /auth_attempts/{attempt_id}:
    $ref: endpoints/auth_attempts/by_id/methods.yaml
  /auth_attempts/{attempt_id}/challenges:
    $ref: endpoints/auth_attempts/by_id/challenges/methods.yaml
  /auth_attempts/{attempt_id}/challenges/{challenge_id}/verify:
    $ref: endpoints/auth_attempts/by_id/challenges/by_id/methods.yaml
  /auth_attempts/{attempt_id}/handoff:
    $ref: endpoints/auth_attempts/by_id/handoff/methods.yaml
  /projects:
    $ref: endpoints/projects/methods.yaml
  /projects/{project_id}:
    $ref: endpoints/projects/by_id/methods.yaml
  /sessions:
    $ref: endpoints/sessions/methods.yaml
  /sessions/exchange:
    $ref: endpoints/sessions/exchange/methods.yaml
  /sessions/{session_id}:
    $ref: endpoints/sessions/by_id/methods.yaml
  /sessions/me:
    $ref: endpoints/sessions/me/methods.yaml
  /schemas:
    $ref: endpoints/schemas/methods.yaml
  /schemas/{id}:
    $ref: endpoints/schemas/by_id/methods.yaml
  /flow_definitions:
    $ref: endpoints/flow_definitions/methods.yaml
  /flow_definitions/{id}:
    $ref: endpoints/flow_definitions/by_id/methods.yaml
  /flow_definitions/{id}/activate:
    $ref: endpoints/flow_definitions/lifecycle/activate/method.yaml
  /flow_definitions/{id}/deprecate:
    $ref: endpoints/flow_definitions/lifecycle/deprecate/method.yaml
  /flow_definitions/{id}/archive:
    $ref: endpoints/flow_definitions/lifecycle/archive/method.yaml
  /teams:
    $ref: endpoints/teams/methods.yaml
  /teams/{team_id}:
    $ref: endpoints/teams/by_id/methods.yaml

components:
  securitySchemes:
    oauth2:
      $ref: security/oauth2.yaml
    usernamePassword:
      $ref: security/username-password.yaml
