openapi: 3.1.0
info: 
  # TODO: set correct information
  title: Zitadel NextGen
  description: This is the next generation of the Zitadel identity platform.
  version: 0.0.1
  # This describes the exposed API contract/specification license, not the
  # AGPL-3.0-only license of the Zitadel server implementation.
  # See /LICENSING.md for the repository-level licensing policy.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: /
    description: Current API origin. Use http://localhost:8080 for local development.
  # Add the public production API once that endpoint is available.
  # - url: https://api.zitadel.com
  #   description: Production API

tags:
  - name: System
    description: Health, liveness, and readiness endpoints.
  - name: Flows
    description: Runtime flow orchestration endpoints for login, registration, and recovery screens.
  - name: Flow Definitions
    description: Flow definition templates that describe user journeys.
  - name: Authentication Attempts
    description: Authentication attempt state machine, challenges, verification, and handoff endpoints.
  - name: Sessions
    description: Session creation, lookup, exchange, and teardown endpoints.
  - name: Projects
    description: Project management endpoints.
  - name: Teams
    description: Team management endpoints.
  - name: Users
    description: User creation, lookup, current-user, and password endpoints.
  - name: Schemas
    description: User schema creation and lookup endpoints.
  - name: Branding
    description: Branding revision publication and lookup endpoints for the login UI (layout, asset URLs, Liquid template).
  - name: Grants
    description: |
      Collaboration grants that bind a user or team to project.viewer,
      project.editor, or project.admin. Create, get, and revoke; listing and
      role-change PATCH are follow-ups.
  - name: Events
    description: |
      Project-scoped audit event list and get (ADR 049). Unified surface for
      identity, session, admin, and entity events; filter by `category` /
      `event_type`. Response items are a discriminated Event union on
      `event_type` with typed payloads per docs/design/api/events-catalog.md.

