openapi: 3.1.0
info: 
  # TODO: set correct information
  title: Zitadel NextGen
  description: This is the next generation of the Zitadel identity platform.
  version: 0.0.1
  # This describes the exposed API contract/specification license, not the
  # AGPL-3.0-only license of the Zitadel server implementation.
  # See /LICENSING.md for the repository-level licensing policy.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: /
    description: Current API origin. Use http://localhost:8080 for local development.
  # Add the public production API once that endpoint is available.
  # - url: https://api.zitadel.com
  #   description: Production API

tags:
  - name: System
    description: Health, liveness, and readiness endpoints.
  - name: Flows
    description: Runtime flow orchestration endpoints for login, registration, and recovery screens.
  - name: Flow Definitions
    description: Flow definition templates that describe user journeys.
  - name: Authentication Attempts
    description: Authentication attempt state machine, challenges, verification, and handoff endpoints.
  - name: Sessions
    description: Session creation, lookup, exchange, and teardown endpoints.
  - name: Projects
    description: Project management endpoints.
  - name: Teams
    description: Team management endpoints.
  - name: Users
    description: User creation, lookup, current-user, and password endpoints.
  - name: Schemas
    description: User schema creation and lookup endpoints.
  - name: Branding
    description: Branding revision publication and lookup endpoints for the login UI (layout, asset URLs, Liquid template).
  - name: Identity Providers
    description: |
      External login providers a project offers, each published as a
      revisioned connection document and referenced by its slug from user
      schemas and flow definitions. Create-or-revise, query, read by id, and
      revision reads. A slug resolves through the query.
  - name: Policies
    description: |
      Operation policies (ADR 066): a project publishes, per guarded
      operation, the settings that operation is checked against, such as a
      password policy's minimum length. Every publish is an immutable
      revision.
  - name: Releases
    description: |
      A release is a snapshot of a project's configuration: one revision of
      each resource, plus who made it, when, and from which commit. It points
      at those revisions and never copies their content, which stays with
      each resource's own endpoints.

      Create a release from the files in your `.zitadel/` directory, or from
      revision ids you already have. Creating a release doesn't deploy it,
      and you can deploy the same release to any number of origins.

      Every release carries a digest of its content, so you can check
      whether the files you have are already released.

      A release's content never changes. If it must never be served again,
      revoke it. A release can't be revoked while any origin still serves
      it.
  - name: Deployments
    description: |
      A deployment makes one release live on one or more targets — the
      project's primary origins, or preview URLs — and freezes the variable
      values those targets use.

      Deployments form an append-only history of what ran where, and when. A
      rollback is another deployment: it re-deploys an earlier one with the
      variable values it froze, and the deployments in between stay in the
      history.
  - name: Previews
    description: |
      Preview URLs that are live. A deployment to a URL matching one of the
      project's preview patterns creates or renews its preview; list them
      here and remove one before it expires.
  - name: Grants
    description: |
      Collaboration grants that bind a user or team to project.viewer,
      project.editor, or project.admin. Create, get, query, and revoke;
      role-change PATCH is a follow-up.
  - name: Events
    description: |
      Project-scoped audit event list and get (ADR 049). Unified surface for
      identity, session, admin, and entity events; filter by `category` /
      `event_type`. Response items are a discriminated Event union on
      `event_type` with typed payloads per docs/design/api/events-catalog.md.
  - name: Event Webhooks
    description: |
      Events the server POSTs to a webhook sink as it stores them (ADR 049),
      one event per request and, within a project, in the order they were
      stored. The body is the event as `GET /events` returns it; `event_type`
      tells the webhooks apart. Delivery is at least once, so drop duplicates
      by `id`. The sink is set in the server's configuration, under
      `events.export`.
  - name: Variables
    description: |
      Named values a project enters and references from configuration documents
      as `${{ NAME }}`. A variable has a value per kind, `primary` or `preview`,
      and each deployment freezes the values of its kind. There is no fallback
      between kinds.

      Secrets are the same resource with the value stored encrypted: same
      names, same references, same endpoints. They are write-only — a read says
      that a secret is held, never what it is.

