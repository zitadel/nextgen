      user.list: Permission to list users
  clientCredentials: 
    tokenUrl: https://acc.nextgen.zitadel.com/oauth/token
    scopes: 
      openid: OpenID Connect scope
      schema.read: Permission to read schemas
      schema.write: Permission to create and manage schemas
      user.create: Permission to create users
      user.list: Permission to list users
    