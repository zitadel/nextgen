type: oauth2
flows: 
  authorizationCode: 
    authorizationUrl: https://acc.nextgen.zitadel.com/oauth/authorize
    tokenUrl: https://acc.nextgen.zitadel.com/oauth/token
    scopes: 
      openid: OpenID Connect scope
      profile: Access to the user's profile information
      email: Access to the user's email address
      schema.read: Permission to read schemas
      schema.write: Permission to create and manage schemas
      user.write: Permission to create users
      user.read: Permission to read users
      project.read: Permission to read projects
      project.write: Permission to create and manage projects
      branding.read: Permission to read branding revisions via the management API (the operator-grade project.write scope implies it until ADR 036 credential planes mint finer scopes)
      branding.write: Permission to publish branding revisions (the operator-grade project.write scope implies it until ADR 036 credential planes mint finer scopes)
  clientCredentials:
    tokenUrl: https://acc.nextgen.zitadel.com/oauth/token
    scopes:
      openid: OpenID Connect scope
      schema.read: Permission to read schemas
      schema.write: Permission to create and manage schemas
      user.read: Permission to read users
      user.create: Permission to create users
      project.read: Permission to read projects
      project.write: Permission to create and manage projects
      branding.read: Permission to read branding revisions via the management API (the operator-grade project.write scope implies it until ADR 036 credential planes mint finer scopes)
      branding.write: Permission to publish branding revisions (the operator-grade project.write scope implies it until ADR 036 credential planes mint finer scopes)
