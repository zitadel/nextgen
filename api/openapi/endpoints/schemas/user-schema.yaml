title: UserSchema
$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
required:
  - kind
  - title
  - x-auth-methods
properties:
  kind:
    type: string
    const: user-schema
    description: Discriminator value for a user schema create request.
  title:
    type: string
    minLength: 1
    maxLength: 255
    description: Human-readable name for this schema.
  description:
    type: string
    maxLength: 1024
    description: A description of this schema.
  x-auth-methods:
    type: object
    description: |
      A list of authentication methods supported by the user definition.
    additionalProperties:
      $ref: auth-method.yaml
  required:
    type: array
    description: A list of required fields for the user definition
    items:
      type: string
  properties:
    type: object
    description: |
      A map of additional properties for the user definition, where the key
      is the property name and the value is the property schema
    additionalProperties:
      $ref: user-property.yaml
  example:
    oneOf:
      - type: string
      - type: number
      - type: boolean
      - type: object
      - type: array
      - type: "null"