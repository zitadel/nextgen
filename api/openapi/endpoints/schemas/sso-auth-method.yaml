x-meta-schema: true
title: SSOAuthMethod
type: object
required:
- enabled
additionalProperties: false
properties:
  enabled:
    type: boolean
    description: Whether the authentication method is enabled.
  providers:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: ^[a-z0-9][a-z0-9_-]*$
      maxLength: 64
      examples:
      - google
      - corp_idp
    description: |
      Slugs of the project-level identity providers available to users of this schema.
      Each entry must match the `slug` of a connection document under
      `.zitadel/idps/`. A connection document existing does not by itself make it
      available here.
if:
  properties:
    enabled:
      const: true
  required:
  - enabled
then:
  required:
  - providers
else:
  not:
    required:
    - providers
