"$schema": https://json-schema.org/draft/2020-12/schema
title: UserProperty
type: object
description: |
  This schema is missing `"allOf": [{"$ref": "https://json-schema.org/draft/2020-12/schema"}],`. 
  This is done because a lot of code generators cannot handle that.
  
  A few properties are reserved:
  - id: is used to return the id of the user 
  - metadata: is used to embed metadata of the user, like creation date, 
    status,... in a return object
additionalProperties: true
properties:
  x-verify:
    oneOf:
      - type: string
      - type: 'null'
    description: The verification method for this property, if applicable
  x-unique:
    oneOf:
      - type: string
        enum:
          - unspecified
          - project
          - team
      - type: 'null'
    description: The level of uniqueness for this property, if applicable
  x-claim:
    oneOf:
      - type: string
      - type: 'null'
    description: The claim name for this property, if applicable
  x-editable:
    type: boolean
    default: true
    description: Whether this property is editable by the user or not
  x-sensitive:
    type: boolean
    default: false
    description: Whether this property contains sensitive information or not
  x-mfa:
    type: boolean
    default: false
    description: |
      Whether this property is used for multi-factor authentication or not
  properties:
    type: object
    description: |
      A map of additional properties for the user definition, where the key is
      the property name and the value is the property schema.
    propertyNames:
      "$ref": property-name.json
    additionalProperties:
      "$ref": user-property.yaml
