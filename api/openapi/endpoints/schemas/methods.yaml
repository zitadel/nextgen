post:
  operationId: createSchema
  summary: Create new schema
  tags:
    - Schema
  security:
    - oauth2:
        - schema.write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          oneOf:
            - $ref: user-schema.yaml
            - $ref: schema-url.yaml
          discriminator:
            propertyName: kind
            mapping:
              user-schema: user-schema.yaml
              schema-url:  schema-url.yaml
        examples:
          userSchema:
            summary: An example of a schema definition for a user.
            externalValue: examples/user-schema-example.yaml
          schemaURL:
            summary: An example of a schema definition that references an external schema URL.
            externalValue: examples/schema-url-example.yaml
  responses:
    '201':
      description: The schema was created successfully
      content:
        application/json:
          schema:
            $ref: create-schema-response.yaml
          examples:
            userSchemaResponse:
              summary: An example of a successful response for creating a user schema.
              externalValue: examples/create-user-schema-response-example.yaml
    '400':
      description: The provided input was not valid
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml