post:
  operationId: createSchema
  summary: Create a schema
  description: |
    Creates a schema, either a concrete schema such as a user schema or a schema
    URL that the server resolves.

    The optional `$id` field is the JSON Schema document URI that identifies the
    schema in later requests. It is a stable identity for GitOps, not a free-form
    resource ID. When `$id` is omitted, the server generates a `sch_*` URL. When
    provided, `$id` must be unique within the project and should be a valid URI
    pointing at where the schema can be accessed.
  tags:
    - Schemas
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
    - $ref: ../../components/parameters/team-id.yaml
  security:
    - oauth2:
        - schema.write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          oneOf:
            - $ref: user-schema.yaml
            - $ref: schema-url.yaml
          discriminator:
            propertyName: kind
            mapping:
              user-schema: user-schema.yaml
              schema-url:  schema-url.yaml
        examples:
          userSchema:
            summary: An example of a schema definition for a user.
            externalValue: examples/user-schema-example.yaml
          schemaURL:
            summary: |
              An example of a schema definition that references an external 
              schema URL.
            externalValue: examples/schema-url-example.yaml
          defaultHumanUserSchema:
            summary: The default human user schema provided by the server.
            externalValue: examples/default-human-user-schema.json
  responses:
    '201':
      description: The ID of the created schema.
      content:
        application/json:
          schema:
            $ref: create-schema-response.yaml
          examples:
            userSchemaResponse:
              summary: |
                An example response for creating a user schema.
              externalValue: examples/create-user-schema-response-example.yaml
    default:
      $ref: createSchema-error-response.yaml

get:
  operationId: listSchemas
  x-zitadel-cli: schemas list
  summary: List schemas
  description: |
    Lists the schemas available in the system, newest first, in pages. Query
    parameters filter the list by schema attributes.
  tags:
    - Schemas
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
    - $ref: ../../components/parameters/limit.yaml
    - $ref: ../../components/parameters/page-token.yaml
    - name: object_type
      in: query
      description: The type of object of the schema to filter by.
      schema:
        type: string
        maxLength: 256
    - name: revisions
      in: query
      description: |
        Which revisions to return. Schemas are immutable and versioned by URL,
        so editing one creates a new revision that shares its `objectType`.

        `all` (the default) returns every revision: the full history that an
        export, an audit or a GitOps diff needs. `latest` returns the newest
        revision of each `objectType`, which is one entry per schema.

        A schema stored without an `objectType` is a revision of nothing, and
        is returned by both.

        A `page_token` is bound to the mode it was issued in and is rejected by
        the other.
      schema:
        type: string
        default: all
        enum:
          - all
          - latest
    - name: kind
      in: query
      description: |
        The kind of schema to filter by, read from the stored document's
        `kind` property.

        `schema-url` is not a kind: it discriminates the create request body,
        not a stored schema. A schema registered by URL is stored as whatever
        document the URL served, and declares its own kind.

        A schema stored without its document being parsed has no kind that
        could be read, and is excluded from every filtered result.
      schema:
        type: string
        enum:
          - user-schema
    - name: expand
      in: query
      required: false
      description: Extra fields to include on each returned schema.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: schema-expand.yaml
  security:
    - oauth2:
        - schema.read
    - nextgenSession: []
  responses:
    '200':
      description: The schemas, newest first, with a token for the next page.
      content:
        application/json:
          schema:
            $ref: list-schemas-response.yaml
    default:
      $ref: listSchemas-error-response.yaml