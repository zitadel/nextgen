post:
  operationId: createSchema
  summary: Create new schema
  description: |
    Create a new schema. The optional `$id` field is the JSON Schema document
    URI used to identify the schema in future requests (GitOps-stable identity,
    not a free-form resource primary key). When `$id` is omitted, the server
    generates a `sch_*` URL. When provided, `$id` must be unique within the
    project and should ideally be a valid URI pointing at where the schema can
    be accessed.

    The schema can either be a concrete schema, e.g. a user schema, or a 
    schema-url which will be resolved by the server.
  tags:
    - Schemas
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
    - $ref: ../../components/parameters/team-id.yaml
  security:
    - oauth2:
        - schema.write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          oneOf:
            - $ref: user-schema.yaml
            - $ref: schema-url.yaml
          discriminator:
            propertyName: kind
            mapping:
              user-schema: user-schema.yaml
              schema-url:  schema-url.yaml
        examples:
          userSchema:
            summary: An example of a schema definition for a user.
            externalValue: examples/user-schema-example.yaml
          schemaURL:
            summary: |
              An example of a schema definition that references an external 
              schema URL.
            externalValue: examples/schema-url-example.yaml
          defaultHumanUserSchema:
            summary: The default human user schema provided by the server.
            externalValue: examples/default-human-user-schema.json
  responses:
    '201':
      description: The schema was created successfully
      content:
        application/json:
          schema:
            $ref: create-schema-response.yaml
          examples:
            userSchemaResponse:
              summary: |
                An example of a successful response for creating a user schema.
              externalValue: examples/create-user-schema-response-example.yaml
    '400':
      description: The provided input was not valid
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '409':
      description: A schema with the same $id already exists
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml

get:
  operationId: listSchemas
  summary: List all schemas
  description: |
    Retrieve a list of all schemas available in the system. This endpoint 
    supports pagination and filtering based on schema attributes.
  tags:
    - Schemas
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
    - $ref: ../../components/parameters/limit.yaml
    - $ref: ../../components/parameters/page-token.yaml
    - name: object_type
      in: query
      description: The type of object of the schema to filter by.
      schema:
        type: string
        maxLength: 256
    - name: revisions
      in: query
      description: |
        Which revisions to return. Schemas are immutable and versioned by URL,
        so editing one mints a new row sharing its `objectType`.

        `all` (the default) returns every revision — the full history an
        export, an audit or a GitOps diff needs. `latest` returns the newest
        revision of each `objectType`, which is one row per schema.

        A schema stored without an `objectType` is a revision of nothing, and
        is returned by both.

        A `page_token` is bound to the mode it was issued in and is rejected by
        the other.
      schema:
        type: string
        default: all
        enum:
          - all
          - latest
    - name: id
      in: query
      description: |
        Exact-match filter on schema ids. Repeatable (OR within the parameter)
        and ANDed with the other filters, so a schema is returned when it
        matches one of the ids *and* everything else asked for.

        Ids are revision-specific — editing a schema mints a new one — so this
        resolves the exact revisions a caller holds ids for, whether or not
        they are current. An id that matches nothing is absent from the result
        rather than an error, which includes ids from another project.

        At most 100 ids per request.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          type: string
    - name: kind
      in: query
      description: |
        The kind of schema to filter by, read from the stored document's
        `kind` property.

        `schema-url` is not a kind: it discriminates the create request body,
        not a stored schema. A schema registered by URL is stored as whatever
        document the URL served, and declares its own kind.

        A schema stored without its document being parsed has no kind that
        could be read, and is excluded from every filtered result.
      schema:
        type: string
        enum:
          - user-schema
  security:
    - oauth2:
        - schema.read
  responses:
    '200':
      description: A list of schemas was retrieved successfully.
      content:
        application/json:
          schema:
            $ref: list-schemas-response.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml