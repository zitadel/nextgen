post:
  operationId: createSchema
  summary: Create new schema
  tags:
    - Schema
  security:
    - oauth2:
        - schema.write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          oneOf:
            - $ref: user-schema.yaml
            - $ref: schema-url.yaml
          discriminator:
            propertyName: kind
            mapping:
              user-schema: user-schema.yaml
  responses:
    '201':
      description: The schema was created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                description: The ID of the created schema
    '400':
      description: The provided input was not valid
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml