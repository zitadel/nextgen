post:
  operationId: createSchemaRevision
  summary: Create new schema revision
  tags:
    - Schema
  security:
    - oauth2:
        - schema.write
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          oneOf:
            - $ref: ../../user-schema.yaml
          discriminator:
            propertyName: kind
            mapping:
              user-schema: ../../user-schema.yaml
  responses:
    '201':
      description: The schema was created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: integer
                description: The ID of the created schema revision
    '400':
      description: The provided input was not valid
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml