get:
  operationId: getSchemaById
  summary: Get schema by ID
  description: |
    Get a schema by its ID. A schema ID identifies one immutable revision, so
    this returns exactly that revision. To find the current revision of an
    object type, list with `revisions=latest`.
  tags:
    - Schemas
  security:
    - oauth2:
        - schema.read
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - $ref: ../../../components/parameters/team-id.yaml
  responses:
    '200':
      description: The schema was retrieved successfully
      content:
        application/json:
          schema:
            $ref: ../schema.yaml
    '400':
      description: The provided input was not valid
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: No schema was found with the given id
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
