type: object
description: List of schemas, newest first.
required:
  - schemas
properties:
  schemas:
    type: array
    items:
      $ref: schema.yaml
  next_page_token:
    description: |
      Token to pass as `page_token` in the next request to fetch the following page.
      Absent when there are no more results.
    oneOf:
      - $ref: ../../components/schemas/page-token.yaml
      - type: 'null'
