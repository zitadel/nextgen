title: SchemaUrl
type: object
description: |
  A schema definition that references an external schema by URL. On creation,
  the server resolves it, validates it against its meta-schema and keeps a copy.
required:
  - kind
  - url
properties:
  kind:
    type: string
    const: schema-url
    description: Discriminator value for a user schema create request.
  url:
    type: string
    format: uri
    description: URL to the schema definition.