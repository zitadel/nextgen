x-meta-schema: true
title: IdentityProviderConnection
type: object
required:
- slug
- protocol
- display_name
additionalProperties: false
properties:
  $schema:
    type: string
    minLength: 1
    description: 'Editor affordance: path or URL of this schema so editors validate and autocomplete the
      file (scaffolded connection files point at `.zitadel/meta/idp-connection.json`). Ignored by the
      platform.'
  slug:
    type: string
    pattern: ^[a-z0-9][a-z0-9_-]*$
    maxLength: 64
    description: Stable identifier, referenced by user schemas (x-auth-methods.sso.providers) and flow
      steps (sso_providers). Unique within the Project.
    examples:
    - google
    - corp_idp
  protocol:
    type: string
    enum:
    - oidc
    description: "The protocol used by the identity provider. OIDC is the only protocol."
  template:
    type: string
    examples:
    - google
    - okta
    description: "Template hint for rendering the provider (logo, colors). Carries no protocol behavior: conduct comes only from the protocol blocks."
  display_name:
    type: string
    minLength: 1
    maxLength: 256
    description: Shown to the user on the sign-in button.
  subject_claim:
    type: string
    minLength: 1
    description: Claim carrying the provider's stable subject identifier. Optional; the engine uses `sub`
      per spec. Override it where `sub` is pairwise, e.g. Entra `oid`.
  claim_mapping:
    type: object
    propertyNames:
      pattern: '^[^.]+$'
    additionalProperties:
      type: string
      pattern: ^[^$]
    description: "Maps user-schema property names (keys) to provider claim names (values). A value is an exact top-level claim key: no path syntax, and a dot is part of the key, so nested claims (OIDC `address`) are not addressable yet. `$`-prefixed strings and non-string values are reserved for future mapping forms. Add properties defined in the user schemas; unmatched entries are ignored. A key is one property name, so it cannot contain a dot."
  verified_claims:
    type: object
    propertyNames:
      pattern: '^[^.]+$'
    additionalProperties:
      anyOf:
      - const: true
      - type: string
        pattern: ^[^$]
    description: 'Maps a verifiable user-schema property to its verification source: a claim name (read
      the claim) or the literal `true` (trust this provider unconditionally). Values starting with `$`
      are reserved for future sources. Distinct from claim_mapping, which carries values, not verification
      state.'
    examples:
    - email: email_verified
    - email: true
  provisioning:
    type: object
    additionalProperties: false
    description: "How far this provider's data is trusted. `creation` defines what happens to a subject that has no account yet. With `disabled`, a user is not created. With `auto`, the user is created without a collection step when the mapped claims fill every required property of the schema. A required property with an `x-unique` scope must also arrive verified according to `verified_claims`. When a required property is missing or such a property is unverified, the collection step is shown instead, prefilled with the claims. Gating on other properties will be added when `x-verify` returns to the dialect. The following are deferred and will be added as additive changes. The `auto_only` value creates the user from complete claims or fails without collecting. The linking policy (`is_linking_allowed`, `auto_linking`), together with the account-linking journey. `is_auto_update`, together with per-property verification state."
    properties:
      creation:
        type: string
        enum:
        - disabled
        - auto
        default: auto
  oidc:
    type: object
    additionalProperties: false
    description: "OIDC connection details. Endpoints come from the issuer's discovery document. A provider that exposes no .well-known document names them all instead: authorization_endpoint, token_endpoint, jwks_uri, and userinfo_endpoint unless id_token_mapping is set. Setting any endpoint without the others is rejected with idp.endpoints_partial."
    required:
    - issuer
    - client_id
    - client_secret
    - scopes
    properties:
      issuer:
        type: string
        format: uri
        pattern: ^(https://[^\s/?#]+|http://(localhost|127\.0\.0\.1)(:[0-9]+)?)(/[^\s?#]*)?$
        description: Discovery base. Endpoints are resolved from its .well-known document unless the
          connection names them all.
      jwks_uri:
        type: string
        format: uri
        pattern: ^(https://[^\s/?#]+|http://(localhost|127\.0\.0\.1)(:[0-9]+)?)([/?][^\s#]*)?$
        description: JWKS endpoint, for a provider that exposes no .well-known document. Set
          together with the other endpoints.
      id_token_mapping:
        type: boolean
        default: false
        description: Read user claims from the id_token instead of the userinfo endpoint, for providers
          that populate only the former.
      authorization_endpoint:
        type: string
        format: uri
        pattern: ^(https://[^\s/?#]+|http://(localhost|127\.0\.0\.1)(:[0-9]+)?)([/?][^\s#]*)?$
        description: For a provider that exposes no .well-known document. Set together with the
          other endpoints.
      token_endpoint:
        type: string
        format: uri
        pattern: ^(https://[^\s/?#]+|http://(localhost|127\.0\.0\.1)(:[0-9]+)?)([/?][^\s#]*)?$
        description: For a provider that exposes no .well-known document. Set together with the
          other endpoints.
      userinfo_endpoint:
        type: string
        format: uri
        pattern: ^(https://[^\s/?#]+|http://(localhost|127\.0\.0\.1)(:[0-9]+)?)([/?][^\s#]*)?$
        description: For a provider that exposes no .well-known document. Set together with the
          other endpoints; not needed when id_token_mapping is set.
      client_id:
        type: string
        minLength: 1
        maxLength: 512
        description: Either a literal in case the same client is used in all environments, or a `${{ NAME
          }}` reference to a variable in case of separate clients per environment.
      client_secret:
        type: string
        pattern: ^\$\{\{ *[A-Za-z0-9_]+ *\}\}$
        description: 'A reference to the variable holding the client secret, never the secret itself.
          A secret may only be referenced as the entire value: text around the placeholder would be rendered
          into the resolved credential, so it is rejected. The engine resolves it against the environment
          serving the request.'
      token_endpoint_auth_method:
        type: string
        enum:
        - client_secret_basic
        - client_secret_post
        default: client_secret_basic
        description: How the client authenticates at the token endpoint.
      scopes:
        type: array
        items:
          type: string
          minLength: 1
          # RFC 6749 section 3.3: a scope is one token, so no space (which would
          # fuse two scopes into one the provider has never heard of), no quote.
          pattern: '^[\x21\x23-\x5B\x5D-\x7E]+$'
        uniqueItems: true
        minItems: 1
        contains:
          const: openid
        default:
        - openid
        - profile
        - email
        description: Must contain `openid` - without it the provider returns no id_token and the connection
          is not OIDC. Enforced by `required` + `contains`; the `default` is a UI-prefill hint only -
          validators never inject it, so an omitted `scopes` is rejected regardless.
      pkce_enabled:
        type: boolean
        default: true
        description: "Send PKCE (code_challenge/code_verifier). Providers that do not support PKCE typically ignore the parameters, so `true` is safe and future-proofs; set `false` only for a provider whose token endpoint rejects them."
      static_authorize_parameters:
        type: object
        propertyNames:
          minLength: 1
          not:
            enum:
            - client_id
            - redirect_uri
            - response_type
            - scope
            - state
            - nonce
            - code_challenge
            - code_challenge_method
            - response_mode
            - request
            - request_uri
            - client_secret
            - client_assertion
        additionalProperties:
          type: string
        description: "Extra provider-specific authorize parameters (for example `prompt`). Engine-owned protocol parameters are reserved and rejected by `propertyNames`: the engine composes them itself, and an override of `state` or `nonce` would silently defeat CSRF and token binding. `client_secret` and `client_assertion` are rejected as they could be appended to the public authorize URL."
allOf:
- if:
    properties:
      protocol:
        const: oidc
    required:
    - protocol
  then:
    required:
    - oidc
