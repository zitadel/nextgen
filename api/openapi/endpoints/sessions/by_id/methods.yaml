get:
  operationId: getSession
  summary: Get session state
  description: |
    Returns the current state of a session including its factors and all currently
    satisfied assurance levels.

    `assurance_levels[]` may shrink over time as factor freshness windows expire,
    without the session itself expiring. Use step-up authentication (a new `auth_attempt`
    against the same `session_id`) to restore a dropped assurance level.
  tags:
    - Sessions
  parameters:
    - $ref: ../../../components/parameters/session-id.yaml
  security:
    - oauth2:
        - session.read
  responses:
    '200':
      description: Session state.
      content:
        application/json:
          schema:
            $ref: ../session-response.yaml
    '401':
      description: Missing or invalid session token.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: Session not found.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml

delete:
  operationId: revokeSession
  summary: Revoke session
  description: |
    Revokes the session immediately (`state: revoked`). This is the logout operation.

    The session_token issued at creation (or superseded by a handoff exchange) is required.
    After revocation, any tokens derived from this session are invalidated.
  tags:
    - Sessions
  parameters:
    - $ref: ../../../components/parameters/session-id.yaml
  security:
    - oauth2:
        - session.delete
  responses:
    '204':
      description: Session revoked successfully.
    '401':
      description: Missing or invalid session token.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: Session not found.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '409':
      description: Session already revoked or expired.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml

