post:
  operationId: exchangeHandoff
  summary: Exchange handoff token for a session
  description: |
    Exchanges a one-time handoff token for a session and a `session_token`.

    The `handoff_token` comes from `POST /auth_attempts/{id}/handoff`. The server
    finds the originating authentication attempt from the token and then:

    | Originating authentication attempt | Outcome |
    |---|---|
    | No `session_id` | A new authenticated session is **created**. |
    | `session_id` points to an anonymous session | Existing session is **upgraded**: user and factors written in, TTL reset to full session TTL. |
    | `session_id` points to an active session (step-up) | Existing session is **upgraded**: new factors merged, `assurance_levels[]` expanded. |

    The response shape is identical in all three cases.

    The `session_token` supersedes any previously issued `session_token` for the
    same session. Clients must replace their stored token at this point.

    The operation requires a project service key (OAuth2 client credentials).

    The project comes from the project secret. A query `project_id` that
    disagrees answers `403` with `proj.mismatch`. The exchange resolves a
    deployment the same way as other runtime operations. With no browser `Origin`
    and nothing deployed to the resolved target, the response is `409` with
    `rel.not_deployed`. A revoked release answers `409` with `rel.revoked`.
  tags:
    - Sessions
  security:
    - oauth2:
        - session.write
  parameters:
    - $ref: ../../../components/parameters/project-id.yaml
    - $ref: ../../../components/parameters/idempotency-key.yaml
      description: |
        Optional retry key for safe retries of the handoff exchange.
        Retries carrying the same key within the exchange window return the cached session
        payload without consuming the one-time handoff token again.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: exchange-request.yaml
  responses:
    '200':
      description: The session, with the new `session_token`.
      headers:
        Set-Cookie:
          $ref: ../../../components/headers/set-cookie-session-token.yaml
      content:
        application/json:
          schema:
            $ref: ../session-with-token-response.yaml
    '400':
      description: |
        Invalid request. A handoff token that is unknown, already exchanged, or
        expired is refused with `sess.invalid_handoff_token`. The response does
        not say which, and in each case the caller starts a new sign-in.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '401':
      description: Missing or invalid project credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: |
        The `project_id` does not match the project the credential belongs to
        (`proj.mismatch`).
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
          examples:
            mismatch:
              summary: project_id disagrees with the credential
              value:
                code: proj.mismatch
                message: 'the project named in the request is not the one the credential belongs to'
    '409':
      description: |
        Nothing is deployed to the resolved target (`rel.not_deployed`), or the
        release of that deployment is revoked (`rel.revoked`).
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
          examples:
            not_deployed:
              summary: No deployment for the resolved target
              value:
                code: rel.not_deployed
                message: 'nothing is deployed to this origin'
            revoked:
              summary: The release is revoked
              value:
                code: rel.revoked
                message: 'the release this attempt runs on was revoked'
    default:
      $ref: exchangeHandoff-error-response.yaml

