type: object
# Maintainer note moved here from the description: "(ADR 053 §5)".
description: The session-bound CSRF token.
required:
  - csrf_token
properties:
  csrf_token:
    type: string
    description: |
      Send it in the `X-Zitadel-CSRF` header on state-changing requests the
      session cookie authenticates.
    example: 3q9Y5mJ7m1wq0yBqS4kz0mJ3o1bG8v7t2Y4r6Pp9Ls0
