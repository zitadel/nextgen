get:
  operationId: getMySessionCsrfToken
  summary: Get my session's CSRF token
  # Maintainer note moved here from the description: "(ADR 053 §5)" after "cross-site request forgery protection".
  description: |
    Returns the session-bound token that protects against cross-site request
    forgery (CSRF).

    Browser code sends it in the `X-Zitadel-CSRF` header on the state-changing
    requests that the session cookie authenticates and that require it. See the
    `nextgenSession` scheme. It authorizes nothing on its own: the HttpOnly
    cookie is still the credential, and a cross-site page cannot read this
    response. The token stays the same for the life of the session, so a client
    fetches it once per session.

    With `project_id`, the token is returned only when the session belongs to
    that project.
  tags:
    - Sessions
  parameters:
    - $ref: ../../../../components/parameters/session-project-id.yaml
  security:
    - nextgenSession: []
  responses:
    '200':
      description: The session's CSRF token.
      headers:
        Cache-Control:
          $ref: ../../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: csrf-token-response.yaml
    '401':
      description: Missing or invalid session token.
      headers:
        Cache-Control:
          $ref: ../../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/errors/auth-unauthorized.yaml
    '403':
      description: The session belongs to a different project than `project_id`.
      headers:
        Cache-Control:
          $ref: ../../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/errors/sess-project_mismatch.yaml
    default:
      $ref: getMySessionCsrfToken-error-response.yaml
