get:
  operationId: getMySession
  summary: Get my session state
  description: |
    Returns the current state of the current session, including its factors and
    all currently satisfied assurance levels.

    With `project_id`, the session is returned only when it belongs to that
    project.

    `assurance_levels[]` may shrink over time as factor freshness windows expire,
    without the session itself expiring. Use step-up authentication to restore a
    dropped assurance level. Step-up creates a new authentication attempt against
    the same `session_id`.
  tags:
    - Sessions
  parameters:
    - $ref: ../../../components/parameters/session-project-id.yaml
  security:
    - nextgenSession: []
  responses:
    '200':
      description: The current session, with its state.
      headers:
        Cache-Control:
          $ref: ../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: ../session-response.yaml
    '401':
      description: Missing or invalid session token.
      headers:
        Cache-Control:
          $ref: ../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/auth-unauthorized.yaml
    '403':
      description: The session belongs to a different project than `project_id`.
      headers:
        Cache-Control:
          $ref: ../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/sess-project_mismatch.yaml
    '404':
      description: Session not found.
      headers:
        Cache-Control:
          $ref: ../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/sess-not_found.yaml
    default:
      $ref: getMySession-error-response.yaml

delete:
  operationId: revokeMySession
  summary: Revoke my session
  description: |
    Signs the user out by revoking the session, which permanently deletes it.

    The request needs the `__nextgen_session` cookie issued at creation (or
    superseded by a handoff exchange). It also needs the session's token from
    `GET /sessions/me/csrf` in the `X-Zitadel-CSRF` header. The operation is
    idempotent: if the session is already gone, it still returns 204. Any tokens
    derived from the session are invalidated, and the response clears the cookie
    itself.

    With `project_id`, only a session of that project is revoked. A session of
    another project is left alone, and so is its cookie.
  tags:
    - Sessions
  parameters:
    - $ref: ../../../components/parameters/session-project-id.yaml
  security:
    - nextgenSession: []
  responses:
    '204':
      description: The session was revoked and deleted, and the cookie is cleared. The response is the same when the session was already absent.
      headers:
        Set-Cookie:
          $ref: ../../../components/headers/set-cookie-session-token.yaml
    '401':
      description: Missing or invalid session token.
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/auth-unauthorized.yaml
    '403':
      description: |
        `sess.project_mismatch`: the session belongs to a different project than
        `project_id`. It is not revoked, and its cookie is not cleared.

        `auth.csrf_invalid`: the request came from another site, or did not carry
        the session's `X-Zitadel-CSRF` token (see the `nextgenSession` scheme).
        It is refused before the session is looked at.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml

    default:
      $ref: revokeMySession-error-response.yaml
