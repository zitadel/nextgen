get:
  operationId: getMySession
  summary: Get my session state
  description: |
    Returns the current state of the current session including its factors and all currently
    satisfied assurance levels.

    With `project_id`, the session is returned only when it belongs to that project.

    `assurance_levels[]` may shrink over time as factor freshness windows expire,
    without the session itself expiring. Use step-up authentication (a new `auth_attempt`
    against the same `session_id`) to restore a dropped assurance level.
  tags:
    - Sessions
  parameters:
    - $ref: ../../../components/parameters/session-project-id.yaml
  security:
    - sessionCookie: []
  responses:
    '200':
      description: Session state.
      headers:
        Cache-Control:
          $ref: ../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: ../session-response.yaml
    '401':
      description: Missing or invalid session token.
      headers:
        Cache-Control:
          $ref: ../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/auth-unauthorized.yaml
    '403':
      description: The session belongs to a different project than `project_id`.
      headers:
        Cache-Control:
          $ref: ../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/sess-project_mismatch.yaml
    '404':
      description: Session not found.
      headers:
        Cache-Control:
          $ref: ../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/sess-not_found.yaml
    default:
      $ref: getMySession-error-response.yaml

delete:
  operationId: revokeMySession
  summary: Revoke my session
  description: |
    Logs out by permanently deleting the session.

    The `__nextgen_session` cookie issued at creation (or superseded by a handoff
    exchange) is required, with the session's token from `GET /sessions/me/csrf`
    in the `X-Zitadel-CSRF` header. Idempotent: if the session is already gone
    this still returns 204. Any tokens derived from the session are invalidated,
    and the cookie itself is cleared in the response.

    With `project_id`, only a session of that project is deleted. A session of
    another project is left alone, and so is its cookie.
  tags:
    - Sessions
  parameters:
    - $ref: ../../../components/parameters/session-project-id.yaml
  security:
    - sessionCookie: []
  responses:
    '204':
      description: Session deleted; cookie cleared. Idempotent — also returned when the session was already absent.
      headers:
        Set-Cookie:
          $ref: ../../../components/headers/set-cookie-session-token.yaml
    '401':
      description: Missing or invalid session token.
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/auth-unauthorized.yaml
    '403':
      description: |
        `sess.project_mismatch`: the session belongs to a different project than
        `project_id`. It is not deleted, and its cookie is not cleared.

        `auth.csrf_invalid`: the request came from another site, or did not carry
        the session's `X-Zitadel-CSRF` token (see the `sessionCookie` scheme).
        It is refused before the session is looked at.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml

    default:
      $ref: revokeMySession-error-response.yaml
