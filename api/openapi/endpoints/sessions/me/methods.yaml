get:
  operationId: getMySession
  summary: Get my session state
  description: |
    Returns the current state of the current session including its factors and all currently
    satisfied assurance levels.

    With `project_id`, the session is returned only when it belongs to that project.

    `assurance_levels[]` may shrink over time as factor freshness windows expire,
    without the session itself expiring. Use step-up authentication (a new `auth_attempt`
    against the same `session_id`) to restore a dropped assurance level.
  tags:
    - Sessions
  parameters:
    # Declared here rather than shared: the shared `project_id` parameter is
    # required and names the project to act on. Here it is optional and states
    # which project the caller expects the cookie's session to belong to.
    - name: project_id
      in: query
      description: |
        The project the caller signs its users in to. The session is returned only
        when it belongs to this project, and answers `403` with
        `sess.project_mismatch` otherwise.

        A session belongs to one project, while a browser sends its cookie to every
        app on the same host. An app that reads the session to decide who is signed
        in passes its own project, so that a session of another project never reads
        as one of its users. The SDKs do this for you.

        `sess.project_mismatch` does not mean the session is invalid: it is live in
        its own project, so keep its cookie.
      schema:
        $ref: ../../../components/schemas/project-id.yaml
  security:
    - nextgenSession: []
  responses:
    '200':
      description: Session state.
      headers:
        Cache-Control:
          $ref: ../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: ../session-response.yaml
    '401':
      description: Missing or invalid session token.
      headers:
        Cache-Control:
          $ref: ../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/auth-unauthorized.yaml
    '403':
      description: The session belongs to a different project than `project_id`.
      headers:
        Cache-Control:
          $ref: ../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/sess-project_mismatch.yaml
    '404':
      description: Session not found.
      headers:
        Cache-Control:
          $ref: ../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/sess-not_found.yaml
    default:
      $ref: getMySession-error-response.yaml

delete:
  operationId: revokeMySession
  summary: Revoke my session
  description: |
    Logs out by permanently deleting the session.

    The `__nextgen_session` cookie issued at creation (or superseded by a handoff
    exchange) is required. Idempotent: if the session is already gone this still
    returns 204. Any tokens derived from the session are invalidated, and the
    cookie itself is cleared in the response.
  tags:
    - Sessions
  security:
    - nextgenSession: []
  responses:
    '204':
      description: Session deleted; cookie cleared. Idempotent — also returned when the session was already absent.
      headers:
        Set-Cookie:
          $ref: ../../../components/headers/set-cookie-session-token.yaml
    '401':
      description: Missing or invalid session token.
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/auth-unauthorized.yaml

    default:
      $ref: revokeMySession-error-response.yaml
