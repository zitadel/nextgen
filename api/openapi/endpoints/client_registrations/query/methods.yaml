post:
  operationId: queryClientRegistrations
  x-zitadel-cli: client-registrations list
  summary: Query client registrations
  description: |
    Returns the clients that registered themselves into the project through
    dynamic client registration (RFC 7591), paginated with a cursor. Clients
    register at the authorization server's registration endpoint, never
    through this API.
  tags:
    - Apps
  security:
    - oauth2:
        - app.read
    - nextgenSession: []
  parameters:
    - $ref: ../../../components/parameters/project-id.yaml
  requestBody:
    description: Request to query the client registrations of a project.
    required: true
    content:
      application/json:
        schema:
          $ref: query-client-registrations-request.yaml
  responses:
    '200':
      description: The client registrations were returned successfully.
      content:
        application/json:
          schema:
            $ref: query-client-registrations-response.yaml
    '400':
      description: The filter or the sort names a field or an operation client registrations do not support.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: Project not found.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: queryClientRegistrations-error-response.yaml
