type: object
description: OpenID Connect configuration according to the OpenID Connect Discovery 1.0 specification.
required:
  - issuer
  - authorization_endpoint
  - jwks_uri
  - response_types_supported
  - subject_types_supported
  - id_token_signing_alg_values_supported
properties:
  issuer:
    type: string
    format: uri
    description: "REQUIRED. URL using the https scheme with no query or fragment components that the OP asserts as its Issuer Identifier."
  authorization_endpoint:
    type: string
    format: uri
    description: "REQUIRED. URL of the OP's OAuth 2.0 Authorization Endpoint."
  token_endpoint:
    type: string
    format: uri
    description: "URL of the OP's OAuth 2.0 Token Endpoint. REQUIRED unless only the Implicit Flow is used."
  userinfo_endpoint:
    type: string
    format: uri
    description: "RECOMMENDED. URL of the OP's UserInfo Endpoint."
  jwks_uri:
    type: string
    format: uri
    description: "REQUIRED. URL of the OP's JWK Set document containing the signing key(s) the RP uses to validate signatures from the OP."
  registration_endpoint:
    type: string
    format: uri
    description: "RECOMMENDED. URL of the OP's Dynamic Client Registration Endpoint."
  scopes_supported:
    type: array
    items:
      type: string
    description: "RECOMMENDED. JSON array containing a list of the OAuth 2.0 scope values that this server supports. The server MUST support the openid scope value."
    example: ["openid", "profile", "email", "address", "phone", "offline_access"]
  response_types_supported:
    type: array
    items:
      type: string
    description: "REQUIRED. JSON array containing a list of the OAuth 2.0 response_type values that this OP supports."
    example: ["code", "id_token", "id_token token"]
  response_modes_supported:
    type: array
    items:
      type: string
    description: "OPTIONAL. JSON array containing a list of the OAuth 2.0 response_mode values that this OP supports. Default is [\"query\", \"fragment\"]."
    example: ["query", "fragment", "form_post"]
  grant_types_supported:
    type: array
    items:
      type: string
    description: "OPTIONAL. JSON array containing a list of the OAuth 2.0 Grant Type values that this OP supports. Default is [\"authorization_code\", \"implicit\"]."
    example: ["authorization_code", "implicit", "refresh_token"]
  acr_values_supported:
    type: array
    items:
      type: string
    description: "OPTIONAL. JSON array containing a list of the Authentication Context Class References that this OP supports."
  subject_types_supported:
    type: array
    items:
      type: string
      enum: [public, pairwise]
    description: "REQUIRED. JSON array containing a list of the Subject Identifier types that this OP supports. Valid types include pairwise and public."
    example: ["public", "pairwise"]
  id_token_signing_alg_values_supported:
    type: array
    items:
      type: string
    description: "REQUIRED. JSON array containing a list of the JWS signing algorithms (alg values) supported by the OP for the ID Token. The algorithm RS256 MUST be included."
    example: ["RS256", "ES256"]
  id_token_encryption_alg_values_supported:
    type: array
    items:
      type: string
    description: "OPTIONAL. JSON array containing a list of the JWE encryption algorithms (alg values) supported by the OP for the ID Token."
    example: ["RSA-OAEP-256", "A128KW"]
  id_token_encryption_enc_values_supported:
    type: array
    items:
      type: string
    description: "OPTIONAL. JSON array containing a list of the JWE encryption algorithms (enc values) supported by the OP for the ID Token."
    example: ["A128CBC-HS256", "A128GCM"]
  userinfo_signing_alg_values_supported:
    type: array
    items:
      type: string
    description: "OPTIONAL. JSON array containing a list of the JWS signing algorithms (alg values) supported by the UserInfo Endpoint."
    example: ["RS256", "ES256", "HS256"]
  userinfo_encryption_alg_values_supported:
    type: array
    items:
      type: string
    description: "OPTIONAL. JSON array containing a list of the JWE encryption algorithms (alg values) supported by the UserInfo Endpoint."
    example: ["RSA-OAEP-256", "A128KW"]
  userinfo_encryption_enc_values_supported:
    type: array
    items:
      type: string
    description: "OPTIONAL. JSON array containing a list of the JWE encryption algorithms (enc values) supported by the UserInfo Endpoint."
    example: ["A128CBC-HS256", "A128GCM"]
  request_object_signing_alg_values_supported:
    type: array
    items:
      type: string
    description: "OPTIONAL. JSON array containing a list of the JWS signing algorithms (alg values) supported by the OP for Request Objects. Servers SHOULD support none and RS256."
    example: ["none", "RS256", "ES256"]
  request_object_encryption_alg_values_supported:
    type: array
    items:
      type: string
    description: "OPTIONAL. JSON array containing a list of the JWE encryption algorithms (alg values) supported by the OP for Request Objects."
  request_object_encryption_enc_values_supported:
    type: array
    items:
      type: string
    description: "OPTIONAL. JSON array containing a list of the JWE encryption algorithms (enc values) supported by the OP for Request Objects."
  token_endpoint_auth_methods_supported:
    type: array
    items:
      type: string
      enum: [client_secret_post, client_secret_basic, client_secret_jwt, private_key_jwt]
    description: "OPTIONAL. JSON array containing a list of Client Authentication methods supported by the Token Endpoint. Default is client_secret_basic."
    example: ["client_secret_basic", "client_secret_post", "private_key_jwt"]
  token_endpoint_auth_signing_alg_values_supported:
    type: array
    items:
      type: string
    description: "OPTIONAL. JSON array containing a list of the JWS signing algorithms supported by the Token Endpoint for private_key_jwt and client_secret_jwt authentication. The value none MUST NOT be used."
    example: ["RS256", "ES256"]
  display_values_supported:
    type: array
    items:
      type: string
      enum: [page, popup, touch, wap]
    description: "OPTIONAL. JSON array containing a list of the display parameter values that the OpenID Provider supports."
    example: ["page", "popup"]
  claim_types_supported:
    type: array
    items:
      type: string
      enum: [normal, aggregated, distributed]
    description: "OPTIONAL. JSON array containing a list of the Claim Types that the OpenID Provider supports. Default is normal."
    example: ["normal"]
  claims_supported:
    type: array
    items:
      type: string
    description: "RECOMMENDED. JSON array containing a list of the Claim Names of the Claims that the OpenID Provider MAY be able to supply values for."
    example: ["sub", "iss", "auth_time", "acr", "name", "given_name", "family_name", "nickname", "profile", "picture", "website", "email", "email_verified", "locale", "zoneinfo"]
  service_documentation:
    type: string
    format: uri
    description: "OPTIONAL. URL of a page containing human-readable information for developers using the OpenID Provider."
  claims_locales_supported:
    type: array
    items:
      type: string
    description: "OPTIONAL. Languages and scripts supported for values in Claims being returned, as BCP47 language tag values."
    example: ["en-US", "de-DE"]
  ui_locales_supported:
    type: array
    items:
      type: string
    description: "OPTIONAL. Languages and scripts supported for the user interface, as BCP47 language tag values."
    example: ["en-US", "de-DE"]
  claims_parameter_supported:
    type: boolean
    description: "OPTIONAL. Boolean value specifying whether the OP supports use of the claims parameter. Default is false."
    default: false
  request_parameter_supported:
    type: boolean
    description: "OPTIONAL. Boolean value specifying whether the OP supports use of the request parameter. Default is false."
    default: false
  request_uri_parameter_supported:
    type: boolean
    description: "OPTIONAL. Boolean value specifying whether the OP supports use of the request_uri parameter. Default is true."
    default: true
  require_request_uri_registration:
    type: boolean
    description: "OPTIONAL. Boolean value specifying whether the OP requires any request_uri values used to be pre-registered. Default is false."
    default: false
  op_policy_uri:
    type: string
    format: uri
    description: "OPTIONAL. URL the OP provides to the person registering the Client about the OP's requirements on how the Relying Party can use the data provided."
  op_tos_uri:
    type: string
    format: uri
    description: "OPTIONAL. URL the OP provides to the person registering the Client about the OpenID Provider's terms of service."