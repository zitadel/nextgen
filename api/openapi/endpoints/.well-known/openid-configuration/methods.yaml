get:
  operationId: getOpenIDConfiguration
  summary: Get OpenID Connect configuration
  description: Retrieve the OpenID Connect configuration
  tags:
    - Authorization
  security: []
  responses:
    '200':
      description: OpenID Connect configuration retrieved successfully
      content:
        application/json:
          schema:
            $ref: openid-configuration.yaml
    '4XX':
      description: The request was rejected by the server.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml