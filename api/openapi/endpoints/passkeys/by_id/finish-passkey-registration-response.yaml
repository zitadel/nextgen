type: object
required:
  - passkey_id
  - created_at
properties:
  passkey_id:
    type: string
    description: Opaque identifier for the newly registered passkey credential.
    example: '1234567'
  created_at:
    type: string
    format: date-time
    description: When the passkey was registered.
    example: '2026-06-01T12:00:00Z'
