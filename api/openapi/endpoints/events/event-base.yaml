type: object
# Maintainer note, moved verbatim from the description:
# Shared wide-event envelope (ADR 048 / ADR 049). Concrete events are
# `allOf` this schema plus a `const` `event_type` and a typed `payload`.
description: |
  The fields every event carries. Each event type adds its own `event_type`
  value and a typed `payload`.
required:
  - id
  - project_id
  - event_type
  - category
  - occurred_at
  - created_at
  - client_id
properties:
  id:
    type: string
    description: The event ID (`evt_<opaque>`).
    example: evt_01HZYABCDEFGHJKMNPQRSTVWXY
  project_id:
    $ref: ../../components/schemas/project-id.yaml
  team_id:
    description: The team the actor operated under when the event was emitted, if any.
    oneOf:
      - type: string
      - type: 'null'
  event_type:
    type: string
    # Maintainer note, moved verbatim from the description:
    # Discriminator for the Event union — see docs/design/api/events-catalog.md.
    description: |
      The event name, with dot-separated parts, such as `user.created`. It
      selects which event schema applies.
  category:
    type: string
    description: The category of the event.
    enum:
      - request
      - auth
      - session
      - admin
      - entity
      - signal
    example: entity
  occurred_at:
    type: string
    format: date-time
    # Maintainer note, moved verbatim from the description:
    # (server/storage clock, dialect-owned)
    description: When the action happened, by the server's clock.
  created_at:
    type: string
    format: date-time
    # Maintainer note, moved verbatim from the description:
    # (server/storage clock, dialect-owned)
    description: When the server stored the event, by the server's clock.
  actor_id:
    description: Who triggered the event.
    oneOf:
      - type: string
      - type: 'null'
  actor_type:
    description: The kind of actor.
    oneOf:
      - type: string
        enum:
          - human
          - service
          - system
          - agent
      - type: 'null'
  entity_type:
    description: The type of resource affected.
    oneOf:
      - type: string
      - type: 'null'
  entity_id:
    description: The ID of the resource affected.
    oneOf:
      - type: string
      - type: 'null'
  client_id:
    type: string
    description: Application or agent that produced the event.
  token_id:
    type: string
    description: The ID of the token present when the event was emitted, if any.
  delegation_type:
    type: string
    description: The kind of delegation. Omitted when unset.
    enum:
      - direct
      - delegated
      - pat_shared
      - exchanged
  delegation_id:
    type: string
  grantor:
    type: string
  fingerprint:
    type: string
    description: Device fingerprint correlation ID.
  request_id:
    description: HTTP request correlation ID.
    oneOf:
      - type: string
      - type: 'null'
  session_id:
    description: Session correlation ID.
    oneOf:
      - type: string
      - type: 'null'
  flow_id:
    description: Login flow correlation ID.
    oneOf:
      - type: string
      - type: 'null'
  metadata:
    $ref: ../../components/schemas/event-metadata.yaml
