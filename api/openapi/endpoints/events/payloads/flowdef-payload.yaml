title: FlowdefPayload
type: object
description: |
  The fields recorded for the created revision. Retired `flowdef.updated`
  events carry the changed fields in the same shape. Steps are left out.
properties:
  name:
    type: string
  status:
    type: string
  user_schema:
    type: string
  purposes:
    type: object
    additionalProperties:
      type: string
  audience:
    type: object
    properties:
      app_ids:
        type: array
        items:
          type: string
      team_ids:
        type: array
        items:
          type: string
