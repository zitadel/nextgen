title: DeploymentCreatedPayload
type: object
description: |
  Allowlisted fields for `deployment.created`. The deployment id is already
  the event's `entity_id`; the fields here say what went live where.
properties:
  origin:
    type: string
  deploy_id:
    type: string
  release_id:
    type: string
  reason:
    type: string
  message:
    type: string
  rollback_of:
    type: string
