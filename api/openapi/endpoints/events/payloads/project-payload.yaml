title: ProjectPayload
type: object
description: |
  The fields recorded for `project.created` (a full snapshot) and
  `project.updated` (only the changed fields).
properties:
  name:
    type: string
  origins:
    type: array
    items:
      $ref: ../../projects/project-origin.yaml
  password_hash_algorithm:
    type: string
    description: |
      The password hashing algorithm the project switched to. The empty string
      means it was handed back to the server default. Absent when the update
      did not touch hashing.
