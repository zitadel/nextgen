title: ReleaseCreatedPayload
type: object
description: |
  The fields recorded for `release.created`. The release ID is already the
  event's `entity_id`. The pinned set is repeated here, so the audit stream
  shows what a release contained without reading the release itself.
properties:
  content_hash:
    type: string
  message:
    type: string
  git_sha:
    type: string
  git_dirty:
    type: boolean
  pointers:
    type: array
    items:
      type: object
      properties:
        kind:
          type: string
        handle:
          type: string
        revision_id:
          type: string
