title: IdpPayload
type: object
description: |
  The fields recorded for `idp.created` (a snapshot) and `idp.updated` (only
  the changed fields, plus the new `revision_id`). The connection ID is the
  event's `entity_id`. The connection document, and with it the
  `client_secret` reference, is never included.
required:
  - revision_id
properties:
  slug:
    type: string
  protocol:
    type: string
  template:
    type: string
    description: |
      The rendering template hint. On `idp.updated`, the empty string means
      the revision removed it.
  display_name:
    type: string
  revision_id:
    type: string
    description: The revision the write appended.
