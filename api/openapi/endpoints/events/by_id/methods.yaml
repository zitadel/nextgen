get:
  operationId: getEvent
  x-zitadel-cli: events get
  summary: Get an event by ID
  # Maintainer note, moved verbatim from the description:
  # Events are not registered in `resource_scope_index`; project scope is
  # required on the query (ADR 049).
  description: |
    Returns one event of a project, found by its ID. Requires `events.read`.

    The query must name the project. An event that does not exist, or that
    belongs to another project, returns 404.

    Until a project is claimed, its stored events stay hidden and the request
    returns 404.
  tags:
    - Events
  security:
    - oauth2:
        - events.read
  parameters:
    - $ref: ../../../components/parameters/event-id.yaml
    - $ref: ../../../components/parameters/project-id.yaml
  responses:
    '200':
      description: The event.
      content:
        application/json:
          schema:
            $ref: ../event.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: No event was found for the given project and ID, or the project is not yet claimed.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: getEvent-error-response.yaml
