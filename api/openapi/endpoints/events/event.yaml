type: object
description: |
  One append-only wide event (ADR 048 / ADR 049). Clients use `event_type`
  to interpret `payload` — typed shapes are documented in
  [event-payload.yaml](event-payload.yaml) (RequestAPIPayload,
  UserCreatedPayload, EmptyEventPayload, etc.).
required:
  - id
  - project_id
  - event_type
  - category
  - occurred_at
  - created_at
  - client_id
  - payload
properties:
  id:
    type: string
    description: Managed event id (`evt_<opaque>`).
    example: evt_01HZYABCDEFGHJKMNPQRSTVWXY
  project_id:
    $ref: ../../components/schemas/project-id.yaml
  team_id:
    description: Emit-time team scope, when the actor operated under a team.
    oneOf:
      - type: string
      - type: 'null'
  event_type:
    type: string
    description: |
      Semantic event name (dot-separated). Discriminator for `payload`
      shape — see docs/design/api/events-catalog.md.
    enum:
      - request.api
      - project.created
      - project.updated
      - project.deleted
      - user.created
      - user.updated
      - user.create.failed
      - user.deactivated
      - user.deleted
      - team.created
      - team.updated
      - team.deactivated
      - team.membership.updated
      - auth.token.issued
      - auth.token.revoked
      - session.established
      - session.deleted
      - session.expired
      - auth.attempt.created
      - auth.attempt.handed_off
      - auth.check.failed
      - auth.check.succeeded
      - claim.challenge_created
      - claim.completed
      - flowdef.created
      - flowdef.updated
      - flowdef.deleted
      - schema.created
      - schema.deleted
      - branding.created
      - authz.granted
      - authz.revoked
      - auth.factor.password.set
      - auth.factor.password.removed
      - auth.factor.totp.enrolled
      - auth.factor.totp.removed
      - auth.factor.passkey.enrolled
      - auth.factor.passkey.removed
      - auth.factor.recovery.created
      - auth.factor.recovery.removed
    example: user.created
  category:
    type: string
    description: Wide-event category.
    enum:
      - request
      - auth
      - session
      - admin
      - entity
      - signal
    example: entity
  occurred_at:
    type: string
    format: date-time
    description: When the action happened (DB clock).
  created_at:
    type: string
    format: date-time
    description: When the row was inserted (DB clock).
  actor_id:
    description: Who triggered the event.
    oneOf:
      - type: string
      - type: 'null'
  actor_type:
    description: Actor kind.
    oneOf:
      - type: string
        enum:
          - human
          - service
          - system
          - agent
      - type: 'null'
  entity_type:
    description: Resource type affected.
    oneOf:
      - type: string
      - type: 'null'
  entity_id:
    description: Resource id affected.
    oneOf:
      - type: string
      - type: 'null'
  client_id:
    type: string
    description: Application or agent that produced the event.
  token_id:
    type: string
    description: Token id present at emit time, when any.
  delegation_type:
    type: string
    description: Delegation kind (`direct`, etc.).
  delegation_id:
    type: string
  grantor:
    type: string
  fingerprint:
    type: string
    description: Device fingerprint correlation id.
  request_id:
    description: HTTP request correlation id.
    oneOf:
      - type: string
      - type: 'null'
  session_id:
    description: Session correlation id.
    oneOf:
      - type: string
      - type: 'null'
  flow_id:
    description: Login flow correlation id.
    oneOf:
      - type: string
      - type: 'null'
  payload:
    description: |
      Event-type-specific fields, already redacted at emit time (ADR 048).
      Clients MUST discriminate using `event_type`. Named property schemas
      (RequestAPIPayload, UserCreatedPayload, EmptyEventPayload, …) are
      declared in event-payload.yaml.

      Ogen workaround: the wire type is a free-form object rather than a
      payload oneOf. Several catalog payloads accept `{}`, so a true oneOf
      fails JSON Schema "exactly one" validation for empty payloads.
    type: object
    additionalProperties: true
  metadata:
    description: Additional emit-time metadata (already redacted).
    type: object
    additionalProperties: true
