get:
  operationId: listEvents
  x-zitadel-cli: events list
  summary: List events
  # Maintainer notes, moved verbatim from the description:
  # newest-first by keyset on `(created_at, id)` (ADR 027 / ADR 049)
  # (enforced when team-scoped tokens exist)
  # Clients discriminate each item via `event_type` (OpenAPI Event oneOf) —
  # see docs/design/api/events-catalog.md.
  description: |
    Returns the audit events of one project, newest first. Pass `order=asc`
    for oldest first. Requires `events.read`.

    Until a project is claimed, its events are stored but hidden, so the list
    is empty. Team-scoped credentials see only events whose emit-time
    `team_id` matches the credential's team.

    The `event_type` of each item says which event schema it follows.
  tags:
    - Events
  security:
    - oauth2:
        - events.read
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
    - name: category
      in: query
      description: |
        Filter by event category. Repeatable: an event matches any of the
        given values.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - request
            - auth
            - session
            - admin
            - entity
            - signal
    - name: event_type
      in: query
      description: |
        Exact-match filter on `event_type`. Repeatable: an event matches any
        of the given values.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    - name: actor_id
      in: query
      schema:
        type: string
    - name: client_id
      in: query
      schema:
        type: string
    - name: session_id
      in: query
      schema:
        type: string
    - name: flow_id
      in: query
      schema:
        type: string
    - name: request_id
      in: query
      schema:
        type: string
    - name: fingerprint
      in: query
      schema:
        type: string
    - name: entity_type
      in: query
      schema:
        type: string
    - name: entity_id
      in: query
      schema:
        type: string
    - name: team_id
      in: query
      description: Filter by the emit-time team scope stored on the event.
      schema:
        type: string
    - name: created_after
      in: query
      description: Inclusive lower bound on `created_at` (RFC 3339).
      schema:
        type: string
        format: date-time
    - name: created_before
      in: query
      description: Exclusive upper bound on `created_at` (RFC 3339).
      schema:
        type: string
        format: date-time
    - name: order
      in: query
      description: |
        Sort direction on `created_at`, then `id`. The default `desc` returns
        the newest first, which suits an audit UI. Pass `asc` for oldest first.
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
    - $ref: ../../components/parameters/page-token.yaml
    - $ref: ../../components/parameters/limit.yaml
  responses:
    '200':
      description: A page of events.
      content:
        application/json:
          schema:
            $ref: list-events-response.yaml
    '400':
      description: The request is invalid, for example because of a query parameter or page token.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    default:
      $ref: listEvents-error-response.yaml
