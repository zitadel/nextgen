description: |
  Typed event payload shapes. Clients select the member via the parent
  Event's `event_type` (see docs/design/api/events-catalog.md). Empty
  event types share EmptyEventPayload.

  OpenAPI oneOf alone is ambiguous for empty/`{}` payloads (several
  members accept empty objects), so Event.payload on the wire is a free-form
  object; this schema documents the properties each event_type carries.
oneOf:
  - $ref: payloads/request-api-payload.yaml
  - $ref: payloads/project-created-payload.yaml
  - $ref: payloads/project-updated-payload.yaml
  - $ref: payloads/user-created-payload.yaml
  - $ref: payloads/user-updated-payload.yaml
  - $ref: payloads/user-create-failed-payload.yaml
  - $ref: payloads/user-deactivated-payload.yaml
  - $ref: payloads/team-created-payload.yaml
  - $ref: payloads/team-updated-payload.yaml
  - $ref: payloads/team-membership-updated-payload.yaml
  - $ref: payloads/auth-token-issued-payload.yaml
  - $ref: payloads/session-established-payload.yaml
  - $ref: payloads/session-deleted-payload.yaml
  - $ref: payloads/auth-attempt-created-payload.yaml
  - $ref: payloads/auth-attempt-handed-off-payload.yaml
  - $ref: payloads/auth-check-payload.yaml
  - $ref: payloads/claim-completed-payload.yaml
  - $ref: payloads/flowdef-payload.yaml
  - $ref: payloads/schema-payload.yaml
  - $ref: payloads/branding-created-payload.yaml
  - $ref: payloads/authz-granted-payload.yaml
  - $ref: payloads/authz-revoked-payload.yaml
  - $ref: payloads/auth-factor-payload.yaml
  - $ref: payloads/empty-event-payload.yaml
