post:
  operationId: createDeployment
  summary: Create a deployment
  description: |
    Makes a release live on its targets by recording a deployment,
    atomically: on success every target serves the release and the record
    exists; on failure nothing changes and no record is written.

    Name the release by exactly one of `release_id` or `content_hash`; it
    must already exist in the project. `targets` is `primary` or preview
    URLs. The deployment freezes the project's variable values for its kind,
    with no fallback between primary and preview values.

    A deployment to `primary` changes nothing when the project's newest
    primary deployment has the same release and frozen values and covers
    exactly the current primary origins: the call answers `200` with that
    deployment. Any other request writes a new deployment and answers `201`;
    for preview URLs that record renews their previews.

    Failures:
    - `400 dep.invalid`: both or neither of `release_id` and `content_hash`;
      a primary origin named exactly; `primary` mixed with preview URLs;
      `primary` on a project with no primary origin; `ttl` with `primary`;
      `ttl` above the project's maximum.
    - `400 dep.variables_missing`: a referenced variable has no value for
      the kind; `details` names the kind and every missing variable.
    - `403 proj.origin_not_allowed`: a preview URL matches no preview
      pattern.
    - `404 rel.not_found`: the release id or digest names no release here.
    - `409 dep.conflict`: `expected_deployment_id` is not the deployment
      this write replaces; `details.deployment` is that deployment.
    - `409 rel.revoked`: the release is revoked.
  tags:
    - Deployments
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
  security:
    - oauth2:
        - deployment.write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: create-deployment-request.yaml
        examples:
          primary:
            summary: Deploy to every primary origin, guarded
            description: |
              The guard names the deployment the caller inspected before
              deploying.
            value:
              release_id: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
              targets:
                - primary
              message: add phone_number to human-user
              expected_deployment_id: dep_01KX4SB9C8E1F0N9WD3P2E4YM5
          preview:
            summary: Deploy to two preview URLs for a week
            value:
              content_hash: sha256:9f2c1a7b4e83d05f6c2b19ae7d430f821c6b5de90a4f73829f2c1a7b4e83d05f
              targets:
                - https://acme-git-sso-acmeinc.vercel.app
                - https://acme-k3x9v2-acmeinc.vercel.app
              ttl: 168h
  responses:
    '200':
      description: |
        Nothing changed. The body is the newest primary deployment, with its
        own `reason`, `message` and `deployed_at`.
      content:
        application/json:
          schema:
            $ref: deployment.yaml
          examples:
            alreadyLive:
              summary: The release the primary origins already serve, deployed again
              value:
                id: dep_01KX4SB9C8E1F0N9WD3P2E4YM5
                project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                release_id: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
                kind: primary
                targets:
                  - origin: https://app.acme.com
                  - origin: https://www.acme.com
                status: live
                deployed_at: '2026-10-01T09:30:00Z'
                metadata:
                  reason: deploy
                  message: initial import
                  rollback_to: null
                  deployed_by: user_01KWH3B72K7M7F0N9WD3P2E4YM
                  deployed_by_type: human
    '201':
      description: |
        The deployment was created and every target serves the release.
      content:
        application/json:
          schema:
            $ref: deployment.yaml
          examples:
            deployed:
              summary: A release deployed to every primary origin
              description: '`primary` comes back as every primary origin the project had.'
              value:
                id: dep_01KX5N7C9D2E7F0N9WD3P2E4YM6
                project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                release_id: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
                kind: primary
                targets:
                  - origin: https://app.acme.com
                  - origin: https://www.acme.com
                status: live
                deployed_at: '2026-10-02T14:52:00Z'
                metadata:
                  reason: deploy
                  message: add phone_number to human-user
                  rollback_to: null
                  deployed_by: user_01KWH3B72K7M7F0N9WD3P2E4YM
                  deployed_by_type: human
            previewed:
              summary: A release deployed to two preview URLs
              description: Each target carries the expiry of its preview.
              value:
                id: dep_01KX5M2A0C4D7F0N9WD3P2E4YM8
                project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                release_id: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
                kind: preview
                targets:
                  - origin: https://acme-git-sso-acmeinc.vercel.app
                    expires_at: '2026-10-09T14:10:00Z'
                  - origin: https://acme-k3x9v2-acmeinc.vercel.app
                    expires_at: '2026-10-09T14:10:00Z'
                status: live
                deployed_at: '2026-10-02T14:10:00Z'
                metadata:
                  reason: deploy
                  message: null
                  rollback_to: null
                  deployed_by: null
                  deployed_by_type: service
    '400':
      description: '`dep.invalid` or `dep.variables_missing`, as the operation lists.'
      content:
        application/json:
          schema:
            $ref: create-deployment-bad-request.yaml
          examples:
            exactPrimaryOrigin:
              summary: A primary origin named exactly
              description: |
                Primary origins are deployed as a whole: send `primary`.
              value:
                code: dep.invalid
                message: deploy primary origins with the primary keyword
            variablesMissing:
              summary: The release references variables with no preview value
              description: |
                Set each missing variable for the kind, then deploy again.
              value:
                code: dep.variables_missing
                message: 'deployment: variables have no preview value: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET'
                details:
                  kind: preview
                  names:
                    - GOOGLE_CLIENT_ID
                    - GOOGLE_CLIENT_SECRET
            invalid:
              summary: Both release_id and content_hash
              value:
                code: dep.invalid
                message: name the release by exactly one of release_id and content_hash
    '403':
      description: 'A preview URL matches no preview pattern: `proj.origin_not_allowed`.'
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
          examples:
            originNotAllowed:
              summary: A URL the project's preview patterns do not admit
              value:
                code: proj.origin_not_allowed
                message: 'project: origin not allowed'
                details:
                  origin: https://acme.example
    '404':
      description: 'The release id or digest names no release of the project: `rel.not_found`.'
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
          examples:
            releaseNotFound:
              summary: No such release
              value:
                code: rel.not_found
                message: 'release: not found'
    '409':
      description: '`dep.conflict` (guard mismatch) or `rel.revoked`.'
      content:
        application/json:
          schema:
            $ref: deployment-conflict.yaml
          examples:
            conflict:
              summary: Another deployment reached the target first
              description: |
                Inspect the deployment in the details, then retry with its id
                as `expected_deployment_id`, or stop.
              value:
                code: dep.conflict
                message: 'deployment: the deployment it replaces does not match expected_deployment_id'
                details:
                  deployment:
                    id: dep_01KX6P8D0E3F7F0N9WD3P2E4YM7
                    project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                    release_id: rel_01KX2QF7Z6D0F0N9WD3P2E4YM40
                    kind: primary
                    targets:
                      - origin: https://app.acme.com
                      - origin: https://www.acme.com
                    status: live
                    deployed_at: '2026-10-02T15:03:00Z'
                    metadata:
                      reason: deploy
                      message: soften the sign-in page contrast
                      rollback_to: null
                      deployed_by: null
                      deployed_by_type: null
            revoked:
              summary: The release is revoked
              value:
                code: rel.revoked
                message: 'release: revoked'
    default:
      $ref: createDeployment-error-response.yaml
get:
  operationId: listDeployments
  summary: List deployments
  description: |
    Lists what ran where, and when.

    By default the list is the history, newest first: every deployment of
    the project with every target it made the release live on. With
    `origin`, the history of that origin alone.

    With `live=true`, the list is what is served now: the project's newest
    primary deployment, narrowed to origins that are still primary, then the
    newest deployment to each live preview URL, newest first, narrowed to
    the URLs it still serves. Combined with `origin`, it is the one
    deployment that origin serves, or empty.

    `expand: ["release"]` embeds the release each deployment made live; it
    requires `release.read` and does not change the ordering or the page
    tokens.
  tags:
    - Deployments
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
    - $ref: ../../components/parameters/origin-filter.yaml
    - name: live
      in: query
      required: false
      description: |
        Lists what each target serves now instead of the history. Defaults
        to `false`.
      schema:
        type: boolean
        default: false
    - name: expand
      in: query
      required: false
      description: Related objects to embed on each returned deployment.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: deployment-expand.yaml
    - $ref: ../../components/parameters/limit.yaml
    - $ref: ../../components/parameters/page-token.yaml
  security:
    - oauth2:
        - deployment.read
  responses:
    '200':
      description: The deployments were listed successfully.
      content:
        application/json:
          schema:
            $ref: list-deployments-response.yaml
          examples:
            history:
              summary: The history, newest first
              description: |
                A later deployment to `primary` replaced the earlier one on
                every primary origin, so the earlier one is inactive. The
                preview deployment still serves its URL.
              value:
