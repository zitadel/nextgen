post:
  operationId: createDeployment
  summary: Create a deployment
  description: |
    Makes a release live on one or more targets by appending a deployment row
    per target, all in one transaction under one `deploy_id`. What a target
    serves is its newest row, so nothing else moves.

    The variables each row runs are frozen at this moment: the project's
    variable store is resolved (`preview` values overriding `all` values when
    every target is a preview origin) and copied onto the deployment, so a
    later edit of the store reaches no deployment until the next deploy.

    Idempotent on release and values: when every target's newest row already
    names this release with the same frozen values, nothing is written and the
    answer is `200` with those rows.
  tags:
    - Deployments
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
  security:
    - oauth2:
        - deployment.write
    - oauth2:
        - deployment.preview
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: create-deployment-request.yaml
        examples:
          deploy:
            summary: Deploy to the default and every primary origin
            value:
              release: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
              targets: [default, primary]
              message: add phone_number to human-user
          preview:
            summary: Register two preview URLs for seven days
            value:
              release: sha256:9f2c1a7b4e83d05f6c2b19ae7d430f821c6b5de90a4f7382
              targets:
                - https://acme-git-sso-acmeinc.vercel.app
                - https://acme-k3x9v2-acmeinc.vercel.app
              ttl_seconds: 604800
  responses:
    '200':
      description: Every target already serves this release with these values; nothing changed.
      content:
        application/json:
          schema:
            $ref: deploy-response.yaml
    '201':
      description: The rows were written and the targets now serve the release.
      content:
        application/json:
          schema:
            $ref: deploy-response.yaml
    default:
      $ref: createDeployment-error-response.yaml
get:
  operationId: listDeployments
  summary: List deployments
  description: |
    Lists deployments newest first. Bare, it is the project-wide log. `origin`
    narrows it to one target's history (`""` for the default), `deploy_id` to
    the rows one deploy wrote, and `live=true` to the newest row per target —
    what each one serves right now, with `expires_at` filled for previews.

    `expand: ["release"]` embeds the release each row made live; it requires
    `release.read`.
  tags:
    - Deployments
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
    - name: origin
      in: query
      required: false
      description: One target's history. The empty string is the project default.
      schema:
        type: string
      allowEmptyValue: true
    - name: deploy_id
      in: query
      required: false
      description: The rows one deploy wrote.
      schema:
        type: string
    - name: live
      in: query
      required: false
      description: The newest row per target only.
      schema:
        type: boolean
    - name: expand
      in: query
      required: false
      description: Related objects to embed on each returned deployment.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: deployment-expand.yaml
    - $ref: ../../components/parameters/limit.yaml
    - $ref: ../../components/parameters/page-token.yaml
  security:
    - oauth2:
        - deployment.read
  responses:
    '200':
      description: The deployments were listed successfully.
      content:
        application/json:
          schema:
            $ref: list-deployments-response.yaml
    default:
      $ref: listDeployments-error-response.yaml
