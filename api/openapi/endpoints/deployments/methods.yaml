post:
  operationId: createDeployment
  summary: Create a deployment
  description: |
    Makes a release live on a set of targets by recording a deployment. The
    two happen atomically: when the call returns, every target serves the
    named release and the record exists; on any failure every target keeps
    serving what it served and no record is written.

    The release is named by exactly one of `release_id` or `content_hash`
    (both or neither answers `400` with `dep.invalid`), and must already
    exist in the project: deploying never assembles a release. An
    unknown release id or digest answers `404` with `rel.not_found`, and a
    revoked release answers `409` with `rel.revoked`.

    `targets` lists `primary`, which expands to every primary origin of the
    project, and exact origins. An origin that is neither a primary origin
    of the project nor matches one of its preview patterns answers `403`
    with `proj.origin_not_allowed`, and `primary` on a project with no
    primary origin answers `400` with `dep.invalid`. The deployment records
    the resolved origins, sorted, never the keyword.

    A deployment to preview URLs creates the preview for each of them, or
    renews it when it exists, in the same transaction, with the expiry set
    from `ttl`; each target in the response carries that expiry. Primary
    origins and preview URLs cannot be mixed in one deployment: that
    answers `400` with `dep.invalid`.

    Idempotent on what is served: when every resolved target already serves
    the release, nothing changes and the call answers `200` with the newest
    deployment to those targets, so a re-run of `zitadel deploy` on
    unchanged content is a no-op end to end. Anything else writes a new
    record covering all of the resolved targets, including the same release
    returning after something else was served in between: the log is
    append-only, and each record is one act of making a release live.

    `expected_deployment_id` guards against racing another deploy: when
    present, the write only happens if the newest deployment to any of the
    resolved targets still is the one named, and a mismatch answers `409`
    with `dep.conflict`, carrying the actual newest deployment.
  tags:
    - Deployments
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
  security:
    - oauth2:
        - deployment.write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: create-deployment-request.yaml
        examples:
          primary:
            summary: Deploy to every primary origin
            value:
              release_id: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
              targets:
                - primary
              message: add phone_number to human-user
          byContentHash:
            summary: Deploy a release named by its digest, guarded
            description: |
              The release is looked up by content. The guard names the
              deployment the caller inspected before deploying.
            value:
              content_hash: sha256:9f2c1a7b4e83d05f6c2b19ae7d430f821c6b5de90a4f73829f2c1a7b4e83d05f
              targets:
                - https://app.acme.com
              expected_deployment_id: dep_01KX4SB9C8E1F0N9WD3P2E4YM5
          preview:
            summary: Deploy to two preview URLs for a week
            value:
              content_hash: sha256:9f2c1a7b4e83d05f6c2b19ae7d430f821c6b5de90a4f73829f2c1a7b4e83d05f
              targets:
                - https://acme-git-sso-acmeinc.vercel.app
                - https://acme-k3x9v2-acmeinc.vercel.app
              ttl: 168h
  responses:
    '200':
      description: |
        Every target already serves this release; nothing changed. The
        deployment is the newest one to the targets — note its original
        `reason`, `message` and `deployed_at`, not this request's.
      content:
        application/json:
          schema:
            $ref: deployment.yaml
          examples:
            alreadyLive:
              summary: The release the primary origins already serve, deployed again
              value:
                id: dep_01KX5N7C9D2E7F0N9WD3P2E4YM6
                project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                release_id: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
                targets:
                  - origin: https://app.acme.com
                  - origin: https://www.acme.com
                deployed_at: '2026-10-02T14:52:00Z'
                metadata:
                  reason: deploy
                  message: add phone_number to human-user
                  rollback_to: null
                  deployed_by: user_01KWH3B72K7M7F0N9WD3P2E4YM
                  deployed_by_type: human
    '201':
      description: |
        The deployment was created and every target now serves the release.
      content:
        application/json:
          schema:
            $ref: deployment.yaml
          examples:
            deployed:
              summary: A release deployed to every primary origin
              description: '`primary` comes back as the origins it expanded to.'
              value:
                id: dep_01KX5N7C9D2E7F0N9WD3P2E4YM6
                project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                release_id: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
                targets:
                  - origin: https://app.acme.com
                  - origin: https://www.acme.com
                deployed_at: '2026-10-02T14:52:00Z'
                metadata:
                  reason: deploy
                  message: add phone_number to human-user
                  rollback_to: null
                  deployed_by: user_01KWH3B72K7M7F0N9WD3P2E4YM
                  deployed_by_type: human
            previewed:
              summary: A release deployed to two preview URLs
              description: Each target carries the expiry of its preview.
              value:
                id: dep_01KX5M2A0C4D7F0N9WD3P2E4YM8
                project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                release_id: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
                targets:
                  - origin: https://acme-git-sso-acmeinc.vercel.app
                    expires_at: '2026-10-09T14:10:00Z'
                  - origin: https://acme-k3x9v2-acmeinc.vercel.app
                    expires_at: '2026-10-09T14:10:00Z'
                deployed_at: '2026-10-02T14:10:00Z'
                metadata:
                  reason: deploy
                  message: null
                  rollback_to: null
                  deployed_by: null
                  deployed_by_type: service
    '409':
      description: |
        Either the guard did not match, answered with `dep.conflict` and the
        actual newest deployment in `details.deployment`, or the release is
        revoked, answered with `rel.revoked`.
      content:
        application/json:
          schema:
            $ref: deployment-conflict.yaml
          examples:
            conflict:
              summary: Another deployment reached the target first
              description: |
                Inspect the deployment in the details, then retry with its id
                as `expected_deployment_id`, or stop.
              value:
                code: dep.conflict
                message: 'deployment: the newest deployment to the targets does not match expected_deployment_id'
                details:
                  deployment:
                    id: dep_01KX6P8D0E3F7F0N9WD3P2E4YM7
                    project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                    release_id: rel_01KX2QF7Z6D0F0N9WD3P2E4YM40
                    targets:
                      - origin: https://app.acme.com
                      - origin: https://www.acme.com
                    deployed_at: '2026-10-02T15:03:00Z'
                    metadata:
                      reason: deploy
                      message: soften the sign-in page contrast
                      rollback_to: null
                      deployed_by: null
                      deployed_by_type: null
            revoked:
              summary: The release is revoked
              value:
                code: rel.revoked
                message: 'release: revoked'
    default:
      $ref: createDeployment-error-response.yaml
get:
  operationId: listDeployments
  summary: List deployments
  description: |
    Lists deployments newest first: what ran where, and when.

    By default the list is the history: every deployment of the project, each
    with every target it made the release live on. With `origin`, it is the
    history of that origin alone, and its first row is the deployment the
    origin serves.

    With `live=true`, the list is what is served now: the newest deployment
    to each target, each carrying only the targets it still serves, with
    the expiry of each preview URL. A deployment every target of which has
    since been replaced, or whose previews have all expired or been
    removed, does not appear. Combined with `origin`, the live view is the one deployment that
    origin serves, or empty.

    `expand: ["release"]` embeds the release each deployment made live, so a
    history renders with each entry's content without resolving `release_id`
    one by one. Expanding requires `release.read` and does not affect the
    ordering or the page tokens.
  tags:
    - Deployments
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
    - $ref: ../../components/parameters/origin-filter.yaml
    - name: live
      in: query
      required: false
      description: |
        Lists what each target serves now instead of the history. Defaults
        to `false`.
      schema:
        type: boolean
        default: false
    - name: expand
      in: query
      required: false
      description: Related objects to embed on each returned deployment.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: deployment-expand.yaml
    - $ref: ../../components/parameters/limit.yaml
    - $ref: ../../components/parameters/page-token.yaml
  security:
    - oauth2:
        - deployment.read
  responses:
    '200':
      description: The deployments were listed successfully.
      content:
        application/json:
          schema:
            $ref: list-deployments-response.yaml
          examples:
            history:
              summary: The history, newest first
              description: |
                A later deployment replaced the release on `app` only, so the
                earlier one keeps both of its targets in the history.
              value:
                deployments:
                  - id: dep_01KX6P8D0E3F7F0N9WD3P2E4YM7
                    project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                    release_id: rel_01KX2QF7Z6D0F0N9WD3P2E4YM40
                    targets:
                      - origin: https://app.acme.com
                    deployed_at: '2026-10-02T15:03:00Z'
                    metadata:
                      reason: rollback
                      message: phone_number broke sign-up
                      rollback_to: null
                      deployed_by: user_01KWH3B72K7M7F0N9WD3P2E4YM
                      deployed_by_type: human
                  - id: dep_01KX5N7C9D2E7F0N9WD3P2E4YM6
                    project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                    release_id: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
                    targets:
                      - origin: https://app.acme.com
                      - origin: https://www.acme.com
                    deployed_at: '2026-10-02T14:52:00Z'
                    metadata:
                      reason: deploy
                      message: add phone_number to human-user
                      rollback_to: null
                      deployed_by: null
                      deployed_by_type: null
                next_page_token: null
            live:
              summary: The same project, live view
              description: |
                Each deployment carries only the targets it still serves:
                `app` moved on, `www` did not.
              value:
                deployments:
                  - id: dep_01KX6P8D0E3F7F0N9WD3P2E4YM7
                    project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                    release_id: rel_01KX2QF7Z6D0F0N9WD3P2E4YM40
                    targets:
                      - origin: https://app.acme.com
                    deployed_at: '2026-10-02T15:03:00Z'
                    metadata:
                      reason: rollback
                      message: phone_number broke sign-up
                      rollback_to: null
                      deployed_by: user_01KWH3B72K7M7F0N9WD3P2E4YM
                      deployed_by_type: human
                  - id: dep_01KX5N7C9D2E7F0N9WD3P2E4YM6
                    project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                    release_id: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
                    targets:
                      - origin: https://www.acme.com
                    deployed_at: '2026-10-02T14:52:00Z'
                    metadata:
                      reason: deploy
                      message: add phone_number to human-user
                      rollback_to: null
                      deployed_by: null
                      deployed_by_type: null
                next_page_token: null
            expandedRelease:
              summary: The history with each release embedded
              value:
                deployments:
                  - id: dep_01KX5N7C9D2E7F0N9WD3P2E4YM6
                    project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                    release_id: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
                    targets:
                      - origin: https://app.acme.com
                      - origin: https://www.acme.com
                    deployed_at: '2026-10-02T14:52:00Z'
                    metadata:
                      reason: deploy
                      message: add phone_number to human-user
                      rollback_to: null
                      deployed_by: null
                      deployed_by_type: null
                    release:
                      id: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
                      project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                      metadata:
                        message: add phone_number to human-user
                        git_sha: 4a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7
                        git_dirty: false
                        created_at: '2026-10-02T14:51:00Z'
                        created_by: user_01KWH3B72K7M7F0N9WD3P2E4YM
                        created_by_type: human
                      pointers:
                        - kind: schema
                          handle: human-user
                          revision_id: sch_01KWHF18816ZQE7F0N9WD3P2E4
                        - kind: branding
                          handle: default
                          revision_id: brnd_01KWH8Q5NZT7F0N9WD3P2E4YM6
                next_page_token: null
    default:
      $ref: listDeployments-error-response.yaml
