post:
  operationId: createDeployment
  summary: Create a deployment
  description: |
    Makes a release live on one or more targets as one deployment, written in
    one transaction. What a target serves is the newest deployment naming it,
    so nothing else moves.

    The variables the deployment runs are frozen at this moment: the
    project's variable store is resolved (`preview` values overriding `all`
    values when every target is a preview origin) and copied onto the
    deployment, so a later edit of the store reaches no deployment until the
    next deploy.

    Idempotent on release and values: when every target already serves this
    release from one deployment with the same frozen values, nothing is
    written and the answer is `200` with that deployment.
  tags:
    - Deployments
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
  security:
    - oauth2:
        - deployment.write
    - oauth2:
        - deployment.preview
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: create-deployment-request.yaml
        examples:
          deploy:
            summary: Deploy to the default and every primary origin
            value:
              release: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
              targets: [default, primary]
              message: add phone_number to human-user
          preview:
            summary: Register two preview URLs for seven days
            value:
              release: sha256:9f2c1a7b4e83d05f6c2b19ae7d430f821c6b5de90a4f7382
              targets:
                - https://acme-git-sso-acmeinc.vercel.app
                - https://acme-k3x9v2-acmeinc.vercel.app
              ttl_seconds: 604800
  responses:
    '200':
      description: Every target already serves this release with these values; nothing changed.
      content:
        application/json:
          schema:
            $ref: create-deployment-response.yaml
    '201':
      description: The deployment was written and the targets now serve the release.
      content:
        application/json:
          schema:
            $ref: create-deployment-response.yaml
    default:
      $ref: createDeployment-error-response.yaml
get:
  operationId: listDeployments
  summary: List deployments
  description: |
    Lists deployments newest first. Bare, it is the project-wide log. `origin`
    narrows it to the deployments that touched one target (`""` for the
    default). `live=true` answers what every target serves right now: the
    deployments current for at least one target, each listing only the
    targets it serves, with `expires_at` filled for previews.

    `expand: ["release"]` embeds the release each deployment made live; it
    requires `release.read`.
  tags:
    - Deployments
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
    - name: origin
      in: query
      required: false
      description: The deployments that touched one target. The empty string is the project default.
      schema:
        type: string
      allowEmptyValue: true
    - name: live
      in: query
      required: false
      description: What every target serves right now, instead of the log.
      schema:
        type: boolean
    - name: expand
      in: query
      required: false
      description: Related objects to embed on each returned deployment.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: deployment-expand.yaml
    - $ref: ../../components/parameters/limit.yaml
    - $ref: ../../components/parameters/page-token.yaml
  security:
    - oauth2:
        - deployment.read
  responses:
    '200':
      description: The deployments were listed successfully.
      content:
        application/json:
          schema:
            $ref: list-deployments-response.yaml
    default:
      $ref: listDeployments-error-response.yaml
