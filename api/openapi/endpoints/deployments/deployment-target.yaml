title: DeploymentTarget
description: |
  One target a deployment made its release live on. Discriminate on `type`.

  - `origin`: a web origin, named by `origin`.
  - `default`: the project's default target, the one a caller with no origin is
    served. It has no origin.
oneOf:
  - $ref: deployment-origin-target.yaml
  - $ref: deployment-default-target.yaml
discriminator:
  propertyName: type
  mapping:
    origin: deployment-origin-target.yaml
    default: deployment-default-target.yaml
