title: DeploymentTarget
type: object
description: One target a deployment made its release live on, a web origin or `default`.
required:
  - origin
properties:
  origin:
    $ref: deployment-target-origin.yaml
  expires_at:
    type: string
    format: date-time
    description: |
      Preview URLs only: the expiry this deployment set. A later deployment
      to the URL records its own.
    example: '2026-10-09T14:10:00Z'
