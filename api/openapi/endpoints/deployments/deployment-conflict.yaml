title: DeploymentConflict
description: |
  The deployment conflicts with the project, told apart by `code`:
  `dep.conflict` (guard mismatch) or `rel.revoked`.
oneOf:
  - $ref: deployment-guard-conflict.yaml
  - $ref: release-revoked-conflict.yaml
discriminator:
  propertyName: code
  mapping:
    dep.conflict: deployment-guard-conflict.yaml
    rel.revoked: release-revoked-conflict.yaml
