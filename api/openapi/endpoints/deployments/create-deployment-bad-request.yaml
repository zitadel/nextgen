title: CreateDeploymentBadRequest
description: |
  The deployment cannot be made, told apart by `code`; `req.invalid` is a
  request the schema rejects.
oneOf:
  - $ref: ../../components/schemas/errors/dep-invalid.yaml
  - $ref: deployment-variables-missing.yaml
  - $ref: ../../components/schemas/errors/req-invalid.yaml
discriminator:
  propertyName: code
  mapping:
    dep.invalid: ../../components/schemas/errors/dep-invalid.yaml
    dep.variables_missing: deployment-variables-missing.yaml
    req.invalid: ../../components/schemas/errors/req-invalid.yaml
