get:
  operationId: getDeploymentVariables
  summary: Get the variables a deployment runs
  description: |
    The values frozen onto the deployment when it was written — what the target
    serves, not what the store holds now. A preview deployment prefers the
    `preview` override of each name and falls back to the `all` value; a primary
    deployment runs only the `all` values. Secrets are reported as held and
    never disclosed.
  tags:
    - Deployments
  security:
    - oauth2:
        - deployment.read
        - variable.read
  parameters:
    - $ref: ../../../../components/parameters/project-id.yaml
    - $ref: ../../../../components/parameters/deployment-id.yaml
  responses:
    '200':
      description: The frozen variables, keyed by name.
      content:
        application/json:
          schema:
            $ref: ../../../variables/variables.yaml
    default:
      $ref: getDeploymentVariables-error-response.yaml
