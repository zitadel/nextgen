get:
  operationId: getDeploymentById
  summary: Get a deployment by id
  description: |
    Reads one deployment record.

    The lookup is scoped to the project in `project_id`: a deployment id
    belonging to another project answers not found exactly as an unknown id
    does, so the endpoint cannot be used to probe for deployments in projects
    the caller cannot read.
  tags:
    - Deployments
  security:
    - oauth2:
        - deployment.read
  parameters:
    - $ref: ../../../components/parameters/project-id.yaml
    - $ref: ../../../components/parameters/deployment-id.yaml
  responses:
    '200':
      description: The deployment was retrieved successfully.
      content:
        application/json:
          schema:
            $ref: ../deployment.yaml
          examples:
            rolledBack:
              summary: A rollback row on a primary origin
              value:
                id: dep_01KX5N7C9D2E7F0N9WD3P2E4YM6
                project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                deploy_id: dpl_01KX5N7C9D2E7F0N9WD3P2E4YM7
                origin: https://app.acme.com
                release_id: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
                deployed_at: '2026-07-14T10:02:00Z'
                metadata:
                  reason: rollback
                  rollback_of: dpl_01KX5N7C9D2E7F0N9WD3P2E4YM5
                  deployed_by: user_01KWH3B72K7M7F0N9WD3P2E4YM
                  deployed_by_type: human
    default:
      $ref: getDeploymentById-error-response.yaml
