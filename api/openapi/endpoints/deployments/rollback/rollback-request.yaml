type: object
properties:
  deployment_id:
    description: |
      The deployment to go back to. Omitted, the newest deployment is undone;
      given, what that deployment set is re-applied on every target it
      touched.
    oneOf:
      - $ref: ../../../components/schemas/deployment-id.yaml
      - type: 'null'
  origin:
    description: Narrow the rollback to one target. `""` is the project default.
    oneOf:
      - type: string
      - type: 'null'
  message:
    type: string
    maxLength: 1024
