title: DeploymentGuardConflict
type: object
description: |
  `expected_deployment_id` did not match: another deployment reached the
  targets first.
required:
  - code
  - message
  - details
properties:
  code:
    type: string
    const: dep.conflict
  message:
    type: string
    description: Human-readable explanation of the error.
  details:
    type: object
    required:
      - deployment
    properties:
      deployment:
        description: |
          The actual newest deployment to the targets, to inspect before
          retrying with its id as `expected_deployment_id`. Null when nothing
          has been deployed to any of the targets yet.
        oneOf:
          - $ref: deployment.yaml
          - type: 'null'
