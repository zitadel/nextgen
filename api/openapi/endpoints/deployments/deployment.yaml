title: Deployment
description: |
  An immutable record of a release being made live on a set of targets.

  Deploying and rolling back both create a deployment. The record is what
  ran where and when — the release, the targets and the timestamp — plus
  metadata saying why and who. It is append-only: written once, in one
  transaction for all of its targets, and never changed afterwards, so the
  deployment log is the audit trail of what ran where.

  A target serves the release of the newest deployment that targeted it.
  An older deployment stays in the history after a newer one replaces it on
  some or all of its targets.
type: object
required:
  - id
  - project_id
  - release_id
  - targets
  - deployed_at
  - metadata
properties:
  id:
    readOnly: true
    description: The opaque, immutable resource id, assigned at creation.
    $ref: ../../components/schemas/deployment-id.yaml
  project_id:
    readOnly: true
    description: The project this deployment belongs to.
    $ref: ../../components/schemas/project-id.yaml
  release_id:
    readOnly: true
    description: |
      The release this deployment made live. Always the release id, also
      when the request named the release by `content_hash`.
    $ref: ../../components/schemas/release-id.yaml
  targets:
    readOnly: true
    type: array
    minItems: 1
    description: |
      The origins this deployment made the release live on, as resolved when
      it was created: `primary` appears here as the origins it expanded to.
      Sorted by origin.
    items:
      $ref: deployment-target.yaml
  deployed_at:
    readOnly: true
    type: string
    format: date-time
    description: When the deployment was created.
    example: '2026-10-02T14:52:00Z'
  metadata:
    readOnly: true
    $ref: deployment-metadata.yaml
  release:
    readOnly: true
    description: |
      The release named by `release_id`, present only when the request asked
      for it with `expand: ["release"]` — the same representation
      `GET /releases/{release_id}` serves. Absent means it was not requested.
    $ref: ../releases/release.yaml
