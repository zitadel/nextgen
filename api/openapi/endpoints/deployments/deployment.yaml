title: Deployment
description: |
  An immutable record of one release being made live on a set of targets at
  one instant.

  Deploying and rolling back both append deployments. A target is an origin
  string: the empty string is the project default, anything else is a
  primary origin or a live preview URL. What a target serves is the newest
  deployment that names it; nothing points at a deployment and nothing
  updates one.
type: object
required:
  - id
  - project_id
  - release_id
  - targets
  - deployed_at
  - metadata
properties:
  id:
    readOnly: true
    description: The opaque, immutable resource id, assigned at creation.
    $ref: ../../components/schemas/deployment-id.yaml
  project_id:
    readOnly: true
    description: The project this deployment belongs to.
    $ref: ../../components/schemas/project-id.yaml
  release_id:
    readOnly: true
    description: The release this deployment made live.
    $ref: ../../components/schemas/release-id.yaml
  targets:
    readOnly: true
    type: array
    minItems: 1
    description: |
      The targets this deployment made the release live on, origin ASC. In
      the live view (`live=true`) only the targets this deployment currently
      serves are listed.
    items:
      $ref: deployment-target.yaml
  deployed_at:
    readOnly: true
    type: string
    format: date-time
    description: When the deployment was created.
    example: '2026-07-14T09:11:00Z'
  metadata:
    readOnly: true
    $ref: deployment-metadata.yaml
  release:
    readOnly: true
    description: |
      The release named by `release_id`, present only when the request asked
      for it with `expand: ["release"]`.
    $ref: ../releases/release.yaml
