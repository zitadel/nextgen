title: DeploymentMetadata
type: object
description: |
  Why the release went live here and who made it happen. Set when the
  deployment is created and never mutated afterwards.
properties:
  reason:
    $ref: ../../components/schemas/deployment-reason.yaml
  message:
    description: The caller-supplied summary of why this deployment happened.
    oneOf:
      - type: string
        maxLength: 1024
      - type: 'null'
    example: hotfix for the login outage
  rollback_of:
    description: |
      On a rollback, the deployment this one reversed, so the trail reads
      forwards and backwards.
    oneOf:
      - $ref: ../../components/schemas/deployment-id.yaml
      - type: 'null'
    example: dep_01KX3RG8A7F0N9WD3P2E4YM5C1
  deployed_by:
    description: |
      The identity that created the deployment. Absent when the caller is a
      machine principal carrying no user identity.
    oneOf:
      - type: string
      - type: 'null'
    example: user_01KX3RG8A7F0N9WD3P2E4YM5C1
  deployed_by_type:
    description: What kind of principal `deployed_by` names.
    oneOf:
      - type: string
        enum:
          - human
          - service
          - system
          - agent
      - type: 'null'
    example: human
