title: DeploymentTargetOrigin
type: string
description: |
  A web origin this deployment made live, or `default` for the project's
  default target. The origin form is the same string as `Origin`.
pattern: '^(default|https?://(\[[0-9a-f:.]+\]|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*)(:(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3}))?)$'
maxLength: 2048
example: https://app.acme.com
