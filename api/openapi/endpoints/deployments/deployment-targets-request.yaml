title: DeploymentTargetsRequest
type: array
minItems: 1
maxItems: 50
uniqueItems: true
description: |
  Where the release goes live. Each entry is one of:

  - `primary` — every primary origin of the project, expanded when the
    deployment is created. The deployment records the origins it expanded
    to, so a primary origin added later is not part of it.
  - An exact origin, such as `https://app.acme.com`, in the form `Origin`
    describes, which must be one of the project's primary origins.

  The deployment covers every target in one transaction: either all of
  them serve the release afterwards or none does.
items:
  type: string
  pattern: '^(primary|https?://(\[[0-9a-f:.]+\]|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*)(:(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3}))?)$'
  maxLength: 2048
example:
  - primary
