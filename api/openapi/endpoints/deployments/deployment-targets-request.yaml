title: DeploymentTargetsRequest
type: array
minItems: 1
maxItems: 50
uniqueItems: true
description: |
  Where the release goes live: `primary`, which resolves to every current
  primary origin; `default`, the target for callers with no origin; or
  preview URLs in `Origin` form, each matching one of the project's preview
  patterns. `default` may be named with `primary`. Primary origins cannot be
  named one by one, and neither keyword can be mixed with a preview URL.
items:
  type: string
  pattern: '^(primary|default|https?://(\[[0-9a-f:.]+\]|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*)(:(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3}))?)$'
  maxLength: 2048
example:
  - primary
