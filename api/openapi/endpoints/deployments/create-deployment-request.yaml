title: CreateDeploymentRequest
type: object
description: |
  The release to make live, named by exactly one of `release_id` or
  `content_hash`, and the targets to make it live on.
required:
  - targets
additionalProperties: false
properties:
  release_id:
    description: The release to make live.
    $ref: ../../components/schemas/release-id.yaml
  content_hash:
    description: |
      The content digest of the release to make live, in full with its
      `sha256:` prefix.
    $ref: ../../components/schemas/release-content-hash.yaml
  targets:
    $ref: deployment-targets-request.yaml
  ttl:
    description: |
      Preview URLs only. Each preview stays live this long from this
      deployment; omitted, 7 days (`7d`). At most 365 days (`365d`).
    $ref: ../../components/schemas/preview-ttl.yaml
  reason:
    description: |
      Why this deployment happens. Omitted, the server records `deploy`.
    $ref: ../../components/schemas/deployment-reason.yaml
  message:
    type: string
    maxLength: 1024
    description: |
      A short free-form summary of why this deployment happened, recorded on
      its metadata.
    example: add phone_number to human-user
  expected_deployment_id:
    description: |
      Deploy only if the deployment this write replaces — the project's
      newest primary deployment, or the newest deployment to any of the
      preview URLs — is this one. Otherwise the request fails with
      `409 dep.conflict` and nothing changes. Not stored.
    $ref: ../../components/schemas/deployment-id.yaml
