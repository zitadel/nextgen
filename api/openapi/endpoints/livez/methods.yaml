get:
  operationId: getLive
  tags:
    - System
  summary: Check server liveness
  description: |
    Answers `ok` while the server process serves HTTP, and checks nothing behind it.

    Point a liveness probe here. It never checks the database, so an outage
    of the database does not restart every instance; `GET /readyz` takes an
    instance out of rotation instead.
  security: []
  responses:
    '200':
      description: The server process serves HTTP.
      content:
        text/plain:
          examples:
            ok:
              summary: Server is live
              value: ok
    '4XX':
      description: The request was rejected by the server.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    default:
      $ref: getLive-error-response.yaml
