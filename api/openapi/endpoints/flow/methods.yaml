post:
  operationId: createFlow
  summary: Start a new flow
  description: |
    Resolves a flow definition based on purpose + audience context and returns
    the first capability step. Creates a new session implicitly unless
    `session_id` is provided, together with that session's `session_token`
    (for step-up / reauth on an existing session).

    The browser `Origin` header selects which deployment serves this attempt:
    the gate admits the origin against the project's origin patterns and live
    previews, the newest deployment to that exact origin is the target, and
    that deployment's release supplies flow definitions, user schemas and
    branding. The resolved deployment is sealed into the `_zflow` cookie so
    later steps keep the same configuration. An origin that matches no pattern
    answers `403` with `proj.origin_not_allowed`; one that matches a preview
    pattern with no live preview answers `403` with `proj.preview_not_live`;
    nothing deployed to the target answers `409` with `rel.not_deployed`; a
    revoked release answers `409` with `rel.revoked`. A request with no
    `Origin` passes the gate. A loopback origin passes it too, and so does a
    console origin, from which the console previews a project's login; a step
    submitted from a console origin is still refused unless the project lists
    it. Any of these with nothing deployed to its origin is served the
    `default` target when that has a deployment.

    The response contains an `id` field — the flow handle. Use it as the path
    parameter for all subsequent `/flow/{id}/submit` calls.

    The response also sets an encrypted `HttpOnly` cookie (`_zflow`) containing
    the flow's orchestration state (current step, collected data, history).
    The server is stateless between requests — all flow state lives in this
    cookie. The browser sends it automatically on subsequent requests.
  tags:
    - Flows
  security: []
  parameters:
    - name: Origin
      in: header
      required: false
      description: |
        Standard browser `Origin` header. Selects the deployment that serves
        this attempt: matched against the project's origin patterns and live
        previews, then against the newest deployment to that exact origin.
        Browsers send it automatically; no client action is required. Absent
        when the caller is not a browser.
      schema:
        type: string
        format: uri
        example: https://www.acme.com
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/flows/create-flow-request.yaml
  responses:
    '201':
      description: Flow started, first step returned.
      headers:
        Set-Cookie:
          $ref: ../../components/headers/set-cookie-flow.yaml
        Cache-Control:
          $ref: ../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/flows/flow-response.yaml
    '400':
      description: Invalid request (e.g., unknown purpose).
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '403':
      description: |
        The `Origin` is not admitted: `proj.origin_not_allowed` when it matches
        no pattern of the project, or `proj.preview_not_live` when it matches a
        preview pattern with no live preview for that exact URL.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
          examples:
            origin_not_allowed:
              summary: Origin matches no project pattern
              value:
                code: proj.origin_not_allowed
                message: 'https://evil.example is not an origin of this project'
            preview_not_live:
              summary: Preview pattern matched but no live preview
              value:
                code: proj.preview_not_live
                message: 'no live preview for https://acme-k3x9v2-acmeinc.vercel.app; run zitadel preview on this branch'
    '409':
      description: |
        Nothing is deployed to the resolved target (`rel.not_deployed`), or the
        release of that deployment is revoked (`rel.revoked`).
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
          examples:
            not_deployed:
              summary: No deployment for this origin
              value:
                code: rel.not_deployed
                message: 'nothing is deployed to https://www.acme.com'
            revoked:
              summary: The release is revoked
              value:
                code: rel.revoked
                message: 'the release this attempt runs on was revoked'
    default:
      $ref: createFlow-error-response.yaml
