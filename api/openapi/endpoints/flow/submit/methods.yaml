post:
  operationId: submitFlowStep
  summary: Submit a step and advance
  description: |
    Submits user input for the current step of a flow and returns the next visible
    step. The server validates the input, processes it (for example, verifies a
    credential) and moves the flow through any steps the user does not see.

    The response sets an updated encrypted `HttpOnly` cookie (`_zflow`)
    with the new flow state. The server keeps no state between requests: all
    flow state is carried in this cookie.

    **Important:** The `id` in the response may differ from the `id` used in
    the request. This happens when a flow pivots (pushes a new flow onto the
    stack) or when a stacked flow completes (auto-pops to the parent flow).
    Always use the `id` from the latest response for the next request.

    ## Flow completion

    When `step.type` is `complete`, the flow is terminal. The `step.behavior`
    field tells the frontend what to do:

    | `behavior`   | Action                                                     |
    |------------- |------------------------------------------------------------|
    | `redirect`   | Navigate to `redirect_uri` (OIDC/SAML auth request done). |
    | `show`       | Render the step as a success screen (for example, registration). |

    A `complete` step is only returned when the **entire flow stack** is done.
    If a stacked flow (for example, recovery pivoted from login) finishes, the
    server auto-pops to the parent flow and returns the parent's next step. The
    frontend never sees a `complete` for intermediate flows.

    ## External sign-in

    `{action: "sso", sso_provider_id, return_target}` on a step that offers
    `sso_providers` returns the `sso-redirect` step that the server emits. The
    frontend navigates to its `redirect_url`.

    - The flow state does not change, but `_zflow` is re-sealed like on
      every response, so its ten-minute window restarts at this submission;
      the external sign-in and the return must complete within it.
    - A second `Set-Cookie` line carries the browser-binding cookie the
      callback checks: `HttpOnly`, `Path=/`, `SameSite=Lax`.
    - On every host except http loopback it is `__Host-_zsso` with `Secure`.
    - When the request host is http loopback (local development, where
      Safari rejects `Secure`), it is `_zsso` with no `Secure`. The
      `__Host-` prefix is dropped because it requires `Secure`.

    An identity provider whose `client_id` is a `${{ NAME }}` reference has it
    filled from the project's variables. If the server cannot start a sign-in
    with a provider, including when a reference has no variable behind it, it
    renders the step again with `error.sso_unavailable`.

    Reuses the deployment sealed into `_zflow` at `createFlow`. It does not
    re-resolve from `Origin`. If that release was revoked since the attempt
    started, the response is `409` with `rel.revoked`.
  tags:
    - Flows
  security: []
  parameters:
    - $ref: ../../../components/parameters/flow-id.yaml
    - $ref: ../../../components/parameters/flow-cookie.yaml
    - name: Origin
      in: header
      required: false
      description: |
        Standard browser `Origin` header. When a step issues a passkey
        challenge, the server derives the WebAuthn relying-party ID and the
        allowed origin from this value. An sso submission is bound to it as
        well: `return_target` must be on this origin, and the callback route
        is built under it (see External sign-in above). Browsers send it
        automatically on the fetch POST; no client action is required.
      schema:
        type: string
        format: uri
        example: https://login.example.com
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../../components/flows/flow-submit-request.yaml
  responses:
    '200':
      description: |
        The next step. The `id` may have changed if a pivot or stack-pop occurred;
        always use the returned `id` for the next request.
      headers:
        Set-Cookie:
          $ref: ../../../components/headers/set-cookie-flow.yaml
        Cache-Control:
          $ref: ../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: ../../../components/flows/flow-response.yaml
    '400':
      description: |
        Validation or proof verification failed. Returns the same step
        with an `error` field. The session token and cookie are still rotated.
      headers:
        Set-Cookie:
          $ref: ../../../components/headers/set-cookie-flow.yaml
        Cache-Control:
          $ref: ../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: ../../../components/flows/flow-response.yaml
    '409':
      description: |
        The request conflicts with the flow's state. The flow session moved on under
        another request (`flow.session_conflict`), the flow's authentication attempt
        expired or was already handed off (`flow.restart_required`) so a new flow must
        be started, or the sealed release was revoked (`rel.revoked`). A submission
        racing the request that hands the attempt off can still fail with
        `att.already_handed_off`.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
          examples:
            revoked:
              summary: The sealed release was revoked
              value:
                code: rel.revoked
                message: 'the release this attempt runs on was revoked'
    default:
      $ref: submitFlowStep-error-response.yaml
