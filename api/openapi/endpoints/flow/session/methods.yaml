get:
  operationId: getFlowStep
  summary: Get the current step
  description: |
    Returns the current step of a flow without advancing it. This is useful for
    page reloads, or to render the step again after a network error.

    Reuses the deployment sealed into `_zflow` at `createFlow`. It does not
    re-resolve from `Origin`. If that release was revoked since the attempt
    started, the response is `409` with `rel.revoked`.
  tags:
    - Flows
  security: []
  parameters:
    - $ref: ../../../components/parameters/flow-id.yaml
    - $ref: ../../../components/parameters/flow-cookie.yaml
  responses:
    '200':
      description: |
        The current step. Only a render that resolved a parked SSO identity sets
        the flow cookie. Any other render leaves it unchanged. When that render
        completed the sign-in, the step is terminal, the cookie is cleared, and the
        step carries the handoff token.
      headers:
        Set-Cookie:
          $ref: ../../../components/headers/set-cookie-flow.yaml
        Cache-Control:
          $ref: ../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: ../../../components/flows/flow-response.yaml
    '409':
      description: |
        The flow must be restarted. The provider's identity belongs to a user the
        flow cannot continue with, the flow's authentication attempt expired or was
        already handed off, or the sealed release was revoked (`rel.revoked`).
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
          examples:
            revoked:
              summary: The sealed release was revoked
              value:
                code: rel.revoked
                message: 'the release this attempt runs on was revoked'
    '404':
      description: Flow not found.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '410':
      description: Flow has already completed.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: getFlowStep-error-response.yaml