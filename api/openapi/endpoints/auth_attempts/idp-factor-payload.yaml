title: IdpFactorPayload
type: object
description: Identity provider-specific factor metadata
required:
  - provider_id
  - external_user_id
properties:
  provider_id:
    type: string
    description: Identity provider identifier
    example: 'google'
  external_user_id:
    type: string
    description: User ID from the identity provider
    example: '123456789'
  email:
    type: string
    format: email
    description: Email from identity provider (if available)
    nullable: true
