type: object
description: |
  Proof for verifying a factor challenge.
  
  The exact format depends on the challenge method. The proof object should contain
  only the credential/code/assertion relevant to the challenge method being verified.

oneOf:
  - type: object
    description: Proof for `identifier` method
    required:
      - login_name
    properties:
      login_name:
        type: string
        description: The login name or email being identified
        example: alice@acme.com
    additionalProperties: false

  - type: object
    description: Proof for `password` method
    required:
      - password
    properties:
      password:
        type: string
        description: The password being verified
        format: password
    additionalProperties: false

  - type: object
    description: Proof for `totp` method
    required:
      - totp
    properties:
      totp:
        type: object
        description: TOTP (time-based one-time password) credentials
        required:
          - code
        properties:
          code:
            type: string
            description: The 6-8 digit TOTP code
            pattern: '^\d{6,8}$'
            example: '123456'
    additionalProperties: false

  - type: object
    description: Proof for `otp_sms` method
    required:
      - otp_sms
    properties:
      otp_sms:
        type: object
        description: One-time code sent via SMS
        required:
          - code
        properties:
          code:
            type: string
            description: The code received via SMS
            pattern: '^\d{4,8}$'
            example: '123456'
    additionalProperties: false

  - type: object
    description: Proof for `otp_email` method
    required:
      - otp_email
    properties:
      otp_email:
        type: object
        description: One-time code sent via email
        required:
          - code
        properties:
          code:
            type: string
            description: The code received via email
            example: 'abc123def456'
    additionalProperties: false

  - type: object
    description: Proof for `recovery_code` method
    required:
      - recovery_code
    properties:
      recovery_code:
        type: string
        description: A recovery code
        example: 'AAAA-BBBB-CCCC-DDDD'
    additionalProperties: false

  - type: object
    description: Proof for `passkey` method
    required:
      - passkey
    properties:
      passkey:
        type: object
        description: WebAuthn passkey assertion
        required:
          - assertion
        properties:
          assertion:
            type: string
            description: The base64-encoded WebAuthn AssertionResponse JSON
            example: 'eyJ0eXBlIjoid2ViYXV0aG4uZ2V0IiwiY2hhbGxlbmdlIjoiLi4uIn0='
    additionalProperties: false

  - type: object
    description: Proof for `idp` method (federated login)
    required:
      - idp_assertion
    properties:
      idp_assertion:
        type: object
        description: Federated identity provider assertion
        required:
          - code
        properties:
          code:
            type: string
            description: The authorization code from the identity provider
            example: 'auth_code_from_idp'
          state:
            type: string
            description: The state parameter originally provided by the server
            example: 'state_value_for_csrf'
    additionalProperties: false

  - type: object
    description: Proof for `captcha` method
    required:
      - captcha
    properties:
      captcha:
        type: object
        description: CAPTCHA verification proof
        required:
          - token
        properties:
          token:
            type: string
            description: The CAPTCHA token or solution
            example: 'captcha_token_value'
    additionalProperties: false

