post:
  operationId: createAuthAttempt
  summary: Create a new authentication attempt
  description: |
    Starts a new authentication attempt. This is the entry point for the auth_attempts state machine.

    An attempt is an ephemeral (15-minute TTL) state machine that drives a single authentication round.
    It accepts factor challenges, verifies proofs, and completes into a session or handoff token.

    Accepts a project_id and challenge_nonce (from POST /bootstrap/challenge). For step-up re-auth,
    also include session_id and that session's session_token to add factors to an existing session.

    The project comes from the project secret. A body `project_id` that disagrees
    answers `403` with `proj.mismatch`. The attempt seals the deployment to the
    `default` target, whatever the caller's `Origin`. With nothing deployed
    there it answers `409` with `rel.no_default`, and a revoked release answers
    `409` with `rel.revoked`.
  tags:
    - Authentication Attempts
  security:
    - oauth2:
        - auth_attempt.write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: create-auth-attempt-request.yaml
  responses:
    '201':
      description: Authentication attempt created successfully
      content:
        application/json:
          schema:
            $ref: auth-attempt-response.yaml
    '403':
      description: |
        The body `project_id` does not match the project the credential
        belongs to (`proj.mismatch`).
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
          examples:
            mismatch:
              summary: Body project_id disagrees with the credential
              value:
                code: proj.mismatch
                message: 'the project named in the request is not the one the credential belongs to'
    default:
      $ref: createAuthAttempt-error-response.yaml
