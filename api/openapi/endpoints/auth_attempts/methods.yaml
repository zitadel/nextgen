post:
  operationId: createAuthAttempt
  summary: Create an authentication attempt
  # Maintainer notes moved here from the description:
  # - "This is the entry point for the auth_attempts state machine."
  # - "An ephemeral (15-minute TTL) state machine."
  # - "Sealed `deployment_id` / `release_id` are filled only when create runs with
  #   a runtime resolution already on the context (the flow create path)."
  description: |
    Starts a new authentication attempt for a project, optionally to add factors
    to an existing session.

    An attempt drives a single authentication round and lives for 15 minutes. It
    accepts factor challenges, verifies proofs, and completes into a session or
    handoff token.

    The request takes a `project_id` and a `challenge_nonce` (from POST
    /bootstrap/challenge). For step-up re-authentication, also include the
    `session_id` and that session's `session_token`.

    The project comes from the project secret. A body `project_id` that disagrees
    answers `403` with `proj.mismatch`. This HTTP entry point does not resolve
    the origin or refuse a revoked release itself.
  tags:
    - Authentication Attempts
  security:
    - oauth2:
        - auth_attempt.write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: create-auth-attempt-request.yaml
  responses:
    '201':
      description: The created authentication attempt.
      content:
        application/json:
          schema:
            $ref: auth-attempt-response.yaml
    '403':
      description: |
        The body `project_id` does not match the project the credential
        belongs to (`proj.mismatch`).
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
          examples:
            mismatch:
              summary: Body project_id disagrees with the credential
              value:
                code: proj.mismatch
                message: 'the project named in the request is not the one the credential belongs to'
    default:
      $ref: createAuthAttempt-error-response.yaml
