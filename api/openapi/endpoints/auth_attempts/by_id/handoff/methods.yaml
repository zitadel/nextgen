post:
  operationId: createHandoff
  summary: Complete authentication and create handoff token
  description: |
    Completes an authentication attempt and creates a handoff token to exchange for a session.

    Call this after all required factors have been verified and the attempt is in
    `completed` state. The handoff token is short-lived (60 seconds or less). The
    client exchanges it at POST /sessions/exchange for the final session and
    `session_token`.

    The handoff token is:
    - Single-use (the exchange is atomic, with no retry)
    - Audience-bound (the exchange requires the matching project key)
    - Safe to retry with an idempotency key within a 5-minute window (see conventions)

    A revoked sealed release is refused at the handoff exchange, not here.
  tags:
    - Authentication Attempts
  security:
    - oauth2:
        - auth_attempt.write
  parameters:
    - $ref: ../../../../components/parameters/attempt-id.yaml
    - $ref: ../../../../components/parameters/idempotency-key.yaml
      description: |
        Optional retry key for safe retries of the handoff creation.
        Retries carrying the same key within the exchange window return the same handoff token
        without re-completing the attempt or minting a new token.
  responses:
    '200':
      description: The handoff token.
      content:
        application/json:
          schema:
            $ref: handoff-response.yaml
    '409':
      description: |
        The attempt is not complete (`att.not_completed`).
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
          examples:
            not_completed:
              summary: The attempt is not complete
              value:
                code: att.not_completed
                message: 'authentication attempt is not completed'
    default:
      $ref: createHandoff-error-response.yaml
