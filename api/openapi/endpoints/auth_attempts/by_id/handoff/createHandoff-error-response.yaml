description: Error response
content:
  application/json:
    schema:
      oneOf:
        - $ref: '../../../../components/schemas/errors/att-not_found.yaml'
        - $ref: '../../../../components/schemas/errors/att-invalid_state.yaml'
        - $ref: '../../../../components/schemas/errors/att-not_completed.yaml'
        - $ref: '../../../../components/schemas/errors/internal.yaml'
      discriminator:
        propertyName: code
        mapping:
          att.not_found: '../../../../components/schemas/errors/att-not_found.yaml'
          att.invalid_state: '../../../../components/schemas/errors/att-invalid_state.yaml'
          att.not_completed: '../../../../components/schemas/errors/att-not_completed.yaml'
          internal: '../../../../components/schemas/errors/internal.yaml'
    examples:
      att.not_found:
        summary: att.not_found
        value:
          code: att.not_found
          message: auth attempt not found
      att.invalid_state:
        summary: att.invalid_state
        value:
          code: att.invalid_state
          message: invalid attempt state
      att.not_completed:
        summary: att.not_completed
        value:
          code: att.not_completed
          message: attempt not in completed state
      internal:
        summary: internal
        value:
          code: internal
          message: an unexpected error occurred
