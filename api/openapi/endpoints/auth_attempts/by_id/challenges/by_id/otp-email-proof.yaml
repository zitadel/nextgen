title: OtpEmailProof
type: object
description: Proof for `otp_email` method
required:
  - otp_email
additionalProperties: false
properties:
  otp_email:
    type: object
    description: One-time code sent via email
    required:
      - code
    properties:
      code:
        type: string
        description: The code received via email
        example: 'abc123def456'

