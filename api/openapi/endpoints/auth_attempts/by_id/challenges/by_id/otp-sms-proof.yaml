title: OtpSmsProof
type: object
description: Proof for `otp_sms` method
required:
  - otp_sms
additionalProperties: false
properties:
  otp_sms:
    type: object
    description: One-time code sent via SMS
    required:
      - code
    properties:
      code:
        type: string
        description: The code received via SMS
        pattern: '^\d{4,8}$'
        example: '123456'

