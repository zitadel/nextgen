post:
  operationId: verifyChallengeProof
  summary: Verify a factor proof
  description: |
    Submits a proof (credential, code, assertion) to verify a factor challenge.
    
    The proof format depends on the challenge method. For example:
    - `password` method: { password: "…" }
    - `totp` method: { totp: { code: "123456" } }
    - `passkey` method: { passkey: { assertion: "…" } }
    - `recovery_code` method: { recovery_code: "…" }
    
    On successful verification, the factor is written to the auth attempt.
    The attempt moves to the next pending challenge or completes if all required factors are verified.
  tags:
    - Authentication Attempts
  security:
    - oauth2:
        - auth_attempt.write
  parameters:
    - $ref: ../../../../../components/parameters/attempt-id.yaml
    - $ref: ../../../../../components/parameters/challenge-id.yaml
    - $ref: ../../../../../components/parameters/idempotency-key.yaml
      description: |
        Optional retry key for safe retries of the verification request.
        If a request with the same key has already been processed,
        the original response is returned.
        This prevents duplicate processing of the same proof in case of network issues or client retries.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: verify-challenge-request.yaml
  responses:
    '200':
      description: Proof verified successfully, factor  recorded on the auth attempt; it is materialized into a session only when the auth flow is completed
      content:
        application/json:
          schema:
            $ref: ../../../auth-attempt-response.yaml
    default:
      $ref: verifyChallengeProof-error-response.yaml
