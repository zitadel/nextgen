post:
  operationId: verifyChallengeProof
  summary: Verify a factor proof
  description: |
    Submits a proof (credential, code or assertion) to verify a factor challenge.

    The proof format depends on the challenge method. For example:
    - `password` method: { password: "…" }
    - `totp` method: { totp: { code: "123456" } }
    - `passkey` method: { passkey: { assertion: "…" } }
    - `recovery_code` method: { recovery_code: "…" }

    When verification succeeds, the factor is recorded on the authentication
    attempt. The attempt moves to the next pending challenge, or completes when
    all required factors are verified.
  tags:
    - Authentication Attempts
  security:
    - oauth2:
        - auth_attempt.write
  parameters:
    - $ref: ../../../../../components/parameters/attempt-id.yaml
    - $ref: ../../../../../components/parameters/challenge-id.yaml
    - $ref: ../../../../../components/parameters/idempotency-key.yaml
      description: |
        Optional retry key for safe retries of the verification request.
        If a request with the same key has already been processed,
        the original response is returned.
        This prevents duplicate processing of the same proof after network
        issues or client retries.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: verify-challenge-request.yaml
  responses:
    '200':
      description: |
        The proof was verified. The factor is recorded on the authentication
        attempt, and becomes part of a session only when the attempt is completed.
      content:
        application/json:
          schema:
            $ref: ../../../auth-attempt-response.yaml
    '409':
      description: |
        The proof was rejected (`att.proof_rejected`).
      content:
        application/json:
          schema:
            $ref: ../../../../../components/error-details.yaml
          examples:
            proof_rejected:
              summary: The proof was rejected
              value:
                code: att.proof_rejected
                message: 'the submitted proof was rejected'
    default:
      $ref: verifyChallengeProof-error-response.yaml
