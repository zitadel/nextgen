title: TotpProof
type: object
description: Proof for `totp` method
required:
  - totp
additionalProperties: false
properties:
  totp:
    type: object
    description: TOTP (time-based one-time password) credentials
    required:
      - code
    properties:
      code:
        type: string
        description: The 6-8 digit TOTP code
        pattern: '^\d{6,8}$'
        example: '123456'

