post:
  operationId: issueChallenge
  summary: Issue a factor challenge
  description: |
    Issues a verification challenge for one authentication factor within an
    authentication attempt.

    The request names the factor method to challenge (password, passkey, TOTP,
    OTP via SMS, and so on). The server responds with challenge details including
    the method, its metadata and any UI hints. The client then verifies the proof
    with POST /auth_attempts/{attempt_id}/challenges/{challenge_id}/verify.
  tags:
    - Authentication Attempts
  security:
    - oauth2:
        - auth_attempt.write
  parameters:
    - $ref: ../../../../components/parameters/attempt-id.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: issue-challenge-request.yaml
  responses:
    '201':
      description: The issued challenge.
      content:
        application/json:
          schema:
            $ref: challenge-response.yaml
    default:
      $ref: issueChallenge-error-response.yaml
