type: object
description: |
  A factor challenge issued within an authentication attempt.
  
  A challenge presents a single-factor verification prompt (password entry, TOTP code, passkey assertion, etc.).
  The client verifies the proof by POST /auth_attempts/{attempt_id}/challenges/{challenge_id}/verify.
required:
  - challenge_id
  - method
  - state
  - created_at
properties:
  challenge_id:
    $ref: ../../../../components/schemas/challenge-id.yaml
  method:
    $ref: ../../../../components/schemas/factor-method.yaml
    description: |
      The authentication method this challenge represents.
      Determines which proof is expected in verify.
  state:
    type: string
    enum:
      - pending
      - verified
      - failed
      - expired
    description: |
      Current state of this challenge:
      - `pending`: awaiting proof submission
      - `failed`: proof rejected (invalid credential, wrong code, etc.)
      - `expired`: challenge TTL exceeded without verification
  created_at:
    type: string
    format: date-time
    description: When this challenge was issued
    example: '2026-04-28T15:31:00Z'
  expires_at:
    description: When this challenge expires
    oneOf:
      - type: string
        format: date-time
        example: '2026-04-28T15:41:00Z'
      - type: 'null'
  payload:
    description: |
      Method-specific challenge data. Structure depends on the `method` field.
      - `identifier`, `password`: null (no additional data needed)
      - `passkey`: WebAuthn challenge and credential options
      - `idp`: Authorization URL and provider information
    oneOf:
      - $ref: ./identifier-challenge-payload.yaml
      - $ref: ./password-challenge-payload.yaml
      - $ref: ./passkey-challenge-payload.yaml
    discriminator:
      propertyName: method
      mapping:
        identifier: ./identifier-challenge-payload.yaml
        password: ./password-challenge-payload.yaml
        passkey: ./passkey-challenge-payload.yaml
