get:
  operationId: getVariable
  summary: Get a variable
  description: |
    Reads one of the project's variables by name. A name the project has not
    entered answers `var.not_found`. A secret is found but not disclosed: the
    response is `{"secret": true}`.

    `applies_to` selects which value is read: `all` (the default) or the
    `preview` override. A name with no value for the selected `applies_to`
    answers `var.not_found`.
  tags:
    - Variables
  parameters:
    - $ref: ../../../components/parameters/project-id.yaml
    - $ref: ../../../components/parameters/variable-name.yaml
    - $ref: ../../../components/parameters/environment-name-query.yaml
    - $ref: ../../../components/parameters/applies-to.yaml
  security:
    - oauth2:
        - variable.read
  responses:
    '200':
      description: The variable was retrieved successfully.
      content:
        application/json:
          schema:
            $ref: ../variable.yaml
    default:
      $ref: getVariable-error-response.yaml

delete:
  operationId: deleteVariable
  summary: Delete a variable
  description: |
    Removes the project's variable under this name. Deleting a name the
    project does not hold answers `var.not_found`.

    `applies_to` selects which value is removed: `all` (the default) or the
    `preview` override. Removing one leaves the other standing.
  tags:
    - Variables
  parameters:
    - $ref: ../../../components/parameters/project-id.yaml
    - $ref: ../../../components/parameters/variable-name.yaml
    - $ref: ../../../components/parameters/environment-name-query.yaml
    - $ref: ../../../components/parameters/applies-to.yaml
  security:
    - oauth2:
        - variable.write
  responses:
    '204':
      description: The variable was deleted.
    default:
      $ref: deleteVariable-error-response.yaml
