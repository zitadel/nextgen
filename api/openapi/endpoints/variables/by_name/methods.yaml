get:
  operationId: getVariable
  summary: Get a variable
  description: |
    Reads one variable by name from the project.

    A name the project has not entered answers `var.not_found`. A secret is
    found but not disclosed: the response is `{"secret": true}`.
  tags:
    - Variables
  parameters:
    - $ref: ../../../components/parameters/project-id.yaml
    - $ref: ../../../components/parameters/variable-name.yaml
  security:
    - oauth2:
        - variable.read
  responses:
    '200':
      description: The variable was retrieved successfully.
      content:
        application/json:
          schema:
            $ref: ../variable.yaml
    default:
      $ref: getVariable-error-response.yaml

delete:
  operationId: deleteVariable
  summary: Delete a variable
  description: |
    Removes the variable the project entered under this name.

    A name the project has not entered answers `var.not_found`.
  tags:
    - Variables
  parameters:
    - $ref: ../../../components/parameters/project-id.yaml
    - $ref: ../../../components/parameters/variable-name.yaml
  security:
    - oauth2:
        - variable.write
  responses:
    '204':
      description: The variable was deleted.
    default:
      $ref: deleteVariable-error-response.yaml
