get:
  operationId: getVariable
  summary: Get a variable
  description: |
    Reads one variable by name for the value `applies_to` selects. A name
    with no such value answers `var.not_found`. A secret is found but not
    disclosed: the response is `{"secret": true}`.
  tags:
    - Variables
  parameters:
    - $ref: ../../../components/parameters/project-id.yaml
    - $ref: ../../../components/parameters/variable-name.yaml
    - $ref: ../../../components/parameters/applies-to.yaml
  security:
    - oauth2:
        - variable.read
  responses:
    '200':
      description: The variable was retrieved successfully.
      content:
        application/json:
          schema:
            $ref: ../variable.yaml
    default:
      $ref: getVariable-error-response.yaml

delete:
  operationId: deleteVariable
  summary: Delete a variable
  description: |
    Removes the variable this owner entered under this name.

    A variable is deletable only by the owner that entered it. Deleting a name
    another owner of the same project holds answers `var.not_found` and leaves
    that owner's value standing.
  tags:
    - Variables
  parameters:
    - $ref: ../../../components/parameters/project-id.yaml
    - $ref: ../../../components/parameters/variable-name.yaml
    - $ref: ../../../components/parameters/applies-to.yaml
  security:
    - oauth2:
        - variable.write
  responses:
    '204':
      description: The variable was deleted.
    default:
      $ref: deleteVariable-error-response.yaml
