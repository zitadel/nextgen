title: Variables
description: |
  The project's variables, keyed by name. One name is one value.

  An empty object is an ordinary answer, not an error — it means nothing has
  been entered.
type: object
propertyNames:
  $ref: ../../components/schemas/variable-name.yaml
additionalProperties:
  $ref: variable.yaml
example:
  GITHUB_CLIENT_ID: Iv1.a1b2c3d4e5f6
  GITHUB_CLIENT_SECRET:
    secret: true
  RETRY_COUNT: 10
