title: Variables
description: |
  The variables a deployment froze, keyed by name. Every value is of the
  deployment's kind.

  An empty object is an ordinary answer, not an error: nothing was stored for
  that kind when the deployment was made.
type: object
propertyNames:
  $ref: ../../components/schemas/variable-name.yaml
additionalProperties:
  $ref: variable.yaml
example:
  GITHUB_CLIENT_ID: Iv1.a1b2c3d4e5f6
  GITHUB_CLIENT_SECRET:
    secret: true
  RETRY_COUNT: 10
