get:
  operationId: getGrant
  x-zitadel-cli: grants get
  summary: Get a grant by ID
  # Maintainer notes moved here from the description:
  # - "'Active' here means not revoked."
  # - "Grants are not registered in `resource_scope_index`; project scope is
  #   required on the query (same as events)."
  description: |
    Returns a grant by `(project_id, id)`, if this API manages it (a user or team
    bound to viewer, editor or admin) and it has not been revoked.

    An expired grant stays visible until it is revoked, so the client can DELETE
    it before granting the same binding again. Authorization still ignores
    expired grants. The request must name the project. These cases return 404:
    a miss, a revoked grant, project-secret setup (`sk_proj`), owning-team
    (`relation=team`) grants and an ID from another project.

    `expand=principal` adds envelope fields on `user` or `team`. For project
    secrets it requires `user.read` and `team.read` in addition to
    `project.read`. A user-bound console session that already passed the project
    check may expand without those scopes.

    Accepts a project secret (`oauth2`) or a user-bound console session cookie
    (`nextgenSession`). Cookie-authenticated requests follow the scheme's CSRF
    rules (`nextgenSession`).
  tags:
    - Grants
  security:
    - oauth2:
        - project.read
    - nextgenSession: []
  parameters:
    - $ref: ../../../components/parameters/grant-id.yaml
    - $ref: ../../../components/parameters/project-id.yaml
    - name: expand
      in: query
      required: false
      description: |
        Extra principal fields to add onto `user` or `team`. It takes the same
        values, and needs the same `user.read` and `team.read` scopes, as
        `POST /grants/query`.
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: ../query/grant-expand.yaml
  responses:
    '200':
      description: The grant.
      content:
        application/json:
          schema:
            $ref: ../grant.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: |
        No unrevoked collaboration grant was found for the given project and
        ID, including setup and owning-team grants this API does not manage.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: getGrant-error-response.yaml

delete:
  operationId: deleteGrant
  x-zitadel-cli: grants delete
  summary: Revoke a grant
  description: |
    Revokes a grant that this API manages, and emits `authz.revoked`.

    The grant is marked revoked rather than erased, and a revoked grant cannot be
    restored. A grant that is already revoked, missing, a project-secret setup
    grant or an owning-team grant returns 404. Expired grants can still be
    revoked, so the unique binding can be reused.

    Accepts a project secret (`oauth2`) or a user-bound console session cookie
    (`nextgenSession`). Cookie-authenticated requests follow the scheme's CSRF
    rules (`nextgenSession`).
  tags:
    - Grants
  security:
    - oauth2:
        - project.write
    - nextgenSession: []
  parameters:
    - $ref: ../../../components/parameters/grant-id.yaml
    - $ref: ../../../components/parameters/project-id.yaml
  responses:
    '204':
      description: The grant was revoked.
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: |
        No unrevoked collaboration grant was found for the given project and
        ID, including setup and owning-team grants this API does not manage.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: deleteGrant-error-response.yaml
