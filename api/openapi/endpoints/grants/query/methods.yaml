post:
  operationId: queryGrants
  summary: Query grants
  description: |
    Returns the collaboration grants of a project, paginated with a cursor.
    Only unrevoked grants this API manages are listed (user or team bound to
    viewer, editor, or admin), including expired grants so a client can
    DELETE before re-granting. Project-secret setup (`sk_proj`) and
    owning-team (`relation=team`) rows are not returned. Grants are not in
    `resource_scope_index`; project scope is required on the query (same as
    get). Requires `project.read`. `expand: ["principal"]` additionally
    requires `user.read` and `team.read` (documented on the expand enum;
    those scopes cannot be ANDed onto this security block because they are
    body-conditional).
  tags:
    - Grants
  security:
    - oauth2:
        - project.read
  parameters:
    - $ref: ../../../components/parameters/project-id.yaml
  requestBody:
    description: Request to query the grants of a project.
    required: true
    content:
      application/json:
        schema:
          $ref: query-grants-request.yaml
  responses:
    '200':
      description: The list of grants was returned successfully.
      content:
        application/json:
          schema:
            $ref: query-grants-response.yaml
    '400':
      description: Invalid request (e.g., invalid query parameters).
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: queryGrants-error-response.yaml
