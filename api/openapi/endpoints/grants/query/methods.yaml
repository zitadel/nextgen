post:
  operationId: queryGrants
  x-zitadel-cli: grants list
  summary: Query grants
  # Maintainer notes moved here from the description:
  # - "Grants are not in `resource_scope_index`; project scope is required on the
  #   query (same as get)."
  # - "Those scopes cannot be ANDed onto this security block because they are
  #   body-conditional."
  description: |
    Returns the collaboration grants of a project, one page at a time.

    Only unrevoked grants this API manages are listed (a user or team bound to
    viewer, editor or admin). Expired grants are included, so a client can DELETE
    one before granting it again. Project-secret setup (`sk_proj`) and
    owning-team (`relation=team`) grants are not returned. The request must name
    the project, and it requires `project.read`.

    `expand: ["principal"]` adds envelope fields on `user` / `team`. For project
    secrets it also requires `user.read` and `team.read`, as the expand enum
    documents. A user-bound console session that already passed the project check
    may expand without those scopes.

    Accepts a project secret (`oauth2`) or a user-bound console session cookie
    (`nextgenSession`). Cookie-authenticated requests follow the scheme's CSRF
    rules (`nextgenSession`).
  tags:
    - Grants
  security:
    - oauth2:
        - project.read
    - nextgenSession: []
  parameters:
    - $ref: ../../../components/parameters/project-id.yaml
  requestBody:
    description: Request to query the grants of a project.
    required: true
    content:
      application/json:
        schema:
          $ref: query-grants-request.yaml
  responses:
    '200':
      description: A page of grants.
      content:
        application/json:
          schema:
            $ref: query-grants-response.yaml
    '400':
      description: Invalid request, for example invalid query parameters.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: queryGrants-error-response.yaml
