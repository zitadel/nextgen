title: Grant
description: |
  A collaboration grant that binds a user or a team to a project relation.
  Check which of `user` or `team` is present to tell the two apart. Those
  objects are always refs (`user_id` / `team_id`). Expand adds extra fields on
  the same object rather than a sibling.
type: object
required:
  - id
  - project_id
  - object_type
  - relation
  - created_at
properties:
  id:
    type: string
    description: The ID of the managed assignment (`asgn_<opaque>`).
  project_id:
    type: string
    description: The project this grant is scoped to.
  object_type:
    type: string
    enum:
      - project
    description: The catalog object type. Always `project` for this API.
  relation:
    type: string
    enum:
      - viewer
      - editor
      - admin
    description: The catalog relation on the project.
  created_at:
    type: string
    format: date-time
    description: When the grant was created.
  expires_at:
    description: |
      When the grant expires. Null when it does not expire. GET still
      returns expired grants that are not revoked. Authorization ignores them.
    oneOf:
      - type: string
        format: date-time
      - type: 'null'
  user:
    description: |
      Present on a user grant, absent on a team grant. Always a user-ref
      (`user_id`). Expand adds envelope fields on this same object.
    $ref: grant-user.yaml
  team:
    description: |
      Present on a team grant, absent on a user grant. Always a team-ref
      (`team_id`). Expand adds envelope fields on this same object.
    $ref: grant-team.yaml
