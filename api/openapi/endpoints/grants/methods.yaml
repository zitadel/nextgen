post:
  operationId: createGrant
  x-zitadel-cli: grants create
  summary: Create a grant
  description: |
    Creates a grant that binds a user or a team to `project.viewer`,
    `project.editor` or `project.admin` on a project.

    The `project-id` header identifies the project. Name the principal with
    `user` (`user_id` or `identifier`) or `team` (`team_id` or `name`). Grant IDs
    are `asgn_<opaque>`. Owning-team (`project.team`) grants are not created
    here, because claiming a project creates them. An unrevoked grant with the
    same principal and relation occupies the unique key even after `expires_at`,
    so DELETE it before creating it again.

    Create does not accept `expand`. The `user_id` and team locators return 201,
    and the `user` or `team` in the response carries only `user_id` or `team_id`.
    They still return 404 or 409 when the principal is missing or the tuple
    already exists. Creating by `user.identifier` answers 202 with no body on
    every outcome. Granting the session caller's own user is `grant.invalid` on
    either user locator. Read the grant back for the identifier and display name.

    The operation accepts a project secret (`oauth2`) or a user-bound console
    session cookie (`nextgenSession`). Session callers are authorized as the
    human against the target project, whose home may differ. Cookie-authenticated
    requests follow the scheme's CSRF rules (`nextgenSession`).
  tags:
    - Grants
  security:
    - oauth2:
        - project.write
    - nextgenSession: []
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: create-grant-request.yaml
  responses:
    '201':
      description: |
        The grant was created. Returned for the `user.user_id` and team
        locators only.
      content:
        application/json:
          schema:
            $ref: grant.yaml
    '202':
      description: |
        Accepted. Returned only for the `user.identifier` locator, on
        every outcome. The server does not disclose whether a grant was
        written, whether one already existed, or whether the identifier
        matched a user. Read the grant list to see the result.
    '400':
      description: The provided parameters were not acceptable.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '404':
      description: |
        Project not found, or an ID or team-name locator could not be
        resolved. Identifier create answers 202 instead.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '409':
      description: |
        An unrevoked grant with this principal and relation already
        exists on the project. Identifier create answers 202 instead.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '429':
      description: |
        Too many requests. The client has sent too many requests in a given
        amount of time.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    default:
      $ref: createGrant-error-response.yaml
