post:
  operationId: createGrant
  summary: Create grant
  description: |
    Bind a user or team to `project.viewer`, `project.editor`, or
    `project.admin` on the project identified by the `project-id` header.
    Name the principal with `user` (`user_id` or `identifier`) or `team`
    (`team_id` or `name`). IDs are `asgn_<opaque>`. Owning-team
    (`project.team`) grants are not created here — claim owns that path. An
    unrevoked grant with the same principal and relation occupies the unique
    key even after `expires_at`; DELETE it before re-creating.
    Create does not accept `expand`; the 201 `user` / `team` are refs only.
    Creating by `user.identifier` is accepted with 201 whether or not
    a user matched: the server may write nothing, and a duplicate
    returns the existing grant. Granting the session caller's own
    resolved user is `grant.invalid`. Other locators still 404 / 409
    when the principal is missing or the tuple already exists.

    Accepts either a project secret (`oauth2`) or a user-bound Console
    session cookie (`nextgenSession`). Session callers are authorized as
    the human against the target project (home may differ). CSRF/Origin
    for cookie mutations is a follow-up (#1140).
  tags:
    - Grants
  security:
    - oauth2:
        - project.write
    - nextgenSession: []
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: create-grant-request.yaml
  responses:
    '201':
      description: |
        The request was accepted. Identifier create returns 201 whether
        or not a grant row was written. Id and team-name locators
        return 201 only when a grant was created.
      content:
        application/json:
          schema:
            $ref: grant.yaml
    '400':
      description: The provided parameters were not acceptable.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '404':
      description: |
        Project not found, or an id or team-name locator could not be
        resolved. Identifier create does not use 404 for a miss.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '409':
      description: |
        An unrevoked grant with this principal and relation already
        exists on the project. Identifier create returns 201 with the
        existing grant instead.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '429':
      description: |
        Too many requests, the client has sent too many requests in a given
        amount of time.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    default:
      $ref: createGrant-error-response.yaml
