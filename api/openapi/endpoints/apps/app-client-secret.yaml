type: object
description: A client secret the server generated, returned once.
required:
  - client
  - secret
properties:
  client:
    type: string
    description: The slug of the client the secret belongs to.
    example: web
  secret:
    type: string
    description: The secret. The server keeps only its hash, so it cannot be shown again.
    example: zcs_9h2Qx2nU1yQ8mXkP0r4sT7vW5zA3bC6dE8fG1hJ2kL4
