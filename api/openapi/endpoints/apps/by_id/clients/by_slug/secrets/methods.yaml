post:
  operationId: addAppClientSecret
  summary: Add a secret to an app's client
  description: |
    Adds a secret to a confidential client of an app registered through the
    API: a generated one, shown once, or an imported value or hash, so a client
    with a secret it cannot change keeps working. An app the release declares
    names its secrets as `${{ NAME }}` variables instead, and is refused with
    `app.declared`.
  tags:
    - Apps
  security:
    - oauth2:
        - app.write
  parameters:
    - $ref: ../../../../../../components/parameters/project-id.yaml
    - $ref: ../../../../../../components/parameters/app-id.yaml
    - $ref: ../../../../../../components/parameters/app-client-slug.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: add-app-client-secret-request.yaml
        examples:
          generate:
            summary: Generate a secret
            value: {}
          importBcrypt:
            summary: Import a v4 secret's bcrypt hash
            value:
              hash: $2a$04$KLQ8Oa0xFlVm1b0wN8E6kOpH0n1m1Oh8m2V3o4p5q6r7s8t9u0v1w
  responses:
    '201':
      description: The secret was added.
      content:
        application/json:
          schema:
            $ref: add-app-client-secret-response.yaml
    '400':
      description: The client is public, or the hash is in no format the server reads.
      content:
        application/json:
          schema:
            $ref: ../../../../../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../../../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../../../../../components/error-details.yaml
    '404':
      description: No app with this id, or no client with this slug in it.
      content:
        application/json:
          schema:
            $ref: ../../../../../../components/error-details.yaml
    '409':
      description: The app is declared in the release.
      content:
        application/json:
          schema:
            $ref: ../../../../../../components/error-details.yaml
    default:
      $ref: addAppClientSecret-error-response.yaml
