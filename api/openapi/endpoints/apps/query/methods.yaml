post:
  operationId: queryApps
  x-zitadel-cli: apps list
  summary: Query apps
  description: |
    Returns the apps of a project, paginated with a cursor. One row per app,
    carrying its newest revision and the `client_id` of each client.
  tags:
    - Apps
  security:
    - oauth2:
        - app.read
    - nextgenSession: []
  parameters:
    - $ref: ../../../components/parameters/project-id.yaml
  requestBody:
    description: Request to query the apps of a project.
    required: true
    content:
      application/json:
        schema:
          $ref: query-apps-request.yaml
  responses:
    '200':
      description: The apps were returned successfully.
      content:
        application/json:
          schema:
            $ref: query-apps-response.yaml
    '400':
      description: The filter or the sort names a field or an operation apps do not support.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: Project not found.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: queryApps-error-response.yaml
