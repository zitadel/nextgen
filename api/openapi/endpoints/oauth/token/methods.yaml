post:
  operationId: getToken
  tags:
    - Authorization
  summary: Get access token
  security:
    - usernamePassword: []
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          $ref: post-token-request.yaml
  responses:
    '200':
      description: Access token retrieved successfully
      content:
        application/json:
          schema:
            $ref: token-response.yaml
    '4XX':
      description: Invalid request or credentials
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
