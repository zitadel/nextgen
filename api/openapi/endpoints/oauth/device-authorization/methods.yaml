get:
  operationId: authorizeDevice
  summary: Authorize a device
  tags:
    - Authorization
  security: []
  parameters:
    - name: client_id
      description: |      
        The client ID of the application that is requesting authorization. 
        This is a required parameter and must match the client ID of a 
        registered application.
      in: query
      required: true
      schema:
        type: string
    - name: scope
      description: |
        The scope parameter is used to specify the permissions that the client
        is requesting. This is a space delimited list of scopes. For example,
        you could use this to request access to the user's profile information or
        to request permission to access certain APIs on behalf of the user.
      in: query
      required: false
      schema:
        type: string
  responses:
    '200':
      description: A device authorization was successful
      content:
        application/json:
          schema:
            $ref: device-authorization-response.yaml
    '400':
      description: The provided input was not valid
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml