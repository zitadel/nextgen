post:
  operationId: introspect
  summary: Introspect a token
  tags:
    - Authorization
  security:
    - oauth2: []
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          $ref: introspect-request.yaml
  responses:
    '200':
      description: Token introspection response
      content:
        application/json:
          schema:
            $ref: introspect-response.yaml
    '400':
      description: Bad request (e.g., missing or invalid token)
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml