type: object
properties:
  active:
    type: boolean
    description: Indicates whether the token is active
  aud:
    type: string
    description: The audience of the token (if applicable)
  client_id:
    type: string
    description: The client ID associated with the token
  exp:
    type: integer
    description: The expiration time of the token (in seconds since epoch)
  iat:
    type: integer
    description: The time the token was issued (in seconds since epoch)
  iss:
    type: string
    description: The issuer of the token (if applicable)
  jti:
    type: string
    description: The unique identifier for the token (if applicable)
  nbf:
    type: integer
    description: The time before which the token is not valid (in seconds since epoch)
  scope:
    type: string
    description: The scopes associated with the token
  sub:
    type: string
    description: The subject of the token (if applicable)
  token_type:
    type: string
    description: The type of the token (access_token or refresh_token)
  username:
    type: string
    description: The username associated with the token (if applicable)