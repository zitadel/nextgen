post:
  operationId: revokeToken
  summary: Revoke an access token or refresh token
  tags:
    - Authorization
  security:
    - oauth2: []
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          $ref: revoke-request.yaml
  responses:
    '200':
      description: Token revoked successfully
    '4XX':
      description: Invalid request or token
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml