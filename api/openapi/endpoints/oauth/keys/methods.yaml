get:
  operationId: getKeys
  summary: Get public keys
  security: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: keys-response.yaml
    '4XX':
      description: Client error
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml