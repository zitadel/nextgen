title: CreateReleaseResponse
type: object
description: |
  The release, plus one entry per resource it pins saying whether the
  pinned revision existed before this call or was allocated by it.
required:
  - release
  - revisions
properties:
  release:
    $ref: release.yaml
  revisions:
    type: array
    minItems: 1
    maxItems: 50
    description: One entry per pinned resource, in the order of `release.pointers`.
    items:
      $ref: pinned-revision.yaml
