type: object
description: The project's releases, newest first.
required:
  - releases
properties:
  releases:
    type: array
    items:
      $ref: release-summary.yaml
  next_page_token:
    description: |
      Token to pass as `page_token` in the next request to fetch the following page.
      Absent when there are no more results.
    oneOf:
      - $ref: ../../components/schemas/page-token.yaml
      - type: 'null'
