post:
  operationId: revokeRelease
  summary: Revoke a release
  description: |
    Marks the release revoked, so that its content is never served again.
    From then on the release cannot be deployed and is refused on every path
    that would serve it, including to a build that pins its digest, with
    `rel.revoked`.

    A release that any origin still serves cannot be revoked. An origin
    serves the release of the newest deployment to it, so the call answers
    `409` with `rel.in_use`, naming each such origin and that deployment.
    Deploy another release there or roll back first, then revoke. Revoking
    therefore never takes an origin down. Deployments that named the release
    earlier stay in the history.

    Idempotent: revoking a release that is already revoked answers `200`
    with the release unchanged, `revoked_at` still naming the first
    revocation. There is no un-revoke; build a new release instead.

    Takes no body. The lookup is scoped to the project in `project_id`, so a
    release id of another project answers not found exactly as an unknown id
    does.
  tags:
    - Releases
  security:
    - oauth2:
        - release.write
  parameters:
    - $ref: ../../../../components/parameters/project-id.yaml
    - $ref: ../../../../components/parameters/release-id.yaml
  responses:
    '200':
      description: The release is revoked.
      content:
        application/json:
          schema:
            $ref: ../../release.yaml
          examples:
            revoked:
              summary: A release after revocation
              description: |
                Only `revoked_at` changed; the pinned set and the metadata are
                immutable and stay as they were.
              value:
                id: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
                project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                content_hash: sha256:9f2c1a7b4e83d05f6c2b19ae7d430f821c6b5de90a4f73829f2c1a7b4e83d05f
                metadata:
                  message: add phone_number to human-user
                  git_sha: 4a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7
                  git_dirty: false
                  created_at: '2026-07-14T09:11:00Z'
                  created_by: user_01KWH3B72K7M7F0N9WD3P2E4YM
                  created_by_type: human
                revoked_at: '2026-07-16T16:20:00Z'
                pointers:
                  - kind: schema
                    handle: human-user
                    revision_id: sch_01KWHF18816ZQE7F0N9WD3P2E4
                  - kind: flow_definition
                    handle: default-login
                    revision_id: flowdef_01KWHG09JXA7F0N9WD3P2E4YM5
                  - kind: branding
                    handle: default
                    revision_id: brnd_01KWH1P4MYS7F0N9WD3P2E4YM5
    '409':
      description: |
        At least one origin still serves the release. `details.origins`
        names each such origin and the newest deployment to it.
      content:
        application/json:
          schema:
            $ref: revoke-release-conflict.yaml
          examples:
            stillServed:
              summary: Two origins still serve the release
              description: |
                Deploy another release to these origins, or roll them back,
                then revoke.
              value:
                code: rel.in_use
                message: 'release: still served by an origin'
                details:
                  origins:
                    - origin: https://app.acme.com
                      deployment_id: dep_01KX4SB9C8E1F0N9WD3P2E4YM5
                    - origin: https://acme-git-sso-acmeinc.vercel.app
                      deployment_id: dep_01KX4SD2F7H3F0N9WD3P2E4YM5
    default:
      $ref: revokeRelease-error-response.yaml
