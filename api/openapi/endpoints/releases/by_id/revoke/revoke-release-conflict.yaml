title: RevokeReleaseConflict
type: object
description: |
  The release cannot be revoked because origins still serve it.
required:
  - code
  - message
  - details
properties:
  code:
    $ref: ../../../../components/schemas/error-code.yaml
  message:
    type: string
    description: Human-readable explanation of the error.
  details:
    type: object
    required:
      - targets
    properties:
      targets:
        type: array
        minItems: 1
        description: Every target that still serves the release.
        items:
          type: object
          required:
            - target
            - deployment_id
          properties:
            target:
              $ref: ../../../deployments/deployment-target.yaml
            deployment_id:
              $ref: ../../../../components/schemas/deployment-id.yaml
              description: The newest deployment to the target, which pins the release.
