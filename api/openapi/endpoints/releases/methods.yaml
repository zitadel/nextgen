post:
  operationId: createRelease
  summary: Create a release
  description: |
    Assembles a release from exactly one of two body shapes.

    `pointers` pins revisions that already exist, supplied as
    `(kind, revision_id)` pairs. No new revisions are allocated — use the
    per-kind create endpoints for that, then pin the ids here. Every
    referenced `revision_id` must exist in the project; each one's handle is
    read from the revision itself and recorded on the release, so a resource
    is always pinned under the identity it declares.

    `bundle` takes the resources of `.zitadel/` as authored on disk, grouped
    by kind. For every resource the server compares the content against the
    project's newest revision of the same handle: unchanged content reuses
    that revision, changed content allocates a new one. Construction is one
    transaction — a failure anywhere leaves no revision and no release. The
    caller records nothing. An empty bundle is refused.

    Every resource in a bundle is validated as its kind's create endpoint
    validates it, and every failure is reported at once rather than only the
    first: the request answers `400` with `rel.invalid`, and
    `details.resources` lists each resource that failed. An entry carries the
    resource's `kind`, its `index` in that kind's array, its `handle` when it
    declares one, and the `code` and `message` its own create endpoint would
    have answered:

    ```json
    {
      "code": "rel.invalid",
      "message": "release: invalid",
      "details": {
        "resources": [
          {
            "kind": "schema",
            "index": 0,
            "handle": "human-user",
            "code": "sch.invalid_request",
            "message": "properties.email: x-unique must be project"
          },
          {
            "kind": "flow_definition",
            "index": 1,
            "handle": "b2b-login",
            "code": "flowdef.invalid",
            "message": "steps[2]: unknown step type"
          }
        ]
      }
    }
    ```

    `pointers` needs `release.write`. A bundle also writes revisions, so it
    needs, in addition, the write scope of every kind it carries a resource
    of — `schema.write`, `flow_definition.write` and `branding.write`, as the
    per-kind create endpoints do. A missing scope answers `403` with
    `rel.permission_denied`, naming the kind. An empty kind needs no scope.

    Both shapes are closed the same way: every handle a pinned resource
    references — a flow definition's `user_schema` naming a schema by
    `objectType` — must be pinned by the same release. A bundle may leave a
    referenced resource out when the project already holds it; the release
    then pins the project's newest revision of that handle, so only a bundle
    that carries everything it references builds the same release on any
    project. A handle that resolves nowhere refuses the request with
    `rel.unresolved_reference`. The message names the pointer
    and the handle that did not resolve, for example
    `flow_definition default-login: user_schema human-user not found`,
    because a release pins many and the code alone does not say which one
    failed.

    Idempotent on the pinned set: metadata is excluded from the comparison,
    so re-submitting the same content with a different `message` answers
    `200` with the release that already pins it rather than creating a
    second one. A release the project did not hold before answers `201`.

    Creating a release does not deploy it. A release is not tied to an
    origin, and the same release can later be deployed to any number of
    origins unchanged.
  tags:
    - Releases
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
  security:
    - oauth2:
        - release.write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: create-release-request.yaml
        examples:
          bundle:
            summary: Built from the files on disk
            description: |
              The CLI's form: the schemas, flow definitions and branding as
              authored, the flow naming its schema by `objectType`. The
              server reuses whichever revisions already match and allocates
              the rest.
            value:
              bundle:
                schemas:
                  - $schema: https://json-schema.org/draft/2020-12/schema
                    kind: user-schema
                    metaSchema: https://schemas.zitadel.com/user-schema/v1
                    objectType: human-user
                    x-auth-methods:
                      password:
                        enabled: true
                    x-identifier: email
                    properties:
                      email:
                        type: string
                        format: email
                        x-unique: project
                      phone_number:
                        type: string
                flow_definitions:
                  - name: default-login
                    status: active
                    user_schema: human-user
                    purposes:
                      login: identify
                    steps:
                      - name: identify
                        fields: [email]
                        actions:
                          - name: submit
                            kind: submit
                            primary: true
                        transitions:
                          submit: { target: authenticate }
                      - name: authenticate
                        fields: [password]
                        actions:
                          - name: submit
                            kind: submit
                            primary: true
                        transitions:
                          submit: { target: done }
                      - name: done
                        complete: redirect
                brandings:
                  - layout: centered
                    liquid_template: '<main>{{ step.name }}</main>'
              message: add phone_number to human-user
              git_sha: 4a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7
              git_dirty: false
          wholeProject:
            summary: Pin every configurable resource of a project by revision
            description: |
              A project has several user schemas and several flow definitions,
              so `schema` and `flow_definition` each appear more than once.
              Branding appears once because a project has one.
            value:
              pointers:
                - kind: schema
                  revision_id: https://example.com/schemas/default-human-user.json
                - kind: schema
                  revision_id: sch_01KWHF2XY6RN7F0N9WD3P2E4YM
                - kind: flow_definition
                  revision_id: flowdef_01KWHG09JXA7F0N9WD3P2E4YM5
                - kind: flow_definition
                  revision_id: flowdef_01KWHG3B72K7M7F0N9WD3P2E4
                - kind: branding
                  revision_id: brnd_01KWH1P4MYS7F0N9WD3P2E4YM5
              message: add phone_number to human-user
              git_sha: 4a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7
              git_dirty: false
  responses:
    '200':
      description: |
        A release pinning this exact set already existed and was returned
        unchanged. No new release and no new revision was created.
      content:
        application/json:
          schema:
            $ref: release.yaml
          examples:
            reused:
              summary: The same content was submitted again under a new message
              description: |
                The pinned set matched an existing release, so that release is
                returned — note the message it was originally created with,
                not the one just submitted.
              value:
                id: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
                project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                metadata:
                  message: add phone_number to human-user
                  git_sha: 4a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7
                  git_dirty: false
                  created_at: '2026-07-14T09:11:00Z'
                  created_by: user_01KWH3B72K7M7F0N9WD3P2E4YM
                  created_by_type: human
                pointers:
                  - kind: schema
                    handle: human-user
                    revision_id: sch_01KWHF18816ZQE7F0N9WD3P2E4
                  - kind: flow_definition
                    handle: default-login
                    revision_id: flowdef_01KWHG09JXA7F0N9WD3P2E4YM5
                  - kind: branding
                    handle: default
                    revision_id: brnd_01KWH1P4MYS7F0N9WD3P2E4YM5
    '201':
      description: The release was created successfully.
      content:
        application/json:
          schema:
            $ref: release.yaml
          examples:
            builtFromBundle:
              summary: Built from a bundle
              description: |
                Each pointer carries the handle the server read from the
                resource — `objectType` for a schema, `name` for a flow
                definition, and `default` for branding — and the revision it
                reused or allocated for it.
              value:
                id: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
                project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                metadata:
                  message: add phone_number to human-user
                  git_sha: 4a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7
                  git_dirty: false
                  created_at: '2026-07-14T09:11:00Z'
                  created_by: user_01KWH3B72K7M7F0N9WD3P2E4YM
                  created_by_type: human
                pointers:
                  - kind: schema
                    handle: human-user
                    revision_id: sch_01KWHF18816ZQE7F0N9WD3P2E4
                  - kind: flow_definition
                    handle: default-login
                    revision_id: flowdef_01KWHG09JXA7F0N9WD3P2E4YM5
                  - kind: branding
                    handle: default
                    revision_id: brnd_01KWH1P4MYS7F0N9WD3P2E4YM5
            pinnedByCI:
              summary: Pinned from a pipeline, with a dirty tree
              description: |
                A project secret names no user, so `created_by` is null while
                `created_by_type` still reports `service` — the release was
                assembled by a machine. `git_dirty` records that the working
                tree had uncommitted changes, so the content does not
                correspond exactly to `git_sha`.
              value:
                id: rel_01KX4A2B9C7F0N9WD3P2E4YM5D2
                project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                metadata:
                  message: deploy from CI
                  git_sha: 8d4e1a0f2b3c4d5e6f708192a3b4c5d6e7f80912
                  git_dirty: true
                  created_at: '2026-07-15T11:02:00Z'
                  created_by: null
                  created_by_type: service
                pointers:
                  - kind: schema
                    handle: human-user
                    revision_id: https://example.com/schemas/default-human-user.json
                  - kind: schema
                    handle: machine-user
                    revision_id: sch_01KWHF2XY6RN7F0N9WD3P2E4YM
                  - kind: flow_definition
                    handle: default-login
                    revision_id: flowdef_01KWHG09JXA7F0N9WD3P2E4YM5
                  - kind: flow_definition
                    handle: b2b-login
                    revision_id: flowdef_01KWHG3B72K7M7F0N9WD3P2E4
                  - kind: branding
                    handle: default
                    revision_id: brnd_01KWH8Q5NZT7F0N9WD3P2E4YM6
    default:
      $ref: createRelease-error-response.yaml

get:
  operationId: listReleases
  summary: List releases
  description: |
    Lists the project's releases, newest first.

    Entries carry metadata only — the pinned set is omitted. Read one release
    with `GET /releases/{release_id}` to get its pointers.
  tags:
    - Releases
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
    - $ref: ../../components/parameters/limit.yaml
    - $ref: ../../components/parameters/page-token.yaml
  security:
    - oauth2:
        - release.read
  responses:
    '200':
      description: The releases were retrieved successfully.
      content:
        application/json:
          schema:
            $ref: list-releases-response.yaml
          examples:
            firstPage:
              summary: A page with more results behind it
              value:
                releases:
                  - id: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
                    project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                    metadata:
                      message: add phone_number to human-user
                      git_sha: 4a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7
                      git_dirty: false
                      created_at: '2026-07-14T09:11:00Z'
                      created_by: user_01KWH3B72K7M7F0N9WD3P2E4YM
                      created_by_type: human
                  - id: rel_01KX2ZJ4B8C7F0N9WD3P2E4YM5
                    project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                    metadata:
                      message: initial import
                      git_sha: 0f1e2d3c4b5a69788796a5b4c3d2e1f009182736
                      git_dirty: false
                      created_at: '2026-07-13T08:00:00Z'
                      created_by: user_01KWH3B72K7M7F0N9WD3P2E4YM
                      created_by_type: human
                next_page_token: v1.dGhpcyBpcyBvcGFxdWU.SflKxwRJSMeKKF2QT4fw
            lastPage:
              summary: The final page
              description: |
                `next_page_token` is absent when there are no further results.
                Metadata fields the caller never supplied are null, not absent.
              value:
                releases:
                  - id: rel_01KX2ZJ4B8C7F0N9WD3P2E4YM5
                    project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                    metadata:
                      message: initial import
                      git_sha: null
                      git_dirty: false
                      created_at: '2026-07-13T08:00:00Z'
                      created_by: null
                      created_by_type: null
    default:
      $ref: listReleases-error-response.yaml
