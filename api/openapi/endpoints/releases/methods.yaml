post:
  operationId: createRelease
  summary: Create a release
  description: |
    Assembles a release from existing revisions, given as
    `(kind, revision_id)` pairs. To build one from files on disk, use
    `POST /releases/build`.

    Each revision must exist in the project and is recorded under the handle
    it declares. The release must be complete and consistent:

    - Every handle its revisions name must be in the release: a flow's
      `user_schema`, and the IDP connections named by a flow step's
      `sso_providers` or a schema's `x-auth-methods.sso.providers`. A missing
      one answers `rel.unresolved_reference`, naming the resource and the
      handle, e.g. `flow_definition default-login: user_schema human-user not found`.
    - Every flow is validated as on save, against the user schema revision
      in the release. A flow that fails answers `rel.invalid`, with the
      reason in `details`.

    Idempotent on the set of revisions: the same revisions with a different
    `message` answer `200` with the existing release. A new release answers
    `201`. Creating a release does not deploy it.
  tags:
    - Releases
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
  security:
    - oauth2:
        - release.write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: create-release-request.yaml
        examples:
          wholeProject:
            summary: Pin every configurable resource of a project
            description: |
              A project has several user schemas and several flow definitions,
              so `schema` and `flow_definition` each appear more than once.
              Branding appears once because a project has one, and each IDP
              connection is pinned by its own revision.
            value:
              pointers:
                - kind: schema
                  revision_id: https://example.com/schemas/default-human-user.json
                - kind: schema
                  revision_id: sch_01KWHF2XY6RN7F0N9WD3P2E4YM
                - kind: flow_definition
                  revision_id: flowdef_01KWHG09JXA7F0N9WD3P2E4YM5
                - kind: flow_definition
                  revision_id: flowdef_01KWHG3B72K7M7F0N9WD3P2E4
                - kind: branding
                  revision_id: brnd_01KWH1P4MYS7F0N9WD3P2E4YM5
                - kind: idp
                  revision_id: idprev_01KWHF2XY6RN7F0N9WD3P2E4YM
              message: add phone_number to human-user
              git_sha: 4a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7
              git_dirty: false
  responses:
    '200':
      description: |
        A release pinning this exact set already existed and was returned
        unchanged. No new release was created.
      content:
        application/json:
          schema:
            $ref: release.yaml
          examples:
            reused:
              summary: The same set was submitted again under a new message
              description: |
                The pinned set matched an existing release, so that release is
                returned — note the message it was originally created with,
                not the one just submitted.
              value:
                id: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
                project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                content_hash: sha256:9f2c1a7b4e83d05f6c2b19ae7d430f821c6b5de90a4f73829f2c1a7b4e83d05f
                metadata:
                  message: add phone_number to human-user
                  git_sha: 4a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7
                  git_dirty: false
                  created_at: '2026-07-14T09:11:00Z'
                  created_by: user_01KWH3B72K7M7F0N9WD3P2E4YM
                  created_by_type: human
                revoked_at: null
                pointers:
                  - kind: schema
                    handle: human-user
                    revision_id: sch_01KWHF18816ZQE7F0N9WD3P2E4
                  - kind: flow_definition
                    handle: default-login
                    revision_id: flowdef_01KWHG09JXA7F0N9WD3P2E4YM5
                  - kind: branding
                    handle: default
                    revision_id: brnd_01KWH1P4MYS7F0N9WD3P2E4YM5
    '201':
      description: The release was created successfully.
      content:
        application/json:
          schema:
            $ref: release.yaml
          examples:
            pinnedByCI:
              summary: Pinned from a pipeline, with a dirty tree
              description: |
                A project secret names no user, so `created_by` is null while
                `created_by_type` still reports `service` — the release was
                assembled by a machine. `git_dirty` records that the working
                tree had uncommitted changes, so the content does not
                correspond exactly to `git_sha`.
              value:
                id: rel_01KX4A2B9C7F0N9WD3P2E4YM5D2
                project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                content_hash: sha256:4a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293
                metadata:
                  message: deploy from CI
                  git_sha: 8d4e1a0f2b3c4d5e6f708192a3b4c5d6e7f80912
                  git_dirty: true
                  created_at: '2026-07-15T11:02:00Z'
                  created_by: null
                  created_by_type: service
                revoked_at: null
                pointers:
                  - kind: schema
                    handle: human-user
                    revision_id: https://example.com/schemas/default-human-user.json
                  - kind: schema
                    handle: machine-user
                    revision_id: sch_01KWHF2XY6RN7F0N9WD3P2E4YM
                  - kind: flow_definition
                    handle: default-login
                    revision_id: flowdef_01KWHG09JXA7F0N9WD3P2E4YM5
                  - kind: flow_definition
                    handle: b2b-login
                    revision_id: flowdef_01KWHG3B72K7M7F0N9WD3P2E4
                  - kind: branding
                    handle: default
                    revision_id: brnd_01KWH8Q5NZT7F0N9WD3P2E4YM6
    default:
      $ref: createRelease-error-response.yaml

get:
  operationId: listReleases
  summary: List releases
  description: |
    Lists the project's releases, newest first.

    Entries carry the digest, the metadata and `revoked_at` — the pinned set
    is omitted.
    Read one release with `GET /releases/{release_id}` to get its pointers.

    `content_hash` looks a release up by its content, as the CLI does when a
    person types the digest a transcript printed. The project holds at most
    one release per digest, so the filtered list has one entry or none, and
    an unknown digest is an empty list rather than an error. Paths take the
    `rel_` id only; the matched entry's `id` is what to use there.
  tags:
    - Releases
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
    - $ref: ../../components/parameters/release-content-hash-filter.yaml
    - $ref: ../../components/parameters/limit.yaml
    - $ref: ../../components/parameters/page-token.yaml
  security:
    - oauth2:
        - release.read
  responses:
    '200':
      description: The releases were retrieved successfully.
      content:
        application/json:
          schema:
            $ref: list-releases-response.yaml
          examples:
            firstPage:
              summary: A page with more results behind it
              value:
                releases:
                  - id: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
                    project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                    content_hash: sha256:9f2c1a7b4e83d05f6c2b19ae7d430f821c6b5de90a4f73829f2c1a7b4e83d05f
                    metadata:
                      message: add phone_number to human-user
                      git_sha: 4a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7
                      git_dirty: false
                      created_at: '2026-07-14T09:11:00Z'
                      created_by: user_01KWH3B72K7M7F0N9WD3P2E4YM
                      created_by_type: human
                    revoked_at: null
                  - id: rel_01KX2ZJ4B8C7F0N9WD3P2E4YM5
                    project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                    content_hash: sha256:0f1e2d3c4b5a69788796a5b4c3d2e1f0091827364554637281909a8b7c6d5e4f
                    metadata:
                      message: initial import
                      git_sha: 0f1e2d3c4b5a69788796a5b4c3d2e1f009182736
                      git_dirty: false
                      created_at: '2026-07-13T08:00:00Z'
                      created_by: user_01KWH3B72K7M7F0N9WD3P2E4YM
                      created_by_type: human
                    revoked_at: '2026-07-14T10:30:00Z'
                next_page_token: v1.dGhpcyBpcyBvcGFxdWU.SflKxwRJSMeKKF2QT4fw
            lastPage:
              summary: The final page
              description: |
                `next_page_token` is absent when there are no further results.
                Metadata fields the caller never supplied are null, not absent.
              value:
                releases:
                  - id: rel_01KX2ZJ4B8C7F0N9WD3P2E4YM5
                    project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                    content_hash: sha256:0f1e2d3c4b5a69788796a5b4c3d2e1f0091827364554637281909a8b7c6d5e4f
                    metadata:
                      message: initial import
                      git_sha: null
                      git_dirty: false
                      created_at: '2026-07-13T08:00:00Z'
                      created_by: null
                      created_by_type: null
                    revoked_at: null
            byContentHash:
              summary: Looked up by digest
              description: |
                The `content_hash` filter matched one release. The same filter
                with a digest no release of the project carries answers
                `releases: []`.
              value:
                releases:
                  - id: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
                    project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                    content_hash: sha256:9f2c1a7b4e83d05f6c2b19ae7d430f821c6b5de90a4f73829f2c1a7b4e83d05f
                    metadata:
                      message: add phone_number to human-user
                      git_sha: 4a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7
                      git_dirty: false
                      created_at: '2026-07-14T09:11:00Z'
                      created_by: user_01KWH3B72K7M7F0N9WD3P2E4YM
                      created_by_type: human
                    revoked_at: null
            unknownDigest:
              summary: A digest no release carries
              value:
                releases: []
    default:
      $ref: listReleases-error-response.yaml
