title: CreateReleaseFromBundle
type: object
description: |
  A release built from the resources as authored on disk. Carries no
  `pointers`.
required:
  - bundle
additionalProperties: false
properties:
  bundle:
    $ref: configuration-bundle.yaml
  message:
    type: string
    maxLength: 1024
    description: |
      A short summary of what the release changes, analogous to a git commit
      message. Recorded on the release and shown when listing releases.
    example: add phone_number to human-user
  git_sha:
    type: string
    maxLength: 64
    description: The source commit the caller was operating from.
    example: 4a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7
  git_dirty:
    type: boolean
    default: false
    description: |
      Set when the working tree had uncommitted changes, so the release content
      does not correspond exactly to `git_sha`.
