type: object
description: |
  One entry of the set a release pins: the revision of a single resource that
  this release includes.
required:
  - kind
  - handle
  - revision_id
properties:
  kind:
    type: string
    description: The kind of resource this pointer pins.
    enum:
      - schema
      - flow
      - branding
    example: schema
  handle:
    type: string
    minLength: 1
    maxLength: 256
    description: |
      What the resource is called, independent of which revision is pinned.
      Determined when the release is assembled, not supplied by the caller:

      - `schema` — the document's `objectType`
      - `flow` — the flow's `name`
      - `branding` — always `default`, since a project has a single branding

      Resources inside a release reference each other by handle rather than by
      revision id, so the same handle names the same resource in every release.
    example: human-user
  revision_id:
    type: string
    minLength: 1
    maxLength: 512
    description: |
      The revision of that resource this release pins.

      Deliberately not constrained to a prefixed id: for `kind: schema` this is
      the schema's `$id`, which is a URL whenever the document supplied one and
      only a generated `sch_*` value otherwise.
    example: https://example.com/schemas/default-human-user.json
