title: PasswordSetPolicy
type: object
# Maintainer note, moved verbatim from the description:
# (ADR 066)
description: |
  One revision of a project's `auth.factor.password.set` policy. `id` is
  shared by every revision of the operation's policy; `revision_id` names
  this revision.
required:
  - id
  - revision_id
  - project_id
  - operation
  - config
  - created_at
  - updated_at
properties:
  id:
    readOnly: true
    $ref: ../../components/schemas/policy-id.yaml
  revision_id:
    readOnly: true
    $ref: ../../components/schemas/policy-revision-id.yaml
  project_id:
    readOnly: true
    description: The project the policy belongs to.
    $ref: ../../components/schemas/project-id.yaml
  operation:
    type: string
    enum:
      - auth.factor.password.set
    readOnly: true
    description: The operation the policy guards.
  config:
    readOnly: true
    $ref: password-set-config.yaml
  created_at:
    type: string
    format: date-time
    readOnly: true
    description: When the operation's policy was first published.
  updated_at:
    type: string
    format: date-time
    readOnly: true
    description: When this revision was published.
