post:
  operationId: createPolicy
  summary: Publish a new policy revision
  description: |
    Publishes a new immutable policy revision for the project. Revisions
    cannot be updated or deleted; every edit publishes a new revision, and
    evaluation resolves the newest revision per operation and audience.

    The document is validated against the operation's template: unknown
    settings, out-of-bounds values and fixed settings are rejected.
  tags:
    - Policies
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
  security:
    - oauth2:
        - policy.write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/flows/policy.yaml
  responses:
    '201':
      description: The policy revision was created successfully.
      content:
        application/json:
          schema:
            $ref: policy-revision-response.yaml
    '400':
      description: The provided policy document was not valid.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml

get:
  operationId: listPolicies
  summary: List policy revisions
  description: |
    Lists policy revisions for the project, newest first, capped at the 100
    most recent. Deliberately unpaginated in v1, like branding.
  tags:
    - Policies
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
  security:
    - oauth2:
        - policy.read
  responses:
    '200':
      description: Policy revisions were retrieved successfully.
      content:
        application/json:
          schema:
            $ref: list-policies-response.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
