post:
  operationId: publishPolicy
  summary: Publish a policy
  description: |
    Publishes the project's policy for an operation as a new immutable
    revision, creating the policy on its first publish. The newest revision
    applies to the next time the operation runs; nothing already stored is
    re-evaluated, so a stricter password policy applies the next time a
    password is set.

    `config` is checked against the operation's template: an unknown
    operation or setting, a value of the wrong type or outside its bounds, or
    settings that contradict each other (a `min_length` above `max_length`)
    answer `pol.invalid`. A setting left out is off, and `{}` switches every
    rule off; there are no defaults.
  tags:
    - Policies
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
  security:
    - oauth2:
        - policy.write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: publish-policy-request.yaml
        examples:
          passwordPolicy:
            summary: A password policy
            value:
              operation: auth.factor.password.set
              config:
                min_length: 12
                history_depth: 4
  responses:
    '201':
      description: The revision was published.
      content:
        application/json:
          schema:
            $ref: policy.yaml
          examples:
            published:
              summary: The second publish of a password policy
              value:
                id: pol_01KXA4F3Q8R7F0N9WD3P2E4YM5
                revision_id: polrev_01KXB7C2M4N7F0N9WD3P2E4YM7
                project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                operation: auth.factor.password.set
                config:
                  min_length: 12
                  history_depth: 4
                created_at: '2026-10-20T09:00:00Z'
                updated_at: '2026-10-20T10:30:00Z'
    default:
      $ref: publishPolicy-error-response.yaml
