get:
  operationId: listUserIdentityLinks
  summary: List the provider accounts linked to a user
  description: |
    Lists the identity provider accounts linked to a user, oldest first.
    The provider's subject and claims are never returned.
  tags:
    - Users
  parameters:
    - $ref: ../../../../components/parameters/limit.yaml
    - $ref: ../../../../components/parameters/page-token.yaml
    - $ref: ../../../../components/parameters/user-id.yaml
  security:
    - oauth2:
        - user.read
    - nextgenSession: []
  responses:
    '200':
      description: The identity links of the user, oldest first.
      content:
        application/json:
          schema:
            $ref: list-user-identity-links-response.yaml
    '400':
      description: The provided input was not valid.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '401':
      description: Client was not authorized or the session is anonymous.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '403':
      description: Client does not have the permissions to perform this action.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '404':
      description: No user was found for the provided user ID.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '500':
      description: Something went wrong on the server. This was not your fault.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    default:
      $ref: listUserIdentityLinks-error-response.yaml
