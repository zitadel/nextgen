get:
  operationId: listUserTeams
  summary: List the teams a user belongs to
  description: |
    Lists the teams a user belongs to, ordered by team name. Each entry
    carries the team's name, so a client can render a page without resolving
    IDs one by one.

    A user can belong to many teams. This is not lifecycle ownership: the
    single team that owns the user's lifecycle is reported as
    `metadata.lifecycle_owner_team_id` on the user read endpoints. Memberships
    the user was removed from are not returned.
  tags:
    - Users
  parameters:
    - $ref: ../../../../components/parameters/limit.yaml
    - $ref: ../../../../components/parameters/page-token.yaml
    - $ref: ../../../../components/parameters/user-id.yaml
  security:
    - oauth2:
        - user.read
        - team_membership.read
    - nextgenSession: []
  responses:
    '200':
      description: The teams of the user, ordered by team name.
      content:
        application/json:
          schema:
            $ref: list-user-teams-response.yaml
    '400':
      description: The provided input was not valid.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '401':
      description: Client was not authorized or the session is anonymous.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '403':
      description: Client does not have the permissions to perform this action.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '404':
      description: No user was found for the provided user ID.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '500':
      description: Something went wrong on the server. This was not your fault.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    default:
      $ref: listUserTeams-error-response.yaml
