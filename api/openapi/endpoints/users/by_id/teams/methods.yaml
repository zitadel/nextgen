get:
  operationId: listUserTeams
  summary: List the teams a user belongs to
  description: |
    The user's team roster, ordered by team name. Each entry carries the
    team's name, so a client renders a page without resolving ids one by one.

    This is the N:N roster and it is not lifecycle ownership: the single team
    that owns the user's lifecycle is reported as `metadata.lifecycle_owner_team_id`
    on the user read endpoints. Memberships the user was removed from are not
    returned.
  tags:
    - Users
  parameters:
    - $ref: ../../../../components/parameters/limit.yaml
    - $ref: ../../../../components/parameters/page-token.yaml
    - name: user_id
      in: path
      required: true
      schema:
        $ref: ../../../../components/schemas/user-id.yaml
  security:
    - oauth2:
        - user.read
        - team_membership.read
  responses:
    '200':
      description: The teams of a user are returned
      content:
        application/json:
          schema:
            $ref: list-user-teams-response.yaml
    '400':
      description: The provided input was not valid
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '401':
      description: Client was not authorized or the session is anonymous.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '403':
      description: Client does not have the permissions to perform this action.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '404':
      description: No user was found for the provided user ID
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '500':
      description: Something went wrong on the server. This was not your fault.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    default:
      $ref: listUserTeams-error-response.yaml
