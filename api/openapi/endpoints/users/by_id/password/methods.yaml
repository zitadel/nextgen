get:
  operationId: getUserPassword
  summary: Get user password state
  tags:
    - Users
  parameters:
    - name: user_id
      in: path
      required: true
      schema:
        $ref: ../../../../components/schemas/user-id.yaml
  security:
    - oauth2:
        - user.read
    - nextgenSession: []
  responses:
    '200':
      description: The state of the user's password
      content:
        application/json:
          schema:
            $ref: get-user-password-response.yaml
    '401':
      description: Client was not authorized or the session is anonymous.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '403':
      description: Client does not have the permissions to perform this action.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '404':
      description: No user was found for the provided user ID
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '500':
      description: Something went wrong on the server. This was not your fault.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    default:
      $ref: getUserPassword-error-response.yaml
put:
  operationId: setUserPassword
  summary: Set user password
  tags:
    - Users
  parameters:
    - name: user_id
      in: path
      required: true
      schema:
        $ref: ../../../../components/schemas/user-id.yaml
  security:
    - oauth2:
        - user.write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: set-user-password-request.yaml
  responses:
    '204':
      description: The user password was set successfully
    '400':
      description: The provided input was not valid
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '404':
      description: No user was found for the provided user ID
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '500':
      description: Something went wrong on the server. This was not your fault.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    default:
      $ref: setUserPassword-error-response.yaml
