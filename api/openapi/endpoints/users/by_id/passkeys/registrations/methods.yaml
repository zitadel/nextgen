post:
  operationId: beginUserPasskeyRegistration
  summary: Begin passkey registration
  description: |
    Starts a WebAuthn registration ceremony for the user and returns the
    creation options for `navigator.credentials.create()`. Complete the
    ceremony with `POST /users/{user_id}/passkeys/registrations/{registration_id}` within
    five minutes. Credentials already registered for the user are excluded
    automatically.
  tags:
    - Users
  parameters:
    - name: user_id
      in: path
      required: true
      schema:
        $ref: ../../../../../components/schemas/user-id.yaml
  security:
    - oauth2:
        - user.write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: begin-user-passkey-registration-request.yaml
  responses:
    '201':
      description: The registration ceremony was started
      content:
        application/json:
          schema:
            $ref: begin-user-passkey-registration-response.yaml
    '400':
      description: The provided input was not valid
      content:
        application/json:
          schema:
            $ref: ../../../../../components/error-details.yaml
    '401':
      description: Client was not authorized or the session is anonymous.
      content:
        application/json:
          schema:
            $ref: ../../../../../components/error-details.yaml
    '403':
      description: Client does not have the permissions to perform this action.
      content:
        application/json:
          schema:
            $ref: ../../../../../components/error-details.yaml
    '404':
      description: No user was found for the provided user ID
      content:
        application/json:
          schema:
            $ref: ../../../../../components/error-details.yaml
    '500':
      description: Something went wrong on the server. This was not your fault.
      content:
        application/json:
          schema:
            $ref: ../../../../../components/error-details.yaml
    default:
      $ref: beginUserPasskeyRegistration-error-response.yaml
