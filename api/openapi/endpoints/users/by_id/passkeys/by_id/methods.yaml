post:
  operationId: finishUserPasskeyRegistration
  summary: Finish passkey registration
  description: |
    Verifies the attestation against the ceremony started by
    `POST /users/{user_id}/passkeys` and persists the new credential. A
    rejected attestation counts against the ceremony's failure budget and the
    ceremony stays open for a retry; an expired or unknown ceremony surfaces
    as `att.stale_challenge`.
  tags:
    - Users
  parameters:
    - name: user_id
      in: path
      required: true
      schema:
        $ref: ../../../../../components/schemas/user-id.yaml
    - name: registration_id
      in: path
      required: true
      schema:
        type: string
        description: The ceremony identifier returned by begin.
  security:
    - oauth2:
        - user.write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: finish-user-passkey-registration-request.yaml
  responses:
    '201':
      description: The passkey was registered
      content:
        application/json:
          schema:
            $ref: finish-user-passkey-registration-response.yaml
    '400':
      description: The provided input was not valid
      content:
        application/json:
          schema:
            $ref: ../../../../../components/error-details.yaml
    '401':
      description: Client was not authorized or the session is anonymous.
      content:
        application/json:
          schema:
            $ref: ../../../../../components/error-details.yaml
    '403':
      description: Client does not have the permissions to perform this action.
      content:
        application/json:
          schema:
            $ref: ../../../../../components/error-details.yaml
    '404':
      description: No user was found for the provided user ID
      content:
        application/json:
          schema:
            $ref: ../../../../../components/error-details.yaml
    '500':
      description: Something went wrong on the server. This was not your fault.
      content:
        application/json:
          schema:
            $ref: ../../../../../components/error-details.yaml
    default:
      $ref: finishUserPasskeyRegistration-error-response.yaml
