get:
  operationId: GetUserByID
  summary: Get user by ID
  tags:
    - Users
  parameters:
    - $ref: ../../../components/parameters/project-id.yaml
    - $ref: ../../../components/parameters/team-id.yaml
    - name: user_id
      in: path
      required: true
      schema:
        $ref: ../../../components/schemas/user-id.yaml
  security:
    - oauth2:
        - user.read
  responses:
    '200':
      description: Current user information retrieved successfully
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      description: Client was not authorized or the session is anonymous
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: User referenced by the current session was not found
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml

patch:
  operationId: UpdateUserByID
  summary: Update user by ID
  tags:
    - Users
  parameters:
    - $ref: ../../../components/parameters/project-id.yaml
    - name: user_id
      in: path
      required: true
      schema:
        $ref: ../../../components/schemas/user-id.yaml
  requestBody:
    description: User information to update
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  security:
    - oauth2:
        - user.write
  responses:
    '200':
      description: User information updated successfully
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      description: Client was not authorized or the session is anonymous
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: Client does not have the permissions to perform this action.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: User referenced by the current session was not found
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml