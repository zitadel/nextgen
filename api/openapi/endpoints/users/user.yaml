title: User
description: |
  A user represents an individual identity in the system. It can be used to
  represent a human user, but also a service account or any other type of
  identity.

  The envelope — `id`, `metadata`, `$schema` — is server-owned and fixed. The
  schema-defined content lives under `attributes`, which is exactly the
  document the user's `$schema` validates. Keeping the two apart means a schema
  may name a property `id` or `metadata` without colliding with the envelope,
  and closed-world keywords (`additionalProperties: false`, `propertyNames`,
  `unevaluatedProperties`) behave as their author expects.
type: object
required:
  - $schema
  - attributes
properties:
  id:
    readOnly: true
    $ref: ../../components/schemas/user-id.yaml
  metadata:
    readOnly: true
    $ref: user-metadata.yaml
  $schema:
    type: string
    description: |
      The schema that defines the content of `attributes`. These schemas can be
      created using the `/schemas` endpoint. A default schema is provided.
      This schema can be retrieved using the same endpoint.
  attributes:
    type: object
    additionalProperties: true
    description: |
      The user's schema-defined content, validated against `$schema`. Property
      names and types are determined entirely by that schema.
