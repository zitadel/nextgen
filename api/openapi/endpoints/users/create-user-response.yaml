title: CreateUserResponse
description: |
  The created user, echoed back with its server-assigned `id`. `attributes` is
  the stored content, satisfying the schema named by `schema`.
type: object
required:
  - id
  - schema
  - attributes
properties:
  id:
    $ref: ../../components/schemas/user-id.yaml
  schema:
    type: string
    description: The schema that defines the content of `attributes`.
  attributes:
    type: object
    additionalProperties: true
    description: The user's schema-defined content, as stored.
