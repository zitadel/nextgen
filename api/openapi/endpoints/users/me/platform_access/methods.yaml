get:
  operationId: getMyPlatformAccess
  summary: Get my platform access
  description: |
    The platform relations the signed-in user holds on the deployment
    (ADR 075). A platform operator administers every project of the
    deployment and may search them all with `queryProjects`.

    Only a user of the deployment's platform project can hold one; for
    everyone else `relations` is empty. Being a user of the platform project,
    or an administrator of it, grants none.

    With `project_id`, the relations are read only when the session belongs to
    that project.
  tags:
    - Users
  security:
    - nextgenSession: []
  parameters:
    - $ref: ../../../../components/parameters/session-project-id.yaml
  responses:
    '200':
      description: The platform relations of the session user.
      headers:
        Cache-Control:
          $ref: ../../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: platform-access-response.yaml
    '401':
      description: Missing or invalid session token.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/errors/auth-unauthorized.yaml
    '403':
      description: The session belongs to a different project than `project_id`.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/errors/sess-project_mismatch.yaml
    '500':
      description: Something went wrong on the server. This was not your fault.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    default:
      $ref: getMyPlatformAccess-error-response.yaml
