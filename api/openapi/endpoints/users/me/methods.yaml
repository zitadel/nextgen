get:
  operationId: getMyUser
  summary: Get my user information
  description: |
    Returns the user signed in to the session that authenticates the request.

    The project and the user both come from the session cookie, so a caller only
    ever reads their own user.

    With `project_id`, the user is returned only when the session belongs to
    that project.
  tags:
    - Users
  parameters:
    - $ref: ../../../components/parameters/session-project-id.yaml
  security:
    - nextgenSession: []
  responses:
    '200':
      description: Current user information retrieved successfully
      content:
        application/json:
          schema:
            $ref: ../user.yaml
    '401':
      description: Client was not authorized or the session is anonymous
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: The session belongs to a different project than `project_id`.
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/sess-project_mismatch.yaml
    '404':
      description: User referenced by the current session was not found
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/user-not_found.yaml
    default:
      $ref: getMyUser-error-response.yaml

patch:
  operationId: patchMyUser
  summary: Update my user information
  description: |
    Partially updates the caller's own schema-defined attributes. The merged
    result is validated against the user's schema before commit. Concurrent
    writes are last-write-wins.

    With `project_id`, the user is updated only when the session belongs to
    that project.
  tags:
    - Users
  parameters:
    - $ref: ../../../components/parameters/session-project-id.yaml
  security:
    - nextgenSession: []
  requestBody:
    description: The changes to merge into the user.
    required: true
    content:
      application/json:
        schema:
          $ref: patch-my-user-request.yaml
  responses:
    '200':
      description: Updated user state.
      content:
        application/json:
          schema:
            $ref: ../user.yaml
    '400':
      description: Invalid request body, empty patch, or merged attributes failing schema validation.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '401':
      description: Client was not authorized or the session is anonymous.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: |
        `sess.project_mismatch`: the session belongs to a different project than
        `project_id`. The user is not changed.

        `auth.csrf_invalid`: the request came from another site, or did not carry
        the session's `X-Zitadel-CSRF` token (see the `nextgenSession` scheme).
        It is refused before the session is looked at.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: User referenced by the current session was not found.
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/user-not_found.yaml
    '409':
      description: |
        A patched value is unique and already taken by another user, or
        concurrent writes kept the user changing under the patch; retry.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: patchMyUser-error-response.yaml
