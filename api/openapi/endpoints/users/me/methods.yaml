get:
  operationId: getMyUser
  summary: Get my user information
  tags:
    - User
  parameters:
    - $ref: ../../../components/parameters/session-cookie.yaml
  security: []
  responses:
    '200':
      description: Current user information retrieved successfully
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      description: Client was not authorized
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
