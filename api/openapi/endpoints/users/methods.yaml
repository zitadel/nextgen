post:
  operationId: createUser
  summary: Create user
  tags:
    - User
  security:
    - oauth2:
        - users.write
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
    - $ref: ../../components/parameters/team-id.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: user.yaml
  responses:
    '201':
      description: The user was created successfully
      content:
        application/json:
          schema:
            $ref: create-user-response.yaml
    '400':
      description: The provided input was not valid
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '403':
      description: You do not have permission to create a user.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml

get:
  operationId: listUsers
  summary: List users
  # TODO: migrate pagination from offset/limit to cursor-based (page_token / next_page_token)
  #       following the pattern used in GET /sessions. offset.yaml should be removed
  #       and replaced with components/parameters/page-token.yaml.
  tags:
    - User
  parameters:
    - $ref: ../../components/parameters/offset.yaml
    - $ref: ../../components/parameters/limit.yaml
  security:
    - oauth2:
        - user.read
  responses:
    '200':
      description: A list of users was returned
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              additionalProperties: true
    '400':
      description: The provided input was not valid
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '500':
      description: Something went wrong on the server. This was not your fault.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
