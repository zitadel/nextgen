post:
  operationId: createUser
  summary: Create user
  tags:
    - Users
  security:
    - oauth2:
        - user.write
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
    - $ref: ../../components/parameters/team-id.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: user.yaml
  responses:
    '201':
      description: The user was created successfully
      content:
        application/json:
          schema:
            $ref: create-user-response.yaml
    '400':
      description: The provided input was not valid
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '403':
      description: You do not have permission to create a user.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '409':
      description: |
        A user already exists with one of the unique values. E.g.: when the
        schema indicates that the email field should be unique across the team,
        only one user can have a given `email` attribute. See the body for more
        details.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    default:
      $ref: createUser-error-response.yaml

get:
  operationId: listUsers
  summary: List users
  tags:
    - Users
  parameters:
    - $ref: ../../components/parameters/limit.yaml
    - $ref: ../../components/parameters/page-token.yaml
  security:
    - oauth2:
        - user.read
  responses:
    '200':
      description: A list of users was returned
      content:
        application/json:
          schema:
            $ref: list-users-response.yaml
    '400':
      description: The provided input was not valid
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '500':
      description: Something went wrong on the server. This was not your fault.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    default:
      $ref: listUsers-error-response.yaml
