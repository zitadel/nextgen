get:
  operationId: listUsers
  summary: List users
  tags:
    - User
  parameters:
    - $ref: ../../components/parameters/limit.yaml
    - $ref: ../../components/parameters/page-token.yaml
  security:
    - oauth2:
        - users.read
  responses:
    '200':
      description: |
        A list of users was returned. The content of this response is 
        determined by the configured schema for users.
      content:
        application/json:
          schema:
            $ref: user-list-response.yaml
    '400':
      description: The provided input was not valid
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml

post:
  operationId: createUser
  summary: Create user
  tags:
    - User
  security:
    - oauth2:
        - openid
        - users.write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: create-user-request.yaml
  responses:
    '201':
      description: The user was created successfully
      content:
        application/json:
          schema:
            $ref: create-user-response.yaml
    '400':
      description: The provided input was not valid
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '403':
      description: You do not have permission to create a user.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
