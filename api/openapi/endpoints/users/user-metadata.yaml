title: UserMetadata
type: object
required:
  - created_at
  - updated_at
  - status
properties:
  created_at:
    type: string
    format: date-time
    description: The time when the user was created.
  updated_at:
    type: string
    format: date-time
    description: The time when the user was last updated.
  status:
    type: string
    description: The status of the user.
    enum:
      - active
      - suspended
      - deactivated
      - pending_purge