title: UserMetadata
type: object
required:
  - created_at
  - updated_at
  - status
properties:
  created_at:
    type: string
    format: date-time
    description: The time when the user was created.
  updated_at:
    type: string
    format: date-time
    description: The time when the user was last updated.
  status:
    type: string
    description: The status of the user.
    enum:
      - active
      - suspended
      - deactivated
      - pending_purge
  lifecycle_owner_team_id:
    description: |
      The team that owns this user's identity lifecycle, or `null` when the
      user is self-owned. This is a single team and a different concept from
      the user's team roster: it decides who may deprovision the user, not
      which teams the user collaborates in. The roster is its own paginated
      resource — `GET /users/{user_id}/teams`.
    oneOf:
      - type: string
      - type: 'null'
