type: object
description: The current state of a project. Secret material is never returned.
required:
  - project_id
  - lifecycle
  - preview_origins
  - claim_required_for
  - created_at
  - updated_at
properties:
  project_id:
    $ref: ../../components/schemas/project-id.yaml
  lifecycle:
    type: string
    enum:
      - unclaimed
      - claimed
  preview_origins:
    type: array
    items:
      type: string
  claim_required_for:
    type: array
    items:
      type: string
      enum:
        - preview
        - production
  team_id:
    type: string
    description: Present after claim.
  tier:
    type: string
    enum:
      - free
      - pro
      - enterprise
    description: Present after claim.
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  claimed_at:
    type: string
    format: date-time
    description: Present after claim.
