post:
  operationId: createProject
  summary: Create project
  tags:
    - Project
  security: []
  parameters:
    - name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: |
        Client retry key. Replaying the same key with the same request body
        returns the original project instead of creating another one.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: create-project-request.yaml
  responses:
    '201':
      description: The project was created successfully
      content:
        application/json:
          schema:
            $ref: create-project-response.yaml
    '409':
      description: Idempotency key was reused with a different request body.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '429':
      description: |
        Too many requests, the client has sent too many requests in a given
        amount of time.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
