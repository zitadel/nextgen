post:
  operationId: createProject
  summary: Create project
  tags:
    - Project
  security: []
  requestBody:
    content:
      application/json:
        schema:
          $ref: create-project-request.yaml
  responses:
    '201':
      description: The project was created successfully
      content:
        application/json:
          schema:
            $ref: create-project-response.yaml
    '400':
      description: The provided input was not valid
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml