get:
  operationId: getProject
  summary: Get project
  description: |
    Returns the current state of a project.
  tags:
    - Projects
  parameters:
    - name: project_id
      in: path
      required: true
      schema:
        $ref: ../../../components/schemas/project-id.yaml
  security:
    - oauth2:
        - project.read
  responses:
    '200':
      description: Project state.
      content:
        application/json:
          schema:
            $ref: ../get-project-response.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: Project not found.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml

patch:
  operationId: patchProject
  summary: Update project
  description: |
    Updates the state of a project.
  tags:
    - Projects
  parameters:
    - name: project_id
      in: path
      required: true
      schema:
        $ref: ../../../components/schemas/project-id.yaml
    - $ref: ../../../components/parameters/sort-direction.yaml
    - name: created_before
      description: Filter projects created before this date.
      in: query
      required: false
      schema:
        type: string
        format: date-time
    - name: created_after
      description: Filter projects created after this date.
      in: query
      required: false
      schema:
        type: string
        format: date-time
  security:
    - oauth2:
        - project.write
  requestBody:
    description: The new state of the project.
    required: true
    content:
      application/json:
        schema:
          $ref: patch-project-request.yaml
  responses:
    '200':
      description: Updated project state.
      content:
        application/json:
          schema:
            $ref: ../get-project-response.yaml
    '400':
      description: Invalid request body.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: Project not found.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml