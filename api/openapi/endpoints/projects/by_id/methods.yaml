get:
  operationId: getProject
  summary: Get project
  description: |
    Returns the current state of a project.
  tags:
    - Project
  parameters:
    - name: project_id
      in: path
      required: true
      schema:
        $ref: ../../../components/schemas/project-id.yaml
  security:
    - oauth2:
        - projects.read
  responses:
    '200':
      description: Project state.
      content:
        application/json:
          schema:
            $ref: ../get-project-response.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: Project not found.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
