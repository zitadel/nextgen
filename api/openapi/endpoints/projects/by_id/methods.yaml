get:
  operationId: getProject
  summary: Get project
  description: |
    Returns the current state of a project.
  tags:
    - Projects
  parameters:
    - name: project_id
      in: path
      required: true
      schema:
        $ref: ../../../components/schemas/project-id.yaml
  security:
    - oauth2:
        # project.write, not project.read: project.read is carried by the
        # browser-plane preview secret, so it cannot gate an operator read
        # until ADR 036 splits the credential planes into distinct schemes.
        - project.write
  responses:
    '200':
      description: Project state.
      content:
        application/json:
          schema:
            $ref: ../project-response.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: Project not found.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: getProject-error-response.yaml

patch:
  operationId: patchProject
  summary: Update project
  description: |
    Updates the state of a project.
  tags:
    - Projects
  parameters:
    - name: project_id
      in: path
      required: true
      schema:
        $ref: ../../../components/schemas/project-id.yaml
  security:
    - oauth2:
        - project.write
  requestBody:
    description: The new state of the project.
    required: true
    content:
      application/json:
        schema:
          $ref: patch-project-request.yaml
  responses:
    '200':
      description: Updated project state.
      content:
        application/json:
          schema:
            $ref: ../project-response.yaml
    '400':
      description: Invalid request body.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: Project not found.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: patchProject-error-response.yaml