post:
  operationId: initProjectClaim
  summary: Initialize project claim
  description: |
    Creates a short-lived human claim challenge for an unclaimed project.
    The caller keeps using the current `.zitadel/secret` while a browser
    completes the challenge. Completing the challenge rotates the project
    secret, which can be retrieved exactly once through claim status.
  tags:
    - Project
  parameters:
    - name: project_id
      in: path
      required: true
      schema:
        $ref: ../../../../../components/schemas/project-id.yaml
  security:
    - oauth2:
        - projects.write
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            return_url:
              type: string
              format: uri
              description: URL to return to after the human claim is complete.
            suggested_team_name:
              type: string
              description: Optional team name hint shown in the claim UI.
  responses:
    '201':
      description: Claim challenge created.
      content:
        application/json:
          schema:
            type: object
            required:
              - project_id
              - challenge_id
              - claim_url
              - expires_at
              - status
            properties:
              project_id:
                $ref: ../../../../../components/schemas/project-id.yaml
              challenge_id:
                type: string
              claim_url:
                type: string
                format: uri
              expires_at:
                type: string
                format: date-time
              status:
                type: string
                enum:
                  - pending
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../../../components/error-details.yaml
    '404':
      description: Project not found.
      content:
        application/json:
          schema:
            $ref: ../../../../../components/error-details.yaml
    '409':
      description: Project has already been claimed.
      content:
        application/json:
          schema:
            $ref: ../../../../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../../../../components/error-details.yaml
