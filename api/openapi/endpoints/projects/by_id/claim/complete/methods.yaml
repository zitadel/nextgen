post:
  operationId: completeClaim
  summary: Complete a project claim
  description: |
    Called by the browser after the developer authenticates on the claim page.
    Authenticated by the `__nextgen_session` cookie, it attaches the project to
    the developer's personal team using the `challenge_id` from the claim URL as
    its single-use, browser-safe authorization.
  tags:
    - Projects
  parameters:
    - name: project_id
      in: path
      required: true
      schema:
        $ref: ../../../../../components/schemas/project-id.yaml
  security:
    - nextgenSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: complete-claim-request.yaml
  responses:
    '200':
      description: Project claimed.
      content:
        application/json:
          schema:
            $ref: complete-claim-response.yaml
    '400':
      description: Invalid request body.
      content:
        application/json:
          schema:
            $ref: ../../../../../components/error-details.yaml
    '401':
      description: Missing or invalid session token.
      content:
        application/json:
          schema:
            $ref: ../../../../../components/schemas/errors/auth-unauthorized.yaml
    '403':
      description: |
        The session user has no active personal team in the platform project,
        so there is no team to attach the claimed project to. Two codes carry
        this. `claim.no_personal_team` means no membership at all, and clears
        itself because the next sign-in provisions a team.
        `claim.personal_team_not_active` means the membership exists but is not
        active, so provisioning will not clear it. What will depends on
        `membership_status` in the details. The details object is otherwise
        untyped, so the values to expect are enumerated here:

          * `removed` — the membership was withdrawn, by deactivating either the
            team or the user. A user deactivation cascades to that user's
            memberships without touching their teams, so the team may well still
            be active: what unblocks the claim is restoring the user's access,
            not necessarily the team.
          * `inactive` — the membership is suspended.
          * `pending` — an invitation the user has not accepted yet.
      content:
        application/json:
          schema:
            # The explicit discriminator is required, not decorative: the two
            # schemas differ only by a `const` code, so without it ogen cannot
            # infer one and silently skips the whole operation.
            oneOf:
              - $ref: ../../../../../components/schemas/errors/claim-no_personal_team.yaml
              - $ref: ../../../../../components/schemas/errors/claim-personal_team_not_active.yaml
            discriminator:
              propertyName: code
              mapping:
                claim.no_personal_team: ../../../../../components/schemas/errors/claim-no_personal_team.yaml
                claim.personal_team_not_active: ../../../../../components/schemas/errors/claim-personal_team_not_active.yaml
    '404':
      description: Challenge not found.
      content:
        application/json:
          schema:
            $ref: ../../../../../components/error-details.yaml
    '409':
      description: |
        The project is already claimed by a team, so this challenge cannot be
        spent again (claims are single-use and first-claim-wins).
      content:
        application/json:
          schema:
            $ref: ../init/already-claimed-response.yaml
    '410':
      description: |
        Gone, for one of two reasons told apart by `code`.
        `proj.claim_expired` means this challenge lapsed and a fresh claim
        init recovers. `proj.claim_window_expired` means the project itself is
        past its 14-day claim window; that refusal is final and no new
        challenge can help.
      content:
        application/json:
          schema:
            # The explicit discriminator is required, not decorative: the two
            # schemas differ only by a `const` code, so without it ogen cannot
            # infer one and silently skips the whole operation.
            oneOf:
              - $ref: ../../../../../components/schemas/errors/proj-claim_expired.yaml
              - $ref: ../../../../../components/schemas/errors/proj-claim_window_expired.yaml
            discriminator:
              propertyName: code
              mapping:
                proj.claim_expired: ../../../../../components/schemas/errors/proj-claim_expired.yaml
                proj.claim_window_expired: ../../../../../components/schemas/errors/proj-claim_window_expired.yaml
    '429':
      description: |
        Too many requests. Completion is rate-limited so a guessed
        `challenge_id` cannot be brute-forced (ADR 046).
      content:
        application/json:
          schema:
            $ref: ../../../../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../../../../components/error-details.yaml
