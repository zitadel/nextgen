get:
  operationId: getClaimWindow
  summary: Get the claim window for a project
  description: |
    Returns how long is left to claim a project, so the claim page can show it
    in the browser.

    The request needs no credential, because the claim page calls it before the
    developer has signed in. Holding the `challenge_id` from the claim URL is
    the authorization, the same capability `claim/complete` accepts. The
    response reveals only the window, never the project itself. Unlike
    `claim/complete`, it spends nothing, so a reload is free.
  tags:
    - Projects
  parameters:
    - $ref: ../../../../../components/parameters/project-id-path.yaml
    - $ref: ../../../../../components/parameters/challenge-id-query.yaml
  security: []
  responses:
    '200':
      description: The project's claim window.
      content:
        application/json:
          schema:
            $ref: claim-window-response.yaml
    '404':
      description: |
        No such project, or the challenge does not belong to it. The response is
        the same for both, so a caller without a valid challenge learns nothing
        about whether the project exists.
      content:
        application/json:
          schema:
            $ref: ../../../../../components/error-details.yaml
    '429':
      description: Too many requests.
      content:
        application/json:
          schema:
            $ref: ../../../../../components/error-details.yaml
    default:
      $ref: getClaimWindow-error-response.yaml
