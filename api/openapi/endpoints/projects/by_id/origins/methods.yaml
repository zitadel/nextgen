post:
  operationId: addOrigin
  x-zitadel-cli: origin add
  summary: Add an origin pattern
  description: |
    Adds an origin pattern, with its `kind`, to the project's origins. A
    `primary` pattern must be an exact URL with no wildcard. A `preview`
    pattern may include a single DNS-label wildcard. Adding a pattern that
    already exists with the same kind is idempotent and answers 201 with the
    stored origin.
  tags:
    - Projects
  parameters:
    - $ref: ../../../../components/parameters/project-id-path.yaml
  security:
    - oauth2:
        - origin.write
    - nextgenSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../project-origin.yaml
  responses:
    '201':
      description: The origin that was added.
      content:
        application/json:
          schema:
            $ref: add-origin-response.yaml
    default:
      $ref: addOrigin-error-response.yaml
