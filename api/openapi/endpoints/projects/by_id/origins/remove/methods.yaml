post:
  operationId: removeOrigin
  x-zitadel-cli: origin rm
  summary: Remove an origin pattern
  description: |
    Removes one pattern from the project's origins. Requests from URLs only
    that pattern admitted are refused from then on; live previews and
    deployment history are untouched. Removing a pattern that is already
    absent is idempotent and answers 204.
  tags:
    - Projects
  parameters:
    - $ref: ../../../../../components/parameters/project-id-path.yaml
  security:
    - oauth2:
        - origin.delete
    - nextgenSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - pattern
          properties:
            pattern:
              type: string
              description: |
                The origin pattern exactly as stored on the project (same
                string returned by create/get or addOrigin).
              example: https://app.example.com
  responses:
    '204':
      description: The pattern was removed.
    default:
      $ref: removeOrigin-error-response.yaml
