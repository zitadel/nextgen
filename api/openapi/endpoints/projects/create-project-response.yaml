type: object
required:
  - project_id
  - project_secret
  - preview_secret
  - preview_origins
  - lifecycle
  - claim_required_for
  - created_at
properties:
  project_id:
    $ref: ../../components/schemas/project-id.yaml
  project_secret:
    type: string
    description: |
      Full-access project bearer secret. Returned once and stored in
      `.zitadel/secret`.
  preview_secret:
    type: string
    description: |
      Origin-scoped project bearer secret. Preserved across claim and handed
      to deploy platforms only after claim.
  preview_origins:
    type: array
    items:
      type: string
    description: Origin patterns the preview secret is scoped to.
  lifecycle:
    type: string
    enum:
      - unclaimed
      - claimed
  claim_required_for:
    type: array
    items:
      type: string
      enum:
        - preview
        - production
    description: Environments that require claim before apply/deploy.
  created_at:
    type: string
    format: date-time
  scratch_dashboard_url:
    type: string
    format: uri
    description: Browser-session-keyed inspection URL for unclaimed projects.
