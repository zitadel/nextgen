type: object
required:
  - id
  - name
  - class
  - project_secret
  - preview_secret
  - preview_token
  - allowed_origins
  - created_at
properties:
  id:
    type: string
    description: The unique identifier of the project.
  name:
    type: string
    description: The name of the project.
  class:
    $ref: project-class.yaml
  project_secret:
    type: string
    description: |
      Secret which can be used for authentication when modifying the project.
  preview_secret:
    type: string
    description: |
      The public-plane credential a browser bundle ships with (the
      publishable key). Safe to publish.
  preview_token:
    type: string
    description: |
      The credential a pull-request build holds. It may create releases and
      deploy to preview origins matching a `preview` pattern, and nothing
      else: no allowlist, class or variable writes, and no deploy to the
      default or a primary origin.
  allowed_origins:
    type: array
    items:
      $ref: allowed-origin.yaml
  created_at:
    type: string
    format: date-time
    description: The time when the project was created.
