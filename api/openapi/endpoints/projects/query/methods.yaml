post:
  operationId: queryProjects
  x-zitadel-cli: projects list
  summary: Query projects
  # Maintainer note moved here from the description: a credential is scoped to
  # one project "until ADR 036 widens it".
  description: |
    Returns the project that the project secret belongs to, as a page of at
    most one project.

    A credential is scoped to one project, so the filters and sorting apply to
    that project alone. `GET /users/me/projects` lists the projects a signed-in
    person can act on.
  tags:
    - Projects
  security:
    - oauth2:
        # project.write, not project.read: project.read is carried by the
        # browser-plane preview secret, so it cannot gate an operator read
        # until ADR 036 splits the credential planes into distinct schemes.
        - project.write
  requestBody:
    description: Request to query projects.
    required: true
    content:
      application/json:
        schema:
          $ref: query-projects-request.yaml
  responses:
    '200':
      description: A page of projects.
      content:
        application/json:
          schema:
            $ref: query-projects-response.yaml
    '400':
      description: Invalid request, for example invalid query parameters.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '429':
      description: |
        Too many requests. The client has sent too many requests in a given
        amount of time.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: queryProjects-error-response.yaml