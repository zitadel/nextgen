type: object
description: Request to query projects.
properties:
  page_size:
    $ref: ../../../components/schemas/limit.yaml
  page_token:
    description: Token to retrieve the next page of results.
    oneOf:
      - $ref: ../../../components/schemas/page-token.yaml
      - type: 'null'
  sorting:
    type: array
    items:
      type: object
      properties:
        field:
          $ref: filter-field.yaml
          description: The field to sort by.
        direction:
          $ref: ../../../components/schemas/sort-direction.yaml
          description: The direction to sort by.  
  filter:
    type: array
    description: Filter criteria for querying projects.
    items:
      type: object
      properties:
        field:
          $ref: filter-field.yaml
          description: The field to filter by.
        value:
          type: string
          description: The value to filter by.
        operation:
          $ref: ../../../components/schemas/filter-operation.yaml