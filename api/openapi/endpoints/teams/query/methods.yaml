post:
  operationId: queryTeams
  x-zitadel-cli: teams list
  summary: Query teams
  description: |
    Returns the teams of a project, one page at a time.
  tags:
    - Teams
  security:
    - oauth2:
        - team.read
    - nextgenSession: []
  parameters:
    - $ref: ../../../components/parameters/project-id.yaml
  requestBody:
    description: Request to query the teams of a project.
    required: true
    content:
      application/json:
        schema:
          $ref: query-teams-request.yaml
  responses:
    '200':
      description: A page of teams.
      content:
        application/json:
          schema:
            $ref: query-teams-response.yaml
    '400':
      description: Invalid request, for example invalid query parameters.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: Project not found.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '429':
      description: |
        Too many requests. The client has sent too many requests in a given
        amount of time.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: queryTeams-error-response.yaml
