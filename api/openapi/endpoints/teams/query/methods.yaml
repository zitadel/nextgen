post:
  operationId: queryTeams
  summary: Query teams
  description: |
    Returns the teams of a project, paginated with a cursor.
    Teams of every lifecycle status are returned by default; each carries its
    `status`. A `name` filter matches exactly with `equals` and
    case-insensitively with `contains`.
  tags:
    - Teams
  security:
    - oauth2:
        - team.read
  parameters:
    - $ref: ../../../components/parameters/project-id.yaml
  requestBody:
    description: Request to query the teams of a project.
    required: true
    content:
      application/json:
        schema:
          $ref: query-teams-request.yaml
  responses:
    '200':
      description: The list of teams was returned successfully
      content:
        application/json:
          schema:
            $ref: query-teams-response.yaml
    '400':
      description: Invalid request (e.g., invalid query parameters).
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: Project not found.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '429':
      description: |
        Too many requests, the client has sent too many requests in a given
        amount of time.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
