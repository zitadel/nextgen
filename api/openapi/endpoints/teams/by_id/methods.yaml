get:
  operationId: getTeam
  x-zitadel-cli: teams get
  summary: Get team
  description: |
    Returns a Team by its id.
  tags:
    - Teams
  parameters:
    - $ref: ../../../components/parameters/team-id-path.yaml
  security:
    - oauth2:
        - team.read
    - nextgenSession: []
  responses:
    '200':
      description: The team.
      content:
        application/json:
          schema:
            $ref: ../team-response.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: Team not found.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: getTeam-error-response.yaml

delete:
  operationId: deleteTeam
  x-zitadel-cli: teams deactivate
  summary: Delete team
  description: |
    Deactivates the team.

    The team is tombstoned rather than erased: it stays readable through
    getTeam with status `deactivated`. Its memberships are removed and the
    users whose lifecycle it owns are deactivated with it.

    The request is idempotent. Deleting a team that is already deactivated
    or doesn't exist succeeds without changing anything.

    A team that still owns a project is refused with `409
    team.owns_project`: deactivating it would leave the project owned by a
    dead team and so unmanageable. No endpoint releases that ownership yet,
    so such a team cannot currently be deactivated through the API.
    Deactivating any other team that would leave a project with nobody who
    can administer it is refused with `409 proj.last_admin`.
  tags:
    - Teams
  parameters:
    - $ref: ../../../components/parameters/team-id-path.yaml
  security:
    - oauth2:
        - team.delete
  responses:
    '204':
      description: The team is deactivated.
    '400':
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: |
        Insufficient permissions, or the credentials are not bound to the
        project.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '409':
      description: |
        The team still owns a project and cannot be deactivated
        (`team.owns_project`), or deactivating it would leave a project
        without someone who can administer it (`proj.last_admin`). Grant
        admin to someone else, then retry. For `proj.last_admin`,
        `details.details.project_ids` names the projects.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: deleteTeam-error-response.yaml

patch:
  operationId: updateTeam
  x-zitadel-cli: teams update
  summary: Update team
  description: |
    Update team. Only active teams can be updated.
  tags:
    - Teams
  parameters:
    - $ref: ../../../components/parameters/team-id-path.yaml
  security:
    - oauth2:
        - team.write
    - nextgenSession: []
  requestBody:
    description: Update team request.
    required: true
    content:
      application/json:
        schema:
          $ref: ../update-team-request.yaml
  responses:
    '200':
      description: Updated the team.
      content:
        application/json:
          schema:
            $ref: ../team-response.yaml
    '400':
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: Team not found or not active, or the project does not exist.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '409':
      description: A team with the same name already exists.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: updateTeam-error-response.yaml
