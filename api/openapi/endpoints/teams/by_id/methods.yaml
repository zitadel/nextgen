get:
  operationId: getTeam
  summary: Get team
  description: |
    Returns the current state of a team.
  tags:
    - Team
  parameters:
    - $ref: ../../../components/parameters/project-id.yaml
    - name: team_id
      in: path
      required: true
      schema:
        $ref: ../../../components/schemas/team-id.yaml
  security:
    - oauth2:
        - teams.read
  responses:
    '200':
      description: Team state.
      content:
        application/json:
          schema:
            $ref: ../get-team-response.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: Team not found.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      description: Unexpected error response.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
