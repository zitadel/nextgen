type: object
description: The current state of a team.
required:
  - id
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    description: The unique identifier of the team.
  createdAt:
    type: string
    format: date-time
    description: The time when the team was created.
  updatedAt:
    type: string
    format: date-time
    description: The time when the team was last updated.
