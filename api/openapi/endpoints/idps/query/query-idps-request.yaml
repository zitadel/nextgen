type: object
description: Request to query the identity provider connections of a project.
properties:
  limit:
    $ref: ../../../components/schemas/limit.yaml
  page_token:
    description: |
      Token to retrieve the next page of results. Must be sent with the same
      `sorting` as the request that issued the token. Omitting `sorting` reuses
      the default sort and only succeeds when that default matches the token.
    oneOf:
      - $ref: ../../../components/schemas/page-token.yaml
      - type: 'null'
  revisions:
    type: string
    default: latest
    enum:
      - all
      - latest
    description: |
      Which revisions to return. A revise appends an immutable revision that
      shares the connection's `id` and `slug` and carries its own
      `revision_id`.

      `latest` (the default) returns the newest revision of each connection,
      one row per connection. `all` returns every revision, the
      history of a connection when combined with `equals` on `slug`.

      A `page_token` is bound to the mode it was issued in and is rejected by
      the other.
  sorting:
    type: object
    description: Sort order. Defaults to `created_at` ascending; `revision_id` breaks ties either way.
    required:
      - field
      - direction
    properties:
      field:
        $ref: idp-filter-field.yaml
        description: The field to sort by.
      direction:
        $ref: ../../../components/schemas/sort-direction.yaml
        description: The direction to sort by.
  filter:
    type: array
    description: Filter criteria for querying connections. Combined with AND.
    items:
      type: object
      required:
        - field
        - operation
      properties:
        field:
          $ref: idp-filter-field.yaml
          description: The field to filter by.
        value:
          $ref: ../../../components/schemas/filter-value.yaml
        operation:
          $ref: ../../../components/schemas/filter-operation.yaml
