post:
  operationId: queryIdps
  x-zitadel-cli: idps list
  summary: Query identity providers
  description: |
    Returns the identity providers of a project in pages, with optional filtering
    and sorting. There is one entry per identity provider, carrying its newest
    revision.
  tags:
    - Identity Providers
  security:
    - oauth2:
        - idp.read
    - nextgenSession: []
  parameters:
    - $ref: ../../../components/parameters/project-id.yaml
  requestBody:
    description: Request to query the identity providers of a project.
    required: true
    content:
      application/json:
        schema:
          $ref: query-idps-request.yaml
        examples:
          firstPage:
            summary: The first page, newest identity provider first
            value:
              limit: 2
              sorting:
                field: created_at
                direction: desc
          bySlug:
            summary: Resolve a single slug
            description: |
              A slug is unique within the project, so `equals` on it matches
              at most one identity provider.
            value:
              filter:
                - field: slug
                  operation: equals
                  value: google
  responses:
    '200':
      description: The identity providers of the project, with a token for the next page.
      content:
        application/json:
          schema:
            $ref: query-idps-response.yaml
          examples:
            firstPage:
              summary: A page with more results behind it
              value:
                idps:
                  - id: idp_01KWHG09JXA7F0N9WD3P2E4YM5
                    revision_id: idprev_01KWHG3B72K7M7F0N9WD3P2E4Y
                    slug: acme_sso
                    created_at: '2026-07-15T11:02:00Z'
                    updated_at: '2026-07-15T11:02:00Z'
                    definition:
                      slug: acme_sso
                      protocol: oidc
                      display_name: Acme SSO
                      claim_mapping:
                        email: email
                        givenName: given_name
                        familyName: family_name
                      verified_claims:
                        email: email_verified
                      provisioning:
                        creation: auto
                      oidc:
                        issuer: https://sso.acme.example
                        authorization_endpoint: https://sso.acme.example/authorize
                        token_endpoint: https://sso.acme.example/token
                        jwks_uri: https://sso.acme.example/keys
                        userinfo_endpoint: https://sso.acme.example/userinfo
                        id_token_mapping: false
                        client_id: '${{ ACME_CLIENT_ID }}'
                        client_secret: '${{ ACME_CLIENT_SECRET }}'
                        token_endpoint_auth_method: client_secret_basic
                        scopes:
                          - openid
                          - profile
                          - email
                        pkce_enabled: true
                  - id: idp_01KWH3B72K7M7F0N9WD3P2E4YM
                    revision_id: idprev_01KWHF2XY6RN7F0N9WD3P2E4YM
                    slug: google
                    created_at: '2026-07-14T09:11:00Z'
                    updated_at: '2026-07-16T14:20:00Z'
                    definition:
                      slug: google
                      protocol: oidc
                      template: google
                      display_name: Google
                      subject_claim: sub
                      claim_mapping:
                        email: email
                        givenName: given_name
                        familyName: family_name
                      verified_claims:
                        email: email_verified
                      provisioning:
                        creation: auto
                      oidc:
                        issuer: https://accounts.google.com
                        id_token_mapping: false
                        client_id: '${{ GOOGLE_CLIENT_ID }}'
                        client_secret: '${{ GOOGLE_CLIENT_SECRET }}'
                        token_endpoint_auth_method: client_secret_basic
                        scopes:
                          - openid
                          - profile
                          - email
                          - https://www.googleapis.com/auth/user.phonenumbers.read
                        pkce_enabled: true
                        static_authorize_parameters:
                          prompt: select_account
                next_page_token: v1.dGhpcyBpcyBvcGFxdWU.SflKxwRJSMeKKF2QT4fw
            lastPage:
              summary: The final page
              description: |
                `next_page_token` is absent when there are no further results.
              value:
                idps:
                  - id: idp_01KWH1P4MYS7F0N9WD3P2E4YM5
                    revision_id: idprev_01KWH8Q5NZTA7F0N9WD3P2E4YM
                    slug: corp_idp
                    created_at: '2026-07-13T08:00:00Z'
                    updated_at: '2026-07-13T08:00:00Z'
                    definition:
                      slug: corp_idp
                      protocol: oidc
                      display_name: Corporate SSO
                      subject_claim: sub
                      claim_mapping:
                        email: email
                      oidc:
                        issuer: https://login.corp.example.com
                        id_token_mapping: false
                        client_id: '${{ CORP_IDP_CLIENT_ID }}'
                        client_secret: '${{ CORP_IDP_CLIENT_SECRET }}'
                        token_endpoint_auth_method: client_secret_basic
                        scopes:
                          - openid
                          - profile
                          - email
                        pkce_enabled: true
    '400':
      description: The request was not valid, for example because of invalid query parameters.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: Project not found.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: queryIdps-error-response.yaml
