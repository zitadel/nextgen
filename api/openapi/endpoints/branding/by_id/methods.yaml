get:
  operationId: getBrandingById
  x-zitadel-cli: branding get
  summary: Get a branding revision by ID
  description: Returns one branding revision, including its stored configuration.
  tags:
    - Branding
  security:
    - oauth2:
        - branding.read
    - nextgenSession: []
  parameters:
    - $ref: ../../../components/parameters/branding-id.yaml
  responses:
    '200':
      description: The branding revision.
      content:
        application/json:
          schema:
            $ref: ../branding-revision-response.yaml
    '404':
      description: No branding revision was found with the given ID.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: getBrandingById-error-response.yaml
