post:
  operationId: createBranding
  summary: Publish a branding revision
  description: |
    Publishes a new immutable branding revision for the project. Branding
    revisions cannot be updated or deleted. Every edit publishes a new
    revision, and flow responses resolve the latest revision per project.

    On save, the server checks the `liquid_template` by its text alone: size,
    encoding and banned patterns, such as `<script>` tags, inline event
    handlers and the `| raw` filter. Full LiquidJS validation runs at
    authoring time, through `zitadel plan` or `zitadel apply`.
  tags:
    - Branding
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
  security:
    - oauth2:
        - branding.write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/flows/branding.yaml
  responses:
    '201':
      description: The new branding revision.
      content:
        application/json:
          schema:
            $ref: branding-revision-response.yaml
    '400':
      description: The branding configuration is invalid.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    default:
      $ref: createBranding-error-response.yaml

get:
  operationId: listBranding
  x-zitadel-cli: branding list
  summary: List branding revisions
  # Maintainer note, moved verbatim from the description:
  # Deliberately unpaginated in v1 — list endpoints gain a real query
  # mechanism together; advertising pagination parameters the server ignores
  # would be worse than none.
  description: |
    Lists the project's branding revisions, newest first. The list is capped
    at the 100 most recent and is not paginated. The first entry is the
    revision flow responses currently resolve.
  tags:
    - Branding
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
  security:
    - oauth2:
        - branding.read
    - nextgenSession: []
  responses:
    '200':
      description: The project's branding revisions, newest first.
      content:
        application/json:
          schema:
            $ref: list-branding-response.yaml
    default:
      $ref: listBranding-error-response.yaml
