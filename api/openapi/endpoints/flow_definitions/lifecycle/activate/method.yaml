post:
  operationId: activateFlowDefinition
  summary: Activate a flow definition by ID.
  description: |
    Activate a flow definition by transitioning it from a `draft` state to an `active` state.
    Alternatively, the status of a flow definition can also be set via the `POST /flow_definitions` and `PUT /flow_definitions/{id}` endpoints by setting the `status` attribute in the flow definition payload.
  tags:
    - Flow Definitions
  security:
    - oauth2:
        - flow_definition.write
  parameters:
    - $ref: ../../../../components/parameters/flow-definition-id.yaml
    - $ref: ../../../../components/parameters/project-id.yaml
  responses:
    '204':
      description: Flow definition activated successfully.
    '400':
      description: Invalid request (e.g., invalid flow definition ID).
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    default:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
