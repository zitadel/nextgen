post:
  operationId: archiveFlowDefinition
  summary: Archive a flow definition by ID.
  description: |
    Archives a flow definition in the `active` or `deprecated` state by ID. 
    Archived flow definitions cannot be used to start new flows. Existing flows will return an error if they reference an archived flow definition.
    Alternatively, the status of a flow definition can also be set via the `POST /flow_definitions` and `PUT /flow_definitions/{id}` endpoints by setting the `status` attribute in the flow definition payload.
    
    Note: There must be at least one flow definition in the `active` state for a given `purpose` at all times to ensure that new flows can be started.
  tags:
    - Flow Definitions
  security:
    - oauth2:
        - flow_definitions.write
  parameters:
    - $ref: ../../../../components/parameters/flow-definition-id.yaml
    - $ref: ../../../../components/parameters/project-id.yaml
  responses:
    '200':
      description: Flow definition archived successfully.
    '400':
      description: Invalid request.
    '409':
      description: Conflict (e.g., attempting to archive the last active flow definition for a given purpose).
    default:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
