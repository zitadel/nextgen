post:
  operationId: deactivateFlowDefinition
  summary: Deactivate a flow definition by ID.
  description: |
    Deactivates a flow definition in the `active` state by transitioning it to the `draft` state. 
    Flow definitions in `draft` state cannot be used to start new flows. Existing flows that use the deactivated flow definition must gracefully handle this.
    Alternatively, the status of a flow definition can also be set via the `POST /flow_definitions` and `PUT /flow_definitions/{id}` endpoints by setting the `status` attribute in the flow definition payload.
  tags:
    - Flow Definitions
  security:
    - oauth2:
        - flow_definition.write
  parameters:
    - $ref: ../../../../components/parameters/flow-definition-id.yaml
    - $ref: ../../../../components/parameters/project-id.yaml
  responses:
    '204':
      description: Flow definition deactivated successfully.
    '400':
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '409':
      description: Conflict (e.g., attempting to deactivate the last active flow definition for a given purpose).
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    default:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
