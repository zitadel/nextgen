post:
  operationId: deprecateFlowDefinition
  summary: Deprecate a flow definition by ID
  description: |
    Deprecates a flow definition in the `active` state by ID. 
    Deprecated flow definitions cannot be used to start new flows, but existing flows that reference the deprecated flow definition can continue to operate until completion.
    Alternatively, the status of a flow definition can also be set via the `POST /flow_definitions` and `PUT /flow_definitions/{id}` endpoints by setting the `status` attribute in the flow definition payload.
    
    Note: There must be at least one flow definition in the `active` state for a given `purpose` at all times to ensure that new flows can be started.
  tags:
    - Flow Definitions
  security:
    - oauth2:
        - flow_definitions.write
  parameters:
    - $ref: ../../../../components/parameters/flow-definition-id.yaml
    - $ref: ../../../../components/parameters/project-id.yaml
  responses:
    '204':
      description: Flow definition deprecated successfully.
    '400':
      description: Invalid request (e.g., flow definition is not in an active state, invalid flow definition ID).
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '409':
      description: Conflict (e.g., attempting to deprecate the last active flow definition for a given purpose).
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    default:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
