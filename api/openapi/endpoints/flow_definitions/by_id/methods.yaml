get:
  operationId: getFlowDefinition
  x-zitadel-cli: flow-definitions get
  summary: Get a flow definition by ID
  description: |
    Returns one flow definition revision. Each ID names one revision, and
    the revisions of a flow share its `name`.
  tags:
    - Flow Definitions
  security:
    - oauth2:
        - flow_definition.read
    - nextgenSession: []
  parameters:
    - $ref: ../../../components/parameters/flow-definition-id.yaml
  responses:
    '200':
      description: The flow definition.
      content:
        application/json:
          schema:
            $ref: ../../../components/flows/flow-definition-response.yaml
    default:
      $ref: getFlowDefinition-error-response.yaml

