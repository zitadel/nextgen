id: "pow-bench"
language: "javascript"
layer: "tool"
stack: "infrastructure"

tasks:
  matched:
    command: "node matched.mjs"
    options:
      cache: false
      runInCI: false
  run:
    command: "node run.mjs"
    options:
      cache: false
      runInCI: false
  test:
    command: "node run.mjs --test"
    options:
      cache: false
      runInCI: false
