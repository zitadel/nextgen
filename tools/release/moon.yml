id: "release"
language: "javascript"
layer: "tool"
stack: "infrastructure"

tasks:
  changesets:
    command: "node scripts/check-changesets-status.mjs"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: true

  version:
    command: "node scripts/release.mjs version"
    options:
      runFromWorkspaceRoot: true
      runInCI: false

  pack:
    command: "node scripts/release.mjs pack"
    outputs:
      - "/dist/release/**/*"
    options:
      # Never cache the pack task itself. It stages release tarballs that feed
      # local installs (`workspace:cli`, `workspace:journey`) and CI freshness
      # checks, which must reflect the current package sources. The task has no
      # inputs tied to the packages it bundles, so a cached run silently served
      # stale tarballs after package edits. The expensive work (embedded UI,
      # public package, and server builds) is invoked through their own
      # moon/go-cached steps inside the script, so re-running pack only redoes
      # the cheap staging/tar step.
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false

  snapshot:
    command: "node scripts/release.mjs snapshot"
    deps:
      - "server:test"
    outputs:
      - "/dist/release/**/*"
    options:
      runFromWorkspaceRoot: true
      runInCI: false

  publish:
    command: "node scripts/release.mjs publish"
    options:
      runFromWorkspaceRoot: true
      runInCI: true
