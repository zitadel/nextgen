id: "release"
language: "javascript"
layer: "tool"
stack: "infrastructure"

tasks:
  changesets:
    command: "node scripts/check-changesets-status.mjs"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: true

  check-graph:
    command: "node scripts/check-release-graph.mjs"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false

  build-public-packages:
    command: "node -e 0"
    deps:
      - "release:check-graph"
      - "cli:build-release"
      - "api:build-release"
      - "config:build-release"
      - "components:build-release"
      - "sdk-core:build-release"
      - "sdk-next:build-release"
      - "sdk-nuxt:build-release"
      - "sdk-react:build-release"
      - "sdk-vue:build-release"
      - "sdk-angular:build-release"
      - "sdk-solid:build-release"
      - "sdk-svelte:build-release"
      - "sdk-qwik:build-release"
      - "testing:build-release"
    options:
      cache: false
      runDepsInParallel: false
      runFromWorkspaceRoot: true
      # Excluded from `moon ci`: release package builds remove stale files and
      # rewrite dist output inside their build-release tasks. The check-graph
      # guard verifies those scripts and mutexes before packaging runs.
      runInCI: false

  version:
    command: "node scripts/release.mjs version"
    options:
      runFromWorkspaceRoot: true
      runInCI: false

  # Cross-compiles the server binaries and stages them into the npm package bin
  # dirs. Split out of pack/snapshot so moon runs it as its own graph node; those
  # tasks then skip the inline build via RELEASE_SERVER_PREBUILT. Not cached: the
  # binaries embed the git commit and build date (ldflags), so output is never
  # reproducible — matching the rest of the release chain.
  build-server:
    command: "node scripts/release.mjs build-server"
    # The server binary embeds the console and login UI via `//go:embed all:dist`
    # (internal/staticui/{console,login}/embed.go), so those UIs must be rebuilt
    # before the go compile — otherwise a stale or missing dist gets baked in.
    deps:
      - "console:build-release"
      - "login-ui:build-release"
    outputs:
      - "/dist/release/*/build/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false

  pack:
    command: "node scripts/release.mjs pack"
    env:
      RELEASE_SERVER_PREBUILT: "1"
    deps:
      - "release:build-server"
      - "release:build-public-packages"
      - "console:build-release"
      - "login-ui:build-release"
    outputs:
      - "/dist/release/**/*"
    options:
      cache: false
      runDepsInParallel: false
      runFromWorkspaceRoot: true
      runInCI: false

  snapshot:
    command: "node scripts/release.mjs snapshot"
    env:
      RELEASE_SERVER_PREBUILT: "1"
    deps:
      - "server:test"
      - "release:build-server"
      - "release:build-public-packages"
      - "console:build-release"
      - "login-ui:build-release"
    outputs:
      - "/dist/release/**/*"
    options:
      cache: false
      runDepsInParallel: false
      runFromWorkspaceRoot: true
      runInCI: false

  publish:
    command: "node scripts/release.mjs publish"
    deps:
      - "release:build-public-packages"
      - "console:build-release"
      - "login-ui:build-release"
    options:
      cache: false
      runDepsInParallel: false
      runFromWorkspaceRoot: true
      # Invoked explicitly (`moon run release:publish`) by the
      # release-publish workflow; never scheduled by `moon ci`, matching the
      # rest of the release chain (see build-public-packages).
      runInCI: false
