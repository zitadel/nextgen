id: "release"
language: "javascript"
layer: "tool"
stack: "infrastructure"

tasks:
  changesets:
    command: "node scripts/check-changesets-status.mjs"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: true

  check-graph:
    command: "node scripts/check-release-graph.mjs"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false

  build-public-packages:
    command: "node -e 0"
    # The release builds run in parallel as far as their deps allow. Each one
    # depends on the release builds of the packages its dev build depends on,
    # so none reads a dist another is rewriting, and the graph holds no test
    # and no public package's dev build. release:check-graph asserts both.
    deps:
      - "release:check-graph"
      - "cli:build-release"
      - "api:build-release"
      - "config:build-release"
      - "components:build-release"
      - "sdk-core:build-release"
      - "sdk-next:build-release"
      - "sdk-nuxt:build-release"
      - "sdk-react:build-release"
      - "sdk-vue:build-release"
      - "sdk-angular:build-release"
      - "sdk-solid:build-release"
      - "sdk-svelte:build-release"
      - "sdk-qwik:build-release"
      - "sdk-sveltekit:build-release"
      - "sdk-solid-start:build-release"
      - "sdk-qwik-router:build-release"
      - "sdk-tanstack-start:build-release"
      - "testing:build-release"
    options:
      cache: false
      runFromWorkspaceRoot: true
      # Excluded from `moon ci`: release package builds remove stale files and
      # rewrite dist output inside their build-release tasks. The check-graph
      # guard verifies those scripts and mutexes before packaging runs.
      runInCI: false

  version:
    command: "node scripts/release.mjs version"
    options:
      runFromWorkspaceRoot: true
      runInCI: false

  # The entry points have no deps: release.mjs runs moon again in the release
  # workspace, a copy of the checkout's sources, for
  # release:build-public-packages and console:build-release
  # (scripts/release-workspace.mjs). No task of the checkout reads what the
  # copy's release builds rewrite.
  pack:
    command: "node scripts/release.mjs pack"
    outputs:
      - "/dist/release/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false

  snapshot:
    command: "node scripts/release.mjs snapshot"
    outputs:
      - "/dist/release/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false

  publish:
    command: "node scripts/release.mjs publish"
    options:
      cache: false
      runFromWorkspaceRoot: true
      # Invoked explicitly (`moon run release:publish`) by the
      # release-publish workflow; never scheduled by `moon ci`, matching the
      # rest of the release chain (see build-public-packages).
      runInCI: false
