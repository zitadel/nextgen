id: "release"
language: "javascript"
layer: "tool"
stack: "infrastructure"

tasks:
  changesets:
    command: "node scripts/check-changesets-status.mjs"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: true

  check-graph:
    command: "node scripts/check-release-graph.mjs"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false

  build-public-packages:
    command: "node -e 0"
    deps:
      - "release:check-graph"
      - "cli:build-release"
      - "api:build-release"
      - "config:build-release"
      - "components:build-release"
      - "sdk-core:build-release"
      - "sdk-next:build-release"
      - "sdk-nuxt:build-release"
      - "sdk-react:build-release"
      - "sdk-vue:build-release"
      - "sdk-angular:build-release"
      - "sdk-solid:build-release"
      - "sdk-svelte:build-release"
      - "sdk-qwik:build-release"
    options:
      cache: false
      runDepsInParallel: false
      runFromWorkspaceRoot: true
      # Excluded from `moon ci`: release package builds remove stale files and
      # rewrite dist output inside their build-release tasks. The check-graph
      # guard verifies those scripts and mutexes before packaging runs.
      runInCI: false

  version:
    command: "node scripts/release.mjs version"
    options:
      runFromWorkspaceRoot: true
      runInCI: false

  pack:
    command: "node scripts/release.mjs pack"
    deps:
      - "release:build-public-packages"
      - "console:build-release"
      - "login-ui:build-release"
    outputs:
      - "/dist/release/**/*"
    options:
      cache: false
      runDepsInParallel: false
      runFromWorkspaceRoot: true
      runInCI: false

  # Builds every promotable release artifact except container images. The
  # publish surfaces below never compile; they promote this task's output
  # (in CI it travels between the build and publish jobs as an artifact).
  build:
    command: "node scripts/release.mjs build"
    deps:
      - "server:test"
      - "release:build-public-packages"
      - "console:build-release"
      - "login-ui:build-release"
    outputs:
      - "/dist/release/**/*"
    options:
      cache: false
      runDepsInParallel: false
      runFromWorkspaceRoot: true
      runInCI: false

  # Local convenience: release:build plus a loaded host-platform image.
  snapshot:
    command: "node scripts/release.mjs snapshot"
    deps:
      - "release:build"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false

  # Evaluates publish preconditions and writes dist/release/publish-plan.json.
  # Every publish surface reads that plan and no-ops when it says skip, so the
  # gate decision flows through the task graph without leaving Moon.
  gate:
    command: "node scripts/release.mjs gate"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false

  verify-artifacts:
    command: "node scripts/release.mjs verify"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false

  publish-npm:
    command: "node scripts/release-npm.mjs"
    deps:
      - "release:verify-artifacts"
    options:
      cache: false
      runDepsInParallel: false
      runFromWorkspaceRoot: true
      runInCI: false

  publish-tags:
    command: "node scripts/release.mjs publish-tags"
    deps:
      - "release:verify-artifacts"
    options:
      cache: false
      runDepsInParallel: false
      runFromWorkspaceRoot: true
      runInCI: false

  publish-container:
    command: "node scripts/release.mjs publish-container"
    deps:
      - "release:verify-artifacts"
    options:
      cache: false
      runDepsInParallel: false
      runFromWorkspaceRoot: true
      runInCI: false

  publish-github:
    command: "node scripts/release.mjs publish-github"
    deps:
      - "release:verify-artifacts"
    options:
      cache: false
      runDepsInParallel: false
      runFromWorkspaceRoot: true
      runInCI: false

  # Aggregate publish entrypoint: gate first, then each surface in order.
  # Deliberately independent of the build chain — the publish job promotes
  # downloaded artifacts and must never rebuild them (check-release-graph
  # enforces this).
  publish:
    command: "node -e 0"
    deps:
      - "release:gate"
      - "release:verify-artifacts"
      - "release:publish-npm"
      - "release:publish-tags"
      - "release:publish-container"
      - "release:publish-github"
    options:
      cache: false
      runDepsInParallel: false
      runFromWorkspaceRoot: true
      # Invoked explicitly (`moon run release:publish`) by the
      # release-publish workflow; never scheduled by `moon ci`, matching the
      # rest of the release chain (see build-public-packages).
      runInCI: false
