id: "oidc-mock"
language: "go"
layer: "tool"
stack: "infrastructure"

# Test-only OIDC provider for the journey runner; nested Go module, no root import.

tasks:
  # Tracked Go files only, as the server project checks them.
  format:
    script: |
      unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
      if [ -n "$unformatted" ]; then
        echo "error: gofmt would rewrite the following files:" >&2
        printf '%s\n' "$unformatted" >&2
        echo "hint: run gofmt -w on those paths, then re-check with moon run oidc-mock:format" >&2
        exit 1
      fi

  vet:
    command: "go vet ./..."

  # dist/ is gitignored at the root.
  build:
    command: "go build -o dist/oidc-mock ."
    deps:
      - "vet"
    outputs:
      - "dist/oidc-mock"

  test:
    command: "go test -timeout 2m ./..."
    deps:
      - "format"
      - "vet"
