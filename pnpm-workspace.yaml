catalogMode: strict

# Installs every platform's native packages (esbuild, Biome, moon, Next.js'
# SWC, sharp, …), not only this machine's. Set here, not in package.json: in
# a workspace, pnpm 10 lets package.json's value override the `--os` and
# `--cpu` flags of `pnpm install`, which the cloud build passes to install
# only its own platform (apps/cloud/install.sh).
supportedArchitectures:
  os:
    - current
    - darwin
    - linux
    - win32
  cpu:
    - current
    - x64
    - arm64

# pnpm 12 no longer reads the "pnpm" field of package.json.
allowBuilds:
  esbuild: true
  sharp: true
  "@parcel/watcher": false
  "@swc/core": false
  lmdb: false
  msgpackr-extract: false
  msw: false
  vue-demi: false
overrides:
  "@types/react": "^19.2.14"
  "@types/node": "catalog:"
  "@angular/build>vite": "^8.3.1"
  "@microsoft/api-extractor>typescript": "^6.0.3"
  "web-component-analyzer>typescript": "^6.0.3"
  "@angular/build>rolldown": "^1.2.12"
  "unrun>rolldown": "^1.2.12"
  "launch-editor": "2.14.1"
  "qs": "6.15.3"
  "@hono/node-server@>=1.0.0 <2.0.12": "^2.0.12"
  "@modelcontextprotocol/sdk@>=1.0.0 <1.30.0": "^1.30.0"
  "@nuxt/devtools@>=3.0.0 <3.3.1": "^3.3.1"
  "brace-expansion@>=1.0.0 <1.1.17": "^1.1.17"
  "esbuild@>=0.27.3 <0.28.1": "^0.28.1"
  "brace-expansion@>=2.0.0 <2.1.3": "^2.1.3"
  "brace-expansion@>=3.0.0 <5.0.8": "^5.0.8"
  "fast-uri@>=3.0.0 <3.1.4": "^3.1.4"
  "immutable@>=5.0.0 <5.1.8": "5.1.9"
  "js-yaml@>=3.0.0 <3.15.0": "^3.15.0"
  "js-yaml@>=4.0.0 <4.3.0": "^4.3.0"
  "linkify-it@>=5.0.0 <5.0.2": "^5.0.2"
  "postcss@>=8.0.0 <8.5.18": "^8.5.18"
  "svgo@>=4.0.0 <4.0.2": "^4.0.2"
  "tar@>=7.0.0 <7.5.19": "7.5.21"

# orval 8.42.0 (#1760) is younger than pnpm 12's one-day minimumReleaseAge. Exact
# versions only; delete this block once they pass the gate.
minimumReleaseAgeExclude:
  - "@orval/angular@8.42.0"
  - "@orval/axios@8.42.0"
  - "@orval/core@8.42.0"
  - "@orval/effect@8.42.0"
  - "@orval/fetch@8.42.0"
  - "@orval/hono@8.42.0"
  - "@orval/mcp@8.42.0"
  - "@orval/mock@8.42.0"
  - "@orval/pinia-colada@8.42.0"
  - "@orval/query@8.42.0"
  - "@orval/solid-start@8.42.0"
  - "@orval/swr@8.42.0"
  - "@orval/zod@8.42.0"
  - "orval@8.42.0"

# pnpm 12 offers to link the agent skills dependencies ship; we use none.
skills:
  dirs: []

# Fail the install on an unmet or conflicting peer dependency instead of warning.
strictPeerDependencies: true
