catalogMode: strict

# Installs every platform's native packages (esbuild, Biome, turbo, Next.js'
# SWC, sharp, …), not only this machine's. Set here, not in package.json: in
# a workspace, pnpm 10 lets package.json's value override the `--os` and
# `--cpu` flags of `pnpm install`, which the cloud build passes to install
# only its own platform (the services' installCommand in vercel.json).
supportedArchitectures:
  os:
    - current
    - darwin
    - linux
    - win32
  cpu:
    - current
    - x64
    - arm64

# Fail the install on an unmet or conflicting peer dependency instead of warning.
strictPeerDependencies: true

# pnpm 12 no longer reads the "pnpm" field of package.json.
allowBuilds:
  "esbuild": true
  "sharp": true
  "@parcel/watcher": false
  "@swc/core": false
  "cbor-extract": false
  "lmdb": false
  "msgpackr-extract": false
  "msw": false
  "rs-module-lexer": false
  "vue-demi": false
overrides:
  "@types/react": "^19.3.0"
  "@types/node": "catalog:"
  "@angular/build>vite": "^8.3.3"
  "@microsoft/api-extractor>typescript": "^6.0.3"
  "web-component-analyzer>typescript": "^6.0.3"
  # tsconfck peers on typescript ^5; the Qwik Router conformance fixture's
  # vite-tsconfig-paths brings it, and strictPeerDependencies fails any
  # install that re-resolves without this.
  "tsconfck>typescript": "^6.0.3"
  "@angular/build>rolldown": "^1.2.12"
  "unrun>rolldown": "^1.2.12"
  "@vercel/analytics>nuxt": "-"
  "@vercel/speed-insights>nuxt": "-"
