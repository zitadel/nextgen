packages:
  - "apps/*"
  - "packages/*"
  - "e2e"
  # The release, benchmark and mock OIDC provider projects (tools/release,
  # tools/bench, tools/oidc-mock) carry no code the workspace installs; they
  # are packages so the task runner can address their tasks (see turbo.json).
  - "tools/*"

catalog:
  "@angular/platform-server": ^22.2.3
  # Babel 7 for the Nuxt projects: Nuxt's sub-packages have optional peers on
  # Babel 7 plugins, which pnpm auto-installs into every project with Nuxt in
  # its graph, and it pairs their required @babel/core peer with the newest
  # @babel/core in the lockfile (8.x, for Angular) unless the project declares
  # its own. Without it, an install that re-resolves fails strictPeerDependencies.
  "@babel/core": ^7.29.7
  "@biomejs/biome": ^2.5.15
  "@clack/prompts": ^1.2.0
  "@custom-elements-manifest/analyzer": ^0.11.0
  "@edge-runtime/vm": ^5.0.0
  "@faker-js/faker": ^10.5.0
  '@fontsource/arimo': ^5.2.8
  # The sampler fumadocs-openapi builds an operation's default request with.
  # The docs build that request again, for an operation's Markdown and the
  # check of its TypeScript sample, so keep it on fumadocs-openapi's range.
  "@fumadocs/json-schema": ^0.3.2
  "@modelcontextprotocol/server": ^2.3.1
  "@moonrepo/cli": ^2.6.1
  "@mswjs/http-middleware": ^0.10.3
  "@nuxt/kit": ^4.5.1
