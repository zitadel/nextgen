catalogMode: strict

# pnpm 12 refuses packages published less than a day ago by default; keep
# installing fresh releases the way pnpm 10 did.
minimumReleaseAge: 0

# `packages/config` and `apps/cli` rely on `pre*`/`post*` lifecycle scripts.
enablePrePostScripts: true

# pnpm fails the install on any dependency build script that is neither allowed
# nor denied here. The denied ones all ship prebuilt binaries or committed output
# (`packages/api-mock/public/mockServiceWorker.js` for msw), so skipping their
# scripts is what pnpm has always done for this workspace.
allowBuilds:
  esbuild: true
  sharp: true
  "@parcel/watcher": false
  "@swc/core": false
  lmdb: false
  msgpackr-extract: false
  msw: false
  vue-demi: false

supportedArchitectures:
  os:
    - current
    - darwin
    - linux
    - win32
  cpu:
    - current
    - x64
    - arm64

