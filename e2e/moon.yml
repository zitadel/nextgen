id: "e2e"
language: "typescript"
layer: "automation"
stack: "frontend"
# The project that holds every end-to-end test. It consolidates what used to be
# four sibling packages — console-e2e, demo-next-e2e, demo-nuxt-e2e,
# cli-journey-e2e — into one automation-layer node that may depend on everything
# it drives. Each former package is now a subfolder (console/, demo-next/,
# demo-nuxt/, journey/).
#
# Outside this file the project is just another package with a `test` task:
# `moon ci :test` runs it like every other package. The individual lanes below
# are an internal detail — `test` depends on them, so there is no need to name a
# lane anywhere else.
#
# Every lane clears CI / GITHUB_ACTIONS (the old workflow ran each e2e step with
# `env -u CI -u GITHUB_ACTIONS`, so the suites and the journey runner behave as
# local runs). The backend-booting lanes share the `e2e-serial` mutex so moon
# runs them one at a time — the old workflow ran them as sequential steps, and
# several bind the same ports (both demo-next lanes drive demo-next on :3002).
dependsOn:
  - "api-mock"
  - "cli"
  - "console"
  - "demo-next"
  - "demo-nuxt"
  - "testing"

workspace:
  inheritedTasks:
    # Nothing to build. `test` is inherited (it runs the journey harness unit
    # tests via `pnpm run test:all`) and is not excluded.
    exclude:
      - "build"

tasks:
  typecheck:
    deps:
      # The real-instance configs and src-real specs import
      # @zitadel/testing/playwright.
      - "testing:build"

  # The one task the rest of the repo sees. It keeps the inherited command
  # (`corepack pnpm run test:all`, the journey harness unit tests) — overriding
  # the command here makes moon append it to the inherited one. Its deps run
  # every browser lane, so `moon ci :test` runs the whole suite.
  test:
    deps:
      - "e2e:console-smoke"
      - "e2e:console-real"
      - "e2e:console-embedded"
      - "e2e:console-platform"
      - "e2e:demo-next-mock"
      - "e2e:demo-next-real"
      - "e2e:demo-nuxt-mock"
      - "e2e:journey-local"
      # The test kit's own real-instance suite. Ran in the old workflow via the
      # same step as demo-next-real; kept in CI here as a dependency.
      - "testing:test-integration"
    options:
      runInCI: true

  # ── console lanes (former @zitadel/console-e2e) ──────────────────────────────

  # Embedded shell smoke: Vite preview of the built console under its production
  # embed base. No live API, own port — safe to run alongside the serial lanes.
  console-smoke:
    command: "corepack pnpm exec playwright test --config console/playwright.config.mts"
    env:
      CI: ""
      GITHUB_ACTIONS: ""
    deps:
      # Its config imports @zitadel/testing/playwright (shared launch options).
      - "testing:build"
      - "console:build"
    options:
      runInCI: true

  # Live console resource coverage through the Vite server-side API proxy.
  console-real:
    command: "corepack pnpm exec playwright test --config console/playwright.real.config.mts"
    deps:
      - "testing:build"
      - "cli:build"
      - "server:build"
    env:
      CI: ""
      GITHUB_ACTIONS: ""
      REAL_ZITADEL_PORT: "8093"
      ZITADEL_SERVER_BINARY: "$workspaceRoot/dist/server/nextgen"
      NEXTGEN_PLATFORM_BOOTSTRAP_PROJECT: "false"
      NEXTGEN_SERVER_CONSOLE_ENABLED: "false"
    options:
      cache: false
      runInCI: true
      mutex: "e2e-serial"

  # The embedded surfaces, served by the binary itself — no Vite, no proxy. The
  # only lane proving the console's API base and the Go mux routing table agree.
  console-embedded:
    command: "corepack pnpm exec playwright test --config console/playwright.embedded.config.mts"
    deps:
      - "testing:build"
      - "cli:build"
      - "server:build"
    env:
      CI: ""
      GITHUB_ACTIONS: ""
      EMBEDDED_ZITADEL_PORT: "8095"
      ZITADEL_SERVER_BINARY: "$workspaceRoot/dist/server/nextgen"
      NEXTGEN_PLATFORM_BOOTSTRAP_PROJECT: "false"
    options:
      cache: false
      runInCI: true
      mutex: "e2e-serial"

  # The embedded console against a deployment with the platform project
  # bootstrapped (the server default).
  console-platform:
    command: "corepack pnpm exec playwright test --config console/playwright.platform.config.mts"
    deps:
      - "testing:build"
      - "cli:build"
      - "server:build"
    env:
      CI: ""
      GITHUB_ACTIONS: ""
      PLATFORM_ZITADEL_PORT: "8097"
      ZITADEL_SERVER_BINARY: "$workspaceRoot/dist/server/nextgen"
    options:
      cache: false
      runInCI: true
      mutex: "e2e-serial"

  # ── demo-next lanes (former @zitadel/demo-next-e2e) ──────────────────────────

  # Mock lane: the demo against the standalone @zitadel/api-mock TCP server.
  demo-next-mock:
    command: "corepack pnpm exec playwright test --config demo-next/playwright.config.mts"
    env:
      CI: ""
      GITHUB_ACTIONS: ""
    deps:
      # Its config imports @zitadel/testing/playwright (shared launch options).
      - "testing:build"
      - "api-mock:build"
      - "sdk-next:build"
    options:
      runInCI: true
      mutex: "e2e-serial"

  # Real lane: the same sign-in journey against a real ephemeral instance seeded
  # via @zitadel/testing instead of api-mock.
  demo-next-real:
    command: "corepack pnpm exec playwright test --config demo-next/playwright.real.config.mts"
    deps:
      - "testing:build"
      - "cli:build"
      - "server:build"
    env:
      CI: ""
      GITHUB_ACTIONS: ""
      ZITADEL_SERVER_BINARY: "$workspaceRoot/dist/server/nextgen"
      NEXTGEN_SERVER_LOGIN_ENABLED: "false"
      NEXTGEN_SERVER_CONSOLE_ENABLED: "false"
      NEXTGEN_PLATFORM_BOOTSTRAP_PROJECT: "false"
    options:
      cache: false
      runInCI: true
      mutex: "e2e-serial"

  # ── demo-nuxt lane (former @zitadel/demo-nuxt-e2e) ───────────────────────────

  # Mock lane: the Vue / Nitro demo against @zitadel/api-mock.
  demo-nuxt-mock:
    command: "corepack pnpm exec playwright test --config demo-nuxt/playwright.config.mts"
    env:
      CI: ""
      GITHUB_ACTIONS: ""
    deps:
      # Its config imports @zitadel/testing/playwright (shared launch options).
      - "testing:build"
      - "api-mock:build"
      - "sdk-nuxt:build"
    options:
      runInCI: true
      mutex: "e2e-serial"

  # ── journey lane (former @zitadel/cli-journey-e2e) ───────────────────────────

  # The CLI customer setup journey. `--ci` runs the fixed variant set in one
  # process (fresh-app framework matrix, passkey preset, pre-existing app,
  # testkit); `--runtime binary` drives the built server binary; the runner
  # builds its own release tarballs (via release:pack), so it is self-contained
  # — no snapshot handoff from the workflow.
  # The command truly unsets CI / GITHUB_ACTIONS (not just blanks them): the
  # runner spawns `moon run release:pack`, a `runInCI: false` task that moon
  # hides whenever it detects CI — and moon detects CI from the var being
  # present, so an empty value is not enough. `env -u` removes them outright,
  # matching the old workflow's `env -u CI -u GITHUB_ACTIONS` step.
  journey-local:
    command: "env -u CI -u GITHUB_ACTIONS corepack pnpm run e2e-local -- --ci --matrix full --runtime binary"
    env:
      ZITADEL_TELEMETRY: "0"
    deps:
      - "cli:build"
      - "testing:build"
    options:
      cache: false
      runInCI: true
      mutex: "e2e-serial"
