extends:
  - recommended

rules:
  info-license: error
  info-license-strict: error
  no-ambiguous-paths: error
  no-invalid-media-type-examples: error
  no-schema-type-mismatch: error
  no-server-example.com: error
  no-unused-components: error
  operation-2xx-response: error
  operation-4xx-response: off
  # An operation's or a webhook's description is its API reference page's
  # body, and its first sentence the page's description (apps/api/api/openapi/AGENTS.md).
  operation-description: error
  operation-operationId: error
  tag-description: error

  # Wrong casing fails silently: an unknown property is dropped, not rejected.
  # Allows JSON Schema keywords and x- extensions; one-offs are ignore-listed.
  rule/wire-field-snake-case:
    subject:
      type: SchemaProperties
    assertions:
      pattern: /^(\$[a-zA-Z]+|x-[a-z0-9]+(-[a-z0-9]+)*|[a-z][a-z0-9]*(_[a-z0-9]+)*)$/
    severity: error

  # Covers query filter/sort field values, which the property rule can't see.
  # Rejects camelCase rather than requiring lowercase: OAuth/OIDC enums are RFC
  # vocabularies (`S256`, `Bearer`, the device_code grant URN). Unanchored so a
  # hump past the first word still fails (`created_atUTC`).
  rule/wire-enum-no-camel-case:
    subject:
      type: Schema
      property: enum
    assertions:
      notPattern: /[a-z][A-Z]/
    severity: error

  # Covers parameter names, which are not schema properties either. Same
  # camelCase test rather than snake_case, because header and cookie names are
  # legitimately neither (`Idempotency-Key`, `Origin`, `_zflow`).
  rule/wire-parameter-no-camel-case:
    subject:
      type: Parameter
      property: name
    assertions:
      notPattern: /[a-z][A-Z]/
    severity: error

  # An operationId is public: `zitadel api <operationId>`, the Go and TS client
  # method names. camelCase, opening with a verb from this list (the ones the
  # spec uses; add one only with an operation that needs it), and no `By…`
  # suffix, since the path carries the ID. Only operations under `paths`:
  # webhook operationIds name the event, noun first (gen_event_schemas).
  rule/operation-id-verb-camel-case:
    subject:
      type: Operation
      property: operationId
    where:
      - subject:
          type: Paths
        assertions:
          defined: true
    assertions:
      pattern: /^(accept|add|build|cancel|complete|create|deactivate|delete|evaluate|exchange|get|list|lookup|publish|query|reject|remove|revoke|rollback|search|set|submit|update|verify)([A-Z][a-z0-9]*)*$/
      notPattern: /By[A-Z][A-Za-z0-9]*$/
    severity: error

  # A path parameter names its resource (`{user_id}`, `{schema_id}`), so the
  # generated clients' arguments say which ID they take.
  rule/path-parameter-not-id:
    subject:
      type: Parameter
      property: name
    where:
      - subject:
          type: Parameter
          property: in
        assertions:
          const: path
    assertions:
      notPattern: /^id$/
    severity: error

  # A path parameter that carries an ID (`{user_id}`) has a schema with a
  # `pattern`, usually a $ref to the resource's ID schema
  # (`components/schemas/user-id.yaml`), so a malformed ID is refused before
  # any lookup. A `where` level takes one Parameter condition, so one regex
  # tests both `in` and `name`: `in` matches it only as `path`, `name` only as
  # `…_id`.
  rule/path-id-parameter-pattern:
    subject:
      type: Schema
      property: pattern
    where:
      - subject:
          type: Parameter
          property:
            - in
            - name
        assertions:
          pattern: /^(path|[a-z][a-z0-9_]*_id)$/
    assertions:
      defined: true
    severity: error

  # The first sentence of an operation's or a webhook's description is its API
  # reference page's description (apps/api/api/openapi/AGENTS.md), so the description
  # opens with a sentence: not a heading, a quote, a list, a table, a code
  # fence or HTML.
  rule/operation-description-opens-with-sentence:
    subject:
      type: Operation
      property: description
    assertions:
      notPattern: /^\s*(#|>|[-*+]\s|\d+[.)]\s|\||```|~~~|<)/
    severity: error
