<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sign-in by your agent</title>
<style>
  @font-face { font-family: "Futural"; src: url("../../apps/website/app/fonts/APK-Futural-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Arimo"; src: url("../../apps/website/app/fonts/Arimo-latin.woff2") format("woff2"); font-weight: 400 700; }
  @font-face { font-family: "Azeret Mono"; src: url("../../apps/website/app/fonts/AzeretMono-Medium-latin.woff2") format("woff2"); }

  :root {
    --bg: #0f0f11; --fg: #f4f4f6; --fg2: #bfbfcf; --muted: #82829c; --accent: #f25543; --accent-soft: #fa9e93; --purple: #6a4cc2; --lilac: #bba5e4;
    --window: #141417; --bar: #18181c; --edge: rgb(255 255 255 / 0.08); --ok: #5fd99a;
    --sans: "Arimo", Arial, sans-serif; --head: "Futural", Arial, sans-serif; --mono: "Azeret Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--sans); }
  .abs { position: absolute; }
  /* The brand's gradient light: orange from below, purple from above (Lightbox guidelines, website colors). */
  .glow { position: absolute; left: -10%; right: -10%; bottom: -52%; height: 95%; border-radius: 50%;
    background: radial-gradient(closest-side, rgb(242 85 67 / 0.5), rgb(189 37 20 / 0.22) 50%, transparent 100%); filter: blur(70px); }
  .glow2 { position: absolute; left: -18%; top: -62%; width: 82%; height: 112%; border-radius: 50%;
    background: radial-gradient(closest-side, rgb(106 76 194 / 0.55), rgb(64 24 137 / 0.26) 55%, transparent 100%); filter: blur(80px); }
  #noise { position: absolute; inset: 0; opacity: 0.09; mix-blend-mode: soft-light; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='256' height='256' filter='url(%23n)'/></svg>"); }

  .window { position: absolute; background: var(--window); border: 1px solid var(--edge); border-radius: 14px; overflow: hidden;
    box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.05), 0 30px 80px -30px rgb(0 0 0 / 0.9); }
  .bar { height: 44px; background: var(--bar); border-bottom: 1px solid var(--edge); display: flex; align-items: center; padding: 0 16px; gap: 8px; position: relative; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #3a3a40; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .bar .title { position: absolute; left: 0; right: 0; text-align: center; font: 14px var(--mono); color: var(--muted); pointer-events: none; }

  /* The agent: the prompt you typed, then what the agent did, in the run's order. */
  #agent { left: 96px; top: 196px; width: 740px; height: 760px; }
  #agentClock { position: absolute; right: 18px; font: 14px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  #agentBody { position: absolute; left: 0; right: 0; top: 44px; bottom: 0; overflow: hidden; }
  #agentLines { position: absolute; left: 0; right: 0; top: 0; padding: 24px 28px 28px; }
  .ln { display: flex; gap: 12px; margin-top: 10px; font: 16px/1.5 var(--mono); color: #d9d9e3; }
  .ln .ic { flex: none; width: 16px; text-align: center; }
  .ln .tx { flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ln.prompt { margin-top: 26px; padding: 14px 16px; border-radius: 10px; background: rgb(255 255 255 / 0.06); font: 21px/1.35 var(--sans); color: #fff; }
  .ln.prompt:first-child { margin-top: 0; }
  .ln.prompt .ic { color: var(--accent); }
  .ln.say { font: 18px/1.45 var(--sans); color: #ececf2; margin-top: 14px; }
  .ln.say .ic { color: var(--lilac); }
  .ln.run .ic { color: var(--accent); } .ln.run .tx { color: #fff; }
  .ln.check .ic { color: var(--ok); }
  .ln.edit .ic, .ln.skill .ic { color: var(--lilac); }
  .ln.read, .ln.skill { color: var(--muted); }
  .ln .typing { display: inline-block; width: 0.55em; height: 1.05em; vertical-align: -0.18em; background: #e9e9f0; margin-left: 2px; }

  #browser { left: 340px; top: 196px; width: 1240px; height: 760px; }
  #browser .url { position: absolute; left: 50%; transform: translateX(-50%); width: 46%; height: 28px; border-radius: 8px; background: #0e0e10; border: 1px solid var(--edge);
    font: 14px/28px var(--mono); color: var(--fg2); text-align: center; white-space: nowrap; overflow: hidden; }
  #browser .view { position: absolute; left: 0; right: 0; top: 44px; bottom: 0; overflow: hidden; background: #fbf5ec; }
  #browser .view img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

  .caption { position: absolute; left: 0; right: 0; text-align: center; font: 36px/1.3 var(--sans); color: var(--fg); text-shadow: 0 2px 20px rgb(0 0 0 / 0.8); }
  .caption em { font-style: normal; color: var(--accent); }
  .big { font-family: var(--head); font-size: 76px; line-height: 1.12; letter-spacing: -0.01em; }
  .lefty { left: 160px !important; right: auto !important; text-align: left !important; }
  /* The one caption style: a label top left, on the agent pane's left edge. */
  .label { top: 62px; left: 96px; right: auto; text-align: left; font: 50px/1.12 var(--head); padding: 8px 24px 12px; border-radius: 16px;
    background: rgb(10 10 14 / 0.62); backdrop-filter: blur(6px); white-space: nowrap; text-shadow: none; }

  #montage img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }

  .chip { font: 21px var(--mono); padding: 9px 16px; border-radius: 999px; border: 1px solid var(--edge); background: rgb(255 255 255 / 0.04); color: #e8e8f0; white-space: nowrap; }
  #end { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #end .line { font: 56px var(--head); margin-top: 34px; }
  #end .cmdpill { margin-top: 34px; font: 30px var(--mono); padding: 16px 30px; border-radius: 14px; background: #141417; border: 1px solid var(--edge); }
  #end .cmdpill span { color: var(--muted); }
  #end .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 1840px; margin-top: 34px; }
  #end .row .chip { font-size: 19px; padding: 7px 14px; color: var(--fg2); }
  #end .row.agents .chip { color: #fff; border-color: rgb(242 85 67 / 0.5); }
  #end .rowlabel { font: 15px var(--mono); letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; margin-top: 30px; }
  .endlogo { height: 104px; overflow: visible; }
  /* The website's hero Lottie (zitadel-litebox.vercel.app/cms/homepage-hero-opt.json), played frame by frame. */
  #heroArt { position: absolute; left: 0; top: 0; width: 550px; height: 448px; transform-origin: 0 0; mix-blend-mode: lighten;
    -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); }
  #close .rest { color: var(--accent); }
</style>
</head>
<body>
<div id="stage">
  <div class="glow" id="glow"></div>
  <div class="glow2" id="glow2"></div>
  <div id="noise"></div>
  <img id="heroArt" alt="" />

  <div id="agent" class="window">
    <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="title">~/crux · agent</span><span id="agentClock"></span></div>
    <div id="agentBody"><div id="agentLines"></div></div>
  </div>

  <div id="browser" class="window">
    <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="url" id="url">localhost:3000</span></div>
    <div class="view" id="view"><img id="shotA" alt="" /><img id="shotB" alt="" /></div>
  </div>

  <div id="montage" class="abs" style="inset:0;overflow:hidden">
    <img id="mA" alt="" /><img id="mB" alt="" /><div id="flash"></div>
  </div>

  <div id="close" class="abs" style="inset:0">
    <div id="c1" class="caption big lefty" style="top: 400px">You own the whole experience.</div>
    <div id="c2" class="caption big lefty" style="top: 492px">Zitadel owns the <span class="rest" id="cRest">rest.</span></div>
  </div>

  <div id="caption" class="caption label"></div>

  <div id="black" class="abs" style="inset:0;background:#000;z-index:50"></div>

  <div id="end" class="abs">
    <svg class="endlogo" id="endLogo" viewBox="0 0 495 122"></svg>
    <div class="line">Sign-in that fits your app.</div>
    <div class="cmdpill"><span>$ </span>npx @zitadel/cli@latest skills add</div>
    <div class="rowlabel">Your framework</div>
    <div class="row" id="frameworks"></div>
    <div class="rowlabel">Your agent</div>
    <div class="row agents" id="agents"></div>
  </div>
</div>
<script src="data/agent.js"></script>
<script src="data/logo.js"></script>
<script src="timeline.js"></script>
</body>
</html>
