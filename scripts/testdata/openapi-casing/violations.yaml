    get:
      operationId: listThings
      summary: List things
      tags:
        - Fixture
      parameters:
        - name: objectType
          in: query
          schema:
            type: string
        - name: plain_camel_case
          in: query
          schema:
            type: string
            enum:
              - createdAt
        # Both escapes below pass an anchored /^[a-z][a-z0-9]*[A-Z]/, which
        # cannot cross the underscore. They are the reason the rule is
        # unanchored.
        - name: hump_after_underscore
          in: query
          schema:
            type: string
            enum:
              - created_atUTC
        - name: hump_in_last_word
          in: query
          schema:
            type: string
            enum:
              - some_valueCamel
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  createdAt:
                    type: string
                  # Property names get a positive snake_case match, not just a
                  # camelCase test, so PascalCase has to fail here too.
                  PascalCase:
                    type: string
        "400":
          description: bad request