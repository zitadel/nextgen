### isolated in its own node: the enum rule reports once per enum array, so bad
### values sharing an array would prove only that the first one failed.
openapi: 3.1.0
info:
  title: wire casing violations
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
