<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow Engine Visualizer</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/liquidjs@10/dist/liquid.browser.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --text: #e1e4ed;
    --muted: #8b8fa3;
    --accent: #6c8cff;
    --accent-dim: #3a4a7a;
    --green: #4ade80;
    --yellow: #fbbf24;
    --red: #f87171;
    --purple: #a78bfa;
    --radius: 8px;

    --syn-key: #6c8cff;
    --syn-string: #4ade80;
    --syn-number: #fbbf24;
    --syn-bool: #c084fc;
    --syn-null: #8b8fa3;
    --syn-brace: #8b8fa3;

    --editor-font: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace;
    --editor-size: 13px;
    --editor-lh: 20px;
    --editor-pad: 16px;
    --gutter-w: 48px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }

  header {
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  header h1 { font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: 0.5px; }
  header h1 span { color: var(--text); }

  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: calc(100vh - 48px);
  }

  /* ── Tabs (shared) ── */
  .tab-bar {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    overflow-x: auto;
    flex-shrink: 0;
  }

  .tab-btn {
    padding: 10px 16px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    border: none;
    background: none;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: all 0.15s;
  }

  .tab-btn:hover { color: var(--text); background: rgba(108, 140, 255, 0.05); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  .tab-btn.flow-select { font-weight: 600; }
  .tab-btn.editor-mode { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* ── Left panel: editor ── */
  .editor-panel {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .editor-wrap {
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  .editor-scroll {
    width: 100%;
    height: 100%;
    overflow: auto;
    position: relative;
  }

  .gutter {
    position: absolute;
    top: 0; left: 0;
    width: var(--gutter-w);
    padding: var(--editor-pad) 0;
    text-align: right;
    font-family: var(--editor-font);
    font-size: var(--editor-size);
    line-height: var(--editor-lh);
    color: #3a3d4a;
    user-select: none;
    pointer-events: none;
    z-index: 3;
  }

  .gutter .ln { display: block; padding-right: 12px; height: var(--editor-lh); position: relative; }
  .gutter .ln.active-line { color: var(--accent); }
  .gutter .ln.breakpoint::before { content: "\25B6"; position: absolute; left: 6px; color: var(--accent); font-size: 10px; }

  .highlight-backdrop {
    position: absolute;
    top: 0; left: 0; right: 0;
    min-height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .line-highlight {
    position: absolute;
    left: var(--gutter-w); right: 0;
    height: var(--editor-lh);
    background: rgba(108, 140, 255, 0.08);
    border-left: 2px solid var(--accent);
  }
  .line-highlight.breakpoint-line { background: rgba(108, 140, 255, 0.15); }

  .highlight-pre {
    position: absolute;
    top: 0;
    left: var(--gutter-w);
    right: 0;
    padding: var(--editor-pad);
    padding-left: 12px;
    margin: 0;
    font-family: var(--editor-font);
    font-size: var(--editor-size);
    line-height: var(--editor-lh);
    white-space: pre;
    color: var(--text);
    pointer-events: none;
    z-index: 1;
    overflow: visible;
  }

  .highlight-pre .key { color: var(--syn-key); }
  .highlight-pre .str { color: var(--syn-string); }
  .highlight-pre .num { color: var(--syn-number); }
  .highlight-pre .bool { color: var(--syn-bool); }
  .highlight-pre .null { color: var(--syn-null); font-style: italic; }
  .highlight-pre .brace { color: var(--syn-brace); }

  textarea.code-editor {
    position: absolute;
    top: 0;
    left: var(--gutter-w);
    right: 0;
    min-height: 100%;
    padding: var(--editor-pad);
    padding-left: 12px;
    margin: 0;
    background: transparent;
    color: transparent;
    caret-color: var(--text);
    border: none;
    font-family: var(--editor-font);
    font-size: var(--editor-size);
    line-height: var(--editor-lh);
    white-space: pre;
    resize: none;
    outline: none;
    tab-size: 2;
    z-index: 2;
    overflow: visible;
    word-wrap: normal;
    overflow-wrap: normal;
  }

  textarea.code-editor::selection { background: rgba(108, 140, 255, 0.3); color: transparent; }

  /* Template editor (plain text, no overlay) */
  textarea.template-editor {
    width: 100%;
    height: 100%;
    padding: var(--editor-pad);
    background: var(--bg);
    color: var(--text);
    caret-color: var(--text);
    border: none;
    font-family: var(--editor-font);
    font-size: var(--editor-size);
    line-height: var(--editor-lh);
    white-space: pre;
    resize: none;
    outline: none;
    tab-size: 2;
  }

  .editor-status {
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    font-size: 11px;
    color: var(--muted);
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .editor-status .error { color: var(--red); }
  .editor-status .ok { color: var(--green); }

  .editor-pane { display: none; width: 100%; flex: 1; overflow: hidden; }
  .editor-pane.active { display: flex; flex-direction: column; }

  /* ── Right panel ── */
  .right-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .right-content {
    flex: 1;
    overflow: auto;
    position: relative;
  }

  .view { display: none; height: 100%; }
  .view.active { display: flex; flex-direction: column; }

  /* Diagram */
  #diagram-view { align-items: center; justify-content: center; padding: 24px; overflow: auto; }
  #diagram-view .mermaid-container { width: 100%; display: flex; justify-content: center; }
  #diagram-view .mermaid-container svg { max-width: 100%; height: auto; }

  /* Simulation */
  #sim-view { padding: 24px; align-items: center; overflow: auto; }

  .sim-phone {
    width: 375px;
    min-height: 500px;
    background: var(--surface);
    border-radius: 16px;
    border: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .sim-header { padding: 20px 24px 12px; border-bottom: 1px solid var(--border); }
  .sim-header h2 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .sim-header p { font-size: 13px; color: var(--muted); }

  .sim-body { padding: 20px 24px; flex: 1; display: flex; flex-direction: column; gap: 12px; }

  .sim-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
  .sim-field input {
    width: 100%; padding: 10px 12px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); font-size: 14px; outline: none; transition: border-color 0.15s;
  }
  .sim-field input:focus { border-color: var(--accent); }
  .sim-field input::placeholder { color: #4a4d5a; }

  .sim-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }

  .sim-btn {
    width: 100%; padding: 10px 16px; border-radius: var(--radius);
    font-size: 14px; font-weight: 500; cursor: pointer;
    border: 1px solid var(--border); transition: all 0.15s;
  }
  .sim-btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .sim-btn.primary:hover { background: #5a7aee; }
  .sim-btn.sso { background: var(--surface); color: var(--text); display: flex; align-items: center; gap: 8px; justify-content: center; }
  .sim-btn.sso:hover { background: var(--bg); }
  .sim-btn.link { background: none; border: none; color: var(--accent); font-size: 13px; padding: 6px 0; }
  .sim-btn.link:hover { text-decoration: underline; }
  .sim-btn.passkey { background: var(--surface); color: var(--text); }
  .sim-btn.passkey:hover { background: var(--bg); }

  .sim-error {
    background: rgba(248, 113, 113, 0.1);
    border: 1px solid rgba(248, 113, 113, 0.3);
    border-radius: var(--radius);
    padding: 10px 12px; font-size: 13px; color: var(--red);
  }

  .sim-footer {
    padding: 12px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .sim-breadcrumb { font-size: 11px; color: var(--muted); }
  .sim-breadcrumb span { color: var(--accent); }

  .sim-reset { font-size: 11px; color: var(--muted); background: none; border: none; cursor: pointer; text-decoration: underline; }
  .sim-reset:hover { color: var(--text); }

  .sim-complete {
    text-align: center; padding: 40px 24px; flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  }
  .sim-complete .checkmark {
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(74, 222, 128, 0.15);
    display: flex; align-items: center; justify-content: center; font-size: 24px;
  }
  .sim-complete h3 { font-size: 18px; }
  .sim-complete p { font-size: 13px; color: var(--muted); }

  .step-badge {
    display: inline-block; font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.5px; padding: 2px 8px; border-radius: 10px;
    background: rgba(108, 140, 255, 0.15); color: var(--accent); margin-left: 8px;
  }

  .sim-ids {
    padding: 8px 24px;
    font-size: 11px;
    color: var(--muted);
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    font-family: var(--editor-font);
    display: flex;
    gap: 16px;
  }
  .sim-ids code { color: var(--accent); }

  /* ── API Log ── */
  #api-view { padding: 0; overflow: auto; }

  .api-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .api-toolbar span { font-size: 12px; color: var(--muted); }
  .api-clear { font-size: 11px; color: var(--muted); background: none; border: none; cursor: pointer; text-decoration: underline; }
  .api-clear:hover { color: var(--text); }

  .api-log { flex: 1; overflow: auto; padding: 0; }

  .api-entry {
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }

  .api-entry-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .api-entry-header:hover { background: rgba(108, 140, 255, 0.04); }

  .api-method {
    font-family: var(--editor-font);
    font-size: 11px; font-weight: 700;
    padding: 2px 6px; border-radius: 4px;
    background: rgba(108, 140, 255, 0.15); color: var(--accent);
  }

  .api-url { font-family: var(--editor-font); color: var(--text); font-size: 12px; }

  .api-status {
    margin-left: auto;
    font-family: var(--editor-font);
    font-size: 11px; font-weight: 600;
  }
  .api-status.s2xx { color: var(--green); }
  .api-status.s4xx { color: var(--red); }

  .api-chevron {
    color: var(--muted); font-size: 10px;
    transition: transform 0.15s;
  }
  .api-entry.expanded .api-chevron { transform: rotate(90deg); }

  .api-detail { display: none; padding: 0 16px 12px; }
  .api-entry.expanded .api-detail { display: block; }

  .api-section { margin-bottom: 8px; }
  .api-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 4px; }

  .api-json {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    font-family: var(--editor-font);
    font-size: 11px;
    line-height: 18px;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--text);
    max-height: 300px;
    overflow: auto;
  }
</style>
</head>
<body>

<header>
  <h1>FLOW ENGINE <span>Visualizer</span></h1>
</header>

<div class="layout">
  <!-- Left: Editor -->
  <div class="editor-panel">
    <div class="tab-bar" id="left-tabs-flows">
      <!-- flow select tabs injected by JS -->
    </div>
    <div class="tab-bar" id="left-tabs-editor" style="border-bottom-color: var(--border);">
      <!-- editor mode tabs injected by JS -->
    </div>
    <!-- JSON editor pane -->
    <div class="editor-pane active" id="json-pane">
      <div class="editor-wrap">
        <div class="editor-scroll" id="editor-scroll">
          <div class="highlight-backdrop" id="highlight-backdrop"></div>
          <div class="gutter" id="gutter"></div>
          <pre class="highlight-pre" id="highlight-pre"></pre>
          <textarea id="editor" class="code-editor" spellcheck="false"></textarea>
        </div>
      </div>
    </div>
    <!-- Liquid template pane -->
    <div class="editor-pane" id="template-pane">
      <textarea id="template-editor" class="template-editor" spellcheck="false"></textarea>
    </div>
    <div class="editor-status">
      <span id="parse-status" class="ok">Valid JSON</span>
      <span id="step-count"></span>
    </div>
  </div>

  <!-- Right: Diagram + Sim + API -->
  <div class="right-panel">
    <div class="tab-bar">
      <button class="tab-btn active" data-view="diagram-view">Diagram</button>
      <button class="tab-btn" data-view="sim-view">Simulate</button>
      <button class="tab-btn" data-view="api-view">API Log</button>
    </div>
    <div class="right-content">
      <div id="diagram-view" class="view active">
        <div class="mermaid-container" id="mermaid-target"></div>
      </div>
      <div id="sim-view" class="view">
        <div class="sim-phone" id="sim-phone"></div>
      </div>
      <div id="api-view" class="view">
        <div class="api-toolbar">
          <span>Request / Response Log</span>
          <button class="api-clear" onclick="clearApiLog()">Clear</button>
        </div>
        <div class="api-log" id="api-log"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── Translations (simulates client-side i18n dictionary) ─────────

const T = {
  // Login flow
  "login.title": "Sign in",

  "login.field.password": "Password",

  // Registration flow

  // SaaS registration
  "saas.profile.title": "Complete your profile",
  "saas.profile.description": "Tell us a bit about yourself",
  "saas.profile.field.email": "Email",
  "saas.profile.field.display_name": "Display name",
  "saas.profile.field.company": "Company (optional)",
  "saas.profile.action.submit": "Create account",
  "saas.profile.action.login": "Already have an account?",
  "saas.terms.title": "Terms of Service",
  "saas.terms.description": "Please review and accept our terms",
  "saas.terms.action.accept": "I accept",
  "saas.terms.action.decline": "Decline",
  "saas.verify.title": "Verify your email",
  "saas.verify.description": "We sent a 6-digit code to your inbox",
  "saas.verify.field.code": "Verification code",
  "saas.verify.action.submit": "Verify",
  "saas.verify.action.resend": "Resend code",

  // Passkey
  "passkey.title": "Passwordless sign in",
  "passkey.description": "Use your passkey or security key to sign in",
  "passkey.action.authenticate": "Use passkey",
  "passkey.action.fallback": "Use password instead",
};

function t(key) { return T[key] || key; }

// ── Default Liquid Template ──────────────────────────────────────

const DEFAULT_TEMPLATE = `<h2>{{ texts.title_key | t }}</h2>
{% if texts.description_key %}<p class="desc">{{ texts.description_key | t }}</p>{% endif %}

{% if error %}<div class="error">{{ error }}</div>{% endif %}

{% for field in fields_list %}
<div class="field">
  <label>{{ field.text_key | t }}{% if field.required %} *{% endif %}</label>
  <input type="{{ field.type }}" name="{{ field.name }}" placeholder="{{ field.text_key | t }}" />
</div>
{% endfor %}

{% for provider in sso_providers %}
<button class="sso" data-action="sso" data-provider-id="{{ provider.id }}">
  Continue with {{ provider.name }}
</button>
{% endfor %}

{% for action in actions_list %}
{% if action.primary %}
<button class="primary" data-action="{{ action.name }}">{{ action.text_key | t }}</button>
{% else %}
<button class="link" data-action="{{ action.name }}">{{ action.text_key | t }}</button>
{% endif %}
{% endfor %}`;

// ── Flow Definitions (API-aligned data model) ────────────────────

const FLOWS = {
  "Login": {
    name: "Default Login",
    user_schema: "human_user",
    purposes: ["login"],
    initial_steps: { login: "login" },
    audience: {},
    steps: [
      {
        name: "login",
        texts: { title_key: "login.title", description_key: "login.description" },
        fields: {
          email: { type: "email", required: true, text_key: "login.field.email" },
          password: { type: "password", required: true, text_key: "login.field.password" }
        },
        actions: {
          submit: { text_key: "login.action.submit", primary: true },
          register: { text_key: "login.action.register" },
          recover: { text_key: "login.action.recover" }
        },
        gates: {},
        sso_providers: [
          { id: "google-1", name: "Google", template: "google" }
        ],
        transitions: {
          submit: { target: "done" },
          sso: { target: "sso_redirect" },
          register: { target: "default-register", action: "switch" },
          recover: { target: "default-recovery", action: "pivot" }
        }
      },
      {
        name: "sso_redirect",
        texts: { title_key: "login.sso.title" },
        redirect_url: "https://accounts.google.com/o/oauth2/auth?...",
        transitions: { callback: { target: "done" } }
      },
      {
        name: "done",
        complete: "redirect"
      }
    ]
  },

  "Registration": {
    name: "Default Registration",
    user_schema: "human_user",
    purposes: ["register"],
    initial_steps: { register: "profile" },
    audience: {},
    steps: [
      {
        name: "profile",
        texts: { title_key: "profile.title" },
        fields: {
          email: { type: "email", required: true, text_key: "profile.field.email" },
          given_name: { type: "text", required: true, text_key: "profile.field.given_name" },
          family_name: { type: "text", required: true, text_key: "profile.field.family_name" }
        },
        actions: {
          submit: { text_key: "profile.action.submit", primary: true },
          login: { text_key: "profile.action.login" }
        },
        gates: {},
        transitions: {
          submit: { target: "set_password" },
          login: { target: "default-login", action: "switch" }
        }
      },
      {
        name: "set_password",
        texts: { title_key: "set_password.title" },

// ── JSON Syntax Highlighting ──────────────────────────────────────

function highlightJSON(text) {
  const esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return esc.replace(
    /("(?:[^"\\]|\\.)*")\s*:/g, '<span class="key">$1</span>:'
  ).replace(
    /:\s*("(?:[^"\\]|\\.)*")/g, ': <span class="str">$1</span>'
  ).replace(
    /(?<=[\[,\n]\s*)("(?:[^"\\]|\\.)*")(?=\s*[,\]\n])/g, '<span class="str">$1</span>'
  ).replace(
    /\b(\d+(?:\.\d+)?)\b/g, '<span class="num">$1</span>'
  ).replace(
    /\b(true|false)\b/g, '<span class="bool">$1</span>'
  ).replace(
    /\bnull\b/g, '<span class="null">null</span>'
  ).replace(
    /([{}[\]])/g, '<span class="brace">$1</span>'
  );
}

// ── Gutter + Highlight Rendering ──────────────────────────────────

function renderEditorLayers() {
  const text = $editor.value;
  const lines = text.split('\n');
  const lineCount = lines.length;

  let gutterHtml = '';
  for (let i = 0; i < lineCount; i++) {
    const isBreakpoint = i === highlightedLines.start;
    const isActive = i >= highlightedLines.start && i <= highlightedLines.end && highlightedLines.start >= 0;
    const cls = (isBreakpoint ? ' breakpoint' : '') + (isActive ? ' active-line' : '');
    gutterHtml += `<span class="ln${cls}">${i + 1}</span>`;
  }
  $gutter.innerHTML = gutterHtml;
  $highlightPre.innerHTML = highlightJSON(text);

  let backdropHtml = '';
  if (highlightedLines.start >= 0) {
    const pad = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--editor-pad'));
    const lh = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--editor-lh'));
    for (let i = highlightedLines.start; i <= highlightedLines.end; i++) {
      const top = pad + i * lh;
      const cls = i === highlightedLines.start ? 'line-highlight breakpoint-line' : 'line-highlight';
      backdropHtml += `<div class="${cls}" style="top:${top}px"></div>`;
    }
  }
  $backdrop.innerHTML = backdropHtml;

  const contentHeight = lineCount * 20 + 32;
  const minH = $scroll.parentElement.clientHeight;
  const h = Math.max(contentHeight, minH);
  $editor.style.height = h + 'px';
  $highlightPre.style.height = h + 'px';
  $gutter.style.height = h + 'px';
  $backdrop.style.height = h + 'px';
}

$editor.addEventListener('scroll', syncScroll);
$scroll.addEventListener('scroll', syncScroll);
function syncScroll() { $editor.scrollTop = 0; $editor.scrollLeft = 0; }

// ── Find Step Line Range ──────────────────────────────────────────

function findStepLineRange(text, stepName) {
  if (!stepName) return { start: -1, end: -1 };
  const lines = text.split('\n');
  let nameLineIdx = -1;
  const namePattern = new RegExp(`"name"\\s*:\\s*"${escapeRegex(stepName)}"`);
  for (let i = 0; i < lines.length; i++) {
    if (namePattern.test(lines[i])) { nameLineIdx = i; break; }
  }
  if (nameLineIdx < 0) return { start: -1, end: -1 };

  let start = nameLineIdx, depth = 0;
  for (let i = nameLineIdx; i >= 0; i--) {
    for (const ch of lines[i]) {
      if (ch === '}' || ch === ']') depth++;
      if (ch === '{' || ch === '[') depth--;
    }
    if (depth < 0) { start = i; break; }
  }

  depth = 0;
  let end = start;
  for (let i = start; i < lines.length; i++) {
    for (const ch of lines[i]) {
      if (ch === '{' || ch === '[') depth++;
      if (ch === '}' || ch === ']') depth--;
    }
    if (depth <= 0) { end = i; break; }
  }
  return { start, end };
}

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function scrollEditorToStep(stepName) {
  const text = $editor.value;
  const range = findStepLineRange(text, stepName);
  highlightedLines = range;
  renderEditorLayers();
  if (range.start < 0) return;
  const lh = 20, pad = 16;
  const targetTop = pad + range.start * lh;
  const viewH = $scroll.clientHeight;
  const rangeH = (range.end - range.start + 1) * lh;
  const scrollTop = $scroll.scrollTop;
  const scrollBot = scrollTop + viewH;
  const blockTop = targetTop;
  const blockBot = targetTop + rangeH;
  if (blockTop < scrollTop + 40 || blockBot > scrollBot - 40) {
    $scroll.scrollTo({ top: Math.max(0, targetTop - viewH * 0.25), behavior: 'smooth' });
  }
}

    status.className = 'ok';
    status.textContent = 'Valid JSON';

// ── Mermaid Diagram ───────────────────────────────────────────────

let mermaidCounter = 0;

async function renderDiagram() {
  const target = document.getElementById('mermaid-target');
  if (!currentFlow || !currentFlow.steps) { target.innerHTML = ''; return; }

  const lines = ['graph TD'];
  const steps = currentFlow.steps;
  const transitionTargets = new Set(); // pivot + switch external targets

  for (const step of steps) {
    const id = 'n_' + step.name;
    let label = step.name;
    if (step.verify) label += `<br/>verify: ${step.verify}`;
    if (step.action) label += `<br/>action: ${step.action}`;
    if (step.complete) {
      lines.push(`    ${id}(["\`**${label}**<br/>complete: ${step.complete}\`"])`);
    } else if (step.redirect_url) {
      lines.push(`    ${id}["\`**${label}**<br/>redirect\`"]`);
    } else {
      lines.push(`    ${id}["\`**${label}**\`"]`);
    }
  }

  for (const step of steps) {
    if (!step.transitions) continue;
    const srcId = 'n_' + step.name;
    for (const [label, tgt] of Object.entries(step.transitions)) {
      const target = typeof tgt === 'string' ? tgt : tgt.target;
      const action = typeof tgt === 'object' ? tgt.action : null;

      if (action === 'pivot') {
        const extId = 'ext_pivot_' + target;
        if (!transitionTargets.has('pivot:' + target)) {
          transitionTargets.add('pivot:' + target);
          lines.push(`    ${extId}["\`**${target}**<br/>pivot (stack)\`"]:::pivot`);
        }
        lines.push(`    ${srcId} -.->|${label}| ${extId}`);
      } else if (action === 'switch') {
        const extId = 'ext_switch_' + target;
        if (!transitionTargets.has('switch:' + target)) {
          transitionTargets.add('switch:' + target);
          lines.push(`    ${extId}["\`**${target}**<br/>switch (replace)\`"]:::switchFlow`);
        }
        lines.push(`    ${srcId} -.->|${label}| ${extId}`);
      } else {
        // Same-flow transition
        lines.push(`    ${srcId} -->|${label}| n_${target}`);
      }
    }
  }

  for (const step of steps) {
    const id = 'n_' + step.name;
    if (step.complete) {
      lines.push(`    style ${id} fill:#1a3a2a,stroke:#4ade80,color:#4ade80`);
    } else if (step.redirect_url) {
      lines.push(`    style ${id} fill:#1a2744,stroke:#4a5568,color:#8b8fa3`);
    }
  }

  lines.push('    classDef pivot fill:#2a1a44,stroke:#a78bfa,color:#a78bfa');
  lines.push('    classDef switchFlow fill:#1a2a44,stroke:#60a5fa,color:#60a5fa');

  if (simState?.stepName) {
    const exists = steps.find(s => s.name === simState.stepName);
    if (exists) {
      lines.push(`    style n_${simState.stepName} fill:#2a3a6a,stroke:#6c8cff,stroke-width:3px,color:#fff`);
    }
  }

  const graphDef = lines.join('\n');
  try {
    const id = 'mermaid-g-' + (++mermaidCounter);
    const { svg } = await mermaid.render(id, graphDef);
    target.innerHTML = svg;
  } catch (e) {
    console.error('Mermaid render error:', e);
    target.innerHTML = '<p style="color: var(--muted); padding: 24px;">Could not render diagram \u2014 check console</p>';
  }
}

// ── API Log ──────────────────────────────────────────────────────

function logApi(method, url, request, status, response) {
  apiLog.push({ method, url, request, status, response });
  renderApiLog();
}

function clearApiLog() {
  apiLog = [];
  renderApiLog();
}

function renderApiLog() {
  const container = document.getElementById('api-log');
  if (apiLog.length === 0) {
    container.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted);font-size:13px;">Interact with the simulator to see API requests here.</div>';
    return;
  }

  container.innerHTML = apiLog.map((entry, i) => {
    const statusClass = entry.status < 400 ? 's2xx' : 's4xx';
    const expanded = i === apiLog.length - 1 ? ' expanded' : '';
    return `
      <div class="api-entry${expanded}" onclick="this.classList.toggle('expanded')">
        <div class="api-entry-header">
          <span class="api-chevron">\u25B6</span>
          <span class="api-method">${entry.method}</span>
          <span class="api-url">${entry.url}</span>
          <span class="api-status ${statusClass}">${entry.status}</span>
        </div>
        <div class="api-detail">
          <div class="api-section">
            <div class="api-label">Request</div>
            <div class="api-json">${syntaxHighlightJson(entry.request)}</div>
          </div>
          <div class="api-section">
            <div class="api-label">Response</div>
            <div class="api-json">${syntaxHighlightJson(entry.response)}</div>
          </div>
        </div>
      </div>`;
  }).join('');
}

function syntaxHighlightJson(obj) {
  const json = JSON.stringify(obj, null, 2);
  return json
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/("(?:[^"\\]|\\.)*")\s*:/g, '<span style="color:var(--syn-key)">$1</span>:')
    .replace(/:\s*("(?:[^"\\]|\\.)*")/g, ': <span style="color:var(--syn-string)">$1</span>')
    .replace(/\b(true|false)\b/g, '<span style="color:var(--syn-bool)">$1</span>')
    .replace(/\bnull\b/g, '<span style="color:var(--syn-null)">null</span>')
    .replace(/\b(\d+)\b/g, '<span style="color:var(--syn-number)">$1</span>');
}

// ── Simulation ────────────────────────────────────────────────────

function resetSim() {
  const purposes = currentFlow.purposes || ['login'];
  const purpose = purposes[0];
  const initial = currentFlow.initial_steps?.[purpose] || currentFlow.steps?.[0]?.name;

  simState = {
    flowId: genId('flow'),
    sessionId: genId('sess'),
    sessionToken: genToken(),
    stepName: initial,
    history: [],
    flowStack: [], // { flowName, flowId, stepName, history }
    error: null
  };

  advanceThroughInvisible();

  // Log POST /flow
  const step = findStep(simState.stepName);
  const request = { purpose };
  const response = buildFlowResponse(step);
  logApi('POST', '/flow', request, 201, response);

  onSimStepChanged();
}

function findStep(name) {
  return currentFlow?.steps?.find(s => s.name === name);
}

function buildFlowResponse(step) {
  const resp = {
    session_id: simState.sessionId,
    session_token: simState.sessionToken,
    step: buildStepPayload(step),
    branding: {
      layout: "centered",
      liquid_template: "(template omitted for brevity)"
    }
  };
  if (step?.complete === 'redirect') {
    resp.redirect_uri = "https://app.example.com/callback";
  }
  return resp;
}

function buildStepPayload(step) {
  if (!step) return null;
  const payload = { name: step.name };
  if (step.texts) payload.texts = step.texts;
  if (step.complete) payload.complete = step.complete;
  if (step.fields && Object.keys(step.fields).length > 0) payload.fields = step.fields;
  if (step.actions && Object.keys(step.actions).length > 0) payload.actions = step.actions;
  if (step.gates && Object.keys(step.gates).length > 0) payload.gates = step.gates;
  if (step.sso_providers?.length > 0) payload.sso_providers = step.sso_providers;
  if (step.redirect_url) payload.redirect_url = step.redirect_url;
  if (step.verify) payload.verify = step.verify;
  if (step.action) payload.action = step.action;
  if (simState.error) payload.error = simState.error;
  return payload;
}

function advanceThroughInvisible() {
  // No invisible steps in the simplified model.
  // This function is kept for compatibility but is a no-op.
}

function onSimStepChanged() {
  renderSim();
  renderDiagram();
  if (editorMode === 'definition') scrollEditorToStep(simState.stepName);
}

function simAction(actionName, providerId) {
  const step = findStep(simState.stepName);
  if (!step || !step.transitions) return;

  // Collect field values for the API log
  const phone = document.getElementById('sim-phone');
  const fieldValues = {};
  phone.querySelectorAll('input[name]').forEach(input => {
    if (input.value) fieldValues[input.name] = input.value;
  });

  const transition = step.transitions[actionName];
  if (!transition) {
    simState.error = null;
    renderSim();
    return;
  }

  // Normalize transition: string shorthand or {target, action} object
  const target = typeof transition === 'string' ? transition : transition.target;
  const transAction = typeof transition === 'object' ? transition.action : null;

  // Build submit request
  const submitRequest = {
    session_token: simState.sessionToken,
    action: actionName,
  };
  if (Object.keys(fieldValues).length > 0) submitRequest.fields = fieldValues;
  if (providerId) submitRequest.sso_provider_id = providerId;

  const oldFlowId = simState.flowId;

  // Handle pivot (stack)
  if (transAction === 'pivot') {
    const pivotFlowName = Object.keys(FLOWS).find(k => {
      const f = FLOWS[k];
      return f.name === target || k === target || f.purposes?.includes(target);
    });
    if (pivotFlowName) {
      simState.flowStack.push({
        flowName: currentFlowName,
        flowId: simState.flowId,
        stepName: simState.stepName,
        history: [...simState.history]
      });

      const newFlowId = genId('flow');
      simState.flowId = newFlowId;
      simState.sessionToken = genToken();

      currentFlowName = pivotFlowName;
      currentFlow = structuredClone(FLOWS[pivotFlowName]);
      document.querySelectorAll('.tab-btn.flow-select').forEach(b => b.classList.toggle('active', b.dataset.flow === pivotFlowName));
      $editor.value = JSON.stringify(currentFlow, null, 2);

      const purpose = currentFlow.purposes[0];
      simState.stepName = currentFlow.initial_steps?.[purpose] || currentFlow.steps?.[0]?.name;
      simState.history = [];
      simState.error = null;

      const newStep = findStep(simState.stepName);
      logApi('POST', `/flow/${oldFlowId}/submit`, submitRequest, 200, buildFlowResponse(newStep));
      highlightedLines = { start: -1, end: -1 };
      updateFromEditor();
      onSimStepChanged();
      return;
    }
  }

  // Handle switch (replace)
  if (transAction === 'switch') {
    const switchFlowName = Object.keys(FLOWS).find(k => {
      const f = FLOWS[k];
      return f.name === target || k === target || f.purposes?.includes(target);
    });
    if (switchFlowName) {
      const newFlowId = genId('flow');
      simState.flowId = newFlowId;
      simState.sessionToken = genToken();
      simState.flowStack = [];

      currentFlowName = switchFlowName;
      currentFlow = structuredClone(FLOWS[switchFlowName]);
      document.querySelectorAll('.tab-btn.flow-select').forEach(b => b.classList.toggle('active', b.dataset.flow === switchFlowName));
      $editor.value = JSON.stringify(currentFlow, null, 2);

      const purpose = currentFlow.purposes[0];
      simState.stepName = currentFlow.initial_steps?.[purpose] || currentFlow.steps?.[0]?.name;
      simState.history = [];
      simState.error = null;

      const newStep = findStep(simState.stepName);
      logApi('POST', `/flow/${oldFlowId}/submit`, submitRequest, 200, buildFlowResponse(newStep));
      highlightedLines = { start: -1, end: -1 };
      updateFromEditor();
      onSimStepChanged();
      return;
    }
  }

  // Normal same-flow transition
  simState.history.push(simState.stepName);
  simState.stepName = target;
  simState.error = null;
  simState.sessionToken = genToken();

  const newStep = findStep(simState.stepName);

  // Auto-pop: if complete step and there's a parent flow on the stack
  if (newStep?.complete && simState.flowStack.length > 0) {
    const parent = simState.flowStack.pop();
    simState.flowId = parent.flowId;
    simState.sessionToken = genToken();

    currentFlowName = parent.flowName;
    currentFlow = structuredClone(FLOWS[parent.flowName]);
    document.querySelectorAll('.tab-btn.flow-select').forEach(b => b.classList.toggle('active', b.dataset.flow === parent.flowName));
    $editor.value = JSON.stringify(currentFlow, null, 2);

    simState.stepName = parent.stepName;
    simState.history = parent.history;
    simState.error = null;

    // The parent resumes at its current step (re-render)
    const parentStep = findStep(simState.stepName);
    logApi('POST', `/flow/${oldFlowId}/submit`, submitRequest, 200, buildFlowResponse(parentStep));
    highlightedLines = { start: -1, end: -1 };
    updateFromEditor();
    onSimStepChanged();
    return;
  }

  logApi('POST', `/flow/${simState.flowId}/submit`, submitRequest, newStep ? 200 : 404, buildFlowResponse(newStep));
  onSimStepChanged();
}

// ── Sim Rendering ────────────────────────────────────────────────

async function renderSim() {
  const phone = document.getElementById('sim-phone');
  if (!simState) { phone.innerHTML = ''; return; }
  const step = findStep(simState.stepName);

  const idsHtml = `<div class="sim-ids">
    flow: <code>${simState.flowId}</code>
    session: <code>${simState.sessionId}</code>
    ${simState.flowStack.length > 0 ? `<span style="color:var(--purple)">stack: ${simState.flowStack.length}</span>` : ''}
  </div>`;

  if (!step) {
    phone.innerHTML = idsHtml + '<div class="sim-complete"><div class="checkmark">?</div><h3>Step not found</h3><p>' + (simState.stepName || 'none') + '</p></div>';
    return;
  }

  if (step.complete) {
    const title = t(step.texts?.title_key) || 'Complete';
    phone.innerHTML = `${idsHtml}
      <div class="sim-header"><h2>${title}</h2></div>
      <div class="sim-complete">
        <div class="checkmark">&#10003;</div>
        <h3>${title}</h3>
        <p>complete: ${step.complete}</p>
        ${step.complete === 'redirect' ? '<p style="color: var(--accent)">&#8594; redirect to application</p>' : ''}
        ${step.complete === 'show' ? '<p style="color: var(--green)">&#10003; displayed to user</p>' : ''}
      </div>
      <div class="sim-footer">
        <span class="sim-breadcrumb">${renderBreadcrumb()}</span>
        <button class="sim-reset" onclick="resetSim()">Reset</button>
      </div>`;
    return;
  }

  if (step.redirect_url && !step.fields) {
    const title = t(step.texts?.title_key) || 'Redirecting\u2026';
    phone.innerHTML = `${idsHtml}
      <div class="sim-header"><h2>${title}</h2></div>
      <div class="sim-body">
        <p style="color: var(--muted); text-align: center; padding: 40px 0;">Redirecting to external provider\u2026</p>
        <div class="sim-actions">
          <button class="sim-btn primary" onclick="simAction('callback')">Simulate callback</button>
        </div>
      </div>
      <div class="sim-footer">
        <span class="sim-breadcrumb">${renderBreadcrumb()}</span>
        <button class="sim-reset" onclick="resetSim()">Reset</button>
      </div>`;
    return;
  }

  // Try LiquidJS rendering
  const title = t(step.texts?.title_key) || step.name;
  const desc = step.texts?.description_key ? t(step.texts.description_key) : '';

  let bodyHtml = '';
  if (liquidEngine) {
    try {
      // Convert dicts to arrays for easier liquid iteration
      const context = {
        texts: step.texts || {},
        fields_list: Object.entries(step.fields || {}).map(([name, f]) => ({ name, ...f })),
        actions_list: Object.entries(step.actions || {}).map(([name, a]) => ({ name, ...a })),
        sso_providers: step.sso_providers || [],
        gates: step.gates || {},
        error: simState.error
      };
      bodyHtml = await liquidEngine.parseAndRender(currentTemplate, context);
    } catch (e) {
      console.warn('Liquid render error:', e);
      bodyHtml = renderStepFallback(step);
    }
  } else {
    bodyHtml = renderStepFallback(step);
  }

  phone.innerHTML = `${idsHtml}
    <div class="sim-body" id="sim-rendered-body">${bodyHtml}</div>
    <div class="sim-footer">
      <span class="sim-breadcrumb">${renderBreadcrumb()}</span>
      <button class="sim-reset" onclick="resetSim()">Reset</button>
    </div>`;

  // Attach event delegation for rendered buttons
  const body = document.getElementById('sim-rendered-body');
  if (body) {
    body.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (btn) {
        e.stopPropagation();
        simAction(btn.dataset.action, btn.dataset.providerId);
      }
    });
  }
}

function renderStepFallback(step) {
  const title = t(step.texts?.title_key) || step.name;
  const desc = step.texts?.description_key ? t(step.texts.description_key) : '';
  const errorHtml = simState.error ? `<div class="sim-error">${simState.error}</div>` : '';

  const fieldsHtml = Object.entries(step.fields || {}).map(([name, f]) => `
    <div class="sim-field">
      <label>${t(f.text_key)}${f.required ? ' *' : ''}</label>
      <input type="${f.type === 'password' ? 'password' : 'text'}" name="${name}" placeholder="${t(f.text_key)}" />
    </div>`).join('');

  const ssoHtml = (step.sso_providers || []).map(p =>
    `<button class="sim-btn sso" data-action="sso" data-provider-id="${p.id}">&#9679; Continue with ${p.name}</button>`
  ).join('');

  const actionsHtml = Object.entries(step.actions || {}).map(([name, a]) => {
    const cls = a.primary ? 'primary' : 'link';
    return `<button class="sim-btn ${cls}" data-action="${name}">${t(a.text_key)}</button>`;
  }).join('');

  return `
    <h2 style="font-size:20px;font-weight:600;margin-bottom:4px;">${title}<span class="step-badge">${step.name}</span></h2>
    ${desc ? `<p style="font-size:13px;color:var(--muted);margin-bottom:12px;">${desc}</p>` : ''}
    ${errorHtml}
    ${fieldsHtml}
    <div class="sim-actions">${ssoHtml}${actionsHtml}</div>`;
}

function renderBreadcrumb() {
  const parts = [...simState.history.slice(-3), simState.stepName];
  return parts.map((p, i) =>
    i === parts.length - 1 ? `<span>${p}</span>` : p
  ).join(' &#8594; ');
}
