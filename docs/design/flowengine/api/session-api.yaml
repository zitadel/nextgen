openapi: 3.1.0
info:
  title: Zitadel Session API
  version: 1.0.0-draft
  description: |
    Session read model and anonymous session pre-creation.

    Sessions are assurance-aware: they accumulate verified factors and expose
    the current assurance level (ACR) computed from those factors.

    **Sessions are never mutated directly by a client.** Factor proofs are
    submitted via the `auth_attempts` state machine:
      POST /auth_attempts
      POST /auth_attempts/{id}/challenges
      POST /auth_attempts/{id}/challenges/{cid}/verify
      POST /auth_attempts/{id}/complete
      POST /session_handoffs/{id}/exchange  → returns session + session_token

    `POST /sessions` creates an anonymous session shell (no user, no factors)
    for cases where a session_id must be pre-allocated before auth begins.
    See session-api.md for the full lifecycle.

servers:
  - url: https://{region}.zitadel.cloud
    variables:
      region:
        default: eu-west-1

tags:
  - name: Sessions
    description: Session lifecycle and factor accumulation

paths:
  /sessions:
    post:
      operationId: createAnonymousSession
      summary: Create an anonymous session shell
      description: |
        Pre-allocates a session_id before authentication begins. The session
        starts with no user and no factors (state: building). A subsequent
        POST /auth_attempts with this session_id upgrades it.

        Anonymous sessions expire in 10 minutes if no auth_attempt upgrades
        them. The session_token returned here is superseded when a handoff
        exchange completes — clients must replace it with the token from the
        exchange response.
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Anonymous session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"

    get:
      operationId: listSessions
      summary: List sessions
      tags: [Sessions]
      parameters:
        - name: user_id
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum: [building, active, expired, revoked]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSessionsResponse"

  /sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/sessionId"

    get:
      operationId: getSession
      summary: Get session state, factors, and assurance levels
      tags: [Sessions]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: revokeSession
      summary: Revoke a session (logout)
      tags: [Sessions]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Session revoked
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    sessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        example: sess_abc123

  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: |
        Session token. Issued on POST /sessions (anonymous) and refreshed on
        POST /session_handoffs/{id}/exchange (authenticated). Use the most
        recently received token.

  schemas:
    CreateSessionRequest:
      type: object
      description: |
        Creates an anonymous session shell. No user or factor data is accepted
        here — those are established through auth_attempts.
      properties:
        project_id:
          type: string
          description: The project this session belongs to.
          example: proj_abc123
        user_agent:
          $ref: "#/components/schemas/UserAgent"

    SessionResponse:
      type: object
      required: [session_id, session_token, state, factors, acr, amr]
      properties:
        session_id:
          type: string
          example: sess_abc123
        session_token:
          type: string
          description: |
            Bearer token for session-scoped operations (DELETE).
            Issued on POST /sessions and refreshed on handoff exchange.
            Replace this value whenever a newer token is received.
          example: stok_xyz789
        state:
          type: string
          enum: [building, active, expired, revoked]
        factors:
          type: object
          description: |
            Map of verified factors. Each key is a factor type, value contains
            verification metadata including timestamps and authenticator properties.
            Factors are written exclusively by completing auth_attempts — never
            pushed directly by a client.
          additionalProperties:
            $ref: "#/components/schemas/Factor"
          example:
            user: { user_id: u_123, verified_at: "2026-04-17T10:00:00Z" }
            password: { verified_at: "2026-04-17T10:01:00Z" }
            otp: { verified_at: "2026-04-17T10:02:00Z" }
        acr:
          type: array
          items:
            type: string
          description: |
            All ACR levels the session's current factors satisfy, recomputed on
            every auth_attempt completion. Empty for anonymous/building sessions
            with no auth factors. AAL levels are cumulative: a session satisfying
            AAL2 will always include AAL1 in this list.

            When issuing an OIDC ID token, the IdP picks one value from this list
            that satisfies the RP's acr_values request and places it in the `acr`
            claim. The RP checks membership, not a single scalar comparison.
          example: ["urn:zitadel:aal:1", "urn:zitadel:aal:2"]
        amr:
          type: array
          items:
            type: string
          description: |
            Authentication Methods References — list of method identifiers used
            during authentication. Maps to the `amr` claim in OIDC ID tokens.
          example: ["pwd", "otp", "mfa"]
        expires_at:
          type: string
          format: date-time
          description: |
            When this session expires. Anonymous sessions use a short TTL (10 min).
            Authenticated sessions use the project-configured session lifetime.

    Factor:
      type: object
      properties:
        user_id:
          type: string
        verified_at:
          type: string
          format: date-time
        hardware:
          type: boolean
          description: Whether the authenticator is hardware-based
        phishing_resistant:
          type: boolean
          description: Whether the authenticator provides verifier impersonation resistance
        user_verified:
          type: boolean
          description: Whether the authenticator performed user verification (PIN, biometric)

    UserAgent:
      type: object
      properties:
        fingerprint:
          type: string
        ip:
          type: string

    ListSessionsResponse:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: "#/components/schemas/SessionResponse"
        total:
          type: integer

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object

  responses:
    NotFound:
      description: Session not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
