openapi: 3.1.0
info:
  title: Zitadel Session API
  version: 1.0.0-draft
  description: |
    Low-level session primitive for durable post-auth state.
    Sessions are assurance-aware read models: auth_attempts write verified
    factors, and sessions expose every currently satisfied assurance level
    through assurance_levels[].

servers:
  - url: https://{region}.zitadel.cloud
    variables:
      region:
        default: eu-west-1

tags:
  - name: Sessions
    description: Session lifecycle and factor accumulation

paths:
  /sessions:
    post:
      operationId: createSession
      summary: Create an optional anonymous pre-auth session shell
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"

    get:
      operationId: listSessions
      summary: List sessions
      tags: [Sessions]
      parameters:
        - name: user_id
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum: [building, active, expired, revoked]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSessionsResponse"

  /sessions/exchange:
    post:
      operationId: exchangeHandoff
      summary: Exchange a handoff token for a session
      description: |
        Consumes a one-time handoff_token minted by
        POST /auth_attempts/{id}/handoff. The exchange creates a new
        authenticated session, upgrades an anonymous session shell, or performs
        step-up on an existing session referenced by the auth_attempt.
      tags: [Sessions]
      security:
        - secretAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Optional retry key for Category B idempotency. Retries within the
            handoff exchange window return the cached session payload without
            consuming the one-time handoff token again.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoffExchangeRequest"
      responses:
        "200":
          description: Handoff exchanged for a session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionExchangeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          $ref: "#/components/responses/Gone"

  /sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/sessionId"

    get:
      operationId: getSession
      summary: Get session state, factors, and assurance levels
      tags: [Sessions]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: revokeSession
      summary: Revoke a session
      tags: [Sessions]
      security:
        - sessionToken: []
      responses:
        "204":
          description: Session revoked
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    sessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        example: sess_abc123

  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: Session token returned on creation or handoff exchange
    secretAuth:
      type: http
      scheme: bearer
      description: Project secret used by a backend to exchange handoff tokens

  schemas:
    CreateSessionRequest:
      type: object
      properties:
        user_agent:
          $ref: "#/components/schemas/UserAgent"

    HandoffExchangeRequest:
      type: object
      required: [handoff_token]
      properties:
        handoff_token:
          type: string
          example: htok_abc123

    SessionExchangeResponse:
      type: object
      required: [session, session_token]
      properties:
        session:
          $ref: "#/components/schemas/SessionResponse"
        session_token:
          type: string
          description: Token for reading or revoking the returned session.
          example: tok_xyz789

    SessionResponse:
      type: object
      required: [session_id, state, factors, assurance_levels, amr]
      properties:
        session_id:
          type: string
          example: sess_abc123
        state:
          type: string
          enum: [building, active, expired, revoked]
        factors:
          type: object
          description: |
            Map of verified factors. Each key is a factor type, value contains
            verification metadata including timestamps and authenticator properties.
          additionalProperties:
            $ref: "#/components/schemas/Factor"
          example:
            user: { user_id: u_123, verified_at: "2026-04-17T10:00:00Z" }
            password: { verified_at: "2026-04-17T10:01:00Z" }
            otp: { verified_at: "2026-04-17T10:02:00Z" }
        assurance_levels:
          type: array
          items:
            type: string
          description: |
            All assurance levels currently satisfied by the verified factors,
            their properties, and freshness windows. The OIDC adapter maps one
            requested or eligible value to the token `acr` claim.
          example: ["urn:zitadel:aal:1", "urn:zitadel:aal:2"]
        amr:
          type: array
          items:
            type: string
          description: |
            Authentication Methods References — list of method identifiers used
            during authentication. Maps to the `amr` claim in OIDC ID tokens.
          example: ["pwd", "otp", "mfa"]
    Factor:
      type: object
      properties:
        user_id:
          type: string
        verified_at:
          type: string
          format: date-time
        hardware:
          type: boolean
          description: Whether the authenticator is hardware-based
        phishing_resistant:
          type: boolean
          description: Whether the authenticator provides verifier impersonation resistance

    UserAgent:
      type: object
      properties:
        fingerprint:
          type: string
        ip:
          type: string

    ListSessionsResponse:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: "#/components/schemas/SessionResponse"
        total:
          type: integer

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object

  responses:
    NotFound:
      description: Session not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid credential
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: Handoff token expired or already consumed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
