openapi: 3.1.0
info:
  title: Zitadel Flow Engine API
  version: 1.0.0-draft
  description: |
    Server-side state machine producing Capability payloads (fields, actions, gates)
    alongside LiquidJS templates. Used by web/frontend clients for ready-made login,
    registration, and recovery.
    Operates on sessions internally. Flow state is stored in an encrypted HttpOnly
    cookie — the server is stateless for flow orchestration. Only factor verifications
    and user mutations touch the database.

servers:
  - url: https://{region}.zitadel.cloud
    variables:
      region:
        default: eu-west-1

tags:
  - name: Flows
    description: Flow lifecycle — start, advance, re-render
  - name: Flow Definitions
    description: Flow definition management (CRUD, lifecycle, validation)

paths:
  # ── Flow runtime ──────────────────────────────────────────────

  /flows:
    post:
      operationId: createFlow
      summary: Start a new flow
      description: |
        Resolves a flow definition based on purpose + audience context,
        creates a session internally, and returns the first capability step.
      tags: [Flows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFlowRequest"
      responses:
        "201":
          description: Flow started, first step returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowResponse"

  /flows/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/sessionId"
    get:
      operationId: getFlowStep
      summary: Get current step (re-render)
      description: Returns the current capability step without advancing the state machine.
      tags: [Flows]
      security:
        - sessionToken: []
      responses:
        "200":
          description: Current step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/FlowCompleted"

  /flows/{sessionId}/submit:
    parameters:
      - $ref: "#/components/parameters/sessionId"
    post:
      operationId: submitFlowStep
      summary: Submit step data and advance
      description: |
        Submits user input for the current step. The server validates,
        processes (e.g., verifies a credential), advances the state machine
        through any invisible policy_check steps, and returns the next
        visible step.
      tags: [Flows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowSubmitRequest"
      responses:
        "200":
          description: Advanced to next step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowResponse"
        "400":
          description: |
            Validation or proof verification failed. Returns the same step
            with an `error` field. The session token is still rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowResponse"
        "409":
          $ref: "#/components/responses/Conflict"

  /flows/{sessionId}/event:
    parameters:
      - $ref: "#/components/parameters/sessionId"
    post:
      operationId: submitFlowEvent
      summary: Submit client-side event
      description: |
        Submits telemetry or fingerprint data from the frontend.
        Does not advance the state machine. Used for risk evaluation.
      tags: [Flows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowEventRequest"
      responses:
        "204":
          description: Event recorded

  # ── Flow definitions ──────────────────────────────────────────

  /flow-definitions:
    get:
      operationId: listFlowDefinitions
      summary: List flow definitions
      tags: [Flow Definitions]
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [draft, active, archived]
        - name: purpose
          in: query
          schema:
            type: string
            enum: [login, register, recovery, profiling, reauth, link_account]
        - name: team_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Flow definition list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDefinitionsResponse"

    post:
      operationId: createFlowDefinition
      summary: Create a flow definition
      tags: [Flow Definitions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowDefinition"
      responses:
        "201":
          description: Definition created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowDefinitionResponse"

  /flow-definitions/{definitionId}:
    parameters:
      - $ref: "#/components/parameters/definitionId"

    get:
      operationId: getFlowDefinition
      summary: Get a flow definition
      tags: [Flow Definitions]
      responses:
        "200":
          description: Flow definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowDefinitionResponse"

    patch:
      operationId: updateFlowDefinition
      summary: Update a flow definition
      tags: [Flow Definitions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowDefinition"
      responses:
        "200":
          description: Definition updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowDefinitionResponse"

    delete:
      operationId: deleteFlowDefinition
      summary: Delete a flow definition
      tags: [Flow Definitions]
      responses:
        "204":
          description: Definition deleted

  /flow-definitions/{definitionId}/activate:
    parameters:
      - $ref: "#/components/parameters/definitionId"
    post:
      operationId: activateFlowDefinition
      summary: Activate a draft definition
      tags: [Flow Definitions]
      responses:
        "200":
          description: Definition activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowDefinitionResponse"

  /flow-definitions/{definitionId}/archive:
    parameters:
      - $ref: "#/components/parameters/definitionId"
    post:
      operationId: archiveFlowDefinition
      summary: Archive an active definition
      tags: [Flow Definitions]
      responses:
        "200":
          description: Definition archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowDefinitionResponse"

  /flow-definitions/{definitionId}/validate:
    parameters:
      - $ref: "#/components/parameters/definitionId"
    post:
      operationId: validateFlowDefinition
      summary: Validate the step graph
      description: Checks for dead ends, missing transitions, unreachable steps.
      tags: [Flow Definitions]
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"

  /flow-definitions/{definitionId}/simulate:
    parameters:
      - $ref: "#/components/parameters/definitionId"
    post:
      operationId: simulateFlowDefinition
      summary: Dry-run with mock input
      tags: [Flow Definitions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateRequest"
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulateResponse"

  /flow-definitions/resolve:
    post:
      operationId: resolveFlowDefinition
      summary: Resolve which definition applies for a given context
      tags: [Flow Definitions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRequest"
      responses:
        "200":
          description: Resolved definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowDefinitionResponse"

components:
  parameters:
    sessionId:
      name: sessionId
      in: path
      required: true
      description: Session ID (also serves as the flow handle)
      schema:
        type: string
        example: sess_xyz

    definitionId:
      name: definitionId
      in: path
      required: true
      schema:
        type: string
        example: flow_enterprise

  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: Session token returned on flow creation or last submit

  schemas:
    # ── Flow runtime schemas ────────────────────────────────────

    CreateFlowRequest:
      type: object
      required: [purpose]
      properties:
        purpose:
          type: string
          enum: [login, register, recovery, profiling, reauth, link_account]
        auth_request_id:
          type: string
          description: OIDC/SAML auth request ID (links flow to protocol request)
        redirect_uri:
          type: string
          format: uri
        liquid_template:
          type: string
          description: |
            Optional LiquidJS template override. If provided, this template is used
            instead of the one inherited from the app → organization → instance hierarchy.
            Enables per-flow layout customization without changing the org-level branding.
        hint:
          $ref: "#/components/schemas/FlowHint"

    FlowHint:
      type: object
      properties:
        login_name:
          type: string
          description: Auto-submits identifier step (maps to OIDC login_hint)
        team_id:
          type: string
          description: Scopes flow resolution to a team
        schema_id:
          type: string
          description: Scopes to a specific user type
        app_id:
          type: string
          description: Scopes to a specific application

    FlowResponse:
      type: object
      required: [session_id, session_token, step]
      properties:
        session_id:
          type: string
        session_token:
          type: string
        step:
          $ref: "#/components/schemas/FlowStep"
        branding:
          $ref: "#/components/schemas/Branding"
          description: |
            Resolved branding inherited from the app → organization → instance hierarchy.
            Determined at flow creation based on audience context. Does not change between steps.
        redirect_uri:
          type: string
          format: uri
          description: Present on the `complete` step when a redirect is needed

    FlowStep:
      type: object
      required: [name, type, fields, actions, gates]
      description: |
        A step contains unordered capability dictionaries: what to collect (fields),
        what the user can do (actions), and what security gates must be satisfied (gates).
        Layout and element ordering are controlled by the LiquidJS template in `branding.liquid_template`.
        See flow-engine-nodes.md for the full response shape specification.
      properties:
        name:
          type: string
          description: Step name from the flow definition
        type:
          type: string
          enum: [identifier, credential, form, verification, consent, info, redirect, captcha, complete]
          description: |
            Step type. Note: `policy_check` and `action` steps never render —
            the flow engine auto-transitions through them.
        texts:
          $ref: "#/components/schemas/StepTexts"
        error:
          type: string
          description: Error message from a previous failed submission
          nullable: true
        behavior:
          type: string
          enum: [redirect, show, continue]
          description: |
            Only present on `complete` steps. Tells the frontend what to do:
            - redirect: navigate to redirect_uri immediately
            - show: render the step via the Liquid template (success screen)
            - continue: call GET /flows/{session_id} for the next step (auto-pivot happened)
        redirect_url:
          type: string
          format: uri
          description: For `redirect` steps — URL to navigate to (e.g., SSO provider)
        fields:
          type: object
          description: |
            Unordered dictionary of input fields to collect. Keyed by field name.
            The LiquidJS template controls which fields appear and in what order.
          additionalProperties:
            $ref: "#/components/schemas/Field"
          default: {}
          example:
            identifier:
              type: email
              required: true
              text_key: identifier.field.email
        actions:
          type: object
          description: |
            Unordered dictionary of available user actions. Keyed by action name.
            The LiquidJS template controls positioning and presentation.
          additionalProperties:
            $ref: "#/components/schemas/StepAction"
          default: {}
          example:
            submit:
              primary: true
              text_key: identifier.action.submit
            register:
              text_key: identifier.action.register
        gates:
          type: object
          description: |
            Security gates that must be satisfied before the step can be submitted.
            The orchestrator appends any required but unrendered gates as a safety net.
          additionalProperties:
            $ref: "#/components/schemas/Gate"
          default: {}
        sso_providers:
          type: array
          description: Available SSO identity providers for this step.
          items:
            $ref: "#/components/schemas/SSOProvider"
          default: []
        messages:
          type: array
          description: Informational messages for this step (e.g., "Check your email").
          items:
            $ref: "#/components/schemas/FlowMessage"
          default: []
        errors:
          type: array
          description: Step-level errors from a previous failed submission or server-side validation.
          items:
            $ref: "#/components/schemas/FlowError"
          default: []
        identity:
          $ref: "#/components/schemas/FlowIdentity"
          nullable: true
          description: |
            Partial identity context when the user has been identified but the flow
            is not yet complete (e.g., display_name, avatar for the password step).

    StepTexts:
      type: object
      description: |
        Step-level localization keys. Resolved client-side via the `| t` LiquidJS filter.
        The backend never sends display text — only semantic keys.
      properties:
        title_key:
          type: string
          description: Localization key for the step heading
          example: identifier.title
        description_key:
          type: string
          description: Localization key for explanatory text
          nullable: true
          example: identifier.description

    Field:
      type: object
      required: [type, text_key]
      description: |
        A data input capability. Describes what the user must provide.
        Does not contain display text — only a `text_key` resolved client-side.
      properties:
        type:
          type: string
          enum: [text, email, password, tel, number, url, date, hidden]
        text_key:
          type: string
          description: Localization key for the field label
          example: identifier.field.email
        required:
          type: boolean
          default: false
        value:
          description: Pre-filled value (e.g., email carried over from a pivot)
        autocomplete:
          type: string
          description: |
            HTML autocomplete hint (e.g., "username", "current-password",
            "username webauthn" for conditional passkey UI).
          example: username
        validation:
          type: object
          properties:
            format:
              type: string
            pattern:
              type: string
            min_length:
              type: integer
            max_length:
              type: integer

    StepAction:
      type: object
      required: [text_key]
      description: |
        An action the user can take. Keyed by action name in the parent dictionary.
        The action name is sent back in the submit request as `action`.
      properties:
        text_key:
          type: string
          description: Localization key for the action label
          example: identifier.action.submit
        primary:
          type: boolean
          default: false
          description: Whether this is the primary/default action

    Gate:
      type: object
      required: [type]
      description: |
        A security gate that must be satisfied. The orchestrator appends any
        required-but-unrendered gates automatically as a safety net.
      properties:
        type:
          type: string
          enum: [captcha, passkey]
          description: Gate type
        provider:
          type: string
          description: Provider identifier (e.g., "altcha", "turnstile")
          example: altcha
        required:
          type: boolean
          default: true
        satisfied:
          type: boolean
          default: false
          description: Whether this gate has already been satisfied in this flow
        config:
          type: object
          description: Provider-specific challenge parameters
          additionalProperties: true

    SSOProvider:
      type: object
      required: [id, name, template]
      description: An available SSO identity provider.
      properties:
        id:
          type: string
          description: Provider instance identifier
          example: google-1
        name:
          type: string
          description: Display name for the provider
          example: Google
        template:
          type: string
          description: Template hint for rendering (logo, colors)
          example: google

    FlowMessage:
      type: object
      required: [text_key, severity]
      description: An informational message displayed on the step (e.g., "Check your email").
      properties:
        text_key:
          type: string
          description: Localization key for the message text
          example: verification.message.check_email
        severity:
          type: string
          enum: [info, success, warning]
          default: info

    FlowError:
      type: object
      required: [text_key]
      description: A step-level error from validation or server-side processing.
      properties:
        text_key:
          type: string
          description: Localization key for the error message
          example: identifier.error.user_not_found
        field:
          type: string
          description: |
            If the error is tied to a specific field, this matches the field's
            dictionary key. Null for step-level errors.
          nullable: true

    FlowIdentity:
      type: object
      description: |
        Partial identity context available after the user has been identified.
        Used by templates to personalize subsequent steps (e.g., show avatar on password screen).
      properties:
        display_name:
          type: string
          example: Alice
        login_name:
          type: string
          example: alice@acme.com
        avatar_url:
          type: string
          format: uri
          nullable: true

    Branding:
      type: object
      description: |
        Resolved branding configuration. Inherited from the app → organization → instance
        hierarchy at flow creation time (most specific wins). This is a read-only projection —
        branding is configured via the Organization/App Branding API, not the Flow API.
      properties:
        layout:
          type: string
          enum: [centered, split]
          description: |
            Layout preset selector. The default.liquid master template uses this
            to branch into layout variants. Customers who eject the template
            can ignore this field entirely.
          default: centered
        liquid_template:
          type: string
          description: |
            The LiquidJS template string for rendering this step. The orchestrator
            parses this template, injects the capability dictionaries as context,
            and renders the output HTML into its Shadow DOM.
        logo_url:
          type: string
          format: uri
          description: Organization logo URL
        font_url:
          type: string
          format: uri
          description: Custom font URL (e.g., Google Fonts CSS)
        hero_url:
          type: string
          format: uri
          description: Hero/background image URL (used by split layout)

    FlowSubmitRequest:
      type: object
      required: [session_token, action]
      properties:
        session_token:
          type: string
        action:
          type: string
          description: |
            Which action to take. Either:
            - A key from the step's `actions` dictionary (e.g., "submit", "register", "back")
            - The reserved value "sso" — triggers SSO redirect (requires `sso_provider_id`)
        fields:
          type: object
          description: |
            User input values. Keys match field names from the step's `fields` dictionary.
          additionalProperties: true
          example:
            identifier: "alice@acme.com"
        gate_proofs:
          type: object
          description: |
            Solutions for security gates. Keys match gate names from the step's `gates` dictionary.
            The orchestrator collects these from `<zl-captcha>` / `<zl-passkey>` component events.
          additionalProperties:
            type: string
        sso_provider_id:
          type: string
          description: |
            ID of the selected SSO provider (from `sso_providers[].id`).
            Required when `action` is "sso".
          example: google-1

    FlowEventRequest:
      type: object
      required: [session_token, type]
      properties:
        session_token:
          type: string
        type:
          type: string
          enum: [fingerprint, telemetry]
        payload:
          type: object
          description: Event payload (fingerprint hash, timing data, etc.)
          additionalProperties: true

    # ── Flow definition schemas ─────────────────────────────────

    FlowDefinition:
      type: object
      required: [name, purposes, initial_steps, steps]
      properties:
        name:
          type: string
          example: Enterprise Login & Registration
        purposes:
          type: array
          items:
            type: string
            enum: [login, register, recovery, profiling, reauth, link_account]
        initial_steps:
          type: object
          description: |
            Map of purpose → step name. Defines the entry point for each purpose.
          additionalProperties:
            type: string
          example:
            login: identifier
            register: register_profile
        audience:
          $ref: "#/components/schemas/Audience"
        steps:
          type: array
          description: Ordered array of step definitions forming a directed graph.
          items:
            $ref: "#/components/schemas/StepDefinition"

    FlowDefinitionResponse:
      type: object
      properties:
        id:
          type: string
          example: flow_enterprise
        state:
          type: string
          enum: [draft, active, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      allOf:
        - $ref: "#/components/schemas/FlowDefinition"

    Audience:
      type: object
      properties:
        team_ids:
          type: array
          items:
            type: string
        app_ids:
          type: array
          items:
            type: string
        schema_ids:
          type: array
          items:
            type: string

    StepDefinition:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          description: Unique step name within this definition
          example: identifier
        type:
          type: string
          enum: [identifier, credential, form, verification, policy_check, consent, action, info, redirect, captcha, complete]
        texts:
          $ref: "#/components/schemas/StepTexts"
          description: |
            Localization keys for this step's title and description.
            Resolved client-side via the `| t` LiquidJS filter.
        fields:
          type: object
          description: |
            Fields this step collects from the user. Keyed by field name.
            Emitted as the `fields` capability dictionary at runtime.
          additionalProperties:
            $ref: "#/components/schemas/Field"
          default: {}
        actions:
          type: object
          description: |
            Actions available to the user on this step. Keyed by action name.
            Emitted as the `actions` capability dictionary at runtime.
          additionalProperties:
            $ref: "#/components/schemas/StepAction"
          default: {}
        gates:
          type: object
          description: |
            Security gates required on this step. Keyed by gate type.
            Emitted as the `gates` capability dictionary at runtime.
          additionalProperties:
            $ref: "#/components/schemas/Gate"
          default: {}
        sso_providers:
          type: array
          description: |
            SSO providers available on this step. Resolved at runtime from the
            organization's configured identity providers.
          items:
            $ref: "#/components/schemas/SSOProvider"
          default: []
        config:
          type: object
          description: Step-type-specific configuration (e.g., credential type, verification method)
          additionalProperties: true
        transitions:
          type: object
          description: |
            Map of transition name → target. Target is either a step name (string)
            for in-graph transitions, or a pivot object for cross-purpose navigation.
          additionalProperties:
            oneOf:
              - type: string
                description: Step name within this definition
              - type: object
                required: [pivot]
                properties:
                  pivot:
                    type: string
                    enum: [login, register, recovery, profiling, reauth, link_account]
                    description: Target purpose — flow engine resolves a new definition
          example:
            submit: check_user
            register: { pivot: register }
            recover: { pivot: recovery }

    ValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: object
            properties:
              step:
                type: string
              message:
                type: string

    SimulateRequest:
      type: object
      properties:
        purpose:
          type: string
        hint:
          $ref: "#/components/schemas/FlowHint"
        mock_user:
          type: object
          description: Mock user context for policy evaluation
        mock_factors:
          type: object
          description: Pre-existing factors to simulate step-up

    SimulateResponse:
      type: object
      properties:
        path:
          type: array
          items:
            type: string
          description: Ordered list of step names visited during simulation
        final_step:
          type: string
        policy_decisions:
          type: array
          items:
            type: object

    ResolveRequest:
      type: object
      required: [purpose]
      properties:
        purpose:
          type: string
        team_id:
          type: string
        app_id:
          type: string
        schema_id:
          type: string

    ListDefinitionsResponse:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: "#/components/schemas/FlowDefinitionResponse"
        total:
          type: integer

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object

  responses:
    NotFound:
      description: Session/flow not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    FlowCompleted:
      description: Flow has already completed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidProof:
      description: Proof verification failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Version conflict — session was advanced by another request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
