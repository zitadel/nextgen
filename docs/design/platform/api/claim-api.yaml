openapi: 3.1.0
info:
  title: Zitadel Claim API
  version: 2.0.0-draft
  description: |
    Anonymous project creation, claim lifecycle, and team
    domain-matching.

    Projects are created without authentication. The server generates a
    project identifier and returns two bearer secrets: a full `project_secret`
    (stored on the developer's laptop in `.zitadel/secret`) and a
    `preview_secret` (origin-scoped to patterns declared at creation time,
    handed to the deploy platform's env store by the setup CLI).

    Claim is the transaction that attaches a team and an accountable
    human to a project. It requires a human-authenticable method (GitHub
    OAuth, Google OAuth, or email magic link). Agents cannot claim on behalf
    of a human.

    Stubs in this spec are marked `TODO` where the team has not yet converged
    on field names, shapes, or semantics.

servers:
  - url: https://{region}.zitadel.cloud
    variables:
      region:
        default: global
        description: Regional endpoint — data residency follows region selection.

tags:
  - name: Projects
    description: Anonymous project creation and secret-authenticated retrieval
  - name: Claim
    description: The transaction that attaches ownership to a project
  - name: Teams
    description: Team domain-matching and public-email suppression

paths:

  # ── Anonymous project creation ─────────────────────────────────

  /projects:
    post:
      operationId: createProject
      summary: Create an unclaimed project
      description: |
        Anonymous endpoint. Rate-limited per source IP. The server generates
        a `project_id`, a full `project_secret` (`sk_proj_<base62>`), and an
        origin-scoped `preview_secret` (also `sk_proj_<base62>`, with metadata
        recording the origin patterns) bound to the `preview_origins`
        patterns the client declared.

        No user-facing URL is minted at creation. Issuers are the customer's
        own origins, declared per environment in `zitadel.json`.

        This endpoint is called by `npx @zitadel/setup` on first run.
        Clients SHOULD send an `Idempotency-Key` header when creating a
        project. Retries with the same key and the same request payload MUST
        return the original successful result instead of creating a duplicate
        project. Reusing an `Idempotency-Key` with a different request payload
        MUST be rejected.
      tags: [Projects]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Opaque client-generated token used to make anonymous project
            creation safe to retry. The same key with the same request body
            returns the original create result; the same key with a different
            request body is invalid.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created; both secrets returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProjectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      operationId: getProject
      summary: Get project state
      description: |
        Returns project lifecycle state, the customer-declared issuer
        origins per environment (as last uploaded by `npx zitadel push`),
        and the current config hash.
      tags: [Projects]
      security:
        - secretAuth: []
      responses:
        "200":
          description: Project state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Claim lifecycle ────────────────────────────────────────────

  /projects/{projectId}/claim/init:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      operationId: initClaim
      summary: Start a claim challenge
      description: |
        Initiates a claim for the specified project. Returns a URL the CLI
        opens in the browser and a short-lived challenge ID. The CLI then
        polls `GET /projects/{projectId}/claim/status?challenge_id=...`
        (authenticated with its existing pre-claim `sk_proj_` secret) until
        the browser-side flow completes; on success the status endpoint
        returns the rotated project secret. The rotated secret never touches
        the browser.
      tags: [Claim]
      security:
        - secretAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitClaimRequest"
      responses:
        "201":
          description: Claim challenge created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitClaimResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Project is already claimed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlreadyClaimedResponse"

  /projects/{projectId}/claim/complete:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      operationId: completeClaim
      summary: Complete the claim atomic transaction (browser-side)
      description: |
        Called by the browser-side claim page after the human has
        authenticated with GitHub, Google, or email magic link. Runs the
        atomic transaction: resolve or create the team, create a
        team_membership for the authenticated human, rotate the project secret,
        stash the rotated secret server-side keyed by `challenge_id`, and
        mark the challenge complete.

        Does not touch customer-declared issuer origins, users, factors,
        sessions, or uploaded configuration — all of which have been bound
        to `project_id` since creation.

        **This endpoint never returns the rotated project secret to the
        browser.** The CLI retrieves the rotated secret by polling
        `GET /projects/{projectId}/claim/status` with its existing
        `sk_proj_` bearer plus the `challenge_id`, which is the
        proof-of-possession that authorizes the retrieval.
      tags: [Claim]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteClaimRequest"
      responses:
        "200":
          description: Claim completed. Browser renders success / redirects to dashboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteClaimResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          description: |
            Challenge expired or already completed. The claim did not
            execute. Client should call `/projects/{projectId}/claim/init`
            again.

  /projects/{projectId}/claim/status:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      operationId: getClaimStatus
      summary: Poll the status of a claim challenge (CLI-side)
      description: |
        Called by the CLI in a polling loop after
        `/projects/{projectId}/claim/init`. Returns
        `pending` while the browser-side flow has not completed, and
        `completed` on the first poll after the atomic transaction — that
        response carries the rotated project secret, team id,
        claimed timestamp, and dashboard URL.

        **Authentication.** Requires the caller's current pre-claim `sk_proj_`
        bearer. The server rejects polls from any other secret. This is
        what makes CLI polling safe: only the process that initiated the
        challenge (and therefore already holds the pre-claim secret) can
        retrieve the rotated one.

        **Single-retrieval semantics.** Once the rotated secret has been
        returned, the stashed value is erased and subsequent polls for the
        same `challenge_id` return `410 Gone`. The CLI must persist the
        secret atomically on first receipt.

        **Expiry.** Challenges older than `expires_at` from
        `/projects/{projectId}/claim/init` return `410 Gone`. The pre-claim
        `sk_proj_` remains valid until the atomic transaction commits; if
        the challenge expires before completion, nothing has rotated.
      tags: [Claim]
      security:
        - secretAuth: []
      parameters:
        - name: challenge_id
          in: query
          required: true
          description: Challenge identifier returned by `/projects/{projectId}/claim/init`.
          schema:
            type: string
      responses:
        "200":
          description: Current status of the claim challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The bearer presented does not match the secret that initiated
            this challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: |
            Challenge expired, or the rotated secret has already been
            retrieved. The CLI must persist the secret on first successful
            poll; it cannot be fetched twice.

  # ── Team domain-matching ──────────────────────────────────────

  /teams/domain-match:
    get:
      operationId: matchTeamByDomain
      summary: Match an email to existing teams
      description: |
        Given a verified email address, returns candidate teams
        whose primary domain matches the email's domain. Public-email
        providers (Gmail, Yahoo, Outlook, Hotmail, iCloud, Me.com,
        ProtonMail, AOL, GMX, Live.com, MSN, etc.) are suppressed — the
        response flags them and does not return matches.

        Used by the claim completion flow to offer join-existing-team vs.
        create-new-team UX.

        TODO: decide whether this endpoint requires authentication (probably
        yes — the `challenge_id` or a short-lived token from
        `/projects/{projectId}/claim/init`),
        to prevent it from being used as a domain-enumeration oracle.
      tags: [Teams]
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
        - name: challenge_id
          in: query
          required: true
          description: Binds this lookup to an active claim challenge.
          schema:
            type: string
      responses:
        "200":
          description: Candidate teams (may be empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainMatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

components:

  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      description: Project identifier (e.g. `proj_01hexample`).
      schema:
        type: string
        example: proj_01hexample

  securitySchemes:
    secretAuth:
      type: http
      scheme: bearer
      description: |
        Server-issued bearer secret authenticating API calls. All project-scoped
        secrets share the `sk_proj_<base62>` prefix; variants are distinguished
        by server-side metadata (pre-claim, claimed, origin-scoped). The
        origin-scoped variant (historically the "preview secret") is enforced
        server-side against the request `Origin`. Neither is tied to any
        Zitadel-hosted URL — they authenticate API calls to the Zitadel backend.
        For the full credential taxonomy, see `../../api/credentials.md`.

  schemas:

    # ── Project creation ───────────────────────────────────────

    CreateProjectRequest:
      type: object
      properties:
        preview_origins:
          type: array
          description: |
            Origin patterns the preview secret will be scoped to. The
            setup CLI infers these from detected deploy tooling
            (`["*.vercel.app"]`, `["*.netlify.app"]`, etc.). The server
            validates against a supported-pattern list; unsupported
            patterns are rejected.
          items:
            type: string
            example: "*.vercel.app"
        slug_preference:
          type: string
          description: |
            Optional suggestion for the project slug. Ignored if unavailable
            or matches blocked strings. The slug is an identifier, not a URL —
            it appears in dashboard / claim / scratch-dashboard paths.
          example: "my-hackathon-project"
        client_metadata:
          type: object
          description: |
            Non-authenticated hints the SDK sends to help the server tune
            rate limits and abuse signals — framework, SDK version,
            approximate geographic region from IP.
          additionalProperties: true

    CreateProjectResponse:
      type: object
      required: [project_id, project_secret, preview_secret, preview_origins, created_at]
      properties:
        project_id:
          type: string
          description: |
            Project slug from curated dictionary pool. Not user-chosen.
            Stable for the lifetime of the project. Appears in dashboard /
            claim / scratch-dashboard paths — never as a user-facing origin
            in the default model.
          example: "proj_01hexample"
        project_secret:
          type: string
          description: |
            Full-access bearer secret. Stored in `.zitadel/secret` on the
            developer's laptop. Returned once — not retrievable afterwards.
          example: "sk_proj_7kR2pXq9vN3wLmYhT4cB8A"
        preview_secret:
          type: string
          description: |
            Origin-scoped bearer secret for preview deploys. Scoped to the
            `preview_origins` patterns. Uploaded to the deploy platform's
            env store by the setup CLI. Authenticates runtime API calls
            (sessions, users, flows) from matching preview origins; it
            cannot push configuration — see the capability matrix in
            [secret.md](../secret.md#capability-matrix). No automatic expiry
            in the MVP; rotatable from the dashboard post-claim.
          example: "sk_proj_c3f7a8b2vL4nYwH6..."
        preview_origins:
          type: array
          description: |
            Echo of the origin patterns the preview secret is scoped to
            (or server-supplied defaults if the request omitted the field).
          items:
            type: string
        created_at:
          type: string
          format: date-time
        scratch_dashboard_url:
          type: string
          format: uri
          description: |
            Anonymous scratch dashboard for inspecting unclaimed project
            state. Path on `zitadel.dev`, keyed by slug. Session-based,
            browser-local.
          example: "https://zitadel.dev/scratch/proj_01hexample"

    ProjectResponse:
      type: object
      required: [project_id, lifecycle]
      properties:
        project_id:
          type: string
        lifecycle:
          type: string
          enum: [unclaimed, claimed]
        declared_issuers:
          type: object
          description: |
            Customer-declared issuer origins per environment, as uploaded
            by `npx zitadel push`. Present only for environments the SDK
            has uploaded a config for. Each value can be a single origin
            (string), a list of origins (array), or a pattern object
            (`{ "pattern": "https://*.vercel.app" }`).
          additionalProperties: true
          example:
            development: "http://localhost:3000"
            preview:
              pattern: "https://*.vercel.app"
            production: ["https://acme.com", "https://app.acme.com"]
        preview_origins:
          type: array
          description: Origin patterns the preview secret is scoped to.
          items:
            type: string
        team_id:
          type: string
          description: Present only when `lifecycle == "claimed"`.
        created_at:
          type: string
          format: date-time
        claimed_at:
          type: string
          format: date-time
        config_hash:
          type: string
          description: Current active config hash. Used for drift detection.
        tier:
          type: string
          enum: [free, pro, enterprise]
          description: Present only when claimed.

    # ── Claim lifecycle ────────────────────────────────────────

    InitClaimRequest:
      type: object
      properties:
        suggested_team_name:
          type: string
          description: |
            Optional name suggestion for new team creation,
            derived from the Git remote URL or package.json. The human
            can override.
          example: "Acme"

    InitClaimResponse:
      type: object
      required: [claim_url, challenge_id, expires_at]
      properties:
        claim_url:
          type: string
          format: uri
          description: |
            URL to open in the browser. Renders the claim page with
            GitHub / Google / email options.
          example: "https://zitadel.cloud/claim/proj_01hexample/abc123def456"
        challenge_id:
          type: string
          description: Short-lived challenge identifier. Default TTL 10 minutes.
        expires_at:
          type: string
          format: date-time

    CompleteClaimRequest:
      type: object
      required: [challenge_id, verified_identity]
      properties:
        challenge_id:
          type: string
        verified_identity:
          type: object
          description: |
            Identity assertion from the authenticating IdP. TODO: define
            canonical shape — probably a JWT issued by the IdP proxy after
            OAuth completes, carrying email + email_verified + sub + iss.
          additionalProperties: true
        team_choice:
          type: object
          description: |
            The human's choice in the team-resolution UX.
          properties:
            action:
              type: string
              enum: [join_existing, create_new]
            team_id:
              type: string
              description: Required when action is `join_existing`.
            new_team_name:
              type: string
              description: Required when action is `create_new`.

    CompleteClaimResponse:
      type: object
      required: [project_id, team_id, claimed_at]
      description: |
        Browser-side response. Intentionally does not carry the rotated
        project secret — the CLI retrieves that from
        `GET /projects/{projectId}/claim/status` using its existing bearer
        plus the `challenge_id`. The browser just renders success and
        redirects to the dashboard.
      properties:
        project_id:
          type: string
        team_id:
          type: string
        claimed_at:
          type: string
          format: date-time
        dashboard_url:
          type: string
          format: uri
        tier:
          type: string
          enum: [free, pro, enterprise]
          description: Always `free` immediately post-claim.

    ClaimStatusResponse:
      type: object
      required: [status]
      description: |
        Response shape for CLI polling. While `status == "pending"`, only
        the `status` field is present. On the first poll after the atomic
        transaction commits, `status == "completed"` and all fields below
        are populated — the rotated secret is then erased server-side and
        subsequent polls return `410`.
      properties:
        status:
          type: string
          enum: [pending, completed]
        new_project_secret:
          type: string
          description: |
            Rotated project secret (`sk_proj_<base62>`). Replaces the pre-claim
            value in `.zitadel/secret`. The preview secret is untouched.
            Present only when `status == "completed"`.
          example: "sk_proj_9f2Hx8LqT4vRmYpN2wCbVa"
        team_id:
          type: string
          description: Present only when `status == "completed"`.
        claimed_at:
          type: string
          format: date-time
          description: Present only when `status == "completed"`.
        dashboard_url:
          type: string
          format: uri
          description: Present only when `status == "completed"`.
        tier:
          type: string
          enum: [free, pro, enterprise]
          description: Present only when `status == "completed"`. Always `free` immediately post-claim.

    AlreadyClaimedResponse:
      type: object
      required: [error, team_id, dashboard_url]
      properties:
        error:
          type: string
          enum: [already_claimed]
        message:
          type: string
        team_id:
          type: string
        dashboard_url:
          type: string
          format: uri

    # ── Teams ─────────────────────────────────────────────────

    DomainMatchResponse:
      type: object
      required: [domain, is_public_email, candidates]
      properties:
        domain:
          type: string
          example: "acme.com"
        is_public_email:
          type: boolean
          description: |
            True when the domain is on the public-email suppression list
            (Gmail, Yahoo, Outlook, etc.). When true, `candidates` is
            empty and the UX defaults to creating a personal workspace.
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/TeamCandidate"

    TeamCandidate:
      type: object
      required: [team_id, name]
      properties:
        team_id:
          type: string
        name:
          type: string
        member_count:
          type: integer
          description: |
            Rough size signal for disambiguation. TODO: decide whether
            exposing this is a data-leak risk for domain enumeration.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable error description.
        details:
          type: object
          additionalProperties: true

  responses:
    BadRequest:
      description: Request is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: |
        Anonymous project creation is rate-limited per source IP. The
        `Retry-After` header indicates when to try again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
