server:
  address: ":8080"
  # Optional. If unset, a nextgen-data directory next to the server binary is used.
  data_dir: ./nextgen-data
  # Optional. Master keys that wrap the key encryption key (KEK) of every
  # project, keyed by key ID. If unset, the server generates and reuses an RSA
  # master key under <data_dir>/master-keys. Exactly one key must be marked
  # use_for_encryption.
  # master_keys:
  #   master-key:
  #     use_for_encryption: true
  #     # Provide the RSA private key as a file (PEM incl. OpenSSH, or JWK) ...
  #     file: ./nextgen-data/master-keys/master-key.pem
  #     # ... or inline it instead:
  #     # private_key: |
  #     #   -----BEGIN PRIVATE KEY-----
  #     #   ...
  #     #   -----END PRIVATE KEY-----
  console_enabled: true
  console_path: /ui/console
  login_enabled: true
  login_path: /ui/login

# Optional. When omitted, the server uses SQLite at <data_dir>/zitadel.db.
# Configure exactly one dialect to override the default:
# database:
#   sqlite: ./nextgen-data/zitadel.db
#   # or:
#   # postgres: postgres://zitadel:zitadel@localhost:5432/nextgen?sslmode=disable
#   # or:
#   # spanner: projects/PROJECT/instances/INSTANCE/databases/DATABASE

password_hasher:
  # Algorithm used to hash new passwords/secrets. Defaults to argon2id
  # (RFC 9106). Existing hashes made with any of the verifiers below still
  # validate and are transparently rehashed to the hasher algorithm on the
  # next successful verification.
  hasher:
    algorithm: argon2id
    # RFC 9106 second recommended option.
    time: 3
    memory: 65536 # KiB (64 MiB)
    threads: 4
    # To keep bcrypt as the hashing algorithm instead:
    # algorithm: bcrypt
    # cost: 10
  verifiers:
    - argon2
    - bcrypt
    - scrypt
    - pbkdf2
    - sha2
    - md5
    - md5salted
    - phpass
    - drupal7

schema:
  lru_cache_size: 1000
  builtin_public_base: https://nextgen.com/api/schemas
