version: 2
project_name: nextgen

before:
  hooks:
    - sh -c 'if [ -f pnpm-workspace.yaml ]; then corepack pnpm install --frozen-lockfile; fi'
    - sh -c 'if [ -f apps/console/package.json ]; then corepack pnpm --filter ./apps/console build; fi'
    - go mod download

builds:
  - id: nextgen
    main: .
    binary: nextgen
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.CommitDate}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: nextgen
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md

dockers_v2:
  - id: nextgen
    ids: [nextgen]
    images:
      - 'ghcr.io/zitadel/nextgen'
    tags:
      - '{{ .Version }}'
      # Skip `latest` for snapshots so they don't clobber the published tag.
      - '{{ if not .IsSnapshot }}latest{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile
    labels:
      org.opencontainers.image.source: 'https://github.com/zitadel/nextgen'
      org.opencontainers.image.version: '{{ .Version }}'
      org.opencontainers.image.revision: '{{ .FullCommit }}'
      org.opencontainers.image.created: '{{ .Date }}'
      org.opencontainers.image.licenses: 'AGPL-3.0-only'

checksum:
  name_template: checksums.txt

snapshot:
  # Use `-` instead of `+` for the build-metadata separator: SemVer allows `+`
  # but Docker tags reject it ("invalid reference format").
  version_template: '{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}'

changelog:
  use: github

release:
  draft: true
