id: "workspace"
language: "javascript"
layer: "tool"
stack: "infrastructure"

tasks:
  doctor:
    command: "node scripts/doctor.mjs"
    options:
      cache: false
      runInCI: false

  cli:
    command: "node scripts/run-cli.mjs"
    options:
      cache: false
      interactive: true
      runInCI: false

  server:
    command: "node scripts/run-server.mjs"
    options:
      cache: false
      persistent: true
      runInCI: false

  server-debug:
    command: "node scripts/run-server-debug.mjs"
    options:
      cache: false
      persistent: true
      runInCI: false

  journey:
    command: "node scripts/run-journey.mjs"
    options:
      cache: false
      runInCI: false

  check:
    command: "node scripts/check.mjs"
    options:
      cache: false
      runInCI: false

  check-typecheck:
    script: "node --test scripts/check-typecheck-programs.test.mjs && node scripts/check-typecheck-programs.mjs"
    inputs:
      - "scripts/check-typecheck-programs.mjs"
      - "scripts/check-typecheck-programs.test.mjs"
      - "apps/*/moon.yml"
      - "packages/*/moon.yml"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - "apps/*/tsconfig*.json"
      - "packages/*/tsconfig*.json"
    options:
      cache: true
      runInCI: true

  check-adrs:
    command: "node scripts/check-adrs-index.mjs"
    inputs:
      - "docs/adrs/**/*.md"
      - "scripts/check-adrs-index.mjs"
      - "scripts/dev-process.mjs"
    options:
      cache: true
      runInCI: true
