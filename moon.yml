id: "workspace"
language: "javascript"
layer: "tool"
stack: "infrastructure"

tasks:
  doctor:
    command: "corepack pnpm run doctor"
    options:
      cache: false
      runInCI: false

  # cli, server, server-debug, journey and check start moon themselves, so
  # moon runs them with node directly: launched through `pnpm run`, the moon
  # they start would inherit pnpm's environment and every task under it would
  # warn about the platform-specific server packages.
  cli:
    command: "node scripts/run-cli.mjs"
    options:
      cache: false
      interactive: true
      runInCI: false

  server:
    command: "node scripts/run-server.mjs"
    options:
      cache: false
      persistent: true
      runInCI: false

  server-debug:
    command: "node scripts/run-server-debug.mjs"
    options:
      cache: false
      persistent: true
      runInCI: false

  journey:
    command: "node scripts/run-journey.mjs"
    options:
      cache: false
      runInCI: false

  # Starts a built image the way an operator would — no flags, no volumes, no
  # --user override — and asserts it serves. Covers the container contract that
  # unit tests cannot: the Dockerfile's data dir default against the non-root
  # USER it declares. Needs a local Docker daemon and an image built by
  # `node scripts/build-local-runtime-image.mjs`, so it stays out of CI.
  smoke-container:
    command: "corepack pnpm run smoke-container"
    options:
      cache: false
      runInCI: false

  check:
    command: "node scripts/check.mjs"
    options:
      cache: false
      runInCI: false

  # Matched by the `:test` target in the ci workflow's `moon ci` call, so the
  # affected-gate and release-body logic never become test files nothing
  # executes.
  test:
    command: "corepack pnpm run test"
    inputs:
      - "scripts/ci-mode.mjs"
      - "scripts/ci-mode.test.mjs"
      - "scripts/dev-process.mjs"
      - "scripts/generate-meta-schemas.ts"
      - "scripts/generate-meta-schemas.test.ts"
      - "scripts/release-artifacts.mjs"
      - "scripts/release-github.mjs"
      - "scripts/release-github.test.mjs"
      - "scripts/release-manifest.mjs"
      - "scripts/check-package-scripts.mjs"
      - "scripts/check-package-scripts.test.mjs"
      # The package-script contract test reads every package's scripts and
      # moon tasks.
      - "apps/*/package.json"
      - "apps/*/moon.yml"
      - "packages/*/package.json"
      - "packages/*/moon.yml"
      # The task delegates to the package `test` script and its file-existence
      # guard, so both are behavioral inputs.
      - "package.json"
      - "scripts/assert-file.mjs"
      # Shared Vitest config these tests run under (root project is not covered
      # by the TypeScript implicitInputs).
      - "vitest.config.ts"
      - "vitest.shared.mjs"
      - "vitest.shared.d.mts"
    options:
      cache: true
      runInCI: true

  check-typecheck:
    # assert-file guards against a silent pass: Vitest treats a positional filter
    # that matches nothing as success (passWithNoTests), so a renamed/moved test
    # file would stop running unnoticed. node:test used to error on a missing
    # file; this restores that fail-loud behavior, cross-platform (POSIX `test`
    # is unavailable on Windows shells).
    command: "corepack pnpm run check-typecheck"
    inputs:
      - "package.json"
      - "scripts/check-typecheck-programs.mjs"
      - "scripts/check-typecheck-programs.test.mjs"
      - "scripts/assert-file.mjs"
      - "apps/*/moon.yml"
      - "packages/*/moon.yml"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - "apps/*/tsconfig*.json"
      - "packages/*/tsconfig*.json"
      - "vitest.config.ts"
      - "vitest.shared.mjs"
      - "vitest.shared.d.mts"
    options:
      cache: true
      runInCI: true

  # The wire-casing rules are config, so a wrong subject type or regex breaks
  # nothing loudly — the spec just stops being checked. These fixtures fail
  # instead.
  check-openapi-rules:
    # assert-file guards against a silent pass: Vitest treats a positional filter
    # that matches nothing as success (passWithNoTests), so a renamed/moved test
    # file would stop running unnoticed. node:test used to error on a missing
    # file; this restores that fail-loud behavior, cross-platform (POSIX `test`
    # is unavailable on Windows shells).
    command: "corepack pnpm run check-openapi-rules"
    inputs:
      - "package.json"
      - "scripts/openapi-casing-rules.test.mjs"
      - "scripts/assert-file.mjs"
      - "scripts/testdata/openapi-casing/**"
      - "/redocly.yaml"
      # The test reads the pinned redocly version from this file.
      - "apps/server/moon.yml"
      - "vitest.config.ts"
      - "vitest.shared.mjs"
      - "vitest.shared.d.mts"
    options:
      cache: true
      runInCI: true

  check-adrs:
    command: "corepack pnpm run check-adrs"
    inputs:
      - "package.json"
      - "docs/adrs/**/*.md"
      - "scripts/check-adrs-index.mjs"
      - "scripts/dev-process.mjs"
    options:
      cache: true
      runInCI: true
