id: "workspace"
language: "javascript"
layer: "tool"
stack: "infrastructure"

tasks:
  doctor:
    command: "node scripts/doctor.mjs"
    options:
      cache: false
      runInCI: false

  cli:
    command: "node scripts/run-cli.mjs"
    options:
      cache: false
      interactive: true
      runInCI: false

  server:
    command: "node scripts/run-server.mjs"
    options:
      cache: false
      persistent: true
      runInCI: false

  server-debug:
    command: "node scripts/run-server-debug.mjs"
    options:
      cache: false
      persistent: true
      runInCI: false

  # The hosted cloud on localhost: `vercel dev -L` over vercel.json's
  # services, on a throwaway master key and SQLite (scripts/run-cloud.mjs).
  cloud:
    command: "node scripts/run-cloud.mjs"
    options:
      cache: false
      persistent: true
      runInCI: false

  # Deprecated alias for `e2e:journey` (the journey moved into the e2e project).
  # Hands over to it, passing any runner flags straight through.
  journey:
    description: "Deprecated: use `moon run e2e:journey`."
    command: "corepack"
    args:
      - "pnpm"
      - "exec"
      - "moon"
      - "run"
      - "e2e:journey"
      - "--"
    options:
      cache: false
      runInCI: false

  # The local runtime image (ghcr.io/zitadel/nextgen:local-dev): the server
  # cross-compiled for linux, with the console's dist embedded, in the release
  # Dockerfile. Needs Docker, so it stays out of CI.
  build-local-image:
    command: "node scripts/build-local-runtime-image.mjs"
    deps:
      - "console:build"
    options:
      cache: false
      runInCI: false

  # Starts the image build-local-image produced the way an operator would — no
  # flags, no volumes, no --user override — and asserts it serves. Covers the
  # container contract that unit tests cannot: the Dockerfile's data dir
  # default against the non-root USER it declares. Needs a local Docker daemon,
  # so it stays out of CI.
  smoke-container:
    command: "node scripts/smoke-container.mjs"
    deps:
      - "build-local-image"
    options:
      cache: false
      runInCI: false

  check:
    command: "node scripts/check.mjs"
    options:
      cache: false
      runInCI: false

  # Matched by the `:test` target in the ci workflow's `moon ci` call, so the
  # affected-gate and release-body logic never become test files nothing
  # executes.
  test:
    command: "corepack pnpm run test:all"
    # render-builtin-schemas.test.mjs imports packages/config/src/defaults.ts,
    # which checks the default schema against the generated API schemas.
    deps:
      - "api:generate"
    inputs:
      - "scripts/ci-mode.mjs"
      - "scripts/ci-mode.test.mjs"
      - "scripts/go-generate.mjs"
      - "scripts/go-generate.test.mjs"
      - "scripts/task-graph.test.mjs"
      # The regression fixture reads both runners' real graphs and CI gates.
      - "moon.yml"
      - "turbo.json"
      - "apps/*/moon.yml"
      - "apps/*/turbo.json"
      - "apps/*/package.json"
      - "packages/*/moon.yml"
      - "packages/*/turbo.json"
      - "packages/*/package.json"
      - "tools/*/moon.yml"
      - "tools/*/turbo.json"
      - "tools/*/package.json"
      - "e2e/moon.yml"
      - "e2e/turbo.json"
      - "e2e/package.json"
      - ".moon/**/*.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/ci-turbo.yml"
      - ".gitignore"
      - "scripts/server-build.mjs"
      - "scripts/dev-process.mjs"
      - "scripts/dev-process.test.mjs"
      - "scripts/shims/pnpm"
      - "scripts/generate-meta-schemas.ts"
      - "scripts/generate-meta-schemas.test.ts"
      - "scripts/release-artifacts.mjs"
      - "scripts/release-github.mjs"
      - "scripts/release-github.test.mjs"
      - "scripts/release-manifest.mjs"
      - "scripts/render-builtin-schemas.mjs"
      - "scripts/render-builtin-schemas.test.mjs"
      # Read by that test: it renders every built-in schema.
      - "api/openapi/endpoints/schemas/*.json"
      # The server's default schema namespace, which the renderer must match,
      # and the defaults it reads it from.
      - "packages/config/src/defaults.ts"
      - "packages/config/defaults/**/*"
      # The task delegates to the package `test` script and its file-existence
      # guard, so both are behavioral inputs.
      - "package.json"
      - "scripts/assert-file.mjs"
      # Shared Vitest config these tests run under (root project is not covered
      # by the TypeScript implicitInputs).
      - "vitest.config.ts"
      - "packages/vitest-config/vitest.shared.mjs"
      - "packages/vitest-config/vitest.shared.d.mts"
    options:
      cache: true
      runInCI: true

  check-typecheck:
    # assert-file guards against a silent pass: Vitest treats a positional filter
    # that matches nothing as success (passWithNoTests), so a renamed/moved test
    # file would stop running unnoticed. node:test used to error on a missing
    # file; this restores that fail-loud behavior, cross-platform (POSIX `test`
    # is unavailable on Windows shells).
    script: "node scripts/assert-file.mjs scripts/check-typecheck-programs.test.mjs && corepack pnpm exec vitest run scripts/check-typecheck-programs.test.mjs && node scripts/check-typecheck-programs.mjs"
    inputs:
      - "scripts/check-typecheck-programs.mjs"
      - "scripts/check-typecheck-programs.test.mjs"
      - "scripts/assert-file.mjs"
      - "apps/*/moon.yml"
      - "packages/*/moon.yml"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - "apps/*/tsconfig*.json"
      - "packages/*/tsconfig*.json"
      - "e2e/moon.yml"
      - "e2e/package.json"
      - "e2e/tsconfig*.json"
      - "vitest.config.ts"
      - "packages/vitest-config/vitest.shared.mjs"
      - "packages/vitest-config/vitest.shared.d.mts"
    options:
      cache: true
      runInCI: true

  # The wire-casing rules are config, so a wrong subject type or regex breaks
  # nothing loudly — the spec just stops being checked. These fixtures fail
  # instead.
  check-openapi-rules:
    # assert-file guards against a silent pass: Vitest treats a positional filter
    # that matches nothing as success (passWithNoTests), so a renamed/moved test
    # file would stop running unnoticed. node:test used to error on a missing
    # file; this restores that fail-loud behavior, cross-platform (POSIX `test`
    # is unavailable on Windows shells).
    script: "node scripts/assert-file.mjs scripts/openapi-casing-rules.test.mjs && corepack pnpm exec vitest run scripts/openapi-casing-rules.test.mjs"
    inputs:
      - "scripts/openapi-casing-rules.test.mjs"
      - "scripts/assert-file.mjs"
      - "scripts/testdata/openapi-casing/**"
      - "/redocly.yaml"
      - "/.redocly.lint-ignore.yaml"
      - "vitest.config.ts"
      - "packages/vitest-config/vitest.shared.mjs"
      - "packages/vitest-config/vitest.shared.d.mts"
    options:
      cache: true
      runInCI: true

  # The moon graph rules in .moon/AGENTS.md: no transitive duplicate deps, and
  # cross-project deps match each package.json.
  check-moon-graph:
    command: "node scripts/check-moon-graph.mjs"
    inputs:
      - "scripts/check-moon-graph.mjs"
      - "moon.yml"
      - "apps/*/moon.yml"
      - "packages/*/moon.yml"
      - "tools/*/moon.yml"
      - "e2e/moon.yml"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - "e2e/package.json"
    options:
      cache: true
      runInCI: true

  check-adrs:
    command: "node scripts/check-adrs-index.mjs"
    inputs:
      - "docs/adrs/**/*.md"
      - "scripts/check-adrs-index.mjs"
      - "scripts/dev-process.mjs"
    options:
      cache: true
      runInCI: true
