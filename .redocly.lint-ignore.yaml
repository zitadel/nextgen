# EDIT BY HAND. Never run `--generate-ignore-file`, which redocly suggests on
# every failure: it suppresses whatever is failing instead of fixing it and
# deletes these notes.
# Each entry pins one JSON pointer, so the new camelCase in the same file is still an error.
apps/api/api/openapi/endpoints/schemas/user-schema.yaml:
  rule/wire-field-snake-case:
    # Stored user-schema document fields, not envelope fields; renaming them is
    # a data-format migration.
    - '#/properties/objectType'
    - '#/properties/metaSchema'
apps/api/api/openapi/endpoints/schemas/sso-auth-method.yaml:
  no-required-schema-properties-undefined:
    # `providers` is defined at the schema root; the if/then/else arms only
    # require or forbid it depending on `enabled`, which is what gives editors
    # a precise error instead of an "all arms failed" oneOf.
    - '#/then/required/0'
    - '#/else/not/required/0'
apps/api/api/openapi/endpoints/auth_attempts/by_id/challenges/issue-challenge-request.yaml:
  no-required-schema-properties-undefined:
    # `passkey_options` is defined at the schema root; the then arm only
    # requires it when `method` is `passkey`.
    - '#/then/required/0'
apps/api/api/openapi/endpoints/auth_attempts/create-auth-attempt-request.yaml:
  no-required-schema-properties-undefined:
    # `session_token` is defined at the schema root; the then arm only requires
    # it when a `session_id` is sent.
    - '#/then/required/0'
apps/api/api/openapi/endpoints/idps/idp-connection.yaml:
  no-required-schema-properties-undefined:
    # `oidc` is defined at the schema root; the then arm only requires it when
    # `protocol` is `oidc`.
    - '#/then/required/0'
apps/api/api/openapi/endpoints/grants/create-grant-request.yaml:
  no-required-schema-properties-undefined:
    # `user` and `team` are defined at the schema root; the if/then/else arms
    # say that exactly one of them is sent, which ogen cannot read from a
    # `oneOf` of bare `required` lists.
    - '#/if/required/0'
    - '#/then/not/required/0'
    - '#/else/required/0'
apps/api/api/openapi/endpoints/grants/user-locator.yaml:
  no-required-schema-properties-undefined:
    # Exactly one of `user_id` and `identifier`, as in `create-grant-request.yaml`.
    - '#/if/required/0'
    - '#/then/not/required/0'
    - '#/else/required/0'
apps/api/api/openapi/endpoints/grants/team-locator.yaml:
  no-required-schema-properties-undefined:
    # Exactly one of `team_id` and `name`, as in `create-grant-request.yaml`.
    - '#/if/required/0'
    - '#/then/not/required/0'
    - '#/else/required/0'
apps/api/api/openapi/endpoints/deployments/create-deployment-request.yaml:
  no-required-schema-properties-undefined:
    # Exactly one of `release_id` and `content_hash`, as in `create-grant-request.yaml`.
    - '#/if/required/0'
    - '#/then/not/required/0'
    - '#/else/required/0'
apps/api/api/openapi/openapi-spec.yaml:
  no-ambiguous-paths:
    # Redocly compares templates and does not know the id format. Exactly one
    # request fits both `/idps/{id}/revisions` and
    # `/idps/revisions/{revision_id}`: `/idps/revisions/revisions`, with `{id}`
    # set to the literal `revisions`. No minted connection id is that literal,
    # because ids carry the `idp_` prefix, and the generated router matches the
    # literal before `{id}`, so such a request is a 404 on the revision read.
    # ADR 063 gives every revisioned kind this pair.
    - '#/paths/~1idps~1revisions~1{revision_id}'
    # The same for policies, whose ids carry the `pol_` prefix.
    - '#/paths/~1policies~1revisions~1{revision_id}'
apps/api/api/openapi/components/flows/flow-definition-step.yaml:
  no-required-schema-properties-undefined:
    # Every name is a step property defined at the schema root; each arm of the
    # rejection `not` only tests whether it is present, which is how the dialect
    # states the step shapes the engine cannot run without breaking codegen.
    - '#/not/anyOf/0/anyOf/0/not/required/0'
    - '#/not/anyOf/0/anyOf/1/properties/transitions/not/required/0'
    - '#/not/anyOf/1/required/0'
    - '#/not/anyOf/2/not/required/0'
    - '#/not/anyOf/2/properties/transitions/not/required/0'
