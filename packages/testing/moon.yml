id: "testing"
language: "typescript"
# Tool, not library: the layer must sit between the e2e suites (automation)
# that consume this package and the CLI (tool) it drives — automation may not
# depend on automation, and library may not depend on tool.
layer: "tool"
stack: "frontend"
dependsOn:
  - "api"
  - "config"
  - "cli"

tasks:
  typecheck:
    deps:
      - "config:build"

  build:
    deps:
      - "config:build"

  build-release:
    script: |
      node ../../scripts/release-clean.mjs local-dist
      corepack pnpm run build
    deps:
      - "config:build-release"
    outputs:
      - "dist/**/*"
    options:
      cache: false
      # Release builds remove stale package output and rebuild dist inside one
      # task. They stay out of `moon ci`; release:build-public-packages invokes
      # them in the release step instead of the normal build/test graph. The
      # deps read api/config release dist (tsdown bundles both into the CJS
      # entries), and nothing in the release graph reads this package's dist,
      # so task ordering alone is enough — no shared mutex needed here.
      runInCI: false

  test:
    deps:
      - "build"

  # Boots a real local server (binary runtime + SQLite by default). Not cached
  # (it spawns OS processes). Runs in CI as a dependency of `e2e:all` — the
  # kit's own real-instance suite, alongside the e2e app lanes — and so, like
  # them, is `runInCI: "skip"`: CI's e2e step runs it, not the build-and-test
  # graph. The command unsets CI / GITHUB_ACTIONS to behave as a local run
  # (the old workflow used `env -u CI`); a task `env` entry would not override
  # the runner's values.
  test-integration:
    command: "env -u CI -u GITHUB_ACTIONS corepack pnpm run test:integration"
    inputs:
      - "**/*"
      - "/packages/vitest-config/vitest.shared.mjs"
      - "/packages/vitest-config/vitest.shared.d.mts"
    deps:
      - "build"
      - "cli:build"
      - "server:build"
    env:
      ZITADEL_SERVER_BINARY: "$workspaceRoot/dist/server/nextgen"
      # server:build embeds the console via its task deps; keep it off anyway —
      # these tests drive the API and app-embedded login, not /ui/console.
      NEXTGEN_SERVER_CONSOLE_ENABLED: "false"
    options:
      cache: false
      runInCI: "skip"
