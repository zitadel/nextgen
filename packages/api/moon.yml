id: "api"
language: "typescript"
layer: "library"
stack: "frontend"

tasks:
  generate:
    command: "corepack pnpm run generate"
    inputs:
      - "/api/openapi/**/*.yaml"
      - "orval.config.ts"
      - "src/runtime/**/*.ts"
    outputs:
      - "src/generated/**/*"

  lint:
    command: "corepack pnpm exec oxlint ."
    deps:
      - "generate"

  typecheck:
    command: "corepack pnpm exec tsc --noEmit -p tsconfig.json"
    deps:
      - "generate"

  build:
    command: "corepack pnpm run build"
    deps:
      - "generate"
    outputs:
      - "dist/**/*"

  clean-dist:
    command: "node ../../scripts/release-clean.mjs local-dist"
    deps:
      - "build"
    options:
      cache: false
      mutex: "public-dist"
      runInCI: false

  build-release:
    command: "corepack pnpm run build"
    deps:
      - "clean-dist"
      - "generate"
    outputs:
      - "dist/**/*"
    options:
      cache: false
      # The release preclean is package-local and explicitly upstream of the
      # release build. Do not rely on parent runDepsInParallel ordering; only
      # task deps keep dist cleanup from racing builds that read or rewrite it.
      runInCI: false
      # cli:test drives the built oclif CLI, whose commands import this
      # package's dist at runtime. The shared mutex keeps this release build
      # (whose clean step rewrites dist/) from running while those tests are
      # importing it; a task dep on cli:test would cycle the project graph.
      mutex: "public-dist"

  test:
    command: "corepack pnpm exec vitest run --passWithNoTests"
    deps:
      - "generate"
