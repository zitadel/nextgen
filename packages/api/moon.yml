id: "api"
language: "typescript"
layer: "library"
stack: "frontend"

tasks:
  generate:
    command: "corepack pnpm run generate"
    inputs:
      - "**/*"
      - "/apps/api/api/openapi/**/*.yaml"
    outputs:
      - "src/generated/**/*"
    options:
      # The spec references *-error-response.yaml files that server:generate
      # and its checks rewrite or prune; see the mutex note on server:generate.
      mutex: "generated-sources"

  typecheck:
    deps:
      - "generate"

  build:
    deps:
      - "generate"

  build-release:
    script: |
      node ../../scripts/release-clean.mjs local-dist
      corepack pnpm run build
    deps:
      - "generate"
    outputs:
      - "dist/**/*"
    options:
      cache: false
      # Release builds stay out of `moon ci`: the release entry points run
      # them in the release workspace (scripts/release-workspace.mjs).
      runInCI: false

  test:
    deps:
      - "generate"
