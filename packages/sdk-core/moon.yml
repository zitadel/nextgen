id: "sdk-core"
language: "typescript"
layer: "library"
stack: "frontend"
dependsOn:
  - "api"
  - "components"

tasks:
  typecheck:
    deps:
      # contract.spec.ts imports @zitadel/components/events from its dist.
      - "components:build"

  build:
    deps:
      - "api:build"

  build-release:
    script: |
      node ../../scripts/release-clean.mjs local-dist
      corepack pnpm run build
    deps:
      - "api:build-release"
    outputs:
      - "dist/**/*"
    options:
      cache: false
      # Release builds remove stale package output and rebuild dist in one
      # task. They stay out of `moon ci`; release:snapshot invokes them in
      # the later release step instead of the normal build/test graph.
      runInCI: false

  test:
    deps:
      # contract.spec.ts imports @zitadel/components/events from its dist.
      - "components:build"
    inputs:
      - "**/*"
      # contract.spec.ts reads these SDK specs to check their copied
      # SERVER_RENDER_CASES tables and standard-attribute test titles and bodies for drift.
      - "/packages/sdk-react/src/index.spec.tsx"
      - "/packages/sdk-vue/src/components.spec.ts"
      - "/packages/sdk-angular/src/lib/components.spec.ts"
      - "/packages/sdk-svelte/src/index.spec.ts"
      - "/packages/sdk-svelte/src/index.ssr.spec.ts"
      - "/packages/sdk-solid/src/index.spec.tsx"
      - "/packages/sdk-solid/src/index.ssr.spec.tsx"
      - "/packages/sdk-qwik/src/index.spec.tsx"
      - "/packages/sdk-qwik/src/index.ssr.spec.tsx"
      # The client SDK entries, their edge specs and the configs that declare the edge project.
      - "/packages/sdk-react/src/index.tsx"
      - "/packages/sdk-vue/src/index.ts"
      - "/packages/sdk-angular/src/public-api.ts"
      - "/packages/sdk-svelte/src/lib/index.ts"
      - "/packages/sdk-solid/src/index.tsx"
      - "/packages/sdk-qwik/src/index.tsx"
      - "/packages/sdk-next/src/client.ts"
      - "/packages/sdk-nuxt/src/index.ts"
      - "/packages/sdk-tanstack-start/src/react.tsx"
      - "/packages/sdk-*/src/*.edge.spec.{ts,tsx}"
      - "/packages/*/vitest.config.ts"
      # And the meta-framework SDKs' server tests, to check they share their titles.
      - "/packages/sdk-*/src/__tests__/*.test.ts"
      - "/packages/sdk-*/src/__tests__/*/*.test.ts"
      # It also reads every SDK's manifest and docs, and the demo apps' manifests
      # and sources, to check that apps go through their SDK.
      - "/packages/sdk-*/package.json"
      - "/packages/sdk-*/README.md"
      - "/packages/sdk-*/skills/**/SKILL.md"
      - "/apps/demo-*/package.json"
      - "/apps/demo-*/**/*.{ts,tsx,js,jsx,mjs,cjs,mts,cts,vue,svelte,astro}"
      - "!/apps/demo-*/**/node_modules/**/*"
