id: "sdk-core"
language: "typescript"
layer: "library"
stack: "frontend"
dependsOn:
  - "api"

tasks:
  lint:
    command: "corepack pnpm run lint"

  typecheck:
    command: "corepack pnpm run typecheck"
    deps:
      - "api:build"

  build:
    command: "corepack pnpm run build"
    deps:
      - "api:build"
    outputs:
      - "dist/**/*"

  test:
    command: "corepack pnpm run test"

