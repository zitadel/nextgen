id: "sdk-nuxt"
language: "typescript"
layer: "library"
stack: "frontend"
dependsOn:
  - "api"
  - "components"
  - "sdk-core"

tasks:
  typecheck:
    deps:
      - "api:build"
      - "components:build"
      - "sdk-core:build"

  build:
    deps:
      - "api:build"
      - "components:build"
      - "sdk-core:build"
    options:
      mutex: "sdk-nuxt-dist"

  build-release:
    script: |
      node ../../scripts/release-clean.mjs local-dist
      corepack pnpm run build
    deps:
      - "api:build-release"
      - "components:build-release"
      - "sdk-core:build-release"
    outputs:
      - "dist/**/*"
    options:
      cache: false
      # Release builds remove stale package output and rebuild dist inside one
      # mutex-held task. They stay out of `moon ci`; release:snapshot invokes
      # them in the later release step instead of the normal build/test graph.
      runInCI: false
      # build-release rewrites the same dist/ that demo-nuxt:build resolves
      # modules from; the mutex keeps the two from overlapping in the full
      # CI graph.
      mutex: "sdk-nuxt-dist"

  test:
    deps:
      - "build"

  dev:
    command: "corepack pnpm run dev"
    options:
      persistent: true
      runInCI: false
