id: "sdk-nuxt"
language: "typescript"
layer: "library"
stack: "frontend"
dependsOn:
  - "api"
  - "components"
  - "sdk-core"

tasks:
  lint:
    command: "corepack pnpm run lint"
    deps:
      - "api:build"
      - "components:build"
      - "sdk-core:build"

  typecheck:
    command: "corepack pnpm run typecheck"
    deps:
      - "api:build"
      - "components:build"
      - "sdk-core:build"

  build:
    command: "corepack pnpm run build"
    deps:
      - "api:build"
      - "components:build"
      - "sdk-core:build"
    outputs:
      - "dist/**/*"
    options:
      mutex: "sdk-nuxt-dist"

  build-release:
    command: "corepack pnpm run build"
    deps:
      - "api:build-release"
      - "components:build-release"
      - "sdk-core:build-release"
    outputs:
      - "dist/**/*"
    options:
      cache: false
      # build-release cleans the same dist/ that demo-nuxt:build resolves
      # modules from; the mutex keeps the two from overlapping in the full
      # CI graph.
      mutex: "sdk-nuxt-dist"

  test:
    command: "corepack pnpm run test"
    deps:
      - "build"

  dev:
    command: "corepack pnpm run dev"
    options:
      persistent: true
      runInCI: false
