id: "shared-component-styles"
language: "typescript"
layer: "library"
stack: "frontend"

tasks:
  lint:
    command: "corepack pnpm exec oxlint ."

  typecheck:
    command: "corepack pnpm exec tsc --build tsconfig.json"

  build:
    command: "corepack pnpm run build"
    outputs:
      - "dist/**/*"

