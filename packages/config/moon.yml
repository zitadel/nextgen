id: "config"
language: "typescript"
layer: "library"
stack: "frontend"
dependsOn:
  - "api"

tasks:
  lint:
    command: "corepack pnpm run lint"
    deps:
      - "api:build"

  typecheck:
    command: "corepack pnpm run typecheck"
    deps:
      - "api:build"

  build:
    command: "corepack pnpm run build"
    deps:
      - "api:build"
    outputs:
      - "dist/**/*"

  build-release:
    command: "corepack pnpm run build"
    deps:
      - "api:build-release"
    outputs:
      - "dist/**/*"
    options:
      cache: false

  test:
    command: "corepack pnpm run test"
    deps:
      - "build"
