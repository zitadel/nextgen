id: "ui-react"
language: "typescript"
layer: "library"
stack: "frontend"
dependsOn:
  - "design-tokens"
  - "shared-component-styles"

tasks:
  lint:
    command: "corepack pnpm exec oxlint ."
    deps:
      - "design-tokens:build"
      - "shared-component-styles:build"

  typecheck:
    command: "corepack pnpm exec tsc --build tsconfig.json"
    deps:
      - "design-tokens:build"
      - "shared-component-styles:build"

  build:
    command: "corepack pnpm run build"
    deps:
      - "design-tokens:build"
      - "shared-component-styles:build"
    outputs:
      - "dist/**/*"
