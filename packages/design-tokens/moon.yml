id: "design-tokens"
language: "typescript"
layer: "library"
stack: "frontend"

tasks:
  sync:
    command: "pnpm run sync"
    options:
      runInCI: false

  sync-export:
    command: "pnpm run sync:export"

  generate:
    command: "pnpm run generate"
    outputs:
      - "src/generated/tokens.css"
      - "src/generated/tokens.ts"
      - "src/generated/tailwind.css"
      - "src/generated/shadcn.css"

  lint:
    command: "pnpm exec oxlint ."
    deps:
      - "generate"

  typecheck:
    command: "pnpm exec tsc --build tsconfig.json"
    deps:
      - "generate"

  build:
    command: "pnpm run build"
    deps:
      - "generate"
    outputs:
      - "dist/**/*"

  test:
    command: "pnpm run test:all"
    deps:
      - "generate"

