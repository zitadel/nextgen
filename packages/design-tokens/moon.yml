id: "design-tokens"
language: "typescript"
layer: "library"
stack: "frontend"

tasks:
  # Pulls the live tokens from the Figma API. Nothing in the repo says when
  # they changed, so a cache hit would skip the fetch and report success.
  sync:
    command: "corepack pnpm run sync"
    options:
      cache: false
      runInCI: false

  sync-export:
    command: "corepack pnpm run sync-export"

  generate:
    command: "corepack pnpm run generate"
    outputs:
      - "src/generated/tokens.css"
      - "src/generated/tokens.ts"
      - "src/generated/tailwind.css"
      - "src/generated/shadcn.css"

  typecheck:
    deps:
      - "generate"

  build:
    deps:
      - "generate"

  test:
    deps:
      - "generate"
