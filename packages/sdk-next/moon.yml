id: "sdk-next"
language: "typescript"
layer: "library"
stack: "frontend"
dependsOn:
  - "api"
  - "components"
  - "sdk-core"
  - "sdk-react"

tasks:
  typecheck:
    deps:
      # the edge tests import this package's built dist.
      - "build"

  build:
    deps:
      - "sdk-react:build"

  build-release:
    script: |
      node ../../scripts/release-clean.mjs local-dist
      corepack pnpm run build
    deps:
      - "sdk-react:build-release"
    outputs:
      - "dist/**/*"
    options:
      cache: false
      # Release builds stay out of `moon ci`: the release entry points run
      # them in the release workspace (scripts/release-workspace.mjs).
      runInCI: false

  test:
    deps:
      - "build"
