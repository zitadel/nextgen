id: "sdk-solid-start"
language: "typescript"
layer: "library"
stack: "frontend"
dependsOn:
  - "api"
  - "sdk-core"

tasks:
  lint:
    command: "corepack pnpm run lint"
    deps:
      - "api:build"
      - "sdk-core:build"

  typecheck:
    command: "corepack pnpm run typecheck"
    deps:
      - "api:build"
      - "sdk-core:build"

  build:
    command: "corepack pnpm run build"
    deps:
      - "api:build"
      - "sdk-core:build"
    outputs:
      - "dist/**/*"

  test:
    command: "corepack pnpm run test"
    deps:
      - "build"

  dev:
    command: "corepack pnpm run dev"
    options:
      persistent: true
      runInCI: false
