id: "sdk-qwik"
language: "typescript"
layer: "library"
stack: "frontend"
dependsOn:
  - "api"
  - "api-mock"
  - "components"
  - "sdk-core"

tasks:
  typecheck:
    deps:
      # The edge spec imports this package's built dist.
      - "api-mock:build"
      - "build"

  build:
    deps:
      - "components:build"
      - "sdk-core:build"

  build-release:
    script: |
      node ../../scripts/release-clean.mjs local-dist
      corepack pnpm run build
    deps:
      - "components:build-release"
      - "sdk-core:build-release"
    outputs:
      - "dist/**/*"
    options:
      cache: false
      # Release builds remove stale package output and rebuild dist in one
      # task. They stay out of `moon ci`; release:snapshot invokes them in
      # the later release step instead of the normal build/test graph.
      runInCI: false

  # Chromium for the browser-mode test suite. Self-contained (like components):
  # the `test` task depends on it so `moon ci :test` provisions it in CI.
  install-browsers:
    command: "corepack pnpm exec playwright install chromium"
    options:
      cache: false

  # Runs the Vitest suite in real Chromium (see vitest.config.ts): Qwik 2's
  # client render and the wrapped Lit web components need a real DOM. The
  # browser project pays a Chromium cold start, which this lane covers in CI.
  test:
    deps:
      # api-mock serves the Flow API to the specs (test-setup.ts).
      - "api-mock:build"
      - "install-browsers"
      - "build"
    options:
      # Retry a failed browser suite in CI, as a safety net. It was added for
      # "Failed to fetch dynamically imported module": Chromium aborting module
      # imports when a container changes the host's addresses, which ci.yml's
      # "Keep Docker's interface churn away from Chromium" step prevents. (#1490)
      retryCount: 3
