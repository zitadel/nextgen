id: "sdk-vue"
language: "typescript"
layer: "library"
stack: "frontend"
dependsOn:
  - "api"
  - "components"
  - "sdk-core"

tasks:
  lint:
    command: "corepack pnpm run lint"
    deps:
      - "api:build"
      - "components:build"
      - "sdk-core:build"

  typecheck:
    command: "corepack pnpm run typecheck"
    deps:
      - "api:build"
      - "components:build"
      - "sdk-core:build"

  build:
    command: "corepack pnpm run build"
    deps:
      - "api:build"
      - "components:build"
      - "sdk-core:build"
    outputs:
      - "dist/**/*"

  clean-dist:
    command: "node ../../scripts/release-clean.mjs local-dist"
    deps:
      - "build"
    options:
      cache: false
      runInCI: false

  build-release:
    command: "corepack pnpm run build"
    deps:
      - "clean-dist"
      - "api:build-release"
      - "components:build-release"
      - "sdk-core:build-release"
    outputs:
      - "dist/**/*"
    options:
      cache: false
      # Release builds rewrite dist after clean-dist removes stale package
      # output. They stay out of `moon ci`; release:snapshot invokes them in
      # the later release step instead of the normal build/test graph.
      runInCI: false

  test:
    command: "corepack pnpm run test"
    deps:
      - "build"
