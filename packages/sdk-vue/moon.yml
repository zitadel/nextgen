id: "sdk-vue"
language: "typescript"
layer: "library"
stack: "frontend"
dependsOn:
  - "api"
  - "components"
  - "sdk-core"

tasks:
  lint:
    command: "corepack pnpm run lint"
    deps:
      - "api:build"
      - "components:build"
      - "sdk-core:build"

  typecheck:
    command: "corepack pnpm run typecheck"
    deps:
      - "api:build"
      - "components:build"
      - "sdk-core:build"

  build:
    command: "corepack pnpm run build"
    deps:
      - "api:build"
      - "components:build"
      - "sdk-core:build"
    outputs:
      - "dist/**/*"

  build-release:
    command: "corepack pnpm run build"
    deps:
      - "api:build-release"
      - "components:build-release"
      - "sdk-core:build-release"
    outputs:
      - "dist/**/*"
    options:
      cache: false

  test:
    command: "corepack pnpm run test"
    deps:
      - "build"
