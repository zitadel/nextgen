id: "sdk-vue"
language: "typescript"
layer: "library"
stack: "frontend"
dependsOn:
  - "api"
  - "api-mock"
  - "components"
  - "sdk-core"

tasks:
  typecheck:
    deps:
      - "api-mock:build"
      - "components:build"
      - "sdk-core:build"

  build:
    deps:
      - "components:build"
      - "sdk-core:build"

  build-release:
    script: |
      node ../../scripts/release-clean.mjs local-dist
      corepack pnpm run build
    deps:
      - "components:build-release"
      - "sdk-core:build-release"
    outputs:
      - "dist/**/*"
    options:
      cache: false
      # Release builds remove stale package output and rebuild dist in one
      # task. They stay out of `moon ci`; release:snapshot invokes them in
      # the later release step instead of the normal build/test graph.
      runInCI: false

  test:
    deps:
      # api-mock serves the Flow API to the specs (test-setup.ts).
      - "api-mock:build"
      - "build"
