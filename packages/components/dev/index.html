<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@zitadel-nextgen/components dev</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1117;
        --surface: #1a1d27;
        --border: #2a2d3a;
        --text: #e1e4ed;
        --muted: #8b8fa3;
        --accent: #6c8cff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      header h1 {
        font-size: 14px;
        margin: 0;
        font-weight: 600;
      }
      nav {
        display: flex;
        gap: 4px;
      }
      nav a {
        padding: 6px 12px;
        font-size: 13px;
        text-decoration: none;
        color: var(--muted);
        border-radius: 6px;
        transition: background 120ms;
      }
      nav a:hover {
        background: rgba(108, 140, 255, 0.1);
        color: var(--text);
      }
      nav a[aria-current="page"] {
        background: rgba(108, 140, 255, 0.18);
        color: var(--accent);
      }
      main {
        flex: 1 1 auto;
        display: flex;
        min-height: 0;
      }
      #app {
        flex: 1 1 auto;
        display: flex;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>@zitadel-nextgen/components</h1>
      <nav>
        <a href="?route=atoms" data-route="atoms">Atoms</a>
        <a href="?route=login" data-route="login">&lt;zitadel-login&gt;</a>
      </nav>
    </header>
    <main>
      <div id="app"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
