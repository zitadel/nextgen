id: "components"
language: "typescript"
layer: "library"
stack: "frontend"
dependsOn:
  - "api"
  - "api-mock"
  - "design-tokens"
  - "shared-component-styles"

tasks:
  lint:
    command: "corepack pnpm exec oxlint ."
    deps:
      - "api:build"
      - "design-tokens:build"
      - "shared-component-styles:build"

  typecheck:
    command: "corepack pnpm exec tsc --noEmit -p tsconfig.json"
    deps:
      - "api:build"
      - "design-tokens:build"
      - "shared-component-styles:build"

  build:
    command: "corepack pnpm run build"
    deps:
      - "api:build"
      - "design-tokens:build"
      - "shared-component-styles:build"
    outputs:
      - "dist/**/*"

  build-release:
    command: "corepack pnpm run build"
    deps:
      - "api:build-release"
      - "design-tokens:build"
      - "shared-component-styles:build"
    outputs:
      - "dist/**/*"
    options:
      cache: false
      # Release builds rewrite the same dist/ that dev builds produce and
      # consumer tasks read. They are excluded from `moon ci` (the
      # release:snapshot workflow step builds them afterwards, serially)
      # so a release clean step can never wipe a dist mid-consumption.
      runInCI: false

  test:
    command: "corepack pnpm run test"
    deps:
      - "api:build"
      - "api-mock:build"
      - "design-tokens:build"
      - "shared-component-styles:build"

  test-browser:
    command: "corepack pnpm run test:browser"
    deps:
      - "build"
    options:
      runInCI: false
