id: "components"
language: "typescript"
layer: "library"
stack: "frontend"
dependsOn:
  - "api"
  - "api-mock"
  - "design-tokens"
  - "shared-component-styles"

tasks:
  lint:
    command: "corepack pnpm exec oxlint ."
    deps:
      - "api:build"
      - "design-tokens:build"
      - "shared-component-styles:build"

  typecheck:
    command: "corepack pnpm exec tsc --noEmit -p tsconfig.json"
    deps:
      - "api:build"
      - "design-tokens:build"
      - "shared-component-styles:build"

  build:
    command: "corepack pnpm run build"
    deps:
      - "api:build"
      - "design-tokens:build"
      - "shared-component-styles:build"
    outputs:
      - "dist/**/*"

  build-release:
    script: |
      node ../../scripts/release-clean.mjs local-dist
      corepack pnpm run build
    deps:
      - "build"
      - "api:build-release"
      - "design-tokens:build"
      - "shared-component-styles:build"
    outputs:
      - "dist/**/*"
    options:
      cache: false
      # Release builds remove stale package output and rebuild dist in one
      # task. They stay out of `moon ci`; release:snapshot invokes them in
      # the later release step instead of the normal build/test graph.
      runInCI: false

  test:
    command: "corepack pnpm run test"
    deps:
      - "api:build"
      - "api-mock:build"
      - "design-tokens:build"
      - "shared-component-styles:build"

  test-browser:
    command: "corepack pnpm run test:browser"
    deps:
      - "build"
    options:
      runInCI: false
