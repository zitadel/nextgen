id: "go"
language: "go"
layer: "library"
stack: "backend"

# The public Go API client (go.zitadel.com/zitadel/v5): a nested Go module
# whose api/ package server:generate writes. Tasks run from this directory.
# Native Go results are never cached (.moon/AGENTS.md): Go's own caches
# account for the compiler and target defaults no runner hashes.

tasks:
  # Tracked Go files only, as the server project checks them.
  format:
    script: |
      unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
      if [ -n "$unformatted" ]; then
        echo "error: gofmt would rewrite the following files:" >&2
        printf '%s\n' "$unformatted" >&2
        echo "hint: run gofmt -w on those paths, then re-check with moon run go:format" >&2
        exit 1
      fi
    options:
      cache: false

  # api/ is generated by the server's generation, which rewrites it mid-graph;
  # the dep keeps vet behind it, as bench:vet is. vet compiles the module, so
  # there is no build task; test is ordered through vet.
  vet:
    command: "go vet ./..."
    deps:
      - "server:check-generate"
    options:
      cache: false

  test:
    command: "go test -timeout 5m ./..."
    deps:
      - "format"
      - "vet"
    inputs:
      - "**/*"
      # api/client_test.go holds PathPrefix to the spec's servers URL.
      - "/apps/api/api/openapi/openapi-spec.yaml"
    options:
      cache: false
