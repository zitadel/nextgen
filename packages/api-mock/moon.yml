id: "api-mock"
language: "typescript"
layer: "library"
stack: "backend"
dependsOn:
  - "api"
  - "config"

tasks:
  lint:
    command: "corepack pnpm run lint"
    deps:
      - "api:build"
      - "config:build"

  typecheck:
    command: "corepack pnpm run typecheck"
    deps:
      - "api:build"
      - "config:build"

  build:
    command: "corepack pnpm run build"
    deps:
      - "api:build"
      - "config:build"

  # Chromium for the browser project. Self-contained (like storybook): the
  # `test` task depends on it so `moon ci :test` provisions it in CI.
  install-browsers:
    command: "corepack pnpm run install-browsers"
    options:
      cache: false

  # Full lane (the CI gate): `test:all` runs the node `unit` project and the
  # real-Chromium `browser` smoke test in one Vitest process, so both land in
  # one aggregated junit.xml. moon invokes `test:all` uniformly across every
  # package. The fast unit-only lane is `pnpm test` for local iteration;
  # `pnpm test:browser` runs the browser project alone.
  test:
    command: "corepack pnpm run test:all"
    deps:
      - "install-browsers"
      - "api:build"
      - "config:build"

  start:
    command: "corepack pnpm run start"
    options:
      persistent: true
      runInCI: false

  # Mock server restarting on source changes, for development.
  dev:
    command: "corepack pnpm run dev"
    options:
      cache: false
      persistent: true
      runInCI: false
