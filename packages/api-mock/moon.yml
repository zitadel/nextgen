id: "api-mock"
language: "typescript"
layer: "library"
stack: "backend"
dependsOn:
  - "api"
  - "config"

tasks:
  typecheck:
    deps:
      - "config:build"

  build:
    deps:
      - "config:build"

  # Chromium for the browser project. Self-contained (like storybook): the
  # `test` task depends on it so `moon ci :test` provisions it in CI.
  install-browsers:
    command: "corepack pnpm exec playwright install chromium"
    options:
      cache: false

  # Full lane (the CI gate): `test:all` runs the node `unit` project and the
  # real-Chromium `browser` smoke test in one Vitest process, so both land in
  # one aggregated junit.xml. moon invokes `test:all` uniformly across every
  # package. The fast unit-only lane is `pnpm test:unit` for local iteration;
  # `pnpm test:browser` runs the browser project alone.
  test:
    deps:
      - "install-browsers"
      - "config:build"
    options:
      # Retry a failed browser suite in CI, as a safety net. It was added for
      # "Failed to fetch dynamically imported module": Chromium aborting module
      # imports when a container changes the host's addresses, which ci.yml's
      # "Keep Docker's interface churn away from Chromium" step prevents. (#1490)
      retryCount: 3

  # bin/start.ts runs the source and imports api's generated client and config.
  start:
    command: "corepack pnpm run start"
    deps:
      - "config:build"
    options:
      persistent: true
      runInCI: false
