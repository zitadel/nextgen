id: "api-mock"
language: "typescript"
layer: "library"
stack: "backend"
dependsOn:
  - "api"
  - "config"

tasks:
  lint:
    command: "pnpm exec oxlint ."
    deps:
      - "api:build"
      - "config:build"

  typecheck:
    command: "pnpm exec tsc --build tsconfig.json"
    deps:
      - "api:build"
      - "config:build"

  build:
    command: "node -e \"process.exit(0)\""
    deps:
      - "api:build"
      - "config:build"

  # Chromium for the browser project. Self-contained (like storybook): the
  # `test` task depends on it so `moon ci :test` provisions it in CI.
  install-browsers:
    command: "pnpm exec playwright install chromium"
    options:
      cache: false

  # Full lane (the CI gate): `test:all` runs the node `unit` project and the
  # real-Chromium `browser` smoke test in one Vitest process, so both land in
  # one aggregated junit.xml. moon invokes `test:all` uniformly across every
  # package. The fast unit-only lane is `pnpm test` for local iteration;
  # `pnpm test:browser` runs the browser project alone.
  test:
    command: "pnpm run test:all"
    deps:
      - "install-browsers"
      - "api:build"
      - "config:build"

  start:
    command: "pnpm run start"
    options:
      persistent: true
      runInCI: false
