id: "api-mock"
language: "typescript"
layer: "library"
stack: "backend"
dependsOn:
  - "api"
  - "config"

tasks:
  lint:
    command: "corepack pnpm exec oxlint ."
    deps:
      - "api:build"
      - "config:build"

  typecheck:
    command: "corepack pnpm exec tsc --build tsconfig.json"
    deps:
      - "api:build"
      - "config:build"

  build:
    command: "node -e \"process.exit(0)\""
    deps:
      - "api:build"
      - "config:build"

  # `vitest run` runs both projects (unit + browser) from one config, so the
  # Playwright Chromium install is a dep here (self-contained, like storybook).
  install-browsers:
    command: "corepack pnpm exec playwright install chromium"
    options:
      cache: false

  test:
    command: "corepack pnpm run test"
    deps:
      - "install-browsers"
      - "api:build"
      - "config:build"

  start:
    command: "corepack pnpm run start"
    options:
      persistent: true
      runInCI: false
