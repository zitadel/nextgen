id: "api-mock"
language: "typescript"
layer: "library"
stack: "backend"
dependsOn:
  - "api"
  - "config"

tasks:
  lint:
    command: "corepack pnpm exec oxlint ."
    deps:
      - "api:build"
      - "config:build"

  typecheck:
    command: "corepack pnpm exec tsc --build tsconfig.json"
    deps:
      - "api:build"
      - "config:build"

  build:
    command: "node -e \"process.exit(0)\""
    deps:
      - "api:build"
      - "config:build"

  # Chromium for the opt-in browser lane (self-contained, like storybook).
  install-browsers:
    command: "corepack pnpm exec playwright install chromium"
    options:
      cache: false

  # Default, fast lane: the node `unit` project only (the CI gate).
  test:
    command: "corepack pnpm run test"
    deps:
      - "api:build"
      - "config:build"

  # Heavy, opt-in browser smoke test (real Chromium). runInCI:false by design.
  test-browser:
    command: "corepack pnpm run test:browser"
    deps:
      - "install-browsers"
      - "api:build"
      - "config:build"
    options:
      runInCI: false

  start:
    command: "corepack pnpm run start"
    options:
      persistent: true
      runInCI: false
