id: "server"
language: "go"
layer: "application"
stack: "backend"

fileGroups:
  serverInputs:
    - "/**/*.go"
    # Embedded goose migrations (//go:embed sql/*.sql); without these Moon can
    # cache-hit test/build after schema-only changes while Go would rebuild.
    - "/**/*.sql"
    - "/go.mod"
    - "/go.sum"
    - "/api/**/*.yaml"
    - "/api/**/*.json"
    # Also compiled in through //go:embed or read by tests: the config defaults
    # (incl. presets), the error page and the design tokens it inlines, the
    # integration-test fixtures, the events catalog and the product analytics
    # catalog.
    - "/packages/config/defaults/**/*"
    - "/internal/errorpage/*"
    - "/packages/design-tokens/src/generated/tokens.css"
    - "/internal/**/*.json"
    - "/docs/design/api/events-catalog.md"
    - "/docs/product-analytics-events.yaml"
    - "/api/.ogen.yaml"
    - "/scripts/check-go-generate.mjs"
    - "/scripts/generate-meta-schemas.ts"
    - "moon.yml"
    - "package.json"
    - "bin/**"

tasks:
  openapi:
    command: "node scripts/lint-openapi.mjs"
    inputs:
      - "@group(serverInputs)"
      - "/scripts/lint-openapi.mjs"
      # Without these a lint-config change still cache-hits.
      - "/redocly.yaml"
      - "/.redocly.lint-ignore.yaml"
    options:
      runFromWorkspaceRoot: true

  format:
    script: |
      unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
      if [ -n "$unformatted" ]; then
        echo "error: gofmt would rewrite the following files:" >&2
        printf '%s\n' "$unformatted" >&2
        echo "hint: run gofmt -w on those paths, then re-check with moon run server:format" >&2
        exit 1
      fi
    inputs:
      - "@group(serverInputs)"
    options:
      runFromWorkspaceRoot: true

  generate:
    # Not `go generate ./...`: that runs every directive serially, and the cost
    # is per-invocation (mockgen type-loads a package whether it mocks one
    # interface or twenty). The script runs packages in parallel behind the one
    # ordering constraint that matters — see scripts/go-generate.mjs.
    command: "node scripts/go-generate.mjs"
    inputs:
      - "@group(serverInputs)"
      - "/scripts/go-generate.mjs"
      - "/scripts/dev-process.mjs"
    # Mirrored by GENERATED_GLOBS in scripts/generated-outputs.mjs, which is
    # what `clean-generated` deletes. Change both together.
    outputs:
      - "/api/generated/**"
      - "/api/openapi/components/schemas/errors/**"
      - "/api/openapi/endpoints/**/*-error-response.yaml"
      - "/api/openapi/endpoints/events/event.yaml"
      - "/api/openapi/endpoints/events/types/*.yaml"
      - "/api/openapi/endpoints/events/webhooks/*.yaml"
      - "/api/openapi/endpoints/schemas/*.json"
      - "/internal/**/*_enumer.go"
      - "/internal/**/*.mock.go"
    options:
      runFromWorkspaceRoot: true
      # Generation rewrites files other projects read mid-graph: the JSON
      # meta-schemas (config:sync-schemas) and the error-response YAML
      # (api:generate). The shared mutex keeps those from running against a
      # half-written or pruned tree; CI already runs the pruned check alone.
      mutex: "generated-sources"

  # Generators only write; they never retract. Removing everything and
  # regenerating is how orphaned output gets pruned — whatever does not come
  # back was dead. Never cached: the whole point is to touch the filesystem.
  clean-generated:
    command: "node scripts/clean-generated.mjs"
    inputs:
      - "/scripts/clean-generated.mjs"
      - "/scripts/generated-outputs.mjs"
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true
      mutex: "generated-sources"

  check-generate:
    command: "node scripts/check-go-generate.mjs"
    inputs:
      - "@group(serverInputs)"
      - "/scripts/go-generate.mjs"
      - "/scripts/dev-process.mjs"
      # Imported at module scope, not only under --prune: GENERATED_GLOBS is
      # what this task's git comparison looks at, so a glob edit that does not
      # invalidate here would cache-hit and pass against the old pathspecs.
      - "/scripts/clean-generated.mjs"
      - "/scripts/generated-outputs.mjs"
    options:
      runFromWorkspaceRoot: true
      mutex: "generated-sources"

  # check-generate plus a prune, so output nothing generates any more fails the
  # build instead of lingering. Deliberately not a dep of vet/test: it deletes
  # every generated file before regenerating, which is fine on a CI runner and
  # rude on a machine someone is working in. CI runs this in place of the plain
  # check — it subsumes it.
  check-generate-pruned:
    command: "node scripts/check-go-generate.mjs --prune"
    inputs:
      - "@group(serverInputs)"
      - "/scripts/go-generate.mjs"
      - "/scripts/clean-generated.mjs"
      - "/scripts/generated-outputs.mjs"
      - "/scripts/dev-process.mjs"
    options:
      runFromWorkspaceRoot: true
      mutex: "generated-sources"

  vet:
    command: "go vet ./..."
    deps:
      - "check-generate"
      # Same embed race as test/build: go vet compiles //go:embed all:dist while
      # a concurrent console build can emptyOutDir the placeholder.
      - "console:build"
    inputs:
      - "@group(serverInputs)"
    options:
      runFromWorkspaceRoot: true

  # Custom go/analysis checks, run directly rather than through go vet so the
  # built-in vet analyzers (task "vet") keep running alongside. Today this is
  # egresslint, which enforces the single egress-client invariant (ADR 061):
  # outbound HTTP or TCP clients may only be built in internal/httputil, and
  # any other site needs an //egress:allow <reason> directive. Further
  # analyzers join the same binary (tools/analyzers/cmd/analyzers).
  #
  # Runs once per build configuration: the default set, then each integration
  # tag on its own, because the tagged files are invisible to the default run
  # and the tags cannot be combined (each lane defines its own TestMain).
  lint:
    script: |
      set -e
      go run ./tools/analyzers/cmd/analyzers ./...
      for tag in postgres_integration spanner_integration sqlite_integration; do
        GOFLAGS="-tags=$tag" go run ./tools/analyzers/cmd/analyzers ./...
      done
      # This is a Go project, so it inherits no Biome lint task, but it owns a
      # JavaScript launcher (bin/zitadel-server.js). Lint it here so a change to
      # it cannot bypass Biome. `bin/**` is already in serverInputs, so this
      # task is selected when the launcher changes.
      corepack pnpm exec biome check apps/server/bin --no-errors-on-unmatched
    deps:
      - "check-generate"
      - "console:build"
    inputs:
      - "@group(serverInputs)"
      # The Biome config the launcher check runs against.
      - "/biome.json"
    options:
      runFromWorkspaceRoot: true

  test:
    command: "go"
    args:
      - "test"
      - "-v"
      - "-timeout"
      - "10m"
      - "./..."
    deps:
      - "openapi"
      - "format"
      - "vet"
      - "lint"
      # The test binary embeds the console's dist (//go:embed all:dist). Listed here
      # and not only reached through vet: vet has no outputs, so moon would not
      # hash these builds through it and a UI change would replay a cached run.
      - "console:build"
    inputs:
      - "@group(serverInputs)"
      # Read by the cloud launcher's tests (apps/cloud/launcher), which hold
      # the deployment's configuration together. Scoped to test: nothing the
      # server compiles reads them.
      - "/vercel.json"
      - "/apps/cloud/build-launcher.sh"
    options:
      runFromWorkspaceRoot: true

  test-postgres:
    # Two independent caches can replay these lanes, and both have to be off.
    #
    # -count=1 disables go's test-result cache. These suites talk to an external
    # database whose state is invisible to go's cache key, and CI restores
    # GOCACHE between runs (setup-go cache: true), so an unchanged source tree
    # yields "ok (cached)" without anything executing against the current
    # backend. Observed on run 32743380406, where this very lane reported
    # `ok … integration_test (cached)`.
    #
    # options.cache: false disables moon's. That one sits in front of go: on a
    # repeat task hash moon reports the task cached and never starts the `go`
    # process at all, so -count=1 never gets a turn. The external database is
    # just as invisible to moon's hash as it is to go's.
    command: "go"
    args:
      - "test"
      - "-v"
      - "-count=1"
      - "-tags"
      - "postgres_integration"
      - "-timeout"
      - "10m"
      - "./..."
    deps:
      # check-generate rewrites api/generated while it runs. These suites
      # compile that package and api/internal/erroranalysis type-loads it, so a
      # lane run beside it reads half-written files. vet, lint and build wait
      # for it the same way.
      - "check-generate"
      # Order the console build before go test so //go:embed all:dist has files.
      - "console:build"
    inputs:
      - "@group(serverInputs)"
    options:
      runFromWorkspaceRoot: true
      # See the -count=1 note above: moon's own cache would skip the process
      # before go's cache mattered.
      cache: false
      # ci.yml's graph step (`moon ci --downstream deep`) runs it whenever it is
      # affected, as a dependent of the console build. The "Run Go integration tests
      # (postgres)" step runs it only when the graph did not, as when ci-mode
      # forces a full run for a workflow-only edit, which no lane lists as
      # input.
      # runInCI must be true for both: moon ci leaves out a task that is not,
      # and `moon run` in CI refuses one ("No tasks found").
      runInCI: true

  test-spanner:
    # -count=1 disables go's test-result cache; see test-postgres above. This is
    # the lane where it did real damage: on run 32741899403 the real-instance
    # step finished in 23 seconds printing `ok … integration_test (cached)`,
    # replaying results recorded by an emulator execution. A benchmark number
    # was nearly read off a run that never happened.
    #
    # -parallel is deliberately NOT pinned to 1. Tests running concurrently
    # within a package put transactions in real contention, on top of the
    # aborts a spanner_integration build injects on purpose (#788); pinning it
    # hid a missing retry rather than fixing it. Do not put it back.
    #
    # -p is left at its default, so the three packages run at once. Each still
    # gets its own database: with ZITADEL_TEST_SPANNER_INSTANCE set (spanner.yml
    # points it at Spanner Omni) every package provisions one on that instance,
    # because one shared database failed on tests reading each other's
    # leftovers (#1011). Without it, each package starts its own emulator
    # container, so a local run starts three at once.
    command: "go"
    args:
      - "test"
      - "-v"
      - "-count=1"
      - "-tags"
      - "spanner_integration"
      # Per package. Against Spanner Omni each package first spends about six
      # minutes creating and migrating its database (#1011), and spanner.yml
      # runs all three on one engine on a 4-vCPU runner. A hang still surfaces
      # well inside that job's 60 minutes.
      - "-timeout"
      - "30m"
      # Only the packages that open a Spanner database. Under this tag every
      # other package has no Spanner test; internal/bootstrap/users builds on it
      # but runs against Postgres, which test-postgres covers.
      - "./internal/api/integration_test/"
      - "./internal/storage/dialect/spanner/"
      - "./internal/storage/stmttest/"
    deps:
      # check-generate rewrites api/generated; see test-postgres.
      - "check-generate"
      # Order the console build before go test so //go:embed all:dist has files.
      - "console:build"
    inputs:
      - "@group(serverInputs)"
      # Belt-and-braces, not the thing protecting this lane: with cache: false
      # below, the task hash is never consulted, so nothing can be replayed from
      # it and this entry changes no outcome today. It is kept because the target
      # backend (emulator container vs real Cloud Spanner instance) genuinely
      # does change what runs, so the hash should reflect it if caching is ever
      # switched back on. Same pairing as build-release in apps/cli/moon.yml,
      # which also lists an env input alongside cache: false.
      - "$ZITADEL_TEST_SPANNER_INSTANCE"
    options:
      runFromWorkspaceRoot: true
      # See the -count=1 note above: moon's own cache would skip the process
      # before go's cache mattered. Observed on #934, where moon replayed the
      # emulator task's result for a real-instance run.
      cache: false
      # Runs in .github/workflows/spanner.yml, never in ci.yml. "skip" keeps
      # `moon ci` from pulling it in: --downstream deep selects it as a
      # dependent of the console build whenever the server or the console
      # changes, and its ~3.5 minutes then held up the whole PR graph. In CI,
      # `moon run` refuses a skipped task ("No tasks found"); spanner.yml runs
      # it with `moon exec --ignore-ci-checks`. Local `moon run` is unaffected.
      runInCI: "skip"

  test-sqlite:
    # -count=1 disables go's test-result cache; see test-postgres above. SQLite
    # runs in-process rather than against a container, but the database file is
    # still created at runtime and is not part of go's cache key, so a cached
    # "ok" is no more trustworthy here than on the other two lanes.
    command: "go"
    args:
      - "test"
      - "-v"
      - "-count=1"
      - "-tags"
      - "sqlite_integration"
      - "-timeout"
      - "5m"
      - "./..."
    deps:
      # check-generate rewrites api/generated; see test-postgres.
      - "check-generate"
      # Order the console build before go test so //go:embed all:dist has files.
      - "console:build"
    inputs:
      - "@group(serverInputs)"
    options:
      runFromWorkspaceRoot: true
      # See the -count=1 note above: moon's own cache would skip the process
      # before go's cache mattered.
      cache: false
      # Runs in CI as test-postgres does: in ci.yml's graph step when it is
      # affected, and in the "Run Go integration tests (sqlite)" step only when
      # the graph did not run it.
      runInCI: true

  build:
    command: "node scripts/server-build.mjs"
    deps:
      - "check-generate"
      # The binary embeds the console's dist (//go:embed all:dist in
      # internal/staticui/console/embed.go). This dep orders the console build
      # before the Go compile, so a batched invocation can never embed a
      # half-written dist.
      - "console:build"
    inputs:
      - "@group(serverInputs)"
      # The embedded dist bytes participate in the hash directly, so staticui
      # changes made outside this task's deps still invalidate the cached
      # binary. Scoped to build rather than serverInputs: only the binary
      # artifact depends on dist content — test/vet/format must not re-run on
      # UI-only changes.
      - "/internal/staticui/**"
      # Same scoping argument: the build script and its process helper decide
      # what this task produces, but nothing about how the Go sources lint or
      # test. dev-process.mjs is listed because server-build.mjs imports it —
      # without it, editing the helper cache-hits a stale binary.
      - "/scripts/server-build.mjs"
      - "/scripts/dev-process.mjs"
    outputs:
      - "/dist/server/nextgen"
      - "/dist/server/metadata.json"
    options:
      runFromWorkspaceRoot: true
