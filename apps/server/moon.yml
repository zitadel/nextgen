id: "server"
language: "go"
layer: "application"
stack: "backend"

fileGroups:
  serverInputs:
    - "/**/*.go"
    - "/go.mod"
    - "/go.sum"
    - "/api/**/*.yaml"
    - "/api/**/*.json"
    - "/api/.ogen.yaml"
    - "/scripts/check-go-generate.mjs"
    - "moon.yml"
    - "package.json"
    - "bin/**"

tasks:
  openapi:
    command: "npx --yes @redocly/cli@2.31.5 lint api/openapi/openapi-spec.yaml --format=github-actions"
    inputs:
      - "@group(serverInputs)"
    options:
      runFromWorkspaceRoot: true

  format:
    script: |
      unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
      if [ -n "$unformatted" ]; then
        printf '%s\n' "$unformatted"
        exit 1
      fi
    inputs:
      - "@group(serverInputs)"
    options:
      runFromWorkspaceRoot: true

  generate:
    command: "go generate ./..."
    inputs:
      - "@group(serverInputs)"
    outputs:
      - "/api/generated/**"
      - "/api/openapi/components/schemas/errors/**"
      - "/api/openapi/endpoints/**/*-error-response.yaml"
      - "/internal/**/*_enumer.go"
      - "/internal/**/*.mock.go"
    options:
      runFromWorkspaceRoot: true

  check-generate:
    command: "node scripts/check-go-generate.mjs"
    inputs:
      - "@group(serverInputs)"
    options:
      runFromWorkspaceRoot: true

  vet:
    command: "go vet ./..."
    deps:
      - "check-generate"
    inputs:
      - "@group(serverInputs)"
    options:
      runFromWorkspaceRoot: true

  test:
    command: "go"
    args:
      - "test"
      - "-v"
      - "-timeout"
      - "10m"
      - "./..."
    deps:
      - "openapi"
      - "format"
      - "check-generate"
      - "vet"
    inputs:
      - "@group(serverInputs)"
    options:
      runFromWorkspaceRoot: true

  test-postgres:
    command: "go"
    args:
      - "test"
      - "-v"
      - "-tags"
      - "postgres_integration"
      - "-timeout"
      - "10m"
      - "./..."
    inputs:
      - "@group(serverInputs)"
    options:
      runFromWorkspaceRoot: true
      runInCI: false

  test-spanner:
    command: "go"
    args:
      - "test"
      - "-v"
      - "-tags"
      - "spanner_integration"
      - "-timeout"
      - "10m"
      - "./..."
    inputs:
      - "@group(serverInputs)"
    options:
      runFromWorkspaceRoot: true
      runInCI: false

  build:
    command: "go build -trimpath -o dist/server/nextgen ."
    deps:
      - "check-generate"
    inputs:
      - "@group(serverInputs)"
    outputs:
      - "/dist/server/nextgen"
    options:
      runFromWorkspaceRoot: true
