id: "server"
language: "go"
layer: "application"
stack: "backend"

fileGroups:
  serverInputs:
    - "/**/*.go"
    # Embedded goose migrations (//go:embed sql/*.sql); without these Moon can
    # cache-hit test/build after schema-only changes while Go would rebuild.
    - "/**/*.sql"
    - "/go.mod"
    - "/go.sum"
    - "/api/**/*.yaml"
    - "/api/**/*.json"
    - "/api/.ogen.yaml"
    - "/scripts/check-go-generate.mjs"
    - "moon.yml"
    - "package.json"
    - "bin/**"

tasks:
  openapi:
    command: "npx --yes @redocly/cli@2.31.5 lint api/openapi/openapi-spec.yaml --format=github-actions"
    inputs:
      - "@group(serverInputs)"
      # Without these a lint-config change still cache-hits.
      - "/redocly.yaml"
      - "/.redocly.lint-ignore.yaml"
    options:
      runFromWorkspaceRoot: true

  format:
    script: |
      unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
      if [ -n "$unformatted" ]; then
        echo "error: gofmt would rewrite the following files:" >&2
        printf '%s\n' "$unformatted" >&2
        echo "hint: run gofmt -w on those paths, then re-check with moon run server:format" >&2
        exit 1
      fi
    inputs:
      - "@group(serverInputs)"
    options:
      runFromWorkspaceRoot: true

  generate:
    # Not `go generate ./...`: that runs every directive serially, and the cost
    # is per-invocation (mockgen type-loads a package whether it mocks one
    # interface or twenty). The script runs packages in parallel behind the one
    # ordering constraint that matters — see scripts/go-generate.mjs.
    command: "node scripts/go-generate.mjs"
    inputs:
      - "@group(serverInputs)"
      - "/scripts/go-generate.mjs"
      - "/scripts/dev-process.mjs"
    # Mirrored by GENERATED_GLOBS in scripts/generated-outputs.mjs, which is
    # what `clean-generated` deletes. Change both together.
    outputs:
      - "/api/generated/**"
      - "/api/openapi/components/schemas/errors/**"
      - "/api/openapi/endpoints/**/*-error-response.yaml"
      - "/internal/**/*_enumer.go"
      - "/internal/**/*.mock.go"
    options:
      runFromWorkspaceRoot: true

  # Generators only write; they never retract. Removing everything and
  # regenerating is how orphaned output gets pruned — whatever does not come
  # back was dead. Never cached: the whole point is to touch the filesystem.
  clean-generated:
    command: "node scripts/clean-generated.mjs"
    inputs:
      - "/scripts/clean-generated.mjs"
      - "/scripts/generated-outputs.mjs"
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true

  check-generate:
    command: "node scripts/check-go-generate.mjs"
    inputs:
      - "@group(serverInputs)"
      - "/scripts/go-generate.mjs"
      - "/scripts/dev-process.mjs"
      # Imported at module scope, not only under --prune: GENERATED_GLOBS is
      # what this task's git comparison looks at, so a glob edit that does not
      # invalidate here would cache-hit and pass against the old pathspecs.
      - "/scripts/clean-generated.mjs"
      - "/scripts/generated-outputs.mjs"
    options:
      runFromWorkspaceRoot: true

  # check-generate plus a prune, so output nothing generates any more fails the
  # build instead of lingering. Deliberately not a dep of vet/test: it deletes
  # every generated file before regenerating, which is fine on a CI runner and
  # rude on a machine someone is working in. CI runs this in place of the plain
  # check — it subsumes it.
  check-generate-pruned:
    command: "node scripts/check-go-generate.mjs --prune"
    inputs:
      - "@group(serverInputs)"
      - "/scripts/go-generate.mjs"
      - "/scripts/clean-generated.mjs"
      - "/scripts/generated-outputs.mjs"
      - "/scripts/dev-process.mjs"
    options:
      runFromWorkspaceRoot: true

  vet:
    command: "go vet ./..."
    deps:
      - "check-generate"
      # Same embed race as test/build: go vet compiles //go:embed all:dist while
      # a concurrent console/login-ui build can emptyOutDir the placeholder.
      - "console:build"
      - "login-ui:build"
    inputs:
      - "@group(serverInputs)"
    options:
      runFromWorkspaceRoot: true

  test:
    command: "go"
    args:
      - "test"
      - "-v"
      - "-timeout"
      - "10m"
      - "./..."
    deps:
      - "openapi"
      - "format"
      - "check-generate"
      - "vet"
      # Order UI builds before go test so a batched moon graph cannot compile
      # //go:embed all:dist while vite emptyOutDir has cleared .gitkeep.
      # Intentionally deps-only (not inputs): UI-only changes must not invalidate
      # the Go test cache — see build.inputs note below.
      - "console:build"
      - "login-ui:build"
    inputs:
      - "@group(serverInputs)"
    options:
      runFromWorkspaceRoot: true

  test-postgres:
    # Two independent caches can replay these lanes, and both have to be off.
    #
    # -count=1 disables go's test-result cache. These suites talk to an external
    # database whose state is invisible to go's cache key, and CI restores
    # GOCACHE between runs (setup-go cache: true), so an unchanged source tree
    # yields "ok (cached)" without anything executing against the current
    # backend. Observed on run 32743380406, where this very lane reported
    # `ok … integration_test (cached)`.
    #
    # options.cache: false disables moon's. That one sits in front of go: on a
    # repeat task hash moon reports the task cached and never starts the `go`
    # process at all, so -count=1 never gets a turn. The external database is
    # just as invisible to moon's hash as it is to go's.
    command: "go"
    args:
      - "test"
      - "-v"
      - "-count=1"
      - "-tags"
      - "postgres_integration"
      - "-timeout"
      - "10m"
      - "./..."
    inputs:
      - "@group(serverInputs)"
    options:
      runFromWorkspaceRoot: true
      # See the -count=1 note above: moon's own cache would skip the process
      # before go's cache mattered.
      cache: false
      # Invoked explicitly by the CI "Run Go integration tests (postgres)" step.
      # runInCI must be true, otherwise moon hides the task from `moon run` in CI
      # ("No tasks found"). It is not pulled into `moon ci :...:test` because that
      # selects the `test` task by name, not `test-postgres`.
      runInCI: true

  test-spanner:
    # -count=1 disables go's test-result cache; see test-postgres above. This is
    # the lane where it did real damage: on run 32741899403 the real-instance
    # step finished in 23 seconds printing `ok … integration_test (cached)`,
    # replaying results recorded by an emulator execution. A benchmark number
    # was nearly read off a run that never happened.
    #
    # -parallel is deliberately NOT pinned to 1. The emulator serves one
    # transaction at a time, so tests running concurrently within a package force
    # the aborts that prove the abort-retry path still works. Pinning it hid the
    # missing retry rather than fixing it (#788); do not put it back.
    #
    # -p 1 stays: the suites share one emulator database, and packages like
    # stmttest assert on global list results, so they still need to run one
    # package at a time. That is test isolation, not contention avoidance.
    command: "go"
    args:
      - "test"
      - "-v"
      - "-count=1"
      - "-tags"
      - "spanner_integration"
      - "-timeout"
      - "10m"
      - "-p"
      - "1"
      - "./..."
    inputs:
      - "@group(serverInputs)"
      # The target backend changes what actually runs (emulator container vs a
      # real Cloud Spanner instance) but is invisible to moon's task hash, so
      # without this input moon replays the emulator run's cached task result
      # for a real-instance run, before go's own cache even gets a turn.
      # Precedent: $ZITADEL_TELEMETRY_BUILD_CHANNEL in apps/cli/moon.yml.
      - "$ZITADEL_TEST_SPANNER_INSTANCE"
    options:
      runFromWorkspaceRoot: true
      # See the -count=1 note above: moon's own cache would skip the process
      # before go's cache mattered. Observed on #934, where moon replayed the
      # emulator task's result for a real-instance run.
      cache: false
      # Invoked by the CI Spanner emulator step.
      # runInCI must be true, otherwise moon hides the task from `moon run` in CI
      # ("No tasks found"). It is not pulled into `moon ci :...:test` because that
      # selects the `test` task by name, not `test-spanner`.
      runInCI: true

  test-sqlite:
    # -count=1 disables go's test-result cache; see test-postgres above. SQLite
    # runs in-process rather than against a container, but the database file is
    # still created at runtime and is not part of go's cache key, so a cached
    # "ok" is no more trustworthy here than on the other two lanes.
    command: "go"
    args:
      - "test"
      - "-v"
      - "-count=1"
      - "-tags"
      - "sqlite_integration"
      - "-timeout"
      - "5m"
      - "./..."
    inputs:
      - "@group(serverInputs)"
    options:
      runFromWorkspaceRoot: true
      # See the -count=1 note above: moon's own cache would skip the process
      # before go's cache mattered.
      cache: false
      # Invoked explicitly by the CI "Run Go integration tests (sqlite)" step.
      # runInCI must be true, otherwise moon hides the task from `moon run` in CI
      # ("No tasks found"). It is not pulled into `moon ci :...:test` because that
      # selects the `test` task by name, not `test-sqlite`.
      runInCI: true

  build:
    command: "node scripts/server-build.mjs"
    deps:
      - "check-generate"
      # The binary embeds both UI dists (//go:embed all:dist in
      # internal/staticui/*/embed.go). These deps order the UI builds before
      # the Go compile, so a batched invocation can never embed a half-written
      # dist.
      - "console:build"
      - "login-ui:build"
    inputs:
      - "@group(serverInputs)"
      # The embedded dist bytes participate in the hash directly, so staticui
      # changes made outside this task's deps still invalidate the cached
      # binary. Scoped to build rather than serverInputs: only the binary
      # artifact depends on dist content — test/vet/format must not re-run on
      # UI-only changes.
      - "/internal/staticui/**"
      # Same scoping argument: the build script and its process helper decide
      # what this task produces, but nothing about how the Go sources lint or
      # test. dev-process.mjs is listed because server-build.mjs imports it —
      # without it, editing the helper cache-hits a stale binary.
      - "/scripts/server-build.mjs"
      - "/scripts/dev-process.mjs"
    outputs:
      - "/dist/server/nextgen"
      - "/dist/server/metadata.json"
    options:
      runFromWorkspaceRoot: true
