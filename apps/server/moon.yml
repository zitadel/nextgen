id: "server"
language: "go"
layer: "application"
stack: "backend"

fileGroups:
  serverInputs:
    - "/**/*.go"
    - "/go.mod"
    - "/go.sum"
    - "/api/**/*.yaml"
    - "/api/**/*.json"
    - "/api/.ogen.yaml"
    - "/scripts/check-go-generate.mjs"
    - "moon.yml"
    - "package.json"
    - "bin/**"

tasks:
  openapi:
    command: "npx --yes @redocly/cli@2.31.5 lint api/openapi/openapi-spec.yaml --format=github-actions"
    inputs:
      - "@group(serverInputs)"
    options:
      runFromWorkspaceRoot: true

  format:
    script: |
      unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
      if [ -n "$unformatted" ]; then
        echo "error: gofmt would rewrite the following files:" >&2
        printf '%s\n' "$unformatted" >&2
        echo "hint: run gofmt -w on those paths, then re-check with moon run server:format" >&2
        exit 1
      fi
    inputs:
      - "@group(serverInputs)"
    options:
      runFromWorkspaceRoot: true

  generate:
    command: "go generate ./..."
    inputs:
      - "@group(serverInputs)"
    outputs:
      - "/api/generated/**"
      - "/api/openapi/components/schemas/errors/**"
      - "/api/openapi/endpoints/**/*-error-response.yaml"
      - "/internal/**/*_enumer.go"
      - "/internal/**/*.mock.go"
    options:
      runFromWorkspaceRoot: true

  check-generate:
    command: "node scripts/check-go-generate.mjs"
    inputs:
      - "@group(serverInputs)"
    options:
      runFromWorkspaceRoot: true

  vet:
    command: "go vet ./..."
    deps:
      - "check-generate"
    inputs:
      - "@group(serverInputs)"
    options:
      runFromWorkspaceRoot: true

  test:
    command: "go"
    args:
      - "test"
      - "-v"
      - "-timeout"
      - "10m"
      - "./..."
    deps:
      - "openapi"
      - "format"
      - "check-generate"
      - "vet"
    inputs:
      - "@group(serverInputs)"
    options:
      runFromWorkspaceRoot: true

  test-postgres:
    command: "go"
    args:
      - "test"
      - "-v"
      - "-tags"
      - "postgres_integration"
      - "-timeout"
      - "10m"
      - "./..."
    inputs:
      - "@group(serverInputs)"
    options:
      runFromWorkspaceRoot: true
      # Invoked explicitly by the CI "Run Go integration tests (postgres)" step.
      # runInCI must be true, otherwise moon hides the task from `moon run` in CI
      # ("No tasks found"). It is not pulled into `moon ci :...:test` because that
      # selects the `test` task by name, not `test-postgres`.
      runInCI: true

  test-spanner:
    # Wrapper adds -parallel 1 -p 1 when ZITADEL_TEST_SPANNER_INSTANCE is unset
    # (emulator fallback); see scripts/test-spanner.mjs.
    command: "node scripts/test-spanner.mjs"
    inputs:
      - "@group(serverInputs)"
      - "/scripts/test-spanner.mjs"
    options:
      runFromWorkspaceRoot: true
      # Invoked explicitly by the CI "Run Go integration tests (spanner)" step.
      # runInCI must be true, otherwise moon hides the task from `moon run` in CI
      # ("No tasks found"). It is not pulled into `moon ci :...:test` because that
      # selects the `test` task by name, not `test-spanner`.
      runInCI: true

  build:
    command: "go build -trimpath -o dist/server/nextgen ."
    deps:
      - "check-generate"
    inputs:
      - "@group(serverInputs)"
    outputs:
      - "/dist/server/nextgen"
    options:
      runFromWorkspaceRoot: true
