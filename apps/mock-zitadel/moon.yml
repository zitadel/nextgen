id: "mock-zitadel"
language: "typescript"
layer: "application"
stack: "backend"
dependsOn:
  - "api-mock"

tasks:
  # Bundle the function into a single self-contained JS file (see
  # tsdown.config.ts). The deployed entry imports this, not the workspace
  # TypeScript source.
  build:
    command: "corepack pnpm run build"
    deps:
      - "api-mock:build"
    outputs:
      - "dist/**"

  lint:
    command: "corepack pnpm run lint"
    deps:
      - "api-mock:build"

  # @zitadel/api's source is gitignored and produced by orval, so it is
  # generated first.
  typecheck:
    command: "corepack pnpm run typecheck"
    deps:
      - "api:generate"

  # The Vercel build (vercel.json): the bundled function plus the static
  # discovery document, which needs VERCEL_URL and so only runs there. Vercel
  # sets CI, so this must stay runnable in CI; GitHub CI never selects it.
  build-vercel:
    command: "corepack pnpm run wellknown"
    deps:
      - "build"
    options:
      cache: false

  test:
    command: "corepack pnpm run test"
    deps:
      - "api-mock:build"
