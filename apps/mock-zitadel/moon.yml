id: "mock-zitadel"
language: "typescript"
layer: "application"
stack: "backend"
dependsOn:
  - "api-mock"

tasks:
  # Bundle the function into a single self-contained JS file (see
  # tsdown.config.ts). The deployed entry imports this, not the workspace
  # TypeScript source.
  build:
    deps:
      - "api-mock:build"

  # The `typecheck` script generates @zitadel/api first (its source is
  # gitignored and produced by orval), so it is self-contained — it passes
  # whether run via Moon or standalone (e.g. the Vercel "TypeCheck"
  # deployment check, which runs the npm script in a sandbox without Moon).
  typecheck:
    deps:
      - "api-mock:build"

  test:
    deps:
      - "api-mock:build"

  # The static discovery document the Vercel deploy serves, written after the
  # function bundle is built. It needs VERCEL_URL, so only the Vercel build
  # (vercel.json) runs it; `moon ci` never requests it.
  generate-wellknown:
    command: "corepack pnpm run generate-wellknown"
    deps:
      - "build"
    options:
      cache: false
