id: "mock-zitadel"
language: "typescript"
layer: "application"
stack: "backend"
dependsOn:
  - "api-mock"

tasks:
  # Bundle the function into a single self-contained JS file (see
  # tsdown.config.ts). The deployed entry imports this, not the workspace
  # TypeScript source.
  build:
    deps:
      - "api-mock:build"

  # Its specs import @zitadel/api-mock.
  typecheck:
    deps:
      - "api-mock:build"

  test:
    deps:
      - "api-mock:build"
