id: "mock-zitadel"
language: "typescript"
layer: "application"
stack: "backend"
dependsOn:
  - "api-mock"

tasks:
  # Bundle the function into a single self-contained JS file (see
  # tsdown.config.ts). The deployed entry imports this, not the workspace
  # TypeScript source.
  build:
    command: "corepack pnpm run build"
    deps:
      - "api-mock:build"
    outputs:
      - "dist/**"

  lint:
    command: "corepack pnpm run lint"
    deps:
      - "api-mock:build"

  # @zitadel/api's source is gitignored and produced by orval, so it is
  # generated first.
  typecheck:
    command: "corepack pnpm run typecheck"
    deps:
      - "api:generate"

  # The Vercel build: the bundled function plus the static discovery document,
  # which needs VERCEL_URL and so only runs there. Kept out of CI; vercel.json
  # unsets Vercel's CI markers to run it, as the CI workflow does for its own
  # runInCI: false tasks.
  build-vercel:
    command: "corepack pnpm run build-vercel"
    deps:
      - "build"
    options:
      cache: false
      runInCI: false

  test:
    command: "corepack pnpm run test"
    deps:
      - "api-mock:build"

  # Local mock server for development.
  dev:
    command: "corepack pnpm run dev"
    options:
      cache: false
      persistent: true
      runInCI: false
