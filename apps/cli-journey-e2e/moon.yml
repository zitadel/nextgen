id: "cli-journey-e2e"
language: "typescript"
layer: "automation"
stack: "frontend"
dependsOn:
  - "cli"
  - "testing"

workspace:
  inheritedTasks:
    # An e2e suite: nothing to build; its specs run through `test` and `e2e`.
    exclude:
      - "build"

tasks:
  typecheck:
    deps:
      # The journey spec imports the kit's Playwright entry.
      - "testing:build"

  e2e:
    command: "corepack pnpm run e2e"
    env:
      # Our own e2e harness drives the real CLI binary (not under Vitest), so
      # disable telemetry to keep CI traffic out of the Mixpanel project and off
      # the per-command flush latency.
      ZITADEL_TELEMETRY: "0"
    deps:
      - "cli:build"
      # The journey spec imports the kit's virtual-passkey helper.
      - "testing:build"
    options:
      runInCI: false

  # e2e-local and e2e-testkit start moon themselves (`release:pack`), so moon
  # runs them with node directly: under `pnpm run`, the moon they start would
  # inherit pnpm's environment and warn about the platform-specific server
  # packages.
  e2e-local:
    command: "node scripts/run-local.mjs"
    env:
      ZITADEL_TELEMETRY: "0"
    deps:
      - "cli:build"
      - "testing:build"
    options:
      runInCI: false

  # Customer-configuration proof for @zitadel/testing: scaffold a fresh next
  # app, install the kit from the journey registry, and run its withZitadel()
  # suite against the published binary (embedded UIs, no env overrides).
  e2e-testkit:
    command: "node scripts/run-local.mjs --suite testkit"
    env:
      ZITADEL_TELEMETRY: "0"
    deps:
      - "cli:build"
      - "testing:build"
    options:
      runInCI: false
