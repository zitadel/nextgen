# Start from an empty folder. The common questions a developer asks the
# zitadel CLI, run as one stateful journey against a single project: each stage
# is a fresh agent task that builds on the project and server the stages before
# it left behind.
#
# The agent drives the CLI non-interactively but may still talk to the
# developer. A stage with a `user` persona is a conversation: a simulated
# developer answers the agent's questions from that persona.
#
# A stage passes on its outcome, not on what the agent said. After the agent's
# turn the harness checks the live instance (`assert`: a read command, a path
# into its JSON, an operator) and, when the stage names one, drives the
# scaffolded app in a browser (`app`). A stage with neither is graded by the
# rule named in `grade`.
cliSpec: "@zitadel/cli@latest"

stages:
  - id: 1
    title: Set up a project (agent elicits the fields and sign-in method)
    grade: setup
    prompt: >-
      I want to add sign-up and sign-in to the app in this directory using
      Zitadel. Set up a new Zitadel project and deploy it to a running local
      server. This is my app, so ask me whatever you need to decide how sign-up
      and sign-in should work rather than guessing.
    user: >-
      You are the developer who owns this app. You want people to sign up with
      their first name and last name, and sign in with a password. You do NOT
      want passkeys or single sign-on yet. Answer the agent's questions briefly
      and concretely from these preferences, and don't volunteer requirements
      it didn't ask about.
    app: register-signin
    assert:
      - name: a project exists on the instance
        get: project list
        path: items
        op: count-gte
        value: 1
      - name: deployed schema collects a first name
        get: schema get human-user
        path: [schema.properties.givenName, schema.properties.firstName]
        op: exists
      - name: deployed schema collects a last name
        get: schema get human-user
        path: [schema.properties.familyName, schema.properties.lastName]
        op: exists
      - name: password sign-in is enabled
        get: schema get human-user
        path: schema.x-auth-methods.password.enabled
        op: eq
        value: true
      - name: passkeys are NOT enabled (the developer said no)
        get: schema get human-user
        path: schema.x-auth-methods.passkey.enabled
        op: neq
        value: true

  - id: 2
    title: List all the projects
    grade: list-projects
    prompt: >-
      Using the zitadel CLI in this directory, list all the projects and tell me
      what you find. Drive the CLI non-interactively.
    assert:
      - name: exactly one project exists
        get: project list
        path: items
        op: count-eq
        value: 1

  - id: 3
    title: Does my project have a client id and secret?
    grade: inspect-credentials
    prompt: >-
      Using the zitadel CLI in this directory, does my project have a client id
      and a client secret? Check and tell me yes or no, with the evidence you
      used. Drive the CLI non-interactively.

  - id: 4
    title: Add a telephone number field and deploy
    grade: schema-has-phone
    prompt: >-
      Using the zitadel CLI in this directory, add a telephone number field to
      my user schema and deploy the change. Drive the CLI non-interactively.
    app: register-has-phone
    assert:
      - name: a phone field is live on the deployed schema
        get: schema get human-user
        path:
          - schema.properties.phoneNumber
          - schema.properties.telephoneNumber
          - schema.properties.phone
          - schema.properties.telephone
        op: exists

  - id: 5
    title: Enable passkeys and deploy
    grade: passkey-enabled
    prompt: >-
      Using the zitadel CLI in this directory, enable passkeys for my users and
      deploy the change. Drive the CLI non-interactively.
    app: signin-offers-passkey
    assert:
      - name: passkeys are enabled on the deployed schema
        get: schema get human-user
        path: schema.x-auth-methods.passkey.enabled
        op: eq
        value: true

  - id: 6
    title: Repeat a request without creating duplicates
    grade: repeat-request
    prompt: >-
      Using the zitadel CLI in this directory, add a telephone number field to
      my user schema and deploy the change. Drive the CLI non-interactively.
    app: register-has-phone
    assert:
      - name: still exactly one project
        get: project list
        path: items
        op: count-eq
        value: 1
      - name: the phone field is live on the deployed schema
        get: schema get human-user
        path:
          - schema.properties.phoneNumber
          - schema.properties.telephoneNumber
          - schema.properties.phone
          - schema.properties.telephone
        op: exists

  - id: 7
    title: Recover from a deploy that fails
    grade: recover-deploy
    # A teammate's change the server will refuse: a field with a misspelt type.
    prepare: >-
      node -e 'const fs=require("fs");const f=".zitadel/schemas/default-human-user.json";const s=JSON.parse(fs.readFileSync(f,"utf8"));s.properties.nickname={type:"strng",description:"A nickname"};fs.writeFileSync(f,JSON.stringify(s,null,2))'
    prompt: >-
      A teammate added a nickname field to the user schema in this directory,
      but deploying it fails. Using the zitadel CLI, get the nickname field
      deployed. Drive the CLI non-interactively.
    assert:
      - name: the nickname field is live on the deployed schema
        get: schema get human-user
        path: schema.properties.nickname.type
        op: eq
        value: string
      - name: the phone field is still live
        get: schema get human-user
        path:
          - schema.properties.phoneNumber
          - schema.properties.telephoneNumber
          - schema.properties.phone
          - schema.properties.telephone
        op: exists
