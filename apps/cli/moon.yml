id: "cli"
language: "typescript"
layer: "tool"
stack: "frontend"
dependsOn:
  - "api"
  - "api-mock"
  - "config"
  - "sdk-next"

tasks:
  lint:
    command: "corepack pnpm exec oxlint ."
    deps:
      - "api:build"
      - "config:build"
      - "sdk-next:build"

  typecheck:
    command: "corepack pnpm run typecheck"
    deps:
      - "api:build"
      - "config:build"
      - "sdk-next:build"

  build:
    command: "corepack pnpm run build"
    deps:
      - "api:build"
      - "config:build"
      - "sdk-next:build"
    inputs:
      # Default project files plus the telemetry build-channel env var, so a
      # production-stamped (release) build is never served from — or reused as —
      # a dev-stamped cache. See apps/cli/tsdown.config.ts.
      - "**/*"
      - "$ZITADEL_TELEMETRY_BUILD_CHANNEL"
    outputs:
      - "dist/**/*"
    options:
      mutex: "cli-dist"

  build-release:
    command: "corepack pnpm run build"
    env:
      ZITADEL_TELEMETRY_BUILD_CHANNEL: "production"
    deps:
      - "api:build-release"
      - "sdk-next:build-release"
    inputs:
      - "**/*"
      - "$ZITADEL_TELEMETRY_BUILD_CHANNEL"
    outputs:
      - "dist/**/*"
    options:
      cache: false
      # build-release rewrites the same dist/ the tests import from; the
      # mutex keeps it from cleaning the directory mid-test in the full
      # CI graph.
      mutex: "cli-dist"

  test:
    command: "corepack pnpm run test"
    deps:
      - "build"
      - "api-mock:build"
    options:
      mutex: "cli-dist"

  readme:
    command: "corepack pnpm run readme"
    deps:
      - "build"
    options:
      runInCI: false
