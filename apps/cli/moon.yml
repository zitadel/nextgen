id: "cli"
language: "typescript"
layer: "tool"
stack: "frontend"
dependsOn:
  - "api"
  - "api-mock"
  - "config"
  - "sdk-next"

tasks:
  lint:
    command: "corepack pnpm exec oxlint ."
    deps:
      - "api:build"
      - "config:build"
      - "sdk-next:build"

  typecheck:
    command: "corepack pnpm run typecheck"
    deps:
      - "api:build"
      - "config:build"
      - "sdk-next:build"

  build:
    command: "corepack pnpm run build"
    deps:
      - "api:build"
      - "config:build"
      - "sdk-next:build"
    inputs:
      # Default project files plus the telemetry build-channel env var, so a
      # production-stamped (release) build is never served from — or reused as —
      # a dev-stamped cache. See apps/cli/tsdown.config.ts.
      - "**/*"
      - "$ZITADEL_TELEMETRY_BUILD_CHANNEL"
    outputs:
      - "dist/**/*"

  clean-dist:
    command: "node ../../scripts/release-clean.mjs local-dist"
    deps:
      # Vitest drives oclif from apps/cli/dist. Clean only after those tests so
      # the production build can rewrite dist without racing the reader.
      - "test"
    options:
      cache: false
      runInCI: false

  build-release:
    command: "corepack pnpm run build"
    env:
      ZITADEL_TELEMETRY_BUILD_CHANNEL: "production"
    deps:
      - "clean-dist"
      - "api:build-release"
      - "sdk-next:build-release"
    inputs:
      - "**/*"
      - "$ZITADEL_TELEMETRY_BUILD_CHANNEL"
    outputs:
      - "dist/**/*"
    options:
      cache: false
      # Release builds rewrite dist after clean-dist removes stale package
      # output. They stay out of `moon ci`; release:snapshot invokes them in
      # the later release step instead of the normal build/test graph.
      runInCI: false

  test:
    command: "corepack pnpm run test"
    deps:
      - "build"
      - "api-mock:build"
    options:
      # The built oclif commands import @zitadel/{api,config,sdk-next} from
      # those packages' dist/ at runtime. Their build-release tasks rewrite
      # the same directories and cannot take a task dep on this target
      # (cli dependsOn them — the reverse edge would cycle the project
      # graph), so a shared mutex keeps them from cleaning a dist while
      # these tests import from it.
      mutex: "public-dist"

  readme:
    command: "corepack pnpm run readme"
    deps:
      - "build"
    options:
      runInCI: false
