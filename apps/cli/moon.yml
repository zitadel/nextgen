id: "cli"
language: "typescript"
layer: "tool"
stack: "frontend"
dependsOn:
  - "api"
  - "api-mock"
  - "config"
  - "sdk-next"

tasks:
  lint:
    command: "corepack pnpm exec oxlint ."
    deps:
      - "api:build"
      - "config:build"
      - "sdk-next:build"

  typecheck:
    command: "corepack pnpm run typecheck"
    deps:
      - "api:build"
      - "config:build"
      - "sdk-next:build"

  build:
    command: "corepack pnpm run build"
    deps:
      - "api:build"
      - "config:build"
      - "sdk-next:build"
    inputs:
      # Default project files plus the telemetry build-channel env var, so a
      # production-stamped (release) build is never served from — or reused as —
      # a dev-stamped cache. See apps/cli/tsdown.config.ts.
      - "**/*"
      - "$ZITADEL_TELEMETRY_BUILD_CHANNEL"
    outputs:
      - "dist/**/*"

  build-release:
    command: "corepack pnpm run build"
    env:
      ZITADEL_TELEMETRY_BUILD_CHANNEL: "production"
    deps:
      - "api:build-release"
      - "sdk-next:build-release"
      # Vitest drives oclif from apps/cli/dist. Run it before the production
      # build, whose tsdown clean step rewrites that same directory. This dep
      # also orders every writer of apps/cli/dist (build < test < build-release),
      # so the cli dist needs no mutex of its own.
      - "test"
    inputs:
      - "**/*"
      - "$ZITADEL_TELEMETRY_BUILD_CHANNEL"
    outputs:
      - "dist/**/*"
    options:
      cache: false

  test:
    command: "corepack pnpm run test"
    deps:
      - "build"
      - "api-mock:build"
    options:
      # The built oclif commands import @zitadel/{api,config,sdk-next} from
      # those packages' dist/ at runtime. Their build-release tasks rewrite
      # the same directories and cannot take a task dep on this target
      # (cli dependsOn them — the reverse edge would cycle the project
      # graph), so a shared mutex keeps them from cleaning a dist while
      # these tests import from it.
      mutex: "public-dist"

  readme:
    command: "corepack pnpm run readme"
    deps:
      - "build"
    options:
      runInCI: false
