id: "cli"
language: "typescript"
layer: "tool"
stack: "frontend"
dependsOn:
  - "api"
  - "api-mock"
  - "config"
  - "sdk-next"

tasks:
  lint:
    command: "corepack pnpm exec oxlint ."
    deps:
      - "api:build"
      - "config:build"
      - "sdk-next:build"

  typecheck:
    command: "corepack pnpm run typecheck"
    deps:
      - "api:build"
      - "config:build"
      - "sdk-next:build"

  build:
    command: "corepack pnpm run build"
    deps:
      - "api:build"
      - "config:build"
      - "sdk-next:build"
    inputs:
      # Default project files plus the telemetry build-channel env var, so a
      # production-stamped (release) build is never served from — or reused as —
      # a dev-stamped cache. See apps/cli/tsdown.config.ts.
      - "**/*"
      - "$ZITADEL_TELEMETRY_BUILD_CHANNEL"
    outputs:
      - "dist/**/*"

  build-release:
    script: |
      node ../../scripts/release-clean.mjs local-dist
      corepack pnpm run build
    env:
      ZITADEL_TELEMETRY_BUILD_CHANNEL: "production"
    deps:
      # No test dep: release builds promote, they do not re-verify. The gate
      # for shipping is green CI on the PRs that produced this commit;
      # check-release-graph asserts no test task appears in release graphs.
      - "api:build-release"
      - "sdk-next:build-release"
    inputs:
      - "**/*"
      - "$ZITADEL_TELEMETRY_BUILD_CHANNEL"
    outputs:
      - "dist/**/*"
    options:
      cache: false
      # Release builds remove stale package output and rebuild dist. They
      # stay out of `moon ci`; release:build invokes them in the release
      # step instead. The api/sdk-next release builds serialize against
      # dist readers through the public-dist mutex.
      runInCI: false

  test:
    command: "corepack pnpm run test"
    deps:
      - "build"
      - "api-mock:build"
    options:
      # The built oclif commands import @zitadel/{api,config,sdk-next} from
      # those packages' dist/ at runtime. Their build-release tasks rewrite
      # the same directories and cannot take a task dep on this target
      # (cli dependsOn them — the reverse edge would cycle the project
      # graph), so a shared mutex keeps them from cleaning a dist while
      # these tests import from it. Since release graphs no longer schedule
      # cli:test, the mutex only matters for explicit multi-target runs
      # (e.g. `moon run cli:test release:build`) — keep it, it costs
      # nothing and check-release-graph asserts it stays.
      mutex: "public-dist"

  readme:
    command: "corepack pnpm run readme"
    deps:
      - "build"
    options:
      runInCI: false
