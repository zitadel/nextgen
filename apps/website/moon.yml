id: "website"
language: "typescript"
layer: "application"
stack: "frontend"

tasks:
  typecheck:
    command: "corepack pnpm run typecheck"

  build:
    command: "corepack pnpm run build"
    outputs:
      - ".next/**/*"

  dev:
    command: "corepack pnpm run dev"
    options:
      persistent: true
      runInCI: false

  start:
    command: "corepack pnpm run start"
    deps:
      - "build"
    options:
      persistent: true
      runInCI: false
