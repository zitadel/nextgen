id: "teaser-video"
language: "typescript"
layer: "application"
stack: "frontend"
dependsOn:
  - "components"

workspace:
  inheritedTasks:
    # Nothing to build or test: the video renders on demand (`render`), which
    # is too slow for every CI run.
    exclude:
      - "build"
      - "test"

tasks:
  # Resolves @zitadel/components from source via the `@zitadel/source`
  # condition; its build keeps the generated api client present.
  typecheck:
    deps:
      - "components:build"

  # Remotion's bundler resolves the atoms to the package's dist/.
  dev:
    command: "corepack pnpm run dev"
    deps:
      - "components:build"
    options:
      persistent: true
      runInCI: false

  render:
    command: "corepack pnpm run render"
    deps:
      - "components:build"
    outputs:
      - "dist/**/*"
    options:
      runInCI: false
