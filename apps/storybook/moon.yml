id: "storybook"
language: "typescript"
layer: "application"
stack: "frontend"
dependsOn:
  - "api"
  - "api-mock"
  - "components"
  - "config"
  - "design-tokens"

tasks:
  typecheck:
    # Resolves workspace packages from source via the `@zitadel/source`
    # condition; these build deps (through api:build) keep the generated
    # api client present.
    deps:
      - "api-mock:build"
      - "components:build"

  build:
    deps:
      - "api-mock:build"
      - "components:build"
    # Runs in CI: the Vercel deploy builds the static site from this task, and
    # Vercel is a CI environment, so a `runInCI: false` here would make moon
    # report "no tasks found" for `storybook:build` and fail the deploy.

  # Installs the Chromium that @storybook/addon-vitest drives. Mirrors the
  # journey e2e pattern (browsers aren't preinstalled on CI runners).
  install-browsers:
    command: "corepack pnpm run install-browsers"
    options:
      cache: false

  # The component gate: addon-vitest runs every story as a real-browser test
  # (render smoke + play interactions + a11y). Replaces the old console-e2e
  # visual-parity sweep and runs in CI via `moon ci :test`.
  test:
    deps:
      - "install-browsers"
      - "api-mock:build"
      - "components:build"
    options:
      # Shared mutex with the other browser-mode suites so only one real-Chromium
      # Vite server runs at a time; concurrent servers starve under moon's CI
      # graph and drop module fetches. (#1490)
      mutex: "browser-tests"
      # Retry a failed browser suite in CI. The flake is a cold-start race:
      # the first attempt warms the Vite dep cache, so a retry runs warm and
      # clears the "Failed to fetch dynamically imported module" failure. (#1490)
      retryCount: 3

  # Loads the same packages as build.
  dev:
    command: "corepack pnpm run dev"
    deps:
      # .storybook/main.ts imports @zitadel/api-mock/public-dir under Node.
      - "api-mock:build"
      - "components:build"
    options:
      persistent: true
      runInCI: false
