id: "storybook"
language: "typescript"
layer: "application"
stack: "frontend"
dependsOn:
  - "api"
  - "api-mock"
  - "components"
  - "config"
  - "design-tokens"

tasks:
  typecheck:
    # Resolves workspace packages from source via the `@zitadel/source`
    # condition; these build deps (through api:build) keep the generated
    # api client present.
    deps:
      - "api-mock:build"
      - "components:build"

  build:
    deps:
      - "api-mock:build"
      - "components:build"
    # The cloud's storybook service builds the site with turbo
    # (`turbo run build`, repo-root vercel.json), not through this task.

  # Installs the Chromium that @storybook/addon-vitest drives. Mirrors the
  # journey e2e pattern (browsers aren't preinstalled on CI runners).
  install-browsers:
    command: "corepack pnpm exec playwright install chromium"
    options:
      cache: false

  # The component gate: addon-vitest runs every story as a real-browser test
  # (render smoke + play interactions + a11y). Replaces the old console-e2e
  # visual-parity sweep and runs in CI via `moon ci :test`.
  test:
    deps:
      - "install-browsers"
      - "api-mock:build"
      - "components:build"
    options:
      # Retry a failed browser suite in CI, as a safety net. It was added for
      # "Failed to fetch dynamically imported module": Chromium aborting module
      # imports when a container changes the host's addresses, which ci.yml's
      # "Keep Docker's interface churn away from Chromium" step prevents. (#1490)
      retryCount: 3

  # Loads the same packages as build.
  dev:
    command: "corepack pnpm run dev"
    deps:
      # .storybook/main.ts imports @zitadel/api-mock/public-dir under Node.
      - "api-mock:build"
      - "components:build"
    options:
      persistent: true
      runInCI: false
