id: "storybook"
language: "typescript"
layer: "application"
stack: "frontend"
dependsOn:
  - "api"
  - "api-mock"
  - "components"
  - "design-tokens"

tasks:
  typecheck:
    # Runs `tsc --build`: it compiles the referenced `api`/`api-mock` composite
    # projects (their `dist/*.d.ts` are not produced by their tsdown/no-op
    # `build` tasks) before type-checking the Storybook program. `api-mock:build`
    # is a no-op, but the dep edge makes Moon re-run this when api-mock source
    # changes, since `tsc --build` reads that source directly.
    command: "corepack pnpm run typecheck"
    deps:
      - "api:build"
      - "api-mock:build"
      - "components:build"
      - "design-tokens:build"

  build:
    command: "corepack pnpm run build"
    deps:
      - "api:build"
      - "components:build"
      - "design-tokens:build"
    outputs:
      - "dist/**/*"
    # Runs in CI: the Vercel deploy builds the static site from this task, and
    # Vercel is a CI environment, so a `runInCI: false` here would make moon
    # report "no tasks found" for `storybook:build` and fail the deploy.

  # Installs the Chromium that @storybook/addon-vitest drives. Mirrors the
  # journey e2e pattern (browsers aren't preinstalled on CI runners).
  install-browsers:
    command: "corepack pnpm exec playwright install chromium"
    options:
      cache: false

  # The component gate: addon-vitest runs every story as a real-browser test
  # (render smoke + play interactions + a11y). Replaces the old console-e2e
  # visual-parity sweep and runs in CI via `moon ci :test`.
  test:
    command: "corepack pnpm run test:all"
    deps:
      - "install-browsers"
      - "api:build"
      - "components:build"
      - "design-tokens:build"
    options:
      # Shared mutex with the other browser-mode suites so only one real-Chromium
      # Vite server runs at a time; concurrent servers starve under moon's CI
      # graph and drop module fetches. (#1490)
      mutex: "browser-tests"

  dev:
    command: "corepack pnpm run dev"
    options:
      persistent: true
      runInCI: false
