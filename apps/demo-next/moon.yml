id: "demo-next"
language: "typescript"
layer: "application"
stack: "frontend"
dependsOn:
  - "api"
  - "components"
  - "design-tokens"
  - "sdk-next"

workspace:
  inheritedTasks:
    # A demo app with no unit tests; demo-next-e2e covers it.
    exclude:
      - "test"

tasks:
  typecheck:
    deps:
      - "sdk-next:build"

  build:
    deps:
      - "sdk-next:build"
    outputs:
      - ".next/**/*"
    options:
      # Replaces the inherited dist/**/* rather than adding to it.
      mergeOutputs: "replace"

  dev:
    command: "corepack pnpm run dev"
    deps:
      - "sdk-next:build"
    options:
      persistent: true
      runInCI: false

  start:
    command: "corepack pnpm run start"
    deps:
      - "build"
    options:
      persistent: true
      runInCI: false
