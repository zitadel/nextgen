id: "demo-next"
language: "typescript"
layer: "application"
stack: "frontend"
dependsOn:
  - "api"
  - "components"
  - "design-tokens"
  - "sdk-next"

tasks:
  lint:
    command: "pnpm exec oxlint ."
    deps:
      - "api:build"
      - "sdk-next:build"

  typecheck:
    command: "pnpm run typecheck"
    deps:
      - "api:build"
      - "sdk-next:build"

  build:
    command: "pnpm run build"
    deps:
      - "api:build"
      - "sdk-next:build"
    outputs:
      - ".next/**/*"

  dev:
    command: "pnpm run dev"
    deps:
      - "api:build"
      - "sdk-next:build"
    options:
      persistent: true
      runInCI: false

  start:
    command: "pnpm run start"
    deps:
      - "build"
    options:
      persistent: true
      runInCI: false
