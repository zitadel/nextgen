name: demo_flutter
description: Reference Flutter app for the Zitadel NextGen Flutter SDK.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  # Path dependency: the demo always exercises the in-repo SDK, mirroring
  # how apps/demo-next consumes the workspace packages.
  zitadel_flutter:
    path: ../../packages/sdk-flutter
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
