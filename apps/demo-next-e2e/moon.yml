id: "demo-next-e2e"
language: "typescript"
layer: "automation"
stack: "frontend"
dependsOn:
  - "api-mock"
  - "demo-next"
  - "testing"

tasks:
  lint:
    command: "corepack pnpm exec oxlint ."

  typecheck:
    command: "corepack pnpm run typecheck"
    deps:
      # The real-instance config and src-real specs import
      # @zitadel/testing/playwright.
      - "testing:build"

  e2e:
    command: "corepack pnpm exec playwright test"
    deps:
      - "api-mock:build"
      - "demo-next:build"
    options:
      runInCI: false

  # Same sign-in journey against a real ephemeral instance seeded via
  # @zitadel/testing instead of api-mock. Boots a server + SQLite local default.
  e2e-real:
    command: "corepack pnpm exec playwright test --config playwright.real.config.mts"
    deps:
      - "testing:build"
      - "cli:build"
      - "server:build"
      - "demo-next:build"
    env:
      ZITADEL_SERVER_BINARY: "$workspaceRoot/dist/server/nextgen"
      # server:build embeds the console/login UIs via its task deps; this
      # suite drives the app-embedded <zitadel-login>, so the server-hosted
      # UIs stay off to pin that path.
      NEXTGEN_SERVER_LOGIN_ENABLED: "false"
      NEXTGEN_SERVER_CONSOLE_ENABLED: "false"
    options:
      cache: false
      runInCI: false

