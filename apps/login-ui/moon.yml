id: "login-ui"
language: "typescript"
layer: "application"
stack: "frontend"
dependsOn:
  - "components"
  - "design-tokens"

tasks:
  typecheck:
    deps:
      - "components:build"
      - "design-tokens:build"

  test:
    deps:
      - "components:build"
      - "design-tokens:build"

  build:
    deps:
      - "components:build"
      - "design-tokens:build"
    outputs:
      - "/internal/staticui/login/dist/**/*"
    options:
      # Replaces the inherited dist/**/* rather than adding to it.
      mergeOutputs: "replace"

  build-release:
    command: "corepack pnpm run build"
    deps:
      - "components:build-release"
      - "design-tokens:build"
    outputs:
      - "/internal/staticui/login/dist/**/*"
    options:
      cache: false
      # Release UI builds consume package release output and run from the later
      # release step instead of the normal `moon ci` build/test graph.
      runInCI: false

  dev:
    command: "corepack pnpm run dev"
    options:
      persistent: true
      runInCI: false

  preview:
    command: "corepack pnpm run preview"
    deps:
      - "build"
    options:
      persistent: true
      runInCI: false
