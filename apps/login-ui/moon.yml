id: "login-ui"
language: "typescript"
layer: "application"
stack: "frontend"
dependsOn:
  - "components"
  - "design-tokens"

tasks:
  typecheck:
    deps:
      - "components:build"

  test:
    deps:
      - "components:build"

  build:
    deps:
      - "components:build"
    outputs:
      - "/internal/staticui/login/dist/**/*"
    options:
      # Replaces the inherited dist/**/* rather than adding to it.
      mergeOutputs: "replace"

  build-release:
    command: "corepack pnpm run build"
    deps:
      - "components:build-release"
    outputs:
      - "/internal/staticui/login/dist/**/*"
    options:
      cache: false
      # Release UI builds consume package release output and run from the later
      # release step instead of the normal `moon ci` build/test graph.
      runInCI: false

  # The same deps as build: components has no `@zitadel/source` entry, so the
  # dev server loads its dist.
  dev:
    command: "corepack pnpm run dev"
    deps:
      - "components:build"
    options:
      persistent: true
      runInCI: false

  preview:
    command: "corepack pnpm run preview"
    deps:
      - "build"
    options:
      persistent: true
      runInCI: false
