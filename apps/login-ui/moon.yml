id: "login-ui"
language: "typescript"
layer: "application"
stack: "frontend"
dependsOn:
  - "components"
  - "design-tokens"

tasks:
  lint:
    command: "corepack pnpm exec oxlint ."
    deps:
      - "components:build"
      - "design-tokens:build"

  typecheck:
    command: "corepack pnpm run typecheck"
    deps:
      - "components:build"
      - "design-tokens:build"

  build:
    command: "corepack pnpm run build"
    deps:
      - "components:build"
      - "design-tokens:build"
    outputs:
      - "/internal/staticui/login/dist/**/*"

  build-release:
    command: "corepack pnpm run build"
    deps:
      - "components:build-release"
      - "design-tokens:build"
    outputs:
      - "/internal/staticui/login/dist/**/*"
    options:
      cache: false
      # Release builds rewrite the same dist/ that dev builds produce and
      # consumer tasks read. They are excluded from `moon ci` (the
      # release:snapshot workflow step builds them afterwards, serially)
      # so a release clean step can never wipe a dist mid-consumption.
      runInCI: false

  dev:
    command: "corepack pnpm run dev"
    options:
      persistent: true
      runInCI: false

  preview:
    command: "corepack pnpm run preview"
    deps:
      - "build"
    options:
      persistent: true
      runInCI: false
