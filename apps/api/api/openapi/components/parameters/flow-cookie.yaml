name: _zflow
in: cookie
required: true
description: |
  Encrypted flow state cookie set by `POST /flow` or the previous
  `POST /flow/{id}/submit`. The cookie holds the sealed state of one
  flow; the `{id}` path parameter must name that flow, any other id is
  refused.

  Browsers send this automatically; non-browser clients must capture the
  `Set-Cookie` header and resend it.
schema:
  type: string
  # The value is the encrypted state token the server issued (a compact JWE:
  # base64url segments joined by dots), so these are the only characters it can
  # hold. Anything else is `flow.cookie_invalid`, which the fuzzer would
  # otherwise generate as a "valid" request.
  pattern: '^[A-Za-z0-9._-]+$'
