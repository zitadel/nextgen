name: release_id
in: query
required: false
description: |
  Narrows the list to the deployments of this release: the `id` that
  `createRelease` (`POST /releases`) returns or `listReleases`
  (`GET /releases`) lists. A release no deployment of the project made live
  answers an empty list, not an error.
schema:
  $ref: '../schemas/release-id.yaml'
