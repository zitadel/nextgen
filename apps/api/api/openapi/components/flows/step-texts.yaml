type: object
description: |
  Step-level localization keys. Resolved client-side via the `| t` LiquidJS filter.
  The backend never sends display text — only semantic keys.
properties:
  title_key:
    type: string
    description: Localization key for the step heading.
    example: identifier.title
  description_key:
    oneOf:
      - type: string
      - type: 'null'
    description: |
      Localization key for explanatory text: `<step>.description`, or
      `<step>.description.sso` when the step offers sign-in providers
      (`sso_providers`). A client without the `.sso` key falls back to
      `<step>.description`.
    example: identifier.description
