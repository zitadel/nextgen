type: object
required: [id, project_id, flow_definition, created_at, updated_at]
properties:
  id:
    type: string
    description: The ID of the flow definition.
    example: fd_123abc456def
  project_id:
    type: string
    description: The ID of the project this flow definition belongs to.
    example: proj_789ghi012jkl
  flow_definition:
    $ref: flow-definition.yaml
  user_schema:
    readOnly: true
    description: |
      The user schema this flow operates on: the same object
      `getSchema` (`GET /schemas/{schema_id}`) returns. Present only when the request asked for it
      with `expand=user_schema`; `null` when it was requested but the
      referenced schema no longer resolves or the caller may not read it.
    oneOf:
      - $ref: ../../endpoints/schemas/schema.yaml
      - type: 'null'
  created_at:
    type: string
    format: date-time
    description: When the flow definition was created.
    example: '2020-01-28T14:25:39.123456Z'
  updated_at:
    type: string
    format: date-time
    description: When the flow definition was last updated.
    example: '2020-01-28T14:25:39.123456Z'