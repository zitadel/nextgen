type: object
additionalProperties: false
required: [protocol, challenge_id, profile_id, salt, nonce, key_prefix, expires_at]
description: |
  A short-lived, single-use signup challenge scoped to this project and flow.
  For pbkdf2_sha256_5000_l1, try counters 0 through 511, deriving 32 bytes with
  PBKDF2-HMAC-SHA256 (5000 iterations), password nonce || uint32_be(counter),
  and the supplied salt. Match the first 16 derived bytes to key_prefix.
  Submit gate_proofs.signup_pow as a JSON string containing protocol,
  challenge_id and derived_key (the full 32 bytes in lowercase hex).
  The proof is spent before the user is created (for a password, before it
  is hashed), even if user creation fails.
properties:
  protocol:
    type: string
    description: 'The proof-of-work protocol the client solves, such as `zitadel_pow_poc_v1`.'
    example: zitadel_pow_poc_v1
  challenge_id:
    type: string
    description: 'The unique ID of this challenge, which the client sends back with its proof.'
    example: ch_example
  profile_id:
    type: string
    description: 'The work profile that fixes the hash and the cost of solving the challenge, such as `pbkdf2_sha256_5000_l1`.'
    example: pbkdf2_sha256_5000_l1
  salt:
    type: string
    minLength: 1
    description: 'The salt, as 32 lowercase hex digits, that the client derives the key with.'
    pattern: '^[0-9a-f]{32}$'
    x-zitadel-pattern-message: "must be 32 lowercase hex digits"
  nonce:
    type: string
    minLength: 1
    description: 'The nonce, as 32 lowercase hex digits, that the client derives the key with.'
    pattern: '^[0-9a-f]{32}$'
    x-zitadel-pattern-message: "must be 32 lowercase hex digits"
  key_prefix:
    type: string
    minLength: 1
    description: 'The first 16 bytes of the derived key, as 32 lowercase hex digits, that the client matches.'
    pattern: '^[0-9a-f]{32}$'
    x-zitadel-pattern-message: "must be 32 lowercase hex digits"
  expires_at:
    type: string
    description: 'When the challenge expires. A proof sent after this is refused.'
    format: date-time
