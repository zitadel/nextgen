type: object
additionalProperties: false
dependentRequired:
  font_url: [font_family]
description: |
  The typeface the login surface renders in. One face covers both body and
  headings; separate heading and mono faces are not modeled yet.
properties:
  font_family:
    type: string
    minLength: 1
    maxLength: 256
    pattern: '^ *(?:"[^"\\;{}]*"|''[^''\\;{}]*''|[A-Za-z0-9_-]+(?: [A-Za-z0-9_-]+)*)(?: *, *(?:"[^"\\;{}]*"|''[^''\\;{}]*''|[A-Za-z0-9_-]+(?: [A-Za-z0-9_-]+)*))* *$'
    x-zitadel-pattern-message: "must be comma-separated font names, each an identifier (Inter, ui-sans-serif) or a quoted name (\"APK Futural\")"
    description: |
      CSS font stack for body and heading text. Include a generic family so
      the surface still renders when the named face is unavailable.

      Comma-separated family names, each either an identifier (`Inter`,
      `ui-sans-serif`, `Helvetica Neue`) or a quoted name (`"APK Futural"`).
      Anything else is rejected. The stack is written into a stylesheet, so
      only names are stored, and a quoted name must close the quote it opened.
    example: Inter, ui-sans-serif, sans-serif
  font_url:
    type: string
    format: uri
    maxLength: 2048
    description: |
      Stylesheet that loads `font_family`, for example a Google Fonts CSS URL.
      Must be https; unlike the logo and hero assets there is no
      loopback carve-out. Rejected without `font_family`, which would name
      nothing to paint with.

      Loaded only when the login component runs as `variant="page"`, the
      full-page login. In the default `variant="widget"` it is stored but not
      loaded: the component injects no stylesheet, and the embedding page
      loads the face.
    example: https://fonts.googleapis.com/css2?family=Inter&display=swap
    pattern: '^[hH][tT][tT][pP][sS]://(?:\[(?:(?:[0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}|(?:[0-9A-Fa-f]{1,4}:){1,7}:|(?:[0-9A-Fa-f]{1,4}:){1,6}:[0-9A-Fa-f]{1,4}|(?:[0-9A-Fa-f]{1,4}:){1,5}(?::[0-9A-Fa-f]{1,4}){1,2}|(?:[0-9A-Fa-f]{1,4}:){1,4}(?::[0-9A-Fa-f]{1,4}){1,3}|(?:[0-9A-Fa-f]{1,4}:){1,3}(?::[0-9A-Fa-f]{1,4}){1,4}|(?:[0-9A-Fa-f]{1,4}:){1,2}(?::[0-9A-Fa-f]{1,4}){1,5}|[0-9A-Fa-f]{1,4}:(?::[0-9A-Fa-f]{1,4}){1,6}|:(?:(?::[0-9A-Fa-f]{1,4}){1,7}|:)|(?:[0-9A-Fa-f]{1,4}:){6}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|::(?:[0-9A-Fa-f]{1,4}:){0,5}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|[0-9A-Fa-f]{1,4}::(?:[0-9A-Fa-f]{1,4}:){0,4}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|[0-9A-Fa-f]{1,4}(?::[0-9A-Fa-f]{1,4})::(?:[0-9A-Fa-f]{1,4}:){0,3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|[0-9A-Fa-f]{1,4}(?::[0-9A-Fa-f]{1,4}){2}::(?:[0-9A-Fa-f]{1,4}:){0,2}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|[0-9A-Fa-f]{1,4}(?::[0-9A-Fa-f]{1,4}){3}::(?:[0-9A-Fa-f]{1,4}:){0,1}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|[0-9A-Fa-f]{1,4}(?::[0-9A-Fa-f]{1,4}){4}::(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3})\]|(?:[^\s\\/:?#@%\[\]{}|^`\x00-\x1f\x7f]|%[89A-Fa-f][0-9A-Fa-f])+)(?::0*(?:[0-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?(?:/(?:[^%?\x00-\x1f\x7f]|%[0-9A-Fa-f]{2})*)?(?:\?[^\x00-\x1f\x7f]*)?$'
    x-zitadel-pattern-message: "must be a valid absolute https URL without credentials"
  scale:
    type: number
    minimum: 0.75
    maximum: 1.25
    description: Multiplier on the base text sizes, `1` when omitted.
    example: 1
