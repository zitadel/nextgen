type: object
required: [id, session_id, step]
properties:
  id:
    type: string
    description: |
      Flow handle. Use this as the path parameter for subsequent
      submit/event calls. May change between responses when a
      flow pivot or pop occurs.
    example: flow_01H8Z
  session_id:
    type: string
    description: Underlying session ID. Stable across all stacked flows.
  session_token:
    type: string
    description: Reserved for future rotation. The sealed `_zflow` cookie carries the flow state today.
  step:
    $ref: flow-step.yaml
  branding:
    $ref: branding.yaml
    description: |
      Resolved branding inherited from the app → team → project hierarchy.
      Determined at flow creation based on audience context. Does not change between steps.
  client:
    $ref: flow-client.yaml
    description: |
      The client the flow signs the user in to. Present on every response of
      a flow that carries an authorization request (`auth_request_id`).
  redirect_uri:
    type: string
    format: uri
    description: |
      Present when `step.complete` is `redirect`. For a flow that carries an
      authorization request, it is the client's redirect URI with the
      answer: `code`, `state` and `iss`, or an `error` (RFC 9207). Exchange
      `handoff_token` first when it is present, so the user stays signed in
      here too (ADR 081 §9).
  handoff_token:
    type: string
    description: |
      Short-lived, audience-bound token produced on flow completion.
      Exchange it for a session via `POST /sessions/exchange`.
      Only present when `step.complete` is set.
  handoff_token_expires_at:
    type: string
    format: date-time
    description: |
      Expiry timestamp for `handoff_token`. Only present when
      `handoff_token` is set.
