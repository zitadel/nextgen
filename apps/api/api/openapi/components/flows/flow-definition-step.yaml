type: object
required: [name]
additionalProperties: false
# A step is rejected when it matches any of these shapes.
not:
  anyOf:
    # sso_providers offered without an sso_authenticated transition to route to
    - required: [sso_providers]
      properties:
        sso_providers: { minItems: 1 }
      anyOf:
        - not: { required: [transitions] }
        - properties:
            transitions:
              not: { required: [sso_authenticated] }
    # a terminal step that also collects, acts, gates or transitions
    - required: [complete]
      anyOf:
        - required: [fields]
          properties: { fields: { minItems: 1 } }
        - required: [actions]
          properties: { actions: { minItems: 1 } }
        - required: [sso_providers]
          properties: { sso_providers: { minItems: 1 } }
        - required: [gates]
          properties: { gates: { minProperties: 1 } }
        - required: [transitions]
          properties: { transitions: { minProperties: 1 } }
    # a non-terminal step that does nothing
    - not: { required: [complete] }
      properties:
        fields: { maxItems: 0 }
        actions: { maxItems: 0 }
        sso_providers: { maxItems: 0 }
        gates: { maxProperties: 0 }
        transitions:
          not: { required: [sso_authenticated] }
    # an sso outcome that declares purpose or action: it carries a bound user
    # or parked claims, which a re-purpose would drop and another flow cannot
    # receive. Only a string counts, so an explicit null stays legal.
    - required: [transitions]
      properties:
        transitions:
          anyOf:
            - required: [sso_authenticated]
              properties:
                sso_authenticated:
                  anyOf:
                    - { required: [purpose], properties: { purpose: { type: string } } }
                    - { required: [action], properties: { action: { type: string } } }
            - required: [sso_user_not_found]
              properties:
                sso_user_not_found:
                  anyOf:
                    - { required: [purpose], properties: { purpose: { type: string } } }
                    - { required: [action], properties: { action: { type: string } } }
description: |
  A step in a flow definition. This is the admin-authored configuration,
  not the runtime payload sent to the frontend.

  Steps are schema-driven: `fields` references properties from the flow's
  user schema, and the engine resolves field metadata (type, validation,
  implicit outcomes) from schema annotations at runtime.

  A step with only `complete` set is a terminal step. All other steps are
  rendered to the frontend as capability payloads.
properties:
  name:
    type: string
    description: |
      Unique step identifier within this flow. Used as transition targets
      and returned in the API response as `step.name`.
    pattern: "^[a-z][a-z0-9_-]*$"
    example: login

  fields:
    type: array
    description: |
      Schema property names to collect from the user. Each entry references
      a property in the flow's user schema. The engine resolves field type,
      validation rules, and implicit outcomes from schema annotations
      (e.g. a property with `x-unique` set implies a `user_not_found`
      transition outcome).
    items:
      type: string
    uniqueItems: true
    default: []
    example: [email, password]

  actions:
    type: array
    description: |
      Ordered list of actions the user can take. The action name is what the
      frontend sends back in the submit request. If omitted, the engine
      provides a default `submit` action.
    items:
      $ref: step-action.yaml
    default: []
    example:
      - name: submit
        kind: submit
        primary: true
      - name: forgot_password
        kind: navigate

  gates:
    type: object
    description: |
      Security gates that must be satisfied before submission. Keyed by gate
      name. Each gate selects a kind (e.g. "captcha") and provider-specific
      configuration. The engine may also inject gates dynamically based on
      policy.
    additionalProperties:
      $ref: gate.yaml
    default: {}
    example:
      bot_check:
        kind: captcha
        provider: altcha

  sso_providers:
    type: array
    description: |
      Slugs of the identity provider connections this step offers, in display
      order. Each names the `slug` of a connection under `.zitadel/idps/`; the
      connection carries the display name and template, so a rename there
      reaches every step without editing the flow. The rendered step the client
      receives carries the resolved `{id, name, template}` objects instead. A
      step offers at most 20 providers.
    uniqueItems: true
    maxItems: 20
    items:
      type: string
      pattern: ^[a-z0-9][a-z0-9_-]*$
      maxLength: 64
    default: []
    example: [google]

  on_success:
    type: string
    enum: [create_user, create_user_with_sso]
    description: |
      Server-side mutation to execute when this step completes successfully.
      Runs after field validation passes, before the transition fires.

      - create_user: creates the user record (registration flows)
      - create_user_with_sso: creates the user record from the identity an
        external provider returned and the values the step collected, and
        links it to that identity. A unique value another user holds binds
        that user and routes user_already_exists instead.
    example: create_user

  complete:
    type: string
    enum: [redirect, show]
    example: redirect
    description: |
      Marks this as a terminal step. Tells the frontend what to do:
      - redirect: navigate to redirect_uri (OIDC/SAML callback done)
      - show: render as a success/info screen

  transitions:
    type: object
    description: |
      Maps action and outcome names to where the flow goes next.

      A key is either the `name` of an action in `actions` (the user chose
      it) or an outcome the engine raises on its own:

      - `user_not_found`: an identifier with no account. Following this
        transition also switches the flow to `register`.
      - `user_already_exists`: an identifier that has an account, typed on
        a sign-up or returned by a provider's sign-in. Following this
        transition also switches the flow to `login`.
      - `sso_authenticated`: a provider's sign-in matched an account.
      - `sso_user_not_found`: a provider's sign-in matched no account.

      Each action needs its transition, and a step that offers
      `sso_providers` needs `sso_authenticated`; the server requires no
      other outcome. `zitadel deploy` also requires `sso_user_not_found` and
      `user_already_exists` on a step that offers a provider that creates
      users, since a provider's sign-in can raise both. An outcome the step
      has no transition for leaves the user on the step with that outcome's
      error (for example `error.user_not_found`), so a flow that leaves out
      `user_not_found` signs in only users that already exist.
    additionalProperties:
      type: object
      description: |
        Where the flow goes: a step (`target`), or the entry step of another
        purpose (`purpose`). Set at least one of them.
      properties:
        target:
          type: string
          minLength: 1
          description: |
            Step name within this flow (when `action` is null), or the name
            of another flow (when `action` is `switch` or `pivot`). Optional
            when `purpose` is set: the transition then goes to that purpose's
            entry step.
          example: password
        action:
          oneOf:
            - type: string
              enum: [switch, pivot]
            - type: 'null'
          description: |
            Reserved for transitions to another flow definition. The engine
            does not run them yet: taking one fails with `flow.unsupported`.
            Keep transitions within one flow definition, and use `purpose`
            to move between signing in and signing up.

            How `target` will be read:
            - null (omitted): a step in the current flow.
            - switch: replace the current flow with the target flow.
              No return — the current flow is discarded.
            - pivot: push the target flow onto the stack. The current flow
              is paused and resumes when the target flow completes (auto-pop).
        purpose:
          oneOf:
            - type: string
              enum: [login, register, recovery, profiling, reauth, link_account]
            - type: 'null'
          description: |
            Switches the flow to this purpose and goes to its entry step,
            starting it fresh: the user the flow found so far and the
            password collected for them are dropped. The flow's original
            purpose stays pinned. Must be a purpose this definition serves.
            `target` may be left out; when it is set it must name that
            purpose's entry step. Mutually exclusive with `action`.
            Example: a "Sign up" navigation on the login identifier step
            (`{ purpose: register }`).
      additionalProperties: false
      # A transition is rejected when it matches any of these shapes.
      not:
        anyOf:
          # both a purpose and an action
          - required: [purpose, action]
            properties:
              purpose:
                type: string
              action:
                type: string
          # neither a target nor a purpose
          - not: { required: [target] }
            properties:
              purpose:
                type: 'null'
    example:
      submit:
        target: password
      user_not_found:
        target: register
      register:
        purpose: register
