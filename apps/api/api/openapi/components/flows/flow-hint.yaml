type: object
description: Optional hints that narrow how the server resolves and starts a flow.
properties:
  login_name:
    type: string
    description: Submits the identifier step automatically. Maps to the OIDC `login_hint`.
  team_id:
    type: string
    description: Scopes flow resolution to a team.
  user_schema_id:
    type: string
    description: Scopes to a specific user type, the `objectType` of a user schema.
  app_id:
    type: string
    description: Scopes to a specific application.
