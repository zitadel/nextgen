type: object
description: |
  Creates a flow definition.
  The flow definition is created in an `active` state by default.
  The status can also be set via the `status` attribute in the flow definition payload.
required:
  - project_id
  - flow_definition
properties:
  project_id:
    $ref: ../../components/schemas/project-id.yaml
  schema_uri:
    $ref: ../../components/schemas/schema-uri.yaml
  flow_definition:
    $ref: flow-definition.yaml