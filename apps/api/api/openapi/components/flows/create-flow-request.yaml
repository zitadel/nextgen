type: object
required: [project_id, purpose]
properties:
  project_id:
    $ref: ../schemas/project-id.yaml
  purpose:
    type: string
    enum: [login, register, recovery, profiling, reauth, link_account]
  flow_definition_name:
    type: string
    pattern: '^[a-z][a-z0-9-]*$'
    description: |
      Name of a specific flow definition to use.
      When omitted, the engine selects the best-matching definition
      based on purpose + audience context.
    example: custom-login
  dry_run:
    type: boolean
    description: |
      Set to true to simulate the flow without actually creating any
      user or session. Useful for testing and validation of flow definitions.
      This requires setting the `flow_definition_name` property as well.
    example: false
    default: false
  schema_version:
    type: string
    description: |
      Semver version of the flow definition JSON Schema to use.
      When omitted, the latest version is used.
    pattern: '^\d+\.\d+\.\d+$'
    example: "1.0.0"
  challenge_nonce:
    $ref: ../schemas/challenge-nonce.yaml
  session_id:
    type: string
    description: |
      Existing session to attach to (for step-up / reauth).
      Omit to let the flow create a new session implicitly.
      Requires `session_token`.
  session_token:
    $ref: ../schemas/session-proof-token.yaml
  auth_request_id:
    type: string
    description: |
      The authorization request this flow answers: the `auth_request`
      parameter of the login page's URL, where the authorization endpoint
      sent the browser (ADR 081 §8). Send it on every `POST /flow` the page
      makes for that request, restarts included. The endpoint bound it to
      the browser with a cookie, so it answers only in the browser that
      made the request; anywhere else, or once the request expired, the
      call fails with `flow.auth_request_invalid`. Cannot be combined with
      `redirect_uri`: the flow ends in a redirect to the client.

      With a live session in the browser, the response may already be the
      `consent` step or a terminal `redirect`.
  redirect_uri:
    type: string
    format: uri
  hint:
    $ref: flow-hint.yaml
