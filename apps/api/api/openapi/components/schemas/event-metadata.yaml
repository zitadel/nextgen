type: object
# "Path A" is the request.api emit path.
description: |
  Metadata the server records when it emits the event, already redacted when
  written. An event from an API request (`request.api`) may set `client`
  (`ip`, `user_agent`, `origin`), so a SIEM can join it on `request_id`. It is
  not a live risk-evaluator input.
additionalProperties: true
properties:
  # The authorization path is defined in ADR 053 §8; the platform operator in ADR 075.
  authorization:
    description: |
      What authorized the request, when it was not a grant on the event's
      project. Every event of such a request carries it.
    type: object
    additionalProperties: false
    required:
      - path
    properties:
      path:
        type: string
        description: |
          `platform_operator`: the deployment's platform operator relation,
          which administers every project.
        enum:
          - platform_operator
      actor_home_project_id:
        type: string
        description: The project the actor's user belongs to.
  client:
    description: The observed HTTP requestor context, set only on events from an API request (`request.api`).
    type: object
    additionalProperties: false
    properties:
      ip:
        type: string
        description: The client IP, from the first `X-Forwarded-For` hop or the remote address.
      user_agent:
        type: string
        description: The observed `User-Agent` header.
      origin:
        type: string
        description: The `Origin` header, when present.
