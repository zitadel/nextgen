title: Origin
type: string
description: |
  A web origin: `http` or `https`, a lowercase host (a DNS name or a
  bracketed IPv6 address) and, when it is not the scheme's default, a port
  from 1 to 65535. No user info, path, query or fragment, and no trailing
  slash. Compared exactly, so `https://app.acme.com` and
  `https://app.acme.com:443` are different strings.
pattern: '^https?://(\[[0-9a-f:.]+\]|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*)(:(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3}))?$'
maxLength: 2048
example: https://app.acme.com
