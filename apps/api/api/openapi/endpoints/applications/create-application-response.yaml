description: |
  An application as `publishApplication` (`POST /applications`) wrote it, with
  its document as `definition` and the secrets of the clients it created.
allOf:
  - $ref: application-response.yaml
  - type: object
    properties:
      client_secrets:
        type: array
        items:
          $ref: application-client-secret.yaml
        description: |
          The secrets this write generated, one for each confidential client
          it created, each with the client's `client_id`. A public client has
          none. Absent or empty when the write created no confidential
          client. Each secret is shown only once.
