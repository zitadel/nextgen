type: object
description: A client secret the server generated, returned once.
required:
  - client
  - client_id
  - secret
properties:
  client:
    type: string
    description: The slug of the client the secret belongs to.
    example: web
  client_id:
    type: string
    description: The `client_id` the client presents together with the secret.
    example: client_01KWH3B72K7M7F0N9WD3P2E4YP
  secret:
    type: string
    description: |
      The secret, shown only in this response. Save it securely: the server cannot return it again.
    example: sk_client_7Kp2mQx9vR4tL8nB3wZ5yH6jF1dS0aE2
