post:
  operationId: publishApplication
  summary: Create or revise a registered application
  description: |
    Creates or revises a registered application that authenticates its users
    via Zitadel. If the slug does not already exist in the project, a new
    application is created. If one with that slug already exists, a revision
    is created.

    A revision gets a new `revision_id` and does not modify the application's
    `id`. Sending an unchanged document also creates a revision. Each client
    is matched to the stored one by its slug and keeps its `client_id`: a
    revision that changes a client's `client_id` is rejected with
    `app.field_immutable`. A revision keeps every client of the
    stored document: one that omits a client is also rejected with
    `app.field_immutable`, since removing a client is not available
    yet. A client with a new slug is a new client. It takes the `client_id`
    the document supplies, or the server generates one, and every response
    carries it in `definition`. A `client_id` another client of the project
    holds, or ever held, is rejected with `app.client_id_taken`.

    Every new client gets a secret, generated by the server and returned once
    in `client_secrets`. The server stores only its hash, so no later read
    returns it.

    The document is validated against the `application.json` schema before
    anything is stored, and then against the rules the authorization server
    applies: `refresh_token` comes with `authorization_code`, a client with
    `authorization_code` has at least one redirect URI, and each redirect
    URI meets the rules `redirect_uris` states. A document that breaks one
    is refused with `app.invalid`, whose details identify the
    setting.

    If the document is refused, no change is stored and an existing
    application keeps its current revision.
  tags:
    - Applications
  security:
    - oauth2:
        - application.write
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
    - $ref: ../../components/parameters/idempotency-key.yaml
      description: |
        Optional. Once honored, a retry with the same key and body returns
        the first request's status and a new secret for each client the first
        request created, and writes no revision.

        Not honored yet: sending the same request again, for example after
        its response was lost, creates another revision and returns no
        secret, because the clients the first request created are already
        stored.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: create-application-request.yaml
        examples:
          shop:
            summary: A web application with one confidential client
            description: |
              The client leaves `client_id` out, so the server generates one.
            value:
              application:
                slug: shop
                name: Shop
                clients:
                  - slug: web
                    type: confidential
                    grant_types:
                      - authorization_code
                      - refresh_token
                    redirect_uris:
                      - https://shop.example.com/callback
                      - http://localhost:3000/callback
          imported:
            summary: A client that keeps the id a Zitadel v4 issued
            value:
              application:
                slug: shop
                name: Shop
                clients:
                  - slug: web
                    client_id: 289374592837459283@shop
                    type: confidential
                    grant_types:
                      - authorization_code
                    redirect_uris:
                      - https://shop.example.com/callback
  responses:
    '200':
      description: |
        The revised application.
      content:
        application/json:
          schema:
            $ref: create-application-response.yaml
          examples:
            revised:
              summary: The application after a revision that added a client
              description: |
                `id` is the one allocated when the application was created,
                `revision_id` is new, and `updated_at` has moved past
                `created_at`. The new client `jobs` got a generated `client_id`
                and a secret; the kept client `web` got neither.
              value:
                id: app_01KWH3B72K7M7F0N9WD3P2E4YM
                revision_id: apprev_01KWHF2XY6RN7F0N9WD3P2E4YM
                slug: shop
                created_at: '2026-11-06T09:11:00Z'
                updated_at: '2026-11-07T14:20:00Z'
                definition:
                  slug: shop
                  name: Shop
                  clients:
                    - slug: web
                      client_id: client_01KWH3B72K7M7F0N9WD3P2E4YP
                      type: confidential
                      grant_types:
                        - authorization_code
                        - refresh_token
                      redirect_uris:
                        - https://shop.example.com/callback
                        - http://localhost:3000/callback
                    - slug: jobs
                      client_id: client_01KWHF2XY6RN7F0N9WD3P2E4YQ
                      type: confidential
                      grant_types:
                        - authorization_code
                      redirect_uris:
                        - https://jobs.shop.example.com/callback
                client_secrets:
                  - client: jobs
                    client_id: client_01KWHF2XY6RN7F0N9WD3P2E4YQ
                    secret: sk_client_7Kp2mQx9vR4tL8nB3wZ5yH6jF1dS0aE2
    '201':
      description: |
        The created application.
      content:
        application/json:
          schema:
            $ref: create-application-response.yaml
          examples:
            created:
              summary: A newly created application
              description: |
                The slug was new to the project, so `id` and `revision_id`
                were both allocated and `updated_at` equals `created_at`.
                The client's `client_id` was generated, and its secret is shown
                here and never again.
              value:
                id: app_01KWH3B72K7M7F0N9WD3P2E4YM
                revision_id: apprev_01KWH3B72K7M7F0N9WD3P2E4YN
                slug: shop
                created_at: '2026-11-06T09:11:00Z'
                updated_at: '2026-11-06T09:11:00Z'
                definition:
                  slug: shop
                  name: Shop
                  clients:
                    - slug: web
                      client_id: client_01KWH3B72K7M7F0N9WD3P2E4YP
                      type: confidential
                      grant_types:
                        - authorization_code
                        - refresh_token
                      redirect_uris:
                        - https://shop.example.com/callback
                        - http://localhost:3000/callback
                client_secrets:
                  - client: web
                    client_id: client_01KWH3B72K7M7F0N9WD3P2E4YP
                    secret: sk_client_7Kp2mQx9vR4tL8nB3wZ5yH6jF1dS0aE2
    '400':
      description: |
        The document failed schema validation, breaks a rule of the
        authorization server, or revises an existing application and changes
        a field that is fixed for its life. The details identify the setting.
        Fix the document and send it again.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '404':
      description: Project not found.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '409':
      description: |
        A `client_id` in the document is held, or was once held, by another
        client of the project (`app.client_id_taken`). Pick another
        id, or leave it out so the server generates one.

        Or another revision of the same application was created at the same
        instant (`app.revision_conflict`). Send the document again.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    default:
      $ref: publishApplication-error-response.yaml
