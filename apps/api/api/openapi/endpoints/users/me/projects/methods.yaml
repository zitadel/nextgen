get:
  operationId: listMyProjects
  summary: List the projects I can act on
  # Platform operators are decided in ADR 075.
  description: |
    Lists the projects the signed-in user can act on: those they hold an active
    grant on, either directly or through a team they are a member of. For a
    platform operator, someone who runs the deployment, that is every project of
    the deployment. Ordered by project ID unless `order` asks for creation
    time, and paged with an opaque cursor.

    This is not the same question as `queryProjects` (`POST /projects/query`), which answers with the one
    project the calling credential is bound to. Here the session is the caller
    and the grants are the answer, so the list spans projects.

    With `name_contains`, only the projects whose name contains that text are
    listed. The search runs on the server together with the grants, so it
    reaches every project the user can act on, however many there are, and
    pages like the full list.

    With `project_id`, the projects are listed only when the session belongs to
    that project. It names the project the session was signed in to, not one to
    list.

    With `exclude_platform`, the deployment's reserved platform project is left
    out: the project the console signs in to, which holds the console's
    accounts rather than an application's users. A deployment without one lists
    the same projects either way.
  tags:
    - Projects
  security:
    - sessionCookie: []
  parameters:
    - $ref: ../../../../components/parameters/limit.yaml
    - $ref: ../../../../components/parameters/page-token.yaml
    # Declared here rather than shared: no other list is searched by name in
    # the query string. It is the `name` field with the query endpoints'
    # `contains` operation, and named after both.
    - name: name_contains
      in: query
      required: false
      description: |
        Narrows the list to the projects whose name contains this text,
        ignoring case, as `contains` matches text in a query endpoint's
        filter. Send the same value with every `page_token` the search
        returns: a token continues the list it came from. An empty value
        lists every project, as leaving it out does.
      schema:
        type: string
      example: acme
    # The name, values and sort keys of `GET /events`' `order`. There it
    # defaults to `desc`; here leaving it out lists by project ID.
    - name: order
      in: query
      required: false
      description: |
        Sorts the list by `created_at` and then `id`: `desc` lists the newest
        project first, `asc` the oldest first. Leave it out to list by
        project ID, which says nothing about when a project was created. Send
        the same value with every `page_token` the list returns: a token
        continues the list it came from, and under another order it is
        refused with `400`.
      schema:
        $ref: ../../../../components/schemas/sort-direction.yaml
      example: desc
    # Console ADR 0004 §3 (D41): the console lists customer projects only and
    # draws the platform project's surfaces at its root.
    - name: exclude_platform
      in: query
      required: false
      description: |
        Leaves out the deployment's reserved platform project, the one the
        console signs in to. Defaults to `false`. Send the same value with
        every `page_token` the list returns.
      schema:
        type: boolean
      example: true
    - $ref: ../../../../components/parameters/session-project-id.yaml
  responses:
    '200':
      description: The projects the session user can act on.
      headers:
        Cache-Control:
          $ref: ../../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: list-my-projects-response.yaml
    '400':
      description: The page token or limit was not valid, or the token was issued under another `order`.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '401':
      description: Missing or invalid session token.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/errors/auth-unauthorized.yaml
    '403':
      description: The session belongs to a different project than `project_id`.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/errors/sess-project_mismatch.yaml
    '500':
      description: Something went wrong on the server. This was not your fault.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    default:
      $ref: listMyProjects-error-response.yaml
