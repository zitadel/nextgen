get:
  operationId: getMyUserSchema
  summary: Get my user schema
  description: |
    The schema the signed-in user's own record is validated against.

    With `project_id`, the schema is returned only when the session belongs to
    that project.
  tags:
    - Users
  security:
    - sessionCookie: []
  parameters:
    - $ref: ../../../../components/parameters/session-project-id.yaml
  responses:
    '200':
      description: The user's schema.
      headers:
        Cache-Control:
          $ref: ../../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: ../../../schemas/schema.yaml
    '401':
      description: Missing or invalid session token.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/errors/auth-unauthorized.yaml
    '403':
      description: The session belongs to a different project than `project_id`.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/errors/sess-project_mismatch.yaml
    '404':
      description: User referenced by the current session was not found.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/errors/user-not_found.yaml
    default:
      $ref: getMyUserSchema-error-response.yaml
