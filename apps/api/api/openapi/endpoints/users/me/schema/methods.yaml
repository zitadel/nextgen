get:
  operationId: getMyUserSchema
  summary: Get my user schema
  description: |
    Returns the schema that validates the signed-in user's own record.

    With `project_id`, the schema is returned only when the session belongs to
    that project.
  tags:
    - Users
  security:
    - sessionCookie: []
  parameters:
    - $ref: ../../../../components/parameters/session-project-id.yaml
  responses:
    '200':
      description: The user's schema.
      headers:
        Cache-Control:
          $ref: ../../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: ../../../schemas/schema.yaml
          example:
            id: sch_01H455VB4213EF62K49QF6M73F
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              objectType: human-user
              kind: user-schema
              metaSchema: https://example.com/path
              x-auth-methods:
                password:
                  enabled: true
              x-identifier: email
              x-display:
                - example
              properties: {}
            metadata:
              created_at: '2026-01-15T09:30:00Z'
              in_use: true
    '401':
      description: Missing or invalid session token.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/errors/auth-unauthorized.yaml
    '403':
      description: The session belongs to a different project than `project_id`.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/errors/sess-project-mismatch.yaml
    '404':
      description: User referenced by the current session was not found.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/errors/user-not-found.yaml
    default:
      $ref: getMyUserSchema-error-response.yaml
