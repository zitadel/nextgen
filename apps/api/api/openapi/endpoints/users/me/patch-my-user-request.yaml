title: PatchMyUserRequest
description: |
  A partial update of the caller's own attributes, merged into the current
  state: an omitted key stays untouched, an object merges recursively,
  `null` deletes the attribute, and any other value replaces the stored one.
  The merged result is validated as a whole against the user's schema.

  Unlike `PatchUserByID` (`PATCH /users/{user_id}`), this request cannot move
  the user to another schema: schema upgrades are a management operation.
type: object
additionalProperties: false
required:
  - attributes
properties:
  attributes:
    type: object
    additionalProperties:
      $ref: ../../../components/schemas/attribute-value.yaml
    propertyNames:
      # No "." and at least one character; attribute-value.yaml says it for nested objects.
      pattern: '^[^.]+$'
    minProperties: 1
    description: |
      The changed attributes only. `null` deletes an attribute; omitted
      keys are untouched.

      An attribute name must not be empty or contain a `.`, at any depth: the
      server stores an attribute under its dot-joined path, so `{"a.b": 1}`
      would be the same attribute as `{"a": {"b": 1}}`. Such a name is
      rejected with `req.invalid`, naming it in `details.fields`.
