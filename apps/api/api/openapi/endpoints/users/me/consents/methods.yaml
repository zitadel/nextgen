get:
  operationId: listMyConsents
  summary: List my consents
  description: |
    The apps the signed-in user let act for them, newest first, paginated with
    a cursor: one consent per client and API, with the scopes the user agreed
    to and when the consent ends (ADR 082 §8). A consent that ended is not
    listed.

    With `project_id`, the consents are listed only when the session belongs to
    that project.
  tags:
    - Users
  security:
    - sessionCookie: []
  parameters:
    - $ref: ../../../../components/parameters/limit.yaml
    - $ref: ../../../../components/parameters/page-token.yaml
    - $ref: ../../../../components/parameters/session-project-id.yaml
  responses:
    '200':
      description: The user's consents.
      headers:
        Cache-Control:
          $ref: ../../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: list-my-consents-response.yaml
    '400':
      description: The page token or limit was not valid.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '401':
      description: Missing or invalid session token.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/errors/auth-unauthorized.yaml
    '403':
      description: The session belongs to a different project than `project_id`.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/errors/sess-project_mismatch.yaml
    default:
      $ref: listMyConsents-error-response.yaml
