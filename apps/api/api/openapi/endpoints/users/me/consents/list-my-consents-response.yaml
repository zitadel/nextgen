type: object
description: Paginated list of the user's consents, newest first.
required:
  - consents
properties:
  consents:
    type: array
    items:
      $ref: consent-response.yaml
  next_page_token:
    description: |
      Token to pass as `page_token` in the next request to fetch the following page.
      Present when the page was full. A following request may return an empty page
      and no token, which ends the listing.
    oneOf:
      - $ref: ../../../../components/schemas/page-token.yaml
      - type: 'null'
