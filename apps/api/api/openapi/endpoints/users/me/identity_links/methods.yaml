get:
  operationId: listMyIdentityLinks
  summary: List the provider accounts linked to me
  description: |
    Lists the identity provider accounts a sign-in linked to the signed-in user,
    oldest first. The provider's subject and claims, the data it asserts about
    the account, are never returned.

    With `project_id`, the links are listed only when the session belongs to
    that project.
  tags:
    - Users
  security:
    - sessionCookie: []
  parameters:
    - $ref: ../../../../components/parameters/limit.yaml
    - $ref: ../../../../components/parameters/page-token.yaml
    - $ref: ../../../../components/parameters/session-project-id.yaml
  responses:
    '200':
      description: The user's identity links.
      headers:
        Cache-Control:
          $ref: ../../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: ../../by_id/identity_links/list-user-identity-links-response.yaml
          example:
            identity_links:
              - id: idplink_01KWH3B5Q8Z6V4N2M0X9C7R1TD
                connection_id: idp_01KWH3A9F2J7K5P3Q1W8E6Y4UB
                created_at: '2026-01-15T09:30:00Z'
            next_page_token: v1.dGhpcyBpcyBvcGFxdWU.SflKxwRJSMeKKF2QT4fw
    '400':
      description: The page token or limit was not valid.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '401':
      description: Missing or invalid session token.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/errors/auth-unauthorized.yaml
    '403':
      description: The session belongs to a different project than `project_id`.
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/errors/sess-project-mismatch.yaml
    default:
      $ref: listMyIdentityLinks-error-response.yaml
