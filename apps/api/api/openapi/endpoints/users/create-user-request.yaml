title: CreateUserRequest
description: |
  The request body for creating a user: the `schema` it follows and the
  `attributes` that must satisfy that schema.

  The server assigns the user's ID and returns it in the response, so the
  request carries no `id`. `metadata` is server-owned for the same reason.
  Neither is part of this schema, which is what frees a user schema to declare
  properties of those names.

  A request carrying any other top-level property is rejected rather than
  ignored. `attributes` stays open, since the user schema determines what
  belongs in it.
type: object
additionalProperties: false
required:
  - schema
  - attributes
properties:
  schema:
    type: string
    minLength: 1
    description: |
      The ID of the schema that defines the content of `attributes`: the `id`
      that `createSchema` (`POST /schemas`) returns or `listSchemas` (`GET /schemas`) lists. A default schema is
      provided.
  attributes:
    type: object
    additionalProperties: true
    propertyNames:
      # No "." and at least one character.
      pattern: '^[^.]+$'
    # Said once more for the objects nested in the values, down to five levels (a schema that refers to itself loops the
    # test tool and the docs sampler; the server applies the rule at every depth). It sits
    # in an always-true `if` because a `$ref` here would turn the generated
    # clients' attribute map into a named type; the generator ignores `if`.
    if:
      type: object
    then:
      additionalProperties:
        $ref: ../../components/schemas/attribute-value.yaml
    description: |
      The user's schema-defined content. Validated against `schema`; a
      property the schema does not permit is rejected with `req.invalid`.

      An attribute name must not be empty or contain a `.`, at any depth: the
      server stores an attribute under its dot-joined path, so `{"a.b": 1}`
      would be the same attribute as `{"a": {"b": 1}}`. Such a name is
      rejected with `req.invalid`, naming it in `details.fields`.
