type: object
additionalProperties: false
description: Request to query the users of a project.
properties:
  limit:
    $ref: ../../../components/schemas/limit.yaml
  page_token:
    description: |
      Token to retrieve the next page of results. Must be sent with the same
      `sorting` as the request that issued the token. Omitting `sorting` reuses
      the default sort and only succeeds when that default matches the token.
    oneOf:
      - $ref: ../../../components/schemas/page-token.yaml
      - type: 'null'
  expand:
    type: array
    # The expansion rules are decided in ADR 059.
    description: |
      Related collections to embed on each user. Omit it and no embedded
      collection is returned. An unrecognised value is rejected.
    uniqueItems: true
    items:
      $ref: user-expand.yaml
  sorting:
    type: object
    additionalProperties: false
    required:
      - field
      - direction
    properties:
      field:
        $ref: user-sort-field.yaml
        description: The field to sort by.
      direction:
        $ref: ../../../components/schemas/sort-direction.yaml
        description: The direction to sort by.
  filter:
    type: array
    description: Filter criteria for querying users. Criteria are combined with AND.
    # `team_id` may be given once: the server refuses a second one.
    contains:
      type: object
      properties:
        field:
          const: team_id
    minContains: 0
    maxContains: 1
    items:
      type: object
      additionalProperties: false
      required:
        - field
        - operation
      # What a `value` and an `operation` may be depends on the field: a timestamp
      # takes an RFC 3339 string and a comparison, a status or state one of its
      # names with `equals`, any other field a string with `equals` or `contains`.
      # The server refuses anything else, and a missing value, with `400`.
      if:
        required:
          - field
        properties:
          field:
            enum: [created_at]
      then:
        $ref: ../../../components/schemas/filter-timestamp-value.yaml
      else:
        if:
          required:
            - field
          properties:
            field:
              enum: [status]
        then:
          required:
            - value
          properties:
            field: {}
            operation:
              const: equals
            value:
              enum: [active, suspended, deactivated, pending_purge]
        else:
          if:
            required:
              - field
            properties:
              field:
                enum: [team_id]
          then:
            required:
              - value
            properties:
              field: {}
              operation:
                const: equals
              value:
                type: string
          else:
            $ref: ../../../components/schemas/filter-text-value.yaml
      properties:
        field:
          $ref: user-filter-field.yaml
          description: The field to filter by.
        value:
          $ref: ../../../components/schemas/filter-value.yaml
        operation:
          $ref: ../../../components/schemas/filter-operation.yaml
