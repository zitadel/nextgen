type: object
description: Response containing the provider accounts linked to the user.
required:
  - identity_links
properties:
  identity_links:
    type: array
    items:
      $ref: user-identity-link.yaml
  next_page_token:
    description: |
      Token to pass as `page_token` in the next request to fetch the following page.
      Absent when there are no more results.
    oneOf:
      - $ref: ../../../../components/schemas/page-token.yaml
      - type: 'null'
