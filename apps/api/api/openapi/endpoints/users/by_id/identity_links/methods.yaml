get:
  operationId: listUserIdentityLinks
  summary: List the provider accounts linked to a user
  description: |
    Lists the identity provider accounts a sign-in linked to the user, oldest
    first. The provider's subject and claims, the data it asserts about the
    account, are never returned.
  tags:
    - Users
  parameters:
    - $ref: ../../../../components/parameters/user-id.yaml
    - $ref: ../../../../components/parameters/limit.yaml
    - $ref: ../../../../components/parameters/page-token.yaml
  security:
    - oauth2:
        - user.read
    - sessionCookie: []
  responses:
    '200':
      description: The user's identity links.
      content:
        application/json:
          schema:
            $ref: list-user-identity-links-response.yaml
          example:
            identity_links:
              - id: idplink_01KWH3B5Q8Z6V4N2M0X9C7R1TD
                connection_id: idp_01KWH3A9F2J7K5P3Q1W8E6Y4UB
                created_at: '2026-01-15T09:30:00Z'
            next_page_token: v1.dGhpcyBpcyBvcGFxdWU.SflKxwRJSMeKKF2QT4fw
    '400':
      description: The provided input was not valid.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '401':
      description: Client was not authorized or the session is anonymous.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '403':
      description: Client does not have the permissions to perform this action.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '404':
      description: No user was found for the provided user ID.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '500':
      description: Something went wrong on the server. This was not your fault.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    default:
      $ref: listUserIdentityLinks-error-response.yaml
