get:
  operationId: getUserPasswordState
  summary: Get user password state
  description: |
    Reports when the user's current password was set, and leaves `set_at` out
    when the user has none. The password and its hash are never returned;
    setting one is `PUT` on the same path.
  tags:
    - Users
  parameters:
    - name: user_id
      in: path
      required: true
      schema:
        $ref: ../../../../components/schemas/user-id.yaml
  security:
    - oauth2:
        - user.read
    - sessionCookie: []
  responses:
    '200':
      description: The state of the user's password
      content:
        application/json:
          schema:
            $ref: user-password-state.yaml
    '401':
      description: Client was not authorized or the session is anonymous.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '403':
      description: Client does not have the permissions to perform this action.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '404':
      description: No user was found for the provided user ID
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '500':
      description: Something went wrong on the server. This was not your fault.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    default:
      $ref: getUserPasswordState-error-response.yaml
put:
  operationId: setUserPassword
  summary: Set user password
  description: |
    Sets a user's password, hashed with the project's current password hashing
    policy.

    The new password replaces the current one, and setting it emits
    `auth.factor.password.set`.

    The password policy is the one in the project's newest primary deployment,
    whatever the caller's `Origin`. With none the call answers `409` with
    `rel.no_default`, and a revoked release answers `409` with `rel.revoked`.
  tags:
    - Users
  parameters:
    - $ref: ../../../../components/parameters/user-id.yaml
  security:
    - oauth2:
        - user.write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: set-user-password-request.yaml
  responses:
    '204':
      description: The user password was set successfully
    '400':
      description: The provided input was not valid
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '404':
      description: No user was found for the provided user ID
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '500':
      description: Something went wrong on the server. This was not your fault.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    default:
      $ref: setUserPassword-error-response.yaml
