get:
  operationId: getUserPasswordState
  summary: Get a user's password state
  description: |
    Returns when the user's current password was set, and leaves `set_at` out
    when the user has none. The password and its hash are never returned;
    `setUserPassword` (`PUT` on the same path) sets one.
  tags:
    - Users
  parameters:
    - name: user_id
      in: path
      required: true
      schema:
        $ref: ../../../../components/schemas/user-id.yaml
  security:
    - oauth2:
        - user.read
    - sessionCookie: []
  responses:
    '200':
      description: The state of the user's password.
      content:
        application/json:
          schema:
            $ref: user-password-state.yaml
    '401':
      description: Client was not authorized or the session is anonymous.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '403':
      description: Client does not have the permissions to perform this action.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '404':
      description: No user was found for the provided user ID.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '500':
      description: Something went wrong on the server. This was not your fault.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    default:
      $ref: getUserPasswordState-error-response.yaml
put:
  operationId: setUserPassword
  summary: Set a user's password
  description: |
    Sets a user's password, hashed with the project's current password hashing
    policy.

    The new password replaces the current one, and setting it emits
    `auth.factor.password.set`. A password the project's password policy
    refuses answers `user.password_policy_violation`; send one that meets the
    policy.

    The password policy is the one in the release that serves the caller's
    `Origin`, chosen as `createFlow` (`POST /flow`) chooses it. A frontend on a
    preview URL gets that preview's policy, and one on a primary origin the
    newest primary deployment's. A request with no `Origin`, or from the
    console when the project does not list the console's origin, gets the
    project's newest primary deployment.

    If the request is refused:
    - `403 proj.origin_not_allowed`: the project admits no such origin. Add it
      with `zitadel origin add`.
    - `403 proj.preview_not_live`: the origin matches a preview pattern but has
      no live preview. Run `zitadel preview` on the branch.
    - `409 rel.not_deployed`: nothing is deployed to the origin. Run
      `zitadel deploy`.
    - `409 rel.no_default`: the request names no origin and the project has no
      primary deployment. Run `zitadel deploy`.
    - `409 rel.revoked`: the release that serves the origin is revoked.
  tags:
    - Users
  parameters:
    - $ref: ../../../../components/parameters/user-id.yaml
    - name: Origin
      in: header
      required: false
      description: |
        Standard browser `Origin` header. Selects the deployment whose password
        policy applies. Browsers send it automatically; no client action is
        required. Absent when the caller is not a browser.
      schema:
        type: string
        format: uri
        example: https://www.acme.com
  security:
    - oauth2:
        - user.write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: set-user-password-request.yaml
  responses:
    '204':
      description: The password was set.
    '400':
      description: The provided input was not valid.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '404':
      description: No user was found for the provided user ID.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '500':
      description: Something went wrong on the server. This was not your fault.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    default:
      $ref: setUserPassword-error-response.yaml
