get:
  operationId: listUserPasskeys
  summary: List a user's passkeys
  description: |
    Lists the passkeys registered for a user, newest first, paginated with a
    cursor. A passkey is a WebAuthn credential that signs a user in without a
    password.

    Each passkey carries its ID, its name and when it was registered, never the
    credential itself.
  tags:
    - Users
  parameters:
    - $ref: ../../../../components/parameters/limit.yaml
    - $ref: ../../../../components/parameters/page-token.yaml
    - $ref: ../../../../components/parameters/user-id.yaml
  security:
    - oauth2:
        - user.read
    - sessionCookie: []
  responses:
    '200':
      description: The user's passkeys.
      content:
        application/json:
          schema:
            $ref: list-user-passkeys-response.yaml
    '400':
      description: The provided input was not valid.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '401':
      description: Client was not authorized or the session is anonymous.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '403':
      description: Client does not have the permissions to perform this action.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '404':
      description: No user was found for the provided user ID.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '500':
      description: Something went wrong on the server. This was not your fault.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    default:
      $ref: listUserPasskeys-error-response.yaml
