type: object
description: |
  The request body for beginning a WebAuthn registration ceremony for the user.

  Management callers are not browsers, so the relying-party parameters cannot
  be derived from an Origin header and must be supplied explicitly.
required:
  - rp_id
  - rp_origins
additionalProperties: false
properties:
  rp_id:
    type: string
    minLength: 1
    maxLength: 253
    # A domain WebAuthn accepts: dot-separated labels of letters, digits, _ and
    # inner hyphens, at most 63 characters each, ending in a label that starts
    # with a letter or _ (so never an IP address or a number), or `localhost`.
    pattern: '^(localhost|([A-Za-z0-9_]([A-Za-z0-9_-]{0,61}[A-Za-z0-9_])?\.)+[A-Za-z_]([A-Za-z0-9_-]{0,61}[A-Za-z0-9_])?)$'
    x-zitadel-pattern-message: "must be a domain name such as example.com, whose last label does not start with a digit, or localhost"
    description: The relying party ID, the domain the credential is scoped to.
    example: example.com
  rp_origins:
    type: array
    description: The origins allowed for this ceremony's attestation.
    minItems: 1
    items:
      type: string
      format: uri
    example: [ 'https://example.com' ]
  username:
    type: string
    description: |
      The account label the browser shows in its credential picker. Optional:
      when omitted, a neutral default is used.
    example: alice@example.com
  display_name:
    type: string
    description: The display name the browser shows. Optional; defaults to the username.
    example: Alice Example
