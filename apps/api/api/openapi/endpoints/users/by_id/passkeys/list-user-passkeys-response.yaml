type: object
description: Response containing the user's passkeys.
required:
  - passkeys
properties:
  passkeys:
    type: array
    items:
      type: object
      required:
        - id
        - name
        - created_at
      properties:
        id:
          type: string
          description: The unique identifier of the passkey.
        name:
          type: string
          description: The name of the passkey.
        created_at:
          type: string
          format: date-time
          description: The timestamp when the passkey was created.
  next_page_token:
    description: |
      Token to pass as `page_token` in the next request to fetch the following page.
      Absent when there are no more results.
    oneOf:
      - $ref: ../../../../components/schemas/page-token.yaml
      - type: 'null'