type: object
description: The current state of a project.
required:
  - id
  - name
  - origins
  - created_at
  - updated_at
properties:
  id:
    type: string
    description: The unique identifier of the project.
  name:
    type: string
    description: The name of the project.
  origins:
    type: array
    items:
      $ref: project-origin.yaml
    description: |
      The project's origins. An empty list admits no origin except a loopback
      origin, which is admitted without a pattern.
  created_at:
    type: string
    format: date-time
    description: The time when the project was created.
  updated_at:
    type: string
    format: date-time
    description: The time when the project was last updated.
  password_hash:
    description: |
      The method this project's passwords are hashed with. Null when the project
      uses the server default.
    oneOf:
      - $ref: password-hash-policy.yaml
      - type: 'null'
