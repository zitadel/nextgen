type: object
required:
  - id
  - name
  - project_secret
  - preview_secret
  - origins
  - created_at
properties:
  id:
    type: string
    description: The unique identifier of the project.
  name:
    type: string
    description: The name of the project.
  project_secret:
    type: string
    description: |
      Secret which can be used for authentication when modifying the project.
  preview_secret:
    type: string
    description: |
      Secret which can be used for previewing and testing the project.
  origins:
    type: array
    items:
      $ref: project-origin.yaml
    description: |
      The project's origins. An empty list admits no origin except a loopback
      origin, which is admitted without a pattern.
  created_at:
    type: string
    format: date-time
    description: The time when the project was created.
