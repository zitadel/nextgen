post:
  operationId: queryProjects
  x-zitadel-cli: projects list
  summary: Query projects
  description: |
    Returns the project the project secret belongs to, as a page of at most one
    project.

    A credential is scoped to one project until ADR 036 widens it, so the filters
    and sorting apply to that project alone. The projects a signed-in person can
    act on are listed by `GET /users/me/projects`.
  tags:
    - Projects
  security:
    - oauth2:
        # project.write, not project.read: project.read is carried by the
        # browser-plane preview secret, so it cannot gate an operator read
        # until ADR 036 splits the credential planes into distinct schemes.
        - project.write
  requestBody:
    description: Request to query projects.
    required: true
    content:
      application/json:
        schema:
          $ref: query-projects-request.yaml
  responses:
    '200':
      description: The list of projects was returned successfully
      content:
        application/json:
          schema:
            $ref: query-projects-response.yaml
    '400':
      description: Invalid request (e.g., invalid query parameters).
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '429':
      description: |
        Too many requests, the client has sent too many requests in a given
        amount of time.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: queryProjects-error-response.yaml