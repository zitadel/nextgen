type: object
description: The project's live previews, newest first.
required:
  - previews
properties:
  previews:
    type: array
    maxItems: 100
    description: 'The page of preview origins of the project.'
    items:
      $ref: preview.yaml
  next_page_token:
    description: |
      Token to pass as `page_token` in the next request to fetch the following page.
      Absent when there are no more results.
    oneOf:
      - $ref: ../../../../components/schemas/page-token.yaml
      - type: 'null'
