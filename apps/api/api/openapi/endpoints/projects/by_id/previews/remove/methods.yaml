post:
  operationId: removeProjectPreview
  x-zitadel-cli: preview rm
  x-zitadel-destructive: true
  summary: Remove a preview
  description: |
    Ends a preview before it expires: the URL stops being served at once.

    The deployments to it stay in the history. The call is idempotent.
    A URL with no live preview answers `204` too. That includes one that
    expired or was removed before, so a cleanup that races the expiry still
    succeeds.

    The URL travels in the body rather than the path because an origin
    contains `/`. Take it from `listProjectPreviews` (`GET /projects/{project_id}/previews`).
  tags:
    - Previews
  parameters:
    - $ref: ../../../../../components/parameters/project-id-path.yaml
  security:
    - oauth2:
        - deployment.write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: remove-preview-request.yaml
        examples:
          remove:
            summary: Remove a branch preview
            value:
              origin: https://acme-git-sso-acmeinc.vercel.app
  responses:
    '204':
      description: The URL has no live preview.
    default:
      $ref: removeProjectPreview-error-response.yaml
