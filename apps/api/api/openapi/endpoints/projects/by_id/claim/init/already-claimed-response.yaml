description: |
  A team already claimed the project. The `details` carry the owning team and
  the dashboard where it can be managed.
allOf:
  - $ref: ../../../../../components/schemas/errors/proj-already-claimed.yaml
  - type: object
    required:
      - details
    properties:
      details:
        type: object
        description: 'Who holds the project and where to manage it: the team and its dashboard URL.'
        required:
          - team_id
          - dashboard_url
        properties:
          team_id:
            $ref: ../../../../../components/schemas/team-id.yaml
            description: 'The team that holds the project.'
          dashboard_url:
            type: string
            format: uri
            description: The dashboard URL for the team that owns the project.
