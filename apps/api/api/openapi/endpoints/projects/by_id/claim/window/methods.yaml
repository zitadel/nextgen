get:
  operationId: getClaimWindow
  summary: Get the claim window for a project
  description: |
    Returns when a project's claim window closes and whether it has already
    closed.

    The claim window is the 14 days after a project is created during which a
    team can [claim it](/docs/concepts/project-team-user#claim). The claim page
    in the browser calls this operation to show how long is left.

    The request needs no credential, because the claim page calls it before the
    developer has signed in. Holding the `challenge_id` from the claim URL that
    `initClaim` (`POST /projects/{project_id}/claim/init`) returns is the authorization, the same one `completeClaim` (`POST /projects/{project_id}/claim/complete`)
    accepts. The response reveals only the window, never the project itself.
    Unlike `completeClaim` it spends nothing, so reloading the page is safe.
  tags:
    - Projects
  parameters:
    - $ref: ../../../../../components/parameters/project-id-path.yaml
    - $ref: ../../../../../components/parameters/challenge-id-query.yaml
  security: []
  responses:
    '200':
      description: The project's claim window.
      content:
        application/json:
          schema:
            $ref: claim-window-response.yaml
    '404':
      description: |
        No such project, or the challenge does not belong to it. One response
        for both: a caller without a valid challenge learns nothing about
        whether the project exists.
      content:
        application/json:
          schema:
            $ref: ../../../../../components/error-details.yaml
    '429':
      description: Too many requests. Wait and retry.
      content:
        application/json:
          schema:
            $ref: ../../../../../components/error-details.yaml
    default:
      $ref: getClaimWindow-error-response.yaml
