type: object
description: |
  A claimed project. It carries the owning team and when the claim landed.
  These fields are always present when `status` is `claimed`.
required:
  - status
  - team_id
  - claimed_at
properties:
  status:
    type: string
    enum:
      - claimed
    description: A team owns the project.
  team_id:
    $ref: ../../../../components/schemas/team-id.yaml
  claimed_at:
    type: string
    format: date-time
    description: The time when the project was claimed.
