get:
  operationId: getProject
  x-zitadel-cli: projects get
  summary: Get a project by ID
  description: |
    Returns a project's current state: its name, origins, password hashing
    method and owning team.

    Authenticate with the project secret, or with the session of a signed-in
    person who holds a grant on the project.
  tags:
    - Projects
  parameters:
    - $ref: ../../../components/parameters/project-id-path.yaml
  security:
    - oauth2:
        # project.write, not project.read: project.read is carried by the
        # browser-plane preview secret, so it cannot gate an operator read
        # until ADR 036 splits the credential planes into distinct schemes.
        - project.write
    # A signed-in person holding a grant on the project (root ADR 053 §6):
    # `GET /users/me/projects` lists it for them, so they must be able to
    # open it. Authorization is the same project check the secret goes
    # through, evaluated for the session's user principal.
    - sessionCookie: []
  responses:
    '200':
      description: The project.
      content:
        application/json:
          schema:
            $ref: ../project-detail-response.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: Project not found.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: getProject-error-response.yaml

patch:
  operationId: patchProject
  x-zitadel-cli: projects update
  summary: Update a project
  description: |
    Updates a project's name or password hashing method.

    Fields you leave out keep their value. Sending `password_hash: null` drops
    the project's own method and returns to the server default. A change of
    method rewrites no stored password: each moves to the new method when its
    owner next signs in or sets a new password.

    Authenticate with the project secret, or with the session of a signed-in
    person who can act on the project.
  tags:
    - Projects
  parameters:
    - $ref: ../../../components/parameters/project-id-path.yaml
  security:
    - oauth2:
        - project.write
    # Same as getProject: a granted person may rename a project they can act
    # on, subject to the project write check for their principal.
    - sessionCookie: []
  requestBody:
    description: The new state of the project.
    required: true
    content:
      application/json:
        schema:
          $ref: patch-project-request.yaml
  responses:
    '200':
      description: The updated project.
      content:
        application/json:
          schema:
            $ref: ../project-detail-response.yaml
    '400':
      description: Invalid request body.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: Project not found.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: patchProject-error-response.yaml