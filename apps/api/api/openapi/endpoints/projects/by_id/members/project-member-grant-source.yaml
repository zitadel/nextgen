title: ProjectMemberGrantSource
description: |
  A role through a grant on the project, to the person or to a team they are
  an active member of.
type: object
required:
  - type
  - grant_id
properties:
  type:
    type: string
    enum:
      - grant
  grant_id:
    type: string
    description: The grant (`asgn_<opaque>`), as served by `GET /grants/{id}`.
  team:
    description: The team the grant is to, absent for a grant to the person directly.
    $ref: ../../../../components/schemas/team-ref.yaml
