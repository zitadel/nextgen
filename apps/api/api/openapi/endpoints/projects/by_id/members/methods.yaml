get:
  operationId: listProjectMembers
  summary: List the members of a project
  description: |
    Lists everyone with a role on a project, with each person's strongest
    `relation` and its `sources`.

    This is today's `listProjectAdmins` (`GET /projects/{project_id}/admins`)
    widened from `admin` to every relation. A person appears once. Optional
    `relation` means at least that role, so `relation=admin` gives the admins
    view (`admin` beats `editor` beats `viewer`). Owning-team membership always
    contributes `admin`.

    A person who left a team, or whose team or user was deactivated, is not
    listed through that source. Expired grants are left out. A person whose
    access comes only through teams the caller is not a member of is left out;
    a team the caller is not in is named by `team_id` only.

    The list is ordered by `user_id` and paginated with `page_token`.
    Authenticate with a project secret (`oauth2`), or with the session cookie
    (`sessionCookie`) of a signed-in person who can read the project. It needs
    `project.write` or a session, never `project.read`, which the browser-plane
    preview secret carries.
  tags:
    - Projects
  parameters:
    - $ref: ../../../../components/parameters/limit.yaml
    - $ref: ../../../../components/parameters/page-token.yaml
    - name: project_id
      in: path
      required: true
      schema:
        $ref: ../../../../components/schemas/project-id.yaml
    - name: relation
      in: query
      required: false
      description: |
        Only members whose strongest role is at least this relation.
        `admin` beats `editor` beats `viewer`, so `relation=admin` lists
        administrators only.
      schema:
        type: string
        enum:
          - viewer
          - editor
          - admin
  security:
    - oauth2:
        # project.write, not project.read: project.read is carried by the
        # browser-plane preview secret, which must not list the people who
        # hold roles on the project (same reasoning as getProject and
        # listProjectAdmins).
        - project.write
    - sessionCookie: []
  responses:
    '200':
      description: A page of the project's members.
      content:
        application/json:
          schema:
            $ref: list-project-members-response.yaml
    '400':
      description: The page token is not valid. Send the `next_page_token` from the previous response unchanged.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '403':
      description: The caller cannot read the project's members.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '404':
      description: Project not found.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    default:
      $ref: listProjectMembers-error-response.yaml
