title: ProjectMemberSource
description: |
  One way a person holds a role on the project. Discriminate on `type`.

  - `owning_team`: the person is an active member of the owning team named by
    `team`. There is no `grant_id`: this access is not a grant, so the grants
    API cannot revoke it. It always contributes `admin`.
  - `grant`: an unexpired grant on the project, named by `grant_id`. `team` is
    present when the grant is to a team the person is an active member of.
    It is absent when the grant is to the person directly.
oneOf:
  - $ref: project-member-owning-team-source.yaml
  - $ref: project-member-grant-source.yaml
discriminator:
  propertyName: type
  mapping:
    owning_team: project-member-owning-team-source.yaml
    grant: project-member-grant-source.yaml
