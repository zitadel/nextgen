title: ProjectMember
description: |
  One person with a role on the project, with their strongest `relation` and
  every way they hold access.
type: object
required:
  - user
  - relation
  - sources
properties:
  user:
    description: |
      The person. A user-ref: render `display`, falling back to `identifier`,
      then `user_id`.
    $ref: ../../../../components/schemas/user-ref.yaml
  relation:
    type: string
    enum:
      - viewer
      - editor
      - admin
    description: |
      The person's strongest role on the project. `admin` beats `editor` beats
      `viewer`. Owning-team membership always yields `admin`.
  sources:
    type: array
    minItems: 1
    description: |
      How the person holds access: owning-team access first, then grants to
      teams, then grants to the person.
    items:
      $ref: project-member-source.yaml
