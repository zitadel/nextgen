title: ProjectMember
description: |
  One person with a role on the project: their strongest role, and every way
  they hold it.
type: object
required:
  - user
  - relation
  - sources
properties:
  user:
    description: |
      The person. A user-ref: render `display`, falling back to `identifier`,
      then `user_id`.
    $ref: ../../../../components/schemas/user-ref.yaml
  relation:
    type: string
    enum:
      - viewer
      - editor
      - admin
    description: |
      The person's strongest role on the project. A stronger role includes
      the weaker ones.
  sources:
    type: array
    minItems: 1
    description: |
      How the person holds `relation`: owning-team access first, then grants
      to teams, then grants to the person. Grants of a weaker role are left
      out; they still show in the project's grants.
    items:
      $ref: project-member-source.yaml
