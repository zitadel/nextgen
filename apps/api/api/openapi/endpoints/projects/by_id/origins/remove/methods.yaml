post:
  operationId: removeOrigin
  x-zitadel-cli: origin rm
  x-zitadel-destructive: true
  summary: Remove an origin pattern
  description: |
    Removes one origin pattern from the project's origins.

    Requests from URLs only that pattern admitted are refused from then on.
    Live previews and deployment history are untouched. Removing the last
    pattern leaves an empty list, which admits no origin except a loopback
    origin.
    Removing a pattern that is already absent is idempotent and answers `204`.

    The body's `pattern` is a pattern `addOrigin` (`POST /projects/{project_id}/origins`) stored.
  tags:
    - Projects
  parameters:
    - $ref: ../../../../../components/parameters/project-id-path.yaml
  security:
    - oauth2:
        - origin.delete
    - sessionCookie: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - pattern
          properties:
            pattern:
              type: string
              description: |
                The origin pattern exactly as stored on the project: the string
                that `createProject` (`POST /projects`), `getProject` (`GET /projects/{project_id}`) or `addOrigin` (`POST /projects/{project_id}/origins`) returns.
              example: https://app.example.com
  responses:
    '204':
      description: The pattern was removed.
    default:
      $ref: removeOrigin-error-response.yaml
