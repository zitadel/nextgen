type: object
description: A page of the people who administer a project.
required:
  - admins
properties:
  admins:
    type: array
    items:
      $ref: project-admin.yaml
  next_page_token:
    description: |
      Token to pass as `page_token` in the next request to fetch the following page.
      Absent when there are no more results.
    oneOf:
      - $ref: ../../../../components/schemas/page-token.yaml
      - type: 'null'
