post:
  operationId: createProject
  summary: Create project
  description: |
    Creates a project and returns its project secret and preview secret, which no
    other endpoint returns.

    The request needs no credential and is rate-limited. Unless `seed_defaults` is
    `false`, the project starts with a default user schema and flow; the CLI turns
    that off and uploads its own from `.zitadel/`.
  tags:
    - Projects
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: create-project-request.yaml
  responses:
    '201':
      description: The project was created successfully
      content:
        application/json:
          schema:
            $ref: create-project-response.yaml
    '429':
      description: |
        Too many requests, the client has sent too many requests in a given
        amount of time.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    default:
      $ref: createProject-error-response.yaml
