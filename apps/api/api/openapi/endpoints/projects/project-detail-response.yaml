description: |
  The current state of one project. It adds the owning team to the fields
  every project listing carries.
allOf:
  - $ref: project-response.yaml
  - type: object
    required:
      - owning_team_id
    properties:
      owning_team_id:
        # The owning team is defined in ADR 054 §2.
        description: |
          The team that owns the project, which is how its members administer
          it. Null when no team owns the project, for example before it is
          claimed.

          The team lives in the platform project, so treat this ID as opaque.
          `GET /projects/{project_id}/members` lists the people who hold a role
          on the project through it (including administrators).
        oneOf:
          - $ref: ../../components/schemas/team-id.yaml
          - type: 'null'
