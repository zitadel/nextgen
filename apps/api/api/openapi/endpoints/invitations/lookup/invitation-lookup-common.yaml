title: LookupInvitationCommon
description: |
  Shared fields of the lean invitation view for the accept page.
type: object
required:
  - project_id
  - project_name
  - status
  - expires_at
properties:
  project_id:
    $ref: ../../../components/schemas/project-id.yaml
  project_name:
    type: string
    description: The project's display name.
  created_by:
    description: |
      The user who created the invitation. Null when a project secret created it.
    oneOf:
      - type: string
        example: user_01JC9X3N5Q7S9U1W3Y5A7C9E1G
      - type: 'null'
  created_by_type:
    $ref: ../invitation-created-by-type.yaml
  expires_at:
    type: string
    format: date-time
    description: When the invitation expires.
  status:
    $ref: ../invitation-status.yaml
