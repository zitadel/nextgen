title: LookupProjectMemberInvitationResponse
description: |
  Lean view of a project-member invitation for the accept page: project, role,
  inviter and expiry.
type: object
required:
  - project_id
  - project_name
  - type
  - project_member
  - status
  - expires_at
properties:
  project_id:
    $ref: ../../../components/schemas/project-id.yaml
  project_name:
    type: string
    description: The project's display name.
  type:
    type: string
    enum:
      - project_member
  project_member:
    type: object
    required:
      - relation
    properties:
      relation:
        type: string
        enum:
          - viewer
          - editor
          - admin
        description: The project role accepting grants.
  created_by:
    description: |
      The user who created the invitation. Null when a project secret created it.
    oneOf:
      - type: string
        example: user_01JC9X3N5Q7S9U1W3Y5A7C9E1G
      - type: 'null'
  created_by_type:
    $ref: ../invitation-created-by-type.yaml
  expires_at:
    type: string
    format: date-time
    description: When the invitation expires.
  status:
    $ref: ../invitation-status.yaml
