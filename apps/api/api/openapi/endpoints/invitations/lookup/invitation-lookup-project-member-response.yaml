title: LookupProjectMemberInvitationResponse
description: |
  Lean view of a project-member invitation for the accept page: project, role,
  inviter and expiry.
allOf:
  - $ref: invitation-lookup-common.yaml
  - type: object
    required:
      - type
      - project_member
    properties:
      type:
        type: string
        enum:
          - project_member
      project_member:
        $ref: ../invitation-project-member-payload.yaml
      membership:
        description: |
          The access the signed-in user already has to the project. A user
          with access can neither accept nor decline the invitation: both
          answer `409 inv.already_member` and leave it pending for the person
          it was meant for. Null when the user has no access.
        oneOf:
          - $ref: invitation-lookup-membership.yaml
          - type: 'null'
