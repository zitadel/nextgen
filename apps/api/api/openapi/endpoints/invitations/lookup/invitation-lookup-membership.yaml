title: LookupInvitationMembership
description: |
  The role the signed-in user already holds on the project, and every way
  they hold it, as `listProjectMembers` (`GET /projects/{project_id}/members`)
  lists a member.
type: object
required:
  - relation
  - sources
properties:
  relation:
    type: string
    enum:
      - viewer
      - editor
      - admin
    description: |
      The user's strongest role on the project. A stronger role includes the
      weaker ones.
  sources:
    type: array
    minItems: 1
    description: |
      How the user holds `relation`: owning-team access first, then grants to
      teams, then grants to the user.
    items:
      $ref: ../../projects/by_id/members/project-member-source.yaml
