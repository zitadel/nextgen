post:
  operationId: lookupInvitation
  summary: Look up an invitation by token
  description: |
    Returns a lean view of the invitation for the signed-in accept page:
    project, role, inviter and expiry.

    Send the plaintext token from the invitation link fragment. Every unknown
    or finished token answers the same opaque `404`. Authenticate with a
    platform-project user session cookie (`sessionCookie`). Lookup is a read:
    same-origin cookie requests need no `X-Zitadel-CSRF` token (accept and
    reject still do).
  tags:
    - Invitations
  security:
    - sessionCookie: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../invitation-token-request.yaml
  responses:
    '200':
      description: The invitation details for the accept page.
      content:
        application/json:
          schema:
            $ref: invitation-lookup-response.yaml
          example:
            project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
            project_name: example
            created_by: user_01JC9X3N5Q7S9U1W3Y5A7C9E1G
            created_by_type: human
            inviter:
              user_id: user_01KWH3B72K7M7F0N9WD3P2E4YM
              identifier: ada@example.com
              identifier_property: email
              display: Ada Lovelace
            expires_at: '2026-01-15T09:30:00Z'
            status: pending
            type: project_member
            project_member:
              relation: viewer
    '400':
      description: The request body was not acceptable.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '401':
      description: Missing or invalid session.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: Unknown or finished invitation token.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: lookupInvitation-error-response.yaml
