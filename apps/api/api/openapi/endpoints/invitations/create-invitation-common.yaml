title: CreateInvitationCommon
description: Shared optional fields on every create-invitation request.
type: object
properties:
  metadata:
    description: Optional label for who the link is for. Displayed only; never matched.
    $ref: invitation-metadata.yaml
  replaces_invitation_id:
    description: |
      When set, this create replaces that invitation: the new invitation keeps
      the original's `journey_id`, and a pending original is deleted in the
      same transaction. Use the `id` that `createInvitation`
      (`POST /invitations`) or `listInvitations` (`GET /invitations`) returns.
    $ref: ../../components/schemas/invitation-id.yaml
