get:
  operationId: getInvitation
  x-zitadel-cli: invitation get
  summary: Get an invitation
  description: |
    Returns one invitation by ID for the project named by `project_id`.

    The response never includes the redeem token or the create-time `link`.
    Authenticate with a project secret (`oauth2`) or a console session cookie
    (`sessionCookie`). Reading needs the same project `admin` check as
    `createGrant` (`POST /grants`).
  tags:
    - Invitations
  security:
    - oauth2:
        - project.write
    - sessionCookie: []
  parameters:
    - $ref: ../../../components/parameters/invitation-id.yaml
    - $ref: ../../../components/parameters/project-id.yaml
  responses:
    '200':
      description: The invitation.
      content:
        application/json:
          schema:
            $ref: ../invitation.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: The caller is not a project administrator.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: Invitation or project not found.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: getInvitation-error-response.yaml

delete:
  operationId: cancelInvitation
  x-zitadel-cli: invitation cancel
  summary: Cancel an invitation
  description: |
    Deletes a pending or rejected invitation. A pending invitation's link can
    no longer be redeemed; a rejected one's row and metadata are removed. An
    accepted or expired invitation answers the same opaque `404` as a miss.
    Expired invitations keep their row until a later cleanup job removes them.

    Authenticate with a project secret (`oauth2`) or a console session cookie
    (`sessionCookie`). Cancelling needs the same project `admin` check as
    `createGrant` (`POST /grants`). Cookie requests follow that scheme's CSRF
    rules.
  tags:
    - Invitations
  security:
    - oauth2:
        - project.write
    - sessionCookie: []
  parameters:
    - $ref: ../../../components/parameters/invitation-id.yaml
    - $ref: ../../../components/parameters/project-id.yaml
  responses:
    '204':
      description: The invitation was deleted.
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: The caller is not a project administrator.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: |
        Invitation or project not found, or the invitation is no longer
        pending.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: cancelInvitation-error-response.yaml
