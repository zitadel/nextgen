title: ListInvitationsResponse
description: A page of a project's invitations, newest first.
type: object
required:
  - invitations
properties:
  invitations:
    type: array
    items:
      $ref: invitation.yaml
  next_page_token:
    description: |
      Token to pass as `page_token` in the next request to fetch the following page.
      Absent when there are no more results.
    oneOf:
      - $ref: ../../components/schemas/page-token.yaml
      - type: 'null'
