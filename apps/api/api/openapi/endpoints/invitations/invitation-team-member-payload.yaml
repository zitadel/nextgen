title: TeamMemberInvitationPayload
description: Type-specific input for a `team_member` invitation.
type: object
required:
  - team_id
  - role
properties:
  team_id:
    $ref: ../../components/schemas/team-id.yaml
    description: 'The ID of the team, as `createTeam` (`POST /teams`) returns it.'
  role:
    type: string
    enum:
      - member
    description: The team role the accepter receives.
