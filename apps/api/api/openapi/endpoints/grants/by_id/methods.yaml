get:
  operationId: getGrant
  x-zitadel-cli: grant get
  summary: Get a grant by ID
  # Grants are not registered in `resource_scope_index`, which is why the
  # project scope is required on the query, as it is for events.
  description: |
    Returns a grant by ID, when this API manages it and it has not been revoked.

    This API manages grants that bind a user or team to the viewer, editor or
    admin role. An expired grant is still returned, so you can revoke it with
    `deleteGrant` (`DELETE /grants/{grant_id}`) before you grant the same binding again. Authorization still
    ignores expired grants. Send `project_id` as well as the grant ID.
    Misses, revoked grants, project-secret setup rows (`sk_proj`), owning-team
    (`relation=team`) rows and grants of another project all return `404`.

    `expand=principal` adds envelope fields on `user` or `team`. For project
    secrets it requires `user.read` and `team.read` in addition to `project.read`.
    A user-bound console session that already passed the project check may expand
    without those scopes.

    Authenticate with a project secret (`oauth2`) or a console session cookie
    (`sessionCookie`). Cookie requests follow that scheme's CSRF rules.
  tags:
    - Grants
  security:
    - oauth2:
        - project.read
    - sessionCookie: []
  parameters:
    - $ref: ../../../components/parameters/grant-id.yaml
    - $ref: ../../../components/parameters/project-id.yaml
    - name: expand
      in: query
      required: false
      description: |
        Extra principal fields to add onto `user` or `team`. It takes the same
        values and needs the same `user.read` and `team.read` scopes as
        `POST /grants/query`.
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: ../query/grant-expand.yaml
  responses:
    '200':
      description: The grant.
      content:
        application/json:
          schema:
            $ref: ../grant.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: |
        No unrevoked collaboration grant was found for the given project and
        id (including setup and owning-team rows this API does not manage).
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: getGrant-error-response.yaml

delete:
  operationId: deleteGrant
  x-zitadel-cli: grant delete
  summary: Revoke a grant
  description: |
    Revokes a grant this API manages and emits `authz.revoked`.

    A revoked grant cannot be restored: create a new one. Already-revoked, missing,
    project-secret setup and owning-team grants return `404`. Expired grants can
    still be revoked, so the binding can be reused.

    Authenticate with a project secret (`oauth2`) or a console session cookie
    (`sessionCookie`). Cookie requests follow that scheme's CSRF rules.
  tags:
    - Grants
  security:
    - oauth2:
        - project.write
    - sessionCookie: []
  parameters:
    - $ref: ../../../components/parameters/grant-id.yaml
    - $ref: ../../../components/parameters/project-id.yaml
  responses:
    '204':
      description: The grant was revoked.
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: |
        No unrevoked collaboration grant was found for the given project and
        id (including setup and owning-team rows this API does not manage).
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: deleteGrant-error-response.yaml
