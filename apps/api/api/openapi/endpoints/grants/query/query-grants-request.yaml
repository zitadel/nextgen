type: object
additionalProperties: false
description: Request to query the grants of a project.
properties:
  limit:
    $ref: ../../../components/schemas/limit.yaml
  page_token:
    description: |
      Token to retrieve the next page of results. Must be sent with the same
      `sorting` as the request that issued the token. Omitting `sorting` reuses
      the default sort and only succeeds when that default matches the token.
    oneOf:
      - $ref: ../../../components/schemas/page-token.yaml
      - type: 'null'
  expand:
    type: array
    # The grant exception to the expand rule is defined in ADR 059.
    description: |
      Extra principal fields to add onto each grant's `user` or `team`. Omit
      it and those objects stay refs. An unrecognised value is rejected.
    uniqueItems: true
    items:
      $ref: grant-expand.yaml
  sorting:
    type: object
    additionalProperties: false
    required:
      - field
      - direction
    properties:
      field:
        $ref: grant-sorting-field.yaml
        description: The field to sort by.
      direction:
        $ref: ../../../components/schemas/sort-direction.yaml
        description: The direction to sort by.
  filter:
    type: array
    description: Filter criteria for querying grants. Combined with AND.
    items:
      type: object
      additionalProperties: false
      required:
        - field
        - operation
      # What a `value` and an `operation` may be depends on the field: a timestamp
      # takes an RFC 3339 string and a comparison, a status or state one of its
      # names with `equals`, any other field a string with `equals` or `contains`.
      # The server refuses anything else, and a missing value, with `400`.
      if:
        required:
          - field
        properties:
          field:
            enum: [created_at]
      then:
        $ref: ../../../components/schemas/filter-timestamp-value.yaml
      else:
        if:
          required:
            - field
          properties:
            field:
              enum: [expires_at]
        then:
          # A grant that does not expire has a null `expires_at`: a null or missing
          # `value` selects it, and only `equals` can.
          properties:
            field: {}
            operation:
              enum: [equals, less_than, greater_than, greater_than_or_equal]
            value:
              type: [string, 'null']
              format: date-time
          if:
            anyOf:
              - not:
                  required:
                    - value
              - properties:
                  value:
                    type: 'null'
          then:
            properties:
              operation:
                const: equals
          else:
            required:
              - value
        else:
          if:
            required:
              - field
            properties:
              field:
                enum: [relation]
          then:
            required:
              - value
            properties:
              field: {}
              operation:
                const: equals
              value:
                enum: [viewer, editor, admin]
          else:
            $ref: ../../../components/schemas/filter-text-value.yaml
      properties:
        field:
          $ref: grant-filter-field.yaml
          description: The field to filter by.
        value:
          $ref: ../../../components/schemas/filter-value.yaml
        operation:
          $ref: ../../../components/schemas/filter-operation.yaml
