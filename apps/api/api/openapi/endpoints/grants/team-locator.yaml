title: TeamLocator
description: |
  Names a team with exactly one of `team_id` or `name`. Sending both
  or neither is `grant.invalid`. Unknown properties are rejected as
  `req.invalid`.
type: object
additionalProperties: false
# Exactly one of `team_id` and `name`. Written as if/then/else because ogen
# cannot generate a `oneOf` of bare `required` lists.
if:
  required:
    - team_id
then:
  not:
    required:
      - name
else:
  required:
    - name
properties:
  team_id:
    type: string
    pattern: '^team_[a-zA-Z0-9_-]+$'
    example: team_01KZZY8PX8K8ATNVDSMRCZY4N1
    description: |
      Platform-homed team id (`team_<opaque>`). The team must be active.
  name:
    type: string
    minLength: 1
    description: |
      Team name, unique per project case-insensitively. Looked up in
      the platform project. The team must be active.
    example: Acme AI Admins
