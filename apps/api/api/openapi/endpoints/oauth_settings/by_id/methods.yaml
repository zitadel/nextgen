get:
  operationId: getOAuthSettings
  summary: Get an OAuth settings revision by ID
  description: |
    Returns one OAuth settings revision, including its stored settings. Pass
    the `revision_id` of the `kind: oauth` pointer on a release, which
    `buildRelease` (`POST /releases/build`) and `getRelease`
    (`GET /releases/{release_id}`) return.

    A release is the only writer of OAuth settings, so there is no operation
    that publishes a revision on its own: put `oauth` in the bundle that
    `buildRelease` takes.
  tags:
    - OAuth Settings
  security:
    - oauth2:
        - oauth_settings.read
    - sessionCookie: []
  parameters:
    - $ref: ../../../components/parameters/oauth-settings-id.yaml
  responses:
    '200':
      description: The OAuth settings revision.
      content:
        application/json:
          schema:
            $ref: ../oauth-settings-revision-response.yaml
    '404':
      description: No OAuth settings revision was found with the given ID.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: getOAuthSettings-error-response.yaml
