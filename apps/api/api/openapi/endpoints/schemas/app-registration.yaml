x-meta-schema: true
title: AppRegistration
description: |
  How clients may join the app on their own. A client that registers names no app: the app is the one
  whose API its first authorization request names as `resource`, and the client may ask only for that
  app's `third_party` APIs, each with the user's consent. Both ways are off when left out, because open
  registration is an abuse surface (ADR 078).
type: object
additionalProperties: false
properties:
  client_id_metadata_documents:
    type: boolean
    description: A client may use an HTTPS URL as its `client_id`, and the document behind it says who
      it is (ADR 082 §9). What MCP clients use.
  dynamic:
    type: boolean
    description: A client may register through RFC 7591 dynamic client registration, for clients that
      register no other way.
