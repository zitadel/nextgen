title: PasswordSetPolicyTest
type: object
description: Test cases for the password policy, checked before a password is set.
required:
  - operation
  - cases
properties:
  operation:
    type: string
    enum:
      - auth.factor.password.set
    description: The operation whose policy the cases test.
  cases:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - name
        - input
        - expect
      properties:
        name:
          type: string
          minLength: 1
          description: What the case shows, printed with its result.
        input:
          $ref: ../policies/evaluate/password-set-evaluate-input.yaml
        facts:
          $ref: ../policies/evaluate/password-set-evaluate-facts.yaml
        expect:
          $ref: policy-test-expect.yaml
