x-meta-schema: true
title: AppClient
description: |
  An OAuth 2.1 client of the app: a web app, a SPA, a native app, a CLI or a
  service that gets tokens from the project's authorization server. OpenID
  Connect is OAuth plus the `openid` scope, so one client shape serves both.
type: object
required:
- slug
- type
- grants
additionalProperties: false
properties:
  slug:
    type: string
    pattern: ^[a-z0-9][a-z0-9_-]*$
    maxLength: 64
    description: Stable identifier of the client, unique among the app's clients and APIs. Other
      documents and the console name it as `<app>/<client>`.
    examples:
    - web
    - deploy
  name:
    type: string
    minLength: 1
    maxLength: 256
    description: Shown on the consent screen in place of the app's name. Optional.
  client_id:
    type: string
    pattern: ^[A-Za-z0-9._~@-]+$
    minLength: 1
    maxLength: 255
    description: |
      The `client_id` the client presents. Leave it out and the server mints one the first time
      the client is written. Set it to keep an id a client already has: one compiled into a desktop
      or mobile app, one a v4 or another identity provider issued, or one every project the release
      ships to should share. Either way it is fixed for the life of the client: a revision that
      changes it is refused, and a revision that leaves it out keeps it. Unique within the project,
      and never in the form the server mints (`client_` followed by an id).
    examples:
    - OpenCloudDesktop
    - 289374592837459283@shop
  type:
    type: string
    enum:
    - public
    - confidential
    description: '`public` clients (SPAs, native apps, CLIs) hold no credential and prove themselves
      with PKCE alone. `confidential` clients authenticate at the token endpoint.'
  auth_method:
    type: string
    enum:
    - none
    - client_secret_basic
    - client_secret_post
    - private_key_jwt
    description: How the client authenticates at the token endpoint. A public client uses `none`,
      which is also its default. A confidential client uses a secret, `client_secret_basic` unless
      this says `client_secret_post`, or signs an assertion with a key in `jwks`
      (`private_key_jwt`).
  secret:
    type: string
    pattern: ^\$\{\{ *[A-Z_][A-Z0-9_]* *\}\}$
    description: |
      The client secret of an app declared in the release, as a `${{ NAME }}` reference to a
      project variable (ADR 062), never the value itself. The server reads the variable from the
      deployment when the client authenticates. An app registered through the API holds no
      reference: its secrets are generated by the server or imported.
    examples:
    - ${{ SHOP_WEB_CLIENT_SECRET }}
  jwks:
    type: object
    required:
    - keys
    additionalProperties: false
    description: The public keys a `private_key_jwt` client signs its assertions with, as a JWK set.
      Public members only, so a private key can never be committed.
    properties:
      keys:
        type: array
        minItems: 1
        maxItems: 10
        items:
          $ref: app-client-jwk.yaml
  grants:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      enum:
      - authorization_code
      - refresh_token
      - client_credentials
    description: |
      The grant types the client may use. `authorization_code` signs a user in with PKCE (every
      client, OAuth 2.1); `refresh_token` keeps a grant alive; `client_credentials` lets a
      confidential client act as itself, so the tokens it gets have the client as `sub`. A public
      client holds no secret and may not use `client_credentials`.
  redirect_uris:
    type: array
    uniqueItems: true
    maxItems: 50
    items:
      type: string
      minLength: 1
      maxLength: 2048
    description: |
      Where the authorization endpoint may send the user back, matched exactly. A loopback
      `http://127.0.0.1`, `http://[::1]` or `http://localhost` URI matches on any port (RFC 8252
      §7.3), and a public client may use a private-use scheme such as `com.example.app:/callback`
      (RFC 8252 §7.1). Required with `authorization_code`.
    examples:
    - - https://shop.example.com/callback
  post_logout_redirect_uris:
    type: array
    uniqueItems: true
    maxItems: 50
    items:
      type: string
      minLength: 1
      maxLength: 2048
    description: Where RP-initiated logout may send the user afterwards, matched exactly.
  first_party:
    type: boolean
    description: A first-party client skips consent unless the request asks for it (ADR 082 §3). When
      left out, a client of an app declared in the release is first-party and a client of an app
      registered through the API is not.
  consent:
    type: string
    enum:
    - skip
    - new_scopes
    - always
    description: |
      When the user is asked to consent. `skip` never asks unless the request says `prompt=consent`,
      and only a first-party client may skip. `new_scopes` asks for scopes the user has not consented
      to yet. `always` asks on every request. Defaults to `skip` for a first-party client and
      `new_scopes` for a third-party one.
  account_choice:
    type: boolean
    description: Lets the user pick an account, or sign in as someone else, when a session is already
      live (ADR 081 §11). A request asks for it with `prompt=select_account` either way.
  id_token_signed_response_alg:
    type: string
    enum:
    - RS256
    - ES256
    description: The algorithm the client's ID tokens are signed with. RS256 when left out
      (ADR 082 §7).
  apis:
    type: array
    maxItems: 50
    items:
      $ref: app-client-api.yaml
    description: |
      The APIs the client may get access tokens for, its default first. A token is for one API
      (RFC 8707): the request names it with `resource`, and a request for an API not listed here
      fails with `invalid_target`.
