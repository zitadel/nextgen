x-meta-schema: true
title: SSOAuthMethod
type: object
required:
- enabled
additionalProperties: false
properties:
  enabled:
    type: boolean
    description: Whether the authentication method is enabled.
  providers:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: ^[a-z0-9][a-z0-9_-]*$
      x-zitadel-pattern-message: "must start with a lowercase letter or digit and use only lowercase letters, digits, _ and -"
      maxLength: 64
      examples:
      - google
      - corp_idp
    description: Slugs of the project's identity providers (external sign-ins such as Google) that users
      of this schema can sign in with. Each entry must match the `slug` of a connection document under
      `.zitadel/idps/`; an identity provider existing does not by itself make it available here.
if:
  properties:
    enabled:
      const: true
  required:
  - enabled
then:
  required:
  - providers
else:
  not:
    required:
    - providers
