title: AppAPIScope
type: object
required:
- name
additionalProperties: false
properties:
  name:
    type: string
    pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]*$
    maxLength: 128
    description: The scope as a client requests it. Unique within the API, and none of the built-in
      `openid`, `profile`, `email`, `address`, `phone` and `offline_access`.
    examples:
    - orders.read
  description:
    type: string
    minLength: 1
    maxLength: 256
    description: What the scope lets a client do, shown on the consent screen.
    examples:
    - Read your orders
