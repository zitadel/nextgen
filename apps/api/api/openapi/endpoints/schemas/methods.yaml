post:
  operationId: publishSchema
  summary: Publish a schema
  description: |
    Publishes a user schema, the JSON Schema that says which attributes a user
    has and which attribute identifies the user.

    The request is either a user schema (`kind: user-schema`) or a schema URL
    (`kind: schema-url`) that the server resolves. The response is the stored
    schema, as `getSchema` (`GET /schemas/{schema_id}`) returns it; its `id` is
    what `createUser` (`POST /users`) takes as `schema`.

    The optional `$id` is the JSON Schema document URI that identifies the
    schema in later requests. It is a stable identity for GitOps, not a
    free-form resource key. When `$id` is omitted, the server generates a
    `sch_*` URL. When provided, `$id` must be unique within the project and
    should ideally be a valid URI pointing at where the schema can be accessed.
    A `$id` that already exists in the project is refused; pick another or
    omit it.
  tags:
    - Schemas
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
    - $ref: ../../components/parameters/team-id.yaml
  security:
    - oauth2:
        - schema.write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          oneOf:
            - $ref: user-schema.yaml
            - $ref: schema-url.yaml
          discriminator:
            propertyName: kind
            mapping:
              user-schema: user-schema.yaml
              schema-url:  schema-url.yaml
        examples:
          userSchema:
            summary: An example of a schema definition for a user.
            externalValue: examples/user-schema-example.yaml
          schemaURL:
            summary: |
              An example of a schema definition that references an external
              schema URL.
            externalValue: examples/schema-url-example.yaml
          defaultHumanUserSchema:
            summary: The default human user schema provided by the server.
            externalValue: examples/default-human-user-schema.json
  responses:
    '201':
      description: The published schema.
      content:
        application/json:
          schema:
            $ref: schema.yaml
          examples:
            userSchemaResponse:
              summary: |
                An example of the response to publishing a user schema.
              externalValue: examples/published-schema-example.yaml
    default:
      $ref: publishSchema-error-response.yaml

get:
  operationId: listSchemas
  x-zitadel-cli: schema list
  summary: List schemas
  description: |
    Lists the schemas of a project, newest first, paginated with a cursor.
    Filter by `object_type` or `kind`, and choose which revisions to return
    with `revisions`.

    A schema's `id` is what `createUser` (`POST /users`) takes as `schema`.
  tags:
    - Schemas
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
    - $ref: ../../components/parameters/limit.yaml
    - $ref: ../../components/parameters/page-token.yaml
    - name: object_type
      in: query
      description: The type of object of the schema to filter by.
      schema:
        type: string
        maxLength: 256
    - name: revisions
      in: query
      description: |
        Which revisions to return. Schemas are immutable and versioned by URL,
        so editing one creates a new revision that shares its `objectType`.

        `all` (the default) returns every revision: the full history an export,
        an audit or a GitOps diff needs. `latest` returns the newest revision of
        each `objectType`, which is one entry per schema.

        A schema stored without an `objectType` is a revision of nothing, and
        is returned by both.

        A `page_token` is bound to the mode it was issued in and is rejected by
        the other.
      schema:
        type: string
        default: all
        enum:
          - all
          - latest
    - name: kind
      in: query
      description: |
        The kind of schema to filter by, read from the stored document's
        `kind` property.

        `schema-url` is not a kind: it discriminates the create request body,
        not a stored schema. A schema registered by URL is stored as whatever
        document the URL served, and declares its own kind.

        A schema stored without its document being parsed has no kind that
        could be read, and is excluded from every filtered result.
      schema:
        type: string
        enum:
          - user-schema
    - name: expand
      in: query
      required: false
      description: Extra fields to add onto each returned schema.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: schema-expand.yaml
  security:
    - oauth2:
        - schema.read
    - sessionCookie: []
  responses:
    '200':
      description: A page of schemas.
      content:
        application/json:
          schema:
            $ref: list-schemas-response.yaml
    default:
      $ref: listSchemas-error-response.yaml