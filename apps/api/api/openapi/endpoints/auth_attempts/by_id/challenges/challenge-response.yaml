type: object
description: |
  A challenge issued within an authentication attempt.

  A challenge asks the user to prove one factor: a password, a TOTP code, a
  passkey assertion and so on. The client submits the proof with
  `verifyAuthAttemptChallenge` (`POST /auth_attempts/{attempt_id}/challenges/{challenge_id}/verify`)
  (`POST /auth_attempts/{attempt_id}/challenges/{challenge_id}/verify`).
required:
  - challenge_id
  - method
  - state
  - created_at
properties:
  challenge_id:
    $ref: ../../../../components/schemas/challenge-id.yaml
  method:
    $ref: ../../../../components/schemas/challenge-method.yaml
    description: |
      The authentication method this challenge represents.
      It determines which proof `verifyAuthAttemptChallenge` (`POST /auth_attempts/{attempt_id}/challenges/{challenge_id}/verify`) expects.
  state:
    type: string
    enum:
      - pending
      - failed
      - expired
    description: |
      Current state of this challenge:
      - `pending`: awaiting proof submission
      - `failed`: proof rejected (invalid credential, wrong code, etc.)
      - `expired`: the challenge's lifetime passed without a verified proof
  created_at:
    type: string
    format: date-time
    description: When this challenge was issued.
    example: '2026-04-28T15:31:00Z'
  expires_at:
    description: When this challenge expires.
    oneOf:
      - type: string
        format: date-time
        example: '2026-04-28T15:41:00Z'
      - type: 'null'
  payload:
    description: |
      Method-specific challenge data. Structure depends on the `method` field.
      - `identifier`, `password`: null (no additional data needed)
      - `passkey`: WebAuthn challenge and credential options
      - `idp`: Authorization URL and provider information
    oneOf:
      - $ref: ./identifier-challenge-payload.yaml
      - $ref: ./password-challenge-payload.yaml
      - $ref: ./passkey-challenge-payload.yaml
    discriminator:
      propertyName: method
      mapping:
        identifier: ./identifier-challenge-payload.yaml
        password: ./password-challenge-payload.yaml
        passkey: ./passkey-challenge-payload.yaml
