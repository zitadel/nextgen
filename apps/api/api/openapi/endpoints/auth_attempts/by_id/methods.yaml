get:
  operationId: getAuthAttempt
  summary: Get authentication attempt state
  description: |
    Polls the current state of an authentication attempt.

    Returns the attempt's state, available factors for the next challenge,
    challenges issued so far, and any errors preventing progress.

    Use this for polling during long-running factor verifications (e.g., waiting for
    a federated IdP callback or a device flow).

    Reuses the deployment sealed when the attempt was created. If that release
    was revoked since, the response is `409` with `rel.revoked`.
  tags:
    - Authentication Attempts
  security:
    - oauth2:
        - auth_attempt.read
  parameters:
    - $ref: ../../../components/parameters/attempt-id.yaml
  responses:
    '200':
      description: Current state of the authentication attempt
      content:
        application/json:
          schema:
            $ref: ../auth-attempt-response.yaml
    '409':
      description: |
        The sealed release was revoked (`rel.revoked`).
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
          examples:
            revoked:
              summary: The sealed release was revoked
              value:
                code: rel.revoked
                message: 'the release this attempt runs on was revoked'
    default:
      $ref: getAuthAttempt-error-response.yaml
