get:
  operationId: getAuthAttempt
  summary: Get an authentication attempt by ID
  description: |
    Returns the current state of an authentication attempt, one sign-in round.

    The response holds the attempt's state, available factors for the next
    challenge, challenges issued so far, and any errors preventing progress.

    Use it to poll during long-running factor verifications, for example waiting
    for a federated identity provider (IdP) callback or a device flow.
  tags:
    - Authentication Attempts
  security:
    - oauth2:
        - auth_attempt.read
  parameters:
    - $ref: ../../../components/parameters/attempt-id.yaml
  responses:
    '200':
      description: The current state of the authentication attempt.
      content:
        application/json:
          schema:
            $ref: ../auth-attempt-response.yaml
          example:
            attempt_id: att_01J0Z9KX7Y0Q2Y7JX5M9K2YF3C
            project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
            state: in_progress
            session_id: sess_01J0Z9KX7Y0Q2Y7JX5M9K2YF3C
            user_id: user_01KWH3B72K7M7F0N9WD3P2E4YM
            required_factors:
              - identifier
              - password
            completed_factors:
              - method: passkey
                verified_at: '2026-04-28T15:32:00Z'
                payload:
                  method: passkey
                  credential_id: Y3JlZGVudGlhbDE=
                  user_verified: true
                  backup_eligible: true
                  backup_state: true
                  authenticator_attachment: platform
            challenges:
              - challenge_id: ch_01J0Z9KX7Y0Q2Y7JX5M9K2YF3C
                method: password
                state: pending
                created_at: '2026-04-28T15:31:00Z'
                expires_at: '2026-04-28T15:41:00Z'
            expires_at: '2026-04-28T15:45:00Z'
            created_at: '2026-04-28T15:30:00Z'
    default:
      $ref: getAuthAttempt-error-response.yaml
