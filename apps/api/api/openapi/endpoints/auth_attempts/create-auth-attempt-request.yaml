type: object
description: Request to create an authentication attempt.
required:
  - project_id
# A session to step up needs the proof that it is the caller's.
if:
  required:
    - session_id
  properties:
    session_id:
      type: string
then:
  required:
    - session_token
properties:
  project_id:
    $ref: "../../components/schemas/project-id.yaml"
  challenge_nonce:
    $ref: "../../components/schemas/challenge-nonce.yaml"
  session_id:
    description: |
      Optional. If provided, this attempt adds factors to an existing session (step-up authentication).
      If omitted, a new session is created implicitly when the handoff is exchanged.
      Requires `session_token`.
    oneOf:
      - $ref: "../../components/schemas/session-id.yaml"
      - type: 'null'
  session_token:
    $ref: "../../components/schemas/session-proof-token.yaml"

