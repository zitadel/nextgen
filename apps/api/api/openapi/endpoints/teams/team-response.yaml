type: object
description: Details of a team.
required:
  - id
  - name
  - status
  - created_at
  - updated_at
properties:
  id:
    type: string
    description: The unique identifier of the team.
  name:
    type: string
    description: The name of the team.
  status:
    $ref: ../../components/schemas/team-status.yaml
  created_at:
    type: string
    format: date-time
    description: The time when the team was created.
  updated_at:
    type: string
    format: date-time
    description: The time when the team was last updated.
