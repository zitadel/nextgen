get:
  operationId: getFlowStep
  summary: Get current step (re-render)
  description: |
    Returns the current capability step without advancing the state machine.
    Useful for page reloads or re-rendering after a network error.

    Reuses the deployment sealed into `_zflow` at `createFlow`; it does not
    re-resolve from `Origin`. If that release was revoked since the attempt
    started, the response is `409` with `rel.revoked`.
  tags:
    - Flows
  security: []
  parameters:
    - $ref: ../../../components/parameters/flow-id.yaml
    - $ref: ../../../components/parameters/flow-cookie.yaml
  responses:
    '200':
      description: |
        Current step. Only a render that resolved a parked SSO identity sets
        the flow cookie; any other render leaves it unchanged. When that
        render completed the sign-in, the step is terminal, the cookie is
        cleared, and the step carries the handoff token.
      headers:
        Set-Cookie:
          $ref: ../../../components/headers/set-cookie-flow.yaml
        Cache-Control:
          $ref: ../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: ../../../components/flows/flow-response.yaml
    '409':
      description: |
        The flow cannot continue: the flow's auth attempt expired or was
        already handed off (`flow.restart_required`), the provider's
        identity is linked to a user of a schema this flow does not serve
        (`flow.sso_user_schema_mismatch`, which starting again does not
        fix), or the sealed release was revoked (`rel.revoked`).
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
          examples:
            revoked:
              summary: The sealed release was revoked
              value:
                code: rel.revoked
                message: 'the release this attempt runs on was revoked'
    '404':
      description: Flow not found.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '410':
      description: Flow has already completed.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: getFlowStep-error-response.yaml