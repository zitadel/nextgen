get:
  operationId: getFlowStep
  summary: Get the current step of a flow
  description: |
    Returns the current step of a flow without advancing it. Use it to render
    the step again after a page reload or a network error.

    The flow endpoints are the runtime calls the login component
    (`<zitadel-login>`) makes, step by step. `createFlow` starts a flow, and
    `submitFlowStep` advances it.

    Reuses the deployment sealed into `_zflow` at `createFlow`; it does not
    re-resolve from `Origin`. If that release was revoked since the attempt
    started, the response is `409` with `rel.revoked`.
  tags:
    - Flows
  security: []
  parameters:
    - $ref: ../../../components/parameters/flow-id.yaml
    - $ref: ../../../components/parameters/flow-cookie.yaml
  responses:
    '200':
      description: |
        The current step. Only a render that resolved a parked SSO identity
        sets the flow cookie; any other render leaves it unchanged. When that
        render completed the sign-in, the step is terminal, the cookie is
        cleared, and the step carries the handoff token, which the app
        exchanges for a session at `POST /sessions/exchange`.
      headers:
        Set-Cookie:
          $ref: ../../../components/headers/set-cookie-flow.yaml
        Cache-Control:
          $ref: ../../../components/headers/cache-control-private-no-store.yaml
      content:
        application/json:
          schema:
            $ref: ../../../components/flows/flow-response.yaml
    '409':
      description: |
        The flow must be restarted: the provider's identity belongs to a
        user the flow cannot continue with, the flow's authentication attempt
        (one sign-in journey) expired or was already handed off, or the sealed
        release was revoked (`rel.revoked`). Start a new flow with
        `createFlow`.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
          examples:
            revoked:
              summary: The sealed release was revoked
              value:
                code: rel.revoked
                message: 'the release this attempt runs on was revoked'
    '404':
      description: The flow was not found.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '410':
      description: The flow has already completed.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: getFlowStep-error-response.yaml