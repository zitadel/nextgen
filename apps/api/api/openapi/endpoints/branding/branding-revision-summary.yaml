title: BrandingRevisionSummary
description: |
  A branding revision without its configuration: the shape `GET /branding`
  returns. Read the configuration with `GET /branding/{branding_id}`.
type: object
required:
  - id
  - created_at
properties:
  id:
    type: string
    description: The unique identifier of this branding revision.
  created_at:
    type: string
    format: date-time
    description: When this revision was published.
