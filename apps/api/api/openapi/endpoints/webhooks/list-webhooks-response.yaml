title: ListWebhooksResponse
type: object
# Pagination follows ADR 027.
description: A page of a project's webhooks, newest first.
required:
  - data
properties:
  data:
    description: The webhooks of this page.
    type: array
    items:
      $ref: webhook.yaml
  next_page_token:
    description: |
      Token to pass as `page_token` in the next request to fetch the following page.
      Absent when there are no more results.
    oneOf:
      - $ref: ../../components/schemas/page-token.yaml
      - type: 'null'
