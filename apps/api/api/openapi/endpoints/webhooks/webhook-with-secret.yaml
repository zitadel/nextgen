title: WebhookWithSecret
description: |
  A webhook together with its signing secret. Only `createWebhook` and
  `rotateWebhookSecret` answer with it: store the secret then, because no
  other response returns it.
allOf:
  - $ref: webhook.yaml
  - type: object
    required:
      - secret
    properties:
      secret:
        type: string
        description: |
          The secret the server signs the webhook's deliveries with: `whsec_`
          followed by 32 random bytes in base64. The server generates it; a
          caller cannot choose it.
        example: whsec_C2FVsBQIhrscChlQIMV+b5sSYspob7oDZJQk1o3DdH8=
