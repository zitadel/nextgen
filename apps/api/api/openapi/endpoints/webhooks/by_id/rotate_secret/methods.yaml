post:
  operationId: rotateWebhookSecret
  summary: Rotate a webhook's secret
  description: |
    Issues a new signing secret for a webhook and returns the webhook with
    it.

    The `secret` appears only in this response. The previous secret stays
    valid for 24 hours, until `previous_secret_expires_at`: during that time
    every delivery carries two signatures, one per secret, so the endpoint
    can switch to the new secret without refusing a request. A second
    rotation within those 24 hours drops the older of the two secrets at
    once.

    The rotation records a `webhook.secret_rotated` event, which holds
    neither secret.

    A repeated request rotates again. After a lost response that means the
    secret nobody received becomes the previous one, and the secret the
    endpoint still verifies with stops being valid at once. Give the
    endpoint the secret of the second response right away, since it refuses
    every delivery until it has it.

    Authenticate with a project secret (`oauth2`), or with the session cookie
    (`sessionCookie`) of a signed-in person who can change the project.
    Cookie requests follow that scheme's CSRF rules.
  tags:
    - Webhooks
  security:
    - oauth2:
        - webhook.write
    - sessionCookie: []
  parameters:
    - $ref: ../../../../components/parameters/webhook-id.yaml
    - $ref: ../../../../components/parameters/project-id.yaml
  responses:
    '200':
      description: The webhook, with its new signing secret, this once.
      content:
        application/json:
          schema:
            $ref: ../../webhook-with-secret.yaml
          examples:
            rotated:
              summary: The webhook after a rotation
              description: |
                The previous secret stays valid until
                `previous_secret_expires_at`, 24 hours after the rotation.
              value:
                id: hook_01KWH3B7K2M9P4R6T8V0X2Z4C6
                project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                url: https://api.acme.com/hooks/zitadel
                description: User sync
                event_types:
                  - user.created
                  - user.updated
                  - user.deleted
                enabled: true
                last_delivered_at: '2026-11-11T10:00:12Z'
                last_error_status: null
                last_error_at: null
                previous_secret_expires_at: '2026-11-12T10:30:00Z'
                created_at: '2026-11-11T10:00:00Z'
                secret: whsec_9bWm2xkq0n4OZ1p5cFh3TtYJ8sVdR7uEaLwGyPqHf6I=
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '403':
      description: The caller cannot change the project's webhooks.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    '404':
      description: Webhook or project not found.
      content:
        application/json:
          schema:
            $ref: ../../../../components/error-details.yaml
    default:
      $ref: rotateWebhookSecret-error-response.yaml
