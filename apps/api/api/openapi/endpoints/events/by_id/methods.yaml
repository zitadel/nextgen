get:
  operationId: getEvent
  x-zitadel-cli: event get
  summary: Get an event by ID
  # Events are not registered in resource_scope_index, so the query must carry
  # the project scope (ADR 049).
  description: |
    Returns one event of a project by its ID. Requires `events.read`.

    Pass the `id` of an event that `listEvents` (`GET /events`) returns, with its
    `project_id`. An unknown ID and the ID of another project's event both
    answer `404`.

    A project that is not claimed yet also answers `404`: its events are
    stored but stay invisible until the
    [claim](/docs/concepts/project-team-user#claim) succeeds. The deployment's
    platform operators read them from the start.
  tags:
    - Events
  security:
    - oauth2:
        - events.read
    - sessionCookie: []
  parameters:
    - $ref: ../../../components/parameters/event-id.yaml
    - $ref: ../../../components/parameters/project-id.yaml
  responses:
    '200':
      description: The event.
      content:
        application/json:
          schema:
            $ref: ../event.yaml
          example:
            id: evt_01HZYABCDEFGHJKMNPQRSTVWXY
            project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
            team_id: team_01KWH3B72K7M7F0N9WD3P2E4YM
            event_type: application.created
            category: entity
            occurred_at: '2026-01-15T09:30:00Z'
            created_at: '2026-01-15T09:30:00Z'
            actor_id: example
            actor_type: human
            entity_type: example
            entity_id: example
            user_id: user_01KWH3B72K7M7F0N9WD3P2E4YM
            client_id: example
            token_id: example
            delegation_type: direct
            delegation_id: example
            grantor: example
            fingerprint: example
            request_id: example
            session_id: sess_01KWH3B72K7M7F0N9WD3P2E4YM
            flow_id: flow_01KWH3B72K7M7F0N9WD3P2E4YM
            metadata:
              authorization:
                path: platform_operator
                actor_home_project_id: proj_01KWH3B72K7M7F0N9WD3P2E4YM
              client:
                ip: example
                user_agent: example
                origin: example
            payload:
              slug: acme
              name: Acme
              client_ids:
                - example
              revision_id: rev_01KWH3B72K7M7F0N9WD3P2E4YM
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: No event was found for the given project and ID, or the project is not claimed yet.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: getEvent-error-response.yaml
