title: AppCredentialPayload
type: object
description: |
  A credential of a client of the app (the event's `entity_id`) was added or
  revoked. Never a secret, its hash or a key.
required:
  - client
  - client_id
  - credential_id
  - name
  - kind
properties:
  client:
    type: string
    description: The client's slug.
  client_id:
    type: string
  credential_id:
    type: string
  name:
    type: string
  kind:
    type: string
    enum:
      - secret
      - key
  origin:
    type: string
    enum:
      - generated
      - imported
    description: How a secret was added, on `app.credential.added`. Absent for a key and on `app.credential.revoked`.
