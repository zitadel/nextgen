title: DeploymentCreatedPayload
type: object
description: |
  Payload for `deployment.created`. The deployment ID is the event's
  `entity_id`; the fields here say which release went live on which origins.
properties:
  release_id:
    type: string
    description: 'The ID of the release the deployment makes live.'
  targets:
    type: array
    maxItems: 1000
    description: The origins the release went live on, sorted.
    items:
      type: string
  reason:
    type: string
    description: 'Why the deployment was created.'
  message:
    type: string
    description: 'The message the deployment was created with.'
  rollback_to:
    type: string
    description: 'The ID of the deployment this one rolled back to. Absent when it is not a rollback.'
