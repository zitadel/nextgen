title: AppClientSecretAddedPayload
type: object
description: |
  A client of the app (the event's `entity_id`) got a secret: one the server
  generated, or one imported from another system. Never the secret or its
  hash.
required:
  - client
  - client_id
  - secret_id
  - origin
properties:
  client:
    type: string
    description: The client's slug.
  client_id:
    type: string
  secret_id:
    type: string
  origin:
    type: string
    enum:
      - generated
      - imported
