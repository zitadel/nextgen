title: ApplicationPayload
type: object
description: |
  Payload for `application.created`, which holds every field, and
  `application.updated`, which holds the new `revision_id`, `name` when it
  changed, and `client_ids` when the revision added a client.
  `application.client_secret.rotated` holds the `client_ids` whose secrets
  were replaced and the newest `revision_id`. The application ID is the
  event's `entity_id`. The application document and the client secrets are
  never included.
required:
  - revision_id
properties:
  slug:
    type: string
  name:
    type: string
  client_ids:
    type: array
    description: |
      The `client_id` of each client the write created. A registered
      application's new client got a new secret; a declared one's names the
      variable holding its secret. For `application.client_secret.rotated`,
      the clients whose secrets were replaced.
    items:
      type: string
  revision_id:
    type: string
    description: |
      The revision the write appended. For
      `application.client_secret.rotated`, the newest revision, which the
      retry did not change.
