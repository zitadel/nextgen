title: VariableSetPayload
type: object
description: |
  Payload for `variable.set` events: one value of the variable entered or
  replaced. The value is never included, plain or encrypted.
properties:
  kind:
    type: string
    description: 'The kind of the variable that was set: `primary` or `preview`.'
    enum:
      - primary
      - preview
  secret:
    type: boolean
    description: 'Whether the variable is a secret. A secret''s value is never returned.'
