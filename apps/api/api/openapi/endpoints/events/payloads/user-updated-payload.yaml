title: UserUpdatedPayload
type: object
description: |
  Payload for `user.updated`. The attribute rules are those of `user.created`:
  the keys written, plus values only for fields marked `x-audit`.
properties:
  attribute_keys:
    type: array
    maxItems: 1000
    description: 'The names of the attributes the update changed. Their values are in `attributes`.'
    items:
      type: string
  attributes:
    type: object
    description: 'The attributes the update changed, with their new values.'
    additionalProperties: true
