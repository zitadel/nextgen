title: FlowdefPayload
type: object
description: |
  Payload for `flowdef.created`: the fields of the created flow definition
  revision, without its steps. The retired `flowdef.updated` event carries the
  changed fields in the same shape.
properties:
  name:
    type: string
    description: 'The name of the flow definition.'
  user_schema:
    type: string
    description: 'The `objectType` of the user schema the flow definition operates on.'
  purposes:
    type: object
    description: 'The flow definition''s purposes: each purpose and the step it starts at.'
    additionalProperties:
      type: string
  audience:
    type: object
    description: 'The apps and teams the flow definition applies to.'
    properties:
      app_ids:
        type: array
        maxItems: 1000
        description: 'The IDs of the apps the flow definition applies to.'
        items:
          type: string
      team_ids:
        type: array
        maxItems: 1000
        description: 'The IDs of the teams the flow definition applies to.'
        items:
          type: string
