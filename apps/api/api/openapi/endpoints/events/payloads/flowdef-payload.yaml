title: FlowdefPayload
type: object
description: |
  Allowlisted fields of the created revision. Retired `flowdef.updated`
  rows carry a delta in the same shape. Steps are omitted.
properties:
  name:
    type: string
  status:
    type: string
  user_schema:
    type: string
  purposes:
    type: object
    additionalProperties:
      type: string
  audience:
    type: object
    properties:
      app_ids:
        type: array
        items:
          type: string
      team_ids:
        type: array
        items:
          type: string
