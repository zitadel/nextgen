title: FlowdefPayload
type: object
description: |
  Payload for `flowdef.created`: the fields of the created flow definition
  revision, without its steps. The retired `flowdef.updated` event carries the
  changed fields in the same shape.
properties:
  name:
    type: string
  user_schema:
    type: string
  purposes:
    type: object
    additionalProperties:
      type: string
  audience:
    type: object
    properties:
      app_ids:
        type: array
        items:
          type: string
      team_ids:
        type: array
        items:
          type: string
