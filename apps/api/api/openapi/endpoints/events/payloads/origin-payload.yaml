title: OriginPayload
type: object
description: |
  Payload for `origin.added` and `origin.removed`.
required:
  - pattern
  - kind
properties:
  pattern:
    type: string
    minLength: 1
    description: 'The origin pattern that was added or removed.'
  kind:
    type: string
    description: 'Whether the origin is the project''s `primary` origin or a `preview` one.'
    enum:
      - primary
      - preview
