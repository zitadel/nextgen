title: ClientRegistrationPayload
type: object
description: |
  The metadata a client registered with through dynamic client registration
  (RFC 7591), as the server keeps it, after its defaults. The client
  registration (the event's `entity_id`) is the `client_id`. Never the secret
  or its hash.
required:
  - redirect_uris
  - grant_types
  - token_endpoint_auth_method
properties:
  client_name:
    type: string
  client_uri:
    type: string
  logo_uri:
    type: string
  policy_uri:
    type: string
  tos_uri:
    type: string
  software_id:
    type: string
  software_version:
    type: string
  redirect_uris:
    type: array
    items:
      type: string
  grant_types:
    type: array
    items:
      type: string
      enum:
        - authorization_code
        - refresh_token
  token_endpoint_auth_method:
    type: string
    enum:
      - none
      - client_secret_basic
      - client_secret_post
