title: InvitationAcceptedPayload
type: object
description: |
  Payload for `invitation.accepted`. The invitation ID is the event's
  `entity_id`, and `user_id` is the user who redeemed the link. The role or
  membership the acceptance granted is recorded by its own event, such as
  `authz.granted`, which shares this event's `request_id`.
required:
  - type
  - journey_id
  - user_id
properties:
  type:
    type: string
    enum:
      - project_member
      - team_member
  project_member:
    $ref: ../../invitations/invitation-project-member-payload.yaml
  team_member:
    $ref: ../../invitations/invitation-team-member-payload.yaml
  journey_id:
    type: string
    description: Shared by an invitation and every invitation that replaces it.
  user_id:
    type: string
