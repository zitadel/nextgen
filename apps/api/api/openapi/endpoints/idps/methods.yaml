post:
  operationId: createIdp
  x-zitadel-cli: idps create
  summary: Create or revise an identity provider connection
  description: |
    Creates or revises a connection document. If the slug does not already
    exist, a new connection is created. If a connection with that slug already
    exists, a revision is created.

    A revision gets a new `revision_id` and does not modify the connection
    `id`, so identity links that reference the connection keep resolving while
    releases and auth attempts stay pinned to the revision they captured.

    Identity fields are fixed for the life of the connection and a revision
    that changes one is rejected: `protocol`, `subject_claim`, and `issuer`,
    the field that names the authority. Their values decide which provider
    account a stored subject belongs to, so changing one would silently
    repoint existing identities at a different provider.

    `subject_claim` is optional, and `sub` is used as the default value. If a
    revision updates `subject_claim` to a different value than the one set
    during creation, the request is rejected.

    OIDC is the only protocol.

    The document is validated against the `idp-connection.json` schema before
    anything is stored. The rules the engine applies when it starts a sign-in
    then run on the document, so a connection that could never start one is
    refused here instead with `idp.endpoints_partial`: the OIDC block sets an
    endpoint without the others. It either sets no endpoint, and discovery
    fills them, or sets `authorization_endpoint`, `token_endpoint`, `jwks_uri`,
    and `userinfo_endpoint`. `userinfo_endpoint` may be left out when
    `id_token_mapping` is on, but setting it alone still counts as setting an
    endpoint. The details list the missing endpoints.

    A refused document stores nothing, and on a revise the current revision
    stays unchanged.
  tags:
    - Identity Providers
  security:
    - oauth2:
        - idp.write
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: create-idp-request.yaml
        examples:
          google:
            summary: An OIDC connection for Google
            description: |
              Google connection document.
            value:
              idp:
                slug: google
                protocol: oidc
                template: google
                display_name: Google
                subject_claim: sub
                claim_mapping:
                  email: email
                  givenName: given_name
                  familyName: family_name
                verified_claims:
                  email: email_verified
                provisioning:
                  creation: auto
                oidc:
                  issuer: https://accounts.google.com
                  client_id: '${{ GOOGLE_CLIENT_ID }}'
                  client_secret: '${{ GOOGLE_CLIENT_SECRET }}'
                  scopes:
                    - openid
                    - profile
                    - email
                  static_authorize_parameters:
                    prompt: select_account
          endpoints:
            summary: An OIDC connection that names every endpoint
            description: |
              A provider that exposes no discovery document. Every endpoint
              is set, so none is fetched.
            value:
              idp:
                slug: acme_sso
                protocol: oidc
                display_name: Acme SSO
                claim_mapping:
                  email: email
                  givenName: given_name
                  familyName: family_name
                verified_claims:
                  email: email_verified
                provisioning:
                  creation: auto
                oidc:
                  issuer: https://sso.acme.example
                  authorization_endpoint: https://sso.acme.example/authorize
                  token_endpoint: https://sso.acme.example/token
                  jwks_uri: https://sso.acme.example/keys
                  userinfo_endpoint: https://sso.acme.example/userinfo
                  client_id: '${{ ACME_CLIENT_ID }}'
                  client_secret: '${{ ACME_CLIENT_SECRET }}'
                  scopes:
                    - openid
                    - profile
                    - email
  responses:
    '200':
      description: |
        The IdP connection document after revision.
      content:
        application/json:
          schema:
            $ref: idp-response.yaml
          examples:
            revised:
              summary: The Google connection after a revision
              description: |
                The scope list grew. `id` is the one allocated when the
                connection was created, `revision_id` is new, and `updated_at`
                has moved past `created_at`.
              value:
                id: idp_01KWH3B72K7M7F0N9WD3P2E4YM
                revision_id: idprev_01KWHF2XY6RN7F0N9WD3P2E4YM
                slug: google
                created_at: '2026-07-14T09:11:00Z'
                updated_at: '2026-07-16T14:20:00Z'
                definition:
                  slug: google
                  protocol: oidc
                  template: google
                  display_name: Google
                  subject_claim: sub
                  claim_mapping:
                    email: email
                    givenName: given_name
                    familyName: family_name
                  verified_claims:
                    email: email_verified
                  provisioning:
                    creation: auto
                  oidc:
                    issuer: https://accounts.google.com
                    id_token_mapping: false
                    client_id: '${{ GOOGLE_CLIENT_ID }}'
                    client_secret: '${{ GOOGLE_CLIENT_SECRET }}'
                    token_endpoint_auth_method: client_secret_basic
                    scopes:
                      - openid
                      - profile
                      - email
                      - https://www.googleapis.com/auth/user.phonenumbers.read
                    pkce_enabled: true
                    static_authorize_parameters:
                      prompt: select_account
    '201':
      description: |
        The IdP connection document after creation.
      content:
        application/json:
          schema:
            $ref: idp-response.yaml
          examples:
            created:
              summary: A newly created connection
              description: |
                The slug was new to the project, so `id` and `revision_id` were
                both allocated and `updated_at` equals `created_at`.
              value:
                id: idp_01KWH3B72K7M7F0N9WD3P2E4YM
                revision_id: idprev_01KWH3B72K7M7F0N9WD3P2E4YN
                slug: google
                created_at: '2026-07-14T09:11:00Z'
                updated_at: '2026-07-14T09:11:00Z'
                definition:
                  slug: google
                  protocol: oidc
                  template: google
                  display_name: Google
                  subject_claim: sub
                  claim_mapping:
                    email: email
                    givenName: given_name
                    familyName: family_name
                  verified_claims:
                    email: email_verified
                  provisioning:
                    creation: auto
                  oidc:
                    issuer: https://accounts.google.com
                    id_token_mapping: false
                    client_id: '${{ GOOGLE_CLIENT_ID }}'
                    client_secret: '${{ GOOGLE_CLIENT_SECRET }}'
                    token_endpoint_auth_method: client_secret_basic
                    scopes:
                      - openid
                      - profile
                      - email
                    pkce_enabled: true
                    static_authorize_parameters:
                      prompt: select_account
    '400':
      description: |
        The document failed schema validation, the engine could not start a
        sign-in with it, or it revises an existing connection and changes a
        field that is fixed for its life.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    '404':
      description: Project not found.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    default:
      $ref: createIdp-error-response.yaml
