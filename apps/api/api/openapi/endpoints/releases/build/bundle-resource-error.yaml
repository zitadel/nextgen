title: BundleResourceError
description: |
  One bundle resource that failed validation: the error its kind's create
  endpoint would have answered, `code`, `message` and `details` unchanged,
  with the resource it belongs to.
allOf:
  - $ref: ../../../components/error-details.yaml
  - type: object
    required:
      - kind
      - index
    properties:
      kind:
        $ref: ../../../components/schemas/release-pointer-kind.yaml
      index:
        type: integer
        minimum: 0
        description: The resource's position in its kind's array in the bundle; `0` for the branding.
      handle:
        type: string
        description: The resource's handle, when it declares one.
