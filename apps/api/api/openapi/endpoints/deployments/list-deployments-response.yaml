type: object
description: One page of deployments, ordered as the operation describes.
required:
  - deployments
properties:
  deployments:
    type: array
    items:
      $ref: deployment.yaml
  next_page_token:
    description: |
      Token to pass as `page_token` in the next request to fetch the following page.
      Absent when there are no more results.
    oneOf:
      - $ref: ../../components/schemas/page-token.yaml
      - type: 'null'
