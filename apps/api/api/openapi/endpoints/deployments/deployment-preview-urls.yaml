title: DeploymentPreviewUrls
type: array
minItems: 1
maxItems: 50
uniqueItems: true
description: |
  Preview URLs in `Origin` form, each matching one of the project's preview
  patterns.
items:
  type: string
  pattern: '^https?://(\[[0-9a-f:.]+\]|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*)(:(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3}))?$'
  maxLength: 2048
example:
  - https://acme-k3x9v2-acmeinc.vercel.app
