title: DeploymentVariablesNotSecret
type: object
description: |
  The release names variables as a client secret, of an application client
  or an identity provider, that the project holds as plain values.
required:
  - code
  - message
  - details
properties:
  code:
    type: string
    const: dep.variables_not_secret
  message:
    type: string
    description: Human-readable explanation of the error.
  details:
    type: object
    required:
      - kind
      - names
    properties:
      kind:
        $ref: deployment-kind.yaml
        description: The kind whose variable values the deployment would freeze.
      names:
        type: array
        minItems: 1
        description: |
          Every variable the release names as a client secret that is stored
          for that kind as a plain value, sorted.
        items:
          type: string
