title: DeploymentMetadata
type: object
description: Why the release went live and who made it happen.
required:
  - reason
properties:
  reason:
    $ref: ../../components/schemas/deployment-reason.yaml
  message:
    description: |
      The caller-supplied summary of why this deployment happened, analogous
      to a git commit message.
    oneOf:
      - type: string
        maxLength: 1024
      - type: 'null'
    example: add phone_number to human-user
  rollback_to:
    description: |
      The deployment the rollback operation re-applied; null otherwise.
    oneOf:
      - $ref: ../../components/schemas/deployment-id.yaml
      - type: 'null'
  deployed_by:
    description: |
      The identity that created the deployment. Null when the caller is a
      machine principal carrying no user identity, as from CI.
    oneOf:
      - type: string
      - type: 'null'
    example: user_01KX3RG8A7F0N9WD3P2E4YM5C1
  deployed_by_type:
    description: What kind of principal `deployed_by` names.
    oneOf:
      - type: string
        enum:
          - human
          - service
          - system
          - agent
      - type: 'null'
    example: human
