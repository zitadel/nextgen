title: DeploymentVariablesMissing
type: object
description: The release references variables the project holds no value for.
required:
  - code
  - message
  - details
properties:
  code:
    type: string
    const: dep.variables_missing
  message:
    type: string
    description: Human-readable explanation of the error.
  details:
    type: object
    required:
      - kind
      - names
    properties:
      kind:
        $ref: deployment-kind.yaml
        description: The kind whose variable values the deployment would freeze.
      names:
        type: array
        minItems: 1
        description: |
          Every variable the release references with no value stored for
          that kind, sorted.
        items:
          type: string
