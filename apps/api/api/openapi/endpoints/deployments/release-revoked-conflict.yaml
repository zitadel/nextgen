title: ReleaseRevokedConflict
type: object
description: The release is revoked and cannot be deployed.
required:
  - code
  - message
properties:
  code:
    type: string
    description: 'The error code, always `rel.revoked` for this error.'
    const: rel.revoked
  message:
    type: string
    minLength: 1
    description: Human-readable explanation of the error.
