post:
  operationId: createDeployment
  x-zitadel-cli: deployment create
  summary: Create a deployment
  description: |
    Creates a deployment: it makes a release live on the project's primary
    origins or on preview URLs.

    A release is a snapshot of the project's configuration. A deployment makes
    a release live on origins and freezes the project's variable values for
    its kind, with no fallback between primary and preview values. The call is
    atomic: on success every target serves the release and the deployment is
    recorded, and it records a `deployment.created` event. On failure nothing
    changes and nothing is recorded.

    Name the release by exactly one of `release_id` or `content_hash`. Take the
    release ID from the `id` that `createRelease` (`POST /releases`), `buildRelease` (`POST /releases/build`) or
    `listReleases` (`GET /releases`) returns. The release must already exist in the project.
    `targets` is `primary`, which means every primary origin, or a list of
    preview URLs. `["primary"]`, which clients released before this shape
    send, still deploys to every primary origin until 1.0.0; its answer
    carries a `Deprecation` header (RFC 9745) and a `Link` to these docs.

    The project's newest primary deployment also serves every request with no
    `Origin`, such as a backend, a native app or the CLI, and the console's
    login preview of a project that does not list the console's origin. A
    preview URL serves only itself.

    `primary` records the project's current primary origins. One added later
    serves nothing until the next deployment to `primary`; one removed stops
    being served at once.

    A deployment to `primary` changes nothing when the project's newest
    primary deployment has the same release and frozen values and covers
    exactly the current primary origins. The call then answers `200` with that
    deployment. Any other request writes a new deployment and answers `201`.
    For preview URLs, that deployment renews their previews.

    If the request is refused, fix the cause and send it again:
    - `400 dep.invalid`: the request names both or neither of `release_id` and
      `content_hash`, names a primary origin among the preview URLs, sends
      `primary` for a project with no primary origin, sends
      `ttl` with `primary`, or sends a `ttl` above 365 days (`P365D`). Correct
      the request.
    - `400 dep.variables_missing`: a variable the release references has no
      value for the kind. `details` names the kind and every missing variable.
      Set each one for that kind with `updateVariables` (`PATCH /variables`), then deploy again.
    - `403 proj.origin_not_allowed`: a preview URL matches no preview pattern
      of the project, or is a loopback URL. Use a URL that matches a pattern.
    - `404 rel.not_found`: the release ID or digest names no release in this
      project. List the project's releases with `listReleases`.
    - `409 dep.conflict`: `expected_deployment_id` is not the deployment this
      write replaces, and `details.deployment` is that deployment. Inspect it,
      then retry with its ID as `expected_deployment_id`, or stop.
    - `409 rel.revoked`: the release is revoked and cannot be deployed. Change
      the configuration and build a new release, or deploy a release that is
      not revoked. Rebuilding unchanged content returns the same revoked release.
  tags:
    - Deployments
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
  security:
    - oauth2:
        - deployment.write
    - sessionCookie: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: create-deployment-request.yaml
        examples:
          primary:
            summary: Deploy to every primary origin, guarded
            description: |
              The guard names the deployment the caller inspected before
              deploying.
            value:
              release_id: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
              targets: primary
              message: add phone_number to human-user
              expected_deployment_id: dep_01KX4SB9C8E1F0N9WD3P2E4YM5
          preview:
            summary: Deploy to two preview URLs for a week
            value:
              content_hash: sha256:9f2c1a7b4e83d05f6c2b19ae7d430f821c6b5de90a4f73829f2c1a7b4e83d05f
              targets:
                - https://acme-git-sso-acmeinc.vercel.app
                - https://acme-k3x9v2-acmeinc.vercel.app
              ttl: P7D
  responses:
    '200':
      description: |
        Nothing changed. The body is the newest primary deployment, with its
        own `reason`, `message` and `deployed_at`.
      content:
        application/json:
          schema:
            $ref: deployment.yaml
          examples:
            alreadyLive:
              summary: The release the primary origins already serve, deployed again
              value:
                id: dep_01KX4SB9C8E1F0N9WD3P2E4YM5
                project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                release_id: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
                kind: primary
                targets:
                  - origin: https://app.acme.com
                  - origin: https://www.acme.com
                status: live
                deployed_at: '2026-10-01T09:30:00Z'
                metadata:
                  reason: deploy
                  message: initial import
                  rollback_to: null
                  deployed_by: user_01KWH3B72K7M7F0N9WD3P2E4YM
                  deployed_by_type: human
    '201':
      description: |
        The created deployment. Every target serves the release.
      content:
        application/json:
          schema:
            $ref: deployment.yaml
          examples:
            deployed:
              summary: A release deployed to every primary origin
              description: '`primary` comes back as every primary origin the project had.'
              value:
                id: dep_01KX5N7C9D2E7F0N9WD3P2E4YM6
                project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                release_id: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
                kind: primary
                targets:
                  - origin: https://app.acme.com
                  - origin: https://www.acme.com
                status: live
                deployed_at: '2026-10-02T14:52:00Z'
                metadata:
                  reason: deploy
                  message: add phone_number to human-user
                  rollback_to: null
                  deployed_by: user_01KWH3B72K7M7F0N9WD3P2E4YM
                  deployed_by_type: human
            previewed:
              summary: A release deployed to two preview URLs
              description: |
                Each preview's expiry is on `GET /projects/{project_id}/previews`.
              value:
                id: dep_01KX5M2A0C4D7F0N9WD3P2E4YM8
                project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                release_id: rel_01KX3RG8A7F0N9WD3P2E4YM5C1
                kind: preview
                targets:
                  - origin: https://acme-git-sso-acmeinc.vercel.app
                  - origin: https://acme-k3x9v2-acmeinc.vercel.app
                status: live
                deployed_at: '2026-10-02T14:10:00Z'
                metadata:
                  reason: deploy
                  message: null
                  rollback_to: null
                  deployed_by: null
                  deployed_by_type: service
    '400':
      description: 'The request cannot be deployed: `dep.invalid`, `dep.variables_missing` or `req.invalid`.'
      content:
        application/json:
          schema:
            $ref: create-deployment-bad-request.yaml
          examples:
            exactPrimaryOrigin:
              summary: A primary origin named exactly
              description: |
                Primary origins are deployed as a whole: send `primary`.
              value:
                code: dep.invalid
                message: deploy to primary origins with the primary target
            variablesMissing:
              summary: The release references variables with no preview value
              description: |
                Set each missing variable for the kind, then deploy again.
              value:
                code: dep.variables_missing
                message: 'deployment: the release references variables its kind has no value for'
                details:
                  kind: preview
                  names:
                    - GOOGLE_CLIENT_ID
                    - GOOGLE_CLIENT_SECRET
            invalid:
              summary: Both release_id and content_hash
              value:
                code: dep.invalid
                message: name the release by exactly one of release_id and content_hash
            ttlTooLong:
              summary: A ttl above 365 days
              value:
                code: dep.invalid
                message: ttl must be positive and at most 365 days
    '403':
      description: 'A preview URL matches no preview pattern, or is a loopback URL: `proj.origin_not_allowed`.'
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
          examples:
            originNotAllowed:
              summary: A URL the project's preview patterns do not admit
              value:
                code: proj.origin_not_allowed
                message: 'project: origin not allowed'
                details:
                  origin: https://acme.example
    '404':
      description: 'The release ID or digest names no release of the project: `rel.not_found`.'
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
          examples:
            releaseNotFound:
              summary: No such release
              value:
                code: rel.not_found
                message: 'release: not found'
    '409':
      description: '`dep.conflict` (the guard did not match) or `rel.revoked` (the release is revoked).'
      content:
        application/json:
          schema:
            $ref: deployment-conflict.yaml
          examples:
            conflict:
              summary: Another deployment reached the target first
              description: |
                Inspect the deployment in the details, then retry with its ID
                as `expected_deployment_id`, or stop.
              value:
                code: dep.conflict
                message: 'deployment: the deployment it replaces does not match expected_deployment_id'
                details:
                  deployment:
                    id: dep_01KX6P8D0E3F7F0N9WD3P2E4YM7
                    project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                    release_id: rel_01KX2QF7Z6D0F0N9WD3P2E4YM40
                    kind: primary
                    targets:
                      - origin: https://app.acme.com
                      - origin: https://www.acme.com
                    status: live
                    deployed_at: '2026-10-02T15:03:00Z'
                    metadata:
                      reason: deploy
                      message: soften the sign-in page contrast
                      rollback_to: null
                      deployed_by: null
                      deployed_by_type: null
            revoked:
              summary: The release is revoked
              value:
                code: rel.revoked
                message: 'release: revoked'
    default:
      $ref: createDeployment-error-response.yaml
get:
  operationId: listDeployments
  x-zitadel-cli: deployment list
  summary: List deployments
  description: |
    Lists the project's deployments: the history of what ran where and when,
    or with `live=true` what is served now.

    A deployment makes a release live on origins. By default the list is the
    history, newest first: every deployment of the project, with every target
    it made the release live on. With `origin`, it is the history of that
    origin alone.

    With `live=true`, the list is what is served now, newest first. It holds
    the project's newest primary deployment with every origin it names, an
    origin the project no longer lists included: that deployment also serves
    requests with no `Origin`, so it stays live. It also holds the newest
    deployment to each live preview URL, narrowed to the URLs it still
    serves. Combined with `origin`, it is the one deployment that origin
    serves, or empty, as it is for an origin the project no longer lists.

    The `id` of an entry is the deployment ID that `getDeploymentById` (`GET /deployments/{deployment_id}`),
    `getDeploymentVariables` (`GET /deployments/{deployment_id}/variables`) and `rollbackDeployment` (`POST /deployments/{deployment_id}/rollback`) take.

    `expand: ["release"]` embeds the release each deployment made live. It
    requires `release.read` and does not change the ordering or the page
    tokens.
  tags:
    - Deployments
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
    - $ref: ../../components/parameters/origin-filter.yaml
    - name: live
      in: query
      required: false
      description: |
        Lists what each target serves now instead of the history. Defaults
        to `false`.
      schema:
        type: boolean
        default: false
    - name: expand
      in: query
      required: false
      description: Related objects to embed on each returned deployment.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: deployment-expand.yaml
    - $ref: ../../components/parameters/limit.yaml
    - $ref: ../../components/parameters/page-token.yaml
  security:
    - oauth2:
        - deployment.read
    - sessionCookie: []
  responses:
    '200':
      description: A page of deployments.
      content:
        application/json:
          schema:
            $ref: list-deployments-response.yaml
          examples:
            history:
              summary: The history, newest first
              description: |
                A later deployment to `primary` replaced the earlier one on
                every primary origin, so the earlier one is inactive. The
                preview deployment still serves its URL.
              value:
                deployments:
                  - id: dep_01KX6P8D0E3F7F0N9WD3P2E4YM7
                    project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                    release_id: rel_01KX2QF7Z6D0F0N9WD3P2E4YM40
                    kind: primary
                    targets:
                      - origin: https://app.acme.com
                      - origin: https://www.acme.com
                    status: live
                    deployed_at: '2026-10-02T15:03:00Z'
                    metadata:
                      reason: rollback
                      message: phone_number broke sign-up
                      rollback_to: dep_01KX4SB9C8E1F0N9WD3P2E4YM5
                      deployed_by: user_01KWH3B72K7M7F0N9WD3P2E4YM
