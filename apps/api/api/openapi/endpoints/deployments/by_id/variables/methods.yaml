get:
  operationId: listDeploymentVariables
  x-zitadel-cli: variable resolve
  summary: Get a deployment's variables
  description: |
    Returns the variable values the deployment froze when it was made. Later
    changes to the project's variables do not affect them. A secret reads
    back as `{"secret": true}`.

    Pass the `id` that `createDeployment` (`POST /deployments`) or `listDeployments` (`GET /deployments`) returns.
  tags:
    - Deployments
  security:
    - oauth2:
        - deployment.read
        - variable.read
  parameters:
    - $ref: ../../../../components/parameters/project-id.yaml
    - $ref: ../../../../components/parameters/deployment-id.yaml
  responses:
    '200':
      description: The variables the deployment froze, keyed by name.
      content:
        application/json:
          schema:
            $ref: ../../../variables/variables.yaml
    default:
      $ref: listDeploymentVariables-error-response.yaml
