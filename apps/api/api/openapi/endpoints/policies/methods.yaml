get:
  operationId: listPolicies
  x-zitadel-cli: policies list
  summary: List policies
  description: |
    Lists the project's policies, one per operation, each as its newest
    revision, ordered by `created_at` (first publish) and then `id`. Filter
    by `operation` to read the policy of one operation; a project that never
    published one gets an empty list.

    The lookup is scoped to the project in `project_id`.
  tags:
    - Policies
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
    - $ref: ../../components/parameters/limit.yaml
    - $ref: ../../components/parameters/page-token.yaml
    - name: operation
      in: query
      description: Only the policy of this operation.
      schema:
        $ref: ../../components/schemas/policy-operation.yaml
  security:
    - oauth2:
        - policy.read
    - sessionCookie: []
  responses:
    '200':
      description: The policies were returned.
      content:
        application/json:
          schema:
            $ref: list-policies-response.yaml
          examples:
            passwordPolicy:
              summary: A project with a password policy
              value:
                policies:
                  - id: pol_01KXA4F3Q8R7F0N9WD3P2E4YM5
                    revision_id: polrev_01KXB7C2M4N7F0N9WD3P2E4YM7
                    project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                    operation: auth.factor.password.set
                    config:
                      min_length: 12
                      history_depth: 4
                    created_at: '2026-10-20T09:00:00Z'
                    updated_at: '2026-10-20T10:30:00Z'
    default:
      $ref: listPolicies-error-response.yaml
post:
  operationId: publishPolicy
  summary: Publish a policy
  description: |
    Publishes the project's policy for an operation as a new immutable
    revision, creating the policy on its first publish. The newest revision
    applies to the next time the operation runs; nothing already stored is
    re-evaluated, so a stricter password policy applies the next time a
    password is set.

    The request is typed by `operation`: an unknown operation or setting, or
    a value of the wrong type or outside its bounds, answers `req.invalid`
    like any malformed request. The operation's template then checks the
    config again, together with the rules that relate settings to each other
    (a `min_length` above `max_length`), and answers `pol.invalid`. Its
    `details.details.violations` lists everything that failed, settings
    first, then rules: `{"setting": "min_length"}` for one setting, or
    `{"config_rule": "min_length_not_above_max_length", "settings":
    ["min_length", "max_length"]}` for a rule across settings, with the
    settings it reads. A setting left out is off, and `{}` switches every
    rule off; there are no defaults.
  tags:
    - Policies
  parameters:
    - $ref: ../../components/parameters/project-id.yaml
  security:
    - oauth2:
        - policy.write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: publish-policy-request.yaml
        examples:
          passwordPolicy:
            summary: A password policy
            value:
              operation: auth.factor.password.set
              config:
                min_length: 12
                history_depth: 4
  responses:
    '201':
      description: The revision was published.
      content:
        application/json:
          schema:
            $ref: policy.yaml
          examples:
            published:
              summary: The second publish of a password policy
              value:
                id: pol_01KXA4F3Q8R7F0N9WD3P2E4YM5
                revision_id: polrev_01KXB7C2M4N7F0N9WD3P2E4YM7
                project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                operation: auth.factor.password.set
                config:
                  min_length: 12
                  history_depth: 4
                created_at: '2026-10-20T09:00:00Z'
                updated_at: '2026-10-20T10:30:00Z'
    default:
      $ref: publishPolicy-error-response.yaml
