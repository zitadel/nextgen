type: object
description: A page of the revisions of one policy, newest first.
required:
  - revisions
properties:
  revisions:
    type: array
    items:
      $ref: ../../policy.yaml
  next_page_token:
    description: |
      Token to pass as `page_token` in the next request to fetch the following
      page. Absent when there are no more results.
    oneOf:
      - $ref: ../../../../components/schemas/page-token.yaml
      - type: 'null'
