get:
  operationId: getPolicy
  x-zitadel-cli: policy get
  summary: Get a policy by ID
  description: |
    Returns a policy as its newest revision. A revision applies once a deployed
    release pins it.

    A policy holds a project's rules for one operation, such as setting a
    password. Pass the `id` that `listPolicies` (`GET /policies`) or `publishPolicy` (`POST /policies`) returns.

    The lookup is scoped to the project in `project_id`: a policy of another
    project answers not found exactly as an unknown ID does.
  tags:
    - Policies
  parameters:
    - $ref: ../../../components/parameters/project-id.yaml
    - $ref: ../../../components/parameters/policy-id.yaml
  security:
    - oauth2:
        - policy.read
    - sessionCookie: []
  responses:
    '200':
      description: The policy, as its newest revision.
      content:
        application/json:
          schema:
            $ref: ../policy.yaml
          example:
            id: pol_01KXA4F3Q8R7F0N9WD3P2E4YM5
            revision_id: polrev_01KXA4F3Q8R7F0N9WD3P2E4YM6
            project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
            operation: auth.factor.password.set
            config:
              min_length: 1
              max_length: 1
              history_depth: 1
            created_at: '2026-01-15T09:30:00Z'
            updated_at: '2026-01-15T09:30:00Z'
    default:
      $ref: getPolicy-error-response.yaml
