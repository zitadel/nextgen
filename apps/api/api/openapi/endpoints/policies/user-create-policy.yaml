title: UserCreatePolicy
type: object
# Policies are specified in ADR 066, sign-up protection in ADR 088.
description: |
  One revision of a project's `user.create` policy. `id` is shared by every
  revision of the operation's policy; `revision_id` names this revision.
required:
  - id
  - revision_id
  - project_id
  - operation
  - config
  - created_at
  - updated_at
properties:
  id:
    readOnly: true
    $ref: ../../components/schemas/policy-id.yaml
  revision_id:
    readOnly: true
    $ref: ../../components/schemas/policy-revision-id.yaml
  project_id:
    readOnly: true
    description: The project the policy belongs to.
    $ref: ../../components/schemas/project-id.yaml
  operation:
    type: string
    enum:
      - user.create
    readOnly: true
    description: The operation the policy guards.
  config:
    readOnly: true
    $ref: user-create-config.yaml
  created_at:
    type: string
    format: date-time
    readOnly: true
    description: When the operation's policy was first published.
  updated_at:
    type: string
    format: date-time
    readOnly: true
    description: When this revision was published.
