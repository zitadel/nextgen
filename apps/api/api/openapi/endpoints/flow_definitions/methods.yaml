post:
  operationId: publishFlowDefinition
  summary: Create a flow definition
  description: |
    Creates a flow definition by publishing a new revision of it. It records a
    `flowdef.created` event.

    A [flow definition](/docs/concepts/flows-and-schemas) is a template that
    defines the sequence of steps (capabilities) for one user journey, such as
    registration, login or password reset. The body follows the flow
    definition schema, which includes the flow's purpose, audience and steps.

    Every call allocates a new opaque ID. That `id` is the `revision_id` a
    release pins for `kind: flow_definition`.

    Revisions of one flow share its `name`. Posting a definition under an
    existing `name` publishes a new revision of that flow, which is not a
    conflict. List with `name` to see a flow's revisions, newest by creation
    time first.
  tags:
    - Flow Definitions
  security:
    - oauth2:
        - flow_definition.write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/flows/create-flow-definition-request.yaml
        examples:
          defaultLoginFlow:
            summary: The default login flow provided by the server.
            externalValue: examples/default-login-flow-definition.json
          passwordLogin:
            summary: Minimal login — identifier then password.
            externalValue: examples/01-password-login/flow-definition.json
          passwordRegister:
            summary: Single-step password signup with on_success create_user.
            externalValue: examples/02-password-register/flow-definition.json
          passkeyLogin:
            summary: Discoverable passkey login — no identifier collected up front.
            externalValue: examples/03-passkey-login/flow-definition.json
          passkeyRegister:
            summary: Identifier-first passkey signup; provisional user finalized in the verify leg.
            externalValue: examples/04-passkey-register/flow-definition.json
          combinedPasswordLoginRegister:
            summary: Combined login + register with user_not_found and user_already_exists wired between sub-flows.
            externalValue: examples/05-combined-login-register/flow-definition.json
          combinedPasswordPasskey:
            summary: Combined login + register with password, passkey, and post-signup passkey upsell; terminal redirect.
            externalValue: examples/06-combined-password-passkey/flow-definition.json
  responses:
    '201':
      description: The created flow definition.
      content:
        application/json:
          schema:
            $ref: ../../components/flows/flow-definition-response.yaml
    '400':
      description: The request is invalid, for example because required fields are missing or a step configuration is invalid.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    default:
      $ref: publishFlowDefinition-error-response.yaml

get:
  operationId: listFlowDefinitions
  x-zitadel-cli: flow-definitions list
  summary: List flow definitions
  description: |
    Lists the project's flow definitions with their configurations, newest by
    creation time first. A flow definition sets which step of a sign-in
    renders when, and which fields each step collects.

    The `id` of an entry is the flow definition ID that `getFlowDefinition` (`GET /flow_definitions/{flow_definition_id}`)
    takes. Filter by `name` to list the revisions of one flow.
  tags:
    - Flow Definitions
  security:
    - oauth2:
        - flow_definition.read
    - sessionCookie: []
  parameters:
    - $ref: ../../components/parameters/limit.yaml
    - $ref: ../../components/parameters/page-token.yaml
    - $ref: ../../components/parameters/project-id.yaml
    - name: purpose
      in: query
      required: false
      description: Only flow definitions with this purpose, for example `login`.
      schema:
        type: string
        enum: [ login, register, recovery, profiling, reauth, link_account ]
    - name: name
      in: query
      required: false
      description: |
        The flow name to filter by. Every revision of a flow shares its
        `name`, so the result is that flow's revisions, newest by creation
        time first.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]*$'
        x-zitadel-pattern-message: "must start with a lowercase letter and use only lowercase letters, digits and -"
    - name: revisions
      in: query
      description: |
        Which revisions to return. Every revision of a flow shares its
        `name`, so publishing a definition under an existing `name` adds a new
        revision.

        `all` (the default) returns every revision: the full history an
        export, an audit or a GitOps diff needs. `latest` returns the newest
        revision of each `name`, which is one entry per flow.

        A `page_token` is bound to the mode it was issued in and is rejected by
        the other.
      schema:
        type: string
        default: all
        enum:
          - all
          - latest
    - name: expand
      in: query
      required: false
      description: Related entities to embed on each returned flow definition.
      schema:
        type: array
        items:
          $ref: flow-definition-expand.yaml
  responses:
    '200':
      description: A page of flow definitions.
      content:
        application/json:
          schema:
            $ref: ../../components/flows/flow-definition-list-response.yaml
    '400':
      description: A query parameter or the page token is invalid.
      content:
        application/json:
          schema:
            $ref: ../../components/error-details.yaml
    default:
      $ref: listFlowDefinitions-error-response.yaml