type: object
description: Request to search a project.
required:
  - query
  - types
properties:
  query:
    type: string
    minLength: 1
    maxLength: 200
    description: |
      The text to find. Spaces around it are ignored, and a text of spaces
      alone finds nothing.
    example: ann@example.com
  types:
    type: array
    minItems: 1
    uniqueItems: true
    description: |
      The types to search. Only these appear in `results`, so a client never
      receives a type it did not ask for.
    items:
      $ref: search-result-type.yaml
    example:
      - user
      - team
  limit_per_type:
    type: integer
    minimum: 1
    maximum: 20
    default: 5
    description: The most results each type contributes.
