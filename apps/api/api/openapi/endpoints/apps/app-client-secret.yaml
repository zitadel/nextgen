type: object
description: A client secret the server generated, returned once.
required:
  - client
  - credential_id
  - secret
properties:
  client:
    type: string
    description: The slug of the client the secret belongs to.
    example: web
  credential_id:
    type: string
    description: The id of the credential that holds the secret, which revokes it.
    example: cred_01KWH3B72K7M7F0N9WD3P2E4YQ
  secret:
    type: string
    description: The secret. The server keeps only its hash, so it cannot be shown again.
    example: zcs_4zW8kXbqP2mT9vR1nC6yL3hD7fJ0sA5gE2uQ8wN4iK9oB1pa0Wj4L
