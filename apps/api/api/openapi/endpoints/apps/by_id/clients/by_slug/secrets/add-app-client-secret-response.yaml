type: object
description: The secret that was added.
required:
  - id
  - client_id
properties:
  id:
    type: string
    description: The secret's id.
    example: csec_01KWH3B72K7M7F0N9WD3P2E4YQ
  client_id:
    type: string
    description: The client the secret authenticates.
    example: client_01KWH3B72K7M7F0N9WD3P2E4YP
  secret:
    type: string
    description: The generated secret, shown once. Absent for an import.
    example: zcs_9h2Qx2nU1yQ8mXkP0r4sT7vW5zA3bC6dE8fG1hJ2kL4
