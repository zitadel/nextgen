delete:
  operationId: revokeAppClientCredential
  summary: Revoke a credential of an app's client
  description: |
    Revokes one credential: the client can no longer authenticate with it,
    and its other credentials keep working. Emits `app.credential.revoked`.
  tags:
    - Apps
  security:
    - oauth2:
        - app.write
    - sessionCookie: []
  parameters:
    - $ref: ../../../../../../../components/parameters/project-id.yaml
    - $ref: ../../../../../../../components/parameters/app-id.yaml
    - $ref: ../../../../../../../components/parameters/app-client-slug.yaml
    - $ref: ../../../../../../../components/parameters/app-client-credential-id.yaml
  responses:
    '204':
      description: The credential was revoked.
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../../../../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../../../../../../components/error-details.yaml
    '404':
      description: No such app, client or credential.
      content:
        application/json:
          schema:
            $ref: ../../../../../../../components/error-details.yaml
    default:
      $ref: revokeAppClientCredential-error-response.yaml
