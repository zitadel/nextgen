post:
  operationId: addAppClientCredential
  summary: Add a credential to an app's client
  description: |
    Adds a named credential to a confidential client: a secret the server
    generates and shows once, an imported secret or hash, or a public key.
    The app may be declared in the release or registered through the API, and
    a deploy never removes a credential written here. A public client holds
    no credential, and a request for one is refused with `app.invalid`.
    Emits `app.credential.added`.
  tags:
    - Apps
  security:
    - oauth2:
        - app.write
    - sessionCookie: []
  parameters:
    - $ref: ../../../../../../components/parameters/project-id.yaml
    - $ref: ../../../../../../components/parameters/app-id.yaml
    - $ref: ../../../../../../components/parameters/app-client-slug.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: add-app-client-credential-request.yaml
        examples:
          generate:
            summary: Generate a secret
            value:
              name: ci-2026-11
          importBcrypt:
            summary: Import a v4 secret's bcrypt hash
            value:
              name: imported-from-v4
              hash: $2a$04$KLQ8Oa0xFlVm1b0wN8E6kOpH0n1m1Oh8m2V3o4p5q6r7s8t9u0v1w
  responses:
    '201':
      description: The credential was added. A generated secret is in `secret`, shown once.
      content:
        application/json:
          schema:
            $ref: ../../../../app-client-credential.yaml
    '400':
      description: |
        The client is public, more than one of `secret`, `hash` and
        `public_key` was given, the hash is in no format the server reads, or
        the key is not a public key.
      content:
        application/json:
          schema:
            $ref: ../../../../../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../../../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../../../../../components/error-details.yaml
    '404':
      description: No app with this id, or no client with this slug in its newest revision.
      content:
        application/json:
          schema:
            $ref: ../../../../../../components/error-details.yaml
    '409':
      description: The client already holds a credential with this name, or a key with this `kid`.
      content:
        application/json:
          schema:
            $ref: ../../../../../../components/error-details.yaml
    default:
      $ref: addAppClientCredential-error-response.yaml
get:
  operationId: listAppClientCredentials
  summary: List the credentials of an app's client
  description: |
    Lists the credentials a client holds through the API, revoked ones left
    out, without any secret.
  tags:
    - Apps
  security:
    - oauth2:
        - app.read
    - sessionCookie: []
  parameters:
    - $ref: ../../../../../../components/parameters/project-id.yaml
    - $ref: ../../../../../../components/parameters/app-id.yaml
    - $ref: ../../../../../../components/parameters/app-client-slug.yaml
  responses:
    '200':
      description: The client's credentials.
      content:
        application/json:
          schema:
            $ref: list-app-client-credentials-response.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../../../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../../../../../components/error-details.yaml
    '404':
      description: No app with this id, or no client with this slug in its newest revision.
      content:
        application/json:
          schema:
            $ref: ../../../../../../components/error-details.yaml
    default:
      $ref: listAppClientCredentials-error-response.yaml
