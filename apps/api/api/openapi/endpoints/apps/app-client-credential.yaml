type: object
description: |
  One credential a confidential client authenticates with: a secret the
  server generated or imported, or a public key the client signs its
  `private_key_jwt` assertions with. Each is named, and rotated or revoked on
  its own: rotating adds the new one and revokes the old one later, so the
  client, its `client_id` and its history stay. A secret's value is shown
  once, when the server generates it, and never stored.
required:
  - id
  - name
  - kind
  - client_id
  - created_at
properties:
  id:
    type: string
    description: The credential's id.
    example: cred_01KWH3B72K7M7F0N9WD3P2E4YQ
  name:
    type: string
    description: Names the credential, unique among the client's credentials.
    example: ci-2026-11
  kind:
    type: string
    enum:
      - secret
      - key
    description: '`secret` authenticates with `client_secret_basic` or `client_secret_post`, `key` with `private_key_jwt`.'
  client_id:
    type: string
    description: The client the credential authenticates.
    example: client_01KWH3B72K7M7F0N9WD3P2E4YP
  key_id:
    type: string
    description: The public key's `kid`, for a key.
  created_at:
    type: string
    format: date-time
  expires_at:
    type: string
    format: date-time
    description: When the credential stops working. Absent for one that does not expire.
  secret:
    type: string
    description: The generated secret, shown once, in the answer that created it. Absent on reads and for an import or a key.
    example: zcs_4zW8kXbqP2mT9vR1nC6yL3hD7fJ0sA5gE2uQ8wN4iK9oB1pa0Wj4L
