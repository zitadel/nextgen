get:
  operationId: getSession
  x-zitadel-cli: sessions get
  summary: Get a session by ID
  description: |
    Returns the current state of a session, including its factors and all currently satisfied assurance levels.

    An assurance level is a profile, such as `urn:nist:aal:2`, that the
    session's verified factors satisfy. `assurance_levels[]` may shrink over time
    as factor freshness windows expire, without the session itself expiring.
    To restore a dropped level, use step-up authentication: create an
    authentication attempt with the same `session_id`.
  tags:
    - Sessions
  parameters:
    - $ref: ../../../components/parameters/session-id.yaml
  security:
    - oauth2:
        - session.read
  responses:
    '200':
      description: The session.
      content:
        application/json:
          schema:
            $ref: ../session-response.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '404':
      description: Session not found.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: getSession-error-response.yaml

delete:
  operationId: revokeSession
  x-zitadel-cli: sessions revoke
  summary: Revoke a session
  description: |
    Revokes a session by deleting it, immediately and for good. A later
    `getSession` (`GET /sessions/{session_id}`) for it answers `404`.

    This is the operator revoke path. It requires the `session.delete` scope on a
    project-bound credential. End-user sign-out with the session cookie is
    `DELETE /sessions/me` (`sessionCookie` scheme).

    Idempotent: revoking a session that does not exist, or was already revoked,
    still returns `204`. After revocation, any tokens derived from the session are
    invalidated.
  tags:
    - Sessions
  parameters:
    - $ref: ../../../components/parameters/session-id.yaml
  security:
    - oauth2:
        - session.delete
  responses:
    '204':
      description: The session was revoked. Also returned when the session was already absent.
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: revokeSession-error-response.yaml
