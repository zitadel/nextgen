type: object
additionalProperties: false
description: Request to query the sessions of a project.
properties:
  limit:
    $ref: ../../../components/schemas/limit.yaml
  page_token:
    description: Token to retrieve the next page of results.
    oneOf:
      - $ref: ../../../components/schemas/page-token.yaml
      - type: 'null'
  sorting:
    type: object
    additionalProperties: false
    required:
      - field
      - direction
    properties:
      field:
        $ref: session-sort-field.yaml
        description: The field to sort by.
      direction:
        $ref: ../../../components/schemas/sort-direction.yaml
        description: The direction to sort by.
  filter:
    type: array
    description: Filter criteria for querying sessions.
    items:
      type: object
      additionalProperties: false
      required:
        - field
        - operation
      # What a `value` and an `operation` may be depends on the field: a timestamp
      # takes an RFC 3339 string and a comparison, a status or state one of its
      # names with `equals`, any other field a string with `equals` or `contains`.
      # The server refuses anything else, and a missing value, with `400`.
      if:
        required:
          - field
        properties:
          field:
            enum: [created_at]
      then:
        $ref: ../../../components/schemas/filter-timestamp-value.yaml
      else:
        if:
          required:
            - field
          properties:
            field:
              enum: [state]
        then:
          required:
            - value
          properties:
            field: {}
            operation:
              const: equals
            value:
              enum: [expired, building, active]
        else:
          if:
            required:
              - field
            properties:
              field:
                enum: [lifecycle_owner_team_id]
          then:
            required:
              - value
            properties:
              field: {}
              operation:
                const: equals
              value:
                type: string
          else:
            $ref: ../../../components/schemas/filter-text-value.yaml
      properties:
        field:
          $ref: session-filter-field.yaml
          description: The field to filter by.
        value:
          $ref: ../../../components/schemas/filter-value.yaml
        operation:
          $ref: ../../../components/schemas/filter-operation.yaml
