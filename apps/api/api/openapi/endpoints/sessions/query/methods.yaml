post:
  operationId: querySessions
  x-zitadel-cli: session list
  summary: Query sessions
  description: |
    Returns a page of a project's sessions.

    Sessions of every lifecycle state are returned; each carries its `state`.
    Requires the `session.read` scope.
  tags:
    - Sessions
  security:
    - oauth2:
        - session.read
  parameters:
    - $ref: ../../../components/parameters/project-id.yaml
  requestBody:
    description: Request to query the sessions of a project.
    required: true
    content:
      application/json:
        schema:
          $ref: query-sessions-request.yaml
  responses:
    '200':
      description: A page of the project's sessions.
      content:
        application/json:
          schema:
            $ref: query-sessions-response.yaml
          example:
            sessions:
              - session_id: sess_01J0Z9KX7Y0Q2Y7JX5M9K2YF3C
                project_id: proj_01KWH1P4MYS7F0N9WD3P2E4YM5
                state: active
                user_id: user_01KWH3B72K7M7F0N9WD3P2E4YM
                user:
                  user_id: user_01KWH3B72K7M7F0N9WD3P2E4YM
                  identifier: ada@example.com
                  identifier_property: email
                  display: Ada Lovelace
                factors:
                  - method: password
                    verified_at: '2026-04-28T15:32:00Z'
                assurance_levels:
                  - urn:nist:aal:1
                  - urn:nist:aal:2
                metadata: {}
                user_agent:
                  fingerprint: fp_abc123
                  ip: 203.0.113.42
                created_at: '2026-04-29T10:00:00Z'
                expires_at: '2026-04-30T10:00:00Z'
            next_page_token: v1.dGhpcyBpcyBvcGFxdWU.SflKxwRJSMeKKF2QT4fw
    '400':
      description: Invalid request, for example invalid query parameters.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: querySessions-error-response.yaml
