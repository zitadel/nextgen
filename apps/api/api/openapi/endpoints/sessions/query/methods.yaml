post:
  operationId: querySessions
  x-zitadel-cli: session list
  summary: Query sessions
  description: |
    Returns a page of a project's sessions.

    Sessions of every lifecycle state are returned; each carries its `state`.
    Requires the `session.read` scope.
  tags:
    - Sessions
  security:
    - oauth2:
        - session.read
  parameters:
    - $ref: ../../../components/parameters/project-id.yaml
  requestBody:
    description: Request to query the sessions of a project.
    required: true
    content:
      application/json:
        schema:
          $ref: query-sessions-request.yaml
  responses:
    '200':
      description: A page of the project's sessions.
      content:
        application/json:
          schema:
            $ref: query-sessions-response.yaml
    '400':
      description: Invalid request, for example invalid query parameters.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '401':
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    '403':
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: ../../../components/error-details.yaml
    default:
      $ref: querySessions-error-response.yaml
