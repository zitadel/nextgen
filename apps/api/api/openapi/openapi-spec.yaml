openapi: 3.1.0
info: 
  # TODO: set correct information
  title: Zitadel NextGen
  description: This is the next generation of the Zitadel identity platform.
  version: 0.0.1
  # This describes the exposed API contract/specification license, not the
  # AGPL-3.0-only license of the Zitadel server implementation.
  # See /LICENSING.md for the repository-level licensing policy.
  license:
    name: MIT
    identifier: MIT

servers:
  # The resource API lives under /api/v1 on the deployment's host (ADR 077).
  # Until 1.0.0 the server also answers every operation at its root path,
  # with a Deprecation header.
  - url: /api/v1
    description: The API on the current origin. Use http://localhost:8080/api/v1 for local development.
  # Add the public production API once that endpoint is available.
  # - url: https://api.zitadel.com
  #   description: Production API

tags:
  - name: System
    description: |
      Liveness and readiness probes. They answer under `/api/v1` like every
      operation, and at the root, `/livez` and `/readyz`, where orchestrators
      probe them.
  - name: Flows
    description: |
      A flow is one browser journey, such as sign-in, registration or recovery.
      These operations start a flow, return its current step and accept the
      step the user submits.
  - name: Flow Definitions
    description: |
      Flow definitions are templates for user journeys such as sign-in,
      registration and recovery. These operations create, list and read them;
      each create publishes a new revision under the flow's name.
  - name: Authentication Attempts
    description: |
      An authentication attempt is one sign-in round, and it expires 15 minutes
      after creation. These operations create an attempt, issue challenges,
      verify proofs and create the handoff token that the session exchange takes.
  - name: Sessions
    description: |
      A session is the durable record of an anonymous or signed-in user. These
      operations create and read sessions, exchange a handoff token for one,
      and revoke it.
  - name: Projects
    description: |
      A project is the top-level boundary that holds users, sessions and their
      sign-in configuration. These operations create and manage projects, claim
      a project for a team, and manage its origin patterns.
  - name: Teams
    description: |
      Teams group users inside a project and can own projects. These operations
      create, read, update, query and deactivate teams.
  - name: Users
    description: |
      Users are the identities of a project, such as people or service accounts.
      These operations create, read, update, delete and query users, read the
      signed-in user, and manage a user's password, passkeys, identity links
      and team memberships.
  - name: Search
    description: |
      Search finds the resources of a project, or of the projects a person
      can act on, that match a text, across resource types in one request. It
      answers with references; the resources themselves are read through their
      own operations.
  - name: Schemas
    description: |
      Schemas define the typed shape of user data and of other configurable
      resources. These operations create, list and read schemas.
  - name: Branding
    description: |
      Branding sets how the login looks: its layout, asset URLs and Liquid
      template. Each publish creates an immutable revision. The login renders
      the revision the deployed release pins.
  - name: Identity Providers
    description: |
      Identity providers are the external login providers a project offers.
      Each is published as a revisioned connection document and referenced by
      its slug from user schemas and flow definitions. These operations create
      or revise a connection, query connections, read one by ID, and read its
      revisions. A slug resolves through the query.
  - name: Applications
    description: |
      Applications authenticate their users via Zitadel, each through its
      OAuth clients. A registered application is written through the API as
      one revisioned document. These operations create or revise a registered
      application and read one by ID.
  - name: Policies
    description: |
      A policy holds the settings an operation is checked against, such as a
      password policy's minimum length. A project publishes them per guarded
      operation, and every publish is an immutable revision.
  - name: Releases
    description: |
      A release is a snapshot of a project's configuration: one revision of
      each resource, plus who made it, when, and from which commit. It points
      at those revisions and never copies their content, which stays with
      each resource's own endpoints.

      Create a release from the files in your `.zitadel/` directory, or from
      revision ids you already have. Creating a release doesn't deploy it,
      and you can deploy the same release to any number of origins.

      Every release carries a digest of its content, so you can check
      whether the files you have are already released.

      A release's content never changes. If it must never be served again,
      revoke it. A release can't be revoked while any origin still serves
      it.
  - name: Deployments
    description: |
      A deployment makes one release live on one or more targets — the
      project's primary origins, or preview URLs — and freezes the variable
      values those targets use.

      Deployments form an append-only history of what ran where, and when. A
      rollback is another deployment: it re-deploys an earlier one with the
      variable values it froze, and the deployments in between stay in the
      history.
  - name: Previews
    description: |
      Previews are the preview URLs that are live. A deployment to a URL
      matching one of the project's preview patterns creates or renews its
      preview. These operations list previews and remove one before it expires.
  - name: Grants
    description: |
      Grants give a user or a team the project.viewer, project.editor or
      project.admin role on a project. These operations create, get, query and
      revoke grants. There is no operation to change a grant's role yet.
  - name: Invitations
    description: |
      Invitations are 72-hour links that grant a project role (or, later, a team
      role) to whoever redeems them. These operations create, list, read and
      cancel invitations, and look up, accept or decline one by its token.
  - name: Events
    description: |
      Events are the project's audit trail: identity, session, admin and entity
      events. These operations list and read them; filter the list by `category`
      or `event_type`. An event's `event_type` selects its typed payload.
  - name: Event Webhooks
    description: |
      Event webhooks are the requests the server POSTs to a webhook sink as it
      stores events, one event per request and, within a project, in the order they were
      stored. The body is the event as `GET /events` returns it; `event_type`
      tells the webhooks apart. Delivery is at least once, so drop duplicates
      by `id`. The sink is set in the server's configuration, under
      `events.export`.
  - name: Variables
    description: |
      Named values a project enters and references from configuration documents
      as `${{ NAME }}`. A variable has a value per kind, `primary` or `preview`,
      and each deployment freezes the values of its kind. There is no fallback
      between kinds.

      Secrets are the same resource with the value stored encrypted: same
      names, same references, same endpoints. They are write-only — a read says
      that a secret is held, never what it is.

