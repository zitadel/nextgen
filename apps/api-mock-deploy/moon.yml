id: "api-mock-deploy"
language: "typescript"
layer: "application"
stack: "backend"
dependsOn:
  - "api-mock"

tasks:
  lint:
    command: "corepack pnpm run lint"
    deps:
      - "api-mock:build"

  typecheck:
    command: "corepack pnpm run typecheck"
    deps:
      - "api-mock:build"

  test:
    command: "corepack pnpm run test"
    deps:
      - "api-mock:build"
