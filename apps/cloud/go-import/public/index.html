<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Go vanity-import metadata for go.zitadel.com. The `go-import` service in
      the repo-root vercel.json serves this file for every path on that host, so
      `go get go.zitadel.com/zitadel/v5/...` (and proxy.golang.org, pkg.go.dev)
      find the module wherever they ask, with `?go-get=1` or without.

      The repository is github.com/zitadel/zitadel, where the module ships
      after the planned repository migration, not zitadel/nextgen. The module
      path (packages/go/go.mod), this file and the launcher's test
      (apps/api/cmd/cloud-launcher) change together.
    -->
    <meta name="go-import" content="go.zitadel.com/zitadel/v5 git https://github.com/zitadel/zitadel packages/go" />
    <meta
      name="go-source"
      content="go.zitadel.com/zitadel/v5 https://github.com/zitadel/zitadel/tree/main/packages/go https://github.com/zitadel/zitadel/tree/main/packages/go{/dir} https://github.com/zitadel/zitadel/blob/main/packages/go{/dir}/{file}#L{line}"
    />
    <meta http-equiv="refresh" content="0; url=https://pkg.go.dev/go.zitadel.com/zitadel/v5/api" />
    <title>go.zitadel.com/zitadel/v5</title>
  </head>
  <body>
    <p>
      The Zitadel Go client, <code>go.zitadel.com/zitadel/v5</code>:
      <a href="https://pkg.go.dev/go.zitadel.com/zitadel/v5/api">documentation on pkg.go.dev</a>,
      <a href="https://github.com/zitadel/zitadel/tree/main/packages/go">source</a>.
    </p>
  </body>
</html>
