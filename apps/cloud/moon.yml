id: "cloud"
language: "typescript"
layer: "application"
stack: "backend"

tasks:
  # No `build` task on purpose: the deployable artifact is the function
  # Vercel builds with vercel-build.sh on its Go runtime, which needs Vercel
  # credentials. `typecheck` and `test` are the gates here; the launcher's
  # Go tests run with the server's `go test ./...`.
  typecheck:
    command: "corepack pnpm run typecheck"

  test:
    command: "corepack pnpm run test:all"

  # Deploys to production from a workstation. Not a CI task: pushes deploy
  # through Vercel's Git integration, and the server build step migrates
  # before the deployment goes live (vercel-build.sh).
  deploy:
    command: "corepack pnpm run deploy"
    options:
      cache: false
      runInCI: false
