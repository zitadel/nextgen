id: "demo-nuxt"
language: "typescript"
layer: "application"
stack: "frontend"
dependsOn:
  - "components"
  - "design-tokens"
  - "sdk-nuxt"

tasks:
  lint:
    command: "pnpm exec oxlint ."
    deps:
      - "sdk-nuxt:build"

  typecheck:
    command: "pnpm run typecheck"
    deps:
      - "sdk-nuxt:build"

  build:
    command: "pnpm run build"
    deps:
      - "sdk-nuxt:build"
    outputs:
      - ".output/**/*"
    options:
      # Reads sdk-nuxt/dist while bundling; shares the mutex with the
      # sdk-nuxt builders so a concurrent build-release cannot clean that
      # directory mid-bundle.
      mutex: "sdk-nuxt-dist"

  dev:
    command: "pnpm run dev"
    deps:
      - "sdk-nuxt:build"
    options:
      persistent: true
      runInCI: false

  start:
    command: "pnpm run start"
    deps:
      - "build"
    options:
      persistent: true
      runInCI: false

