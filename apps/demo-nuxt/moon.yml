id: "demo-nuxt"
language: "typescript"
layer: "application"
stack: "frontend"
dependsOn:
  - "components"
  - "design-tokens"
  - "sdk-nuxt"
  - "shared-component-styles"

tasks:
  lint:
    command: "corepack pnpm exec oxlint ."
    deps:
      - "sdk-nuxt:build"

  typecheck:
    command: "corepack pnpm run typecheck"
    deps:
      - "sdk-nuxt:build"

  build:
    command: "corepack pnpm run build"
    deps:
      - "sdk-nuxt:build"
    outputs:
      - ".output/**/*"

  dev:
    command: "corepack pnpm run dev"
    deps:
      - "sdk-nuxt:build"
    options:
      persistent: true
      runInCI: false

  start:
    command: "corepack pnpm run start"
    deps:
      - "build"
    options:
      persistent: true
      runInCI: false

