id: "demo-nuxt"
language: "typescript"
layer: "application"
stack: "frontend"
dependsOn:
  - "components"
  - "design-tokens"
  - "sdk-nuxt"

workspace:
  inheritedTasks:
    # A demo app with no unit tests; demo-nuxt-e2e covers it.
    exclude:
      - "test"

tasks:
  typecheck:
    deps:
      - "sdk-nuxt:build"

  build:
    deps:
      - "sdk-nuxt:build"
    outputs:
      - ".output/**/*"
    options:
      # Replaces the inherited dist/**/* rather than adding to it.
      mergeOutputs: "replace"
      # Reads sdk-nuxt/dist while bundling; shares the mutex with the
      # sdk-nuxt builders so a concurrent build-release cannot clean that
      # directory mid-bundle.
      mutex: "sdk-nuxt-dist"

  dev:
    command: "corepack pnpm run dev"
    deps:
      - "sdk-nuxt:build"
    options:
      persistent: true
      runInCI: false

  start:
    command: "corepack pnpm run start"
    deps:
      - "build"
    options:
      persistent: true
      runInCI: false

