id: "console-e2e"
language: "typescript"
layer: "automation"
stack: "frontend"
dependsOn:
  - "console"
  - "testing"

tasks:
  lint:
    command: "corepack pnpm exec oxlint ."

  e2e:
    command: "corepack pnpm exec playwright test"
    deps:
      - "console:build"
    options:
      runInCI: false

  # Live console resource coverage through the Vite server-side API proxy.
  # Boots one ephemeral real Zitadel instance shared by Playwright workers.
  e2e-real:
    command: "corepack pnpm exec playwright test --config playwright.real.config.mts"
    deps:
      - "testing:build"
      - "cli:build"
      - "server:build"
      - "console:build"
    env:
      # A fixed pin, deliberately outside the deferred-bind blocks
      # (22000-23999 journey runner / 24000-31999 embedded-pg — doctrine in
      # apps/cli-journey-e2e/scripts/ports.mjs): withZitadel() needs the port
      # while the Playwright config evaluates (readiness URL; workers
      # re-evaluate the config), and those blocks are dynamically scanned
      # reservation domains where a static tenant can be reserved out from
      # under this lane between config evaluation and server bind. 8093 is
      # below the default ephemeral ranges on our supported runners, so the
      # outbound source-port steals the blocks guard against cannot hit it;
      # the only collider is an explicit listener — typically this lane's
      # own orphan from an aborted run, which fails loud by design (sweep:
      # `moon run workspace:cli -- stop --all`).
      # Neighbors: 8092 demo-next-e2e e2e-real, 8094 console dev-real.
      REAL_ZITADEL_PORT: "8093"
      ZITADEL_SERVER_BINARY: "$workspaceRoot/dist/server/nextgen"
      # Vite serves the console and proxies its API requests. The binary
      # embeds the /ui/* surfaces, but this suite must exercise the
      # Vite-served console, so keep both server surfaces off.
      NEXTGEN_SERVER_LOGIN_ENABLED: "false"
      NEXTGEN_SERVER_CONSOLE_ENABLED: "false"
    options:
      cache: false
      runInCI: false

  # The embedded surfaces, served by the binary itself — no Vite, no proxy.
  # The other two lanes each hide the production path: `e2e` serves a preview
  # build with no backend, `e2e-real` goes through the dev proxy that rewrites
  # /api -> /. This is the only lane where the console's API base and the Go
  # mux's routing table have to agree (Console ADR 0002 §4).
  e2e-embedded:
    command: "corepack pnpm exec playwright test --config playwright.embedded.config.mts"
    deps:
      - "testing:build"
      - "cli:build"
      # Embeds the current console and login-ui dists (server:build deps), so
      # the suite always drives the working tree's UI.
      - "server:build"
    env:
      # Fixed pin, same reasoning as REAL_ZITADEL_PORT above (withZitadel needs
      # the port at config-evaluation time). Neighbors: 8092 demo-next-e2e
      # e2e-real, 8093 console-e2e e2e-real, 8094 console dev-real.
      EMBEDDED_ZITADEL_PORT: "8095"
      ZITADEL_SERVER_BINARY: "$workspaceRoot/dist/server/nextgen"
      # Both surfaces stay on (the server defaults): they are what this lane
      # tests. Contrast e2e-real above, which switches them off.
    options:
      cache: false
      runInCI: false
