id: "docs"
language: "typescript"
layer: "application"
stack: "frontend"

tasks:
  generate-openapi:
    command: "pnpm run generate:openapi"
    inputs:
      - "/api/openapi/**/*.yaml"
      - "scripts/bundle-openapi.mjs"
    outputs:
      - ".generated/openapi.yaml"
      - ".generated/openapi.json"
      - ".generated/openapi.mjs"

  generate:
    command: "pnpm run generate"
    inputs:
      - "/api/openapi/**/*.yaml"
      - "content/**/*"
      - "source.config.ts"
      - "scripts/bundle-openapi.mjs"
    outputs:
      - ".generated/openapi.yaml"
      - ".generated/openapi.json"
      - ".generated/openapi.mjs"
      - ".source/**/*"

  typecheck:
    command: "pnpm exec tsc --noEmit -p tsconfig.json"
    deps:
      - "generate"

  build:
    command: "pnpm exec waku build"
    deps:
      - "generate"
    outputs:
      - "dist/**/*"

  dev:
    command: "pnpm exec waku dev --port 3003"
    deps:
      - "generate"
    options:
      persistent: true
      runInCI: false

  preview:
    command: "pnpm run preview"
    deps:
      - "build"
    options:
      persistent: true
      runInCI: false
