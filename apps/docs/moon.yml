id: "docs"
language: "typescript"
layer: "application"
stack: "frontend"
dependsOn:
  - "api"

workspace:
  inheritedTasks:
    # No unit tests; the site is checked by `typecheck` and `build`.
    exclude:
      - "test"

tasks:
  # Bundles api/openapi into .generated/, which lib/openapi.ts imports, with
  # its error codes, which lib/error-reference.ts imports, and the CLI's
  # command reference, which lib/cli-reference.ts imports. The
  # content needs no generation step: lib/source.ts defines its collection
  # with Fumadocs MDX's macro.
  generate:
    command: "corepack pnpm run generate"
    inputs:
      - "**/*"
      - "/apps/api/api/openapi/**/*.yaml"
      # The bundle applies the repo's Redocly config.
      - "/redocly.yaml"
      # Written by the CLI's reference test from its command table.
      - "/apps/cli/command-reference.json"
      # Written by Changesets on every release: the release notes.
      - "/apps/cli/CHANGELOG.md"
    outputs:
      - ".generated/openapi.mjs"
      - ".generated/openapi.d.mts"
      - ".generated/errors.mjs"
      - ".generated/errors.d.mts"
      - ".generated/cli.mjs"
      - ".generated/cli.d.mts"

  typecheck:
    deps:
      - "generate"
      # The API reference's TypeScript samples compile against the client
      # (scripts/sdk-samples.ts, tsconfig.samples.json), whose endpoints this
      # generates from the same spec.
      - "api:generate"
    inputs:
      # Declaring inputs drops the default project folder, so it is restated.
      - "**/*"
      # The client's runtime, which the samples call too.
      - "/packages/api/src/**/*"

  build:
    command: "corepack pnpm exec next build"
    deps:
      # After typecheck, never beside it: `next build` empties .next/types and
      # fills it again, and tsc reads the route types there (next-env.d.ts
      # imports .next/types/routes.d.ts), so side by side typecheck failed
      # with TS2304 on PageProps, LayoutProps and RouteContext. The build is
      # the one that waits: it takes longer, and fails on a type error anyway.
      # An edge, not a mutex: moon holds a mutex only while the command runs,
      # not while it restores or archives .next.
      - "typecheck"
      # Listed here and not only reached through typecheck: typecheck has no
      # outputs, so moon would not hash generate through it.
      - "generate"
      # app/global.css imports the design tokens' CSS variables.
      - "design-tokens:generate"
    outputs:
      - ".next/**/*"
    options:
      # Runs next directly (generation is the `generate` dep), replacing the
      # inherited `pnpm run build` arguments rather than adding to them.
      mergeArgs: "replace"
      # Replaces the inherited dist/**/* rather than adding to it.
      mergeOutputs: "replace"

  dev:
    command: "corepack pnpm exec next dev --port 3003"
    deps:
      - "generate"
      - "design-tokens:generate"
    options:
      persistent: true
      runInCI: false

  start:
    command: "corepack pnpm exec next start --port 3003"
    deps:
      - "build"
    options:
      persistent: true
      runInCI: false

  # The site's contract suite (tests/, playwright.config.mts): the index and
  # every page it lists, as HTML and as Markdown, the search, the MCP server,
  # the assets. Opt-in like every e2e lane; Playwright serves the build on
  # port 3003, or reuses `moon run docs:start`.
  e2e:
    command: "corepack pnpm exec playwright test"
    deps:
      - "build"
    options:
      cache: false
      runInCI: false

  # The same suite against a deployment of the hosted cloud, which CLOUD_URL
  # names (playwright.deployment.config.mts; VERCEL_AUTOMATION_BYPASS_SECRET
  # opens its protection). The root's `pnpm check:cloud` runs it beside every
  # other deployment suite, and .github/workflows/deployment-checks.yml runs
  # it for every deployment. The config refuses to run without CLOUD_URL.
  e2e-deployment:
    command: "corepack pnpm exec playwright test --config playwright.deployment.config.mts"
    options:
      cache: false
      runInCI: false
