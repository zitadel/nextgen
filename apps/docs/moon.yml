id: "docs"
language: "typescript"
layer: "application"
stack: "frontend"

tasks:
  generate-openapi:
    command: "corepack pnpm run generate-openapi"
    inputs:
      - "package.json"
      - "/api/openapi/**/*.yaml"
      - "scripts/bundle-openapi.mjs"
      # The redocly version (the catalog pin).
      - "/pnpm-workspace.yaml"
    outputs:
      - ".generated/openapi.yaml"
      - ".generated/openapi.json"
      - ".generated/openapi.mjs"

  generate:
    command: "corepack pnpm run generate"
    deps:
      - "generate-openapi"
    inputs:
      - "package.json"
      - "content/**/*"
      - "source.config.ts"
    outputs:
      - ".source/**/*"

  typecheck:
    command: "corepack pnpm run typecheck"
    deps:
      - "generate"

  build:
    command: "corepack pnpm run build"
    deps:
      - "generate"
    inputs:
      - "**/*"
      # waku picks its adapter from VERCEL, so a Vercel build is never
      # restored from a local-adapter cache (or the reverse).
      - "$VERCEL"
    outputs:
      - "dist/**/*"

  dev:
    command: "corepack pnpm run dev"
    deps:
      - "generate"
    options:
      persistent: true
      runInCI: false

  preview:
    command: "corepack pnpm run preview"
    deps:
      - "build"
    options:
      persistent: true
      runInCI: false
