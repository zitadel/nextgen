id: "docs"
language: "typescript"
layer: "application"
stack: "frontend"
dependsOn:
  - "design-tokens"

workspace:
  inheritedTasks:
    # No unit tests; the site is checked by `typecheck` and `build`.
    exclude:
      - "test"

tasks:
  generate-openapi:
    command: "corepack pnpm run generate-openapi"
    inputs:
      - "**/*"
      - "/api/openapi/**/*.yaml"
    outputs:
      - ".generated/openapi.yaml"
      - ".generated/openapi.json"
      - ".generated/openapi.mjs"

  generate:
    command: "corepack pnpm run generate"
    deps:
      - "generate-openapi"
    outputs:
      - ".source/**/*"

  typecheck:
    deps:
      - "generate"

  build:
    deps:
      # src/app.css imports @zitadel/design-tokens/css/tokens.css.
      - "design-tokens:build"
      - "generate"
    inputs:
      - "**/*"
      # waku picks its adapter from VERCEL, so a Vercel build is never
      # restored from a local-adapter cache (or the reverse).
      - "$VERCEL"

  dev:
    command: "corepack pnpm run dev"
    deps:
      - "design-tokens:build"
      - "generate"
    options:
      persistent: true
      runInCI: false

  preview:
    command: "corepack pnpm run preview"
    deps:
      - "build"
    options:
      persistent: true
      runInCI: false
