id: "demo-nuxt-e2e"
language: "typescript"
layer: "automation"
stack: "frontend"
dependsOn:
  - "api-mock"
  - "demo-nuxt"

tasks:
  # No workspace build deps: the specs only import @playwright/test — the
  # api-mock and demo-nuxt dependencies are dev-server commands, not types.
  typecheck:
    command: "corepack pnpm run typecheck"

  # The suite runs api-mock's `start` and demo-nuxt's `dev`, so it needs what
  # those need rather than a production build of the demo.
  e2e:
    command: "corepack pnpm run e2e"
    deps:
      - "api-mock:build"
      - "sdk-nuxt:build"
    options:
      runInCI: false
