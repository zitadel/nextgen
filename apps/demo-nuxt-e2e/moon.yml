id: "demo-nuxt-e2e"
language: "typescript"
layer: "automation"
stack: "frontend"
dependsOn:
  - "api-mock"
  - "demo-nuxt"

workspace:
  inheritedTasks:
    # An e2e suite: nothing to build, and its specs run through the `e2e` task.
    exclude:
      - "build"
      - "test"

tasks:

  e2e:
    command: "corepack pnpm exec playwright test"
    deps:
      - "api-mock:build"
      - "demo-nuxt:build"
    options:
      runInCI: false
