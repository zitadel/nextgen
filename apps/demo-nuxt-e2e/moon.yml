id: "demo-nuxt-e2e"
language: "typescript"
layer: "automation"
stack: "frontend"
dependsOn:
  - "api-mock"
  - "demo-nuxt"

tasks:
  # No workspace build deps: the specs only import @playwright/test — the
  # api-mock and demo-nuxt dependencies are dev-server commands, not types.
  typecheck:
    command: "corepack pnpm run typecheck"

  e2e:
    command: "corepack pnpm exec playwright test"
    deps:
      - target: "api-mock:build"
        cacheStrategy: "hash"
      - "demo-nuxt:build"
    options:
      runInCI: false
