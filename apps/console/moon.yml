id: "console"
language: "typescript"
layer: "application"
stack: "frontend"
dependsOn:
  - "api"
  - "design-tokens"
  - "sdk-react"
  - "ui-react"

tasks:
  lint:
    command: "corepack pnpm exec oxlint ."
    deps:
      - "api:generate"
      - "design-tokens:build"
      - "sdk-react:build"
      - "ui-react:build"

  typecheck:
    command: "corepack pnpm run typecheck"
    deps:
      - "api:build"
      - "design-tokens:build"
      - "sdk-react:build"
      - "ui-react:build"

  build:
    command: "corepack pnpm run build"
    deps:
      - "api:build"
      - "design-tokens:build"
      - "sdk-react:build"
      - "ui-react:build"
    outputs:
      - "/internal/staticui/console/dist/**/*"

  build-release:
    command: "corepack pnpm run build"
    deps:
      - "api:build-release"
      - "design-tokens:build"
      - "sdk-react:build"
      - "ui-react:build"
    outputs:
      - "/internal/staticui/console/dist/**/*"
    options:
      cache: false
      # Release UI builds consume package release output and run from the later
      # release step instead of the normal `moon ci` build/test graph.
      runInCI: false

  test:
    command: "corepack pnpm run test"
    deps:
      - "build"

  dev:
    command: "corepack pnpm run dev"
    options:
      persistent: true
      runInCI: false

  # Real-data dev loop: boots a seeded ephemeral instance, then the dev server
  # against it. The console manages an instance, so its list screens are only
  # meaningful against a real backend (see scripts/dev-real.mts). The script
  # runs `moon run server:build` itself; a task dep on it here would cycle the
  # project graph, because server:build depends on console:build.
  dev-real:
    command: "corepack pnpm run dev:real"
    options:
      persistent: true
      runInCI: false

  preview:
    command: "corepack pnpm run preview"
    deps:
      - "build"
    options:
      persistent: true
      runInCI: false
