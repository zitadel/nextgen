id: "console"
language: "typescript"
layer: "application"
stack: "frontend"
dependsOn:
  - "design-tokens"
  - "ui-react"

tasks:
  lint:
    command: "corepack pnpm exec oxlint ."
    deps:
      - "design-tokens:build"
      - "ui-react:build"

  typecheck:
    command: "corepack pnpm run typecheck"
    deps:
      - "design-tokens:build"
      - "ui-react:build"

  build:
    command: "corepack pnpm run build"
    deps:
      - "design-tokens:build"
      - "ui-react:build"
    outputs:
      - "/internal/staticui/console/dist/**/*"

  test:
    command: "corepack pnpm run test"
    deps:
      - "build"

  dev:
    command: "corepack pnpm run dev"
    options:
      persistent: true
      runInCI: false

  preview:
    command: "corepack pnpm run preview"
    deps:
      - "build"
    options:
      persistent: true
      runInCI: false
