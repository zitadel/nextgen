id: "console"
language: "typescript"
layer: "application"
stack: "frontend"
dependsOn:
  - "api"
  - "design-tokens"
  - "sdk-react"

tasks:
  typecheck:
    deps:
      - "sdk-react:build"

  build:
    deps:
      - "sdk-react:build"
    inputs:
      # Declaring inputs drops the default project folder, so it is restated.
      - "**/*"
      # The hosted cloud's build bakes its base path, Vercel's insights and
      # their sample rate in (vite.config.ts, src/vite-env.d.ts), so the
      # variables are part of the cache key: that build is never restored into
      # the server's embedded console, or the reverse.
      - "$CONSOLE_BASE_PATH"
      - "$CONSOLE_VERCEL_INSIGHTS"
      - "$CONSOLE_SPEED_INSIGHTS_SAMPLE_RATE"
    outputs:
      - "/internal/staticui/console/dist/**/*"
    options:
      # Replaces the inherited dist/**/* rather than adding to it.
      mergeOutputs: "replace"

  build-release:
    command: "corepack pnpm run build"
    # The build bundles the dist of sdk-react and components (neither has an
    # `@zitadel/source` entry), so it waits for their release builds;
    # sdk-react's reaches components'. Never a dev build here: in pack and
    # publish it would run after the release builds and rewrite the packed dist.
    deps:
      - "sdk-react:build-release"
    outputs:
      - "/internal/staticui/console/dist/**/*"
    options:
      cache: false
      # Release UI builds consume package release output and run from the later
      # release step instead of the normal `moon ci` build/test graph.
      runInCI: false

  test:
    deps:
      - "build"

  # The same deps as build: sdk-react has no `@zitadel/source` entry, so the
  # dev server loads its dist.
  dev:
    command: "corepack pnpm run dev"
    deps:
      - "sdk-react:build"
    options:
      persistent: true
      runInCI: false

  # Real-data dev loop: boots a seeded ephemeral instance, then the dev server
  # against it. The console manages an instance, so its list screens are only
  # meaningful against a real backend (see scripts/dev-real.mts). The script
  # runs `moon run server:build` itself; a task dep on it here would cycle the
  # project graph, because server:build depends on console:build.
  dev-real:
    command: "corepack pnpm run dev:real"
    # The built `zitadel` CLI the instance boots through.
    deps:
      - "cli:build"
    options:
      persistent: true
      runInCI: false

  # The claim page is the console acting as the *platform's* claim surface, not
  # as a project's admin console, so it needs the platform project that
  # `dev-real` deliberately does not boot. Opt-in for that one screen; every
  # other screen is better served by `dev-real`.
  dev-claim:
    command: "corepack pnpm run dev:claim"
    deps:
      - "cli:build"
    options:
      persistent: true
      runInCI: false

  preview:
    command: "corepack pnpm run preview"
    deps:
      - "build"
    options:
      persistent: true
      runInCI: false
