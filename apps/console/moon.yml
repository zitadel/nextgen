id: "console"
language: "typescript"
layer: "application"
stack: "frontend"
dependsOn:
  - "api"
  - "design-tokens"
  - "ui-react"

tasks:
  lint:
    command: "corepack pnpm exec oxlint ."
    deps:
      - "api:generate"
      - "design-tokens:build"
      - "ui-react:build"

  typecheck:
    command: "corepack pnpm run typecheck"
    deps:
      - "api:build"
      - "design-tokens:build"
      - "ui-react:build"

  build:
    command: "corepack pnpm run build"
    deps:
      - "api:build"
      - "design-tokens:build"
      - "ui-react:build"
    outputs:
      - "/internal/staticui/console/dist/**/*"

  build-release:
    command: "corepack pnpm run build"
    deps:
      - "api:build-release"
      - "design-tokens:build"
      - "ui-react:build"
    outputs:
      - "/internal/staticui/console/dist/**/*"
    options:
      cache: false
      # Release UI builds consume package release output and run from the later
      # release step instead of the normal `moon ci` build/test graph.
      runInCI: false

  test:
    command: "corepack pnpm run test"
    deps:
      - "build"

  dev:
    command: "corepack pnpm run dev"
    options:
      persistent: true
      runInCI: false

  preview:
    command: "corepack pnpm run preview"
    deps:
      - "build"
    options:
      persistent: true
      runInCI: false
