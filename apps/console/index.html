<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zitadel Console</title>
    <!-- The hosted cloud's favicons, which the website serves at /favicons/
         (apps/website/AGENTS.md), linked as the website links them.
         Off the cloud nothing serves /favicons/, as nothing serves
         /favicon.ico. -->
    <link rel="shortcut icon" href="/favicons/light/favicon.ico" type="image/x-icon" media="(prefers-color-scheme: light)" />
    <link rel="shortcut icon" href="/favicons/dark/favicon.ico" type="image/x-icon" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicons/light/favicon-16x16.png" sizes="16x16" type="image/png" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicons/light/favicon-32x32.png" sizes="32x32" type="image/png" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicons/light/favicon.ico" type="image/x-icon" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicons/dark/favicon-16x16.png" sizes="16x16" type="image/png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicons/dark/favicon-32x32.png" sizes="32x32" type="image/png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicons/dark/favicon.ico" type="image/x-icon" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/favicons/light/apple-touch-icon.png" sizes="180x180" type="image/png" media="(prefers-color-scheme: light)" />
    <link rel="apple-touch-icon" href="/favicons/dark/apple-touch-icon.png" sizes="180x180" type="image/png" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the stored/system theme before paint to avoid a flash of the
      // wrong theme. Kept in sync afterwards by src/theme.ts.
      (() => {
        try {
          var pref = localStorage.getItem("zl-console-theme") || "system";
          var resolved =
            pref === "system"
              ? window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark"
              : pref;
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
