id: "cloud-functions"
language: "typescript"
layer: "application"
stack: "backend"

tasks:
  # lint and test are the inherited tasks unchanged.
  typecheck:
    deps:
      # After the build, never beside it, for apps/website/moon.yml's reason:
      # `next build` empties .next/types and fills it again, and tsc reads it.
      - "build"

  build:
    outputs:
      - ".next/**/*"
      # `next dev`'s own folder, which is no part of the build; its links into
      # node_modules would fail the remote cache's manifest.
      - "!.next/dev/**/*"
    options:
      # Replaces the inherited dist/**/* rather than adding to it.
      mergeOutputs: "replace"

  dev:
    command: "corepack pnpm run dev"
    env:
      # The Zitadel server the sign-in widget's calls go on to (src/sign-in.ts).
      # Deployed, it answers on the functions' own origin. Here the functions
      # sit behind the console's dev proxy, so that origin is their own, and
      # the server is the instance `console:dev-real` boots on its default
      # port (CONSOLE_DEV_ZITADEL_PORT). A value exported in the shell wins.
      CLOUD_ZITADEL_URL: "http://localhost:8094"
    options:
      persistent: true
      runInCI: false
